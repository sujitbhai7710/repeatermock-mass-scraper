name: Scrape RepeaterMock (Full Matrix)

on:
  workflow_dispatch:
    inputs:
      max_tests_per_job:
        description: 'Max tests per job (empty = unlimited, scrapes ALL free tests)'
        required: false
        default: ''
  schedule:
    - cron: '0 0,6,12,18 * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: scrape-full-matrix
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 335
    strategy:
      fail-fast: false
      max-parallel: 20  # Run up to 20 jobs in parallel (GitHub free tier limit)
      matrix:
        include:
          # === SSC PYP Series (2000+ free tests each) ===
          - job_name: "Maths-PYP"
            series: "https://repeatermock.com/tb/test-series/ssc-maths-previous-year-questions"
            workers: "4"
          - job_name: "Reasoning-PYP"
            series: "https://repeatermock.com/tb/test-series/ssc-reasoning-previous-year-questions"
            workers: "4"
          - job_name: "English-PYP"
            series: "https://repeatermock.com/tb/test-series/ssc-english-previous-year-questions"
            workers: "4"
          - job_name: "GK-PYP"
            series: "https://repeatermock.com/tb/test-series/ssc-gk-previous-year-questions"
            workers: "4"
          # === SSC Main Series (2026) ===
          - job_name: "SSC-CGL-2026"
            series: "https://repeatermock.com/tb/test-series/ssc-cgl"
            workers: "4"
          - job_name: "SSC-CHSL-2026"
            series: "https://repeatermock.com/tb/test-series/ssc-chsl"
            workers: "4"
          - job_name: "SSC-MTS-2026"
            series: "https://repeatermock.com/tb/test-series/ssc-mts"
            workers: "4"
          - job_name: "SSC-GD-2026"
            series: "https://repeatermock.com/tb/test-series/ssc-gd-constable"
            workers: "4"
          - job_name: "SSC-CPO-2026"
            series: "https://repeatermock.com/tb/test-series/ssc-cpo"
            workers: "4"
          - job_name: "SSC-Steno-2026"
            series: "https://repeatermock.com/tb/test-series/ssc-stenographer"
            workers: "4"
          - job_name: "SSC-SelPost-2026"
            series: "https://repeatermock.com/tb/test-series/ssc-selection-post"
            workers: "4"
          # === SSC Previous Year Series (2025) ===
          - job_name: "SSC-CHSL-2025"
            series: "https://repeatermock.com/tb/test-series/ssc-chsl-previous"
            workers: "4"
          - job_name: "SSC-CPO-2025"
            series: "https://repeatermock.com/tb/test-series/ssc-cpo-previous"
            workers: "4"
          - job_name: "SSC-MTS-2025"
            series: "https://repeatermock.com/tb/test-series/ssc-mts-previous"
            workers: "4"
          # === RRB Series ===
          - job_name: "RRB-Group-D"
            series: "https://repeatermock.com/tb/test-series/rrb-group-d"
            workers: "4"
          - job_name: "RRB-NTPC-UG"
            series: "https://repeatermock.com/tb/test-series/rrb-ntpc-ug"
            workers: "4"
          - job_name: "RRB-NTPC-Grad"
            series: "https://repeatermock.com/tb/test-series/rrb-ntpc"
            workers: "4"
          - job_name: "RRB-ALP-2026"
            series: "https://repeatermock.com/tb/test-series/rrb-alp"
            workers: "4"
          - job_name: "RRB-Tech-2026"
            series: "https://repeatermock.com/tb/test-series/rrb-technician"
            workers: "4"
          - job_name: "RRB-Tech-Prev"
            series: "https://repeatermock.com/tb/test-series/rrb-technician-previous"
            workers: "4"
          - job_name: "RRB-ALP-Prev"
            series: "https://repeatermock.com/tb/test-series/rrb-alp-previous"
            workers: "4"
          - job_name: "RRB-Tech-Gr1"
            series: "https://repeatermock.com/tb/test-series/rrb-technician-grade-1"
            workers: "4"

    name: ${{ matrix.job_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run scraper for ${{ matrix.job_name }}
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          MAX_TESTS_ARG=""
          if [ -n "${{ github.event.inputs.max_tests_per_job }}" ]; then
            MAX_TESTS_ARG="--stop-after ${{ github.event.inputs.max_tests_per_job }}"
          fi

          # Each job writes to its OWN directory — no overlap, no git race
          JOB_DIR="scraped_output/${{ matrix.job_name }}"

          python3 repeatermock_scraper.py \
            --series-url "${{ matrix.series }}" \
            --output-dir "$JOB_DIR" \
            --workers ${{ matrix.workers }} \
            --max-runtime 320 \
            $MAX_TESTS_ARG || true

      - name: Commit ${{ matrix.job_name }} results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          JOB_DIR="scraped_output/${{ matrix.job_name }}"
          if [ -d "$JOB_DIR" ]; then
            git add "$JOB_DIR/" -f
            git commit -m "scrape: ${{ matrix.job_name }} $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "Nothing to commit"
            git pull --rebase origin main || true
            git push origin HEAD || echo "Push failed (will retry)"
            sleep 3
            git pull --rebase origin main || true
            git push origin HEAD || echo "Push failed"
          fi

  # Merge job — runs AFTER all scrape jobs complete
  merge:
    needs: scrape
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install playwright

      - name: Generate combined index + database
        run: |
          # Merge all job directories into ai_export/ and html_export/ at top level
          for dir in scraped_output/*/; do
            job=$(basename "$dir")
            if [ "$job" != "database" ] && [ "$job" != "html_export" ] && [ "$job" != "ai_export" ]; then
              # Copy ai_export files
              if [ -d "$dir/ai_export" ]; then
                mkdir -p scraped_output/ai_export
                cp -r "$dir/ai_export/"* scraped_output/ai_export/ 2>/dev/null || true
              fi
              # Copy html_export files
              if [ -d "$dir/html_export" ]; then
                mkdir -p scraped_output/html_export
                cp -r "$dir/html_export/"* scraped_output/html_export/ 2>/dev/null || true
              fi
            fi
          done
          # Generate index from all ai_export files
          python3 generate_index.py --output-dir scraped_output || true
          # Generate chapter-wise database
          python3 build_database.py --output-dir scraped_output || true

      - name: Commit merged results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scraped_output/ -f
          git commit -m "merge: combined index + database $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "Nothing to commit"
          git pull --rebase origin main || true
          git push origin HEAD
