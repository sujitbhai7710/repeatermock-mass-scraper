name = "rm-scraper-trigger"
main = "src/index.js"
compatibility_date = "2024-09-25"

# Secrets to set via `wrangler secret put`:
#   GH_PAT          — GitHub Classic PAT (repo+workflow scope) for triggering workflow_dispatch
#   TRIGGER_TOKEN   — bearer token checked against incoming requests (matches CF_TRIGGER_TOKEN in repo secret)
#
# Set them with:
#   wrangler secret put GH_PAT
#   wrangler secret put TRIGGER_TOKEN
