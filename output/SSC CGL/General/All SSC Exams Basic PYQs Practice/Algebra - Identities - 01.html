<script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},svg:{fontCache:'global'},options:{skipHtmlTags:['script','noscript','style','textarea','pre','code']}};const QUESTIONS=[{"text": "<p>Solve the following</p>\n\n<p>113 × 87 = ?</p>\n", "options": ["10169", "9831", "10000", "10026"], "correct": 2, "solution": "<p>113 × 87</p>\n\n<p>⇒ (100 + 13) (100 – 13)</p>\n\n<p>⇒ 100<sup>2</sup> - 13<sup>2</sup></p>\n\n<p>⇒ 10000 – 169</p>\n\n<p>⇒ 9831</p>\n", "marks": 2, "negMarks": 0.5}, {"text": "The value of 97 × 103 is ______.", "options": ["<font style=\"vertical-align: inherit;\"><font style=\"vertical-align: inherit;\">7999</font></font>", "<font style=\"vertical-align: inherit;\"><font style=\"vertical-align: inherit;\">9991</font></font>", "<font style=\"vertical-align: inherit;\"><font style=\"vertical-align: inherit;\">8991</font></font>", "<font style=\"vertical-align: inherit;\"><font style=\"vertical-align: inherit;\">9981</font></font>"], "correct": 2, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;97&amp;nbsp;&amp;times; 103 =?&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&lt;span style=&quot;&quot;&gt;Calculations:&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;According to the question,&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; 97&amp;nbsp;&amp;times; 103 = 9991&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&lt;span style=&quot;&quot;&gt;&amp;there4;&amp;nbsp;The value of 97&amp;nbsp;&amp;times; 103 is 9991.&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&lt;span style=&quot;&quot;&gt;&lt;span style=&quot;display: flex;gap: 6px;align-items: center;&quot;&gt;&lt;img height=&quot;26px&quot; src=&quot;https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png&quot; width=&quot;26px&quot; /&gt;&lt;strong&gt;&lt;span style=&quot;vertical-align: middle;font-size: 21px;&quot;&gt;&lt;u&gt;Alternate Method&lt;/u&gt;&lt;/span&gt;&lt;/strong&gt;&lt;/span&gt;&lt;/span&gt;&lt;/strong&gt;&lt;strong&gt;&lt;span style=&quot;&quot;&gt;&lt;span style=&quot;display: flex;gap: 6px;align-items: center;&quot;&gt;&lt;strong&gt;&lt;strong style=&quot;font-family: var(--bs-body-font-family); font-size: var(--bs-body-font-size); text-align: var(--bs-body-text-align);&quot;&gt;(a - b)(a + b) = (a&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;- b&lt;sup&gt;2&lt;/sup&gt;)&lt;/strong&gt;&lt;/strong&gt;&lt;/span&gt;&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;97&amp;nbsp;&amp;times; 103 = (100 - 3)(100 + 3) = 100&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;- 3&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= 10000 - 9 = 9991&lt;/span&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If <span class=\"math-tex\">\\(K + \\frac{1}{K} = 3 \\)</span>, then what is the value of <span class=\"math-tex\">\\({k^2} + \\frac{1}{{{k^2}}}\\)</span>?", "options": ["9", "6", "7", "5"], "correct": 3, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(K + \\frac{1}{K} = 3 \\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Formula used:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;(a + b)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= a&lt;sup&gt;2&amp;nbsp;&lt;/sup&gt;+ 2ab + b&lt;sup&gt;2&lt;/sup&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;Let us square both sides:&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\((K + \\frac{1}{K} )^2\\)&lt;/span&gt;&amp;nbsp;= 3&lt;sup&gt;2&lt;/sup&gt;&lt;/p&gt;\n\n&lt;p&gt;k&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ (2&amp;nbsp;&amp;times; k&amp;nbsp;&amp;times;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(1 \\over k\\)&lt;/span&gt;) +&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(1 \\over k^2\\)&lt;/span&gt;&amp;nbsp;= 9&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;k&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ 2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;+&amp;nbsp;&lt;/span&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(1 \\over k^2\\)&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;= 9&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;k&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+&amp;nbsp;&lt;/span&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(1 \\over k^2\\)&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;= 9 - 2&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;k&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+&lt;/span&gt;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(1 \\over k^2\\)&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;= 7&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&lt;span style=&quot;color: rgb(102, 102, 102);  &quot;&gt;&amp;there4; The value of&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;k&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\bf 1 \\over k^2\\)&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp; is 7.&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If x + <span class=\"math-tex\">\\({{1} \\over x}\\)</span> = 2, then x<sup>3</sup> +  <span class=\"math-tex\">\\({{1} \\over x^{3}}\\)</span>=?", "options": ["1", "8", "2", "0"], "correct": 3, "solution": "&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;Given:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;&quot;&gt;x +&amp;nbsp;&lt;/span&gt;&lt;span class=&quot;math-tex&quot;&gt;\\({{1} \\over x}\\)&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;= 2&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;Formula Used:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;&quot;&gt;x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+&amp;nbsp;&amp;nbsp;&lt;/span&gt;&lt;span class=&quot;math-tex&quot;&gt;\\({{1} \\over x^{3}}\\)&lt;/span&gt;&lt;span style=&quot;&quot;&gt;= a&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;- 3a&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;Calculations:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; x +&amp;nbsp;&lt;/span&gt;&lt;span class=&quot;math-tex&quot;&gt;\\({{1} \\over x}\\)&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;= 2&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;here, a = 2&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;&quot;&gt;Now put the value of a in the formula&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+&amp;nbsp;&amp;nbsp;&lt;/span&gt;&lt;span class=&quot;math-tex&quot;&gt;\\({{1} \\over x^{3}}\\)&lt;/span&gt;&lt;span style=&quot;&quot;&gt;= a&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;- 3a = (2)&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;- 3(2) = 8 - 6 = 2&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;&quot;&gt;&lt;strong&gt;&amp;rArr;&amp;nbsp;&lt;/strong&gt;&lt;strong&gt;Hence, Value of the above equation&amp;nbsp;is 2&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "The value of x<sup>2</sup> + y<sup>2</sup> when x = 1, y = 2 is:", "options": ["5", "4", "2", "1"], "correct": 1, "solution": "<p><strong>Calculation</strong></p>\n\n<p>⇒ x<span style=\"position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;\">2</span> + y<span style=\"position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;\">2</span></p>\n\n<p><span style=\"color: rgb(33, 37, 41);\">⇒ 1<sup>2</sup> + 2<sup>2</sup></span></p>\n\n<p><span style=\"color: rgb(33, 37, 41);\">⇒ 1 + 4 = 5</span></p>\n\n<p><strong><span style=\"color: rgb(33, 37, 41);\">The value is 5.</span></strong></p>\n", "marks": 2, "negMarks": 0.5}, {"text": "The value of 95 × 105 is:", "options": ["9981", "9935", "9965", "9975"], "correct": 4, "solution": "<p><span style=\"font-weight: 700;\">Calculation:</span></p>\n\n<p><span style=\"\">The value of 95 × 105</span></p>\n\n<p><span style=\"\">⇒ 9975</span></p>\n\n<p><strong><span style=\"font-weight: 700; \">∴ </span><span style=\"\">The value of 95 × 105 is 9975.</span></strong></p>\n", "marks": 2, "negMarks": 0.5}, {"text": "If p = 11, then the value of p(p<sup>2</sup> + 3p + 3) is:", "options": ["1629", "1225", "1727", "1111"], "correct": 3, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;p = 11&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;According to the question,&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;p(p&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ 3p + 3)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;11(11&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ 3&amp;nbsp;&amp;times; 11 + 3)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;11(121&amp;nbsp;+ 33&amp;nbsp;+ 3)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; 11(157) = 1727&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&lt;span style=&quot;&quot;&gt;&amp;there4; The value of given equation is 1727.&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "25a<sup>2</sup> – 9 is factored as: ", "options": ["(5a – 3)<sup>2</sup>", "(5a + 3) (5a – 3)", "(25a + 1) (a – 9)", "(5a + 1) (5a – 9)"], "correct": 2, "solution": "<p>25a<sup>2</sup> – 9</p>\n\n<p>⇒ (5a)<sup>2</sup> – 3<sup>2                                                     </sup></p>\n\n<p>⇒ (5a – 3) (5a + 3)</p>\n\n<p>As we know,</p>\n\n<p>(a<sup>2</sup> – b<sup>2</sup>) = (a – b)(a + b)</p>\n", "marks": 2, "negMarks": 0.5}, {"text": "If <span class=\"math-tex\">\\(x+\\frac{1}{x}=7\\)</span>, find the value of <span class=\"math-tex\">\\(x^3+\\frac{1}{x^3}\\)</span>.", "options": ["<span style=\"\">343</span>", "<span style=\"\">322</span>", "<span style=\"\">340</span>", "<span style=\"\">332</span>"], "correct": 2, "solution": "<p><strong>Given:</strong></p>\n\n<p><span class=\"math-tex\">\\(x+\\frac{1}{x}=7\\)</span></p>\n\n<p><strong>Concept Used:</strong></p>\n\n<p>If a + 1/a = t</p>\n\n<p>a<sup>3</sup> + 1/a<sup>3</sup> = t<sup>3</sup> - 3t</p>\n\n<p><strong>Calculation:</strong></p>\n\n<p><strong><span class=\"math-tex\">\\(x^3+\\frac{1}{x^3} = 7^3 - 3 \\times 7\\)</span></strong></p>\n\n<p>⇒ 343 - 21</p>\n\n<p>⇒ 322</p>\n\n<p><strong>∴ Option 2 is the correct answer.</strong></p>\n", "marks": 2, "negMarks": 0.5}, {"text": "Evaluate 99 × 99 − 1.", "options": ["9900", "9800", "9801", "9899"], "correct": 2, "solution": "<p><strong>FORMULA USED:</strong></p>\n\n<p><strong><span class=\"math-tex\">\\(( a^2 - b^2) = ( a +b) ( a - b)\\)</span></strong> </p>\n\n<p><strong>CALCULATION:</strong></p>\n\n<p>Here, we have 99 × 99 -1</p>\n\n<p>Which can be rewritten as <span class=\"math-tex\">\\(99^2 -1^2\\)</span> in the form of <span class=\"math-tex\">\\(( a^2 - b^2) \\)</span></p>\n\n<p>⇒ Where, a = 99 and b = 1</p>\n\n<p>⇒ <span class=\"math-tex\">\\(( 99 ^2 - 1^2)\\)</span> = ( 99 +1 )( 99 -1) = 100 × 98 = 9800</p>\n\n<p><strong>Hence, the required value is 9800.</strong></p>\n", "marks": 2, "negMarks": 0.5}, {"text": "What is the value of (a + b)<sup>2</sup> - (a - b)<sup>2</sup>?", "options": ["2(a<sup>2</sup> + b<sup>2</sup>)", "4(a<sup>2</sup> + b<sup>2</sup>)", "8ab", "4ab"], "correct": 4, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;The value of (a + b)&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;- (a - b)&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Concept used:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;(a + b)&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;= a&lt;sup&gt;2&lt;/sup&gt; + b&lt;sup&gt;2&lt;/sup&gt; + 2ab&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;(a - b)&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;=&amp;nbsp;a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ b&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;-&amp;nbsp;2ab&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&lt;span style=&quot;&quot;&gt;Calculations:&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;According to the question,&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;(a + b)&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;- (a - b)&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;&lt;/span&gt;= (&lt;span style=&quot;&quot;&gt;a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ b&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ 2ab) - (a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ b&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;-&amp;nbsp;2ab)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ b&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ 2ab&amp;nbsp;- a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;-&amp;nbsp;b&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+&amp;nbsp;2ab&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ b&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;-&amp;nbsp;a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;-&amp;nbsp;b&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+&amp;nbsp;2ab&amp;nbsp;+ 2ab&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; 2ab&amp;nbsp;+ 2ab = 4ab&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&lt;span style=&quot;&quot;&gt;&amp;there4;&amp;nbsp;&lt;/span&gt;The value of (a + b)&lt;span style=&quot;line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;- (a - b)&lt;span style=&quot;line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;is 4ab.&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "(3a - 4b)<sup>3</sup> is equal to:", "options": ["9a<sup>2</sup> - 16b<sup>2</sup>", "27a<sup>3</sup> - 64b<sup>3</sup>", "27a<sup>3</sup> - 64b<sup>3</sup> - 108a<sup>2</sup>b + 144ab<sup>2</sup>", "9a<sup>2</sup> - 24ab + 16b<sup>2</sup>"], "correct": 3, "solution": "<p>(3a - 4b)<sup>3</sup></p>\n\n<p>⇒ (3a)<sup>3</sup> - (4b)<sup>3</sup> - 3 × 3a × 4b (3a - 4b)</p>\n\n<p>⇒ 27a<sup>3</sup> - 64b<sup>3</sup> - 108a<sup>2</sup>b + 144ab<sup>2</sup></p>\n\n<p>As we know,</p>\n(a - b)<sup>3</sup> = a<sup>3</sup> - b<sup>3</sup> - 3a<sup>2</sup>b + 3ab<sup>2</sup>", "marks": 2, "negMarks": 0.5}, {"text": "<p>Simplify the following.</p>\n\n<p><span class=\"math-tex\">\\(\\frac{762\\times762\\times762+316\\times316\\times316}{762\\times762-762\\times316+316\\times316}\\)</span></p>\n", "options": ["1064", "1056", "1042", "1078"], "correct": 4, "solution": "<span style='display: flex;gap: 6px;align-items: center;'><img height='26px' src='https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png' width='26px' /> <u style='font-size: 21px; font-weight: 700; display: inline !important;'>Shortcut Trick</u></span>\n<p>The expression follows the <strong>algebraic identity</strong> form: (a<sup>3</sup> + b<sup>3</sup>) &divide; (a<sup>2</sup> &minus; ab + b<sup>2</sup>).</p>\n<p>This simplifies directly to <strong>(a + b)</strong> because (a<sup>3</sup> + b<sup>3</sup>) = (a + b)(a<sup>2</sup> &minus; ab + b<sup>2</sup>).</p>\n<p>Here, a = 762 and b = 316.</p>\n<p>Result = 762 + 316 = 1078.</p>\n<p><strong>&there4; The correct answer is 1078.</strong></p>\n\n<p><span style='display: flex;gap: 6px;align-items: center;'><img height='26px' src='https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png' width='26px' /><strong><span style='vertical-align: middle;font-size: 21px;'><u>Alternate Method</u></span></strong></span></p>\n<p><strong>Given:</strong></p>\n<p>Numerator = 762 &times; 762 &times; 762 + 316 &times; 316 &times; 316</p>\n<p>Denominator = 762 &times; 762 &minus; 762 &times; 316 + 316 &times; 316</p>\n<p><strong>Formula Used:</strong></p>\n<p><strong>a<sup>3</sup> + b<sup>3</sup> = (a + b)(a<sup>2</sup> &minus; ab + b<sup>2</sup>)</strong></p>\n<p><strong>Calculations:</strong></p>\n<p>Let <strong>a = 762</strong> and <strong>b = 316</strong>.</p>\n<p>&rArr; Expression = (a<sup>3</sup> + b<sup>3</sup>) &divide; (a<sup>2</sup> &minus; ab + b<sup>2</sup>)</p>\n<p>&rArr; Expression = [(a + b)(a<sup>2</sup> &minus; ab + b<sup>2</sup>)] &divide; (a<sup>2</sup> &minus; ab + b<sup>2</sup>)</p>\n<p>&rArr; Expression = a + b</p>\n<p>&rArr; Expression = 762 + 316</p>\n<p>&rArr; Expression = 1078</p>\n<p><strong>&there4; The correct answer is 1078.</strong></p>\n\n<p><span style='display: flex;gap: 6px;align-items: center;'><img height='26px' src='https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png' width='26px' /><strong><span style='vertical-align: middle;font-size: 21px;'><u>Additional Information</u></span></strong></span></p>\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>Sum of Cubes Identity</p>\n<p style='margin:0 0 8px 0;color:#444444;'>The expression (a<sup>3</sup> + b<sup>3</sup>) is always divisible by (a + b) and the quotient is (a<sup>2</sup> &minus; ab + b<sup>2</sup>).</p>\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>Difference of Cubes Identity</p>\n<p style='margin:0 0 8px 0;color:#444444;'>Similarly, a<sup>3</sup> &minus; b<sup>3</sup> = (a &minus; b)(a<sup>2</sup> + ab + b<sup>2</sup>), which is a common <strong>simplification shortcut</strong> in competitive exams.</p>\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>Square Identities</p>\n<p style='margin:0 0 8px 0;color:#444444;'>(a + b)<sup>2</sup> = a<sup>2</sup> + 2ab + b<sup>2</sup> and (a &minus; b)<sup>2</sup> = a<sup>2</sup> &minus; 2ab + b<sup>2</sup>.</p>", "marks": 2, "negMarks": 0.5}, {"text": "If <span class=\"math-tex\">\\(a + \\frac{1}{a} = 5 \\)</span> , then what is the value of <span class=\"math-tex\">\\({a^3} + \\frac{1}{{{a^3}}}\\)</span>?", "options": ["110", "15", "105", "–10"], "correct": 1, "solution": "&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;Given:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(a + \\frac{1}{a} = 5 \\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;Concept used:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;(a&amp;nbsp;+&amp;nbsp;b)&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;= a&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;+&amp;nbsp;3ab(a +&amp;nbsp;b) +&amp;nbsp;b&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;Calculation:&amp;nbsp;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(a + \\frac{1}{a} = 5 \\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\((a + \\frac{1}{a})^3 = 5^3 \\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(a^3 + \\frac{1}{a^{3}} + 3(a + \\frac {1}{a}) = 5^3\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(a^3 + \\frac{1}{a^{3}} + 3 \\times 5 = 125\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(a^3 + \\frac{1}{a^{3}} = 125 - 15\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(a^3 + \\frac{1}{a^{3}} = 110 \\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;&amp;there4; The value of&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\({a^3} + \\frac{1}{{{a^3}}}\\)&lt;/span&gt;&amp;nbsp;is&amp;nbsp;110.&lt;/span&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If <span class=\"math-tex\">\\(x + \\frac{1}{x} = 4\\)</span> then find the value of <span class=\"math-tex\">\\({x^4} + \\frac{1}{{{x^4}}}\\)</span>", "options": ["128", "194", "162", "136"], "correct": 2, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(x + \\frac{1}{x} = 4\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Formula used:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; (a + b)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= a&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ b&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 2ab&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;According to the formula&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\({\\left( {x + \\frac{1}{x}} \\right)^2} = {x^2} + \\frac{1}{{{x^2}}} + 2 \\times x \\times \\frac{1}{x}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(16 = {x^2} + \\frac{1}{{{x^2}}} + 2\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\({x^2} + \\frac{1}{{{x^2}}} = 14\\)&lt;/span&gt;&amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp;.....1&lt;/p&gt;\n\n&lt;p&gt;squaring both sides in the equation 1&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\({\\left( {x^2 + \\frac{1}{x^2}} \\right)^2} = {x^4} + \\frac{1}{{{x^4}}} + 2 \\times x^2 \\times \\frac{1}{x^2}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(16 = {x^2} + \\frac{1}{{{x^2}}} + 2\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\({x^4} + \\frac{1}{{{x^4}}} = 194\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&amp;there4; The value of&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\({x^4} + \\frac{1}{{{x^4}}}\\)&lt;/span&gt;&amp;nbsp;= 194.&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&lt;img height=&quot;31px&quot; src=&quot;https://cdn.repeatermock.com/tb/6bd67c9563cdde4a0dfe99b7686282bc07365f691adfb64c907de66aebe4b011.png&quot; width=&quot;147px&quot; /&gt;&lt;/p&gt;\n\n&lt;p&gt;If&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(x + \\frac{1}{x} = k\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\({x^4} + \\frac{1}{{{x^4}}} = {k^2}\\left( {{k^2} - 4} \\right) + 2\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; 4&lt;sup&gt;2&lt;/sup&gt;(4&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;&amp;ndash;&amp;nbsp;4) + 2&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; 194&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;&amp;there4; The value of&amp;nbsp;&amp;nbsp;= 194.&lt;/span&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If <span class=\"math-tex\">\\({{\\rm X}^2} + \\frac{1}{{{{\\rm X}^2}}} = 66\\)</span> , the value of <span class=\"math-tex\">\\({\\rm X} - \\frac{1}{{\\rm X}}\\)</span> is_______.", "options": ["10", "8", "9", "6"], "correct": 2, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\({{\\rm X}^2} + \\frac{1}{{{{\\rm X}^2}}} = 66\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Formula used:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;(a - b)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= a&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ b&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;- 2ab&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculations:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;(&lt;span class=&quot;math-tex&quot;&gt;\\({\\rm X} - \\frac{1}{{\\rm X}}\\)&lt;/span&gt;)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;=&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\({{\\rm X}^2} + \\frac{1}{{{{\\rm X}^2}}} \\)&lt;/span&gt;&amp;nbsp;- 2&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;66- 2&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&lt;/span&gt;&amp;nbsp;64&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\({\\rm X} - \\frac{1}{{\\rm X}}\\)&lt;/span&gt;&amp;nbsp;=&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\sqrt64\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&lt;/span&gt; &lt;span style=&quot;color: rgb(17, 17, 17);  &quot;&gt;&amp;plusmn;&amp;nbsp;&lt;/span&gt;8&lt;/p&gt;\n\n&lt;p&gt;Hence, the correct answer is &amp;#39;&lt;strong&gt;8&amp;#39;.&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If <span class=\"math-tex\">\\(\\frac{x}{y}+\\frac{y}{x}=2\\)</span> (x, y ≠ 0), then the value of (x - y) is:", "options": ["-2", "1", "2", "0"], "correct": 4, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{x}{y}+\\frac{y}{x}=2\\)&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Concept used:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;(x -&amp;nbsp;y)&lt;sup&gt;2&lt;/sup&gt; = (x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;-&amp;nbsp;2xy&amp;nbsp;+&amp;nbsp;y&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;x/y + y/x = 2&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; {(x&amp;nbsp;&amp;times; x) + (y&amp;nbsp;&amp;times; y)}/(x&amp;nbsp;&amp;times; y) = 2&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; (x&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+&amp;nbsp;y&lt;sup&gt;2&lt;/sup&gt;)/xy = 2&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;(x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+&amp;nbsp;y&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;) = 2xy&amp;nbsp; &amp;nbsp; &amp;nbsp;&amp;nbsp;----(1)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;Now,&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;(x - y)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; &amp;radic;(x - y)&lt;sup&gt;2&lt;/sup&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; &amp;radic;(x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;-&amp;nbsp;2xy&amp;nbsp;+&amp;nbsp;y&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; to &gt; + 1/a&lt;sup&gt;3&lt;/sup&gt; = 110.&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If <span class=\"math-tex\">\\(\\rm K+\\frac{1}{K}=3\\)</span>, then what is the value of <span class=\"math-tex\">\\(\\frac{1}{K^3}+K^3\\)</span>?", "options": ["36", "10", "18", "54"], "correct": 3, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\rm K+\\frac{1}{K}=3\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Concept used:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;If&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\rm a+\\frac{1}{a}=b\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;Then,&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(a^3+\\frac{1}{a^3} = b^3 - 3b\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{1}{K^3}+K^3\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\((\\rm K+\\frac{1}{K})^3-3(\\rm K+\\frac{1}{K})\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; 3&lt;sup&gt;3&lt;/sup&gt; - 3&amp;nbsp;&amp;times; 3&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; 27&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;- 9&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; 18&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&lt;span style=&quot;&quot;&gt;&amp;there4; The required answer is 18.&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "Expand: (4a + 3b + 2c)<sup>2</sup>", "options": ["16a<sup>2</sup> + 9b<sup>2</sup> + 4c<sup>2</sup> + 24ab + 12bc + 16ca", "16a<sup>2</sup> + 9b<sup>2</sup> + 4c<sup>2</sup>- 24ab - 12bc - 16ca", "4a<sup>2</sup> + 3b + 2c<sup>2</sup> + 24ab + 12bc + 16ca", "16a<sup>2 </sup>- 9b<sup>2</sup> + 4c<sup>2</sup> - 24ab + 12bc - 16ca"], "correct": 1, "solution": "<p>(4a + 3b + 2c)<sup>2</sup></p>\n\n<p>⇒ (4a)<sup>2</ ;nbsp;- 2ab}&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; 3{5&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;- 2&amp;nbsp;&amp;times; 6}&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; 39&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;font-weight: 700; &quot;&gt;&amp;there4; The required value is 39.&lt;/span&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If x<sup>4</sup> + <span class=\"math-tex\">\\(\\frac{1}{{{x^4}}}\\)</span> = 194 and x<sup>3</sup> + <span class=\"math-tex\">\\(\\frac{1}{{{x^3}}}\\)</span> = ?", "options": ["52", "58", "76", "67"], "correct": 1, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;4&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+&amp;nbsp;&lt;/span&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{1}{{{x^4}}}\\)&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;= 194&amp;nbsp;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&lt;strong&gt;Calculations:&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;According to question,&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;4&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+&amp;nbsp;&lt;/span&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{1}{{{x^4}}}\\)&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;= 194&amp;nbsp;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;x&amp;sup2; + 1/x&amp;sup2; = &amp;radic;(194 + 2)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;x&amp;sup2; + 1/x&amp;sup2; = 14&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;x + 1/x = &amp;radic;(14 + 2) = &amp;radic;16 = 4&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;now, x&amp;sup3; + 1/x&amp;sup3;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;= 4&amp;sup3; - 3(4)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;= 64 - 12&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;= 52&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Hence, The Required value is 52.&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "What is the expansion of (1 - <span class=\"math-tex\">\\(\\frac {1} {p}\\)</span>)<sup>2</sup>?", "options": ["1 + <span class=\"math-tex\">\\(\\frac {2} {p} - \\frac {1} {p^2}\\)</span>", "1 - <span class=\"math-tex\">\\(\\frac {2} {p} + \\frac {1} {p^2}\\)</span>", "1 - <span class=\"math-tex\">\\(\\frac {2} {p} - \\frac {1} {p^2}\\)</span>", "1 + <span class=\"math-tex\">\\(\\frac {2} {p} + \\frac {1} {p^2}\\)</span>"], "correct": 2, "solution": "&lt;p&gt;&lt;b&gt;Given:&lt;/b&gt;&lt;/p&gt;\n\n&lt;p&gt;(1 - 1/p)&lt;sup&gt;2&lt;/sup&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Formula Used:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;(a - b)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= a&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ b&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;- 2ab&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;(1 - 1/p)&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;= 1 + 1/p&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;- 2/p&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&lt;span class=&quot;s1&quot; style=&quot;font-variant-numeric: normal; font-variant-east-asian: normal; font-variant-alternates: normal; font-kerning: auto; font-optical-sizing: auto; font-feature-settings: normal; font-variation-settings: normal; font-stretch: normal; line-height: normal; &quot;&gt;&amp;there4;&lt;/span&gt; Option 2 is the correct answer.&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "The value of 515 × 485 is: ", "options": ["20825", "250225", "200825", "249775"], "correct": 4, "solution": "<p>As we know,</p>\n\n<p>a<sup>2</sup> - b<sup>2</sup> = (a - b) (a + b)</p>\n\n<p>Hence, 515 × 485</p>\n\n<p>⇒ (500 + 15) (500 - 15)</p>\n\n<p>⇒ 500<sup>2</sup> - 15<sup>2</sup></p>\n\n<p>⇒ 250000 - 225</p>\n⇒ 249775", "marks": 2, "negMarks": 0.5}, {"text": "If m - <span class=\"math-tex\">\\(1\\over m\\)</span> = 7, then what is the value of m<sup>2</sup> + <span class=\"math-tex\">\\(\\left( 1\\over {m^2} \\right) \\)</span>?", "options": ["0", "51", "53", "49"], "correct": 2, "solution": "<p><strong>Given:</strong></p>\n\n<p>m - 1/m = 7</p>\n\n<p><strong>Solution:</strong></p>\n\n<p>Squaring both sides of the equation, we get:</p>\n\n<p><span class=\"math-tex\">\\(m^2 - 2 + 1/m^2 = 49\\)</span></p>\n\n<p><span style=\"font-family: var(--bs-body-font-family); font-size: var(--bs-body-font-size); font-weight: var(--bs-body-font-weight); text-align: var(--bs-body-text-align);\"><span class=\"math-tex\">\\(m^2 + 1/m^2 = 51 \\)</span></span></p>\n\n<p><span style=\"font-family: var(--bs-body-font-family); font-size: var(--bs-body-font-size); font-weight: var(--bs-body-font-weight); text-align: var(--bs-body-text-align);\"><strong>Therefore, the value of</strong> <span class=\"math-tex\">\\(m^2 + 1/m^2\\)</span><strong> is 51.</strong></span></p>\n", "marks": 2, "negMarks": 0.5}, {"text": "If 2a + 3b = 10 and ab = 3, then find the value of 4a<sup>2</sup> + 9b<sup>2</sup>.", "options": ["60", "62", "64", "66"], "correct": 3, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;2a + 3b = 10&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;ab = 3&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&lt;span style=&quot;&quot;&gt;Concept used:&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;(a + b)&lt;sup&gt;2&lt;/sup&gt; = a&lt;sup&gt;2&lt;/sup&gt; + b&lt;sup&gt;2&lt;/sup&gt; + 2ab&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;2a + 3b = 10&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; (2a + 3b)&lt;sup&gt;2&lt;/sup&gt; = 10&lt;sup&gt;2&lt;/sup&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; 4a&lt;sup&gt;2&lt;/sup&gt; + 9b&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ 12ab = 100&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; 4a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ 9&lt;/span&gt;&lt;span style=&quot;&quot;&gt;b&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ 36 =&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;10&lt;/span&gt;&lt;span style=&quot;&quot;&gt;0&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; 4a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ 9&lt;/span&gt;&lt;span style=&quot;&quot;&gt;b&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;=&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;10&lt;/span&gt;&lt;span style=&quot;&quot;&gt;0 - 36&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; 4a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ 9&lt;/span&gt;&lt;span style=&quot;&quot;&gt;b&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;= 64&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&lt;span style=&quot;&quot;&gt;&amp;there4; The required answer is 64.&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "<p>Simplify the following:</p>\n\n<p><span class=\"math-tex\">\\( \\frac{{8.79 \\times 8.79 \\times 8.79 - 6.79 \\times 6.79 \\times 6.79}}{{8.79 \\times 8.79 + 8.79 \\times 6.79 + 6.79 \\times 6.79}}\\)</span></p>\n", "options": ["8", "14", "2", "6"], "correct": 3, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\( \\frac{{8.79 \\times 8.79 \\times 8.79 - 6.79 \\times 6.79 \\times 6.79}}{{8.79 \\times 8.79 + 8.79 \\times 6.79 + 6.79 \\times 6.79}}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Formula used:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;m&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;- n&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;= (m-n)(m&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ mn +n&lt;sup&gt;2&lt;/sup&gt;)&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Solution:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;Now, according to the question, we can,&lt;/p&gt;\n\n&lt;p&gt;m = 8.79 and n = 6.79&lt;/p&gt;\n\n&lt;p&gt;Now, using the above formula,&lt;/p&gt;\n\n&lt;p&gt;we can simplify it as,&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\( \\frac{{8.79 \\times 8.79 \\times 8.79 - 6.79 \\times 6.79 \\times 6.79}}{{8.79 \\times 8.79 + 8.79 \\times 6.79 + 6.79 \\times 6.79}}\\)&lt;/span&gt;&amp;nbsp;=&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{(8.79-6.79) \\times ({{8.79 \\times 8.79 + 8.79 \\times 6.79 + 6.79 \\times 6.79}})}{({{8.79 \\times 8.79 + 8.79 \\times 6.79 + 6.79 \\times 6.79}})} \\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;= 2&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Hence, the simplifiction gives 2.&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "What is the value of a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup> - 2ab - 2bc + 2ca ?", "options": ["(2a + b + c)<sup>2</sup>", "(a – b + c)<sup>2</sup>", "(a – b – 2c)<sup>2</sup>", "(a + 2b – c)<sup>2</sup>"], "correct": 2, "solution": "&lt;p&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;Given:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ b&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ c&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;- 2ab - 2bc + 2ca&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;Concept used:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;(a +&amp;nbsp;b + c)&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;=&amp;nbsp;&lt;span style=&quot;&quot;&gt;a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ b&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ c&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+&amp;nbsp;2ab +&amp;nbsp;2bc + 2ca&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;Calculation:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ b&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ c&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;- 2ab - 2bc + 2ca&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ (-b)&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ c&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+&amp;nbsp;2a(-b)&amp;nbsp;+&amp;nbsp;2(-b)c + 2ca&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; (a + (-b) + c)&lt;sup&gt;2&lt;/sup&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;(a &amp;ndash; b + c)&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&lt;span style=&quot;font-weight: 700; &quot;&gt;&amp;there4;&amp;nbsp;&lt;/span&gt;The value of&amp;nbsp;&lt;span style=&quot;&quot;&gt;a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ b&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ c&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;- 2ab - 2bc + 2ca is&amp;nbsp;(a &amp;ndash; b + c)&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;.&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "Find the value of <span class=\"math-tex\">\\(\\frac{(453 \\times 453 \\times 453 - 383 \\times 383 \\times 383)}{(453 \\times 383 + 383 \\times 383 + 453 \\times 453)}\\)</span>", "options": ["60", "50", "80", "70"], "correct": 4, "solution": "&lt;p&gt;&lt;span style=&quot;display: flex;gap: 6px;align-items: center;&quot;&gt;&lt;img height=&quot;26px&quot; src=&quot;https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png&quot; width=&quot;26px&quot; /&gt; &lt;u style=&quot;font-size: 21px; font-weight: 700; display: inline !important;&quot;&gt;Shortcut Trick&lt;/u&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;The given expression follows the exact algebraic identity pattern: (a&lt;sup&gt;3&lt;/sup&gt; &amp;minus; b&lt;sup&gt;3&lt;/sup&gt;) / (a&lt;sup&gt;2&lt;/sup&gt; + ab + b&lt;sup&gt;2&lt;/sup&gt;).&lt;/p&gt;\n\n&lt;p&gt;This structure directly simplifies to (a &amp;minus; b).&lt;/p&gt;\n\n&lt;p&gt;Here, a = 453 and b = 383.&lt;/p&gt;\n\n&lt;p&gt;Result = 453 &amp;minus; 383 = 70.&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&amp;there4; The correct answer is 70.&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;display: flex;gap: 6px;align-items: center;&quot;&gt;&lt;img height=&quot;26px&quot; src=&quot;https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png&quot; width=&quot;26px&quot; /&gt;&lt;strong&gt;&lt;span style=&quot;vertical-align: middle;font-size: 21px;&quot;&gt;&lt;u&gt;Alternate Method&lt;/u&gt;&lt;/span&gt;&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;Expression: (453 &amp;times; 453 &amp;times; 453 &amp;minus; 383 &amp;times; 383 &amp;times; 383) / (453 &amp;times; 383 + 383 &amp;times; 383 + 453 &amp;times; 453)&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Formula Used:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;a&lt;sup&gt;3&lt;/sup&gt; &amp;minus; b&lt;sup&gt;3&lt;/sup&gt; = (a &amp;minus; b)(a&lt;sup&gt;2&lt;/sup&gt; + ab + b&lt;sup&gt;2&lt;/sup&gt;)&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculations:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; Let a = 453 and b = 383.&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; The numerator is a &amp;times; a &amp;times; a &amp;minus; b &amp;times; b &amp;times; b = a&lt;sup&gt;3&lt;/sup&gt; &amp;minus; b&lt;sup&gt;3&lt;/sup&gt;.&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; The denominator is a &amp;times; b + b &amp;times; b + a &amp;times; a = a&lt;sup&gt;2&lt;/sup&gt; + ab + b&lt;sup&gt;2&lt;/sup&gt;.&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; The expression becomes = (a&lt;sup&gt;3&lt;/sup&gt; &amp;minus; b&lt;sup&gt;3&lt;/sup&gt;) / (a&lt;sup&gt;2&lt;/sup&gt; + ab + b&lt;sup&gt;2&lt;/sup&gt;)&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; Expanding the numerator: [(a &amp;minus; b)(a&lt;sup&gt;2&lt;/sup&gt; + ab + b&lt;sup&gt;2&lt;/sup&gt;)] / (a&lt;sup&gt;2&lt;/sup&gt; + ab + b&lt;sup&gt;2&lt;/sup&gt;)&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; Canceling the common term (a&lt;sup&gt;2&lt;/sup&gt; + ab + b&lt;sup&gt;2&lt;/sup&gt;) from numerator and denominator, we get:&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; Simplified Expression = a &amp;minus; b&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; Value = 453 &amp;minus; 383 = 70&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&amp;there4; The correct answer is 70.&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;display: flex;gap: 6px;align-items: center;&quot;&gt;&lt;img height=&quot;26px&quot; src=&quot;https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png&quot; width=&quot;26px&quot; /&gt;&lt;strong&gt;&lt;span style=&quot;vertical-align: middle;font-size: 21px;&quot;&gt;&lt;u&gt;Additional Information&lt;/u&gt;&lt;/span&gt;&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;margin:8px 0 2px 0;font-weight:700;color:#222222;&quot;&gt;Sum of Cubes Identity&lt;/p&gt;\n\n&lt;p style=&quot;margin:0 0 8px 0;color:#444444;&quot;&gt;a&lt;sup&gt;3&lt;/sup&gt; + b&lt;sup&gt;3&lt;/sup&gt; = (a + b)(a&lt;sup&gt;2&lt;/sup&gt; &amp;minus; ab + b&lt;sup&gt;2&lt;/sup&gt;). When an expression is given in the form (a&lt;sup&gt;3&lt;/sup&gt; + b&lt;sup&gt;3&lt;/sup&gt;) / (a&lt;sup&gt;2&lt;/sup&gt; &amp;minus; ab + b&lt;sup&gt;2&lt;/sup&gt;), the result is simply (a + b).&lt;/p&gt;\n\n&lt;p style=&quot;margin:8px 0 2px 0;font-weight:700;color:#222222;&quot;&gt;Difference of Squares&lt;/p&gt;\n\n&lt;p style=&quot;margin:0 0 8px 0;color:#444444;&quot;&gt;a&lt;sup&gt;2&lt;/sup&gt; &amp;minus; b&lt;sup&gt;2&lt;/sup&gt; = (a &amp;minus; b)(a + b). This formula is often used to simplify fractions or compute large mental math differences quickly.&lt;/p&gt;\n\n&lt;p style=&quot;margin:8px 0 2px 0;font-weight:700;color:#222222;&quot;&gt;Cube of Sum and Difference&lt;/p&gt;\n\n&lt;p style=&quot;margin:0 0 8px 0;color:#444444;&quot;&gt;(a + b)&lt;sup&gt;3&lt;/sup&gt; = a&lt;sup&gt;3&lt;/sup&gt; + b&lt;sup&gt;3&lt;/sup&gt; + 3ab(a + b) and (a &amp;minus; b)&lt;sup&gt;3&lt;/sup&gt; = a&lt;sup&gt;3&lt;/sup&gt; &amp;minus; b&lt;sup&gt;3&lt;/sup&gt; &amp;minus; 3ab(a &amp;minus; b).&lt;/p&gt;\n\n&lt;p style=&quot;margin:8px 0 2px 0;font-weight:700;color:#222222;&quot;&gt;BODMAS Rule&lt;/p&gt;\n\n&lt;p style=&quot;margin:0 0 8px 0;color:#444444;&quot;&gt;Standard order of operations: Brackets, Orders (powers/roots), Division, Multiplication, Addition, Subtraction. Using algebraic substitutions helps bypass complex arithmetic multiplication steps.&lt;/p&gt;\n\n&lt;p&gt;&amp;nbsp;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "The value of 1801 × 1801 is:", "options": ["3423601", "3243601", "2343601", "3243106"], "correct": 2, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;1801 &amp;times; 1801&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Concept Used:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;(a + b)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= a&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ b&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 2ab&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; In the above question it is given that&amp;nbsp;&lt;span style=&quot;&quot;&gt;1801 &amp;times; 1801&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; It can also be written as (1800 + 1) &amp;times; (1800 + 1) = (1800 + 1&lt;/span&gt;&lt;span style=&quot;&quot;&gt;)&lt;sup&gt;2&lt;/sup&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;(1800 + 1&lt;/span&gt;&lt;span style=&quot;&quot;&gt;)&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;/span&gt;&amp;nbsp;= 1800&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 1&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 2&amp;nbsp;&lt;span style=&quot;&quot;&gt;&amp;times; 1800 &amp;times; 1 &lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; 3240000 + 1 + 3600 = 3243601&amp;nbsp;&amp;nbsp;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Therefore, the value of&amp;nbsp;&lt;span style=&quot;&quot;&gt;1801 &amp;times; 1801 is 3243601.&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If <span class=\"math-tex\">\\(x+ 1/x=4\\)</span>, then the value of <span class=\"math-tex\">\\(x^4+(1/x)^4\\)</span> is", "options": ["14", "16", "194", "196"], "correct": 3, "solution": "&lt;p&gt;&lt;strong&gt;Given :&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(x+ 1/x=4\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;To find :&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(x^4+(1/x)^4\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Formula used :&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;(a + b)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= a&lt;sup&gt;2&lt;/sup&gt; + b&lt;sup&gt;2&lt;/sup&gt; + 2ab&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Solution :&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;x + (1/x) = 4&lt;/p&gt;\n\n&lt;p&gt;squaring both sides&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; [x + (1/x)]&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= 4&lt;sup&gt;2&lt;/sup&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; x&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ (1/x)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 2 = 16&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; x&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ (1/x)&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;= 14&lt;/p&gt;\n\n&lt;p&gt;squaring both sides&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; [x&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ (1/x)&lt;sup&gt;2&lt;/sup&gt;]&lt;sup&gt;2&lt;/sup&gt; = 14&lt;sup&gt;2&lt;/sup&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; x&lt;sup&gt;4&lt;/sup&gt;&amp;nbsp;+ (1/x&lt;sup&gt;4&lt;/sup&gt;) + 2 = 196&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; x&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;4&lt;/span&gt;&amp;nbsp;+ (1/x&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;4&lt;/span&gt;) = 194&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&amp;there4; the value of&amp;nbsp;x&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;4&lt;/span&gt;&amp;nbsp;+ (1/x&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;4&lt;/span&gt;) is194.&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "<p>Find the value of the following expression.</p>\n\n<p>12<sup>3 </sup>+ (-8)<sup>3</sup> + (-4)<sup>3</sup></p>\n", "options": ["952", "1152", "1052", "852"], "correct": 2, "solution": "<p><span style=\"font-weight: 700;\">Calculation:</span></p>\n\n<p><span style=\"\">12</span><span style=\" line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;\">3 </span><span style=\"\">+ (-8)</span><span style=\" line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;\">3</span><span style=\"\"> + (-4)</span><span style=\" line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;\">3</span></p>\n\n<p><span style=\"\">⇒ 1728 - 512 - 64</span></p>\n\n<p><span style=\"\">⇒ 1152</span></p>\n\n<p><span style=\"font-weight: 700; \">∴ The simplified value is 1152.</span></p>\n", "marks": 2, "negMarks": 0.5}, {"text": "The value of 151<sup>2</sup> – 149<sup>2</sup> is:", "options": ["400", "600", "300", "2<sup>z</sup>"], "correct": 2, "solution": "<p>151<sup>2</sup> – 149<sup>2</sup></p>\n\n<p>⇒ (151 + 149) (151 – 149)</p>\n\n<p>⇒ 300 × 2</p>\n\n<p>⇒ 600</p>\n", "marks": 2, "negMarks": 0.5}, {"text": "<p>Simplify the following expression.</p>\n\n<p><span class=\"math-tex\">\\(\\frac{(0.96\\times0.96\\times0.96+0.04\\times0.04\\times0.04)}{(0.96\\times0.96-0.96\\times0.04+0.04\\times0.04)}\\)</span></p>\n", "options": ["0", "0.82", "2", "1"], "correct": 4, "solution": "&lt;p&gt;&lt;strong&gt;Formula used&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;a&lt;sup&gt;3&amp;nbsp;&amp;nbsp;&lt;/sup&gt;+ b&lt;sup&gt;3&lt;/sup&gt; = (a + b)(a&lt;sup&gt;2&lt;/sup&gt; -ab + b&lt;sup&gt;2&lt;/sup&gt;)&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{(0.96×0.96×0.96+0.04×0.04×0.04)}{(0.96×0.96-0.96×0.04+0.04×0.04)}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;Let a = 0.96 and b = 004&lt;/p&gt;\n\n&lt;p&gt;Applying the above formula:&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; (a&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;+ b&lt;sup&gt;3&lt;/sup&gt;)/(&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;(a&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;-ab + b&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;) = a + b&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;rArr;&amp;nbsp;(0.96&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;+ 0.04&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;)/(&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;(0.96&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41); position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;- 096 &amp;times; 0.04&amp;nbsp;+ 0.04&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41); position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;) = 0.96 + 0.04&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;rArr; 1&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;The answer is 1.&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If 4x<sup>2</sup> + y<sup>2</sup> = 40 and xy = 6, find the positive value of 2x + y.", "options": ["8", "6", "5", "4"], "correct": 1, "solution": "&lt;p&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;Given:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;4x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ y&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;= 40 and xy = 6&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;Concept used:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;(a + b)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;- 2ab = a&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ b&lt;sup&gt;2&lt;/sup&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;Calculation:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;4x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ y&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;= 40&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; (2x + y)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;- 4xy = 40&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; (2x + y)&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;- 4&amp;nbsp;&amp;times; 6 = 40&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; (2x + y)&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;= 64&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; (2x + y) = 8&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&lt;span style=&quot;font-weight: 700; &quot;&gt;&amp;there4; T&lt;/span&gt;&lt;span style=&quot;&quot;&gt;he positive value of 2x + y is 8.&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If x + 1/x = 8, then x<sup>2</sup> + 1/x<sup>2</sup> is equal to∶", "options": ["62", "68", "64", "66"], "correct": 1, "solution": "<p>Given,</p>\n\n<p>⇒ x + 1/x = 8</p>\n\n<p>Squaring,</p>\n\n<p>⇒ x<sup>2</sup> + 1/x<sup>2</sup> + 2 = 64</p>\n⇒ x<sup>2</sup> + 1/x<sup>2</sup> = 62", "marks": 2, "negMarks": 0.5}, {"text": "If <span class=\"math-tex\">\\(\\sqrt{x}-\\frac{1}{\\sqrt{x}}=\\sqrt{7}\\)</span>, then the value of <span class=\"math-tex\">\\(x^2+\\frac{1}{x^2}\\)</span> is:", "options": ["60", "75", "81", "79"], "correct": 4, "solution": "&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;Given:&lt;/span&gt;&amp;nbsp;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(√{x}-\\frac{1}{√{x}}=√{7}\\)&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;Concept used:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;&quot;&gt;(A + B)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= A&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 2AB + B&lt;sup&gt;2&lt;/sup&gt;&lt;/span&gt;&lt;o:p&gt;&lt;/o:p&gt;&lt;/p&gt;\n\n&lt;p data-darkreader-inline-bgcolor=&quot;&quot; data-darkreader-inline-bgimage=&quot;&quot; style=&quot;margin: 0cm 0cm 7.5pt; background: white; --darkreader-inline-bgimage: initial; --darkreader-inline-bgcolor: #181a1b;&quot;&gt;&lt;span style=&quot;&quot;&gt;(A -&amp;nbsp;B)&lt;sup&gt;2&lt;/sup&gt;&lt;/span&gt;&amp;nbsp;= A&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;-&amp;nbsp;2AB + B&lt;sup&gt;2&lt;/sup&gt;&lt;o:p&gt;&lt;/o:p&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;Calculation:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(√{x}-\\frac{1}{√{x}}=√{7}\\)&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&amp;rArr; (&amp;radic;x - 1/&amp;radic;x)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= (&amp;radic;7)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;(Squaring both side)&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&amp;rArr; (&amp;radic;x)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;- (2&amp;nbsp;&amp;times;&amp;nbsp;&lt;span style=&quot;&quot;&gt;&amp;radic;x&amp;nbsp;&amp;times; 1/&amp;radic;x) + (1/&amp;radic;x)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= 7&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&l p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;(x)&lt;span style=&quot;line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;+ (1/x)&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;= 79&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;strong&gt;&lt;span style=&quot;&quot;&gt;&amp;there4; The required value of&amp;nbsp;(x)&lt;span style=&quot;line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;+ (1/x)&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;is&amp;nbsp;79.&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If 2x + 5y = 15 and xy = 6, then the value of 4x<sup>2</sup> + 25y<sup>2</sup> is ________.", "options": ["105", "95", "100", "90"], "correct": 1, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;2x + 5y = 15&lt;/p&gt;\n\n&lt;p&gt;and xy = 6&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Formula used:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;(A + B)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= A&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ B&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 2AB&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;rArr; 2x + 5y = 15&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;Squaring both sides&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;s
