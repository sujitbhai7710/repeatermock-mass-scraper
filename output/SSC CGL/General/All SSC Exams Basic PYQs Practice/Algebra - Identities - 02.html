ion: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;\">2</span><span style=\"color: rgb(33, 37, 41);\"> + d</span><span style=\"position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;\">2</span><span style=\"color: rgb(33, 37, 41);\">)</span>", "2cd"], "correct": 1, "solution": "&lt;p&gt;&lt;strong&gt;Formula Used :&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;x&lt;sup&gt;2&amp;nbsp;&lt;/sup&gt;- y&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= (x +&amp;nbsp;y) (x - y)&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; (c + d)&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;- (c - d)&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;(c + d + c - d) (c + d -(c - d))&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;rArr;&amp;nbsp;2c &amp;times; (c + d - c +&amp;nbsp;d)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;rArr; 2c&amp;nbsp;&amp;times; 2d = 4cd&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;there4; The simplified value&amp;nbsp;is 4cd.&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&lt;span style=&quot;display: flex;gap: 6px;align-items: center;&quot;&gt;&lt;img height=&quot;26px&quot; src=&quot;https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png&quot; width=&quot;26px&quot; /&gt;&lt;strong&gt;&lt;span style=&quot;vertical-align: middle;font-size: 21px;&quot;&gt;&lt;u&gt;Alternate Method&lt;/u&gt;&lt;/span&gt;&lt;/strong&gt;&lt;/span&gt;&lt;/span&gt;&lt;/strong&gt;&lt;span style=&quot;font-weight: bolder;&quot;&gt;Formula Used :&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;(x + y)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= x&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ y&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 2xy&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;(x - y)&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;= x&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;+ y&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;-&amp;nbsp;2xy&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;font-weight: bolder;&quot;&gt;Calculation:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;rArr; (c + d)&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;- (c - d)&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;rArr; c&lt;sup&gt;2&amp;nbsp;&lt;/sup&gt;+ d&lt;sup&gt;2&amp;nbsp;&lt;/sup&gt;+ 2cd - (&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;c&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;+ d&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;- 2cd)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;color: rgb(33, 37, 41);&quot;&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;rArr; c&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;+ d&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;+ 2cd - &lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;c&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41); position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;- d&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41); position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;+ 2cd&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;color: rgb(33, 37, 41);&quot;&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;rArr;&amp;nbsp;&lt;/span&gt;4cd&lt;/p&gt;\n\n&lt;p style=&quot;color: rgb(33, 37, 41);&quot;&gt;&lt;span style=&quot;font-weight: bolder;&quot;&gt;&amp;there4; The simplified value&amp;nbsp;is 4cd.&lt;/span&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "Simplify: <span class=\"math-tex\">\\(\\sqrt {36{x^2} - 108x + 81} \\)</span>.", "options": ["6x - 9", "2x - 9", "5x - 9", "3x - 3"], "correct": 1, "solution": "<p><strong>Calculations:</strong></p>\n\n<p>√(36x² - 108x + 81)</p>\n\n<p>=√[(6x)² - 2 × 6 × 9x + (9)²]</p>\n\n<p>= √[6x - 9]²</p>\n\n<p>= 6x - 9</p>\n\n<p><strong>Hence, The Required value is 6x - 9.</strong></p>\n", "marks": 2, "negMarks": 0.5}, {"text": "If <span class=\"math-tex\">\\(\\left( {4a + \\frac{5}{a} + 5} \\right)\\)</span> = 14, what is the value of <span class=\"math-tex\">\\(\\left( {16{a^2} + \\frac{{25}}{{{a^2}}}} \\right)\\)</span>?", "options": ["25", "36", "41", "40"], "correct": 3, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\left( {4a + \\frac{5}{a} + 5} \\right)\\)&lt;/span&gt;&amp;nbsp;= 14&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Concept used:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;(a&amp;nbsp;+ b)&lt;sup&gt;2&lt;/sup&gt; = a&lt;sup&gt;2&lt;/sup&gt; + b&lt;sup&gt;2&amp;nbsp;&lt;/sup&gt;+ 2ab&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\left( {4a + \\frac{5}{a} + 5} \\right)\\)&lt;/span&gt;&amp;nbsp;= 14&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\({4a + \\frac{5}{a}}\\)&lt;/span&gt;&amp;nbsp;= 9&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;/span&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(({4a + \\frac{5}{a}})^2\\)&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;= 9&lt;sup&gt;2&lt;/sup&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\({16{a^2} + \\frac{{25}}{{{a^2}}}+2.4a.\\frac{5}{a}}\\)&lt;/span&gt;&amp;nbsp;= 81&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;/span&gt;&lt;span class=&quot;math-tex&quot;&gt;\\({16{a^2} + \\frac{{25}}{{{a^2}}}+40}\\)&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;= 81&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;/span&gt;&lt;span class=&quot;math-tex&quot;&gt;\\({16{a^2} + \\frac{{25}}{{{a^2}}}}\\)&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;= 41&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&lt;span style=&quot;&quot;&gt;&amp;there4; The required answer is 41.&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If x + 1/x = 2√3, then x<sup>2</sup> + 1/x<sup>2</sup> is equal to:", "options": ["8", "16", "10", "12"], "correct": 3, "solution": "<p>As we know</p>\n\n<p>(x + 1/x)<sup>2</sup> = x<sup>2</sup> + 1/x<sup>2</sup> + 2</p>\n\n<p>(x<sup>2</sup> + 1/x<sup>2</sup>) = (x + 1/x)<sup>2</sup> – 2</p>\n\n<p>(x<sup>2</sup> + 1/x<sup>2</sup>) = (2√3)<sup>2</sup> – 22 = 12 – 2 = 10</p>\n", "marks": 2, "negMarks": 0.5}, {"text": "<span class=\"math-tex\">\\(a^3 + b^3 + c^3 = 3abc \\)</span> if ______.", "options": ["a = b = 2c", "a + b + c = 0", "a + b + c = 1", "a + b + c = –1"], "correct": 2, "solution": "&lt;p&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;Concept used:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;a&lt;sup&gt;3&lt;/sup&gt; + b&lt;sup&gt;3&lt;/sup&gt;+ c&lt;sup&gt;3&lt;/sup&gt; = (a + b + c)(a&lt;sup&gt;2&lt;/sup&gt; + b&lt;sup&gt;2&lt;/sup&gt; + c&lt;sup&gt;2&lt;/sup&gt; &amp;ndash; ab &amp;ndash; bc &amp;ndash; ca) + 3abc&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;Calculation:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;If we put&amp;nbsp;&lt;span style=&quot;&quot;&gt;a + b + c = 0,&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;​According to the concept,&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ b&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;+ c&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;= 0&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;+ 3abc&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ b&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;+ c&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;= 3abc&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&lt;span style=&quot;font-weight: 700; &quot;&gt;&amp;there4;&amp;nbsp;&lt;/span&gt;a&lt;span style=&quot;line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size: 10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;+ b&lt;span style=&quot;line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size: 10.5px;&quot;&gt;3&lt;/span&gt;+ c&lt;span style=&quot;line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size: 10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;= 3abc if a + b + c = 0.&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If <span class=\"math-tex\">\\(x+\\frac{1}{x}=7\\)</span>, then <span class=\"math-tex\">\\(x^2+\\frac{1}{x^2}\\)</span>is equal to:", "options": ["61", "49", "47", "51"], "correct": 3, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(x+\\frac{1}{x}=7\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Formula used:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;(a + b)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= a&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ b&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 2ab&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;According to the question&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(x+\\frac{1}{x}=7\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;squaring both sides, we get&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; (x)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ (1/x)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 2&amp;nbsp;&amp;times; x&amp;nbsp;&amp;times; 1/x = (7)&lt;sup&gt;2&lt;/sup&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; x&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 1/x&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 2 = 49&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; x&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 1/x&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= (49&amp;nbsp;&amp;ndash; 2)&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; x&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 1/x&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= 47&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&amp;there4; The required value is 47&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If x + y = 15 and xy = 14, then the value of x – y is :", "options": ["12", "14", "13", "11"], "correct": 3, "solution": "<p><strong>Given:</strong></p>\n\n<p>x + y = 15, xy = 14</p>\n\n<p><strong>Formula Used:</strong></p>\n\n<p>(x – y)<sup>2</sup> = (x + y)<sup>2</sup> – 4xy</p>\n\n<p><strong>Calculation:</strong></p>\n\n<p>⇒ (x – y)<sup>2</sup> = (15)<sup>2</sup> – 4 × 14 = 225 – 56 = 169</p>\n\n<p>∴ x – y = 13</p>\n", "marks": 2, "negMarks": 0.5}, {"text": "If a<sup>3</sup> + b<sup>3</sup> = 405 and a + b = 9, then the value of ab is", "options": ["10", "15", "12", "8"], "correct": 3, "solution": "<p><strong>Given:</strong></p>\n\n<p>a<sup>3</sup> + b<sup>3</sup> = 405</p>\n\n<p>a + b = 9</p>\n\n<p><strong>Formula used:</strong></p>\n\n<p>(a + b)<sup>3</sup> = a<sup>3</sup> + b<sup>3</sup> + 3ab(a + b)</p>\n\n<p><strong>Calculation:</strong></p>\n\n<p>Substituting the values in the formula</p>\n\n<p>⇒ (9)<sup>3 </sup>= 405 + 3ab (9)</p>\n\n<p>⇒ 729 = 405 + 27ab</p>\n\n<p>⇒ 27ab = 324</p>\n\n<p>⇒ ab = 12</p>\n\n<p><strong>∴ The value of ab is 12</strong></p>\n", "marks": 2, "negMarks": 0.5}, {"text": "The value of <span class=\"math-tex\">\\({{428 \\times 428 \\times 428 + 348 \\times 348 \\times 348} \\over 428 \\times 428 - 428 \\times 348 + 348 \\times 348}\\)</span>", "options": ["776", "62080", "80", "40"], "correct": 1, "solution": "<span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png\" width=\"26px\" /> <u style=\"font-size: 21px; font-weight: 700; display: inline !important;\">Shortcut Trick</u></span>\n<p>Identify the algebraic pattern: (a<sup>3</sup> + b<sup>3</sup>) &divide; (a<sup>2</sup> &minus; ab + b<sup>2</sup>).</p>\n<p>Using the identity a<sup>3</sup> + b<sup>3</sup> = (a + b)(a<sup>2</sup> &minus; ab + b<sup>2</sup>), the expression simplifies to (a + b).</p>\n<p>Here, a = 428 and b = 348.</p>\n<p>Required value = 428 + 348 = 776.</p>\n<p><strong>&there4; The correct answer is 776.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Alternate Method</u></span></strong></span></p>\n<p><strong>Given:</strong></p>\n<p>Expression = (428 &times; 428 &times; 428 + 348 &times; 348 &times; 348) &divide; (428 &times; 428 &minus; 428 &times; 348 + 348 &times; 348)</p>\n<p><strong>Formula Used:</strong></p>\n<p>a<sup>3</sup> + b<sup>3</sup> = (a + b)(a<sup>2</sup> &minus; ab + b<sup>2</sup>)</p>\n<p><strong>Calculations:</strong></p>\n<p>Let a = 428 and b = 348.</p>\n<p>&rArr; The given expression is in the form: (a<sup>3</sup> + b<sup>3</sup>) &divide; (a<sup>2</sup> &minus; ab + b<sup>2</sup>)</p>\n<p>&rArr; Substitute the identity: [(a + b)(a<sup>2</sup> &minus; ab + b<sup>2</sup>)] &divide; (a<sup>2</sup> &minus; ab + b<sup>2</sup>)</p>\n<p>&rArr; Cancel the common term (a<sup>2</sup> &minus; ab + b<sup>2</sup>) from the numerator and denominator.</p>\n<p>&rArr; Expression = a + b</p>\n<p>&rArr; Expression = 428 + 348</p>\n<p>&rArr; Expression = 776</p>\n<p><strong>&there4; The correct answer is 776.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Sum of Cubes Identity</p>\n<p style=\"margin:0 0 8px 0;color:#444444;\">The sum of cubes is factorized as a<sup>3</sup> + b<sup>3</sup> = (a + b)(a<sup>2</sup> &minus; ab + b<sup>2</sup>).</p>\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Difference of Cubes Identity</p>\n<p style=\"margin:0 0 8px 0;color:#444444;\">The difference of cubes is factorized as a<sup>3</sup> &minus; b<sup>3</sup> = (a &minus; b)(a<sup>2</sup> + ab + b<sup>2</sup>).</p>\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Basic Algebraic Square</p>\n<p style=\"margin:0 0 8px 0;color:#444444;\">The expansion of (a + b)<sup>2</sup> is a<sup>2</sup> + 2ab + b<sup>2</sup> and (a &minus; b)<sup>2</sup> is a<sup>2</sup> &minus; 2ab + b<sup>2</sup>.</p>", "marks": 2, "negMarks": 0.5}, {"text": "<span style=\"\">If <span class=\"math-tex\">\\(\\left( x + \\frac{1}{x} \\right) = 7\\)</span> where x > 0, the positive value of <span class=\"math-tex\">\\(\\left( x - \\frac{1}{x} \\right)\\)</span>is:</span>", "options": ["<span class=\"math-tex\">\\(5\\sqrt{4}\\)</span>", "<span class=\"math-tex\">\\(5\\sqrt{5}\\)</span>", "<span class=\"math-tex\">\\(3\\sqrt{5}\\)</span>", "<span class=\"math-tex\">\\(4\\sqrt{5}\\)</span>"], "correct": 3, "solution": "<p><span style='display: flex;gap: 6px;align-items: center;'><img height='26px' src='https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png' width='26px' /> <u style='font-size: 21px; font-weight: 700; display: inline !important;'>Shortcut Trick</u></span>\n<p>If x + 1/x = k, then the positive value of x &minus; 1/x = &radic;(k<sup>2</sup> &minus; 4).</p>\n<p>Given k = 7, substitute the value directly into the formula:</p>\n<p>x &minus; 1/x = &radic;(7<sup>2</sup> &minus; 4)</p>\n<p>x &minus; 1/x = &radic;(49 &minus; 4) = &radic;45 = 3&radic;5</p>\n<p><strong>&there4; The correct answer is 3&radic;5.</strong></p>\n\n<p><span style='display: flex;gap: 6px;align-items: center;'><img height='26px' src='https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png' width='26px' /><strong><span style='vertical-align: middle;font-size: 21px;'><u>Alternate Method</u></span></strong></span></p>\n<p><strong>Given:</strong></p>\n<p>x + 1/x = 7 (where x &gt; 0)</p>\n<p><strong>Formula Used:</strong></p>\n<p>(a &minus; b)<sup>2</sup> = (a + b)<sup>2</sup> &minus; 4ab</p>\n<p><strong>Calculations:</strong></p>\n<p>Let a = x and b = 1/x.</p>\n<p>&rArr; (x &minus; 1/x)<sup>2</sup> = (x + 1/x)<sup>2</sup> &minus; 4 &times; (x) &times; (1/x)</p>\n<p>&rArr; (x &minus; 1/x)<sup>2</sup> = 7<sup>2</sup> &minus; 4 &times; 1</p>\n<p>&rArr; (x &minus; 1/x)<sup>2</sup> = 49 &minus; 4</p>\n<p>&rArr; (x &minus; 1/x)<sup>2</sup> = 45</p>\n<p>Taking the square root on both sides:</p>\n<p>&rArr; x &minus; 1/x = &plusmn;&radic;45</p>\n<p>&rArr; x &minus; 1/x = &plusmn;3&radic;5</p>\n<p>Since the question specifically asks for the positive value:</p>\n<p>&rArr; x &minus; 1/x = 3&radic;5</p>\n<p><strong>&there4; The correct answer is 3&radic;5.</strong></p>\n\n<p><span style='display: flex;gap: 6px;align-items: center;'><img height='26px' src='https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png' width='26px' /><strong><span style='vertical-align: middle;font-size: 21px;'><u>Additional Information</u></span></strong></span></p>\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>Squares of Inverse Sums</p>\n<p style='margin:0 0 8px 0;color:#444444;'>If x + 1/x = k, then x<sup>2</sup> + 1/x<sup>2</sup> = k<sup>2</sup> &minus; 2.</p>\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>Cubes of Inverse Sums</p>\n<p style='margin:0 0 8px 0;color:#444444;'>If x + 1/x = k, then x<sup>3</sup> + 1/x<sup>3</sup> = k<sup>3</sup> &minus; 3k.</p>\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>Negative Inverse Conversion</p>\n<p style='margin:0 0 8px 0;color:#444444;'>If x &minus; 1/x = k, then x + 1/x = &plusmn;&radic;(k<sup>2</sup> + 4).</p>\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>Cubes of Negative Inverse Sums</p>\n<p style='margin:0 0 8px 0;color:#444444;'>If x &minus; 1/x = k, then x<sup>3</sup> &minus; 1/x<sup>3</sup> = k<sup>3</sup> + 3k.</p></p>", "marks": 2, "negMarks": 0.5}, {"text": "If <span class=\"math-tex\">\\(p + \\left( {\\frac{1}{p}} \\right) = 2\\)</span> find the value of p × p × p", "options": ["1", "2", "4", "8"], "correct": 1, "solution": "<p><strong>Given:</strong></p>\n\n<p>(p) + (1/p) = 2</p>\n\n<p><strong>Concept Used:</strong></p>\n\n<p>If (a) + (1/a) = 2, then a will always be equal to 1</p>\n\n<p><strong>Calculation:</strong></p>\n\n<p>Using concept,</p>\n\n<p>We get value of p = 1</p>\n\n<p>Then, </p>\n\n<p>p × p × p = (p)<sup>3</sup></p>\n\n<p>⇒ (p)<sup>3</sup> = (1)<sup>3</sup></p>\n\n<p><strong>∴ The value of p × p × p is 1</strong></p>\n", "marks": 2, "negMarks": 0.5}, {"text": "If a + b = 11 and ab = 15, then a<sup>2</sup> + b<sup>2</sup> is equal to:", "options": ["90", "91", "93", "92"], "correct": 2, "solution": "", "marks": 2, "negMarks": 0.5}, {"text": "(a + 2b)<sup>2</sup> - (a - 2b)<sup>2</sup> is equal to:", "options": ["6ab", "10ab", "8ab", "4ab"], "correct": 3, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;(a + 2b)&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;- (a - 2b)&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Formula:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;(x + y)&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;= x&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ y&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ 2xy&lt;/p&gt;\n\n&lt;p&gt;(x -&amp;nbsp;y)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= x&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+&amp;nbsp;y&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;-&amp;nbsp;2xy&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;(a + 2b)&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;- (a - 2b)&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; a&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 4b&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 4ab - (a&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ 4b&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;-&amp;nbsp;4ab)&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; a&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ 4b&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ 4ab -&amp;nbsp;a&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;-&amp;nbsp;4b&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ 4ab&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; 8ab&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If a + b + c = 13 and ab + bc + ca = 45, find a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup>. ", "options": ["79", "65", "57", "85"], "correct": 1, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;a + b + c = 13 and ab + bc + ca = 45&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Formula Used:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;(a + b + c)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= a&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ b&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ c&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 2(ab + bc + ca)&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;According to the formula,&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;(a + b + c)&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;= a&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;+ b&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;+ c&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;+ 2(ab + bc + ca)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;rArr; 13&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= a&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ b&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ c&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 2&amp;nbsp;&amp;times; 45&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;rArr; a&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ b&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ c&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= 169 - 90 = 79&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&amp;there4; The correct answer is option 1&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If a + b = 8 and ab = 12, then the value of a<sup>3</sup> + b<sup>3</sup> is:", "options": ["288", "96", "512", "224"], "correct": 4, "solution": "&lt;p&gt;&lt;strong&gt;Given -&amp;nbsp;&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;a + b = 8, ab = 12&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Formula used -&amp;nbsp;&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;(a + b)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= a&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ b&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 2ab&lt;/p&gt;\n\n&lt;p&gt;(a&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;+ b&lt;sup&gt;3&lt;/sup&gt;) = (a + b) (a&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;- ab + b&lt;sup&gt;2&lt;/sup&gt;)&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Solution -&amp;nbsp;&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;a+ b = 8, ab = 12&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; 8&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= a&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ b&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 2 &amp;times; 12&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; a&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ b&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= 40&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; a&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;+ b&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;= 8&amp;nbsp;&amp;times; (40 - 12) = 224&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&amp;there4; a&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;+ b&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;= 224.&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Short trick -&amp;nbsp;&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;put a = 6, b = 2 or a = 2, b = 6&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; Both satisfy the given expression.&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; a&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;+ b&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;= 6&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;+ 2&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;= 216 + 8 = 224&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;&amp;there4; a&lt;span style=&quot;position: relative; font-size: 10.5px; line-height: 0; vertical-align: baseline; top: -0.5em;&quot;&gt;3&lt;/span&gt;&amp;nbsp;+ b&lt;span style=&quot;position: relative; font-size: 10.5px; line-height: 0; vertical-align: baseline; top: -0.5em;&quot;&gt;3&lt;/span&gt;&amp;nbsp;= 224.&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;&lt;span style=&quot;display: flex;gap: 6px;align-items: center;&quot;&gt;&lt;img height=&quot;26px&quot; src=&quot;https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png&quot; width=&quot;26px&quot; /&gt;&lt;strong&gt;&lt;span style=&quot;vertical-align: middle;font-size: 21px;&quot;&gt;&lt;u&gt;Shortcut Trick&lt;/u&gt;&lt;/span&gt;&lt;/strong&gt;&lt;/span&gt;&lt;/span&gt;Go by hit and trial method&lt;/p&gt;\n\n&lt;p&gt;a + b = 8 and ab = 12&lt;/p&gt;\n\n&lt;p&gt;put a = 6 and b = 2&lt;/p&gt;\n\n&lt;p&gt;&amp;there4; a&lt;sup&gt;3&amp;nbsp;&lt;/sup&gt;+ b&lt;sup&gt;3&amp;nbsp;&lt;/sup&gt;= 224.&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If x - 1/x = 4, then x<sup>3</sup> - 1/x<sup>3</sup> is equal to∶", "options": ["72", "68", "76", "64"], "correct": 3, "solution": "<p>As we know,</p>\n\n<p>If x - 1/x = a, then, x<sup>3</sup> - 1/x<sup>3</sup> = a<sup>3</sup> + 3a</p>\n\n<p>x - 1/x = 4</p>\nx<sup>3</sup> - 1/x<sup>3</sup> = 4<sup>3</sup> + 3 × 4 = 64 + 12 = 76", "marks": 2, "negMarks": 0.5}, {"text": "If <span class=\"math-tex\">\\(\\left( {x + \\frac{1}{x}} \\right)\\)</span> = 8.5, what is the value of <span class=\"math-tex\">\\(\\left( {{x^2} + \\frac{1}{{{x^2}}}} \\right)\\)</span>", "options": ["70.25", "74.25", "72.25", "75.25"], "correct": 1, "solution": "<p><strong>Given:</strong></p>\n\n<p><span class=\"math-tex\">\\(\\left(x+\\frac{1}{x}\\right)=8.5\\)</span></p>\n\n<p><strong>Concept Used:</strong></p>\n\n<p><span class=\"math-tex\">\\((a+b)^2=a^2+b^2+2ab\\)</span></p>\n\n<p><strong>Calculation:</strong></p>\n\n<p>⇒ <span class=\"math-tex\">\\(\\left(x+\\frac{1}{x}\\right)^2=x^2+\\frac{1}{x^2}+2\\)</span></p>\n\n<p>⇒ Putting the values,</p>\n\n<p>⇒ <span class=\"math-tex\">\\(x^2+\\frac{1}{x^2}=(8.5)^2-2\\)</span></p>\n\n<p>⇒ <span class=\"math-tex\">\\(x^2+\\frac{1}{x^2}=72.25-2=70.25\\)</span></p>\n\n<p><strong>Hence, the value of the given expression is 70.25</strong></p>\n", "marks": 2, "negMarks": 0.5}, {"text": "If x - y = 4 and xy = 45, then the value of x<sup>3</sup> - y<sup>3</sup> is:", "options": ["82", "604", "822", "151"], "correct": 2, "solution": "&lt;p&gt;&lt;strong&gt;&lt;span style=&quot;display: flex;gap: 6px;align-items: center;&quot;&gt;&lt;img height=&quot;26px&quot; src=&quot;https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png&quot; width=&quot;26px&quot; /&gt;&amp;nbsp;&lt;strong&gt;&lt;span style=&quot;vertical-align: middle;font-size: 21px;&quot;&gt;&lt;u&gt;Shortcut Trick&lt;/u&gt;&lt;/span&gt;&lt;/strong&gt;&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;x - y = 4 and xy = 45&lt;/p&gt;\n\n&lt;p&gt;Put x = 9 and y = 5&lt;/p&gt;\n\n&lt;p&gt;x&lt;sup&gt;3&lt;/sup&gt; - y&lt;sup&gt;3&lt;/sup&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; 9&lt;sup&gt;3&lt;/sup&gt; - 5&lt;sup&gt;3&lt;/sup&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; 729 - 125&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; 604&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Detailed solution:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;x - y = 4 and xy = 45&lt;/p&gt;\n\n&lt;p&gt;(x&lt;sup&gt;3&lt;/sup&gt; - y&lt;sup&gt;3&lt;/sup&gt;) = (x - y) [(x - y)&lt;sup&gt;2&lt;/sup&gt; + 3xy]&lt;/p&gt;\n\n&lt;p&gt;x&lt;sup&gt;3&lt;/sup&gt; - y&lt;sup&gt;3&lt;/sup&gt; = 4 [4&lt;sup&gt;2&lt;/sup&gt; + 3 &amp;times; 45] [&lt;strong&gt;Hint: &lt;/strong&gt;Answer will be divisible by 4, only 1 option 604 divisible by 4.]&lt;/p&gt;\n\n&lt;p&gt;x&lt;sup&gt;3&lt;/sup&gt; - y&lt;sup&gt;3&lt;/sup&gt; = 4 [16 + 135]&lt;/p&gt;\nx&lt;sup&gt;3&lt;/sup&gt; - y&lt;sup&gt;3&lt;/sup&gt; = 4 &amp;times; 151 = ", "marks": 2, "negMarks": 0.5}, {"text": "If <span class=\"math-tex\">\\({k^4} + \\frac{1}{{{k^4}}} = 47\\)</span>, then what is the value of <span class=\"math-tex\">\\({k^3} + \\frac{1}{{{k^3}}}\\)</span>?", "options": ["4.5", "54", "18", "9"], "correct": 3, "solution": "<span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png\" width=\"26px\" /> <u style=\"font-size: 21px; font-weight: 700; display: inline !important;\">Shortcut Trick</u></span>\n<p>If <strong>k<sup>4</sup> + 1/k<sup>4</sup> = a</strong>, then <strong>k<sup>2</sup> + 1/k<sup>2</sup> = &radic;(a + 2)</strong>.</p>\n<p>If <strong>k<sup>2</sup> + 1/k<sup>2</sup> = b</strong>, then <strong>k + 1/k = &radic;(b + 2)</strong>.</p>\n<p>If <strong>k + 1/k = x</strong>, then <strong>k<sup>3</sup> + 1/k<sup>3</sup> = x<sup>3</sup> &minus; 3x</strong>.</p>\n<p>Here, x = &radic;(&radic;(47 + 2) + 2) = &radic;(7 + 2) = 3.</p>\n<p>Required value = 3<sup>3</sup> &minus; 3(3) = 27 &minus; 9 = 18.</p>\n<p><strong>&there4; The correct answer is 18.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Alternate Method</u></span></strong></span></p>\n<p><strong>Given:</strong> k<sup>4</sup> + 1/k<sup>4</sup> = 47</p>\n<p><strong>Formula Used:</strong> (a + b)<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup> + 2ab and (a + b)<sup>3</sup> = a<sup>3</sup> + b<sup>3</sup> + 3ab(a + b)</p>\n<p>&rArr; k<sup>4</sup> + 1/k<sup>4</sup> + 2 = 47 + 2</p>\n<p>&rArr; (k<sup>2</sup>)<sup>2</sup> + (1/k<sup>2</sup>)<sup>2</sup> + 2(k<sup>2</sup>)(1/k<sup>2</sup>) = 49</p>\n<p>&rArr; (k<sup>2</sup> + 1/k<sup>2</sup>)<sup>2</sup> = 49</p>\n<p>&rArr; k<sup>2</sup> + 1/k<sup>2</sup> = 7</p>\n<p>&rArr; k<sup>2</sup> + 1/k<sup>2</sup> + 2 = 7 + 2</p>\n<p>&rArr; (k + 1/k)<sup>2</sup> = 9</p>\n<p>&rArr; k + 1/k = 3</p>\n<p>Now, finding the value of k<sup>3</sup> + 1/k<sup>3</sup>:</p>\n<p>&rArr; (k + 1/k)<sup>3</sup> = k<sup>3</sup> + 1/k<sup>3</sup> + 3(k)(1/k)(k + 1/k)</p>\n<p>&rArr; (3)<sup>3</sup> = k<sup>3</sup> + 1/k<sup>3</sup> + 3(3)</p>\n<p>&rArr; 27 = k<sup>3</sup> + 1/k<sup>3</sup> + 9</p>\n<p>&rArr; k<sup>3</sup> + 1/k<sup>3</sup> = 27 &minus; 9</p>\n<p>&rArr; k<sup>3</sup> + 1/k<sup>3</sup> = 18</p>\n<p><strong>&there4; The correct answer is 18.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Algebraic Reciprocal Square Identity</p>\n<p style=\"margin:0 0 8px 0;color:#444444;\">If k + 1/k = x, then k<sup>2</sup> + 1/k<sup>2</sup> = x<sup>2</sup> &minus; 2.</p>\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Algebraic Reciprocal Cube Identity</p>\n<p style=\"margin:0 0 8px 0;color:#444444;\">If k + 1/k = x, then k<sup>3</sup> + 1/k<sup>3</sup> = x<sup>3</sup> &minus; 3x.</p>\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Negative Reciprocal Identity</p>\n<p style=\"margin:0 0 8px 0;color:#444444;\">If k &minus; 1/k = x, then k<sup>2</sup> + 1/k<sup>2</sup> = x<sup>2</sup> + 2 and k<sup>3</sup> &minus; 1/k<sup>3</sup> = x<sup>3</sup> + 3x.</p>\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Power 4 from Power 1</p>\n<p style=\"margin:0 0 8px 0;color:#444444;\">If k + 1/k = x, then k<sup>4</sup> + 1/k<sup>4</sup> = (x<sup>2</sup> &minus; 2)<sup>2</sup> &minus; 2.</p>", "marks": 2, "negMarks": 0.5}, {"text": "If <span class=\"math-tex\">\\(x^4+\\frac{1}{x^4}=1154,x>0,\\)</span>, then what will be the value of <span class=\"math-tex\">\\(x+\\frac{1}{x}?\\)</span>", "options": ["√34", "√32", "18", "6"], "correct": 4, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(x^4+\\frac{1}{x^4}=1154,x&amp;gt;0,\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Formula used:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;(a + b)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= a&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ b&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 2ab&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(x^4+\\frac{1}{x^4}=1154,x&amp;gt;0,\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;Adding 2 both sides, we get&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; (x&lt;sup&gt;4&lt;/sup&gt;&amp;nbsp;+ 1/x&lt;sup&gt;4&lt;/sup&gt;) + 2 = 1154 + 2&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; (x&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 1/x&lt;sup&gt;2&lt;/sup&gt;)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= 1156&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; (x&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 1/x&lt;sup&gt;2&lt;/sup&gt;) = 34&lt;/p&gt;\n\n&lt;p&gt;Now,&lt;/p&gt;\n\n&lt;p&gt;Again adding 2 both sides, we get&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;&lt;span style=&quot;&quot;&gt;(x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ 1/x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;) + 2 = 34 + 2&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;(x&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ 1/x&lt;/span&gt;&lt;span style=&quot;&quot;&gt;)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= 36&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; (x + 1/x) = 6&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&lt;strong&gt;&amp;there4;&lt;/strong&gt; &lt;strong&gt;The required value is 6&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "The value of (x + y)<sup>2</sup> + (x - y)<sup>2</sup> is equal to:", "options": ["2(x + y)<sup>2</sup>", "2(x<sup>2</sup> + y<sup>2</sup>)", "(2x + 2y)<sup>2</sup>", "4xy"], "correct": 2, "solution": "<p><span style='display: flex;gap: 6px;align-items: center;'><img height='26px' src='https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png' width='26px' /> <u style='font-size: 21px; font-weight: 700; display: inline !important;'>Shortcut Trick</u></span>\n<p>Directly apply the standard algebraic identity:</p>\n<p>(a + b)<sup>2</sup> + (a &minus; b)<sup>2</sup> = 2(a<sup>2</sup> + b<sup>2</sup>)</p>\n<p>Substitute a = x and b = y in the formula:</p>\n<p>(x + y)<sup>2</sup> + (x &minus; y)<sup>2</sup> = 2(x<sup>2</sup> + y<sup>2</sup>)</p>\n<p><strong>&there4; The correct answer is 2(x<sup>2</sup> + y<sup>2</sup>).</strong></p>\n\n<p><span style='display: flex;gap: 6px;align-items: center;'><img height='26px' src='https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png' width='26px' /><strong><span style='vertical-align: middle;font-size: 21px;'><u>Alternate Method</u></span></strong></span></p>\n<p><strong>Given:</strong></p>\n<p>Expression: (x + y)<sup>2</sup> + (x &minus; y)<sup>2</sup></p>\n<p><strong>Formula Used:</strong></p>\n<p>(a + b)<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup> + 2ab</p>\n<p>(a &minus; b)<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup> &minus; 2ab</p>\n<p><strong>Calculations:</strong></p>\n<p>&rArr; Expanding the first term: (x + y)<sup>2</sup> = x<sup>2</sup> + y<sup>2</sup> + 2xy</p>\n<p>&rArr; Expanding the second term: (x &minus; y)<sup>2</sup> = x<sup>2</sup> + y<sup>2</sup> &minus; 2xy</p>\n<p>&rArr; Adding both the expanded terms together:</p>\n<p>&rArr; (x<sup>2</sup> + y<sup>2</sup> + 2xy) + (x<sup>2</sup> + y<sup>2</sup> &minus; 2xy)</p>\n<p>&rArr; Group the like terms together:</p>\n<p>&rArr; x<sup>2</sup> + x<sup>2</sup> + y<sup>2</sup> + y<sup>2</sup> + 2xy &minus; 2xy</p>\n<p>&rArr; The + 2xy and &minus; 2xy cancel each other out.</p>\n<p>&rArr; 2x<sup>2</sup> + 2y<sup>2</sup></p>\n<p>&rArr; Taking 2 common from both the terms:</p>\n<p>&rArr; 2(x<sup>2</sup> + y<sup>2</sup>)</p>\n<p><strong>&there4; The correct answer is 2(x<sup>2</sup> + y<sup>2</sup>).</strong></p>\n\n<p><span style='display: flex;gap: 6px;align-items: center;'><img height='26px' src='https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png' width='26px' /><strong><span style='vertical-align: middle;font-size: 21px;'><u>Additional Information</u></span></strong></span></p>\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>Difference of Perfect Squares</p>\n<p style='margin:0 0 8px 0;color:#444444;'>When the perfect squares are subtracted instead of added, the identity becomes: (a + b)<sup>2</sup> &minus; (a &minus; b)<sup>2</sup> = 4ab.</p>\n\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>Difference of Squares</p>\n<p style='margin:0 0 8px 0;color:#444444;'>The difference between two squared terms factors into the product of the sum and difference of the base terms: a<sup>2</sup> &minus; b<sup>2</sup> = (a &minus; b)(a + b).</p>\n\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>Sum and Difference of Cubes</p>\n<p style='margin:0 0 8px 0;color:#444444;'>For sum of cubes: a<sup>3</sup> + b<sup>3</sup> = (a + b)(a<sup>2</sup> &minus; ab + b<sup>2</sup>). For difference of cubes: a<sup>3</sup> &minus; b<sup>3</sup> = (a &minus; b)(a<sup>2</sup> + ab + b<sup>2</sup>).</p>\n\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>Square of Trinomial</p>\n<p style='margin:0 0 8px 0;color:#444444;'>The expansion of three combined terms squared is given by: (a + b + c)<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup> + 2ab + 2bc + 2ca.</p></p>", "marks": 2, "negMarks": 0.5}, {"text": "If <span class=\"math-tex\">\\(\\rm k^4+\\frac{1}{k^4}=194\\)</span>, then what is the value of <span class=\"math-tex\">\\(\\rm k^3+\\frac{1}{k^3}\\)</span>?", "options": ["42", "52", "36", "18"], "correct": 2, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\rm k^4+\\frac{1}{k^4}=194\\)&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Concept used:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\rm (a+\\frac{1}{a})^2=\\rm a^2+\\frac{1}{a^2} + 2\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;If&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\rm (a+\\frac{1}{a})=b\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;Then,&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\rm a^3+\\frac{1}{a^3} =b^3-3b\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\rm k^4+\\frac{1}{k^4}=194\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\rm k^4+\\frac{1}{k^4}+2=194+2\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;/span&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\rm k^4+\\frac{1}{k^4}+2=196\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;/span&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\rm( k^2+\\frac{1}{k^2})^2=14^2\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;/span&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\rm k^2+\\frac{1}{k^2}=14\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;/span&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\rm k^2+\\frac{1}{k^2}+2=14+2\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;/span&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\rm (k+\\frac{1}{k})^2=16\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;/span&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\rm (k+\\frac{1}{k})^2=4^2\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;/span&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\rm k+\\frac{1}{k}=4\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;Now,&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\rm k^3+\\frac{1}{k^3}\\)&lt;/span&gt;&amp;nbsp;= 4&lt;sup&gt;3&lt;/sup&gt; - 3&amp;nbsp;&amp;times; 4&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\rm k^3+\\frac{1}{k^3}\\)&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;= 64&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;- 12&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;/span&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\rm k^3+\\frac{1}{k^3}\\)&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;= 52&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&lt;span style=&quot;&quot;&gt;&amp;there4; Ther required answer is 52.&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&lt;span style=&quot;&quot;&gt;&lt;span style=&quot;display: flex;gap: 6px;align-items: center;&quot;&gt;&lt;img height=&quot;26px&quot; src=&quot;https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png&quot; width=&quot;26px&quot; /&gt;&amp;nbsp;&lt;strong&gt;&lt;span style=&quot;vertical-align: middle;font-size: 21px;&quot;&gt;&lt;u&gt;Shortcut Trick&lt;/u&gt;&lt;/span&gt;&lt;/strong&gt;&lt;/span&gt;&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;We know,&lt;/p&gt;\n\n&lt;p&gt;&amp;bull; If k&lt;sup&gt;4&lt;/sup&gt; + 1/k&lt;sup&gt;4&lt;/sup&gt;&lt;strong&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/strong&gt;&amp;nbsp;= a then k&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 1/k&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;=&amp;nbsp;&amp;radic;(a + 2)&lt;/p&gt;\n\n&lt;p&gt;&amp;bull; If&amp;nbsp;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;k&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;+ 1/k&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;=&amp;nbsp;&lt;/span&gt;b then k + 1/k =&amp;nbsp;&amp;radic;(b + 2)&lt;/p&gt;\n\n&lt;p&gt;&amp;bull;&amp;nbsp;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;If&amp;nbsp;k + 1/k = c&amp;nbsp;then k&lt;sup&gt;3&lt;/sup&gt; + 1/k&lt;sup&gt;3&lt;/sup&gt; = c&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;- 3c&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;So,&amp;nbsp;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;k&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;4&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;+ 1/k&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;4&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;= 194 then&amp;nbsp;&amp;nbsp;k&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;+ 1/k&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;=&amp;nbsp;&amp;radic;196 = 14 so,&amp;nbsp;k + 1/k =&amp;nbsp;&amp;radic;16 = 4&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;Then, k&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;+ 1/k&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;= 4&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;- 12 = 52&lt;/span&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "The value of <span class=\"math-tex\">\\(\\frac{1.6\\times1.6\\times1.6-0.6\\times0.6\\times0.6}{1.6\\times1.6+1.6\\times0.6+0.6\\times0.6}\\)</span> is:", "options": ["0", "1", "-1", "2"], "correct": 2, "solution": "&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;Given:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{1.6\\times1.6\\times1.6-0.6\\times0.6\\times0.6}{1.6\\times1.6+1.6\\times0.6+0.6\\times0.6}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;Concept used:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;a&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;- b&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;= (a - b)(a&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&amp;nbsp;&lt;/span&gt;+ b&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ ab)&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;Calculation:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{1.6\\times1.6\\times1.6-0.6\\times0.6\\times0.6}{1.6\\times1.6+1.6\\times0.6+0.6\\times0.6}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{1.6^3-0.6^3}{1.6^2+1.6\\times0.6+0.6^2}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{(1.6-0.6)(1.6^2+1.6\\times0.6+0.6^2)}{1.6^2+1.6\\times0.6+0.6^2}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&amp;rArr; 1.6 - 0.6&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&amp;rArr; 1&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;&amp;there4; The required answer is 1.&lt;/span&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If <span class=\"math-tex\">\\(\\left(y-\\frac{1}{y}\\right)=8\\)</span>, find the value of <span class=\"math-tex\">\\(\\left(y^2+\\frac{1}{y^2}\\right)\\)</span>.", "options": ["64", "62", "60", "66"], "correct": 4, "solution": "<p><strong>Given : </strong></p>\n\n<p><strong><span class=\"math-tex\">\\(\\left(y-\\frac{1}{y}\\right)=8\\)</span></strong></p>\n\n<p><strong>Formula Used : </strong></p>\n\n<p>(a - b)<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup> - 2ab</p>\n\n<p><strong>Calculation : </strong></p>\n\n<p>⇒ 64 = y<sup>2</sup> + 1/y<sup>2</sup> - 2</p>\n\n<p>⇒ y<sup>2</sup> + 1/y<sup>2</sup> = 64 + 2</p>\n\n<p>⇒ 66</p>\n\n<p><strong>∴ The correct answer is 66.</strong></p>\n", "marks": 2, "negMarks": 0.5}, {"text": "If x + y = 5  and x<sup>2</sup> + y<sup>2</sup> = 17 then the value of <span class=\"math-tex\">\\(〖(x-y)〗^2\\)</span> is equal to:", "options": ["9", "16", "4", "25"], "correct": 1, "solution": "&lt;p&gt;&lt;b&gt;Given:&lt;/b&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; x + y = 5&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; x&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ y&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;= 17&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Formula:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; (a + b)&lt;sup&gt;2&lt;/sup&gt; = a&lt;sup&gt;2&lt;/sup&gt; + b&lt;sup&gt;2&lt;/sup&gt; + 2ab&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; (a -&amp;nbsp;b)&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;= a&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ b&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;-&amp;nbsp;2ab&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; (x + y)&lt;sup&gt;2&lt;/sup&gt; = x&lt;sup&gt;2&lt;/sup&gt; + y&lt;sup&gt;2&lt;/sup&gt; + 2xy&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; 2xy = 25 - 17 = 8&lt;/p&gt;\n\n&lt;p&gt;Then,&lt;/p&gt;\n\n&lt;p&gt;(x - y)&lt;sup&gt;2&lt;/sup&gt; = x&lt;sup&gt;2&lt;/sup&gt; + y&lt;sup&gt;2&lt;/sup&gt; - 2xy&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;= 17 - 8&amp;nbsp;&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;= 9&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&amp;there4;&amp;nbsp;(x - y)&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;= 9&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;display: flex;gap: 6px;align-items: center;&quot;&gt;&lt;img height=&quot;26px&quot; src=&quot;https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png&quot; width=&quot;26px&quot; /&gt;&lt;strong&gt;&lt;span style=&quot;vertical-align: middle;font-size: 21px;&quot;&gt;&lt;u&gt;Shortcut Trick&lt;/u&gt;&lt;/span&gt;&lt;/strong&gt;&lt;/span&gt;Put x = 4 and y = 1, it satisfies the condition given in the question.&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;(x - y)&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;= (4 - 1)&lt;sup&gt;2&lt;/sup&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; 9&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;font-weight: 700; &quot;&gt;&amp;there4;&amp;nbsp;(x - y)&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;= 9&lt;/span&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If x + y + z = 4 and x<sup>2</sup> + y<sup>2</sup> + z<sup>2</sup> = 12, then find xy + yz + xz.", "options": ["4", "6", "7", "2"], "correct": 4, "solution": "&lt;p style=&quot;color: rgb(30, 43, 51);   user-select: text !important; pointer-events: initial !important;&quot;&gt;&lt;strong&gt;Formula used&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p style=&quot;color: rgb(30, 43, 51);   user-select: text !important; pointer-events: initial !important;&quot;&gt;&lt;span style=&quot;color: rgb(30, 43, 51);&quot;&gt;(x + y + z)&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em; user-select: text !important; pointer-events: initial !important;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;color: rgb(30, 43, 51);&quot;&gt;&amp;nbsp;=&amp;nbsp;x&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em; user-select: text !important; pointer-events: initial !important;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;color: rgb(30, 43, 51);&quot;&gt;&amp;nbsp;+ y&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em; user-select: text !important; pointer-events: initial !important;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;color: rgb(30, 43, 51);&quot;&gt;&amp;nbsp;+ z&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em; user-select: text !important; pointer-events: initial !important;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;color: rgb(30, 43, 51);&quot;&gt;&amp;nbsp;+ 2(xy + yz + zx)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;color: rgb(30, 43, 51);   user-select: text !important; pointer-events: initial !important;&quot;&gt;&lt;strong&gt;Calculation&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p style=&quot;color: rgb(30, 43, 51);   user-select: text !important; pointer-events: initial !important;&quot;&gt;x + y + z = 4&lt;/p&gt;\n\n&lt;p style=&quot;color: rgb(30, 43, 51);   user-select: text !important; pointer-events: initial !important;&quot;&gt;Squaring both the sides&lt;/p&gt;\n\n&lt;p style=&quot;color: rgb(30, 43, 51);   user-select: text !important; pointer-events: initial !important;&quot;&gt;&amp;rArr; (x + y + z)&lt;sup style=&quot;user-select: text !important; pointer-events: initial !important;&quot;&gt;2&lt;/sup&gt;&amp;nbsp;= 4&lt;sup style=&quot;user-select: text !important; pointer-events: initial !important;&quot;&gt;2&lt;/sup&gt;&lt;/p&gt;\n\n&lt;p style=&quot;color: rgb(30, 43, 51);   user-select: text !important; pointer-events: initial !important;&quot;&gt;&amp;rArr; x&lt;sup style=&quot;user-select: text !important; pointer-events: initial !important;&quot;&gt;2&lt;/sup&gt;&amp;nbsp;+ y&lt;sup style=&quot;user-select: text !important; pointer-events: initial !important;&quot;&gt;2&lt;/sup&gt;&amp;nbsp;+ z&lt;sup style=&quot;user-select: text !important; pointer-events: initial !important;&quot;&gt;2&lt;/sup&gt;&amp;nbsp;+ 2(xy + yz + zx) = 16&lt;/p&gt;\n\n&lt;p style=&quot;color: rgb(30, 43, 51);   user-select: text !important; pointer-events: initial !important;&quot;&gt;&amp;rArr; 2(xy + yz + zx) = 16 &amp;ndash; 12&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(30, 43, 51);  &quot;&gt;&amp;rArr; xy + yz + zx = 2&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&lt;span style=&quot;color: rgb(30, 43, 51);  &quot;&gt;The answer is 2.&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If a + b + c = 7 and ab + bc + ca = –6, then the value of a<sup>3</sup> + b<sup>3</sup> + c<sup>3</sup> – 3abc is:", "options": ["469", "472", "463", "479"], "correct": 1, "solution": "<p>As we know,</p>\n\n<p>a<sup>3</sup> + b<sup>3</sup> + c<sup>3</sup> – 3abc = (a + b + c) [(a + b + c)<sup>2</sup> – 3 (ab + bc + ca)]</p>\n⇒ a<sup>3</sup> + b<sup>3</sup> + c<sup>3</sup> – 3abc = 7 [7<sup>2</sup> – 3 (–6)] = 7 [49 + 18] = 7 × 67 = 469", "marks": 2, "negMarks": 0.5}, {"text": "If a - b = 5 and ab = 24, find the value of a<sup>3</sup> - b<sup>3</sup>. ", "options": ["455", "485", "385", "360"], "correct": 2, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;a - b = 5 and ab = 24&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Formula Used:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;a&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;- b&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;= (a - b) (a&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ ab + b&lt;sup&gt;2&lt;/sup&gt;)&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;a - b = 5&lt;/p&gt;\n\n&lt;p&gt;Squaring both side,&lt;/p&gt;\n\n&lt;p&gt;(a - b)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= 5&lt;sup&gt;2&lt;/sup&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; a&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ b&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;- 2ab = 25&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;a&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;+ b&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= 25 + 2(24) = 73&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;a&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;- b&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;= (a - b) (a&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;+ ab + b&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;Putting all the values from above,&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;rArr;&amp;nbsp;a&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;- b&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;= 5 &amp;times; (73 +&amp;nbsp;24) = 5 &amp;times; 97 = 485&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;there4; The correct answer is 485.&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If x = -2 and y = 1, then what is the value of <span class=\"math-tex\">\\(\\left( \\frac{4}{x} + y \\right) \\left( \\frac{16}{x^2} + y^2 - \\frac{4y}{x} \\right)\\)</span> ?", "options": ["-5", "7", "-7", "5"], "correct": 3, "solution": "<p><strong>Given:</strong></p>\n\n<p>x = -2 and y = 1</p>\n\n<p><strong>Calculation:</strong></p>\n\n<p><span class=\"math-tex\">\\(\\left( \\frac{4}{x} + y \\right) \\left( \\frac{16}{x^2} + y^2 - \\frac{4y}{x} \\right)\\)</span></p>\n\n<p><span class=\"math-tex\">\\(\\left( \\frac{4}{-2} + 1 \\right) \\left( \\frac{16}{(-2)^2} + 1^2 - \\frac{4}{-2} \\right)\\)</span></p>\n\n<p>(-2 + 1)(4 + 1 + 2)</p>\n\n<p>-7</p>\n\n<p><strong>∴ Option 3 is the correct answer.</strong></p>\n", "marks": 2, "negMarks": 0.5}, {"text": "If x – 1/x = 3√2, then x<sup>2</sup> + 1/x<sup>2</sup> is equal to∶", "options": ["52", "56", "20", "46"], "correct": 3, "solution": "&lt;p&gt;&lt;strong&gt;Short Trick&lt;/strong&gt;&lt;strong&gt;∶&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;We know that, if x &amp;ndash; 1/x = a, then x&lt;sup&gt;2&lt;/sup&gt; + 1/x&lt;sup&gt;2&lt;/sup&gt; = a&lt;sup&gt;2&lt;/sup&gt; + 2&lt;/p&gt;\n\n&lt;p&gt;Here x &amp;ndash; 1/x = 3&amp;radic;2&lt;/p&gt;\n\n&lt;p&gt;&amp;there4; x&lt;sup&gt;2&lt;/sup&gt; + 1/x&lt;sup&gt;2&lt;/sup&gt; = (3&amp;radic;2)&lt;sup&gt;2&lt;/sup&gt; + 2 = 18 + 2 = 20&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Detailed Solution&lt;/strong&gt;&lt;strong&gt;∶&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;We know that, (a &amp;ndash; b)&lt;sup&gt;2&lt;/sup&gt; = a&lt;sup&gt;2&lt;/sup&gt; + b&lt;sup&gt;2&lt;/sup&gt; &amp;ndash; 2ab&lt;/p&gt;\n\n&lt;p&gt;Here a = x, b = 1/x, (a &amp;ndash; b) = x &amp;ndash; 1/x = 3&amp;radic;2&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\therefore \\;{\\left( {x - \\frac{1}{x}} \\right)^2}\\; = \\;{x^2}\\; + \\;\\frac{1}{{{x^2}}} - 2\\;\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\Rightarrow \\;{\\left( {3\\surd 2} \\right)^2}\\; = \\;{x^2}\\; + \\;\\frac{1}{{{x^2}}} - 2\\;\\)&lt;/span&gt;&lt;/p&gt;\n&lt;span class=&quot;math-tex&quot;&gt;\\(\\Rightarrow \\;{x^2}\\; + \\;\\frac{1}{{{x^2}}}\\; = \\;18\\; + \\;2\\; = \\;20\\)&lt;/span&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If m and n are two positive real numbers such that 9m<sup>2</sup> + n<sup>2</sup> = 40 and mn = 4, then the value of 3m + n is:", "options": ["160", "64", "10 ", "8"], "correct": 4, "solution": "<p><strong>Given:</strong></p>\n\n<p>9m² + n² = 40</p>\n\n<p>mn = 4</p>\n\n<p><strong>Calculations:</strong></p>\n\n<p>9m² + n² = 40</p>\n\n<p>On adding 6mn both sides, we get:</p>\n\n<p>9m² + n² + 6mn = 40 + 6mn</p>\n\n<p>⇒(3m)² + n² + 2(3m)n = 40 + 6(4)</p>\n\n<p>⇒(3m + n)² = 64</p>\n\n<p>⇒ 3m + n = √64 = 8</p>\n\n<p><strong>Hence, The Required value is 8.</strong></p>\n", "marks": 2, "negMarks": 0.5}, {"text": "<p>Simplify the given expression.</p>\n\n<p><span class=\"math-tex\">\\(\\frac{(x^3-y^3)(x+y)}{x^2+xy+y^2}\\)</span></p>\n", "options": ["x - y", "x<sup>2</sup> - y<sup>2</sup>", "x + y", "<span style=\"color: rgb(33, 37, 41);\">x</span><span style=\"position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;\">2</span><span style=\"color: rgb(33, 37, 41);\"> + y</span><span style=\"position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;\">2</span>"], "correct": 2, "solution": "&lt;p&gt;&lt;strong&gt;Formula used:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;(a&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;- b&lt;sup&gt;3&lt;/sup&gt;) = (a - b)&amp;nbsp;&amp;times;&amp;nbsp;(a&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ ab + b&lt;sup&gt;2&lt;/sup&gt;)&lt;/p&gt;\n\n&lt;p&gt;(a&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;- b&lt;sup&gt;2&lt;/sup&gt;) = (a + b)&amp;nbsp;&amp;times; (a - b)&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{(x^3-y^3)(x+y)}{x^2+xy+y^2}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; {(x - y)&amp;nbsp;&amp;times; (x&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ xy + y&lt;sup&gt;2&lt;/sup&gt;)&amp;nbsp;&amp;times; (x + y)}/&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;(x&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;+ xy + y&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;rArr; (x - y)&amp;nbsp;&amp;times;&amp;nbsp;(x + y)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;rArr;&amp;nbsp;(x&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;- y&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&amp;there4; The correct answer is &lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;(x&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41); position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;- y&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41); position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;)&lt;/span&gt;.&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If x and y are positive numbers such that x - y = 5 and xy = 150, then the value of (x + y)", "options": ["45", "25", "35", "15"], "correct": 2, "solution": "<p><strong>Given:</strong></p>\n\n<p>x - y = 5 and xy = 150</p>\n\n<p><strong>Calculation:</strong></p>\n\n<p>So from the equation we can assume the possible values of x and y</p>\n\n<p>So x = 15 and y = 10</p>\n\n<p>So X + Y = 25</p>\n\n<p><strong>∴ The correct answer is 2</strong></p>\n", "marks": 2, "negMarks": 0.5}, {"text": "(ax + by) is a factor of:", "options": ["a<sup>2</sup>x<sup>2</sup> + 2ab + b<sup>2</sup>y<sup>2</sup>", "a<span style=\"position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;\">2</span>x<span style=\"position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;\">2</span> + 2ab + b<span style=\"position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;\">2</span>y<span style=\"position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;\">2</span>x", "a<span style=\"position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;\">2</span>x<span style=\"position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;\">2</span> + 2abxy + b<span style=\"position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;\">2</span>y<span style=\"position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;\">2</span>", "a<span style=\"position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;\">2</span>x<span style=\"position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;\">2</span> + 2ab - b<span style=\"position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;\">2</span>y<span style=\"position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;\">2</span>"], "correct": 3, "solution": "<p><strong>Concept used :</strong></p>\n\n<p>(a + b)<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup> + ab</p>\n\n<p><strong>Calculations :</strong></p>\n\n<p>(ax + by)<sup>2</sup> = a<sup>2</sup>x<sup>2</sup> + 2abxy + b<sup>2</sup>y<sup>2</sup></p>\n\n<p>Out of all options, we can see only one option matches the value </p>\n\n<p>∴ <strong>Option 3 will be the right answer </strong></p>\n", "marks": 2, "negMarks": 0.5}, {"text": "Find the product of (a + b + 2c) (a<sup>2</sup> + b<sup>2</sup> + 4c<sup>2</sup>– ab – 2bc – 2ca).", "options": ["a<sup>3</sup> + b<sup>3</sup> + 8c<sup>3</sup>–abc", "a<sup>3</sup> + b<sup>3</sup> + 8c<sup>3</sup>– 6abc", "a<sup>3</sup> + b<sup>3</sup> + 8c<sup>3</sup>– 2abc", "a<sup>3</sup> + b<sup>3</sup> + 6c<sup>3</sup>– 6abc"], "correct": 2, "solution": "<p>(a + b + 2c) (a<sup>2</sup> + b<sup>2</sup> + 4c<sup>2</sup> – ab – 2bc – 2ca)</p>\n\n<p>⇒ a<sup>3</sup> + b<sup>3</sup> + 8c<sup>3</sup> – 6abc</p>\n\n<p>As we know,</p>\n⇒ x<sup>3</sup> + y<sup>3</sup> + z<sup>3</sup> – 3xyz = (x + y + z) (x<sup>2</sup> + y<sup>2</sup> + z<sup>2</sup> – xy – yz – zx)", "marks": 2, "negMarks": 0.5}, {"text": "If P + Q = 6 and <span style=\"\">PQ</span> = 4, then what is the value of P<sup>3</sup> + Q<sup>3</sup>?", "options": ["81", "64", "144", "256"], "correct": 3, "solution": "&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;Given:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;P + Q = 6&amp;nbsp;and PQ = 4&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;Formula Used:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;(P + Q)&lt;span style=&quot;line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;&amp;nbsp;= P&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;+ Q&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;+ 3 PQ (P + Q)&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;Calculation:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;(P + Q)&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;= P&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;+ Q&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;+ 3 PQ (P + Q)&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&amp;rArr; (6)&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;=&amp;nbsp;P&lt;span style=&quot;line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;+ Q&lt;span style=&quot;line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;+ 3 &amp;times; 4&amp;nbsp;&amp;times; (6)&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&amp;rArr; P&lt;span style=&quot;line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;+ Q&lt;span style=&quot;line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;&amp;nbsp;= 216 - 72&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&amp;rArr; P&lt;span style=&quot;line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;+ Q&lt;span style=&quot;line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;&amp;nbsp;= 144&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;&amp;there4; Value of P&lt;span style=&quot;line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;+ Q&lt;span style=&quot;line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;= 144&lt;/span&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If a = 2b = 8c and a + b + c = 13 then the value of <span class=\"math-tex\">\\(\\frac{{\\sqrt {{a^2} + {b^2} + {c^2}} }}{{2c}}\\)</span> is:", "options": ["-5/6", "9/2", "-9/2", "5/6"], "correct": 2, "solution": "&lt;p&gt;a = 2b = 8c&lt;/p&gt;\n\n&lt;p&gt;Let a = 2b = 8c = k&lt;/p&gt;\n\n&lt;p&gt;a = k&lt;/p&gt;\n\n&lt;p&gt;2b = k&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; b = k/2&lt;/p&gt;\n\n&lt;p&gt;8c = k&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; c = k/8&lt;/p&gt;\n\n&lt;p&gt;Ratio of a : b : c = k : k/2 : k/8 = 8 : 8k/2 : 8k/8 = 8 : 4 : 1&lt;/p&gt;\n\n&lt;p&gt;Now,&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{{\\sqrt {{a^2} + {b^2} + {c^2}} }}{{2c}}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\Rightarrow \\frac{{\\sqrt {{8^2} + {4^2} + {1^2}} }}{2}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\Rightarrow \\frac{{\\sqrt {64 + 16 + 1} }}{2}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; &amp;radic;81/2&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; 9/2&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&lt;u&gt;Short Trick&lt;/u&gt;&lt;/strong&gt;&lt;strong&gt;:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;a = 2b = 8c&lt;/p&gt;\n\n&lt;p&gt;a : b : c = 1 : 1/2 : 1/8 = 8 : 4 : 1&lt;/p&gt;\n\n&lt;p&gt;Now,&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{{\\sqrt {{a^2} + {b^2} + {c^2}} }}{{2c}}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\Rightarrow \\frac{{\\sqrt {{8^2} + {4^2} + {1^2}} }}{2}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\Rightarrow \\frac{{\\sqrt {64 + 16 + 1} }}{2}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; &amp;radic;81/2&lt;/p&gt;\n&amp;rArr; 9/", "marks": 2, "negMarks": 0.5}, {"text": "Simplify:<br />\n<span style=\"font-size:18px;\"><span class=\"math-tex\">\\(\\frac{(4.2)^3 - (1.2)^3}{(4.2)^2 + 5.04 + (1.2)^2} \\)</span></span>", "options": ["2", "3", "1", "5"], "correct": 2, "solution": "<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png\" width=\"26px\" /> <u style=\"font-size: 21px; font-weight: 700; display: inline !important;\">Shortcut Trick</u></span>\n<p>The given expression follows the standard algebraic identity: (a<sup>3</sup> &minus; b<sup>3</sup>) &divide; (a<sup>2</sup> + ab + b<sup>2</sup>) = a &minus; b</p>\n<p>Here, a = 4.2 and b = 1.2</p>\n<p>Simply calculate the difference: 4.2 &minus; 1.2 = 3</p>\n<p><strong>&there4; The correct answer is 3.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Alternate Method</u></span></strong></span></p>\n<p><strong>Given:</strong></p>\n<p>Expression: (4.2<sup>3</sup> &minus; 1.2<sup>3</sup>) &divide; (4.2<sup>2</sup> + 5.04 + 1.2<sup>2</sup>)</p>\n<p><strong>Formula Used:</strong></p>\n<p>a<sup>3</sup> &minus; b<sup>3</sup> = (a &minus; b)(a<sup>2</sup> + ab + b<sup>2</sup>)</p>\n<p><strong>Calculation:</strong></p>\n<p>&rArr; Let a = 4.2 and b = 1.2</p>\n<p>&rArr; Check the middle term of the denominator: a &times; b = 4.2 &times; 1.2 = 5.04</p>\n<p>&rArr; So, the denominator is perfectly in the form of a<sup>2</sup> + ab + b<sup>2</sup></p>\n<p>&rArr; The given expression becomes: (a<sup>3</sup> &minus; b<sup>3</sup>) &divide; (a<sup>2</sup> + ab + b<sup>2</sup>)</p>\n<p>&rArr; Substituting the formula for a<sup>3</sup> &minus; b<sup>3</sup>:</p>\n<p>&rArr; [(a &minus; b)(a<sup>2</sup> + ab + b<sup>2</sup>)] &divide; (a<sup>2</sup> + ab + b<sup>2</sup>)</p>\n<p>&rArr; The common term (a<sup>2</sup> + ab + b<sup>2</sup>) in the numerator and denominator cancels out.</p>\n<p>&rArr; Remaining expression = a &minus; b</p>\n<p>&rArr; Result = 4.2 &minus; 1.2 = 3</p>\n<p><strong>&there4; The correct answer is 3.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Sum of Cubes Identity</p>\n<p style=\"margin:0 0 8px 0;color:#444444;\">Similar to the difference of cubes, the sum of cubes formula is useful in simplifications: a<sup>3</sup> + b<sup>3</sup> = (a + b)(a<sup>2</sup> &minus; ab + b<sup>2</sup>).</p>\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Difference of Squares</p>\n<p style=\"margin:0 0 8px 0;color:#444444;\">Another highly used algebraic identity in exams is a<sup>2</sup> &minus; b<sup>2</sup> = (a &minus; b)(a + b).</p>\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Decimal Multiplication Shortcut</p>\n<p style=\"margin:0 0 8px 0;color:#444444;\">When checking terms like 4.2 &times; 1.2, you can mult
