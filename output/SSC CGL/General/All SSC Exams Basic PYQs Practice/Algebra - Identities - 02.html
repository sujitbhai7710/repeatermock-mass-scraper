iply 42 &times; 12 = 504, and then place the decimal point two places from the right to get 5.04.</p></p>", "marks": 2, "negMarks": 0.5}, {"text": "If 16y<sup>2</sup> − k = <span class=\"math-tex\">\\(\\rm\\left(4 y+\\frac{3}{2}\\right)\\left(4 y−\\frac{3}{2}\\right)\\)</span>, then the value of k is:", "options": ["<span class=\"math-tex\">\\(\\frac{9}{4}\\)</span>", "<span class=\"math-tex\">\\(\\frac{11}{4}\\)</span>", "<span class=\"math-tex\">\\(\\frac{6}{4}\\)</span>", "<span class=\"math-tex\">\\(\\frac{7}{4}\\)</span>"], "correct": 1, "solution": "&lt;p&gt;&lt;strong&gt;&lt;span style=&quot;&quot;&gt;Given:&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;16y&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;&amp;minus; k =&amp;nbsp;&lt;/span&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\rm\\left(4 y+\\frac{3}{2}\\right)\\left(4 y−\\frac{3}{2}\\right) \\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Formula Used:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;(a&lt;span style=&quot;font-size: 10.5px;&quot;&gt;&amp;nbsp;+ &lt;span style=&quot;font-size:14px;&quot;&gt;b)(a - b) =&amp;nbsp;&lt;/span&gt;&lt;/span&gt;a&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;- b&lt;sup&gt;2&lt;/sup&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculations:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; 16y&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;&amp;minus; k =&amp;nbsp;&lt;/span&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\rm\\left(4 y+\\frac{3}{2}\\right)\\left(4 y−\\frac{3}{2}\\right) \\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;16y&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;&amp;minus; k =&amp;nbsp;&lt;/span&gt;&lt;span class=&quot;math-tex&quot;&gt;\\((4y)^2-(\\frac{3}{2})^2\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;/span&gt;16y&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;- k = 16y&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;-&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{9}{4}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;/span&gt;-k = - 9/4&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;/span&gt;k = 9/4&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;/span&gt;&lt;strong&gt;Hence, The value of k is 9/4&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If x<sup>2</sup> + 1/x<sup>2</sup> =11, then x - 1/x is equal to∶", "options": ["2", "3", "5", "4"], "correct": 2, "solution": "<p>Given, x<sup>2</sup> + 1/x<sup>2</sup> = 11</p>\n\n<p>As we know,</p>\n\n<p>(x - 1/x)<sup>2</sup> = x<sup>2</sup> + 1/x<sup>2</sup> - 2</p>\n\n<p>(x - 1/x)<sup>2</sup> = 11 - 2 = 9</p>\n(x - 1/x) = √9 = 3", "marks": 2, "negMarks": 0.5}, {"text": "If a and b are two positive real numbers such that a + b = 20 and ab = 4, then the value of a<sup>3 </sup>+ b<sup>3</sup> is:", "options": ["7760", "240", "8000", "8240"], "correct": 1, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;a and b are two positive real numbers such that a + b = 20 and ab = 4. We have to find the value of a&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;+ b&lt;sup&gt;3&lt;/sup&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Formula Used:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;a&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;+ b&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;= (a + b)&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;&amp;ndash; 3ab(a + b)&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;a&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;+ b&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;= (a + b)&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;&amp;ndash; 3ab(a + b)&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;a&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;+ b&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;= (20)&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;&amp;ndash;&amp;nbsp;3&amp;nbsp;&amp;times; 4&amp;nbsp;&amp;times; 20&amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp;[∵ Given a + b = 20 and ab = 4]&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;a&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;+ b&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;= 20&amp;nbsp;&amp;times; (20&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;&amp;ndash; 12)&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;a&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;+ b&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;= 20&amp;nbsp;&amp;times; (400&amp;nbsp;&amp;ndash; 12)&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;a&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;+ b&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;= 20&amp;nbsp;&amp;times; 388&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;a&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;+ b&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;= 7760&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&amp;there4; Value of&amp;nbsp;a&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;+ b&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;is 7760&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If A + B = 12 and AB = 17, what is the value of A<sup>3</sup> + B<sup>3</sup>?", "options": ["1116", "1166", "1106", "1213"], "correct": 1, "solution": "<p>A + B = 12 and AB = 17</p>\n\n<p>⇒ A<sup>3</sup> + B<sup>3</sup> = (A + B) [(A + B)<sup>2</sup> - 3AB]</p>\n\n<p>⇒ A<sup>3</sup> + B<sup>3</sup> = 12 [12<sup>2</sup> - 3 × 17]</p>\n⇒ A<sup>3</sup> + B<sup>3</sup> = 12 [144 - 51] = 12 × 93 = 1116", "marks": 2, "negMarks": 0.5}, {"text": "Simplify.<br />\n<br />\n<span class=\"math-tex\">\\(\\frac{(232)^3+(140)^3+(353)^3-3\\times232\\times140\\times353}{(232)^2+(140)^2+(353)^2-232\\times140-140\\times353-353\\times232}\\)</span>", "options": ["261", "725", "445", "596"], "correct": 2, "solution": "<p><span style='display: flex;gap: 6px;align-items: center;'><img height='26px' src='https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png' width='26px' /> <u style='font-size: 21px; font-weight: 700; display: inline !important;'>Shortcut Trick</u></span>\n<p>The given expression follows the standard algebraic pattern: (a<sup>3</sup> + b<sup>3</sup> + c<sup>3</sup> &minus; 3abc) &divide; (a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup> &minus; ab &minus; bc &minus; ca).</p>\n<p>According to the identity, this entire expression directly simplifies to (a + b + c).</p>\n<p>Here, a = 232, b = 140, and c = 353.</p>\n<p>Result = 232 + 140 + 353 = 725.</p>\n<p><strong>&there4; The correct answer is 725.</strong></p>\n\n<p><span style='display: flex;gap: 6px;align-items: center;'><img height='26px' src='https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png' width='26px' /><strong><span style='vertical-align: middle;font-size: 21px;'><u>Alternate Method</u></span></strong></span></p>\n<p><strong>Given:</strong></p>\n<p>Expression: [ (232)<sup>3</sup> + (140)<sup>3</sup> + (353)<sup>3</sup> &minus; 3 &times; 232 &times; 140 &times; 353 ] &divide; [ (232)<sup>2</sup> + (140)<sup>2</sup> + (353)<sup>2</sup> &minus; 232 &times; 140 &minus; 140 &times; 353 &minus; 353 &times; 232 ]</p>\n<p><strong>Formula Used:</strong></p>\n<p>a<sup>3</sup> + b<sup>3</sup> + c<sup>3</sup> &minus; 3abc = (a + b + c)(a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup> &minus; ab &minus; bc &minus; ca)</p>\n<p><strong>Calculations:</strong></p>\n<p>&rArr; Let a = 232, b = 140, and c = 353.</p>\n<p>&rArr; The numerator is of the form: a<sup>3</sup> + b<sup>3</sup> + c<sup>3</sup> &minus; 3abc</p>\n<p>&rArr; The denominator is of the form: a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup> &minus; ab &minus; bc &minus; ca</p>\n<p>&rArr; Expression = (a<sup>3</sup> + b<sup>3</sup> + c<sup>3</sup> &minus; 3abc) / (a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup> &minus; ab &minus; bc &minus; ca)</p>\n<p>&rArr; Expression = [ (a + b + c)(a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup> &minus; ab &minus; bc &minus; ca) ] / (a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup> &minus; ab &minus; bc &minus; ca)</p>\n<p>&rArr; The term (a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup> &minus; ab &minus; bc &minus; ca) cancels out from both the numerator and the denominator.</p>\n<p>&rArr; Expression = a + b + c</p>\n<p>&rArr; Expression = 232 + 140 + 353</p>\n<p>&rArr; Expression = 725</p>\n<p><strong>&there4; The correct answer is 725.</strong></p>\n\n<p><span style='display: flex;gap: 6px;align-items: center;'><img height='26px' src='https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png' width='26px' /><strong><span style='vertical-align: middle;font-size: 21px;'><u>Additional Information</u></span></strong></span></p>\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>Algebraic Identity for Squares</p>\n<p style='margin:0 0 8px 0;color:#444444;'>The expansion of three terms squared is: (a + b + c)<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup> + 2(ab + bc + ca).</p>\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>Alternative Form of Cubes Identity</p>\n<p style='margin:0 0 8px 0;color:#444444;'>a<sup>3</sup> + b<sup>3</sup> + c<sup>3</sup> &minus; 3abc = 1/2 &times; (a + b + c)[(a &minus; b)<sup>2</sup> + (b &minus; c)<sup>2</sup> + (c &minus; a)<sup>2</sup>]. This formulation is highly useful when the difference between consecutive terms is small.</p>\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>Conditional Identity</p>\n<p style='margin:0 0 8px 0;color:#444444;'>If a + b + c = 0, then a<sup>3</sup> + b<sup>3</sup> + c<sup>3</sup> = 3abc. This is a frequently tested special case in simplification and algebraic questions.</p></p>", "marks": 2, "negMarks": 0.5}, {"text": "Simplify the expression <span class=\"math-tex\">\\(\\frac{1^2-m^2}{(1+m)^2} \\)</span>, provided (1 + m) ≠ 0.", "options": ["<span class=\"math-tex\">\\(\\frac{1+m}{1-m} \\)</span>", "<span class=\"math-tex\">\\( \\frac{1-m}{1+m}\\)</span>", "0", "1"], "correct": 2, "solution": "<p><strong>Calculation:</strong></p>\n\n<p><span class=\"math-tex\">\\(\\frac{1^2-m^2}{(1+m)^2} \\)</span></p>\n\n<p>⇒ (1+m)(1-m) / (1+m)<sup>2</sup> </p>\n\n<p><span style=\"color: rgb(33, 37, 41);\">⇒ <span class=\"math-tex\">\\( \\frac{1-m}{1+m}\\)</span></span></p>\n\n<p><strong>∴ The correct option is 2</strong></p>\n", "marks": 2, "negMarks": 0.5}];const ANALYSIS={"rank": 408, "percentile": 13.034188034188032, "avgMarks": 70.44764957264962, "totalStudents": 468};const TEST_META={"title": "Algebra - Identities - 02", "series": "SSC CGL", "totalQuestions": 50, "solutions": 49, "scrapedAt": "2026-09-03 04:03:38 UTC"};</scri
