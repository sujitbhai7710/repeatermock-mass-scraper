 answer is 500.</strong></p>\n\n<p><span style='display: flex;gap: 6px;align-items: center;'><img height='26px' src='https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png' width='26px' /><strong><span style='vertical-align: middle;font-size: 21px;'><u>Alternate Method</u></span></strong></span></p>\n<p><strong>Given:</strong></p>\n<p>a &minus; b = 5</p>\n<p>ab = 25</p>\n<p><strong>Formula Used:</strong></p>\n<p>(a &minus; b)<sup>3</sup> = a<sup>3</sup> &minus; b<sup>3</sup> &minus; 3ab(a &minus; b)</p>\n<p><strong>Calculations:</strong></p>\n<p>&rArr; Rearranging the algebraic formula to isolate a<sup>3</sup> &minus; b<sup>3</sup>:</p>\n<p>&rArr; a<sup>3</sup> &minus; b<sup>3</sup> = (a &minus; b)<sup>3</sup> + 3ab(a &minus; b)</p>\n<p>&rArr; Substitute the given values of (a &minus; b) and ab into the equation.</p>\n<p>&rArr; a<sup>3</sup> &minus; b<sup>3</sup> = (5)<sup>3</sup> + 3 &times; 25 &times; (5)</p>\n<p>&rArr; a<sup>3</sup> &minus; b<sup>3</sup> = 125 + 375</p>\n<p>&rArr; a<sup>3</sup> &minus; b<sup>3</sup> = 500</p>\n<p><strong>&there4; The correct answer is 500.</strong></p>\n\n<p><span style='display: flex;gap: 6px;align-items: center;'><img height='26px' src='https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png' width='26px' /><strong><span style='vertical-align: middle;font-size: 21px;'><u>Additional Information</u></span></strong></span></p>\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>Sum of Cubes Identity</p>\n<p style='margin:0 0 8px 0;color:#444444;'>a<sup>3</sup> + b<sup>3</sup> = (a + b)<sup>3</sup> &minus; 3ab(a + b) = (a + b)(a<sup>2</sup> &minus; ab + b<sup>2</sup>)</p>\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>Square of a Sum and Difference</p>\n<p style='margin:0 0 8px 0;color:#444444;'>(a + b)<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup> + 2ab and (a &minus; b)<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup> &minus; 2ab</p>\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>Difference of Squares</p>\n<p style='margin:0 0 8px 0;color:#444444;'>a<sup>2</sup> &minus; b<sup>2</sup> = (a &minus; b)(a + b)</p></p>", "marks": 2, "negMarks": 0.5}, {"text": "If x - y = 4 and xy = 3, then what is the value of x<sup>3 </sup>- y<sup>3</sup>?", "options": ["64", "100", "28", "88"], "correct": 2, "solution": "&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;Given:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;&quot;&gt;x - y = 4 &lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;&quot;&gt;xy = 3&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;Concept used:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;x&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;- y&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;= (x - y) (x&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ xy + y&lt;sup&gt;2&lt;/sup&gt;)&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;(x&amp;nbsp;- y)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= x&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;- 2xy + y&lt;sup&gt;2&lt;/sup&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;Calculation:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;&quot;&gt;x - y = 4&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; x&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;-&amp;nbsp;2xy + y&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= 16&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+&amp;nbsp;xy + y&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;= 16 +&amp;nbsp;(3 &amp;times; 3)&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+&amp;nbsp;xy +&amp;nbsp;y&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;= 25&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; (x - y) (x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+&amp;nbsp;xy +&amp;nbsp;y&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;) = 25&amp;nbsp;&amp;times; 4&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; (x - y) (x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+&amp;nbsp;xy +&amp;nbsp;y&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;) = 100&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; x&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;- y&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;= 100&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;strong&gt;&lt;span style=&quot;&quot;&gt;&amp;there4; The value of x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;- y&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;&lt;span style=&quot;&quot;&gt;is&amp;nbsp;100.&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;&quot;&gt;&lt;span style=&quot;display: flex;gap: 6px;align-items: center;&quot;&gt;&lt;img height=&quot;26px&quot; src=&quot;https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png&quot; width=&quot;26px&quot; /&gt;&lt;strong&gt;&lt;span style=&quot;vertical-align: middle;font-size: 21px;&quot;&gt;&lt;u&gt;Shortcut Trick&lt;/u&gt;&lt;/span&gt;&lt;/strong&gt;&lt;/span&gt;&amp;rArr; If, x - y = k, then x&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;- y&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;= k&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;+&amp;nbsp;3k&amp;nbsp;&amp;times; xy.&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;strong&gt;&amp;there4; x&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;- y&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;= (4)&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;+&amp;nbsp;3&amp;nbsp;&amp;times; 4&amp;nbsp;&amp;times; 3 = 64 + 36 = 100.&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "The value of <span class=\"math-tex\">\\(\\frac{(x-y)^3+(y-z)^3+(z-x)^3}{6(x-y)(y-z)(z-x)}\\)</span>, where x ≠ y ≠ z, is equal to:", "options": ["1/4", "1/2", "1/3", "1/9"], "correct": 2, "solution": "<p><strong>Calculations:</strong></p>\n\n<p>According to the question,</p>\n\n<p>(x - y) + (y - z) + (z - x) = 0</p>\n\n<p>So, (x - y)³ + (y - z)³ + (z - x)³ = 3(x - y)(y - z)(z - x)</p>\n\n<p>Now,<span style=\"\"> </span><span class=\"math-tex\">\\(\\frac{(x-y)^3+(y-z)^3+(z-x)^3}{6(x-y)(y-z)(z-x)}\\)</span></p>\n\n<p><span style=\"color: rgb(0, 0, 0);   white-space: pre-wrap; \">⇒ </span><span style=\"\">3(x - y)(y - z)(z - x)/6(x - y)(y - z)(z - x)</span></p>\n\n<p><span style=\"color: rgb(0, 0, 0); white-space: pre-wrap; \">⇒ 3/6</span></p>\n\n<p><span style=\"color: rgb(0, 0, 0); white-space: pre-wrap; \">⇒</span> 1/2</p>\n\n<p><strong>Hence, The Required value is 1/2.</strong></p>\n", "marks": 2, "negMarks": 0.5}, {"text": "If xy =6 and x<sup>2</sup>y + xy<sup>2</sup> + x + y = 63, then the value of x<sup>2</sup> + y<sup>2</sup> is:", "options": ["79", "59", "70", "69"], "correct": 4, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;xy =6 and x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;y + xy&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ x + y = 63&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Formula used:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;x&amp;sup2; + y&amp;sup2; = (x + y)&amp;sup2; - 2xy&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&lt;strong&gt;Calculations:&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;According to question,&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;y + xy&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ x + y = 63&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; xy(x + y) + (x + y) = 63&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; (x + y)(xy + 1) = 63&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; (x + y)(6 + 1) = 63&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; (x + y) = 63/7 = 9&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;Now, x&amp;sup2; + y&amp;sup2; &lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;= (x + y)&amp;sup2; - 2xy&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;= 9&amp;sup2; - 2(6)&lt;/p&gt;\n\n&lt;p&gt;= 81 - 12&lt;/p&gt;\n\n&lt;p&gt;= 69&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Hence, The Required value is 69.&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If x + y + z = 8, and x<sup>2</sup> + y<sup>2</sup> + z<sup>2</sup> = 20 then the value of x<sup>3</sup> + y<sup>3</sup> + z<sup>3</sup> − 3xyz is ________.", "options": ["16", "10", "15", "−16"], "correct": 4, "solution": "&lt;p&gt;&lt;strong&gt;&lt;span style=&quot;&quot;&gt;Given:&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;x + y + z = 8&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ y&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ z&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;= 20&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&lt;strong&gt;Formula Used:&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;(x + y + z)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= x&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ y&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ z&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 2(xy + yz + zx)&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;x&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;+ y&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;+ z&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41); line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;- 3xyz&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;= (x+y+z){x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ y&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ z&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;- (xy + yz + zx)}&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&lt;strong&gt;Calculations:&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;from the first formula&amp;nbsp;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; (x + y + z)&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;= x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ y&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ z&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ 2(xy + yz + zx)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;(8)&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;= 20&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ 2(xy + yz + zx)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;2(xy + yz + zx) = 64 - 20 = 44&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;xy + yz + zx = 22&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;according to the question,&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;x&lt;sup&gt;3&lt;/sup&gt; + y&lt;sup&gt;3&lt;/sup&gt; + z&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;- 3xyz = (x+y+z){x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ y&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ z&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;- (xy + yz + zx)} =&amp;nbsp;(8){20&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;- (22)} = 8(20 - 22) = 8(-2) = -16&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;strong&gt;Hence, The value of &lt;/strong&gt;&lt;/span&gt;&lt;strong&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;x&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;+ y&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;+ z&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41); line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;- 3xyz&lt;/span&gt;&lt;/strong&gt;&lt;span style=&quot;&quot;&gt;&lt;strong&gt;&lt;strong&gt;&amp;nbsp;&lt;/strong&gt;is -16.&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If (2x + 3)<sup>3</sup> + (x - 8)<sup>3</sup> + (x + 13)<sup>3</sup> = (2x + 3)  (3x - 24) (x + 13), then what is the value of x?", "options": ["-2", "-2.5", "1", "-1.3"], "correct": 1, "solution": "<p>As we know,</p>\n\n<p>If x<sup>3</sup> + y<sup>3</sup> + z<sup>3</sup> - 3xyz = 0, then x + y + z = 0</p>\n\n<p>⇒ (2x + 3)<sup>3</sup> + (x - 8)<sup>3 </sup>+ (x + 13)<sup>3</sup> = (2x + 3) (3x - 24) (x + 13)</p>\n\n<p>⇒ (2x + 3)<sup>3</sup> + (x - 8)<sup>3</sup> + (x + 13)<sup>3</sup> - 3 (2x + 3) (x - 8) (x + 13) = 0</p>\n\n<p>⇒ (2x + 3) + (x - 8) + (x + 13) = 0</p>\n\n<p>⇒ 4x + 8 = 0</p>\n\n<p>⇒ 4x = -8</p>\n⇒ x = -8/4 = -2", "marks": 2, "negMarks": 0.5}, {"text": "If (x + 6)<sup>3</sup> + (2x + 3)<sup>3</sup> + (3x + 5)<sup>3</sup> = (3x + 18)(2x + 3)(3x + 5), then what is the value of x ?", "options": ["<span class=\"math-tex\">\\(\\frac{5}{3}\\)</span>", "<span class=\"math-tex\">\\(-\\frac{5}{3}\\)</span>", "<span class=\"math-tex\">\\(-\\frac{7}{3}\\)</span>", "<span class=\"math-tex\">\\(\\frac{7}{3}\\)</span>"], "correct": 3, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;(x + 6)&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ (2x + 3)&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ (3x + 5)&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;= (3x + 18)(2x + 3)(3x + 5)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&lt;span style=&quot;&quot;&gt;Formula used:&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;If (a + b + c) = 0 then,&amp;nbsp;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;a&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;+ b&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;+ c&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;= 3abc&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&lt;span style=&quot;&quot;&gt;Calculation:&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;(x + 6)&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ (2x + 3)&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ (3x + 5)&lt;/span&gt;&lt;span style=&quot lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; x = -7/3&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;strong&gt;&lt;span style=&quot;&quot;&gt;&amp;there4; The required value is -7/3&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If <span class=\"math-tex\">\\(a-\\frac{1}{a-5}=10\\)</span>, then the value of <span class=\"math-tex\">\\((a-5)^3-\\frac{1}{(a-5)^3}\\)</span> is:", "options": ["<span style=\"\"><font style=\"vertical-align: inherit;\"><font style=\"vertical-align: inherit;\">140</font></font></span>", "<font style=\"vertical-align: inherit;\"><font style=\"vertical-align: inherit;\">70</font></font>", "<span style=\"\"><font style=\"vertical-align: inherit;\"><font style=\"vertical-align: inherit;\">100</font></font></span>", "<span style=\"\"><font style=\"vertical-align: inherit;\"><font style=\"vertical-align: inherit;\">120</font></font></span>"], "correct": 1, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(a-\\frac{1}{a-5}=10\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Formula Used:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;If (x - &lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{1}{x}\\)&lt;/span&gt;) = t&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;then, (x&lt;sup&gt;3&lt;/sup&gt; - &lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{1}{x^3}\\)&lt;/span&gt;) = t&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;+&amp;nbsp;3t&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;Where t = any constant number&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;Here, we have&lt;span style=&quot;&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(a-\\frac{1}{a-5}=10\\)&lt;/span&gt; ............. ( 1)&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;Subtract&amp;nbsp;5 in equation (1) on both the sides&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&lt;span style=&quot;&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(a-\\frac{1}{a-5}=10\\)&lt;/span&gt;&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; &lt;span class=&quot;math-tex&quot;&gt;\\((a - 5) - \\frac{1}{ ( a\\ - \\ 5)}\\)&lt;/span&gt;&amp;nbsp;= 5&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;Now, take (a - 5) = x&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;So, the equation becomes&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; x - &lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{1}{x }\\)&lt;/span&gt;&amp;nbsp;= 5&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;Now, as we know that when x -&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{1}{x}\\)&lt;/span&gt; = t&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;Now, we get t = 5, substituting the value of t in the equation below,&lt;/p&gt;\n\n&lt;p&gt;Then, &lt;span class=&quot;math-tex&quot;&gt;\\(x^3 - \\frac{1}{x^3}\\)&lt;/span&gt;&amp;nbsp;= t&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;+&amp;nbsp;&amp;nbsp;3t&amp;nbsp; &amp;nbsp; &amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&lt;span style=&quot;&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(x^3 - \\frac{1}{x^3}\\)&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;&lt;/span&gt;= 5&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;+ 3&amp;nbsp;&amp;times; 5 = (125 +15) = 140&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&lt;span style=&quot;&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(x^3 - \\frac{1}{x^3}\\)&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;&lt;/span&gt;&amp;nbsp;=&lt;span style=&quot;&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;span class=&quot;math-tex&quot;&gt;\\((a-5)^3-\\frac{1}{(a-5)^3}\\)&lt;/span&gt;&amp;nbsp;= 140&amp;nbsp; &amp;nbsp; &amp;nbsp; [As x = a - 5]&lt;/p&gt;\n\n&lt;p&gt;Thus, the required value is 140.&lt;/p&gt;\n\n&lt;p&gt;Hence,&lt;strong&gt; the correct answer is option 1).&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If a + b + c = 5 and ab + bc + ca = 7, then the value of a<sup>3</sup> + b<sup>3</sup> + c<sup>3</sup> - 3abc is:", "options tant; pointer-events: initial !important;&quot;&gt;&lt;span style=&quot;font-weight: bolder;  line-height: 20px; user-select: text !important; pointer-events: initial !important;&quot;&gt;&amp;there4; The answer is &lt;/span&gt;&lt;strong&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;10a&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41); position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;- 14ab&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If a + b - c = 0, then what is the value of <span class=\"math-tex\">\\(\\frac{(b-c)^2}{4bc}\\times\\frac{(c-a)^2}{4ca}\\times\\frac{(a+b)^2}{4ab}?\\)</span>", "options": ["<span class=\"math-tex\">\\(-\\frac{1}{2}\\)</span>", "<span class=\"math-tex\">\\(\\frac{1}{64}\\)</span>", "<span class=\"math-tex\">\\(\\frac{3}{4}\\)</span>", "<span class=\"math-tex\">\\(-\\frac{3}{4}\\)</span>"], "correct": 2, "solution": "&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;Given:&lt;/span&gt;&amp;nbsp;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;&quot;&gt;a + b - c = 0&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;Calculation:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{(b-c)^2}{4bc}\\times\\frac{(c-a)^2}{4ca}\\times\\frac{(a+b)^2}{4ab}?\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;b - c = -a, c - a = b, a + b = c&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;Put the value in the above equation&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; {(-a)&lt;sup&gt;2&lt;/sup&gt;/4bc)} &amp;times; (b&lt;sup&gt;2&lt;/sup&gt;/4ca)&amp;nbsp;&amp;times; (c&lt;sup&gt;2&lt;/sup&gt;/4ab)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; (a&lt;sup&gt;2&lt;/sup&gt;b&lt;sup&gt;2&lt;/sup&gt;c&lt;sup&gt;2&lt;/sup&gt;/64a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;b&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;c&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;)&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; 1/64&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;strong&gt;&lt;span style=&quot;&quot;&gt;&amp;there4; The value of&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{(b-c)^2}{4bc}\\times\\frac{(c-a)^2}{4ca}\\times\\frac{(a+b)^2}{4ab}?\\)&lt;/span&gt;&amp;nbsp;is (1/64).&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If x<sup>2</sup> - 4x − 1 = 0, then find the value of x<sup>2</sup> + <span class=\"math-tex\">\\(\\frac{1}{x^2}\\)</span> - 5.", "options": ["17", "12", "15", "13"], "correct": 4, "solution": "<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png\" width=\"26px\" /> <u style=\"font-size: 21px; font-weight: 700; display: inline !important;\">Shortcut Trick</u></span>\n<p>Divide the given equation x<sup>2</sup> &minus; 4x &minus; 1 = 0 by x to get x &minus; 1/x = 4.</p>\n<p>Use the direct algebraic shortcut: if x &minus; 1/x = k, then x<sup>2</sup> + 1/x<sup>2</sup> = k<sup>2</sup> + 2.</p>\n<p>Here, k = 4, so x<sup>2</sup> + 1/x<sup>2</sup> = 4<sup>2</sup> + 2 = 18.</p>\n<p>Substitute this value in the required expression (x<sup>2</sup> + 1/x<sup>2</sup> &minus; 5) : 18 &minus; 5 = 13.</p>\n<p><strong>&there4; The correct answer is 13.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Alternate Method</u></span></strong></span></p>\n<p><strong>Given:</strong></p>\n<p>x<sup>2</sup> &minus; 4x &minus; 1 = 0</p>\n<p><strong>Formula Used:</strong></p>\n<p>(a &minus; b)<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup> &minus; 2ab</p>\n<p><strong>Calculations:</strong></p>\n<p>Divide the entire given equation by x:</p>\n<p>&rArr; (x<sup>2</sup> / x) &minus; (4x / x) &minus; (1 / x) = 0</p>\n<p>&rArr; x &minus; 4 &minus; 1/x = 0</p>\n<p>&rArr; x &minus; 1/x = 4</p>\n<p>Squaring both sides of the equation:</p>\n<p>&rArr; (x &minus; 1/x)<sup>2</sup> = 4<sup>2</sup></p>\n<p>&rArr; x<sup>2</sup> + 1/x<sup>2</sup> &minus; 2(x)(1/x) = 16</p>\n<p>&rArr; x<sup>2</sup> + 1/x<sup>2</sup> &minus; 2 = 16</p>\n<p>&rArr; x<sup>2</sup> + 1/x<sup>2</sup> = 16 + 2</p>\n<p>&rArr; x<sup>2</sup> + 1/x<sup>2</sup> = 18</p>\n<p>We need to find the value of x<sup>2</sup> + 1/x<sup>2</sup> &minus; 5:</p>\n<p>&rArr; 18 &minus; 5 = 13</p>\n<p><strong>&there4; The correct answer is 13.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Algebraic Identities for Squares</p>\n<p style=\"margin:0 0 8px 0;color:#444444;\">If x + 1/x = k, then x<sup>2</sup> + 1/x<sup>2</sup> = k<sup>2</sup> &minus; 2. Similarly, if x &minus; 1/x = k, then x<sup>2</sup> + 1/x<sup>2</sup> = k<sup>2</sup> + 2.</p>\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Algebraic Identities for Cubes</p>\n<p style=\"margin:0 0 8px 0;color:#444444;\">If x + 1/x = k, then x<sup>3</sup> + 1/x<sup>3</sup> = k<sup>3</sup> &minus; 3k. If x &minus; 1/x = k, then x<sup>3</sup> &minus; 1/x<sup>3</sup> = k<sup>3</sup> + 3k.</p>\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Sign Conversion Rule</p>\n<p style=\"margin:0 0 8px 0;color:#444444;\">The identity (x + 1/x)<sup>2</sup> &minus; (x &minus; 1/x)<sup>2</sup> = 4 can be used to switch signs. This implies if x + 1/x = k, then x &minus; 1/x = &radic;(k<sup>2</sup> &minus; 4).</p></p>", "marks": 2, "negMarks": 0.5}, {"text": "If <span class=\"math-tex\">\\(x - \\frac{1}{x} = 13\\)</span>, then the value of <span class=\"math-tex\">\\({x^2} + \\frac{1}{{{x^2}}}\\)</span> is:", "options": ["165", "171", "167", "169"], "correct": 2, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(x - \\frac{1}{x} = 13\\)&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;Formula used:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;If x &amp;ndash; 1/x = K&lt;/p&gt;\n\n&lt;p&gt;Then on squaring both side we get&lt;/p&gt;\n\n&lt;p&gt;x&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ 1/x&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;= k&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+&amp;nbsp;2&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;Apply the above formula&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; (x - 1/x)&lt;sup&gt;2&lt;/sup&gt; = 13&lt;sup&gt;2&lt;/sup&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; x&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 1/x&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= 169 +&amp;nbsp;2&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; x&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ 1/x&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;= 171&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&amp;there4; The value of&amp;nbsp;x&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ 1/x&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;is&amp;nbsp;171.&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "if <span class=\"math-tex\">\\(\\frac{4\\left[ \\left( 17\\right) ^{3}-\\left( 7\\right) ^{3}\\right] }{\\left( 17^{2}+7^{2}+p\\right) } =40, \\)</span>then what is the value of p?", "options": ["-119", "-129", "119", "129"], "correct": 3, "solution": "&lt;p&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;Given:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{4\\left[ \\left( 17\\right) ^{3}-\\left( 7\\right) ^{3}\\right] }{\\left( 17^{2}+7^{2}+p\\right) } =40\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;Concept used:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;A&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;- B&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;= (A - B)(A&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ AB + B&lt;sup&gt;2&lt;/sup&gt;)&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;Calculation:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{4\\left[ \\left( 17\\right) ^{3}-\\left( 7\\right) ^{3}\\right] }{\\left( 17^{2}+7^{2}+p\\right) } =40\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac {4 \\times (17 - 7)(17^2 + 17 \\times 7 + 7^2)} {( 17^{2}+7^{2}+p)} =40\\)&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac {17^2 + 17 \\times 7 + 7^2)} {( 17^{2}+7^{2}+p)} =1\\)&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\((17^2 + 17 \\times 7 + 7^2) = ( 17^{2}+7^{2}+p)\\)&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; P = 119&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;font-weight: 700; &quot;&gt;&amp;there4; The value of P is 119.&lt;/span&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "Simplify <span class=\"math-tex\">\\(\\frac{0.58 \\times 0.58 \\times 0.58 - 0.001}{0.58 \\times 0.58 + 0.058 + 0.01}\\)</span>", "options": ["0.48", "0.28", "0.37", "0.42"], "correct": 1, "solution": "<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png\" width=\"26px\" /> <u style=\"font-size: 21px; font-weight: 700; display: inline !important;\">Shortcut Trick</u></span>\n<p>The given expression follows the algebraic form of (a<sup>3</sup> &minus; b<sup>3</sup>) &divide; (a<sup>2</sup> + ab + b<sup>2</sup>).</p>\n<p>Using the identity, this expression directly simplifies to (a &minus; b).</p>\n<p>Here, a = 0.58 and b = 0.1 (since 0.1<sup>3</sup> = 0.001).</p>\n<p>&rArr; Result = 0.58 &minus; 0.1 = 0.48</p>\n<p><strong>&there4; The correct answer is 0.48.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Alternate Method</u></span></strong></span></p>\n<p><strong>Given:</strong></p>\n<p>Expression = (0.58 &times; 0.58 &times; 0.58 &minus; 0.001) &divide; (0.58 &times; 0.58 + 0.058 + 0.01)</p>\n<p><strong>Formula Used:</strong></p>\n<p>a<sup>3</sup> &minus; b<sup>3</sup> = (a &minus; b)(a<sup>2</sup> + ab + b<sup>2</sup>)</p>\n<p><strong>Calculation:</strong></p>\n<p>&rArr; The numerator can be written as: (0.58)<sup>3</sup> &minus; (0.1)<sup>3</sup></p>\n<p>&rArr; The denominator can be written as: (0.58)<sup>2</sup> + (0.58 &times; 0.1) + (0.1)<sup>2</sup></p>\n<p>&rArr; Let a = 0.58 and b = 0.1</p>\n<p>&rArr; Expression = (a<sup>3</sup> &minus; b<sup>3</sup>) &divide; (a<sup>2</sup> + ab + b<sup>2</sup>)</p>\n<p>&rArr; Expression = [(a &minus; b)(a<sup>2</sup> + ab + b<sup>2</sup>)] &divide; (a<sup>2</sup> + ab + b<sup>2</sup>)</p>\n<p>&rArr; Canceling the common term (a<sup>2</sup> + ab + b<sup>2</sup>) from numerator and denominator:</p>\n<p>&rArr; Expression = a &minus; b</p>\n<p>&rArr; Substituting the values back: 0.58 &minus; 0.1 = 0.48</p>\n<p><strong>&there4; The correct answer is 0.48.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Sum of Cubes Identity</p>\n<p style=\"margin:0 0 8px 0;color:#444444;\">a<sup>3</sup> + b<sup>3</sup> = (a + b)(a<sup>2</sup> &minus; ab + b<sup>2</sup>). If a simplification expression is written as (a<sup>3</sup> + b<sup>3</sup>) &divide; (a<sup>2</sup> &minus; ab + b<sup>2</sup>), the result will simply be (a + b).</p>\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Difference of Squares Identity</p>\n<p style=\"margin:0 0 8px 0;color:#444444;\">a<sup>2</sup> &minus; b<sup>2</sup> = (a &minus; b)(a + b). This is commonly used to simplify fractions involving square numbers.</p>\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Perfect Square Simplification</p>\n<p style=\"margin:0 0 8px 0;color:#444444;\">(a + b)<sup>2</sup> &minus; (a &minus; b)<sup>2</sup> = 4ab. This pattern often appears in fractional expressions where the denominator is ab, making the direct answer 4.</p></p>", "marks": 2, "negMarks": 0.5}, {"text": "if  <span class=\"math-tex\">\\(x +\\frac{1}{x}\\)</span> = 10, then find the value of <span class=\"math-tex\">\\(\\frac{{7x}}{{{x^2} + 1 - 8x}}\\)</span>.", "options": ["3.5", "4.5", "2.5", "5.5"], "correct": 1, "solution": "&lt;p&gt;&lt;strong&gt;GIVEN:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(x +\\frac{1}{x}\\)&lt;/span&gt;&amp;nbsp;= 10&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;CALCULATION:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;As, we have&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(x +\\frac{1}{x}\\)&lt;/span&gt;&amp;nbsp;= 10&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(x^2 + 1 = 10 x\\)&lt;/span&gt;&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;&amp;nbsp;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(x^2 = 10 x - 1\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;Now , on putting&amp;nbsp; the value of&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(x^2\\)&lt;/span&gt;&amp;nbsp;in the equation&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(7x\\over x^2 +1 -8x\\)&lt;/span&gt;&amp;nbsp; we get,&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp; &amp;nbsp;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(7x\\over ( 10x -1) +1 -8x\\)&lt;/span&gt;&amp;nbsp; =&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(7x\\over2x\\)&lt;/span&gt;&amp;nbsp;= 7/2 or 3.5&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Hence, the value is 3.5.&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If <span class=\"math-tex\">\\(\\left(x^2 + \\frac{1}{49x^2}\\right) = 15\\frac{5}{7},\\)</span> then what is the value of <span class=\"math-tex\">\\(\\left(x+\\frac{1}{7x}\\right)?\\)</span>", "options": ["7", "± 7", "4", "± 4"], "correct": 4, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\left(x^2 + \\frac{1}{49x^2}\\right) = 15\\frac{5}{7}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Concept used:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;(a + b)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= a&lt;sup&gt;2&lt;/sup&gt; + b&lt;sup&gt;2&lt;/sup&gt; + 2ab&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\left(x^2 + \\frac{1}{49x^2}\\right) = 15\\frac{5}{7}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; x&lt;sup&gt;2&lt;/sup&gt; + 1/49x&lt;sup&gt;2&lt;/sup&gt; + 2/7&amp;nbsp;= 110/7 + 2/7&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; (x&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ 1/7x)&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;= 16&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; (x&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ 1/7x)&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;=&amp;nbsp;&amp;plusmn; 4&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&amp;there4;&amp;nbsp;Required answer is&amp;nbsp;&lt;span style=&quot;&quot;&gt;&amp;plusmn; 4&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "What is the value of (a<sup>2 </sup>+ b<sup>2 </sup>+ 4c<sup>2 </sup>- ab - 2bc - 2ca)(a + b +2c)?", "options": ["a<sup>3</sup>+  b<sup>3</sup> + 8c<sup>3 </sup>- 8abc", "a<sup>3</sup> + b<sup>3</sup> + 6c<sup>3 </sup>- 4abc", "4a<sup>3</sup> + b<sup>3</sup> + 8c<sup>3 </sup>- 9abc", "a<sup>3</sup> +  b<sup>3</sup> + 8c<sup>3 </sup>- 6abc"], "correct": 4, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;(a&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&amp;nbsp;&lt;/span&gt;+ b&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&amp;nbsp;&lt;/span&gt;+ 4c&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&amp;nbsp;&lt;/span&gt;- ab - 2bc - 2ca)(a + b +2c)&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Concept Used:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(a^3 + b^3 + c^3 -3abc = (a + b + c)(a^2 + b^2 + c^2 -ab - bc - ca)\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;(a&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41); position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;+ b&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41); position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;+ 4c&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41); position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;- ab - 2bc - 2ca)(a + b +2c)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;a&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;+ b&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;+ 8c&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;- 6abc&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&lt;span class=&quot;s1&quot; style=&quot;font-variant-numeric: normal; font-variant-east-asian: normal; font-variant-alternates: normal; font-kerning: auto; font-optical-sizing: auto; font-feature-settings: normal; font-variation-settings: normal; font-stretch: normal; line-height: normal; &quot;&gt;&amp;there4;&lt;/span&gt; Option 4 is the correct answer.&lt;/strong&gt;&lt;br /&gt;\n&amp;nbsp;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If <span class=\"math-tex\">\\(4x^4=5x^2-1, x>\\frac{1}{\\sqrt 2}\\)</span>, then what is the vale of (2x<sup>2</sup> - x - 1)?", "options": ["1", "-2", "2", "0"], "correct": 4, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(4x^4=5x^2-1, x&amp;gt;\\frac{1}{\\sqrt 2}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Concept used:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;ax&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ bx + c = 0&lt;/p&gt;\n\n&lt;p&gt;Where a, b, and care the real terms&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;4x&lt;sup&gt;4&lt;/sup&gt;&amp;nbsp;- 5x&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 1 = 0&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;4x&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;4&lt;/span&gt;&amp;nbsp;- 4x&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;- x&lt;sup&gt;2&amp;nbsp;&lt;/sup&gt;+ 1 = 0&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;4x&lt;sup&gt;2&lt;/sup&gt;(x&lt;sup&gt;&lt;span style=&quot;font-size: 10.5px;&quot;&gt;2&lt;/span&gt;&lt;/sup&gt;&amp;nbsp;- 1)&amp;nbsp;&amp;ndash; 1(x&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2 &lt;/span&gt;-&amp;nbsp;1) = 0&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;(x&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;- 1)(4x&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;&amp;ndash;&amp;nbsp;1)&amp;nbsp;= 0&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;(x&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;- 1) = 0 (4x&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;&amp;ndash;&amp;nbsp;1)&amp;nbsp;= 0&lt;/p&gt;\n\n&lt;p&gt;x&amp;nbsp;- 1&amp;nbsp;= 0&lt;/p&gt;\n\n&lt;p&gt;2x&amp;nbsp;&amp;ndash;&amp;nbsp;1&amp;nbsp;= 0&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; x = 1 or 1/2&lt;/p&gt;\n\n&lt;p&gt;(2x&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;- x - 1)&lt;/p&gt;\n\n&lt;p&gt;Put x = 1&lt;/p&gt;\n\n&lt;p&gt;2&amp;nbsp;&amp;times; 1 - 1 -&amp;nbsp;1&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; 2 - 2 = 0&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&amp;there4; Required answer is 0&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If 2x<sup>2</sup> - 8x - 1 = 0, then what is the value of <span class=\"math-tex\">\\(\\rm 8x^3 - \\frac{1}{x^3}\\)</span>?", "options": ["540", "560", "524", "464"], "correct": 2, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;2x&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;- 8x - 1 = 0&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Formula used:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;(a - b)&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;= a&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;- b&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;- 3ab(a - b)&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;2x&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;- 8x - 1 = 0&lt;/p&gt;\n\n&lt;p&gt;By dividing the above equation by x;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; 2x - 8 - 1/x = 0&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; 2x - 1/x = 8&amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;By cubing both sides;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; (2x)&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;- 1/x&lt;sup&gt;3&lt;/sup&gt;- 3&amp;nbsp;&amp;times; 2x&amp;nbsp;&amp;times; 1/x(2x - 1/x) = 512&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; 8x&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;-&amp;nbsp;1/x&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;- 6&amp;nbsp;&amp;times;&amp;nbsp;8 = 512&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&amp;there4; 8x&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;-&amp;nbsp;1/x&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;= 560&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If x + <span class=\"math-tex\">\\(\\frac{1}{x}\\)</span> = 7, then the value of x<sup>6</sup> + <span class=\"math-tex\">\\(\\frac{1}{x^6}\\)</span> is:", "options": ["113682", "103682", "103882 ", "103862"], "correct": 2, "solution": "&lt;p style=&quot;color:  (30, 43, 51);  &quot;&gt;&lt;span style=&quot;font-weight: bolder;  line-height: 20px;&quot;&gt;Given:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;color:  (30, 43, 51);  &quot;&gt;x + 1/x = 7&lt;/p&gt;\n\n&lt;p style=&quot;color:  (30, 43, 51);  &quot;&gt;&lt;span style=&quot;font-weight: bolder;  line-height: 20px;&quot;&gt;Formula used:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;color:  (30, 43, 51);  &quot;&gt;If x + 1/x = n&lt;/p&gt;\n\n&lt;p style=&quot;color:  (30, 43, 51);  &quot;&gt;then, x &lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 1/x&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= n&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;- 2&lt;/p&gt;\n\n&lt;p style=&quot;color:  (30, 43, 51);  &quot;&gt;And (x&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;+ y&lt;sup&gt;3&lt;/sup&gt;)&amp;nbsp;= n&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;-&amp;nbsp;&amp;nbsp;3n&lt;/p&gt;\n\n&lt;p style=&quot;color:  (30, 43, 51);  &quot;&gt;&lt;span style=&quot;font-weight: bolder;  line-height: 20px;&quot;&gt;Calculation:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;color:  (30, 43, 51);  &quot;&gt;x&amp;nbsp;+ 1/x&amp;nbsp;= 7&lt;/p&gt;\n\n&lt;p style=&quot;color:  (30, 43, 51);  &quot;&gt;&amp;rArr; x&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 1/x&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= 7&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;- 2&lt;/p&gt;\n\n&lt;p style=&quot;color:  (30, 43, 51);  &quot;&gt;&amp;rArr; x&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 1/x&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= 47&lt;/p&gt;\n\n&lt;p style=&quot;color:  (30, 43, 51);  &quot;&gt;Cubing both side we get&lt;/p&gt;\n\n&lt;p style=&quot;color:  (30, 43, 51);  &quot;&gt;&amp;rArr; (x&lt;span style=&quot;line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ 1/x&lt;span style=&quot;line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;)&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;= 47&lt;sup&gt;3&lt;/sup&gt;&lt;/p&gt;\n\n&lt;p style=&quot;color:  (30, 43, 51);  &quot;&gt;&amp;rArr; x&lt;sup&gt;6&lt;/sup&gt;&amp;nbsp;+ 1/x&lt;sup&gt;6&lt;/sup&gt;&amp;nbsp;+ 3&amp;nbsp;(x&lt;span style=&quot;line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;&amp;times; 1/x&lt;span style=&quot;line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;) (x&lt;span style=&quot;line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ 1/x&lt;span style=&quot;line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;)&amp;nbsp;&amp;nbsp;= 47&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;&lt;/p&gt;\n\n&lt;p style=&quot;color:  (30, 43, 51);  &quot;&gt;&amp;rArr; x&lt;span style=&quot;line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;6&lt;/span&gt;&amp;nbsp;+ 1/x&lt;span style=&quot;line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;6&lt;/span&gt;&amp;nbsp;+ 3&amp;nbsp;&amp;times; 1 &amp;times; 47&amp;nbsp;&amp;nbsp;= 47&lt;span style=&quot;line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;&lt;/p&gt;\n\n&lt;p style=&quot;color:  (30, 43, 51);  &quot;&gt;&amp;rArr; x&lt;span style=&quot;line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;6&lt;/span&gt;&amp;nbsp;+ 1/x&lt;span style=&quot;line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;6&lt;/span&gt;&amp;nbsp;= 47&lt;span style=&quot;line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;- 3&amp;nbsp;&amp;times; 47&lt;/p&gt;\n\n&lt;p style=&quot;color:  (30, 43, 51);  &quot;&gt;&amp;rArr; x 6&amp;nbsp;+ 1/x 6&amp;nbsp;= 103823 - 141&lt;/p&gt;\n\n&lt;p style=&quot;color:  (30, 43, 51);  &quot;&gt;&amp;rArr; x 6&amp;nbsp;+ 1/x 6&amp;nbsp;= 103682&lt;/p&gt;\n\n&lt;p style=&quot;color:  (30, 43, 51);  &quot;&gt;&lt;span style=&quot;font-weight: bolder;  line-height: 20px;&quot;&gt;&amp;there4; The value of x 6&amp;nbsp;+ 1/x 6&amp;nbsp;is 103682.&lt;/span&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "<p>If a + b + c = 0,then find the value of <span class=\"math-tex\">\\(\\frac{{{a^2} + {b^2} + {c^2}}}{{{a^2} - bc}}\\)</span>.</p>\n", "options": ["−1", "1", "2", "−2"], "correct": 3, "solution": "&lt;p&gt;&lt;strong&gt;Given:-&lt;br /&gt;\n&lt;br /&gt;\n&amp;nbsp;&lt;/strong&gt;a&amp;nbsp;+ b + c = 0&lt;br /&gt;\n&lt;br /&gt;\n&lt;strong&gt;To find:-&lt;/strong&gt;&lt;br /&gt;\n&lt;br /&gt;\n&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{{{a^2} + {b^2} + {c^2}}}{{{a^2} - bc}}\\)&lt;/span&gt;&lt;br /&gt;\n&lt;br /&gt;\n&lt;strong&gt;Formula used:-&lt;/strong&gt;&lt;br /&gt;\n&lt;br /&gt;\n&amp;nbsp;(a + b + c)&lt;sup&gt;2&amp;nbsp;&lt;/sup&gt;= a&lt;sup&gt;2&amp;nbsp;&lt;/sup&gt;+ b&lt;sup&gt;2&amp;nbsp;&lt;/sup&gt;+ c&lt;sup&gt;2&amp;nbsp;&lt;/sup&gt;+ 2ab + 2bc + 2ac&lt;br /&gt;\n&lt;br /&gt;\n&lt;span style=&quot;font-weight: 700; &quot;&gt;Calculation&lt;/span&gt;&lt;strong&gt;:-&amp;nbsp;&lt;/strong&gt;&lt;br /&gt;\n&lt;br /&gt;\nAs mentioned, a + b + c = 0&lt;br /&gt;\n&lt;br /&gt;\n&amp;rArr;&amp;nbsp;&lt;strong&gt;a = - b - c&lt;/strong&gt;&lt;br /&gt;\n&lt;br /&gt;\nLet the value of&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{{{a^2} + {b^2} + {c^2}}}{{{a^2} - bc}}\\)&lt;/span&gt;&amp;nbsp;= k&lt;br /&gt;\n&lt;br /&gt;\n&amp;rArr;&amp;nbsp;&lt;span style=&quot;&quot;&gt;a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;+ b&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;+ c&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&amp;nbsp;&lt;/span&gt;= k(a&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;- bc)&lt;br /&gt;\n&lt;br /&gt;\nIt is given that&amp;nbsp;&lt;span style=&quot;&quot;&gt;a&amp;nbsp;+ b + c = 0, On squaring both sides&lt;/span&gt;&lt;br /&gt;\n&lt;br /&gt;\n&amp;rArr;&amp;nbsp;&lt;span style=&quot;&quot;&gt;a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;+ b&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;+ c&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;+ 2ab + 2bc + 2ac = 0&lt;/span&gt;&lt;br /&gt;\n&lt;br /&gt;\nPutting,&amp;nbsp;&lt;span style=&quot;&quot;&gt;a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;+ b&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;+ c&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;= k(a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;- bc)&lt;br /&gt;\n&lt;br /&gt;\n&amp;rArr;&amp;nbsp;k(a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;- bc)&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;+ 2ab + 2bc + 2ac = 0&lt;br /&gt;\n&lt;br /&gt;\n&amp;rArr; k(a(- b - c) - bc) +&amp;nbsp;2ab + 2bc + 2ac =0&lt;br /&gt;\n&lt;br /&gt;\n&amp;rArr; k(- ab - ac - bc) = -2(ab + bc + ac)&lt;br /&gt;\n&lt;br /&gt;\n&amp;rArr; -k(ab + ac + bc) =&amp;nbsp;-2(ab +&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;bc +&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;ac&lt;/span&gt;&lt;span style=&quot;&quot;&gt;)&lt;br /&gt;\n&lt;br /&gt;\nBy comparing,&lt;strong&gt; k = 2&lt;/strong&gt;&lt;/span&gt;&lt;br /&gt;\n&lt;br /&gt;\n&lt;span style=&quot;&quot;&gt;&lt;strong&gt;The value of&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{{{a^2} + {b^2} + {c^2}}}{{{a^2} - bc}}\\)&lt;/span&gt;&lt;/strong&gt;&lt;/span&gt;&lt;strong&gt;&amp;nbsp;is 2&amp;nbsp;&amp;nbsp;&lt;br /&gt;\n&lt;span style=&quot;display: flex;gap: 6px;align-items: center;&quot;&gt;&lt;img height=&quot;26px&quot; src=&quot;https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png&quot; width=&quot;26px&quot; /&gt;&lt;strong&gt;&lt;span style=&quot;vertical-align: middle;font-size: 21px;&quot;&gt;&lt;u&gt;Shortcut Trick&lt;/u&gt;&lt;/span&gt;&lt;/strong&gt;&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(88, 89, 91);   &quot;&gt;a + b + c = 0 Put the value a = 1, b = 0, c = (-1)&lt;br /&gt;\n&lt;br /&gt;\nLet the value of&amp;nbsp;&lt;/span&gt;&lt;span class=&quot;math-tex&quot; style=&quot;box-sizing: border-box; ;;;;;;;;;;&quot;&gt;\\(\\frac{{{a^2} + {b^2} + {c^2}}}{{{a^2} - bc}}\\)&lt;/span&gt;&lt;span style=&quot;color: rgb(88, 89, 91);   &quot;&gt;&amp;nbsp;= k&amp;nbsp;&amp;nbsp;&lt;br /&gt;\n&lt;br /&gt;\n&amp;rArr; [(1)&lt;sup&gt;2&amp;nbsp;&lt;/sup&gt;&lt;/span&gt;+ 0 +&amp;nbsp;&lt;span style=&quot;color: rgb(88, 89, 91);   &quot;&gt;(-1)&lt;sup&gt;2&lt;/sup&gt;&lt;/span&gt;]/[&lt;span style=&quot;color: rgb(88, 89, 91);   &quot;&gt;(1)&lt;/span&gt;&lt;span style=&quot;box-sizing: border-box;  line-height: 0; position: relative; vertical-align: baseline; top: -0.5em;  font-size:10.5px;&quot;&gt;2&lt;/span&gt;-0&amp;nbsp;&amp;times; (&lt;span style=&quot;color: rgb(88, 89, 91);   &quot;&gt;-1)] = 2 /1 = 2&lt;/span&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If (a<sup>3</sup> + b<sup>3 </sup>+ c<sup>3</sup> - 3abc) = 405, and (a - b)<sup>2</sup> + (b - c)<sup>2</sup> + (c -a)<sup>2</sup> = 54, find the value of (a + b + c).", "options": ["15", "45", "9", "27"], "correct": 1, "solution": "<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png\" width=\"26px\" /> <u style=\"font-size: 21px; font-weight: 700; display: inline !important;\">Shortcut Trick</u></span>\n<p>Formula: a<sup>3</sup> + b<sup>3</sup> + c<sup>3</sup> &minus; 3abc = 1/2 &times; (a + b + c) &times; [(a &minus; b)<sup>2</sup> + (b &minus; c)<sup>2</sup> + (c &minus; a)<sup>2</sup>]</p>\n<p>Substitute the given values directly:</p>\n<p>405 = 1/2 &times; (a + b + c) &times; 54</p>\n<p>405 = 27 &times; (a + b + c) &rArr; a + b + c = 15</p>\n<p><strong>&there4; The correct answer is 15.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Alternate Method</u></span></strong></span></p>\n<p><strong>Given:</strong></p>\n<p>a<sup>3</sup> + b<sup>3</sup> + c<sup>3</sup> &minus; 3abc = 405</p>\n<p>(a &minus; b)<sup>2</sup> + (b &minus; c)<sup>2</sup> + (c &minus; a)<sup>2</sup> = 54</p>\n<p><strong>Formula Used:</strong></p>\n<p>a<sup>3</sup> + b<sup>3</sup> + c<sup>3</sup> &minus; 3abc = 1/2 &times; (a + b + c) &times; [(a &minus; b)<sup>2</sup> + (b &minus; c)<sup>2</sup> + (c &minus; a)<sup>2</sup>]</p>\n<p><strong>Calculation:</strong></p>\n<p>&rArr; 405 = 1/2 &times; (a + b + c) &times; 54</p>\n<p>&rArr; 405 = (a + b + c) &times; 27</p>\n<p>&rArr; a + b + c = 405 &divide; 27</p>\n<p>&rArr; a + b + c = 15</p>\n<p><strong>&there4; The correct answer is 15.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Standard Form of the Identity</p>\n<p style=\"margin:0 0 8px 0;color:#444444;\">a<sup>3</sup> + b<sup>3</sup> + c<sup>3</sup> &minus; 3abc = (a + b + c)(a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup> &minus; ab &minus; bc &minus; ca)</p>\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Conditional Identity</p>\n<p style=\"margin:0 0 8px 0;color:#444444;\">If a + b + c = 0, then a<sup>3</sup> + b<sup>3</sup> + c<sup>3</sup> = 3abc.</p>\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Important Variation</p>\n<p style=\"margin:0 0 8px 0;color:#444444;\">a<sup>3</sup> + b<sup>3</sup> + c<sup>3</sup> &minus; 3abc = (a + b + c)[(a + b + c)<sup>2</sup> &minus; 3(ab + bc + ca)]</p></p>", "marks": 2, "negMarks": 0.5}, {"text": "If (p + q) = 5 and pq = 18, then what is the value of p<sup>3</sup> + q<sup>3</sup> ?", "options": ["-270", "125", "-145", "135"], "correct": 3, "solution": "<span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png\" width=\"26px\" /> <u style=\"font-size: 21px; font-weight: 700; display: inline !important;\">Shortcut Trick</u></span>\n<p>Use the algebraic identity: p<sup>3</sup> + q<sup>3</sup> = (p + q)<sup>3</sup> &minus; 3pq(p + q)</p>\n<p>Given <strong>(p + q) = 5</strong> and <strong>pq = 18</strong>.</p>\n<p>p<sup>3</sup> + q<sup>3</sup> = (5)<sup>3</sup> &minus; 3 &times; 18 &times; 5</p>\n<p>p<sup>3</sup> + q<sup>3</sup> = 125 &minus; 270 = &minus;145</p>\n<p><strong>&there4; The correct answer is -145.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Alternate Method</u></span></strong></span></p>\n<p><strong>Given:</strong></p>\n<p>Sum of variables (p + q) = 5</p>\n<p>Product of variables (pq) = 18</p>\n<p><strong>Formula used:</strong></p>\n<p>p<sup>3</sup> + q<sup>3</sup> = (p + q)(p<sup>2</sup> &minus; pq + q<sup>2</sup>) OR p<sup>3</sup> + q<sup>3</sup> = (p + q)<sup>3</sup> &minus; 3pq(p + q)</p>\n<div style=\"text-align: left;\"><img src=\"https://cdn.repeatermock.com/tb/73ebbfc233ad4c512469af7e042f56ff0c92d5d7e7ccac55956d05484985d1cc.png\" style=\"max-width: 100%; height: auto;\"></div>\n<p><strong>Calculations:</strong></p>\n<p>&rArr; p<sup>3</sup> + q<sup>3</sup> = (p + q)<sup>3</sup> &minus; 3pq(p + q)</p>\n<p>&rArr; p<sup>3</sup> + q<sup>3</sup> = (5)<sup>3</sup> &minus; 3 &times; (18) &times; (5)</p>\n<p>&rArr; p<sup>3</sup> + q<sup>3</sup> = 125 &minus; 270</p>\n<p>&rArr; p<sup>3</sup> + q<sup>3</sup> = &minus;145</p>\n<p>Therefore, the correct option is (3).</p>\n<p><strong>&there4; The correct answer is -145.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Sum of Cubes Identity</p>\n<p style=\"margin:0 0 8px 0;color:#444444;\">The expression can also be written as: p<sup>3</sup> + q<sup>3</sup> = (p + q)(p<sup>2</sup> &minus; pq + q<sup>2</sup>).</p>\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Difference of Cubes Identity</p>\n<p style=\"margin:0 0 8px 0;color:#444444;\">For subtraction: p<sup>3</sup> &minus; q<sup>3</sup> = (p &minus; q)(p<sup>2</sup> + pq + q<sup>2</sup>) = (p &minus; q)<sup>3</sup> + 3pq(p &minus; q).</p>\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Square Identity</p>\n<p style=\"margin:0 0 8px 0;color:#444444;\">(p + q)<sup>2</sup> = p<sup>2</sup> + q<sup>2</sup> + 2pq. This is used to find p<sup>2</sup> + q<sup>2</sup> when individual values are needed.</p>", "marks": 2, "negMarks": 0.5}];const ANALYSIS={};const TEST_META={"title": "Algebra - Identities - 01", "series": "SSC CGL", "totalQuestions": 50, "solutions": 49, "scrapedAt": "2026-09-03 04:03:37 UTC"};</script>
