<script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},svg:{fontCache:'global'},options:{skipHtmlTags:['script','noscript','style','textarea','pre','code']}};const QUESTIONS=[{"text": " If x - 2y = 3 and 2xy = 5, then find the value of (x + 2y)<sup>2</sup>", "options": ["29", "27", "30", "28"], "correct": 1, "solution": "&lt;p&gt;&lt;strong&gt;GIVEN:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;x-2y = 3&lt;/p&gt;\n\n&lt;p&gt;2xy = 5&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;FORMULA USED:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;(a&lt;span style=&quot;font-size: 10.5px;&quot;&gt;&amp;nbsp;&lt;/span&gt;+ b)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= a&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ b&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 2ab&amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;(a&lt;/span&gt;&lt;span style=&quot; &quot;&gt;&amp;nbsp;-&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;b)&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;= a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ b&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;-&amp;nbsp;2ab&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;&amp;nbsp;&lt;/span&gt;&amp;nbsp;&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;CALCULATION:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;Now, (x - 2y) = 3 ,&lt;/p&gt;\n\n&lt;p&gt;on squaring both sides we get,&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;(x - 2y)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= 3&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;x&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 4y&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;- 2&amp;nbsp;&amp;times;&amp;nbsp; x &amp;times; 2y = 9&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;x&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 4y&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= 9 + 4xy&amp;nbsp; &amp;nbsp; &amp;nbsp; ----(1)&lt;/p&gt;\n\n&lt;p&gt;Also , it is given 2xy = 5&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; xy = 5/2&amp;nbsp; &amp;nbsp; &amp;nbsp; ----( 2)&lt;/p&gt;\n\n&lt;p&gt;Now,&amp;nbsp;(x + 2y)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= x&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 4y&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 4xy&amp;nbsp; &amp;nbsp; &amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;put the value of&amp;nbsp;x&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 4y&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;from equation (1) and the value of xy from equation (2),&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;&lt;span style=&quot;&quot;&gt;(x + 2y)&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;= (9 + 4xy)&amp;nbsp;+ 4&amp;times; 5/2&amp;nbsp; &amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&lt;/span&gt;( 9+ 4&amp;nbsp;&amp;times; 5/2 ) + 10&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&lt;/span&gt; (19 +10) = 29.&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Hence, the value is 29.&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If the sum of two numbers x and y is 12 and their product is 27, then find the sum of their cubes.", "options": ["576", "657", "756", "765"], "correct": 3, "solution": "&lt;p style=&quot;color: rgb(33, 37, 41);&quot;&gt;&lt;span style=&quot;font-weight: bolder;&quot;&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;​&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;Given:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;color: rgb(33, 37, 41);&quot;&gt;Sum of two numbers x and y is 12&amp;nbsp;and their product is 27&lt;/p&gt;\n\n&lt;p style=&quot;color: rgb(33, 37, 41);&quot;&gt;&lt;span style=&quot;font-weight: bolder;&quot;&gt;Formula Used:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;color: rgb(33, 37, 41);&quot;&gt;a&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;+ b&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;= (a + b)(a&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;- ab + b&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;)&lt;/p&gt;\n\n&lt;p style=&quot;color: rgb(33, 37, 41);&quot;&gt;(a + b)&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;= a&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+&amp;nbsp;b&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ 2ab&lt;/p&gt;\n\n&lt;p style=&quot;color: rgb(33, 37, 41);&quot;&gt;&lt;span style=&quot;font-weight: bolder;&quot;&gt;Solution:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;color: rgb(33, 37, 41);&quot;&gt;x + y = 12&lt;/p&gt;\n\n&lt;p style=&quot;color: rgb(33, 37, 41);&quot;&gt;xy = 27&lt;/p&gt;\n\n&lt;p style=&quot;color: rgb(33, 37, 41);&quot;&gt;12&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;=&amp;nbsp;a&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+&amp;nbsp;b&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ 2&amp;times; 27&lt;/p&gt;\n\n&lt;p style=&quot;color: rgb(33, 37, 41);&quot;&gt;a&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+&amp;nbsp;b&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&amp;nbsp;&lt;/span&gt;= 90&lt;/p&gt;\n\n&lt;p style=&quot;color: rgb(33, 37, 41);&quot;&gt;&lt;span style=&quot;  font-weight: var(--bs-body-font-weight); text-align: var(--bs-body-text-align);&quot;&gt;a&lt;/span&gt;&lt;span style=&quot; font-weight: var(--bs-body-font-weight); text-align: var(--bs-body-text-align); position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;  font-weight: var(--bs-body-font-weight); text-align: var(--bs-body-text-align);&quot;&gt;&amp;nbsp;+ b&lt;/span&gt;&lt;span style=&quot; font-weight: var(--bs-body-font-weight); text-align: var(--bs-body-text-align); position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;  font-weight: var(--bs-body-font-weight); text-align: var(--bs-body-text-align);&quot;&gt;&amp;nbsp;= (a + b)(a&lt;/span&gt;&lt;span style=&quot; font-weight: var(--bs-body-font-weight); text-align: var(--bs-body-text-align); position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;  font-weight: var(--bs-body-font-weight); text-align: var(--bs-body-text-align);&quot;&gt;&amp;nbsp;- ab + b&lt;/span&gt;&lt;span style=&quot; font-weight: var(--bs-body-font-weight); text-align: var(--bs-body-text-align); position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;  font-weight: var(--bs-body-font-weight); text-align: var(--bs-body-text-align);&quot;&gt;)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;color: rgb(33, 37, 41);&quot;&gt;&lt;span style=&quot;  font-weight: var(--bs-body-font-weight); text-align: var(--bs-body-text-align);&quot;&gt;&amp;rArr; 12(90 - 27)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;color: rgb(33, 37, 41);&quot;&gt;&lt;span style=&quot;  font-weight: var(--bs-body-font-weight); text-align: var(--bs-body-text-align);&quot;&gt;&amp;rArr; 756&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;color: rgb(33, 37, 41);&quot;&gt;&lt;strong&gt;&lt;span style=&quot;  font-weight: var(--bs-body-font-weight); text-align: var(--bs-body-text-align);&quot;&gt;&amp;there4; T&lt;/span&gt;he sum of their cubes is 756.&lt;span style=&quot;  font-weight: var(--bs-body-font-weight); text-align: var(--bs-body-text-align);&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If a + b = 10 and 3/7 of ab = 9, then the value of a<sup>3</sup> + b<sup>3</sup> is:", "options": ["350", "370", "270", "360"], "correct": 2, "solution": "<span style='display: flex;gap: 6px;align-items: center;'><img height='26px' src='https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png' width='26px' /> <u style='font-size: 21px; font-weight: 700; display: inline !important;'>Shortcut Trick</u></span>\n<p>Given <strong>a + b = 10</strong> and <strong>3/7 &times; ab = 9</strong>.</p>\n<p>Solve for <strong>ab</strong>: ab = (9 &times; 7) &divide; 3 = <strong>21</strong>.</p>\n<p>Apply the <strong>algebraic identity</strong>: a<sup>3</sup> + b<sup>3</sup> = (a + b)<sup>3</sup> &minus; 3ab(a + b).</p>\n<p>Substitute values: 10<sup>3</sup> &minus; 3(21)(10) = 1000 &minus; 630 = <strong>370</strong>.</p>\n<p><strong>&there4; The correct answer is 370.</strong></p>\n<p><span style='display: flex;gap: 6px;align-items: center;'><img height='26px' src='https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png' width='26px' /><strong><span style='vertical-align: middle;font-size: 21px;'><u>Alternate Method</u></span></strong></span></p>\n<p><strong>Given:</strong></p>\n<p>Sum of two numbers, <strong>a + b = 10</strong></p>\n<p>Product relationship, <strong>3/7 of ab = 9</strong></p>\n<p><strong>Formula Used:</strong></p>\n<p>We use the <strong>cubic expansion identity</strong>: a<sup>3</sup> + b<sup>3</sup> = (a + b)<sup>3</sup> &minus; 3ab(a + b)</p>\n<div style=\"text-align: left;\"><img src=\"https://cdn.repeatermock.com/tb/0425776cd704ea1aa9ec383d1e369b39dc95f75a83d14bbc45f2693913042436.png\" style=\"max-width: 100%; height: auto;\"></div>\n<p><strong>Calculations:</strong></p>\n<p>&rArr; From the given product ratio: (3/7) &times; ab = 9</p>\n<p>&rArr; 3 &times; ab = 9 &times; 7</p>\n<p>&rArr; 3 &times; ab = 63</p>\n<p>&rArr; <strong>ab = 21</strong></p>\n<p>&rArr; Now, applying the formula for <strong>a<sup>3</sup> + b<sup>3</sup></strong>:</p>\n<p>&rArr; a<sup>3</sup> + b<sup>3</sup> = (a + b)<sup>3</sup> &minus; 3ab(a + b)</p>\n<p>&rArr; a<sup>3</sup> + b<sup>3</sup> = (10)<sup>3</sup> &minus; 3 &times; 21 &times; 10</p>\n<p>&rArr; a<sup>3</sup> + b<sup>3</sup> = 1000 &minus; (63 &times; 10)</p>\n<p>&rArr; a<sup>3</sup> + b<sup>3</sup> = 1000 &minus; 630</p>\n<p>&rArr; <strong>a<sup>3</sup> + b<sup>3</sup> = 370</strong></p>\n<p><strong>&there4; The correct answer is 370.</strong></p>\n<p><span style='display: flex;gap: 6px;align-items: center;'><img height='26px' src='https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png' width='26px' /><strong><span style='vertical-align: middle;font-size: 21px;'><u>Additional Information</u></span></strong></span></p>\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>Fundamental Cubic Identities</p>\n<p style='margin:0 0 8px 0;color:#444444;'>a<sup>3</sup> + b<sup>3</sup> = (a + b)(a<sup>2</sup> &minus; ab + b<sup>2</sup>) and a<sup>3</sup> &minus; b<sup>3</sup> = (a &minus; b)(a<sup>2</sup> + ab + b<sup>2</sup>).</p>\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>Expansion of (a + b)<sup>3</sup></p>\n<p style='margin:0 0 8px 0;color:#444444;'>(a + b)<sup>3</sup> = a<sup>3</sup> + b<sup>3</sup> + 3ab(a + b). Rearranging this gives the direct substitution formula used above.</p>\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>Relationship with Squares</p>\n<p style='margin:0 0 8px 0;color:#444444;'>a<sup>2</sup> + b<sup>2</sup> = (a + b)<sup>2</sup> &minus; 2ab. This is often a preliminary step in solving for higher powers like a<sup>4</sup> + b<sup>4</sup>.</p>", "marks": 2, "negMarks": 0.5}, {"text": "If x + y + z = 3, and x<sup>2</sup> + y<sup>2</sup> + z<sup>2</sup> = 101, then what is the value of <span class=\"math-tex\">\\(\\sqrt {{x^3} + {y^3} + {z^3} - 3xyz}\\)</span>?", "options": ["24", "21", "19", "28"], "correct": 2, "solution": "", "marks": 2, "negMarks": 0.5}, {"text": "If x<sup>2 </sup>–4x + 1 = 0, then what is the value of (x<sup>6</sup> + x<sup>-6</sup>)?", "options": ["2786", "2702", "2716", "2744"], "correct": 2, "solution": "<p>x<sup>2</sup> – 4x + 1 = 0</p>\n\n<p>Divided by x</p>\n\n<p>x – 4 + 1/x = 0</p>\n\n<p>x + 1/x = 4</p>\n\n<p>As we know,</p>\n\n<p>(x + 1/x)<sup>2</sup> = x<sup>2</sup> + 1/x<sup>2</sup> + 2</p>\n\n<p>4<sup>2</sup> = x<sup>2</sup> + 1/x<sup>2</sup> + 2</p>\n\n<p>x<sup>2</sup> + 1/x<sup>2</sup> = 16 – 2 = 14</p>\n\n<p>Again As we know,</p>\n\n<p>(x<sup>2</sup> + 1/x<sup>2</sup>)<sup>3</sup> = x<sup>6</sup> + 1/x<sup>6</sup> + 3(x<sup>2</sup> + 1/x<sup>2</sup>)</p>\n\n<p>(14)<sup>3</sup> = x<sup>6</sup> + 1/x<sup>6</sup> + 3 × 14</p>\nx<sup>6</sup> + x<sup>-6</sup> = 2744 – 42 = 2702", "marks": 2, "negMarks": 0.5}, {"text": "The cube of the sum of two given numbers is 1728 , while the product of the two given numbers is 32. Find the positive difference between the cubes of the two given numbers.", "options": ["448", "576", "<span style=\"color: rgb(33, 37, 41);\">​</span><span style=\"color: rgb(33, 37, 41);\">480</span>", "512"], "correct": 1, "solution": "&lt;p&gt;&lt;strong&gt;Given&lt;/strong&gt;:&lt;/p&gt;\n\n&lt;p&gt;(A + B)&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;= 1728&lt;/p&gt;\n\n&lt;p&gt;AB = 32&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Formula used:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;(A + B&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;)&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;/span&gt;&amp;nbsp;=&amp;nbsp;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;A&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;+ B&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;+ 2AB&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;(A - B)&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;=&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;A&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;+ B&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41); position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;- 2AB&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;A&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;- B&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;= (A - B)&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;+ 3AB &amp;times; (A - B)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;(A + B)&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;= 1728&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;(A + B)&lt;sup&gt;3&lt;/sup&gt; = (12)&lt;sup&gt;3&lt;/sup&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;rArr; (A + B) = 12&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span styl ot;color: rgb(33, 37, 41);&quot;&gt;&amp;rArr;&amp;nbsp;2ab + 2bc +&amp;nbsp;2ab + 2bc + 4ac&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;rArr;&amp;nbsp;4(ab + bc + ca)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;The answer is&amp;nbsp;4(ab + bc + ca)&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If a + b = 10 and ab = 9, then the value of a - b is:", "options": ["7", "5", "8", "6"], "correct": 3, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;a + b = 10&lt;/p&gt;\n\n&lt;p&gt;ab = 9&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Concept Used:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;(a&amp;nbsp;&amp;ndash; b)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= a&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ b&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;&amp;ndash;&amp;nbsp;2ab&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; Squaring (a&amp;nbsp;&amp;ndash; b), we get&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;&lt;span style=&quot;&quot;&gt;(a&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;ndash; b)&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;= (a + b)&lt;sup&gt;2&lt;/sup&gt;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;&amp;ndash;&amp;nbsp;4ab&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; Putting the values in the formula,&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; (a&amp;nbsp;&amp;ndash; b)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= 10&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;&amp;ndash; 4&amp;nbsp;&amp;times; 9 = 100&amp;nbsp;&amp;ndash; 36&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;(a&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;ndash; b)&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;= 64&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; a&amp;nbsp;&amp;ndash; b =&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\sqrt{64}\\)&lt;/span&gt;&lt;/span&gt;&amp;nbsp;= 8&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Therefore, the value of a&amp;nbsp;&amp;ndash; b is 8.&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If 9(a<sup>2</sup> + b<sup>2</sup>) + c<sup>2</sup> + 20 = 12(a + 2b), then the value of <span class=\"math-tex\">\\(\\sqrt{6a + 9b + 2c}\\)</span> is:", "options": ["6", "3", "4", "2"], "correct": 3, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;9(a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ b&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;) + c&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ 20 = 12(a + 2b)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Concept used:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;(a + b)&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;= a&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ b&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ 2ab&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;(a - b)&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;= a&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ b&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;- 2ab&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;9(a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ b&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;) + c&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ 20 = 12(a + 2b)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;9a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ 9b&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ c&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ 20 = 12a + 24b&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;9a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;- 12a + 9b&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;- 24b + c&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ 20 = 0&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;9a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;- 12a + 4 + 9b&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;- 24b + 16 + c&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;= 0&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; (3a&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;-&amp;nbsp;2)&lt;sup&gt;2&lt;/sup&gt; + (3b&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;- 4)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ c&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;= 0&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;(3a&amp;nbsp;-&amp;nbsp;2)&amp;nbsp;= 0&lt;/p&gt;\n\n&lt;p&gt;(3b&amp;nbsp;- 4)&amp;nbsp;= 0&lt;/p&gt;\n\n&lt;p&gt;c&amp;nbsp;= 0&lt;/p&gt;\n\n&lt;p&gt;a = 2/3&lt;/p&gt;\n\n&lt;p&gt;b = 4/3&lt;/p&gt;\n\n&lt;p&gt;c = 0&lt;/p&gt;\n\n&lt;p&gt;So,&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\sqrt{6a + 9b + 2c}\\)&lt;/span&gt;&amp;nbsp;=&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\sqrt{6 \\times 2/3 + 9 \\times 4/3}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\sqrt{4 + 12}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; 4&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&amp;there4; Required answer is 4&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "Simplify the following expression.<br />\n<span class=\"math-tex\">\\(\\frac{(x - y)^3 + (y - z)^3 + (z - x)^3}{(x - y)(y - z)(z - x)}\\)</span>", "options": ["3", "1", "0", "2"], "correct": 1, "solution": "<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png\" width=\"26px\" /> <u style=\"font-size: 21px; font-weight: 700; display: inline !important;\">Shortcut Trick</u></span>\n<p>If a + b + c = 0, then a<sup>3</sup> + b<sup>3</sup> + c<sup>3</sup> = 3abc.</p>\n<p>Here, let the terms be (x &minus; y), (y &minus; z), and (z &minus; x).</p>\n<p>Since (x &minus; y) + (y &minus; z) + (z &minus; x) = 0, their cube sum is 3(x &minus; y)(y &minus; z)(z &minus; x).</p>\n<p>Dividing this by the denominator (x &minus; y)(y &minus; z)(z &minus; x) leaves only 3.</p>\n<p><strong>&there4; The correct answer is 3.</strong></p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Alternate Method</u></span></strong></span></p>\n<p><strong>Given:</strong></p>\n<p>Expression: [(x &minus; y)<sup>3</sup> + (y &minus; z)<sup>3</sup> + (z &minus; x)<sup>3</sup>] &divide; [(x &minus; y)(y &minus; z)(z &minus; x)]</p>\n<p><strong>Formula Used:</strong></p>\n<p>If a + b + c = 0, then a<sup>3</sup> + b<sup>3</sup> + c<sup>3</sup> = 3abc</p>\n<p><strong>Calculation:</strong></p>\n<p>&rArr; Let a = x &minus; y, b = y &minus; z, and c = z &minus; x</p>\n<p>&rArr; Summing the terms: a + b + c = (x &minus; y) + (y &minus; z) + (z &minus; x)</p>\n<p>&rArr; a + b + c = x &minus; y + y &minus; z + z &minus; x = 0</p>\n<p>&rArr; According to the identity, a<sup>3</sup> + b<sup>3</sup> + c<sup>3</sup> = 3abc</p>\n<p>&rArr; Substituting the assumed variables back:</p>\n<p>&rArr; (x &minus; y)<sup>3</sup> + (y &minus; z)<sup>3</sup> + (z &minus; x)<sup>3</sup> = 3(x &minus; y)(y &minus; z)(z &minus; x)</p>\n<p>&rArr; Now substitute the numerator in the given expression:</p>\n<p>&rArr; Expression = [3(x &minus; y)(y &minus; z)(z &minus; x)] &divide; [(x &minus; y)(y &minus; z)(z &minus; x)]</p>\n<p>&rArr; The common terms cancel out, leaving the final value as 3</p>\n<p><strong>&there4; The correct answer is 3.</strong></p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Standard Identity for Cubes</p>\n<p style=\"margin:0 0 8px 0;color:#444444;\">a<sup>3</sup> + b<sup>3</sup> + c<sup>3</sup> &minus; 3abc = (a + b + c)(a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup> &minus; ab &minus; bc &minus; ca)</p>\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Cubes of Binomials</p>\n<p style=\"margin:0 0 8px 0;color:#444444;\">(a + b)<sup>3</sup> = a<sup>3</sup> + b<sup>3</sup> + 3ab(a + b)<br/>(a &minus; b)<sup>3</sup> = a<sup>3</sup> &minus; b<sup>3</sup> &minus; 3ab(a &minus; b)</p>\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Sum and Difference of Cubes</p>\n<p style=\"margin:0 0 8px 0;color:#444444;\">a<sup>3</sup> + b<sup>3</sup> = (a + b)(a<sup>2</sup> &minus; ab + b<sup>2</sup>)<br/>a<sup>3</sup> &minus; b<sup>3</sup> = (a &minus; b)(a<sup>2</sup> + ab + b<sup>2</sup>)</p></p>", "marks": 2, "negMarks": 0.5}, {"text": "If a + b + c = 0 and a<sup>2 </sup>+ b<sup>2</sup> + c<sup>2</sup> = 40, then what is the value of ab + bc + ca?", "options": ["<span style=\"\">-30</span>", "<span style=\"\">-20</span>", "<span style=\"\">-25</span>", "<span style=\"\">-40</span>"], "correct": 2, "solution": "<span style='display: flex;gap: 6px;align-items: center;'><img height='26px' src='https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png' width='26px' /> <u style='font-size: 21px; font-weight: 700; display: inline !important;'>Shortcut Trick</u></span>\n<p>Apply the <strong>algebraic identity</strong> for the square of a trinomial: (a + b + c)<sup>2</sup> = (a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup>) + 2(ab + bc + ca).</p>\n<p>Substitute the given values: 0<sup>2</sup> = 40 + 2(ab + bc + ca).</p>\n<p>0 = 40 + 2(ab + bc + ca) &rarr; 2(ab + bc + ca) = &minus;40.</p>\n<p>Dividing by 2, we get ab + bc + ca = &minus;20.</p>\n<p><strong>&there4; The correct answer is &minus;20.</strong></p>\n\n<p><span style='display: flex;gap: 6px;align-items: center;'><img height='26px' src='https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png' width='26px' /><strong><span style='vertical-align: middle;font-size: 21px;'><u>Alternate Method</u></span></strong></span></p>\n<p><strong>Given:</strong></p>\n<p>a + b + c = 0</p>\n<p>a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup> = 40</p>\n<p><strong>Formula Used:</strong></p>\n<p>(a + b + c)<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup> + 2(ab + bc + ca)</p>\n<div style=\"text-align: left;\"><img src=\"https://cdn.repeatermock.com/tb/7254c5e7b193fe8058e07dee11edbf79f19e0c64a626c371d4d3976af2ea7d93.png\" style=\"max-width: 100%; height: auto;\"></div>\n<p>&rArr; Substitute the known values into the identity:</p>\n<p>&rArr; (0)<sup>2</sup> = 40 + 2(ab + bc + ca)</p>\n<p>&rArr; 0 = 40 + 2(ab + bc + ca)</p>\n<p>&rArr; 2(ab + bc + ca) = &minus;40</p>\n<p>&rArr; ab + bc + ca = &minus;40 &divide; 2</p>\n<p>&rArr; ab + bc + ca = &minus;20</p>\n<p><strong>&there4; The correct answer is &minus;20.</strong></p>\n\n<p><span style='display: flex;gap: 6px;align-items: center;'><img height='26px' src='https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png' width='26px' /><strong><span style='vertical-align: middle;font-size: 21px;'><u>Additional Information</u></span></strong></span></p>\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>Algebraic Identity - Square of Trinomial</p>\n<p style='margin:0 0 8px 0;color:#444444;'>The formula <strong>(a + b + c)<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup> + 2(ab + bc + ca)</strong> connects the sum of three numbers, the sum of their squares, and the sum of their pairwise products.</p>\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>Special Case: Sum is Zero</p>\n<p style='margin:0 0 8px 0;color:#444444;'>If <strong>a + b + c = 0</strong>, then <strong>a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup> = &minus;2(ab + bc + ca)</strong>. This implies that the sum of pairwise products must be negative if the squares are positive.</p>\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>Cubic Identity when Sum is Zero</p>\n<p style='margin:0 0 8px 0;color:#444444;'>When <strong>a + b + c = 0</strong>, the cubic identity simplifies to <strong>a<sup>3</sup> + b<sup>3</sup> + c<sup>3</sup> = 3abc</strong>.</p>", "marks": 2, "negMarks": 0.5}, {"text": "If 2x + 3y + 1 = 0, then what is the value of (8x<sup>3</sup> + 8 + 27y<sup>3</sup> - 18xy)?", "options": ["-7", "-9", "7", "9"], "correct": 3, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;2x + 3y = -1&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Formula used:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;(a + b)&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;= a&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;+ b&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;+ 3ab(a + b)&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;According to the question&lt;/p&gt;\n\n&lt;p&gt;2x + 3y + 1 = 0&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; 2x + 3y = -1&lt;/p&gt;\n\n&lt;p&gt;Now,&lt;/p&gt;\n\n&lt;p&gt;(2x + 3y)&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;= (2x)&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;+ (3y)&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;+ 3&amp;nbsp;&amp;times; 2x&amp;nbsp;&amp;times; 3y (-1) = -1&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; 8x&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;+ 27y&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;&amp;ndash;&amp;nbsp;18xy = -1&lt;/p&gt;\n\n&lt;p&gt;Now,&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;The value of (8x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ 8 + 27y&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;&lt;/span&gt;&amp;ndash;&amp;nbsp;&lt;span style=&quot;&quot;&gt;18xy) = (8&amp;nbsp;&lt;/span&gt;&amp;ndash;&amp;nbsp;1)&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; 7&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&amp;there4; The required value is 7&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If x = 14, y = 15 and z = 17, then the value of x<sup>3</sup> + y<sup>3</sup> + z<sup>3</sup> - 3xyz is:", "options": ["333", "322", "312", "222"], "correct": 2, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;x = 14&amp;nbsp;; y = 15 ; z = 17&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Formula used:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;x&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;+ y&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;+ z&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;- 3xyz = 1/2&amp;nbsp;&amp;times; (x + y + z)&amp;nbsp;&amp;times; [(x -y)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ &lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;(y -z)&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;+ (z - x)&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;]&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p style=&quot;color: rgb(33, 37, 41);&quot;&gt;x&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;+ y&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;+ z&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;- 3xyz = 1/2&amp;nbsp;&amp;times; (x + y + z)&amp;nbsp;&amp;times; [(x -y)&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+&amp;nbsp;(y -z)&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+&amp;nbsp;(z - x)&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;]&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;1/2&amp;nbsp;&amp;times; (14 + 15 + 17)&amp;nbsp;&amp;times; [(14 - 15)&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41); position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;+&amp;nbsp;(15 - 17)&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41); position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;+&amp;nbsp;(17 - 14)&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41); position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;]&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;rArr; 23&amp;nbsp;&amp;times; [(- 1)&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+&amp;nbsp;(- 2)&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+&amp;nbsp;(3)&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;]&lt;/p&gt;\n\n&lt;p style=&quot;color: rgb(33, 37, 41);&quot;&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;rArr; 23&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;&amp;times; [1&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;+ 4&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;+ 9&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;]&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;color: rgb(33, 37, 41);&quot;&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;rArr; 23&amp;nbsp;&amp;times;&amp;nbsp; 14 = 322&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;color: rgb(33, 37, 41);&quot;&gt;&lt;strong&gt;&amp;there4; The correct answer is 322.&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If a + b =11 and ab = 35, then what is the value of (a<sup>4</sup> + b<sup>4</sup>)?", "options": ["151", "261", "124", "102"], "correct": 1, "solution": "&lt;p&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;Given:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;a + b = 11 and ab = 35&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;Concept used:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;1. (a + b)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= a&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 2ab + b&lt;sup&gt;2&lt;/sup&gt;&lt;/p&gt;\n\n&lt;p&gt;2. a&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ b&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= (a + b)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;- 2ab&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;Calculation:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;a + b = 11&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; (a + b)&lt;sup&gt;2&lt;/sup&gt; = 11&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;(Taking square on both sides)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; a&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 2ab + b&lt;sup&gt;2&lt;/sup&gt;&lt;/span&gt;&amp;nbsp;= 121&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; (a&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ b&lt;sup&gt;2&lt;/sup&gt;) = 121 - 2&amp;nbsp;&amp;times; 35&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; (a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ b&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;) = 51&amp;nbsp; &amp;nbsp; &amp;nbsp; ....(1)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;Now, (a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;4&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ b&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;4&lt;/span&gt;&lt;span style=&quot;&quot;&gt;)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; (a&lt;sup&gt;2&lt;/sup&gt;)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ (b&lt;sup&gt;2&lt;/sup&gt;)&lt;sup&gt;2&lt;/sup&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; (a&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ b&lt;sup&gt;2&lt;/sup&gt;)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;-&amp;nbsp;2a&lt;sup&gt;2&lt;/sup&gt;b&lt;sup&gt;2&lt;/sup&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; (51)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;- 2&amp;nbsp;&amp;times; 35&lt;sup&gt;2&lt;/sup&gt;&lt;/span&gt;&amp;nbsp;(From 1)&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; 151&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;font-weight: 700; &quot;&gt;&amp;there4; The required value is 151.&lt;/span&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If <span class=\"math-tex\">\\({{x - 1} \\over x} = 5\\)</span> then the value of 1 + <span class=\"math-tex\">\\(\\frac{1}{{{x^2}}}\\)</span> is :", "options": ["18", "16", "27", "17"], "correct": 4, "solution": "&lt;p&gt;&lt;strong&gt;Solution:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\({{x - 1} \\over x} = 5\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; x - 1 = 5x&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;rArr;&amp;nbsp;&lt;/span&gt;x = -1/4&lt;/p&gt;\n\n&lt;p&gt;Therefore,&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;rArr;&amp;nbsp;&lt;/span&gt;1 +&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{1}{{{x^2}}}\\)&lt;/span&gt;&amp;nbsp;= 1 + 1/(-1/4)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;rArr;&amp;nbsp;1 +&amp;nbsp;&lt;/span&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{1}{{{x^2}}}\\)&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;= 1 + 16&amp;nbsp;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&amp;there4; 1 +&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(1 \\over x^2\\)&lt;/span&gt;&amp;nbsp;= 17&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "<p>If a + b + c = 2 and ab + bc + ca = -1, then the value of a<sup>3</sup> + b<sup>3</sup> + c<sup>3</sup> - 3 abc is:</p>\n", "options": ["10", "14", "2", "5"], "correct": 2, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;a + b + c = 2&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;ab + bc + ca.= -1&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&lt;span style=&quot;&quot;&gt;Concept used:&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ b&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ c&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;- 3abc&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;= (a + b + c)( a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ b&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ c&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;&amp;ndash; ab &amp;ndash; bc &amp;ndash; ca)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;a&lt;sup&gt;2&lt;/sup&gt; + b&lt;sup&gt;2&lt;/sup&gt; + c&lt;sup&gt;2&lt;/sup&gt; + 2(ab + bc + ca) = 4&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; &lt;span style=&quot;&quot;&gt;a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ b&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ c&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;- 2 = 4&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ b&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ c&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;= 6&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;Now,&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ b&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ c&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;- 3abc&lt;/span&gt;&amp;nbsp;= 2&amp;nbsp;{6&amp;nbsp;&amp;ndash; (- 1)}&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; 14&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&amp;there4; Required answer is 14&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If x + y = 18 and xy = 9, then the value of <span class=\"math-tex\">\\(\\rm \\left(\\frac{x}{y}+\\frac{y}{x}\\right)\\)</span> will be:", "options": ["32", "38", "34", "36"], "correct": 3, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;If x + y = 18 and xy = 9&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Formula used:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\dfrac{x}{y} + \\dfrac{y}{x} = \\dfrac{x^2 + y^2}{xy}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;We know, &lt;span class=&quot;math-tex&quot;&gt;\\((x + y)^2 = x^2 + y^2 + 2xy\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;Given: x + y = 18 and xy = 9&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; &lt;span class=&quot;math-tex&quot;&gt;\\((18)^2 = x^2 + y^2 + 2 \\times 9\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; &lt;span class=&quot;math-tex&quot;&gt;\\(324 = x^2 + y^2 + 18\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; &lt;span class=&quot;math-tex&quot;&gt;\\(x^2 + y^2 = 324 - 18\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; &lt;span class=&quot;math-tex&quot;&gt;\\(x^2 + y^2 = 306\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; &lt;span class=&quot;math-tex&quot;&gt;\\(\\dfrac{x^2 + y^2}{xy} = \\dfrac{306}{9}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; &lt;span class=&quot;math-tex&quot;&gt;\\(\\dfrac{306}{9} = 34\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&amp;there4; The correct answer is option (3).&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": " if 2<span class=\"math-tex\">\\(\\sqrt {2} \\)</span> x<sup>3 </sup>- 3<span class=\"math-tex\">\\(\\sqrt {3} \\)</span> y<sup>3 </sup>= <span class=\"math-tex\">\\((\\sqrt {2}x -\\sqrt {3} y) \\)</span> (Ax<sup>2</sup>- Bxy+ Cy<sup>2</sup>),  then the value of <span class=\"math-tex\">\\(\\sqrt {(A^2 + B^2 + C^2)} \\)</span> is:", "options": ["<span class=\"math-tex\">\\(\\sqrt {19} \\)</span>", "<span class=\"math-tex\">\\(\\sqrt {11} \\)</span>", "<span class=\"math-tex\">\\(\\sqrt {17} \\)</span>", "<span class=\"math-tex\">\\(\\sqrt {21} \\)</span>"], "correct": 1, "solution": "&lt;p&gt;&lt;strong&gt;Formula used:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;font-size: 14px;&quot;&gt;x&lt;/span&gt;&lt;sup&gt;3&amp;nbsp;&lt;/sup&gt;- y&lt;sup&gt;3 &lt;/sup&gt;= (x - y) (x&lt;sup&gt;2 &lt;/sup&gt;+ y&lt;sup&gt;2&lt;/sup&gt; + xy)&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculations:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;The expression 2&amp;radic;2 x&lt;sup&gt;3&lt;/sup&gt; - 3&amp;radic;3 y&lt;sup&gt;3&lt;/sup&gt; could be rearranged as&amp;nbsp;&lt;span style=&quot;&quot;&gt;(&amp;radic;2x - &amp;radic;3y) (2x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;+ 3y&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;+ &amp;radic;2&amp;radic;3xy)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; (&amp;radic;2x - &amp;radic;3y) (2x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;+ 3y&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;+ &amp;radic;2&amp;radic;3xy) = (&amp;radic;2x - &amp;radic;3y) (Ax&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;- Bxy + Cy&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;Cancelling the common term&amp;nbsp;(&amp;radic;2x - &amp;radic;3y) both sides-&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;(2x&lt;sup&gt;2&amp;nbsp;&lt;/sup&gt;&lt;sup&gt;&amp;nbsp;&lt;/sup&gt;+ &amp;radic;2&amp;radic;3xy &lt;span style=&quot;&quot;&gt;+ 3y&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;) = (Ax&lt;sup&gt;2&amp;nbsp;&lt;/sup&gt;- Bxy + Cy&lt;sup&gt;2&lt;/sup&gt;)&lt;/p&gt;\n\n&lt;p&gt;Comparing the coefficients of x&lt;sup&gt;2&lt;/sup&gt;, y&lt;sup&gt;2,&amp;nbsp;&lt;/sup&gt;and xy, we get-&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; A = 2&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; B = -&amp;radic;2&amp;radic;3&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; C = 3&lt;/p&gt;\n\n&lt;p&gt;Using the values of A, B, and C in the expression&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\sqrt{A^2+B^2+C^2}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; &lt;span class=&quot;math-tex&quot;&gt;\\(\\sqrt{2^2+3^2+(-\\sqrt2\\sqrt3)^2 }\\)&lt;/span&gt;&amp;nbsp; =&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\sqrt19\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;The answer to the expression is&amp;nbsp;&lt;span style=&quot;&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\sqrt19\\)&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If <span class=\"math-tex\">\\(\\sqrt 5 \\)</span> = 2.24, then find the value of <span class=\"math-tex\">\\(\\sqrt {\\frac{{\\sqrt {5 }-1 }}{{\\sqrt {5 }+1 }}} \\)</span> .", "options": ["0.68", "0.55", "0.62", "0.59"], "correct": 3, "solution": "&lt;p&gt;&lt;strong&gt;GIVEN:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\sqrt5\\)&lt;/span&gt;&amp;nbsp;= 2.24&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;FORMULA USED:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;( a + b) ( a - b) = a&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;- b&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;Where, a = 1st term , b = 2nd term&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;CALCULATION:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;Here, we have&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\sqrt5\\)&lt;/span&gt;&amp;nbsp;= 2.24&lt;/p&gt;\n\n&lt;p&gt;Now, we have to find the value of&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\sqrt{ \\sqrt5 - 1 \\over \\sqrt5 + 1}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;On multiplying&amp;nbsp; by&amp;nbsp; (&lt;span class=&quot;math-tex&quot;&gt;\\(\\sqrt5\\)&lt;/span&gt;&amp;nbsp;-&amp;nbsp;1 ) on both numerator and denominator , we get&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\sqrt { \\ (\\sqrt5 -1 ) \\times (\\sqrt5 - 1) \\over (\\sqrt5 + 1) \\times (\\sqrt5 - 1) }\\)&lt;/span&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\)&lt;/span&gt;&amp;nbsp;=&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\sqrt{(\\sqrt5 - 1 )^2 \\over \\sqrt5^2 - 1^2 }\\)&lt;/span&gt;&amp;nbsp;=&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\sqrt{ (\\sqrt5 - 1)^2 \\over 4 }\\)&lt;/span&gt;&amp;nbsp;=&amp;nbsp; (&lt;span class=&quot;math-tex&quot;&gt;\\(\\sqrt5\\)&lt;/span&gt;&amp;nbsp;- 1 ) / 2&amp;nbsp; = ( 2.24 - 1) /2 = 1.24 /2 = 0.62&amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&amp;nbsp;[As, a + b) ( a - b) = a&lt;sup&gt;2&amp;nbsp;&lt;/sup&gt;- b&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;]&amp;nbsp; .&amp;nbsp; Here a =&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\sqrt5\\)&lt;/span&gt;&amp;nbsp;, b = 1&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Hence, the required value is 0.62 .&lt;/strong&gt;&amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If <span class=\"math-tex\">\\(K+\\frac{1}{K}=-3\\)</span>, then what is the value of <span class=\"math-tex\">\\([2\\left(\\frac{K^6+1}{K^3}\\right)]+\\left(\\frac{K^4+1}{K^2}\\right)\\)</span>?", "options": ["<span style=\"\">27</span>", "<span style=\"\">-29</span>", "<span style=\"\">29</span>", "<span style=\"\">-27</span>"], "correct": 2, "solution": "<span style='display: flex;gap: 6px;align-items: center;'><img height='26px' src='https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png' width='26px' /> <u style='font-size: 21px; font-weight: 700; display: inline !important;'>Shortcut Trick</u></span>\n<p>If <strong>K + 1/K = a</strong>, then <strong>K<sup>2</sup> + 1/K<sup>2</sup> = a<sup>2</sup> &minus; 2</strong> and <strong>K<sup>3</sup> + 1/K<sup>3</sup> = a<sup>3</sup> &minus; 3a</strong>.</p>\n<p>Given <strong>K + 1/K = &minus;3</strong>, so <strong>a = &minus;3</strong>.</p>\n<p>K<sup>2</sup> + 1/K<sup>2</sup> = (&minus;3)<sup>2</sup> &minus; 2 = 7.</p>\n<p>K<sup>3</sup> + 1/K<sup>3</sup> = (&minus;3)<sup>3</sup> &minus; 3(&minus;3) = &minus;27 + 9 = &minus;18.</p>\n<p>Required Expression = 2(K<sup>3</sup> + 1/K<sup>3</sup>) + (K<sup>2</sup> + 1/K<sup>2</sup>) = 2(&minus;18) + 7 = &minus;29.</p>\n<p><strong>&there4; The correct answer is &minus;29.</strong></p>\n\n<p><span style='display: flex;gap: 6px;align-items: center;'><img height='26px' src='https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png' width='26px' /><strong><span style='vertical-align: middle;font-size: 21px;'><u>Alternate Method</u></span></strong></span></p>\n<p><strong>Given:</strong> K + 1/K = &minus;3</p>\n<p><strong>Formula Used:</strong> (a + b)<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup> + 2ab and (a + b)<sup>3</sup> = a<sup>3</sup> + b<sup>3</sup> + 3ab(a + b)</p>\n<p>&rArr; Square the given equation: (K + 1/K)<sup>2</sup> = (&minus;3)<sup>2</sup></p>\n<p>&rArr; K<sup>2</sup> + 1/K<sup>2</sup> + 2 = 9</p>\n<p>&rArr; <strong>K<sup>2</sup> + 1/K<sup>2</sup> = 7</strong></p>\n<p>&rArr; Cube the given equation: (K + 1/K)<sup>3</sup> = (&minus;3)<sup>3</sup></p>\n<p>&rArr; K<sup>3</sup> + 1/K<sup>3</sup> + 3(K)(1/K)(K + 1/K) = &minus;27</p>\n<p>&rArr; K<sup>3</sup> + 1/K<sup>3</sup> + 3(&minus;3) = &minus;27</p>\n<p>&rArr; <strong>K<sup>3</sup> + 1/K<sup>3</sup> = &minus;18</strong></p>\n<p>&rArr; [2((K<sup>6</sup> + 1) / K<sup>3</sup>)] + ((K<sup>4</sup> + 1) / K<sup>2</sup>) = 2(K<sup>3</sup> + 1/K<sup>3</sup>) + (K<sup>2</sup> + 1/K<sup>2</sup>)</p>\n<p>&rArr; Value = 2(&minus;18) + 7</p>\n<p>&rArr; Value = &minus;36 + 7 = &minus;29</p>\n<p><strong>&there4; The correct answer is &minus;29.</strong></p>\n\n<p><span style='display: flex;gap: 6px;align-items: center;'><img height='26px' src='https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png' width='26px' /><strong><span style='vertical-align: middle;font-size: 21px;'><u>Additional Information</u></span></strong></span></p>\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>Algebraic Identity for Power 2</p>\n<p style='margin:0 0 8px 0;color:#444444;'>For any variable x, x<sup>2</sup> + 1/x<sup>2</sup> = (x + 1/x)<sup>2</sup> &minus; 2.</p>\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>Algebraic Identity for Power 3</p>\n<p style='margin:0 0 8px 0;color:#444444;'>For any variable x, x<sup>3</sup> + 1/x<sup>3</sup> = (x + 1/x)<sup>3</sup> &minus; 3(x + 1/x).</p>\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>Algebraic Identity for Power 4</p>\n<p style='margin:0 0 8px 0;color:#444444;'>x<sup>4</sup> + 1/x<sup>4</sup> = (x<sup>2</sup> + 1/x<sup>2</sup>)<sup>2</sup> &minus; 2. This can be derived by squaring the power 2 identity.</p>", "marks": 2, "negMarks": 0.5}, {"text": "<p>Using algebraic identities, simplify the following expression.</p>\n\n<p><span class=\"math-tex\">\\(\\frac{(x^4 + x^2 + 1)}{(x^2 + x + 1)}\\)</span></p>\n", "options": ["(x<sup>2</sup> - x + 1)", "(x<span style=\"position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;\">2</span> + x + 1)", "(x<span style=\"position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;\">2</span> - 2x + 1)", "(x<span style=\"position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;\">2</span> + 2x + 1)"], "correct": 1, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; ? = &lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{(x^4 + x^2 + 1)}{(x^2 + x + 1)}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Formula:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;a&lt;sup&gt;2&lt;/sup&gt; - b&lt;sup&gt;2&lt;/sup&gt; = (a + b)(a - b)&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; ? = (x&lt;sup&gt;4&lt;/sup&gt; + 2x&lt;sup&gt;2&lt;/sup&gt; + 1 - x&lt;sup&gt;2&lt;/sup&gt;)/(x&lt;sup&gt;2&lt;/sup&gt; + x + 1)&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; ? = [(x&lt;sup&gt;2&lt;/sup&gt; + 1) - x&lt;sup&gt;2&lt;/sup&gt;]/(x&lt;sup&gt;2&lt;/sup&gt; + x + 1)&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; ? = [(x&lt;sup&gt;2&lt;/sup&gt; + 1 - x)(x&lt;sup&gt;2&lt;/sup&gt; + 1 + x)]/(x&lt;sup&gt;2&lt;/sup&gt; + x + 1)&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; ? = x&lt;sup&gt;2&lt;/sup&gt; - x + 1&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&amp;there4;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{(x^4 + x^2 + 1)}{(x^2 + x + 1)}\\)&lt;/span&gt; = x&lt;sup&gt;2&lt;/sup&gt; - x + 1&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "<p>Simplify the following expression.</p>\n\n<p><span class=\"math-tex\">\\(\\frac{7.35\\times7.35-2.25\\times2.25}{0.24}\\)</span></p>\n", "options": ["204", "320", "225", "304"], "correct": 1, "solution": "<span style='display: flex;gap: 6px;align-items: center;'><img height='26px' src='https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png' width='26px' /> <u style='font-size: 21px; font-weight: 700; display: inline !important;'>Shortcut Trick</u></span>\n<p>The expression follows the <strong>algebraic identity</strong> a<sup>2</sup> &minus; b<sup>2</sup> = (a + b)(a &minus; b).</p>\n<p>Here, a = 7.35 and b = 2.25.</p>\n<p>Numerator = (7.35 + 2.25) &times; (7.35 &minus; 2.25) = 9.6 &times; 5.1</p>\n<p>Expression = (9.6 &times; 5.1) &divide; 0.24 = 40 &times; 5.1 = 204</p>\n<p><strong>&there4; The correct answer is 204.</strong></p>\n\n<p><span style='display: flex;gap: 6px;align-items: center;'><img height='26px' src='https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png' width='26px' /><strong><span style='vertical-align: middle;font-size: 21px;'><u>Alternate Method</u></span></strong></span></p>\n<p><strong>Given Expression:</strong> (7.35 &times; 7.35 &minus; 2.25 &times; 2.25) &divide; 0.24</p>\n<p><strong>Formula Used:</strong> a<sup>2</sup> &minus; b<sup>2</sup> = (a + b)(a &minus; b)</p>\n<p>&rArr; Expression = (7.35<sup>2</sup> &minus; 2.25<sup>2</sup>) &divide; 0.24</p>\n<p>&rArr; Expression = [(7.35 + 2.25) &times; (7.35 &minus; 2.25)] &divide; 0.24</p>\n<p>&rArr; Expression = (9.60 &times; 5.10) &divide; 0.24</p>\n<p>&rArr; Expression = 48.96 &divide; 0.24</p>\n<p>&rArr; Expression = 4896 &divide; 24</p>\n<p>&rArr; Expression = 204</p>\n<p><strong>&there4; The correct answer is 204.</strong></p>\n\n<p><span style='display: flex;gap: 6px;align-items: center;'><img height='26px' src='https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png' width='26px' /><strong><span style='vertical-align: middle;font-size: 21px;'><u>Additional Information</u></span></strong></span></p>\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>Algebraic Identities</p>\n<p style='margin:0 0 8px 0;color:#444444;'>The identity <strong>a<sup>2</sup> &minus; b<sup>2</sup> = (a + b)(a &minus; b)</strong> is used to simplify the difference of squares without calculating the actual squares.</p>\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>BODMAS Rule</p>\n<p style='margin:0 0 8px 0;color:#444444;'>Always solve expressions in the order: Brackets, Orders (powers), Division/Multiplication, and Addition/Subtraction.</p>\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>Decimal Division</p>\n<p style='margin:0 0 8px 0;color:#444444;'>When dividing decimals, multiply both the numerator and denominator by the same power of 10 to remove the decimal point (e.g., 48.96/0.24 = 4896/24).</p>", "marks": 2, "negMarks": 0.5}, {"text": "If a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup> = ab + bc + ca, then the value of <span class=\"math-tex\">\\(\\rm \\frac{11a^4+13b^4+15c^4}{16a^2b^2+19b^2c^2+17c^2a^2}\\)</span> is:", "options": ["<span class=\"math-tex\">\\(1\\frac{1}{3}\\)</span>", "<span class=\"math-tex\">\\(\\frac{1}{4}\\)</span>", "<span class=\"math-tex\">\\(\\frac{3}{4}\\)</span>", "<span class=\"math-tex\">\\(1\\frac{3}{4}\\)</span>"], "correct": 3, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;a&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ b&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ c&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;= ab + bc + ca&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Concept used:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;If a&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41); position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;+ b&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41); position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;+ c&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41); position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;= ab + bc + ca, a = b = c&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\rm \\frac{11a^4+13b^4+15c^4}{16a^2b^2+19b^2c^2+17c^2a^2}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;Put a = b = c everywhere in the expression,&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\rm \\frac{11a^4+13a^4+15a^4}{16a^2a^2+19a^2a^2+17a^2a^2}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\rm \\frac{39a^4}{52a^4}\\)&lt;/span&gt;&amp;nbsp;&lt;/span&gt;=&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\rm \\frac{39}{52}\\)&lt;/span&gt;&amp;nbsp;&lt;/span&gt;=&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\rm \\frac{3}{4}\\)&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;there4; The correct answer is&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\rm \\frac{3}{4}\\)&lt;/span&gt;&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If x<sup>2</sup> + 7x + 8 = 0 , then find the value of <span class=\"math-tex\">\\(\\frac{4x}{x^2 - 5x + 8}\\)</span> .", "options": ["<span class=\"math-tex\">\\(\\frac{1}{2}\\)</span>", "<span class=\"math-tex\">\\(-\\frac{1}{4}\\)</span>", "<span class=\"math-tex\">\\(-\\frac{1}{3}\\)</span>", "<span class=\"math-tex\">\\(\\frac{1}{6}\\)</span>"], "correct": 3, "solution": "<p><span style='display: flex;gap: 6px;align-items: center;'><img height='26px' src='https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png' width='26px' /> <u style='font-size: 21px; font-weight: 700; display: inline !important;'>Shortcut Trick</u></span>\n<p>Given: x<sup>2</sup> + 7x + 8 = 0 &rArr; x<sup>2</sup> + 8 = &minus;7x</p>\n<p>Substitute x<sup>2</sup> + 8 = &minus;7x into the given expression:</p>\n<p>&rArr; 4x / (x<sup>2</sup> &minus; 5x + 8) = 4x / (x<sup>2</sup> + 8 &minus; 5x)</p>\n<p>&rArr; 4x / (&minus;7x &minus; 5x)</p>\n<p>&rArr; 4x / (&minus;12x) = &minus;1/3</p>\n<p><strong>&there4; The correct answer is &minus;1/3.</strong></p>\n<p><span style='display: flex;gap: 6px;align-items: center;'><img height='26px' src='https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png' width='26px' /><strong><span style='vertical-align: middle;font-size: 21px;'><u>Alternate Method</u></span></strong></span></p>\n<p><strong>Given:</strong></p>\n<p>x<sup>2</sup> + 7x + 8 = 0</p>\n<p><strong>To find:</strong></p>\n<p>4x / (x<sup>2</sup> &minus; 5x + 8)</p>\n<p><strong>Calculations:</strong></p>\n<p>&rArr; Divide the numerator and the denominator of the given expression by x:</p>\n<p>&rArr; Expression = (4x / x) / [ (x<sup>2</sup> &minus; 5x + 8) / x ]</p>\n<p>&rArr; Expression = 4 / (x &minus; 5 + 8/x)</p>\n<p>&rArr; Rearranging the terms: 4 / [(x + 8/x) &minus; 5]</p>\n<p>&rArr; Now, from the given equation x<sup>2</sup> + 7x + 8 = 0, divide by x:</p>\n<p>&rArr; x + 7 + 8/x = 0</p>\n<p>&rArr; x + 8/x = &minus;7</p>\n<p>&rArr; Substitute this value into the expression:</p>\n<p>&rArr; Expression = 4 / (&minus;7 &minus; 5)</p>\n<p>&rArr; Expression = 4 / &minus;12</p>\n<p>&rArr; Expression = &minus;1/3</p>\n<p><strong>&there4; The correct answer is &minus;1/3.</strong></p>\n<p><span style='display: flex;gap: 6px;align-items: center;'><img height='26px' src='https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png' width='26px' /><strong><span style='vertical-align: middle;font-size: 21px;'><u>Additional Information</u></span></strong></span></p>\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>Dividing by Variable Technique</p>\n<p style='margin:0 0 8px 0;color:#444444;'>When both the numerator and denominator are polynomials, dividing by x (or x<sup>2</sup>) helps convert the expression into the form (x + 1/x), making substitution easier.</p>\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>Direct Substitution Method</p>\n<p style='margin:0 0 8px 0;color:#444444;'>Instead of finding the exact roots of a quadratic equation, rearranging the equation to isolate parts of it (like x<sup>2</sup> + constant) and substituting it into the target expression saves significant calculation time.</p>\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>Properties of Quadratic Equations</p>\n<p style='margin:0 0 8px 0;color:#444444;'>For a standard quadratic equation ax<sup>2</sup> + bx + c = 0, the sum of roots is &minus;b/a and the product of roots is c/a. These algebraic relationships can often be used to simplify symmetric expressions.</p></p>", "marks": 2, "negMarks": 0.5}, {"text": "If 8x<sup>2 </sup>+ 9x + 8 = 0, then the value of <span class=\"math-tex\">\\(x^{3}+\\frac{1}{x^{3}}\\)</span> is:", "options": ["<span class=\"math-tex\">\\(\\frac{999}{212}\\)</span>", "<span class=\"math-tex\">\\(\\frac{199}{212}\\)</span>", "<span class=\"math-tex\">\\(\\frac{999}{512}\\)</span>", "<strong><span class=\"math-tex\">\\(\\frac{199}{512}\\)</span></strong>"], "correct": 3, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;8x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;+ 9x + 8 = 0&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&lt;span style=&quot;&quot;&gt;Calculations:&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;8x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;+ 9x + 8 = 0&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;8x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ 8 =&amp;nbsp;&lt;/span&gt;-&lt;span style=&quot;&quot;&gt;&amp;nbsp;9x&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;8x + 8/x = - 9&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;8(x + 1/x) = - 9&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;/span&gt;(x + 1/x) = - 9/8&lt;/p&gt;\n\n&lt;p&gt;Now,&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;(x&lt;sup&gt;3&lt;/sup&gt; + 1/x&lt;sup&gt;3&lt;/sup&gt;)&amp;nbsp;= (x + 1/x)&lt;sup&gt;3&lt;/sup&gt; - 3&amp;nbsp;&lt;span style=&quot;&quot;&gt;(x + 1/x)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;(x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ 1/x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;)&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;=&amp;nbsp;(-9/8)&lt;sup&gt;3&lt;/sup&gt; - 3&amp;nbsp;(-9/8)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;(x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ 1/x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;)&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;=&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;(-729/512) + 27&lt;/span&gt;&lt;span style=&quot;&quot;&gt;/8&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; (x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ 1/x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;)&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;=&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;(-729 + 1728)/512 = 999/512&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;strong&gt;&lt;span style=&quot;&quot;&gt;&amp;there4; The value of the given equation will be&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{999}{512}\\)&lt;/span&gt;.&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If (2x – 1)<sup>3</sup> + (3x – 4)<sup>3</sup> + (x – 7)<sup>3</sup> = (6x – 3) (3x – 4) (x – 7), then what is the value of x?", "options": ["5", "8", "2", "3"], "correct": 3, "solution": "&lt;p&gt;&amp;rArr; (2x &amp;ndash; 1)&lt;sup&gt;3&lt;/sup&gt; + (3x &amp;ndash; 4)&lt;sup&gt;3&lt;/sup&gt; + (x &amp;ndash; 7)&lt;sup&gt;3&lt;/sup&gt; = (6x &amp;ndash; 3) (3x &amp;ndash; 4) (x &amp;ndash; 7)&lt;/p&gt;\n\n&lt;p&gt;As we know,&lt;/p&gt;\n\n&lt;p&gt;If x&lt;sup&gt;3&lt;/sup&gt; + y&lt;sup&gt;3&lt;/sup&gt; + z&lt;sup&gt;3&lt;/sup&gt; &amp;ndash; 3xyz = 0, then x + y + z = 0&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; (2x &amp;ndash; 1)&lt;sup&gt;3&lt;/sup&gt; + (3x &amp;ndash; 4)&lt;sup&gt;3&lt;/sup&gt; + (x &amp;ndash; 7)&lt;sup&gt;3&lt;/sup&gt; = (6x &amp;ndash; 3) (3x &amp;ndash; 4) (x &amp;ndash; 7)&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; (2x &amp;ndash; 1)&lt;sup&gt;3&lt;/sup&gt; + (3x &amp;ndash; 4)&lt;sup&gt;3&lt;/sup&gt; + (x &amp;ndash; 7)&lt;sup&gt;3&lt;/sup&gt; &amp;ndash; 3(2x &amp;ndash; 1) (3x &amp;ndash; 4) (x &amp;ndash; 7) = 0&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; (2x &amp;ndash; 1) + (3x &amp;ndash; 4) + (x &amp;ndash; 7) = 0&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; 6x &amp;ndash; 12 = 0&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; x = 12/6 = 2&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If a − b = 5 and ab = 25, then the value of a<span style=\"position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;\">3 </span>− b<span style=\"position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;\">3 </span>is:", "options": ["525", "400", "<span style=\"color: rgb(33, 37, 41);\">450</span>", "500"], "correct": 4, "solution": "<p><span style='display: flex;gap: 6px;align-items: center;'><img height='26px' src='https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png' width='26px' /> <u style='font-size: 21px; font-weight: 700; display: inline !important;'>Shortcut Trick</u></span>\n<p>Use the direct algebraic identity for the difference of cubes.</p>\n<p>a<sup>3</sup> &minus; b<sup>3</sup> = (a &minus; b)<sup>3</sup> + 3ab(a &minus; b)</p>\n<p>Substitute the given values: a &minus; b = 5 and ab = 25.</p>\n<p>a<sup>3</sup> &minus; b<sup>3</sup> = 5<sup>3</sup> + 3 &times; 25 &times; 5 = 125 + 375 = 500</p>\n<p><strong>&there4; The correct
