<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Algebra - Identities - 02 — Mock Test</title>
<script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},svg:{fontCache:'global'},options:{skipHtmlTags:['script','noscript','style','textarea','pre','code']}};const QUESTIONS=[{"text": "If <span class=\"math-tex\">\\(x-\\frac{1}{x}=2\\sqrt2\\)</span>, then what will be the value of <span class=\"math-tex\">\\(x^3-\\frac{1}{x^3}\\)</span>?", "options": ["10√2", "20√2", "12√2", "22√2"], "correct": 4, "solution": "<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png\" width=\"26px\" /> <u style=\"font-size: 21px; font-weight: 700; display: inline !important;\">Shortcut Trick</u></span>\n<p>If x &minus; 1/x = k, then x<sup>3</sup> &minus; 1/x<sup>3</sup> = k<sup>3</sup> + 3k</p>\n<p>Here, k = 2&radic;2</p>\n<p>Required value = (2&radic;2)<sup>3</sup> + 3 &times; (2&radic;2)</p>\n<p>&rArr; 16&radic;2 + 6&radic;2 = 22&radic;2</p>\n<p><strong>&there4; The correct answer is 22&radic;2.</strong></p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Alternate Method</u></span></strong></span></p>\n<p><strong>Given:</strong></p>\n<p>x &minus; 1/x = 2&radic;2</p>\n<p><strong>Formula Used:</strong></p>\n<p>(a &minus; b)<sup>3</sup> = a<sup>3</sup> &minus; b<sup>3</sup> &minus; 3ab(a &minus; b)</p>\n<p><strong>Calculations:</strong></p>\n<p>&rArr; a<sup>3</sup> &minus; b<sup>3</sup> = (a &minus; b)<sup>3</sup> + 3ab(a &minus; b)</p>\n<p>Substitute a = x and b = 1/x into the formula:</p>\n<p>&rArr; x<sup>3</sup> &minus; 1/x<sup>3</sup> = (x &minus; 1/x)<sup>3</sup> + 3 &times; x &times; (1/x) &times; (x &minus; 1/x)</p>\n<p>&rArr; x<sup>3</sup> &minus; 1/x<sup>3</sup> = (x &minus; 1/x)<sup>3</sup> + 3(x &minus; 1/x)</p>\n<p>Put the given value of (x &minus; 1/x) = 2&radic;2:</p>\n<p>&rArr; x<sup>3</sup> &minus; 1/x<sup>3</sup> = (2&radic;2)<sup>3</sup> + 3 &times; 2&radic;2</p>\n<p>&rArr; (2&radic;2)<sup>3</sup> = 2<sup>3</sup> &times; (&radic;2)<sup>3</sup> = 8 &times; 2&radic;2 = 16&radic;2</p>\n<p>&rArr; x<sup>3</sup> &minus; 1/x<sup>3</sup> = 16&radic;2 + 6&radic;2</p>\n<p>&rArr; x<sup>3</sup> &minus; 1/x<sup>3</sup> = 22&radic;2</p>\n<p><strong>&there4; The correct answer is 22&radic;2.</strong></p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Sum of Cubes Identity</p>\n<p style=\"margin:0 0 8px 0;color:#444444;\">If x + 1/x = k, then x<sup>3</sup> + 1/x<sup>3</sup> = k<sup>3</sup> &minus; 3k.</p>\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Sum of Squares Identities</p>\n<p style=\"margin:0 0 8px 0;color:#444444;\">If x + 1/x = k, then x<sup>2</sup> + 1/x<sup>2</sup> = k<sup>2</sup> &minus; 2. Conversely, if x &minus; 1/x = k, then x<sup>2</sup> + 1/x<sup>2</sup> = k<sup>2</sup> + 2.</p>\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Sign Conversion Rules</p>\n<p style=\"margin:0 0 8px 0;color:#444444;\">If x + 1/x = k, then x &minus; 1/x = &radic;(k<sup>2</sup> &minus; 4). Similarly, if x &minus; 1/x = k, then x + 1/x = &radic;(k<sup>2</sup> + 4).</p></p>", "marks": 2, "negMarks": 0.5}, {"text": "If a + b + c = 6 and a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup> = 14, then what is the value of (a - b)<sup>2</sup> + (b - c)<sup>2</sup> + (c - a)<sup>2</sup> ?", "options": ["-8", "8", "10", "6"], "correct": 4, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;a + b + c = 6 and a&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ b&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ c&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;= 14,&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;Let putting a = 1 , b = 2 and c = 3&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;a + b + c = 1 + 2 + 3 = 6&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;So the value of&amp;nbsp;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;(a - b)&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ (b - c)&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ (c - a)&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;.&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;rArr; (1&amp;nbsp;- 2)&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41); position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;+ (2&amp;nbsp;- 3)&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41); position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;+ (3- 1)&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41); position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;.&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;rArr; 1 + 1 + 4 = 6&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&amp;there4; The correct option is&lt;/strong&gt;&amp;nbsp;4&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If 5x + 1/3x = 4, then what is the value of <span class=\"math-tex\">\\(9{x^2} + \\frac{1}{{25{x^2}}}\\)</span>?", "options": ["144/125", "119/25", "174/125", "114/25"], "correct": 4, "solution": "<p>5x + 1/3x = 4</p>\n\n<p>Multiply by 3/5</p>\n\n<p>⇒ 3x + 1/5x = 12/5</p>\n\n<p>Squaring on both sides</p>\n\n<p>⇒ (3x + 1/5x)<sup>2</sup> = (12/5)<sup>2</sup></p>\n\n<p>⇒ 9x<sup>2</sup> + 1/25x<sup>2</sup> + 2 × 3x × (1/5x) = 144/25</p>\n\n<p>⇒ 9x<sup>2</sup> + 1/25x<sup>2</sup> = 144/25 – 6/5</p>\n\n<p>⇒ 9x<sup>2</sup> + 1/25x<sup>2</sup> = (144 – 30)/25 </p>\n\n<p><strong>∴ The value is 114/25</strong></p>\n", "marks": 2, "negMarks": 0.5}, {"text": "If (a + b + c)/2 = 16 and 2ab + 2bc + 2ca = 120, then what is the value of 4a<sup>2</sup> + 4b<sup>2</sup> + 4c<sup>2</sup>?", "options": ["2828", "3368", "3616", "3056"], "correct": 3, "solution": "<span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png\" width=\"26px\" /> <u style=\"font-size: 21px; font-weight: 700; display: inline !important;\">Shortcut Trick</u></span>\n<p>First, find the <strong>sum of variables</strong> (a + b + c) = 16 &times; 2 = 32.</p>\n<p>Use the <strong>algebraic identity</strong>: a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup> = (a + b + c)<sup>2</sup> &minus; 2(ab + bc + ca).</p>\n<p>Substitute values: 32<sup>2</sup> &minus; 120 = 1024 &minus; 120 = 904.</p>\n<p>Required value = 4 &times; (a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup>) = 4 &times; 904 = 3616.</p>\n<p><strong>&there4; The correct answer is 3616.</strong></p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Alternate Method</u></span></strong></span></p>\n<p><strong>Given:</strong> (a + b + c) / 2 = 16 and (2ab + 2bc + 2ca) = 120</p>\n<p><strong>Formula Used:</strong> (a + b + c)<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup> + 2(ab + bc + ca)</p>\n<p>&rArr; a + b + c = 16 &times; 2 = 32</p>\n<p>&rArr; (32)<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup> + 120</p>\n<p>&rArr; 1024 = a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup> + 120</p>\n<p>&rArr; a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup> = 1024 &minus; 120</p>\n<p>&rArr; a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup> = 904</p>\n<p>&rArr; Required value = 4a<sup>2</sup> + 4b<sup>2</sup> + 4c<sup>2</sup></p>\n<p>&rArr; 4(a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup>) = 4 &times; 904</p>\n<p>&rArr; 4(a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup>) = 3616</p>\n<p><strong>&there4; The correct answer is 3616.</strong></p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Standard Algebraic Identity</p>\n<p style=\"margin:0 0 8px 0;color:#444444;\">The square of a <strong>trinomial</strong> is given by (a + b + c)<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup> + 2ab + 2bc + 2ca.</p>\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Sum of Pairwise Products</p>\n<p style=\"margin:0 0 8px 0;color:#444444;\">The term 2(ab + bc + ca) represents twice the <strong>sum of products</strong> of the variables taken two at a time.</p>\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Cubic Identity</p>\n<p style=\"margin:0 0 8px 0;color:#444444;\">Related identity: a<sup>3</sup> + b<sup>3</sup> + c<sup>3</sup> &minus; 3abc = (a + b + c)(a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup> &minus; ab &minus; bc &minus; ca).</p>", "marks": 2, "negMarks": 0.5}, {"text": "If x<sup>2</sup> – 3x + 1 = 0, then the value of <span class=\"math-tex\">\\((x^4 + \\frac{1}{x^2}) \\div (x^2+1)\\)</span> is:", "options": ["9", "5", "6", "7"], "correct": 3, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;x&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;- 3x + 1 = 0&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Formula used:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;x&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;+&amp;nbsp;1/x&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;= (x + 1/x)&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;&amp;ndash; 3(x + 1/x)&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;x&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;&amp;ndash; 3x + 1 = 0&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; x&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 1 = 3x&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;x + 1/x = 3&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;x&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;+&amp;nbsp;1/x&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;= (x + 1/x)&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;&amp;ndash; 3(x + 1/x)&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;x&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;+&amp;nbsp;1/x&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;= 27 &amp;ndash; 9&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;x&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;+&amp;nbsp;1/x&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;= 18&lt;/p&gt;\n\n&lt;p&gt;Required value = (x&lt;sup&gt;4&lt;/sup&gt;&amp;nbsp;+ 1/x&lt;sup&gt;2&lt;/sup&gt;)&amp;nbsp;&amp;divide; (x&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 1)&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; x(x&lt;sup&gt;3&amp;nbsp;&lt;/sup&gt;+ 1/x&lt;sup&gt;3&lt;/sup&gt;)&amp;nbsp;&amp;divide; x(x + 1/x)&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;(x&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&amp;nbsp;&lt;/span&gt;+ 1/x&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;)&amp;nbsp;&amp;divide; (x + 1/x)&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; 18&amp;nbsp;&amp;divide; 3 = 6&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&amp;there4; The correct answer is 6&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "<div> If p<sup>3</sup> + 3p<sup>2</sup> + 3p = 26, then the value of p<sup>2</sup> + 2p is:</div>\n", "options": ["<span style=\"\">8</span>", "<span style=\"\">12</span>", "<span style=\"\">10</span>", "<span style=\"\">15</span>"], "correct": 1, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;p&lt;sup&gt;3&lt;/sup&gt; + 3p&lt;sup&gt;2&lt;/sup&gt; + 3p = 26&amp;nbsp;&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Formula used:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;( a + b)&lt;sup&gt;3&lt;/sup&gt; = a&lt;sup&gt;3&lt;/sup&gt; +b&lt;sup&gt;3&lt;/sup&gt; + 3ab ( a + b)&amp;nbsp;&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;br /&gt;\n&lt;span style=&quot;&quot;&gt;p&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ 3p&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ 3p = 26&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;Now add 1 to both the sides&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;p&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ 3p&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ 3p + 1 = 26&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ 1&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;This equation can be written as&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;p&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;+ 1&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;+ 3p &amp;times; 1 &amp;times; (p&amp;nbsp;+ 1) = 27&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;(p + 1)&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp; =&amp;nbsp;3&lt;sup&gt;3&lt;/sup&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; ( p +1)&amp;nbsp; = 3&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; p&amp;nbsp; = 2&lt;/p&gt;\n\n&lt;p&gt;Now ,&amp;nbsp;p&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 2p =&amp;nbsp; (&amp;nbsp;2&lt;sup&gt;2&amp;nbsp;&lt;/sup&gt;+ 2&amp;nbsp;&amp;times; 2 ) = 8&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&amp;there4; The value is 8.&lt;/strong&gt;&amp;nbsp;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "Simplify the given expression. <span class=\"math-tex\">\\(\\frac{[1.5 \\times 1.5 \\times 1.5+2.7 \\times 2.7 \\times 2.7+4.8 \\times 4.8 \\times 4.8-3 \\times 1.5 \\times 2.7 \\times 4.8]}{[1.5 \\times 1.5+2.7 \\times 2.7+4.8 \\times 4.8-1.5 \\times 2.7-2.7 \\times 4.8-4.8 \\times 1.5]}\\)</span>", "options": ["12", "9", "10", "14"], "correct": 2, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;Simplify the expression:&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{[1.5 \\times 1.5 \\times 1.5+2.7 \\times 2.7 \\times 2.7+4.8 \\times 4.8 \\times 4.8-3 \\times 1.5 \\times 2.7 \\times 4.8]}{[1.5 \\times 1.5+2.7 \\times 2.7+4.8 \\times 4.8-1.5 \\times 2.7-2.7 \\times 4.8-4.8 \\times 1.5]}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Formula used:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;The expression follows the identity for a determinant involving three variables:&lt;/p&gt;\n\n&lt;p&gt;(a&lt;sup&gt;3&lt;/sup&gt; + b&lt;sup&gt;3&lt;/sup&gt; + c&lt;sup&gt;3&lt;/sup&gt; - 3abc) / (a&lt;sup&gt;2&lt;/sup&gt; + b&lt;sup&gt;2&lt;/sup&gt; + c&lt;sup&gt;2&lt;/sup&gt; - ab - bc - ca) = a + b + c&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;Let a = 1.5, b = 2.7, and c = 4.8.&lt;/p&gt;\n\n&lt;p&gt;Using the formula:&lt;/p&gt;\n\n&lt;p&gt;Numerator = 1.5&lt;sup&gt;3&lt;/sup&gt; + 2.7&lt;sup&gt;3&lt;/sup&gt; + 4.8&lt;sup&gt;3&lt;/sup&gt; - 3(1.5)(2.7)(4.8)&lt;/p&gt;\n\n&lt;p&gt;Denominator = 1.5&lt;sup&gt;2&lt;/sup&gt; + 2.7&lt;sup&gt;2&lt;/sup&gt; + 4.8&lt;sup&gt;2&lt;/sup&gt; - (1.5 &amp;times; 2.7) - (2.7 &amp;times; 4.8) - (4.8 &amp;times; 1.5)&lt;/p&gt;\n\n&lt;p&gt;Applying the identity, we get:&lt;/p&gt;\n\n&lt;p&gt;a + b + c = 1.5 + 2.7 + 4.8 = 9&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&amp;there4; The simplified value of the expression is 9.&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If <span class=\"math-tex\">\\(\\frac{{{\\rm{8r}}}}{{{{\\rm{r}}^{\\rm{2}}}\\,{\\rm{ - }}\\,\\,{\\rm{8r}}\\,{\\rm{ + }}\\,{\\rm{1}}}}\\, = \\,\\frac{1}{{14}}\\)</span>, then the value of <span class=\"math-tex\">\\(\\left( {{\\rm{r}}\\,{\\rm{ + }}\\,\\frac{1}{{\\rm{r}}}} \\right)\\)</span> is ______.", "options": ["88", "100", "120", "60"], "correct": 3, "solution": "&lt;p&gt;&lt;strong&gt;Given:-&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;/span&gt;&lt;strong&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{{{\\rm{8r}}}}{{{{\\rm{r}}^{\\rm{2}}}\\,{\\rm{ - }}\\,\\,{\\rm{8r}}\\,{\\rm{ + }}\\,{\\rm{1}}}}\\, = \\,\\frac{1}{{14}}\\)&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;It is given that&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{{{\\rm{8r}}}}{{{{\\rm{r}}^{\\rm{2}}}\\,{\\rm{ - }}\\,\\,{\\rm{8r}}\\,{\\rm{ + }}\\,{\\rm{1}}}}\\, = \\,\\frac{1}{{14}}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;Dividing both the numerator and denominator by &amp;#39;r&amp;#39;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{\\frac{8r}{r}}{\\frac{r^2-8r+1}{r}}=\\frac{1}{14}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{8}{r-8+\\frac{1}{r}}=\\frac{1}{14}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;On solving,&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(r-8+\\frac{1}{r}\\)&lt;/span&gt;&amp;nbsp;=&amp;nbsp;&lt;span style=&quot;&quot;&gt;14&amp;times;8&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\left(r+\\frac{1}{r}\\right)\\)&lt;/span&gt;&amp;nbsp;=&amp;nbsp;&lt;span style=&quot;&quot;&gt;112+8&amp;nbsp;&lt;/span&gt;= 120&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&amp;there4; The value of&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\left(r+\\frac{1}{r}\\right) \\)&lt;/span&gt;&lt;/strong&gt;&amp;nbsp;&lt;strong&gt;is 120.&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If (a + 1)<sup>2</sup> + (a + 2)<sup>2</sup> = 16 then what is the value of 40 + 12a + 4a<sup>2</sup>?", "options": ["<span style=\"\">56</span>", "<span style=\"\">62</span>", "<span style=\"\">74</span>", "<span style=\"\">52</span>"], "correct": 2, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;(a + 1)&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ (a + 2)&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;= 16&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;(a + 1)&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ (a + 2)&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;= 16&lt;/p&gt;\n\n&lt;p&gt;a&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 1 + 2a + a&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 4 + 4a = 16&lt;/p&gt;\n\n&lt;p&gt;2a&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 6a + 5 = 16&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;2a&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;+ 6a =&amp;nbsp;11&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;Multiply by 2 on both sides&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;4a&lt;sup&gt;2&amp;nbsp;&lt;/sup&gt;+ 12a = 22&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;Add 40 both sides&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;4a&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 12a + 40 = 62&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&lt;span class=&quot;s1&quot; style=&quot;font-variant-numeric: normal; font-variant-east-asian: normal; font-variant-alternates: normal; font-kerning: auto; font-optical-sizing: auto; font-feature-settings: normal; font-variation-settings: normal; font-stretch: normal; line-height: normal; &quot;&gt;&amp;there4;&lt;/span&gt; Option 2 is the correct answer.&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "The value of the expression (1.55<sup>2</sup> + 0.55<sup>2</sup> + 1.55 x 0.55) is equal to:", "options": ["1.55² − 0.55²", "1.55³ − 0.55³", "1.55³ + 0.55³", "1.55² + 0.55²"], "correct": 2, "solution": "<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png\" width=\"26px\" /> <u style=\"font-size: 21px; font-weight: 700; display: inline !important;\">Shortcut Trick</u></span>\n<p>Identify the form of the expression: a<sup>2</sup> + b<sup>2</sup> + ab, where a = 1.55 and b = 0.55.</p>\n<p>Using the standard algebraic identity: a<sup>3</sup> &minus; b<sup>3</sup> = (a &minus; b)(a<sup>2</sup> + b<sup>2</sup> + ab).</p>\n<p>Here, a &minus; b = 1.55 &minus; 0.55 = 1.</p>\n<p>Therefore, a<sup>2</sup> + b<sup>2</sup> + ab = a<sup>3</sup> &minus; b<sup>3</sup> directly.</p>\n<p><strong>&there4; The correct answer is 1.55<sup>3</sup> &minus; 0.55<sup>3</sup>.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Alternate Method</u></span></strong></span></p>\n<p><strong>Given:</strong></p>\n<p>The expression: 1.55<sup>2</sup> + 0.55<sup>2</sup> + 1.55 &times; 0.55</p>\n<p><strong>Formula Used:</strong></p>\n<p>a<sup>3</sup> &minus; b<sup>3</sup> = (a &minus; b)(a<sup>2</sup> + ab + b<sup>2</sup>)</p>\n<p><strong>Calculation:</strong></p>\n<p>&rArr; Let a = 1.55 and b = 0.55</p>\n<p>&rArr; The given expression takes the form: a<sup>2</sup> + b<sup>2</sup> + ab</p>\n<p>&rArr; Rearranging the formula for the difference of cubes, we get: a<sup>2</sup> + ab + b<sup>2</sup> = (a<sup>3</sup> &minus; b<sup>3</sup>) &divide; (a &minus; b)</p>\n<p>&rArr; Find the value of the denominator: a &minus; b = 1.55 &minus; 0.55 = 1</p>\n<p>&rArr; Substitute the numerical values back into the rearranged formula:</p>\n<p>&rArr; 1.55<sup>2</sup> + 1.55 &times; 0.55 + 0.55<sup>2</sup> = (1.55<sup>3</sup> &minus; 0.55<sup>3</sup>) &divide; 1</p>\n<p>&rArr; 1.55<sup>2</sup> + 1.55 &times; 0.55 + 0.55<sup>2</sup> = 1.55<sup>3</sup> &minus; 0.55<sup>3</sup></p>\n<p><strong>&there4; The correct answer is 1.55<sup>3</sup> &minus; 0.55<sup>3</sup>.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Sum of Cubes Identity</p>\n<p style=\"margin:0 0 8px 0;color:#444444;\">The formula for the sum of cubes is a<sup>3</sup> + b<sup>3</sup> = (a + b)(a<sup>2</sup> &minus; ab + b<sup>2</sup>).</p>\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Difference of Squares</p>\n<p style=\"margin:0 0 8px 0;color:#444444;\">A fundamental algebraic identity is a<sup>2</sup> &minus; b<sup>2</sup> = (a + b)(a &minus; b).</p>\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Perfect Square Trinomials</p>\n<p style=\"margin:0 0 8px 0;color:#444444;\">The expansion of squared binomials follows the identities (a + b)<sup>2</sup> = a<sup>2</sup> + 2ab + b<sup>2</sup> and (a &minus; b)<sup>2</sup> = a<sup>2</sup> &minus; 2ab + b<sup>2</sup>.</p></p>", "marks": 2, "negMarks": 0.5}, {"text": "If x<sup>4</sup> + x<sup>2</sup>y<sup>2 </sup>+ y<sup>4</sup> = 133 and x<sup>2</sup> - xy + y<sup>2</sup> =7, then what is the value of xy?", "options": ["8", "12", "4", "6"], "correct": 4, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;4&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;y&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;+ y&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;4&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;= 133&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;- xy + y&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;=7&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&lt;span style=&quot;&quot;&gt;Concept used:&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;(x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;- xy + y&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;) (x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ xy + y&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;) = x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;4&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;y&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ y&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;4&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&lt;span style=&quot;&quot;&gt;Calculation:&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;x&lt;sup&gt;2&amp;nbsp;&lt;/sup&gt;- xy + y&lt;sup&gt;2&lt;/sup&gt; = 7&amp;nbsp; &amp;nbsp; &amp;nbsp;---(1)&lt;/p&gt;\n\n&lt;p&gt;As we know,&lt;/p&gt;\n\n&lt;p&gt;(x&lt;sup&gt;2&lt;/sup&gt; - xy + y&lt;sup&gt;2&lt;/sup&gt;) (x&lt;sup&gt;2&lt;/sup&gt; + xy + y&lt;sup&gt;2&lt;/sup&gt;) = x&lt;sup&gt;4&lt;/sup&gt; + x&lt;sup&gt;2&lt;/sup&gt;y&lt;sup&gt;2&lt;/sup&gt; + y&lt;sup&gt;4&lt;/sup&gt;&lt;/p&gt;\n\n&lt;p&gt;7 &amp;times; (x&lt;sup&gt;2&lt;/sup&gt; + xy + y&lt;sup&gt;2&lt;/sup&gt;) = 133&lt;/p&gt;\n\n&lt;p&gt;x&lt;sup&gt;2&lt;/sup&gt; + xy + y&lt;sup&gt;2&lt;/sup&gt; = 19&amp;nbsp; &amp;nbsp; &amp;nbsp;---(2)&lt;/p&gt;\n\n&lt;p&gt;Subtract equation (1) from equation(2)&lt;/p&gt;\n\n&lt;p&gt;2xy = 12&lt;/p&gt;\n\n&lt;p&gt;xy = 12/2 = 6&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&amp;there4; The Required answer is 6.&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "Simplify <span class=\"math-tex\">\\(\\frac{{{{\\left( {{\\rm{r - s}}} \\right)}^{\\rm{3}}}{\\rm{ + }}{{\\left( {{\\rm{s - t}}} \\right)}^{\\rm{3}}}{\\rm{ + }}{{\\left( {{\\rm{t - r}}} \\right)}^{\\rm{3}}}}}{{{\\rm{6}}\\left( {{\\rm{r - s}}} \\right)\\left( {{\\rm{s - t}}} \\right)\\left( {{\\rm{t - r}}} \\right)}}\\)</span>", "options": ["<span class=\"math-tex\">\\(\\frac{1}{6}\\)</span>", "<span class=\"math-tex\">\\(\\frac{1}{2}\\)</span>", "<span class=\"math-tex\">\\(\\frac{1}{3}\\)</span>", "<span class=\"math-tex\">\\(\\frac{1}{4}\\)</span>"], "correct": 2, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{{{{\\left( {{\\rm{r - s}}} \\right)}^{\\rm{3}}}{\\rm{ + }}{{\\left( {{\\rm{s - t}}} \\right)}^{\\rm{3}}}{\\rm{ + }}{{\\left( {{\\rm{t - r}}} \\right)}^{\\rm{3}}}}}{{{\\rm{6}}\\left( {{\\rm{r - s}}} \\right)\\left( {{\\rm{s - t}}} \\right)\\left( {{\\rm{t - r}}} \\right)}}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Concept used:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;If a + b + c = 0, then a&amp;sup3; + b&amp;sup3; + c&amp;sup3; - 3abc = 0.&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculations:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;According to question,&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;/span&gt;(r - s) + (s - t) + (t - r) = 0&lt;/p&gt;\n\n&lt;p&gt;So,&lt;span style=&quot;&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{{{{\\left( {{\\rm{r - s}}} \\right)}^{\\rm{3}}}{\\rm{ + }}{{\\left( {{\\rm{s - t}}} \\right)}^{\\rm{3}}}{\\rm{ + }}{{\\left( {{\\rm{t - r}}} \\right)}^{\\rm{3}}}}}{{{\\rm{6}}\\left( {{\\rm{r - s}}} \\right)\\left( {{\\rm{s - t}}} \\right)\\left( {{\\rm{t - r}}} \\right)}}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{3(r-s)(s-t)(t-r)}{6(r-s)(s-t)(t-r)}\\)&lt;/span&gt;&amp;nbsp;=&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{1}{2}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;font-weight: 700; &quot;&gt;&amp;there4;&amp;nbsp;&lt;/span&gt;&lt;strong&gt;The value of&lt;span style=&quot;&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{{{{\\left( {{\\rm{r - s}}} \\right)}^{\\rm{3}}}{\\rm{ + }}{{\\left( {{\\rm{s - t}}} \\right)}^{\\rm{3}}}{\\rm{ + }}{{\\left( {{\\rm{t - r}}} \\right)}^{\\rm{3}}}}}{{{\\rm{6}}\\left( {{\\rm{r - s}}} \\right)\\left( {{\\rm{s - t}}} \\right)\\left( {{\\rm{t - r}}} \\right)}}\\)&lt;/span&gt;is&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{1}{2}\\)&lt;/span&gt;.&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If 8a<sup>3</sup> + b<sup>3</sup> = 16 and 2a + b = 4, then find the value of 16a<sup>4</sup> + b<sup>4</sup>,", "options": ["28", "36", "38", "32"], "correct": 4, "solution": "&lt;p&gt;&lt;span style=&quot;display: flex;gap: 6px;align-items: center;&quot;&gt;&lt;img height=&quot;26px&quot; src=&quot;https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png&quot; width=&quot;26px&quot; /&gt;&lt;strong&gt;&lt;span style=&quot;vertical-align: middle;font-size: 21px;&quot;&gt;&lt;u&gt;Alternate Method&lt;/u&gt;&lt;/span&gt;&lt;/strong&gt;&lt;/span&gt;a = 1, b = 2. These values satisfy equations given in the question.&lt;/p&gt;\n\n&lt;p&gt;Now,&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;16a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;4&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ b&lt;sup&gt;4&lt;/sup&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; 16&amp;nbsp;&amp;times; 1 + 2&lt;sup&gt;4&lt;/sup&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; 16&amp;nbsp; + 16 = 32&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&lt;strong&gt;&amp;there4; The required value is 32.&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Traditional method:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;8a&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;+ b&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;= 16 and 2a+ b = 4&lt;/p&gt;\n\n&lt;p&gt;&lt;b&gt;Formula:&lt;/b&gt;&lt;/p&gt;\n\n&lt;p&gt;a&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;+ b&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;= (a + b)(a&lt;sup&gt;2&lt;/sup&gt; - ab + b&lt;sup&gt;2&lt;/sup&gt;)&lt;/p&gt;\n\n&lt;p&gt;(a + b)&lt;sup&gt;2&lt;/sup&gt; = (a&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 2ab + b&lt;sup&gt;2&lt;/sup&gt;)&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; (8a&lt;sup&gt;3&lt;/sup&gt; + b&lt;sup&gt;3&lt;/sup&gt;) = (2a + b)(4a&lt;sup&gt;2&lt;/sup&gt; - 2ab + b&lt;sup&gt;2&lt;/sup&gt;)&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; 16 = 4&amp;nbsp;&amp;times; (4a&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;- 2ab + b&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;)&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; 4a&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;- 2ab + b&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;= 4&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; (2a + b)&lt;sup&gt;2&lt;/sup&gt; = 4a&lt;sup&gt;2&lt;/sup&gt; + 4ab + b&lt;sup&gt;2&lt;/sup&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; 16 =&amp;nbsp;4a&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ 4ab + b&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;Solving,&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; 6ab = 12&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; ab = 2&lt;/p&gt;\n\n&lt;p&gt;Then,&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; 4a&lt;sup&gt;2&lt;/sup&gt; + b&lt;sup&gt;2&lt;/sup&gt; = 8&lt;/p&gt;\n\n&lt;p&gt;Then,&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; ? =&amp;nbsp;16a&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;4&lt;/span&gt;&amp;nbsp;+ b&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;4&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; ? = (4a&lt;sup&gt;2&lt;/sup&gt; + b&lt;sup&gt;2&lt;/sup&gt;)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;- 8a&lt;sup&gt;2&lt;/sup&gt;b&lt;sup&gt;2&lt;/sup&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; ? = 8&lt;sup&gt;2&lt;/sup&gt; - 8&amp;nbsp;&amp;times; (2)&lt;sup&gt;2&lt;/sup&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; ? = 32&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&amp;there4;&amp;nbsp;16a&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;4&lt;/span&gt;&amp;nbsp;+ b&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;4&amp;nbsp;&lt;/span&gt;= 32&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If a + b + c = 6, a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup> = 32, and a<sup>3</sup> + b<sup>3</sup> + c<sup>3</sup> = 189, then the value of 4abc is:", "options": ["8", "12", "9", "16"], "correct": 2, "solution": "&lt;p&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;Given:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;a + b + c = 6&lt;/p&gt;\n\n&lt;p&gt;a&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ b&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ c&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;= 32&lt;/p&gt;\n\n&lt;p&gt;a&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;+ b&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;+ c&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;= 189&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;Formula used:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;a&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ b&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font- uot;https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png&quot; width=&quot;26px&quot; /&gt;&lt;strong&gt;&lt;span style=&quot;vertical-align: middle;font-size: 21px;&quot;&gt;&lt;u&gt;Alternate Method&lt;/u&gt;&lt;/span&gt;&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{1}{2+2p} + \\frac{1}{2+2q}+\\frac{1}{2+2r}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; 1/(2 + 2&amp;nbsp;&amp;times; (x/y + z)) +&amp;nbsp;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;1/(2 + 2&amp;nbsp;&amp;times; (y/x+ z)) + 1/(2 + 2&amp;nbsp;&amp;times; (z/x+ y))&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;rArr; [(y + z)/2x + 2y&amp;nbsp;+ 2z]&amp;nbsp;+&amp;nbsp;&amp;nbsp;[(&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;x + z)/2x + 2y&amp;nbsp;+ 2z] +&amp;nbsp;&amp;nbsp;[(&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;y + x)/2x + 2y&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;+ 2z]&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;rArr; (2x + 2y&amp;nbsp;+ 2z)/(2x + 2y&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;+ 2z)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;rArr; 1&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;The value is 1.&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "<p>If 27x<sup>3</sup> - 64y<sup>3</sup> = (Ax + By)(Cx<sup>2</sup> + Dy<sup>2</sup> - Exy), then value of (A - B + C - D + E) will be:</p>\n", "options": ["15", "-20", "18", "-12"], "correct": 4, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;27x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;&lt;/span&gt;&amp;ndash;&amp;nbsp;&lt;span style=&quot;&quot;&gt;64y&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;= (Ax + By)(Cx&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ Dy&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;&lt;/span&gt;&amp;ndash;&amp;nbsp;&lt;span style=&quot;&quot;&gt;Exy)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Formula used:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;a&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;&amp;ndash; b&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;= (a&amp;nbsp;&amp;ndash; b)(a&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ b&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ ab)&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;ndash; b&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;= (a&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;ndash; b)(a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ b&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ ab&lt;/span&gt;&lt;span style=&quot;&quot;&gt;)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; (3x)&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;&amp;ndash; (4y)&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;= (3x&amp;nbsp;&amp;ndash; 4y)(9x&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 16y&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;&amp;ndash; 12xy)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;Now,&amp;nbsp;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;Putting the value, we get&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;A = 3, B = -4, C = 9, D = 16 and E = -12&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;The value of&amp;nbsp;&amp;nbsp;(A &amp;ndash; B + C &amp;ndash; D + E)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; [3&amp;nbsp;&amp;ndash; (-4) + 9&amp;nbsp;&amp;ndash; 16 + (-12)]&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; (3 + 4 + 9&amp;nbsp;&amp;ndash; 16&amp;nbsp;&amp;ndash; 12)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; (16&amp;nbsp;&amp;ndash; 16&amp;nbsp;&amp;ndash; 12)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; -12&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&lt;span style=&quot;&quot;&gt;&amp;there4; The required value is -12&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If <span class=\"math-tex\">\\(x + \\dfrac{1}{x} = 7,\\)</span> then <span class=\"math-tex\">\\(x^3 + \\dfrac{1}{x^3}\\)</span> is equal to:", "options": ["340", "161", "343", "322"], "correct": 4, "solution": "&lt;p&gt;&lt;span style=&quot;display: flex;gap: 6px;align-items: center;&quot;&gt;&lt;img height=&quot;26px&quot; src=&quot;https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png&quot; width=&quot;26px&quot; /&gt;&lt;strong&gt;&lt;span style=&quot;vertical-align: middle;font-size: 21px;&quot;&gt;&lt;u&gt;Shortcut Trick&lt;/u&gt;&lt;/span&gt;&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;If x + 1/x = n then x&lt;sup&gt;3&lt;/sup&gt; + 1/x&lt;sup&gt;3&lt;/sup&gt; = n&lt;sup&gt;3&lt;/sup&gt; - 3n&lt;/p&gt;\n\n&lt;p&gt;x&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;+ 1/x&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;= n&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;- 3n&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; 7&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;- 7&amp;nbsp;&amp;times;&amp;nbsp;3&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; 322&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&amp;there4; The required value is 322.&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;display: flex;gap: 6px;align-items: center;&quot;&gt;&lt;img height=&quot;26px&quot; src=&quot;https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png&quot; width=&quot;26px&quot; /&gt;&lt;strong&gt;&lt;span style=&quot;vertical-align: middle;font-size: 21px;&quot;&gt;&lt;u&gt;Alternate Method&lt;/u&gt;&lt;/span&gt;&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;x + 1/x = 7&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Formula:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;(a&lt;sup&gt;3&lt;/sup&gt; + b&lt;sup&gt;3&lt;/sup&gt;) = (a + b)(a&lt;sup&gt;2&lt;/sup&gt; - ab + b&lt;sup&gt;2&lt;/sup&gt;)&lt;/p&gt;\n\n&lt;p&gt;(a + b)&lt;sup&gt;2&lt;/sup&gt; = (a&lt;sup&gt;2&lt;/sup&gt; + b&lt;sup&gt;2&lt;/sup&gt; + 2ab)&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; (x + 1/x)&lt;sup&gt;2&lt;/sup&gt; = (x&lt;sup&gt;2&lt;/sup&gt; + 1/x&lt;sup&gt;2&lt;/sup&gt; + 2)&lt;/p& position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;= 4ab&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculations:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;According to the formula,&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;(a - b)&lt;sup&gt;3&amp;nbsp;&lt;/sup&gt;= a&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;- b&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;-&amp;nbsp;3ab(a - b)&lt;/p&gt;\n\n&lt;div&gt;&amp;rArr;&amp;nbsp;&lt;span style=&quot;&quot;&gt;a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;- b&lt;sup&gt;3&amp;nbsp;&lt;/sup&gt;=&amp;nbsp;(a - b)&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;+&amp;nbsp;3ab(a - b)&lt;/span&gt;&lt;/div&gt;\n\n&lt;p&gt;&lt;span&gt;&amp;rArr;&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;- b&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&amp;nbsp;&lt;/span&gt;=&amp;nbsp;&lt;/span&gt;(10)&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;+ 3 x 4 x (10) = 1000 +&amp;nbsp;120 = 1120&lt;/p&gt;\n\n&lt;p&gt;similarly,&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;(a + b)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;- (a - b)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= 4ab&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;&lt;span style=&quot;&quot;&gt;(a + b)&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;=&amp;nbsp;(a - b)&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&
