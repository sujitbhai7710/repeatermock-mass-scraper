t;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;color: rgb(51, 51, 51); white-space: pre-wrap; &quot;&gt;&amp;rArr; 1604 - 1529 = 3xyz&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;color: rgb(51, 51, 51); white-space: pre-wrap; &quot;&gt;&amp;rArr; xyz = 75/3&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;color: rgb(51, 51, 51); white-space: pre-wrap; &quot;&gt;&amp;rArr; xyz = 25&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;font-weight: 700; &quot;&gt;&amp;there4; The value of xyz is 25.&lt;/span&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If a + b + c = 0 and a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup> = 40, then what is the value of 4ab + 4bc + 4ca?", "options": ["-80", "-40", "-20", "-160"], "correct": 1, "solution": "<span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png\" width=\"26px\" /> <u style=\"font-size: 21px; font-weight: 700; display: inline !important;\">Shortcut Trick</u></span>\n<p>Use the property: 2(ab + bc + ca) = (a + b + c)<sup>2</sup> &minus; (a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup>)</p>\n<p>Substitute the given values: 2(ab + bc + ca) = 0<sup>2</sup> &minus; 40 = &minus;40</p>\n<p>The required expression is 4ab + 4bc + 4ca = 2 &times; [2(ab + bc + ca)]</p>\n<p>&rArr; 2 &times; (&minus;40) = &minus;80</p>\n<p><strong>&there4; The correct answer is &minus;80.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Alternate Method</u></span></strong></span></p>\n<p><strong>Given:</strong></p>\n<p>a + b + c = 0</p>\n<p>a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup> = 40</p>\n<p><strong>Formula Used:</strong></p>\n<p>The standard algebraic identity for the <strong>square of a trinomial</strong> is:</p>\n<p>(a + b + c)<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup> + 2(ab + bc + ca)</p>\n<p><strong>Calculations:</strong></p>\n<p>&rArr; (0)<sup>2</sup> = 40 + 2(ab + bc + ca)</p>\n<p>&rArr; 0 = 40 + 2(ab + bc + ca)</p>\n<p>&rArr; 2(ab + bc + ca) = &minus;40</p>\n<p>&rArr; ab + bc + ca = &minus;40 &divide; 2</p>\n<p>&rArr; ab + bc + ca = &minus;20</p>\n<p>Now, we need to find the value of 4ab + 4bc + 4ca:</p>\n<p>&rArr; 4ab + 4bc + 4ca = 4(ab + bc + ca)</p>\n<p>&rArr; 4 &times; (&minus;20) = &minus;80</p>\n<p><strong>&there4; The correct answer is &minus;80.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Square of a Trinomial</p>\n<p style=\"margin:0 0 8px 0;color:#444444;\">The identity (a + b + c)<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup> + 2(ab + bc + ca) relates the sum, the sum of squares, and the sum of products taken two at a time.</p>\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Cubic Identity</p>\n<p style=\"margin:0 0 8px 0;color:#444444;\">If a + b + c = 0, then the identity a<sup>3</sup> + b<sup>3</sup> + c<sup>3</sup> &minus; 3abc = (a + b + c)(a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup> &minus; ab &minus; bc &minus; ca) simplifies to a<sup>3</sup> + b<sup>3</sup> + c<sup>3</sup> = 3abc.</p>\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Sum of Products</p>\n<p style=\"margin:0 0 8px 0;color:#444444;\">The term (ab + bc + ca) is often called the cyclic sum of products and is a symmetric polynomial in variables a, b, and c.</p>", "marks": 2, "negMarks": 0.5}, {"text": "If <span class=\"math-tex\">\\(y + \\frac{1}{y} = 11,\\)</span> then the value of <span class=\"math-tex\">\\(y^3 - \\frac{1}{y^{3}}\\)</span> is:", "options": ["<span class=\"math-tex\">\\(345\\sqrt{13}\\)</span>", "<span class=\"math-tex\">\\(360\\sqrt{13}\\)</span>", "<span class=\"math-tex\">\\(352\\sqrt{13}\\)</span>", "<span class=\"math-tex\">\\(368\\sqrt{13}\\)</span>"], "correct": 2, "solution": "&lt;p&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;Given:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(y + \\frac{1}{y} = 11\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;Concept used:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;1. (a&amp;nbsp;- b)&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;= a&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;- 3ab(a - b) - b&lt;sup&gt;3&lt;/sup&gt;&lt;/p&gt;\n\n&lt;p&gt;2. (a + b)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= (a - b)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+&amp;nbsp;4ab&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;Calculation:&amp;nbsp;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(y + \\frac{1}{y} = 11\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\((y + \\frac{1}{y})^2 = 11^2\\)&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\((y - \\frac{1}{y})^2 + 4 = 11^2\\)&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\((y - \\frac{1}{y})^2 = 121 - 4\\)&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\((y - \\frac{1}{y})^2 = 117\\)&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\((y - \\frac{1}{y}) = 3√{13}\\)&lt;/span&gt;&amp;nbsp; &amp;nbsp; &amp;nbsp; ....(1)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\((y - \\frac{1}{y})^3 = 117^{2 \\over 3}\\)&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(y^3 - \\frac{1}{y^{3}} - 3(y - \\frac {1}{y}) = 117^{2 \\over 3}\\)&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(y^3 - \\frac{1}{y^{3}} - 3 × {3√{13}} = (3√{13})^3\\)&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(y^3 - \\frac{1}{y^{3}} = 351√{13} + 9√{13}\\)&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(y^3 - \\frac{1}{y^{3}} = 360√{13}\\)&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;font-weight: 700; &quot;&gt;&amp;there4; The value of&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(y^3 - \\frac{1}{y^{3}}\\)&lt;/span&gt;&amp;nbsp;is&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(360√{13}\\)&lt;/span&gt;.&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;font-weight: 700; &quot;&gt;&lt;span style=&quot;display: flex;gap: 6px;align-items: center;&quot;&gt;&lt;img height=&quot;26px&quot; src=&quot;https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png&quot; width=&quot;26px&quot; /&gt;&lt;strong&gt;&lt;span style=&quot;vertical-align: middle;font-size: 21px;&quot;&gt;&lt;u&gt;Alternate Method&lt;/u&gt;&lt;/span&gt;&lt;/strong&gt;&lt;/span&gt;&amp;nbsp;&lt;/span&gt;If y + 1/y = p, then&lt;/p&gt;\n\n&lt;p&gt;y - 1/y =&amp;nbsp;&amp;radic;(p&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;- 4) = q and y&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;- 1/y&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;= q&lt;sup&gt;3&amp;nbsp;&lt;/sup&gt;+ 3q&lt;/p&gt;\n\n&lt;p&gt;Now, y +&amp;nbsp;1/y = 11&lt;/p&gt;\n\n&lt;p&gt;y - 1/y =&amp;nbsp;&amp;radic;(11&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;- 4) =&amp;nbsp;&amp;radic;117 = 3&amp;radic;13&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;y&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;- 1/y&lt;/span&gt;&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;= (3&amp;radic;13)&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;+ 3&amp;nbsp;&amp;times;&amp;nbsp;3&amp;radic;13&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;rArr; 27&amp;nbsp;&amp;times; 13&amp;radic;13 + 9&amp;radic;13&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;rArr; 351&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;radic;13 + 9&amp;radic;13 = 360&amp;radic;13&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;there4;&amp;nbsp;y&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41); position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;- 1/y&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41); position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;color: rgb(33, 37, 41);&quot;&gt;&amp;nbsp;=&amp;nbsp;360&amp;radic;13&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If a + b = 8 and a + a<sup>2</sup> b + b + ab<sup>2</sup> = 128 then the positive value of a<sup>3</sup> + b<sup>3</sup> is:", "options": ["152", "224", "96", "344"], "correct": 1, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;a + b = 8 and a + a&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;b + b + ab&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;= 128&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Formula:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;a&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;+ b&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;= (a + b) [(a + b)&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;- 3ab]&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;a + a&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;b + b + ab&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;= 128&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; a + b + a&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;b&amp;nbsp;+ ab&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;= 128&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; 8 +&amp;nbsp;a&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;b&amp;nbsp;+ ab&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;= 128&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; a&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;b + ab&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;= 128 - 8&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; a&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size: 10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;b +&amp;nbsp;ab&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size: 10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;= 120&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; ab (a + b) = 120&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; ab&amp;nbsp;&lt;span style=&quot;font-family: Calibri, sans-serif; font-size: 11pt;&quot;&gt;&amp;times;&amp;nbsp;&lt;/span&gt;8&lt;span style=&quot;font-family: Calibri, sans-serif; font-size: 11pt;&quot;&gt;&amp;nbsp;&lt;/span&gt;= 120&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; ab = 120/8&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; ab = 15&lt;/p&gt;\n\n&lt;p&gt;a&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;+ b&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;= (a + b) [(a + b)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;- 3ab]&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; a&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;+ b&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;= 8 [8&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;- 3 &lt;span style=&quot; &quot;&gt;&amp;times;&amp;nbsp;&lt;/span&gt;15]&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; a&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;+ b&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;= 8 [64&amp;nbsp;- 45]&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; a&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;+ b&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;= 8&amp;nbsp;&lt;span style=&quot; &quot;&gt;&amp;times; 19&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;there4; a&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;+ b&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;= 152&amp;nbsp;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If <span class=\"math-tex\">\\(x - 3 = \\frac{1}{2x}\\)</span>, then what is the value of <span class=\"math-tex\">\\(\\left( x^4 + \\frac{1}{16x^4} \\right)\\)</span> ?", "options": ["<span class=\"math-tex\">\\(99 \\frac{1}{2}\\)</span>", "10", "11", "98"], "correct": 1, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;x - 3 = 1/2x&lt;/p&gt;\n\n&lt;p&gt;x - 1/2x = 3&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Formula:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;(x + y)&lt;sup&gt;2&lt;/sup&gt; = x&lt;sup&gt;2&lt;/sup&gt; + y&lt;sup&gt;2&lt;/sup&gt; + 2xy&lt;/p&gt;\n\n&lt;p&gt;(x - y)&lt;sup&gt;2&lt;/sup&gt; = x&lt;sup&gt;2&lt;/sup&gt; + y&lt;sup&gt;2&lt;/sup&gt; - 2xy&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;x - 3 = 1/2x&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; (x - 1/2x)&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;= 3&lt;sup&gt;2&lt;/sup&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;x&lt;sup&gt;2&lt;/sup&gt; + 1/4x&lt;sup&gt;2&lt;/sup&gt; - 1 = 9&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; x&lt;sup&gt;2&lt;/sup&gt; + 1/4x&lt;sup&gt;2&lt;/sup&gt; = 10&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; (x&lt;sup&gt;2&lt;/sup&gt; + 1/4x&lt;sup&gt;2&lt;/sup&gt;)&lt;sup&gt;2&lt;/sup&gt; = 10&lt;sup&gt;2&amp;nbsp;&lt;/sup&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;/span&gt;x&lt;sup&gt;4&lt;/sup&gt; + 1/16x&lt;sup&gt;4&lt;/sup&gt; + 1/2 = 100&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; x&lt;sup&gt;4&lt;/sup&gt; + 1/16x&lt;sup&gt;4&lt;/sup&gt; = 100 - 1/2 = 199/2&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&amp;there4; x&lt;sup&gt;4&lt;/sup&gt; + 1/16x&lt;sup&gt;4&lt;/sup&gt; = 199/2 = &lt;span class=&quot;math-tex&quot;&gt;\\(99 \\frac{1}{2}\\)&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If x + y + z = 7, xy + yz + zx = 8, then what is the value of x<sup>3</sup> + y<sup>3</sup> + z<sup>3</sup> - 3xyz?", "options": ["175", "150", "125", "200"], "correct": 1, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;x + y + z = 7&lt;/p&gt;\n\n&lt;p&gt;xy + yz + zx = 8&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Formula used:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;a&lt;sup&gt;3&lt;/sup&gt; + b&lt;sup&gt;3&lt;/sup&gt; + c&lt;sup&gt;3&lt;/sup&gt; - 3abc = (a&amp;nbsp;+ b&amp;nbsp;+ c)[(a&amp;nbsp;+ b&amp;nbsp;+ c)&lt;sup&gt;2&lt;/sup&gt; - 3(ab&amp;nbsp;+ bc&amp;nbsp;+ ac)]&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;Putting the values in the formula we get&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ y&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ z&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;- 3xyz =&amp;nbsp;7 &amp;times; (7&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;- 3 &amp;times; 8)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; 7&amp;nbsp;&amp;times; (49&amp;nbsp;- 24)&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; 7&amp;nbsp;&amp;times; 25&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; 175&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&amp;there4; The value of &lt;span style=&quot;&quot;&gt;x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ y&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ z&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;- 3xyz&lt;/span&gt; is 175.&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If (a + b + c) = 12, and (a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup>) = 50, find the value of (a<sup>3</sup> + b<sup>3</sup> + c<sup>3</sup> - 3abc)", "options": ["36", "24", "42", "48"], "correct": 1, "solution": "<span style='display: flex;gap: 6px;align-items: center;'><img height='26px' src='https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png' width='26px' /> <u style='font-size: 21px; font-weight: 700; display: inline !important;'>Shortcut Trick</u></span>\n<p>Use the direct relation: <strong>Value = (a + b + c) &times; [1.5(a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup>) &minus; 0.5(a + b + c)<sup>2</sup>]</strong></p>\n<p>Substitute the given values: 12 &times; [1.5(50) &minus; 0.5(12)<sup>2</sup>]</p>\n<p>Value = 12 &times; [75 &minus; 72]</p>\n<p>Value = 12 &times; 3 = 36</p>\n<p><strong>&there4; The correct answer is 36.</strong></p>\n<p><span style='display: flex;gap: 6px;align-items: center;'><img height='26px' src='https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png' width='26px' /><strong><span style='vertical-align: middle;font-size: 21px;'><u>Alternate Method</u></span></strong></span></p>\n<p><strong>Given:</strong> (a + b + c) = 12 and (a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup>) = 50</p>\n<p><strong>Formula Used:</strong></p>\n<p>1) <strong>(a + b + c)<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup> + 2(ab + bc + ca)</strong></p>\n<p>2) <strong>a<sup>3</sup> + b<sup>3</sup> + c<sup>3</sup> &minus; 3abc = (a + b + c)(a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup> &minus; (ab + bc + ca))</strong></p>\n<p><strong>Calculations:</strong></p>\n<p>&rArr; First, find the value of (ab + bc + ca) using formula 1:</p>\n<p>&rArr; (12)<sup>2</sup> = 50 + 2(ab + bc + ca)</p>\n<p>&rArr; 144 &minus; 50 = 2(ab + bc + ca)</p>\n<p>&rArr; 94 = 2(ab + bc + ca)</p>\n<p>&rArr; <strong>ab + bc + ca = 47</strong></p>\n<p>&rArr; Now, substitute all known values into formula 2:</p>\n<p>&rArr; a<sup>3</sup> + b<sup>3</sup> + c<sup>3</sup> &minus; 3abc = 12 &times; (50 &minus; 47)</p>\n<p>&rArr; a<sup>3</sup> + b<sup>3</sup> + c<sup>3</sup> &minus; 3abc = 12 &times; 3 = 36</p>\n<p><strong>&there4; The correct answer is 36.</strong></p>\n<p><span style='display: flex;gap: 6px;align-items: center;'><img height='26px' src='https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png' width='26px' /><strong><span style='vertical-align: middle;font-size: 21px;'><u>Additional Information</u></span></strong></span></p>\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>Special Case (a + b + c = 0)</p>\n<p style='margin:0 0 8px 0;color:#444444;'>If the sum of three terms is zero, the identity simplifies to <strong>a<sup>3</sup> + b<sup>3</sup> + c<sup>3</sup> = 3abc</strong>.</p>\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>Alternative Form of Identity</p>\n<p style='margin:0 0 8px 0;color:#444444;'>The expression can be rewritten as <strong>0.5 &times; (a + b + c)[(a &minus; b)<sup>2</sup> + (b &minus; c)<sup>2</sup> + (c &minus; a)<sup>2</sup>]</strong>, which is useful when differences are given.</p>\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>Sum of Cubes (Two Variables)</p>\n<p style='margin:0 0 8px 0;color:#444444;'>The formula for two variables is <strong>a<sup>3</sup> + b<sup>3</sup> = (a + b)(a<sup>2</sup> &minus; ab + b<sup>2</sup>)</strong>.</p>", "marks": 2, "negMarks": 0.5}, {"text": "Find the value of a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup> - 2ab + 2ac - 2bc, if a = x + y, b = x - y and c = 2x - 1.", "options": ["(x - y - 1)<sup>2</sup>", "(2x + 2y - 1)<sup>2</sup>", "0", "(2x - 2y - 1)<sup>2</sup>"], "correct": 2, "solution": "&lt;p&gt;&lt;b&gt;GIVEN:&lt;/b&gt;&lt;/p&gt;\n\n&lt;p&gt;a = x + y&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;b = x - y&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;c = 2x - 1&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;FORMULA USED:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;nbsp;a&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ b&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ c&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 2ab + 2bc&amp;nbsp; + 2ca&amp;nbsp; = ( a + b + c)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&lt;b&gt;CALCULATION:&lt;/b&gt;&lt;/p&gt;\n\n&lt;p&gt;Here, we have to&amp;nbsp; find the value of a&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp; + b&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ c&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;- 2ab - 2bc + 2ac&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;Now , we can&amp;nbsp;&amp;nbsp;write this equation in the following way as&lt;/p&gt;\n\n&lt;p&gt;a&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ b&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ c&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 2a ( -b)&amp;nbsp; + 2( -b) c + 2ca&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;Now, as we know that&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;a&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ b&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ c&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 2ab + 2bc + 2ca = ( a + b + c)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; a&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ b&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ c&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 2a ( -b) + 2( -b) c + 2 c a = [ a + ( -b) + c]&lt;sup&gt;2&lt;/sup&gt;&lt;/p&gt;\n\n&lt;p&gt;Now, here we have&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;a = x + y , b = x - y and c = 2x - 1&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; [ a + ( -b) + c]&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= [&amp;nbsp;x + y -&amp;nbsp;( x - y)&amp;nbsp; + 2x - 1]&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; (&amp;nbsp;y + y + 2x - 1)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= (2x + 2y - 1)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Hence, the required value of the equation is ( 2x + 2y - 1 )&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;.&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If x + y + z = 4, xy + yz + zx = 1 and x<sup>3</sup> + y<sup>3</sup> + z<sup>3</sup> = 34 , then what is the value of 2xyz ?", "options": ["8", "-12", "-6", "18"], "correct": 2, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;x + y + z = 4, xy + yz + zx = 1 and x&lt;sup&gt;3&lt;/sup&gt; + y&lt;sup&gt;3&lt;/sup&gt; + z&lt;sup&gt;3&lt;/sup&gt; = 34&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Formula:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;a&lt;sup&gt;3&lt;/sup&gt; + b&lt;sup&gt;3&lt;/sup&gt; + c&lt;sup&gt;3&lt;/sup&gt; - 3abc= &lt;span class=&quot;ILfuVd&quot;&gt;&lt;span class=&quot;hgKElc&quot;&gt;(a + b + c)(&lt;/span&gt;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;(a + b + c)&lt;/span&gt;&lt;span class=&quot;ILfuVd&quot;&gt;&lt;span class=&quot;hgKElc&quot;&gt;&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;- 3(ab +&amp;nbsp;bc +&amp;nbsp;ca))&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;ILfuVd&quot;&gt;&lt;span class=&quot;hgKElc&quot;&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;ILfuVd&quot;&gt;&lt;span class=&quot;hgKElc&quot;&gt;&amp;rArr; &lt;/span&gt;&lt;/span&gt;x&lt;sup&gt;3&lt;/sup&gt; + y&lt;sup&gt;3&lt;/sup&gt; + z&lt;sup&gt;3&lt;/sup&gt; - 3xyz = &lt;span class=&quot;ILfuVd&quot;&gt;&lt;span class=&quot;hgKElc&quot;&gt;(x + y + z)(&lt;/span&gt;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;(x + y + z)&lt;/span&gt;&lt;span class=&quot;ILfuVd&quot;&gt;&lt;span class=&quot;hgKElc&quot;&gt;&lt;sup&gt;2&lt;/sup&gt; - 3(xy +&amp;nbsp;yz +&amp;nbsp;xz))&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;ILfuVd&quot;&gt;&lt;span class=&quot;hgKElc&quot;&gt;&amp;rArr; 34 - 3xyz = 4 &amp;times; (16&amp;nbsp;- 3)&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;ILfuVd&quot;&gt;&lt;span class=&quot;hgKElc&quot;&gt;&amp;rArr; &lt;/span&gt;&lt;/span&gt;3xyz = 34 - 52&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;ILfuVd&quot;&gt;&lt;span class=&quot;hgKElc&quot;&gt;&amp;rArr; &lt;/span&gt;&lt;/span&gt;3xyz = -18&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;ILfuVd&quot;&gt;&lt;span class=&quot;hgKElc&quot;&gt;&amp;rArr; &lt;/span&gt;&lt;/span&gt;xyz = -6&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&amp;there4; 2xyz = -6 &amp;times; 2 = -12&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If a + 2b = 10 and 2ab = 9, then |a - 2b| is equal to:", "options": ["4", "8", "2", "6"], "correct": 2, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;a + 2b = 10 and 2ab = 9&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Formula used:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;(a + b)&lt;sup&gt;2 &lt;/sup&gt;= a&lt;sup&gt;2&lt;/sup&gt; + b&lt;sup&gt;2&lt;/sup&gt; + 2ab&lt;/p&gt;\n\n&lt;p&gt;(a - b)&lt;sup&gt;2&lt;/sup&gt; = a&lt;sup&gt;2&lt;/sup&gt; +b&lt;sup&gt;2&lt;/sup&gt; &amp;ndash; 2ab&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;On squaring both sides of given equation we get,&lt;/p&gt;\n\n&lt;p&gt;(a + 2b)&lt;sup&gt;2 &lt;/sup&gt;= (10)&lt;sup&gt;2&lt;/sup&gt;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; (a&lt;sup&gt;2 &lt;/sup&gt;+ 4b&lt;sup&gt;2&lt;/sup&gt; +4ab) = 100&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; a&lt;sup&gt;2&lt;/sup&gt; + 4b&lt;sup&gt;2&lt;/sup&gt; + 18 = 100&amp;nbsp;&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; a&lt;sup&gt;2 &lt;/sup&gt;+ 4b&lt;sup&gt;2&lt;/sup&gt; = 82&lt;/p&gt;\n\n&lt;p&gt;Now,&lt;/p&gt;\n\n&lt;p&gt;(a &amp;ndash; 2b)&lt;sup&gt;2 = &lt;/sup&gt;a&lt;sup&gt;2 &lt;/sup&gt;+4b&lt;sup&gt;2&lt;/sup&gt; -4ab&lt;/p&gt;\n\n&lt;p&gt;Substituting values of a&lt;sup&gt;2 &lt;/sup&gt;+ 4b&lt;sup&gt;2&lt;/sup&gt; and 4ab from above&lt;/p&gt;\n\n&lt;p&gt;We get,&lt;/p&gt;\n\n&lt;p&gt;(a &amp;ndash; 2b)&lt;sup&gt;2&lt;/sup&gt; = 82 &amp;ndash; 18&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; (a &amp;ndash; 2b)&lt;sup&gt;2 = &lt;/sup&gt;64&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; (a &amp;ndash; 2b) = &amp;plusmn;8&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; |a &amp;ndash; 2b| = 8&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&amp;there4;&lt;/strong&gt;&lt;strong&gt; The value of |a &amp;ndash; 2b| is 8&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If x + y + z = 0, then find the value of <span class=\"math-tex\">\\({{x^2}\\over {x^2-yz} }+{{y^2} \\over {y^2-zx}}+{{z^2} \\over {z^2-xy}}\\)</span>.", "options": ["2", "1", "3", "0"], "correct": 1, "solution": "&lt;p&gt;&lt;strong&gt;Concept used:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;x&amp;sup2; + y&amp;sup2; + z&amp;sup2; = (x + y + z)&amp;sup2; - 2(xy + yz + zx)&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculations:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;According to the question,&amp;nbsp;x + y + z = 0&lt;/p&gt;\n\n&lt;p&gt;x = - (y + z)&lt;/p&gt;\n\n&lt;p&gt;y = - (x + z)&lt;/p&gt;\n\n&lt;p&gt;z = - (x + y)&lt;/p&gt;\n\n&lt;p&gt;Now,&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;font style=&quot;vertical-align: inherit;&quot;&gt;&amp;nbsp;&lt;/font&gt;&lt;span class=&quot;math-tex&quot;&gt;\\({{x^2}\\over {x^2-yz} }+{{y^2} \\over {y^2-zx}}+{{z^2} \\over {z^2-xy}}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;font style=&quot;vertical-align: inherit;&quot;&gt;&amp;rArr;&amp;nbsp;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{x²}{- x(y + z) - yz}\\)&lt;/span&gt;&amp;nbsp;+&amp;nbsp;&lt;/font&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{y²}{- y(x + z) - xz}\\)&lt;/span&gt;&lt;font style=&quot;vertical-align: inherit;&quot;&gt;&amp;nbsp;+&amp;nbsp;&lt;/font&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{z²}{- z(x + y) - xy}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&lt;/span&gt;&lt;font style=&quot;vertical-align: inherit;&quot;&gt; -&amp;nbsp;&lt;/font&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{x²}{xy + yz + zx}\\)&lt;/span&gt;&lt;font style=&quot;vertical-align: inherit;&quot;&gt;&amp;nbsp;-&amp;nbsp;&lt;/font&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{y²}{xy + yz + zx}\\)&lt;/span&gt;&lt;font style=&quot;vertical-align: inherit;&quot;&gt;&amp;nbsp;-&amp;nbsp;&lt;/font&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{z²}{xy + yz + zx}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&lt;/span&gt;&lt;font style=&quot;vertical-align: inherit;&quot;&gt; -&amp;nbsp;&lt;/font&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{x²+y²+z²}{xy + yz + zx}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&lt;/span&gt;&lt;font style=&quot;vertical-align: inherit;&quot;&gt; - {&lt;/font&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{(x+y+z)²-2(xy + yz + zx)}{xy + yz + zx}\\)&lt;/span&gt;}&lt;font style=&quot;vertical-align: inherit;&quot;&gt;&amp;nbsp;&lt;/font&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;Substitute x + y + z = 0 in the above equation&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&lt;/span&gt;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{2(xy + yz + zx)}{xy + yz + zx}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&lt;/span&gt; 2&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Hence, the required value is 2.&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If x<sup>2</sup> – 4x + 4 = 0, then the value of 16(x<sup>4</sup> – 1/x<sup>4</sup>) is:", "options": ["127", "255/16", "255", "127/16"], "correct": 3, "solution": "<p>x<sup>2</sup> – 4x + 4 = 0</p>\n\n<p>⇒ x<sup>2</sup> – 2 × x × 2 + 2<sup>2</sup> = 0</p>\n\n<p>⇒ (x – 2)<sup>2</sup> = 0</p>\n\n<p>⇒ x = 2</p>\n\n<p>Now, 16 (x<sup>4</sup> – 1/x<sup>4</sup>)</p>\n\n<p>⇒ 16 (16 – 1/16)</p>\n\n<p>⇒ 256 – 1</p>\n\n<p>⇒ 255</p>\n", "marks": 2, "negMarks": 0.5}, {"text": "If <span class=\"math-tex\">\\(\\rm \\left(x^2+\\frac{1}{x^2}\\right)=18 \\)</span> and x > 1, what is the value of <span class=\"math-tex\">\\(\\rm \\left(x^3-\\frac{1}{x^3}\\right)\\)</span>?", "options": ["52", "76", "80", "64"], "correct": 2, "solution": "<p><span style='display: flex;gap: 6px;align-items: center;'><img height='26px' src='https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png' width='26px' /> <u style='font-size: 21px; font-weight: 700; display: inline !important;'>Shortcut Trick</u></span>\n<p>If x<sup>2</sup> + 1/x<sup>2</sup> = k, then x &minus; 1/x = &radic;(k &minus; 2) = &radic;(18 &minus; 2) = 4.</p>\n<p>If x &minus; 1/x = a, then x<sup>3</sup> &minus; 1/x<sup>3</sup> = a<sup>3</sup> + 3a.</p>\n<p>&rArr; x<sup>3</sup> &minus; 1/x<sup>3</sup> = 4<sup>3</sup> + 3 &times; 4 = 64 + 12 = 76.</p>\n<p><strong>&there4; The correct answer is 76.</strong></p>\n<p><span style='display: flex;gap: 6px;align-items: center;'><img height='26px' src='https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png' width='26px' /><strong><span style='vertical-align: middle;font-size: 21px;'><u>Alternate Method</u></span></strong></span></p>\n<p><strong>Given:</strong></p>\n<p>x<sup>2</sup> + 1/x<sup>2</sup> = 18 and x &gt; 1</p>\n<p><strong>Formula Used:</strong></p>\n<p>(a &minus; b)<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup> &minus; 2ab</p>\n<p>a<sup>3</sup> &minus; b<sup>3</sup> = (a &minus; b)<sup>3</sup> + 3ab(a &minus; b)</p>\n<p><strong>Calculations:</strong></p>\n<p>&rArr; (x &minus; 1/x)<sup>2</sup> = x<sup>2</sup> + 1/x<sup>2</sup> &minus; 2(x)(1/x)</p>\n<p>&rArr; (x &minus; 1/x)<sup>2</sup> = 18 &minus; 2</p>\n<p>&rArr; (x &minus; 1/x)<sup>2</sup> = 16</p>\n<p>&rArr; x &minus; 1/x = &radic;16 = 4 (Since x &gt; 1, x &minus; 1/x &gt; 0)</p>\n<p>Now substitute x &minus; 1/x = 4 in the cubic formula:</p>\n<p>&rArr; x<sup>3</sup> &minus; 1/x<sup>3</sup> = (x &minus; 1/x)<sup>3</sup> + 3(x)(1/x)(x &minus; 1/x)</p>\n<p>&rArr; x<sup>3</sup> &minus; 1/x<sup>3</sup> = 4<sup>3</sup> + 3 &times; 4</p>\n<p>&rArr; x<sup>3</sup> &minus; 1/x<sup>3</sup> = 64 + 12</p>\n<p>&rArr; x<sup>3</sup> &minus; 1/x<sup>3</sup> = 76</p>\n<p><strong>&there4; The correct answer is 76.</strong></p>\n<p><span style='display: flex;gap: 6px;align-items: center;'><img height='26px' src='https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png' width='26px' /><strong><span style='vertical-align: middle;font-size: 21px;'><u>Additional Information</u></span></strong></span></p>\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>Case 1: If x + 1/x = k</p>\n<p style='margin:0 0 8px 0;color:#444444;'>Then x<sup>2</sup> + 1/x<sup>2</sup> = k<sup>2</sup> &minus; 2 and x<sup>3</sup> + 1/x<sup>3</sup> = k<sup>3</sup> &minus; 3k.</p>\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>Case 2: If x &minus; 1/x = k</p>\n<p style='margin:0 0 8px 0;color:#444444;'>Then x<sup>2</sup> + 1/x<sup>2</sup> = k<sup>2</sup> + 2 and x<sup>3</sup> &minus; 1/x<sup>3</sup> = k<sup>3</sup> + 3k.</p>\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>Relation between sums and differences</p>\n<p style='margin:0 0 8px 0;color:#444444;'>The identity connecting them is: (x + 1/x)<sup>2</sup> &minus; (x &minus; 1/x)<sup>2</sup> = 4.</p></p>", "marks": 2, "negMarks": 0.5}, {"text": "If a + b + c = 6, a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup> = 32, and a<sup>3</sup> + b<sup>3</sup> + c<sup>3 </sup>= 189, then the value of abc - 3 is:", "options": ["2", "3", "1", "0"], "correct": 4, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;a + b + c = 6&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ b&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ c&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;= 32&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ b&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ c&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&amp;nbsp;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;= 189&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Formula used:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;x&lt;sup&gt;3&lt;/sup&gt; + y&lt;sup&gt;3&lt;/sup&gt; + z&lt;sup&gt;3&lt;/sup&gt; - 3xyz&amp;nbsp;= (x&amp;nbsp;+ y&amp;nbsp;+ z) [x&lt;sup&gt;2&lt;/sup&gt; + y&lt;sup&gt;2&lt;/sup&gt; + z&lt;sup&gt;2&lt;/sup&gt; - (xy + yz + zx)]&lt;/p&gt;\n\n&lt;p&gt;(x + y + z)&lt;sup&gt;2&lt;/sup&gt; =&amp;nbsp;&lt;span style=&quot;&quot;&gt;x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ y&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ z&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ 2&amp;nbsp;(xy + yz + zx)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;Calculation:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;(a&amp;nbsp;+ b&amp;nbsp;+ c)&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;= a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ b&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ c&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ 2&amp;nbsp;(ab&amp;nbsp;+ bc&amp;nbsp;+ ca)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;6&lt;sup&gt;2&lt;/sup&gt; = 32 +&amp;nbsp;2&amp;nbsp;(ab&amp;nbsp;+ bc&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ ca&lt;/span&gt;&lt;span style=&quot;&quot;&gt;)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;36 =&amp;nbsp;32 +&amp;nbsp;2&amp;nbsp;(ab&amp;nbsp;+ bc&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ ca&lt;/span&gt;&lt;span style=&quot;&quot;&gt;)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;2 (ab&amp;nbsp;+ bc&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ ca&lt;/span&gt;&lt;span style=&quot;&quot;&gt;) = 36 - 32 = 4&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;(ab&amp;nbsp;+ bc&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ ca&lt;/span&gt;&lt;span style=&quot;&quot;&gt;) = 4/2 = 2&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;Also, a&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ b&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ c&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;- 3abc&amp;nbsp;= (a&amp;nbsp;+ b&amp;nbsp;+ c) [a&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ b&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ c&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;- (ab&amp;nbsp;+ bc&amp;nbsp;+ ca)]&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;189 - 3abc = 6 (32 - 2)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;189 - 3abc = 6&amp;nbsp;&amp;times; 30&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;3abc = 189 - 180 = 9&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;/span&gt;abc = 9/3 = 3&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;/span&gt;abc - 3 = 3 - 3 = 0&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&amp;there4; T&lt;span style=&quot;&quot;&gt;he value of abc - 3 is 0&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "<span class=\"math-tex\">\\(\\frac{{5.75 \\times 5.75 \\times 5.75 + 3.25 \\times 3.25 \\times 3.25}}{{57.5 \\times 57.5 + 32.5 \\times 32.5 - 57.5 \\times 32.5}} = ?\\)</span>", "options": ["0.0009", "0.9", "0.009", "0.09"], "correct": 4, "solution": "&lt;p&gt;&amp;rArr; (a&lt;sup&gt;3&lt;/sup&gt; + b&lt;sup&gt;3&lt;/sup&gt;) = (a + b) (a&lt;sup&gt;2&lt;/sup&gt; + b&lt;sup&gt;2&lt;/sup&gt; - ab)&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{{5.75 \\times 5.75 \\times 5.75 + 3.25 \\times 3.25 \\times 3.25}}{{57.5 \\times 57.5 + 32.5 \\times 32.5 - 57.5 \\times 32.5}}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{{5.75 \\times 5.75 \\times 5.75 + 3.25 \\times 3.25 \\times 3.25}}{{100 \\times \\left( {5.75 \\times 5.75 + 3.25 \\times 3.25 - 5.75 \\times 3.25} \\right)}}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;Suppose a = 5.75 and b = 3.25, then&lt;/p&gt;\n\n&lt;p&gt;(a&lt;sup&gt;3&lt;/sup&gt; + b&lt;sup&gt;3&lt;/sup&gt;)/[100 &amp;times; (a&lt;sup&gt;2&lt;/sup&gt; + b&lt;sup&gt;2&lt;/sup&gt; - ab)]&lt;/p&gt;\n\n&lt;p&gt;(a + b) (a&lt;sup&gt;2&lt;/sup&gt; + b&lt;sup&gt;2&lt;/sup&gt; - ab)/[100 &amp;times; (a&lt;sup&gt;2&lt;/sup&gt; + b&lt;sup&gt;2&lt;/sup&gt; - ab)]&lt;/p&gt;\n\n&lt;p&gt;(a + b)/100&lt;/p&gt;\n\n&lt;p&gt;(5.75 + 3.25)/100&lt;/p&gt;\n\n&lt;p&gt;9/100&lt;/p&gt;\n0.", "marks": 2, "negMarks": 0.5}, {"text": "Simplify: (x + y)<sup>3</sup> - (x - y)<sup>3</sup> - 6y(x<sup>2</sup> - y<sup>2</sup>)", "options": ["8y<sup>3</sup>", "x<sup>3</sup>", "8x<sup>3</sup>", "y<sup>3</sup>"], "correct": 1, "solution": "&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;Given:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;&quot;&gt;(x + y)&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;- (x - y)&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;- 6y(x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;- y&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;Formula Used:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;(x+y)&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;= x&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;+ y&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;+ 3x&lt;sup&gt;2&lt;/sup&gt;y + 3xy&lt;sup&gt;2&lt;/sup&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;&quot;&gt;(x-y)&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;= x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;- y&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;-&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;3x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;y + 3xy&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;font-weight: 700;&quot;&gt;Calculations:&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;The equations are&amp;nbsp;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr; (x + y)&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;- (x - y)&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;- 6y(x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;- y&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;&quot;&gt;now put the formula&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ y&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ 3x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;y + 3xy&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;-(x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;- y&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;- 3x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;y + 3xy&lt;sup&gt;2&lt;/sup&gt;) - 6y(x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;- y&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ y&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ 3x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;y + 3xy&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;- x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ y&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ 3x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;y - 3xy&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;) - 6yx&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;+ 6y&lt;sup&gt;3&lt;/sup&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;&quot;&gt;Now the term which is opposite to each other, we get&amp;nbsp;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;/span&gt;8y&lt;sup&gt;3&lt;/sup&gt;&lt;/p&gt;\n\n&lt;p style=&quot;&quot;&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;/span&gt;&lt;strong&gt;Hence, The value&amp;nbsp;&lt;span style=&quot;&quot;&gt;(x + y)&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;- (x - y)&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;- 6y(x&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;- y&lt;/span&gt;&lt;span style=&quot; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&lt;span style=&quot;&quot;&gt;) is 8y&lt;sup&gt;3&lt;/sup&gt;&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If 3x + 2y = 10 and 2xy = 7, then find the value of 3x - 2y (if 3x - 2y > 0).", "options": ["4", "10", "8", "6"], "correct": 1, "solution": "<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png\" width=\"26px\" /> <u style=\"font-size: 21px; font-weight: 700; display: inline !important;\">Shortcut Trick</u></span>\n<p>Use the direct identity relation between sum and difference:</p>\n<p>(3x &minus; 2y)<sup>2</sup> = (3x + 2y)<sup>2</sup> &minus; 4 &times; (3x) &times; (2y)</p>\n<p>&rArr; (3x &minus; 2y)<sup>2</sup> = (10)<sup>2</sup> &minus; 12 &times; (2xy)</p>\n<p>&rArr; (3x &minus; 2y)<sup>2</sup> = 100 &minus; 12 &times; 7 = 16</p>\n<p>&rArr; 3x &minus; 2y = &radic;16 = 4</p>\n<p><strong>&there4; The correct answer is 4.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Alternate Method</u></span></strong></span></p>\n<p><strong>Given:</strong></p>\n<p>3x + 2y = 10</p>\n<p>2xy = 7</p>\n<p><strong>Formula Used:</strong></p>\n<p>(a &minus; b)<sup>2</sup> = (a + b)<sup>2</sup> &minus; 4ab</p>\n<p><strong>Calculations:</strong></p>\n<p>&rArr; Let a = 3x and b = 2y</p>\n<p>&rArr; Product 4ab = 4 &times; (3x) &times; (2y) = 24xy</p>\n<p>&rArr; Apply the formula: (3x &minus; 2y)<sup>2</sup> = (3x + 2y)<sup>2</sup> &minus; 24xy</p>\n<p>&rArr; Substitute the value 2xy = 7 into the expression for 24xy:</p>\n<p>&rArr; 24xy = 12 &times; 2xy = 12 &times; 7 = 84</p>\n<p>&rArr; Substitute the sum and the product into the main identity:</p>\n<p>&rArr; (3x &minus; 2y)<sup>2</sup> = (10)<sup>2</sup> &minus; 84</p>\n<p>&rArr; (3x &minus; 2y)<sup>2</sup> = 100 &minus; 84</p>\n<p>&rArr; (3x &minus; 2y)<sup>2</sup> = 16</p>\n<p>&rArr; Taking the square root on both sides:</p>\n<p>&rArr; 3x &minus; 2y = &plusmn;&radic;16</p>\n<p>&rArr; 3x &minus; 2y = 4 (Since it is given that 3x &minus; 2y &gt; 0)</p>\n<p><strong>&there4; The correct answer is 4.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Square of a Sum</p>\n<p style=\"margin:0 0 8px 0;color:#444444;\">(a + b)<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup> + 2ab</p>\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Square of a Difference</p>\n<p style=\"margin:0 0 8px 0;color:#444444;\">(a &minus; b)<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup> &minus; 2ab</p>\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Sum and Difference Relation</p>\n<p style=\"margin:0 0 8px 0;color:#444444;\">(a + b)<sup>2</sup> &minus; (a &minus; b)<sup>2</sup> = 4ab. This identity helps to easily convert the sum of two numbers into their difference and vice versa when the product is known.</p></p>", "marks": 2, "negMarks": 0.5}, {"text": "The value of <span class=\"math-tex\">\\(\\rm\\frac{\\left\\{\\left(m^2+n^2\\right)(m-n)-(m-n)^3\\right\\}}{\\left(m^2 n-m n^2\\right)}\\)</span> is:", "options": ["m + n", "m − n", "2", "<span class=\"math-tex\">\\(\\rm\\frac{m}{n}\\)</span>"], "correct": 3, "solution": "&lt;p&gt;&lt;strong&gt;&lt;span style=&quot;&quot;&gt;Given:&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;Equation =&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\rm\\frac{\\left\\{\\left(m^2+n^2\\right)(m-n)-(m-n)^3\\right\\}}{\\left(m^2 n-m n^2\\right)}\\)&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&lt;strong&gt;Formula Used:&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;(a - b)&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;= a&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+&amp;nbsp;b&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;- 2ab&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&lt;strong&gt;Calculations:&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;The equation is&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{(m^2+n^2)(m-n) -(m-n)^3}{m^2n-mn^2}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{(m-n)[(m^2+n^2) -(m-n)^2]}{(mn)(m-n)}\\)&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;/span&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{(m^2+n^2) -(m^2+n^2-2mn)}{(mn)}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&amp;nbsp;&lt;/span&gt;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{m^2+n^2- m^2-n^2+2mn}{mn}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&lt;/span&gt;&amp;nbsp;&lt;span class=&quot;math-tex&quot;&gt;\\(\\frac{2mn}{mn}\\)&lt;/span&gt;&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;&lt;/span&gt;2&lt;/p&gt;\n\n&lt;p&gt;&lt;span style=&quot;&quot;&gt;&amp;rArr;&lt;/span&gt;&lt;span style=&quot;&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;strong&gt;Hence, The value of the equation is 2.&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If (5√5x<sup>3</sup> – 3√3y<sup>3</sup>) ÷ (√5x – √3y) = (Ax<sup>2</sup> + By<sup>2</sup> + Cxy), then what is the value of 3A – B – √15C ?", "options": ["-5", "12", "8", "-3"], "correct": 4, "solution": "&lt;p&gt;&lt;strong&gt;Given:&lt;/strong&gt;&lt;/p&gt;\n\n&lt;p&gt;(5&amp;radic;5x&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;&amp;ndash; 3&amp;radic;3y&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;)&amp;nbsp;&amp;divide; (&amp;radic;5x &amp;ndash;&amp;nbsp;&amp;radic;3y) = (Ax&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ By&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ Cxy)&lt;/p&gt;\n\n&lt;p&gt;&lt;b&gt;Identity used:&lt;/b&gt;&lt;/p&gt;\n\n&lt;p&gt;(a&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;&amp;ndash; b&lt;sup&gt;3&lt;/sup&gt;) = (a&amp;nbsp;&amp;ndash; b)&amp;nbsp;&amp;times;&amp;nbsp;(a&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ b&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ ab)&lt;/p&gt;\n\n&lt;p&gt;&lt;b&gt;Calculation:&lt;/b&gt;&lt;/p&gt;\n\n&lt;p&gt;(5&amp;radic;5x&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;&amp;ndash; 3&amp;radic;3y&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;) = (&amp;radic;5x)&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;&amp;ndash; (&amp;radic;3y)&lt;sup&gt;3&lt;/sup&gt;&amp;nbsp;&lt;/p&gt;\n\n&lt;p&gt;(&amp;radic;5x)&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;&amp;ndash; (&amp;radic;3y)&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;=&amp;nbsp;(&amp;radic;5x &amp;ndash;&amp;nbsp;&amp;radic;3y)&amp;nbsp;&amp;times; (5x&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+ 3y&lt;sup&gt;2&lt;/sup&gt;&amp;nbsp;+&amp;nbsp;&amp;radic;15xy)&lt;/p&gt;\n\n&lt;p&gt;As,&amp;nbsp;(5&amp;radic;5x&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;&amp;nbsp;&amp;ndash; 3&amp;radic;3y&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;3&lt;/span&gt;)&amp;nbsp;&amp;divide; (&amp;radic;5x &amp;ndash;&amp;nbsp;&amp;radic;3y) = (Ax&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ By&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ Cxy)&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr; [(&amp;radic;5x &amp;ndash;&amp;nbsp;&amp;radic;3y)&amp;nbsp;&amp;times; (5x&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ 3y&lt;span style=&quot;position: relative;  line-height: 0; vertical-align: baseline; top: -0.5em;font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+&amp;nbsp;&amp;radic;15xy)]&amp;nbsp;&amp;divide;&amp;nbsp;(&amp;radic;5x &amp;ndash;&amp;nbsp;&amp;radic;3y) =&amp;nbsp;Ax&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ By&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ Cxy&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;5x&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ 3y&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+&amp;nbsp;&amp;radic;15xy =&amp;nbsp;Ax&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ By&lt;span style=&quot;position: relative; line-height: 0; vertical-align: baseline; top: -0.5em; font-size:10.5px;&quot;&gt;2&lt;/span&gt;&amp;nbsp;+ Cxy&lt;/p&gt;\n\n&lt;p&gt;Comparing both sides we&amp;#39;ll get&lt;/p&gt;\n\n&lt;p&gt;A = 5, B = 3 and C =&amp;nbsp;&amp;radic;15&lt;/p&gt;\n\n&lt;p&gt;According to question we have to find&amp;nbsp;3A&amp;nbsp;&amp;ndash;&amp;nbsp;B&amp;nbsp;&amp;ndash;&amp;nbsp;&amp;radic;15C&lt;/p&gt;\n\n&lt;p&gt;&amp;rArr;&amp;nbsp;3A&amp;nbsp;&amp;ndash;&amp;nbsp;B&amp;nbsp;&amp;ndash;&amp;nbsp;&amp;radic;15C = 3&amp;nbsp;&amp;times; 5&amp;nbsp;&amp;ndash; 3&amp;nbsp;&amp;ndash;&amp;nbsp;&amp;radic;15&amp;nbsp;&amp;times;&amp;nbsp;&amp;radic;15&lt;/p&gt;\n\n&lt;p&gt;&lt;strong&gt;&amp;there4;&amp;nbsp;3A&amp;nbsp;&amp;ndash;&amp;nbsp;B&amp;nbsp;&amp;ndash;&amp;nbsp;&amp;radic;15C is&amp;nbsp;&amp;ndash;3&lt;/strong&gt;&lt;/p&gt;", "marks": 2, "negMarks": 0.5}, {"text": "If x² + y² = 280 and xy = 120, then find the value of (x - y) / (x + y).", "options": ["(1)/(√(13))", "√(15)", "√(13)", "(1)/(√(15 ))"], "correct": 1, "solution": "<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png\" width=\"26px\" /> <u style=\"font-size: 21px; font-weight: 700; display: inline !important;\">Shortcut Trick</u></span>\n<p>We know that ((x &minus; y) / (x + y))<sup>2</sup> = (x<sup>2</sup> + y<sup>2</sup> &minus; 2xy) / (x<sup>2</sup> + y<sup>2</sup> + 2xy)</p>\n<p>&rArr; ((x &minus; y) / (x + y))<sup>2</sup> = (280 &minus; 2 &times; 120) / (280 + 2 &times; 120)</p>\n<p>&rArr; ((x &minus; y) / (x + y))<sup>2</sup> = (280 &minus; 240) / (280 + 240) = 40 / 520 = 1 / 13</p>\n<p>&rArr; (x &minus; y) / (x + y) = 1 / &radic;13</p>\n<p><strong>&there4; The correct answer is 1/&radic;13.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Alternate Method</u></span></strong></span></p>\n<p><strong>Given:</strong></p>\n<p>x<sup>2</sup> + y<sup>2</sup> = 280</p>\n<p>xy = 120</p>\n<p><strong>Formula Used:</strong></p>\n<p>(x + y)<sup>2</sup> = x<sup>2</sup> + y<sup>2</sup> + 2xy</p>\n<p>(x &minus; y)<sup>2</sup> = x<sup>2</sup> + y<sup>2</sup> &minus; 2xy</p>\n<p><strong>Calculations:</strong></p>\n<p>&rArr; (x + y)<sup>2</sup> = 280 + 2 &times; 120</p>\n<p>&rArr; (x + y)<sup>2</sup> = 280 + 240 = 520</p>\n<p>&rArr; (x &minus; y)<sup>2</sup> = 280 &minus; 2 &times; 120</p>\n<p>&rArr; (x &minus; y)<sup>2</sup> = 280 &minus; 240 = 40</p>\n<p>We need to find the value of the ratio (x &minus; y) / (x + y).</p>\n<p>Squaring the required expression:</p>\n<p>&rArr; [(x &minus; y) / (x + y)]<sup>2</sup> = (x &minus; y)<sup>2</sup> / (x + y)<sup>2</sup></p>\n<p>&rArr; [(x &minus; y) / (x + y)]<sup>2</sup> = 40 / 520</p>\n<p>&rArr; [(x &minus; y) / (x + y)]<sup>2</sup> = 1 / 13</p>\n<p>Taking the square root on both sides:</p>\n<p>&rArr; (x &minus; y) / (x + y) = 1 / &radic;13</p>\n<p><strong>&there4; The correct answer is 1/&radic;13.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Sum and Difference of Squares</p>\n<p style=\"margin:0 0 8px 0;color:#444444;\">The identities (x + y)<sup>2</sup> = x<sup>2</sup> + y<sup>2</sup> + 2xy and (x &minus; y)<sup>2</sup> = x<sup>2</sup> + y<sup>2</sup> &minus; 2xy are fundamentally used to relate the sum and difference of variables to the sum of their squares and their product.</p>\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Relation between Squares</p>\n<p style=\"margin:0 0 8px 0;color:#444444;\">Subtracting the difference squared from the sum squared yields: (x + y)<sup>2</sup> &minus; (x &minus; y)<sup>2</sup> = 4xy. Adding them gives: (x + y)<sup>2</sup> + (x &minus; y)<sup>2</sup> = 2(x<sup>2</sup> + y<sup>2</sup>).</p>\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Difference of Squares</p>\n<p style=\"margin:0 0 8px 0;color:#444444;\">Another key algebraic identity is x<sup>2</sup> &minus; y<sup>2</sup> = (x &minus; y)(x + y), which is widely used in solving factorization and simplification problems.</p></p>", "marks": 2, "negMarks": 0.5}, {"text": "If a<sup>3</sup> - b<sup>3</sup> = 3552 and (a - b) = 6, then (a + b)<sup>2</sup> - ab is equal to∶", "options": ["568", "636", "592", "618"], "correct": 3, "solution": "<p>As we know,</p>\n\n<p>a<sup>3</sup> - b<sup>3</sup> = (a - b) (a<sup>2</sup> + b<sup>2</sup> + ab)</p>\n\n<p>a<sup>3</sup> - b<sup>3</sup> = (a - b) (a<sup>2</sup> + b<sup>2</sup> - 2ab + ab + 2ab)</p>\n\n<p>a<sup>3</sup> - b<sup>3</sup> = (a - b) [(a + b)<sup>2</sup> - ab]</p>\n\n<p>Given, a<sup>3</sup> - b<sup>3</sup> = 3552 and a - b = 6, then</p>\n\n<p>3552 = 6 [(a + b)<sup>2</sup> - ab]</p>\n[(a + b)<sup>2</sup> - ab] = 3552/6 = 592", "marks": QUESTIONS.forEach(function(q,i){
  var o='';
  q.options.forEach(function(opt,oi){o+='<div class="option" data-option="'+(oi+1)+'" onclick="selectOption('+i+','+(oi+1)+')"><div class="option-letter">'+String.fromCharCode(65+oi)+'</div><div class="option-text">'+opt+'</div><div class="option-check"></div></div>'});
  var s='';
  if(q.solution&&q.solution.length>5){s='<div class="solution" id="sol'+i+'"><div class="solution-header"><div class="solution-icon">💡</div><div class="solution-title">Solution</div></div><div class="solution-content">'+q.solution+'</div></div>'}
  qC.innerHTML+='<div class="question-card" id="q'+i+'" data-correct="'+q.correct+'" data-marks="'+q.marks+'" data-negmarks="'+q.negMarks+'"><div class="q-header"><div class="q-number">Question '+(i+1)+'</div><div class="q-marks"><span class="pos">+'+q.marks+'</span> <span class="neg">−'+q.negMarks+'</span></div></div><div class="q-body"><div class="q-text">'+q.text+'</div><div class="options">'+o+'</div>'+s+'</div></div>';
});
var pal=document.getElementById('palette');
for(var i=0;i<totalQ;i++){var d=document.createElement('div');d.className='palette-item';d.id='palette-'+i;d.textContent=i+1;d.onclick=function(){document.getElementById('q'+this.id.split('-')[1]).scrollIntoView({behavior:'smooth'})};pal.appendChild(d)}
var tI=setInterval(function(){if(submitted){clearInterval(tI);return}timeLeft--;document.getElementById('timer').textContent='⏱ '+Math.floor(timeLeft/60)+':'+(timeLeft%60).toString().padStart(2,'0');if(timeLeft<=0){clearInterval(tI);submitTest()}},1000);
function selectOption(q,o){if(submitted)return;var c=document.getElementById('q'+q);c.querySelectorAll('.option').forEach(function(x){x.classList.remove('selected')});c.querySelector('.option[data-option="'+o+'"]').classList.add('selected');userAnswers[q]=o;document.getElementById('palette-'+q).classList.add('answered');document.getElementById('submitBtn').classList.add('visible')}
function submitTest(){if(submitted)return;submitted=true;clearInterval(tI);var sc=0,co=0,at=0;
for(var i=0;i<totalQ;i++){var q=document.getElementById('q'+i);var c=parseInt(q.dataset.correct);var marks=parseFloat(q.dataset.marks)||2;var neg=parseFloat(q.dataset.negmarks)||0.5;var u=userAnswers[i];
q.querySelectorAll('.option').forEach(function(o){var n=parseInt(o.dataset.option);o.onclick=null;if(n===c){o.classList.add('correct');o.querySelector('.option-check').textContent='✓'}else if(n===u){o.classList.add('wrong');o.querySelector('.option-check').textContent='✗'}});
if(u){at++;if(u===c){sc+=marks;co++}else{sc-=neg}}var s=document.getElementById('sol'+i);if(s)s.classList.add('visible')}
document.getElementById('scoreValue').textContent=co+'/'+totalQ;document.getElementById('scoreLabel').textContent='Score: '+sc.toFixed(2)+' | Attempted: '+at+' | Correct: '+co+' | Wrong: '+(at-co);document.getElementById('scoreBanner').classList.add('visible');
if(ANALYSIS&&ANALYSIS.rank){document.getElementById('analysisGrid').innerHTML='<div class="stat"><div class="value rank">'+ANALYSIS.rank+'</div><div class="label">Rank</div></div><div class="stat"><div class="value pct">'+(ANALYSIS.percentile?ANALYSIS.percentile.toFixed(2)+'%':'N/A')+'</div><div class="label">Percentile</div></div><div class="stat"><div class="value avg">'+(ANALYSIS.avgMarks?ANALYSIS.avgMarks.toFixed(2):'N/A')+'</div><div class="label">Avg Marks</div></div><div class="stat"><div class="value total">'+(ANALYSIS.totalStudents||'N/A')+'</div><div class="label">Students</div></div>';document.getElementById('analysisCard').classList.add('visible')}
document.getElementById('submitBtn').style.display='none';document.getElementById('viewSolutionsBtn').style.display='inline-block';
if(window.MathJax&&window.MathJax.typesetPromise)window.MathJax.typesetPromise();document.getElementById('scoreBanner').scrollIntoView({behavior:'smooth'})}
function toggleSolutions(){solsVisible=!solsVisible;document.querySelectorAll('.solution').forEach(function(s){if(solsVisible)s.classList.add('visible');else s.classList.remove('visible')});document.getElementById('viewSolutionsBtn').textContent=solsVisible?'📖 Hide Solutions':'📖 Show Solutions'}
setTimeout(function(){if(window.MathJax&&window.MathJax.typesetPromise)window.MathJax.typesetPromise()},2000);
</script></body></html>
