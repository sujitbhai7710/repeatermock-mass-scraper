<script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},svg:{fontCache:'global'},options:{skipHtmlTags:['script','noscript','style','textarea','pre','code']}};const QUESTIONS=[{"text": "Find the odd one out from the given alternatives:", "options": ["GDP", "NNP", "GNP", "RBI"], "correct": 4, "solution": "<p>The logic followed here is:</p>\\n\\n<p>Logic: All options except one are <strong>economic measures/indicators</strong>, while one is an <strong>organization</strong>.</p>\\n\\n<p>GDP → Economic measure</p>\\n\\n<p>NNP → Economic measure</p>\\n\\n<p>GNP → Economic measure</p>\\n\\n<p>RBI → <strong>Central Bank / Organization</strong> </p>\\n\\n<p>Hence, the correct answer is <strong>\"Option 4\".</strong></p>\\n", "marks": 2, "negMarks": 0.5}, {"text": "What is the primary instrument used in the performance of Burrakatha in Andhra Pradesh?", "options": ["Dholak", "Tambura", "Noot", "Rabab"], "correct": 2, "solution": "<p>The correct answer is <u><strong>Tambura</strong></u>.</p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><u style=\"font-size: 21px; font-weight: bolder; font-family: var(--bs-body-font-family); text-align: var(--bs-body-text-align);\">Key Points</u></span></p>\n\n<ul>\n\\t<li><strong>Burrakatha</strong> is a traditional folk storytelling art form originating from Andhra Pradesh, India.</li>\n\\t<li>The primary instrument used during Burrakatha performances is the <strong>Tambura</strong>, a string instrument that plays a pivotal role in setting the rhythm and tone.</li>\n\\t<li>The Tambura is played by the main storyteller, referred to as the <strong>\"Kathakudu\"</strong>, while narrating mythological, historical, or social stories.</li>\n\\t<li>Burrakatha performances often involve <strong>three artists</strong>: the main storyteller (Kathakudu), an assistant who plays rhythm instruments like the dholak or kanjira, and another assistant who sings or provides commentary.</li>\n\\t<li>The Tambura helps in maintaining the narrative flow by creating a consistent and captivating background melody.</li>\n</ul>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<ul>\n\\t<li><strong>Dholak:</strong>\n\n\\t<ul>\n\\t\\t<li>The Dholak is a popular two-headed drum widely used in Indian folk and classical music.</li>\n\\t\\t<li>While the Dholak is commonly employed in folk performances, it is not the primary instrument for Burrakatha.</li>\n\\t\\t<li>In Burrakatha, the Dholak may be used as a supporting instrument to enhance rhythm.</li>\n\\t</ul>\n\\t</li>\n\\t<li><strong>Noot:</strong>\n\\t<ul>\n\\t\\t<li>Noot refers to small cymbals or clappers used in some traditional Indian music performances.</li>\n\\t\\t<li>It is not associated with Burrakatha but may be used in other regional folk arts for rhythm accompaniment.</li>\n\\t</ul>\n\\t</li>\n\\t<li><strong>Rabab:</strong>\n\\t<ul>\n\\t\\t<li>The Rabab is a plucked string instrument originating from Central Asia and is often used in Hindustani classical music.</li>\n\\t\\t<li>It is not relevant to Burrakatha performances, as it is not traditionally used in Andhra Pradesh's folk storytelling traditions.</li>\n\\t</ul>\n\\t</li>\n\\t<li><strong>Burrakatha:</strong>\n\\t<ul>\n\\t\\t<li>Burrakatha is a <strong>unique folk art form</strong> characterized by its blend of storytelling, music, and commentary.</li>\n\\t\\t<li>The performances are often used to convey <strong>social messages, narrate epics, or recount historical events</strong> to educate and entertain audiences.</li>\n\\t\\t<li>This art form is deeply rooted in the <strong>cultural heritage of Andhra Pradesh</strong>, with its origins tracing back to early Telugu literature.</li>\n\\t</ul>\n\\t</li>\n</ul>", "marks": 2, "negMarks": 0.5}, {"text": "Which of the Indian States/Union Territories had lowest sex ratio in 2011?", "options": ["Haryana", "Daman and Diu", "Punjab", "Dadar and Nagar Haveli"], "correct": 2, "solution": "<p>The correct answer is <u><strong>Daman and Diu</strong></u>.</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><u style=\"font-size: 21px; font-weight: bolder; font-family: var(--bs-body-font-family); text-align: var(--bs-body-text-align);\">Key Points</u></span></p>\n<ul>\n<li>According to the 2011 Census, <strong>Daman and Diu</strong> had the lowest sex ratio among all Indian States and Union Territories, with only <strong>618 females per 1000 males.</strong></li>\n<li>The low sex ratio in Daman and Diu is attributed to the <strong>influx of a male-dominated workforce</strong>, as the region has many industries attracting migrant workers.</li>\n<li>The sex ratio is a critical demographic indicator that reflects the number of females per 1000 males in a population.</li>\n<li>Efforts are being made to address the gender imbalance in such regions through <strong>awareness campaigns</strong> and policies promoting gender equality.</li>\n<li>In contrast, the national sex ratio of India in 2011 was recorded at <strong>943 females per 1000 males</strong>, highlighting significant regional disparities.</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n<ul>\n<li><strong>Haryana</strong>\n<ul>\n<li>Haryana had the <strong>second-lowest sex ratio</strong> in 2011, with <strong>879 females per 1000 males</strong>.</li>\n<li>The skewed sex ratio in Haryana is a result of long-standing issues such as <strong>female foeticide, gender-based discrimination, and son preference</strong>.</li>\n<li>To address this issue, the government introduced initiatives like <strong>Beti Bachao Beti Padhao</strong> to improve the status of women in the state.</li>\n</ul>\n</li>\n<li><strong>Punjab</strong>\n<ul>\n<li>Punjab recorded a sex ratio of <strong>895 females per 1000 males</strong> in 2011, making it one of the states with a low sex ratio.</li>\n<li>Similar to Haryana, Punjab also faces challenges like <strong>female infanticide and societal preference for male children</strong>.</li>\n<li>The state has implemented several awareness programs and campaigns to tackle this issue.</li>\n</ul>\n</li>\n<li><strong>Dadra and Nagar Haveli</strong>\n<ul>\n<li>Dadra and Nagar Haveli recorded a sex ratio of <strong>774 females per 1000 males</strong> in the 2011 Census.</li>\n<li>The low sex ratio in this Union Territory can also be attributed to the <strong>male-dominated migrant workforce</strong> in industrial and construction sectors.</li>\n<li>Efforts are being made to address the gender imbalance and improve the living standards of women in the region.</li>\n</ul>\n</li>\n<li><strong>Importance of Sex Ratio</strong>\n<ul>\n<li>The sex ratio is a crucial social indicator that reflects the status of women in a society.</li>\n<li>It impacts various aspects of development, including education, health, and gender equality.</li>\n<li>Improving the sex ratio requires addressing deep-rooted cultural norms and practices, as well as ensuring effective implementation of laws and policies.</li>\n</ul>\n</li>\n</ul>\n```72:T1aff,<p>सही उत्तर <u><strong>दमन और दीव</strong></u> है।</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><u style=\"font-size: 21px; font-weight: bolder; font-family: var(--bs-body-font-family); text-align: var(--bs-body-text-align);\">मुख्य बिंदु</u></span></p>\n<ul>\n<li>2011 की जनगणना के अनुसार, <strong>दमन और दीव</strong> में सभी भारतीय राज्यों और केंद्र शासित प्रदेशों में सबसे कम लिंगानुपात था, जहाँ प्रति 1000 पुरुषों पर केवल <strong>618 महिलाएँ</strong> थीं।</li>\n<li>दमन और दीव में कम लिंगानुपात का कारण <strong>पुरुष-प्रधान कार्यबल का आगमन</strong> है, क्योंकि इस क्षेत्र में कई उद्योग हैं जो प्रवासी श्रमिकों को आकर्षित करते हैं।</li>\n<li>लिंगानुपात एक महत्वपूर्ण जनसांख्यिकीय संकेतक है जो जनसंख्या में प्रति 1000 पुरुषों पर महिलाओं की संख्या को दर्शाता है।</li>\n<li><strong>जागरूकता अभियानों</strong> और लैंगिक समानता को बढ़ावा देने वाली नीतियों के माध्यम से ऐसे क्षेत्रों में लैंगिक असंतुलन को दूर करने के प्रयास किए जा रहे हैं।</li>\n<li>इसके विपरीत, 2011 में भारत का राष्ट्रीय लिंगानुपात <strong>943 महिलाएं प्रति 1000 पुरुष</strong> दर्ज किया गया, जो महत्वपूर्ण क्षेत्रीय असमानताओं को उजागर करता है।</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>अतिरिक्त जानकारी</u></span></strong></span></p>\n<ul>\n<li><strong>हरियाणा</strong>\n<ul>\n<li>2011 में हरियाणा में <strong>दूसरा सबसे कम लिंगानुपात</strong> था, जहाँ प्रति 1000 पुरुषों पर <strong>879 महिलाएँ</strong> थीं।</li>\n<li>हरियाणा में विषम लिंगानुपात लंबे समय से चले आ रहे मुद्दों जैसे <strong>महिला भ्रूण हत्या, लिंग-आधारित भेदभाव और पुत्र वरीयता</strong> का परिणाम है।</li>\n<li>इस मुद्दे को हल करने के लिए, सरकार ने राज्य में महिलाओं की स्थिति में सुधार के लिए <strong>बेटी बचाओ बेटी पढ़ाओ</strong> जैसी पहल शुरू की।</li>\n</ul>\n</li>\n<li><strong>पंजाब</strong>\n<ul>\n<li>2011 में पंजाब में <strong>895 महिलाएं प्रति 1000 पुरुष</strong> का लिंगानुपात दर्ज किया गया, जिससे यह कम लिंगानुपात वाले राज्यों में से एक बन गया।</li>\n<li>हरियाणा के समान, पंजाब को भी <strong>महिला शिशु हत्या और पुरुष बच्चों के लिए सामाजिक प्राथमिकता</strong> जैसी चुनौतियों का सामना करना पड़ता है।</li>\n<li>राज्य ने इस मुद्दे से निपटने के लिए कई जागरूकता कार्यक्रम और अभियान लागू किए हैं।</li>\n</ul>\n</li>\n<li><strong>दादरा और नगर हवेली</strong>\n<ul>\n<li>दादरा और नगर हवेली ने 2011 की जनगणना में <strong>774 महिलाएं प्रति 1000 पुरुष</strong> का लिंगानुपात दर्ज किया।</li>\n<li>इस केंद्र शासित प्रदेश में कम लिंगानुपात को औद्योगिक और निर्माण क्षेत्रों में <strong>पुरुष-प्रधान प्रवासी कार्यबल</strong> के लिए भी जिम्मेदार ठहराया जा सकता है।</li>\n<li>क्षेत्र में लैंगिक असंतुलन को दूर करने और महिलाओं के जीवन स्तर में सुधार के प्रयास किए जा रहे हैं।</li>\n</ul>\n</li>\n<li><strong>लिंगानुपात का महत्व</strong>\n<ul>\n<li>लिंगानुपात एक महत्वपूर्ण सामाजिक संकेतक है जो समाज में महिलाओं की स्थिति को दर्शाता है।</li>\n<li>यह शिक्षा, स्वास्थ्य और लैंगिक समानता सहित विकास के विभिन्न पहलुओं को प्रभावित करता है।</li>\n<li>लिंगानुपात में सुधार के लिए गहरी जड़ें वाली सांस्कृतिक मानदंडों और प्रथाओं को संबोधित करने के साथ-साथ कानूनों और नीतियों के प्रभावी कार्यान्वयन को सुनिश्चित करने की आवश्यकता है।</li>\n</ul>\n</li>\n</ul>", "marks": 2, "negMarks": 0.5}, {"text": "Which region did Babur first conquer during his initial campaigns in India?", "options": ["Panipat", "Lahore", "Sialkot", "Bhira"], "correct": 4, "solution": "<p>The correct answer is <u><strong>Bhira</strong></u>.</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><u style=\"font-size: 21px; font-weight: bolder; font-family: var(--bs-body-font-family); text-align: var(--bs-body-text-align);\">Key Points</u></span></p>\n<ul>\n<li>Babur’s first conquest in India was the region of <strong>Bhira</strong>, located in Punjab, which was strategically important for establishing his foothold in India.</li>\n<li>This conquest occurred in <strong>1519</strong>, during Babur’s early expeditions into the Indian subcontinent.</li>\n<li>Bhira provided Babur a base to secure his operations and enabled further campaigns in northern India.</li>\n<li>It was a well-fortified town, and its capture demonstrated Babur’s military strategy and organizational skills.</li>\n<li>The conquest of Bhira was part of Babur’s initial efforts to expand his empire and was a precursor to his later victories, such as the First Battle of Panipat in 1526.</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n<ul>\n<li><strong>Panipat</strong>\n<ul>\n<li>The First Battle of Panipat was fought on <strong>21 April 1526</strong>, between Babur and Ibrahim Lodi.</li>\n<li>It marked the beginning of the Mughal Empire in India and was one of the earliest battles to use gunpowder firearms and field artillery in the subcontinent.</li>\n<li>Panipat was not Babur’s first conquest in India but was the decisive battle that established his dominance.</li>\n</ul>\n</li>\n<li><strong>Lahore</strong>\n<ul>\n<li>Babur’s campaign in Lahore occurred later as part of his efforts to consolidate his empire after the First Battle of Panipat.</li>\n<li>Lahore was an important cultural and political center and played a significant role in the Mughal Empire’s administration.</li>\n</ul>\n</li>\n<li><strong>Sialkot</strong>\n<ul>\n<li>Sialkot was another important city in Punjab, but it was not Babur’s first conquest during his campaigns in India.</li>\n<li>It became part of the Mughal Empire as Babur expanded his influence in the region.</li>\n</ul>\n</li>\n</ul>\n```84:T127b,<p>सही उत्तर <u><strong>भेरा</strong></u> है।</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><u style=\"font-size: 21px; font-weight: bolder; font-family: var(--bs-body-font-family); text-align: var(--bs-body-text-align);\">मुख्य बिंदु</u></span></p>\n<ul>\n<li>भारत में बाबर की पहली विजय पंजाब में स्थित <strong>भेरा</strong> का क्षेत्र था, जो भारत में अपनी पकड़ स्थापित करने के लिए रणनीतिक रूप से महत्वपूर्ण था।</li>\n<li>यह विजय <strong>1519</strong> में, भारतीय उपमहाद्वीप में बाबर के शुरुआती अभियानों के दौरान हुई थी।</li>\n<li>भेरा ने बाबर को अपने अभियानों को सुरक्षित करने के लिए एक आधार प्रदान किया और उत्तरी भारत में आगे के अभियानों को सक्षम किया।</li>\n<li>यह एक अच्छी तरह से किलेबंद शहर था, और इसकी विजय ने बाबर की सैन्य रणनीति और संगठनात्मक कौशल का प्रदर्शन किया।</li>\n<li>भेरा की विजय बाबर के साम्राज्य का विस्तार करने के शुरुआती प्रयासों का हिस्सा थी और 1526 में पानीपत की पहली लड़ाई जैसी उनकी बाद की जीत का अग्रदूत थी।</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>अतिरिक्त जानकारी</u></span></strong></span></p>\n<ul>\n<li><strong>पानीपत</strong>\n<ul>\n<li>पानीपत की पहली लड़ाई <strong>21 अप्रैल 1526</strong> को बाबर और इब्राहिम लोदी के बीच लड़ी गई थी।</li>\n<li>इसने भारत में मुगल साम्राज्य की शुरुआत को चिह्नित किया और उपमहाद्वीप में बारूद आग्नेयास्त्रों और क्षेत्र तोपखाने का उपयोग करने वाली शुरुआती लड़ाइयों में से एक थी।</li>\n<li>पानीपत भारत में बाबर की पहली विजय नहीं थी, लेकिन यह निर्णायक लड़ाई थी जिसने उसकी प्रभुत्व स्थापित की।</li>\n</ul>\n</li>\n<li><strong>लाहौर</strong>\n<ul>\n<li>लाहौर में बाबर का अभियान बाद में पानीपत की पहली लड़ाई के बाद अपने साम्राज्य को मजबूत करने के प्रयासों के हिस्से के रूप में हुआ।</li>\n<li>लाहौर एक महत्वपूर्ण सांस्कृतिक और राजनीतिक केंद्र था और मुगल साम्राज्य के प्रशासन में महत्वपूर्ण भूमिका निभाई।</li>\n</ul>\n</li>\n<li><strong>सियालकोट</strong>\n<ul>\n<li>सियालकोट पंजाब का एक और महत्वपूर्ण शहर था, लेकिन भारत में अपने अभियानों के दौरान यह बाबर की पहली विजय नहीं थी।</li>\n<li>यह मुगल साम्राज्य का हिस्सा बन गया क्योंकि बाबर ने इस क्षेत्र में अपना प्रभाव बढ़ाया।</li>\n</ul>\n</li>\n</ul>85:Tf8e,<p>The correct answer is <u><strong>By winning three repechage bouts after losing his opening match</strong></u>.</p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><u style=\"font-size: 21px; font-weight: bolder; font-family: var(--bs-body-font-family); text-align: var(--bs-body-text-align);\">Key Points</u></span></p>\n\n<ul>\n\\t<li>Sushil Kumar won the bronze medal in the 66 kg freestyle wrestling category at the <strong>2008 Beijing Olympics</strong>.</li>\n\\t<li>After losing his opening match to Andriy Stadnik of Ukraine, he entered the <strong>repechage round</strong> due to Stadnik advancing to the final.</li>\n\\t<li>In the repechage round, Sushil Kumar secured victories in three consecutive bouts against <strong>Doug Schwab (USA)</strong>, <strong>Albert Batyrov (Belarus)</strong>, and <strong>Leonid Spiridonov (Kazakhstan)</strong>.</li>\n\\t<li>He defeated Leonid Spiridonov in the bronze medal match, making history as the first Indian wrestler to win an Olympic medal since Khashaba Dadasaheb Jadhav’s bronze in 1952.</li>\n\\t<li>This achievement brought wrestling back into the spotlight in India and inspired a new generation of wrestlers.</li>\n</ul>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<ul>\n\\t<li><strong>Option 1: By winning all his bouts consecutively without any loss</strong>\n\n\\t<ul>\n\\t\\t<li>This option is incorrect as Sushil Kumar lost his opening match against Andriy Stadnik. He did not have an undefeated run in the tournament.</li>\n\\t\\t<li>Winning all bouts consecutively is a rare occurrence in wrestling, especially at the Olympic level, due to tough competition.</li>\n\\t</ul>\n\\t</li>\n\\t<li><strong>Option 3: By defeating the reigning champion in the finals</strong>\n\\t<ul>\n\\t\\t<li>This option is incorrect because Sushil Kumar did not compete in the final match of the tournament; he competed in the bronze medal bout.</li>\n\\t\\t<li>He faced Leonid Spiridonov in the repechage round for the bronze medal and not the reigning champion in the finals.</li>\n\\t</ul>\n\\t</li>\n\\t<li><strong>Option 4: By receiving a walkover in the semifinals</strong>\n\\t<ul>\n\\t\\t<li>This option is incorrect as Sushil Kumar did not participate in the semifinals. He advanced through the repechage round after losing his first match.</li>\n\\t\\t<li>In Olympic wrestling, a walkover occurs when an opponent is unable to compete due to injury or other reasons, but this scenario did not apply to Sushil Kumar in the 2008 Olympics.</li>\n\\t</ul>\n\\t</li>\n\\t<li><strong>Main Theme: Repechage System in Wrestling</strong>\n\\t<ul>\n\\t\\t<li>The repechage system gives wrestlers who lose to a finalist a second chance to compete for a bronze medal.</li>\n\\t\\t<li>This system ensures that wrestlers who face strong opponents early in the tournament still have a fair chance at securing a medal.</li>\n\\t\\t<li>It is commonly used in wrestling tournaments, including the Olympics, to maintain competitive fairness.</li>\n\\t</ul>\n\\t</li>\n</ul>", "marks": 2, "negMarks": 0.5}, {"text": "What is the role of Article 263 in maintaining Union-State coordination?", "options": ["Settles taxation disputes", "Creates Zonal Councils", "Provides Inter-State Council framework", "Enforces Emergency Provisions"], "correct": 3, "solution": "<p>The correct answer is <u><strong>Provides Inter-State Council framework</strong></u>.</p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><u style=\"font-size: 21px; font-weight: bolder; font-family: var(--bs-body-font-family); text-align: var(--bs-body-text-align);\">Key Points</u></span></p>\n\n<ul>\n\\t<li>Article 263 of the Indian Constitution empowers the President to establish an Inter-State Council if it appears to him that the public interests would be served by such a council.</li>\n\\t<li>The primary role of the Inter-State Council is to facilitate coordination between the Union and State governments, ensuring harmonious decision-making.</li>\n\\t<li>The Council can inquire into and discuss disputes or subjects of common interest between states or between the Union and one or more states.</li>\n\\t<li>It provides a forum for discussing administrative issues and suggesting better methods for policy and implementation of decisions affecting Union-State relations.</li>\n\\t<li>The Inter-State Council is an advisory body and does not have executive powers; its recommendations are not binding.</li>\n</ul>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<ul>\n\\t<li><strong>Settles taxation disputes (Option 1)</strong>\n\n\\t<ul>\n\\t\\t<li>Taxation disputes between states or between the Union and states are primarily resolved through institutions such as the Goods and Services Tax (GST) Council, set up under Article 279A of the Constitution.</li>\n\\t\\t<li>The GST Council is responsible for making recommendations to the Union and States on issues related to GST, including tax rates and exemptions.</li>\n\\t\\t<li>Article 263 does not directly deal with settling taxation disputes.</li>\n\\t</ul>\n\\t</li>\n\\t<li><strong>Creates Zonal Councils (Option 2)</strong>\n\\t<ul>\n\\t\\t<li>Zonal Councils are established under the States Reorganisation Act, 1956, and are not directly linked to Article 263.</li>\n\\t\\t<li>These councils aim to promote cooperation and coordination between states in each zone and with the Union government.</li>\n\\t\\t<li>There are five Zonal Councils: Northern, Southern, Eastern, Western, and Central, and they address regional issues like economic development, infrastructure, and border disputes.</li>\n\\t</ul>\n\\t</li>\n\\t<li><strong>Enforces Emergency Provisions (Option 4)</strong>\n\\t<ul>\n\\t\\t<li>Emergency provisions are governed by Articles 352, 356, and 360 of the Constitution and are unrelated to Article 263.</li>\n\\t\\t<li>These provisions empower the President to declare a National Emergency, President’s Rule in a state, or a Financial Emergency under specific circumstances.</li>\n\\t\\t<li>Article 263 is focused on coordination and cooperation between the Union and states and does not deal with emergencies.</li>\n\\t</ul>\n\\t</li>\n</ul>", "marks": 2, "negMarks": 0.5}, {"text": "Select the most appropriate synonym of the given word: <strong>CIRCUMSPECT</strong>", "options": ["Reckless", "Brash", "Carefree", "Cautious"], "correct": 4, "solution": "<p>The correct answer is: <b>Cautious</b>.</p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p>\n\n<ul>\n    <li>The word <strong>\"circumspect\"</strong> means being wary and unwilling to take risks; thinking carefully about possible risks before doing or saying something. (सावधान/सोच-समझकर)</li>\n    <ul>\n        <li><strong>Example:</strong> She was circumspect about revealing her personal information to strangers.</li>\n    </ul>\n    <li>The word <strong>\"cautious\"</strong> means being careful to avoid potential problems or dangers. (सतर्क)</li>\n    <ul>\n        <li><strong>Example:</strong> He took a cautious approach to investing his money in the stock market.</li>\n    </ul>\n    <li>Hence, \"circumspect\" and \"cautious\" share similar meanings, making \"cautious\" the most appropriate synonym.</li>\n</ul>\n\n<p>Therefore, the correct answer is: <strong>Cautious</strong>.</p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<p>Here are the other options explained along with their Hindi meanings and example sentences:</p>\n\n<ul>\n    <li><strong>Reckless</strong> (लापरवाह): Acting without thinking or caring about the consequences.\n    <ul>\n        <li><strong>Example:</strong> Driving recklessly in heavy traffic can lead to serious accidents.</li>\n    </ul>\n    </li>\n    <li><strong>Brash</strong> (अत्यधिक आत्मविश्वासी और आक्रामक): Being self-assertive in a rude, noisy, or overconfident way.\n    <ul>\n        <li><strong>Example:</strong> His brash attitude often annoyed his colleagues.</li>\n    </ul>\n    </li>\n    <li><strong>Carefree</strong> (बिना चिंता के): Free from worries or responsibilities.\n    <ul>\n        <li><strong>Example:</strong> During their vacation, they enjoyed a carefree week on the beach.</li>\n    </ul>\n    </li>\n</ul>36:T960,<p>The correct answer is: <b>Menagerie</b>.</p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p>\n\n<ul>\n    <li>The word <strong>\"Menagerie\"</strong> refers to a collection of wild animals that are kept in captivity, typically for exhibition. (पशुशाला)</li>\n    <ul>\n        <li><strong>Example:</strong> The children were excited to visit the menagerie to see the exotic animals up close.</li>\n    </ul>\n    <li><strong>\"Menagerie\"</strong> is the correct word for the definition \"A place where wild animals are kept.\" Its Hindi meaning is (पशुशाला).</li>\n    <ul>\n        <li><strong>Example:</strong> The traveling circus included a menagerie of lions, tigers, and other wild animals.</li>\n    </ul>\n</ul>\n\n<p>Therefore, the correct answer is: <strong>Menagerie</strong>.</p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<p>Here are the other options explained along with their Hindi meanings and example sentences:</p>\n\n<ul>\n    <li><strong>Aviary</strong> (<span style=\"color: rgb(33, 37, 41);\">पक्षीशाला</span>): A large cage or enclosure for keeping birds.</li>\n    <ul>\n        <li><strong>Example:</strong> The aviary at the zoo houses a variety of colorful parrots and peacocks.</li>\n    </ul>\n    <li><strong>Sanctuary</strong> (<span style=\"color: rgb(33, 37, 41);\">अभयारण्य</span>): A protected area where animals are kept safe in their natural habitat.</li>\n    <ul>\n        <li><strong>Example:</strong> The wildlife sanctuary is home to numerous endangered species.</li>\n    </ul>\n    <li><strong>Park</strong> (<span style=\"color: rgb(33, 37, 41);\">उद्यान</span>): A public area with greenery, often used for recreational purposes.</li>\n    <ul>\n        <li><strong>Example:</strong> Families gathered at the park for a picnic on the sunny afternoon.</li>\n    </ul>\n</ul>37:Tb0b,<p>The correct answer is: <b>Option 2</b> i.e. Seeking approval through flattery.</p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p>\n\n<ul>\n    <li>The idiom <strong>\"Currying favour\"</strong> means seeking approval or advantage from someone through excessive flattery or trying to please them. (खुशामद करके पक्ष लेना)</li>\n    <ul>\n        <li><strong>Example:</strong> He was currying favour with his boss by always complimenting her ideas.</li>\n    </ul>\n</ul>\n\n<ul>\n    <li><strong>Explanation of the correct option:</strong> \"Seeking approval through flattery\" is the appropriate meaning of the idiom \"currying favour.\" It represents the act of gaining someone’s favor by being overly pleasing or flattering. (खुशामद के माध्यम से स्वीकृति प्राप्त करना)</li>\n    <ul>\n        <li><strong>Example:</strong> The employee tried currying favour with the manager to secure a promotion.</li>\n    </ul>\n</ul>\n\n<p>Therefore, the correct answer is: <strong>Option 2</strong>.</p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<p>Here are the other options explained along with their Hindi meanings and example sentences:</p>\n\n<ul>\n    <li><strong>Option 1: Seeking emotional validation</strong> (भावनात्मक मान्यता प्राप्त करना): The act of wanting confirmation or approval for one’s emotions or feelings.\n    <ul>\n        <li><strong>Example:</strong> She constantly seeks emotional validation from her friends.</li>\n    </ul>\n    </li>\n\n    <li><strong>Option 3: Avoiding direct confrontation</strong> (प्रत्यक्ष टकराव से बचना): Refers to steering clear of any direct conflict or argument.\n    <ul>\n        <li><strong>Example:</strong> Instead of addressing the issue, he avoided direct confrontation with his colleagues.</li>\n    </ul>\n    </li>\n\n    <li><strong>Option 4: Asking for forgiveness subtly</strong> (धीरे-धीरे माफी मांगना): Refers to apologizing in an indirect or subtle way.\n    <ul>\n        <li><strong>Example:</strong> She asked for forgiveness subtly by leaving a heartfelt note on his desk.</li>\n    </ul>\n    </li>\n</ul>38:T655,\n<p>The correct answer is <strong>option 1.</strong></p>\n\n<p><span style=\"display: flex; gap: 6px; align-items: center;\">\n  <img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" />\n  <strong><span style=\"vertical-align: middle; font-size: 21px;\"><u>Key Points</u></span></strong>\n</span></p>\n\n<p><strong>The misspelled word is 'Pithey', 'Pithhy', and 'Pithie'.</strong></p>\n\n<ul>\n    <li><strong>The correct spelling is 'Pithy'.</strong></li>\n    <li>The word '<strong>pithy</strong>' is an <strong>adjective</strong> meaning 'concise and forcefully expressive' <strong>(संक्षिप्त और ers to a temporary place for keeping dead bodies before final rites.</li>\n</ul>\n\n<p>Therefore, the correct answer is: <strong>Option 4 i.e. Mortuary</strong>.</p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<p>Here are the other options explained along with their Hindi meanings and example sentences:</p>\n\n<ul>\n    <li><strong>Sanctuary</strong> (शरणस्थल): A safe place or a place of refuge, often used for wildlife or religious purposes.\n        <ul>\n            <li><strong>Example: </strong>The sanctuary provides a safe haven for endangered species.</li>\n        </ul>\n    </li>\n    <li><strong>Sepulcher</strong> (मकबरा): A small room or monument, often made of stone, where a dead person is buried.\n        <ul>\n            <li><strong>Example: </strong>The ancient sepulcher was decorated with intricate carvings.</li>\n        </ul>\n    </li>\n    <li><strong>Crematorium</strong> (श्मशान): A facility where dead bodies are reduced to ashes by burning.\n        <ul>\n            <li><strong>Example: </strong>We visited the crematorium to pay our last respects.</li>\n        </ul>\n    </li>\n</ul>3a:T9dc,<div><span style=\"\">The correct answer is '</span><span style=\"color: rgb(33, 37, 41);\"><strong>is</strong>'</span><span style=\"\">.</span></div> \n<div> </div> \n<div><span style=\"\"><span style=\"display: flex; gap: 6px; align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle; font-size: 21px;\"><u>Key Points</u></span></strong></span></span></div> \n<ul> \n<li><span style=\"\">The subject of the sentence <span style=\"color: rgb(33, 37, 41);\"><strong>had raised</strong>'</span><span style=\"\">.</span></div>\n<div> </div>\n<div><span style=\"\"><span style=\"display: flex; gap: 6px; align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle; font-size: 21px;\"><u>Key Points</u></span></strong></span></span></div>\n<ul>\n  <li><span style=\"\">The phrase \"<strong>had raised</strong>\" is in the past perfect tense, which is used to describe an action that was completed before another action in the past.</span></li>\n  <li><span style=\"\">The sentence indicates that the objections were completed before the committee convened, which makes the past perfect tense appropriate.</span></li>\n  <li><span style=\"\"><strong>Options 1, 2, and 3</strong> are incorrect because they do not fit the context of the sentence.</span></li>\n</ul>\n<div><span style=\"\">Therefore, the correct answer is <strong>Option 4</strong>.</span></div>\n<div> </div>\n<div><span style=\"\"><strong>Complete Sentence:</strong> <em>\"They <u><strong>had raised</strong></u> their objections by the time the committee convened.\"</em></span></div>\n<div> </div>\n<div><span style=\"\"><span style=\"display: flex; gap: 6px; align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle; font-size: 21px;\"><u>Additional Information</u></span></strong></span></span></div>\n<ul>\n  <li><span style=\"\"><strong>Option 1: \"raised\"</strong> is incorrect because it is in the simple past tense and does not convey the idea of an action completed before another action.</span></li>\n  <li><span style=\"\"><strong>Option 2: \"have raised\"</strong> is incorrect because the present perfect tense is not suitable for describing completed actions before another past event.</span></li>\n  <li><span style=\"\"><strong>Option 3: \"will raise\"</strong> is incorrect because the future tense does not fit the context of a past event.</span></li>\n</ul>3c:T422,<p>The logic followed here is:</p>\n\n<p><strong>Logic</strong>: (First number)<sup>2</sup> + (Second number)<sup>2</sup> = 3rd number</p>\n\n<p>Given,</p>\n\n<p><span style=\"color: rgb(33, 37, 41);\">For,</span> 3 + 2</p>\n\n<p>⇒ 3<sup>2</sup> + 2<sup>2</sup></p>\n\n<p>⇒ 9 + 4 = 13</p>\n\n<p><span style=\"color: rgb(33, 37, 41);\">For, </span>4 + 3</p>\n\n<p>⇒ 4<sup>2</sup> + 3<sup>2</sup></p>\n\n<p>⇒ 16 + 9 = 25</p>\n\n<p>Similarly, 5 + 4:</p>\n\n<p>⇒ 5<sup>2</sup> + 4<sup>2</sup></p>\n\n<p>⇒ 25 + 16 = 41</p>\n\n<p>Hence, the correct answer is<strong> \"Option 1\".</strong></p>", "marks": 2, "negMarks": 0.5}, {"text": "Select the most appropriate antonym of the given word. <strong>Obdurate</strong>", "options": ["Callous", "Yielding", "Adamant", "Hardened"], "correct": 2, "solution": "<p>The correct answer is: <b>Yielding</b>.</p>\n\n\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p>\n\n\n\n<ul>\n\n    <li>The word <strong>\"Obdurate\"</strong> means stubbornly refusing to change one's opinion or course of action, even in the face of reason or persuasion. (हठी, अडिग)\n\n\n\n    <ul>\n\n        <li><strong>Example: </strong>Despite numerous pleas for mercy, the obdurate judge refused to reduce the sentence.</li>\n\n    </ul>\n\n    </li>\n\n    <li><strong>\"Yielding\"</strong> refers to being inclined to give way to the wishes of others or being flexible and accommodating. (झुकने वाला, लचीला)\n\n    <ul>\n\n        <li><strong>Example: </strong>She was yielding in her approach, always ready to adapt to others' needs.</li>\n\n    </ul>\n\n    </li>\n\n    <li>Hence, we can infer that the opposite of <strong>'Obdurate' </strong>is <strong>'Yielding'</strong>.</li>\n\n</ul>\n\n\n\n<p>Therefore, the correct answer is: <strong>Yielding</strong>.</p>\n\n\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n\n\n<p>Here are the other options explained along with their Hindi meanings and example sentences:</p>\n\n\n\n<ul>\n\n    <li><strong>Callous </strong>(<span style=\"color: rgb(33, 37, 41);\">निर्दयी</span>): Insensitive and cruel disregard for others.\n\n\n\n    <ul>\n\n        <li><strong>Example:</strong> His callous comments about the tragedy upset everyone at the gathering.</li>\n\n    </ul>\n\n    </li>\n\n    <li><strong>Adamant </strong>(<span style=\"color: rgb(33, 37, 41);\">अडिग</span>): Refusing to be persuaded or to change one's mind.\n\n    <ul>\n\n        <li><strong>Example: </strong>She was adamant about finishing the project despite the challenges.</li>\n\n    </ul>\n\n    </li>\n\n    <li><strong>Hardened</strong> (<span style=\"color: rgb(33, 37, 41);\">सख्त</span>): Having become or made hard or unfeeling, especially as a result of experience.\n\n    <ul>\n\n        <li><strong>Example:</strong> Years of hardship had hardened him, making him less empathetic.</li>\n\n    </ul>\n\n    </li>\n\n</ul>35:T9a7,<p>The correct answer is: <b>Cautious</b>.</p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p>\n\n<ul>\n    <li>The word <strong>\"circumspect\"</strong> means being wary and unwilling to take risks; thinking carefully about possible risks before doing or saying something. (सावधान/सोच-समझकर)</li>\n    <ul>\n        <li><strong>Example:</strong> She was circumspect about revealing her personal information to strangers.</li>\n    </ul>\n    <li>The word <strong>\"cautious\"</strong> means being careful to avoid potential problems or dangers. (सतर्क)</li>\n    <ul>\n        <li><strong>Example:</strong> He took a cautious approach to investing his money in the stock market.</li>\n    </ul>\n    <li>Hence, \"circumspect\" and \"cautious\" share similar meanings, making \"cautious\" the most appropriate synonym.</li>\n</ul>\n\n<p>Therefore, the correct answer is: <strong>Cautious</strong>.</p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<p>Here are the other options explained along with their Hindi meanings and example sentences:</p>\n\n<ul>\n    <li><strong>Reckless</strong> (लापरवाह): Acting without thinking or caring about the consequences.\n    <ul>\n        <li><strong>Example:</strong> Driving recklessly in heavy traffic can lead to serious accidents.</li>\n    </ul>\n    </li>\n    <li><strong>Brash</strong> (अत्यधिक आत्मविश्वासी और आक्रामक): Being self-assertive in a rude, noisy, or overconfident way.\n    <ul>\n        <li><strong>Example:</strong> His brash attitude often annoyed his colleagues.</li>\n    </ul>\n    </li>\n    <li><strong>Carefree</strong> (बिना चिंता के): Free from worries or responsibilities.\n    <ul>\n        <li><strong>Example:</strong> During their vacation, they enjoyed a carefree week on the beach. \n<p>⇒ 3<sup>2</sup> + 2<sup>2</sup></p>\n\n<p>⇒ 9 + 4 = 13</p>\n\n<p><span style=\"color: rgb(33, 37, 41);\">For, </span>4 + 3</p>\n\n<p>⇒ 4<sup>2</sup> + 3<sup>2</sup></p>\n\n<p>⇒ 16 + 9 = 25</p>\n\n<p>Similarly, 5 + 4:</p>\n\n<p>⇒ 5<sup>2</sup> + 4<sup>2</sup></p>\n\n<p>⇒ 25 + 16 = 41</p>\n\n<p>Hence, the correct answer is<strong> \"Option 1\".</strong></p>", "marks": 2, "negMarks": 0.5}, {"text": "Choose the correct <strong>one-word substitution</strong> for: 'A place where wild animals are kept'.", "options": ["Aviary", "Sanctuary", "Menagerie", "Park"], "correct": 3, "solution": "<p>The correct answer is: <b>Menagerie</b>.</p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p>\n\n<ul>\n    <li>The word <strong>\"Menagerie\"</strong> refers to a collection of wild animals that are kept in captivity, typically for exhibition. (पशुशाला)</li>\n    <ul>\n        <li><strong>Example:</strong> The children were excited to visit the menagerie to see the exotic animals up close.</li>\n    </ul>\n    <li><strong>\"Menagerie\"</strong> is the correct word for the definition \"A place where wild animals are kept.\" Its Hindi meaning is (पशुशाला).</li>\n    <ul>\n        <li><strong>Example:</strong> The traveling circus included a menagerie of lions, tigers, and other wild animals.</li>\n    </ul>\n</ul>\n\n<p>Therefore, the correct answer is: <strong>Menagerie</strong>.</p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<p>Here are the other options explained along with their Hindi meanings and example sentences:</p>\n\n<ul>\n    <li><strong>Aviary</strong> (<span style=\"color: rgb(33, 37, 41);\">पक्षीशाला</span>): A large cage or enclosure for keeping birds.</li>\n    <ul>\n        <li><strong>Example:</strong> The aviary at the zoo houses a variety of colorful parrots and peacocks.</li>\n    </ul>\n    <li><strong>Sanctuary</strong> (<span style=\"color: rgb(33, 37, 41);\">अभयारण्य</span>): A protected area where animals are kept safe in their natural habitat.</li>\n    <ul>\n        <li><strong>Example:</strong> The wildlife sanctuary is home to numerous endangered species.</li>\n    </ul>\n    <li><strong>Park</strong> (<span style=\"color: rgb(33, 37, 41);\">उद्यान</span>): A public area with greenery, often used for recreational purposes.</li>\n    <ul>\n        <li><strong>Example:</strong> Families gathered at the park for a picnic on the sunny afternoon.</li>\n    </ul>\n</ul>37:Tb0b,<p>The correct answer is: <b>Option 2</b> i.e. Seeking approval through flattery.</p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p>\n\n<ul>\n    <li>The idiom <strong>\"Currying favour\"</strong> means seeking approval or advantage from someone through excessive flattery or trying to please them. (खुशामद करके पक्ष लेना)</li>\n    <ul>\n        <li><strong>Example:</strong> He was currying favour with his boss by always complimenting her ideas.</li>\n    </ul>\n</ul>\n\n<ul>\n    <li><strong>Explanation of the correct option:</strong> \"Seeking approval through flattery\" is the appropriate meaning of the idiom \"currying favour.\" It represents the act of gaining someone’s favor by being overly pleasing or flattering. (खुशामद के माध्यम से स्वीकृति प्राप्त करना)</li>\n    <ul>\n        <li><strong>Example:</strong> The employee tried currying favour with the manager to secure a promotion.</li>\n    </ul>\n</ul>\n\n<p>Therefore, the correct answer is: <strong>Option 2</strong>.</p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<p>Here are the other options explained along with their Hindi meanings and example sentences:</p>\n\n<ul>\n    <li><strong>Option 1: Seeking emotional validation</strong> (भावनात्मक मान्यता प्राप्त करना): The act of wanting confirmation or approval for one’s emotions or feelings.\n    <ul>\n        <li><strong>Example:</strong> She constantly seeks emotional validation from her friends.</li>\n    </ul>\n    </li>\n\n    <li><strong>Option 3: Avoiding direct confrontation</strong> (प्रत्यक्ष टकराव से बचना): Refers to steering clear of any direct conflict or argument.\n    <ul>\n        <li><strong>Example:</strong> Instead of addressing the issue, he avoided direct confrontation with his colleagues.</li>\n    </ul>\n    </li>\n\n    <li><strong>Option 4: Asking for forgiveness subtly</strong> (धीरे-धीरे माफी मांगना): Refers to apologizing in an indirect or subtle way.\n    <ul>\n        <li><strong>Example:</strong> She asked for forgiveness subtly by leaving a heartfelt note on his desk.</li>\n    </ul>\n    </li>\n</ul>38:T655,\n<p>The correct answer is <strong>option 1.</strong></p>\n\n<p><span style=\"display: flex; gap: 6px; align-items: center;\">\n  <img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" />\n  <strong><span style=\"vertical-align: middle; font-size: 21px;\"><u>Key Points</u></span></strong>\n</span></p>\n\n<p><strong>The misspelled word is 'Pithey', 'Pithhy', and 'Pithie'.</strong></p>\n\n<ul>\n    <li><strong>The correct spelling is 'Pithy'.</strong></li>\n    <li>The word '<strong>pithy</strong>' is an <strong>adjective</strong> meaning 'concise and forcefully expressive' <strong>(संक्षिप्त और प्रभावशाली)</strong>.</li>\n    <li><strong>For Example -</strong> She gave a pithy reply that ended the discussion.</li>\n</ul>\n\n<p>Therefore, the correct spelling is <strong>'Pithy'.</strong></p>\n\n<p><span style=\"display: flex; gap: 6px; align-items: center;\">\n  <img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" />\n  <strong><span style=\"vertical-align: middle; font-size: 21px;\"><u>Additional Information</u></span></strong>\n</span></p>\n\n<p><strong>Let's understand the meanings of the other options:</strong></p>\n\n<ul>\n    <li><strong>Pithey -</strong> Incorrect spelling of 'Pithy'.</li>\n    <li><strong>Pithhy -</strong> Incorrect spelling of 'Pithy'.</li>\n    <li><strong>Pithie -</strong> Incorrect spelling of 'Pithy'.</li>\n</ul>39:T9f3,<p>The correct answer is: <b>Option 4</b> i.e. <b>Mortuary</b>.</p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p>\n\n<ul>\n    <li>The word <strong>\"Mortuary\"</strong> refers to a building or room where dead bodies are kept temporarily, especially before burial or cremation. (शवगृह)\n        <ul>\n            <li><strong>Example: </strong>The mortuary at the hospital is well-maintained and ensures dignity for the deceased.</li>\n        </ul>\n    </li>\n    <li><strong>\"Crematorium\"</strong> refers to a place where dead bodies are cremated or burned to ashes. (श्मशान)\n        <ul>\n            <li><strong>Example: </strong>The crematorium was located on the outskirts of the city to maintain privacy for the grieving families.</li>\n        </ul>\n    </li>\n    <li>Hence, the correct answer is <strong>\"Mortuary\"</strong>, as it specifically refers to a temporary place for keeping dead bodies before final rites.</li>\n</ul>\n\n<p>Therefore, the correct answer is: <strong>Option 4 i.e. Mortuary</strong>.</p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<p>Here are the other options explained along with their Hindi meanings and example sentences:</p>\n\n<ul>\n    <li><strong>Sanctuary</strong> (शरणस्थल): A safe place or a place of refuge, often used for wildlife or religious purposes.\n        <ul>\n            <li><strong>Example: </strong>The sanctuary provides a safe haven for endangered species.</li>\n        </ul>\n    </li>\n    <li><strong>Sepulcher</strong> (मकबरा): A small room or monument, often made of stone, where a dead person is buried.\n        <ul>\n            <li><strong>Example: </strong>The ancient sepulcher was decorated with intricate carvings.</li>\n        </ul>\n    </li>\n    <li><strong>Crematorium</strong> (श्मशान): A facility where dead bodies are reduced to ashes by burning.\n        <ul>\n            <li><strong>Example: </strong>We visited the crematorium to pay our last respects.</li>\n        </ul>\n    </li>\n</ul>3a:T9dc,<div><span style=\"\">The correct answer is '</span><span style=\"color: rgb(33, 37, 41);\"><strong>is</strong>'</span><span style=\"\">.</span></div> \n<div> </div> \n<div><span style=\"\"><span style=\"display: flex; gap: 6px; align-item           <li><strong>Example: </strong>The mortuary at the hospital is well-maintained and ensures dignity for the deceased.</li>\n        </ul>\n    </li>\n    <li><strong>\"Crematorium\"</strong> refers to a place where dead bodies are cremated or burned to ashes. (श्मशान)\n        <ul>\n            <li><strong>Example: </strong>The crematorium was located on the outskirts of the city to maintain privacy for the grieving families.</li>\n        </ul>\n    </li>\n    <li>Hence, the correct answer is <strong>\"Mortuary\"</strong>, as it specifically refers to a temporary place for keeping dead bodies before final rites.</li>\n</ul>\n\n<p>Therefore, the correct answer is: <strong>Option 4 i.e. Mortuary</strong>.</p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<p>Here are the other options explained along with their Hindi meanings and example sentences:</p>\n\n<ul>\n    <li><strong>Sanctuary</strong> (शरणस्थल): A safe place or a place of refuge, often used for wildlife or religious purposes.\n        <ul>\n            <li><strong>Example: </strong>The sanctuary provides a safe haven for endangered species.</li>\n        </ul>\n    </li>\n    <li><strong>Sepulcher</strong> (मकबरा): A small room or monument, often made of stone, where a dead person is buried.\n        <ul>\n            <li><strong>Example: </strong>The ancient sepulcher was decorated with intricate carvings.</li>\n        </ul>\n    </li>\n    <li><strong>Crematorium</strong> (श्मशान): A facility where dead bodies are reduced to ashes by burning.\n        <ul>\n            <li><strong>Example: </strong>We visited the crematorium to pay our last respects.</li>\n        </ul>\n    </li>\n</ul>3a:T9dc,<div><span style=\"\">The correct answer is '</span><span style=\"color: rgb(33, 37, 41);\"><strong>is</strong>'</span><span style=\"\">.</span></div> \n<div> </div> \n<div><span style=\"\"><span style=\"display: flex; gap: 6px; align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle; font-size: 21px;\"><u>Key Points</u></span></strong></span></span></div> \n<ul> \n<li><span style=\"\">The subject of the sentence is \"<strong>The committee</strong>,\" which is a collective noun that is generally treated as singular in American English.</span></li> \n<li><span style=\"\">The phrase \"<strong>along with its chairperson</strong>\" is a modifier and does not affect the singularity of the subject.</span></li> \n<li><span style=\"\"><strong>Option 1 (are)</strong> is incorrect because it is plural, but the subject is singular.</span></li> \n<li><span style=\"\"><strong>Option 3 (were)</strong> is incorrect because it indicates past tense, while the sentence is in the present tense.</span></li> \n<li><span style=\"\"><strong>Option 4 (have been)</strong> is incorrect because it is in the present perfect tense and does not agree with the singular subject.</span></li> \n</ul> \n<div><span style=\"\">Therefore, the correct answer is <strong>Option 2</strong>.</span></div> \n<div> </div> \n<div><span style=\"\"><strong>Complete Sentence:</strong> <em>\"The committee, along with its chairperson, <u><strong>is</strong></u> scheduled to meet on Monday.\"</em></span></div> \n<div> </div> \n<div><span style=\"\"><span style=\"display: flex; gap: 6px; align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle; font-size: 21px;\"><u>Additional Information</u></span></strong></span></span></div> \n<ul> \n<li><span style=\"\"><strong>Option 1: \"are\"</strong> is incorrect because the subject \"The committee\" is singular and requires a singular verb.</span></li> \n<li><span style=\"\"><strong>Option 3: \"were\"</strong> is incorrect because the sentence is in the present tense, not past tense.</span></li> \n<li><span style=\"\"><strong>Option 4: \"have been\"</strong> is incorrect because it does not align with the singular subject and the sentence structure.</span></li> \n</ul> 3b:T8f0,\n<div><span style=\"\">The correct answer is '</span><span style=\"color: rgb(33, 37, 41);\"><strong>had raised</strong>'</span><span style=\"\">.</span></div>\n<div> </div>\n<div><span style=\"\"><span style=\"display: flex; gap: 6px; align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle; font-size: 21px;\"><u>Key Points</u></span></strong></span></span></div>\n<ul>\n  <li><span style=\"\">The phrase \"<strong>had raised</strong>\" is in the past perfect tense, which is used to describe an action that was completed before another action in the past.</span></li>\n  <li><span style=\"\">The sentence indicates that the objections were completed before the committee convened, which makes the past perfect tense appropriate.</span></li>\n  <li><span style=\"\"><strong>Options 1, 2, and 3</strong> are incorrect because they do not fit the context of the sentence.</span></li>\n</ul>\n<div><span style=\"\">Therefore, the correct answer is <strong>Option 4</strong>.</span></div>\n<div> </div>\n<div><span style=\"\"><strong>Complete Sentence:</strong> <em>\"They <u><strong>had raised</strong></u> their objections by the time the committee convened.\"</em></span></div>\n<div> </div>\n<div><span style=\"\"><span style=\"display: flex; gap: 6px; align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle; font-size: 21px;\"><u>Additional Information</u></span></strong></span></span></div>\n<ul>\n  <li><span style=\"\"><strong>Option 1: \"raised\"</strong> is incorrect because it is in the simple past tense and does not convey the idea of an action completed before another action.</span></li>\n  <li><span style=\"\"><strong>Option 2: \"have raised\"</strong> is incorrect because the present perfect tense is not suitable for describing completed actions before another past event.</span></li>\n  <li><span style=\"\"><strong>Option 3: \"will raise\"</strong> is incorrect because the future tense does not fit the context of a past event.</span></li>\n</ul>3c:T422,<p>The logic followed here is:</p>\n\n<p><strong>Logic</strong>: (First number)<sup>2</sup> + (Second number)<sup>2</sup> = 3rd number</p>\n\n<p>Given,</p>\n\n<p><span style=\"color: rgb(33, 37, 41);\">For,</span> 3 + 2</p>\n\n<p>⇒ 3<sup>2</sup> + 2<sup>2</sup></p>\n\n<p>⇒ 9 + 4 = 13</p>\n\n<p><span style=\"color: rgb(33, 37, 41);\">For, </span>4 + 3</p>\n\n<p>⇒ 4<sup>2</sup> + 3<sup>2</sup></p>\n\n<p>⇒ 16 + 9 = 25</p>\n\n<p>Similarly, 5 + 4:</p>\n\n<p>⇒ 5<sup>2</sup> + 4<sup>2</sup></p>\n\n<p>⇒ 25 + 16 = 41</p>\n\n<p>Hence, the correct answer is<strong> \"Option 1\".</strong></p>", "marks": 2, "negMarks": 0.5}, {"text": "According to the passage, how do constraints impact creativity?", "options": ["They invariably limit original thinking.", "They catalyze creativity by challenging conventional problem-solving.", "They make creative thinking predictable and repetitive.", "They increase reliance on external sources."], "correct": 2, "solution": "<div><span style=\"\">The correct answer is '<strong>Option 2</strong>'.</span></div>\n\n<div> </div>\n\n<div><span style=\"\"><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /> <strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong> </span></span></div>\n\n<ul>\n\\t<li><strong><em><span style=\"\">A) They invariably limit original thinking.</span></em></strong>\n\n\\t<ul>\n\\t\\t<li><span style=\"\">This is <strong>not correct</strong>. The passage states that constraints do not simply limit creativity; instead, they often enhance it.</span></li>\n\\t</ul>\n\\t</li>\n\\t<li><strong><em><span style=\"\">B) They catalyze creativity by challenging conventional problem-solving.</span></em></strong>\n\\t<ul>\n\\t\\t<li><span style=\"\">This is <strong>true</strong>. The passage explains that innovation often emerges because of constraints, as they force the mind to move beyond linear thinking into associative reasoning and abstraction.</span></li>\n\\t</ul>\n\\t</li>\n\\t<li><strong><em><span style=\"\">C) They make creative thinking predictable and repetitive.</span></em></strong>\n\\t<ul>\n\\t\\t<li><span style=\"\">This is <strong>not correct</strong>. Constraints encourage divergent thinking rather than predictability.</span></li>\n\\t</ul>\n\\t</li>\n\\t<li><strong><em><span style=\"\">D) They increase reliance on external sources.</span></em></strong>\n\\t<ul>\n\\t\\t<li><span style=\"\">This is <strong>not correct</strong>. The passage does not mention reliance on external sources as an effect of constraints.</span></li>\n\\t</ul>\n\\t</li>\n</ul>\n\n<div>Therefore, the correct answer is <strong><span style=\"\">Option 2 (They catalyze creativity by challenging conventional problem-solving).</span></strong></div>\n\n<div> </div>\n\n<div><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /> <strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong> </span></div>\n\n<ul>\n\\t<li><span style=\"\"><strong>Option 1</strong>: Incorrect because constraints do not invariably limit creativity.</span></li>\n\\t<li><span style=\"\"><strong>Option 2</strong>: Correct because constraints often catalyze creativity by forcing new approaches.</span></li>\n\\t<li><span style=\"\"><strong>Option 3</strong>: Incorrect because constraints encourage novelty, not repetition.</span></li>\n\\t<li><span style=\"\"><strong>Option 4</strong>: Incorrect because reliance on external sources is not mentioned in the passage.</span></li>\n</ul>", "marks": 2, "negMarks": 0.5}, {"text": "What does the passage suggest about standardized education's effect on creativity?", "options": ["It fosters risk-taking by giving structured guidance.", "It creates an ideal environment for innovative thinking.", "It impedes creative growth through rigid, memory-based methods.", "It enhances problem-solving by reinforcing tested frameworks."], "correct": 3, "solution": "<div><span style=\"\">The correct answer is '<strong>Option 3</strong>'.</span></div>\n\n<div> </div>\n\n<div><span style=\"\"><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /> <strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong> </span></span></div>\n\n<ul>\n\\t<li><strong><em><span style=\"\">A) It fosters risk-taking by giving structured guidance.</span></em></strong>\n\n\\t<ul>\n\\t\\t<li><span style=\"\">This is <strong>not correct</strong>. The passage states that standardized education discourages risk-taking rather than fostering it.</span></li>\n\\t</ul>\n\\t</li>\n\\t<li><strong><em><span style=\"\">B) It creates an ideal environment for innovative thinking.</span></em></strong>\n\\t<ul>\n\\t\\t<li><span style=\"\">This is <strong>not correct</strong>. The passage criticizes traditional models for creating cognitive rigidity, which hinders innovation.</span></li>\n\\t</ul>\n\\t</li>\n\\t<li><strong><em><span style=\"\">C) It impedes creative growth through rigid, memory-based methods.</span></em></strong>\n\\t<ul>\n\\t\\t<li><span style=\"\">This is <strong>true</strong>. The passage explicitly mentions that rote memorization and standardized testing discourage risk-taking and divergent thinking, thereby impeding creativity.</span></li>\n\\t</ul>\n\\t</li>\n\\t<li><strong><em><span style=\"\">D) It enhances problem-solving by reinforcing tested frameworks.</span></em></strong>\n\\t<ul>\n\\t\\t<li><span style=\"\">This is <strong>not correct</strong>. The passage suggests that standardized education limits problem-solving by reinforcing rigidity rather than encouraging creative exploration.</span></li>\n\\t</ul>\n\\t</li>\n</ul>\n\n<div>Therefore, the correct answer is <strong><span style=\"\">Option 3 (It impedes creative growth through rigid, memory-based methods).</span></strong></div>\n\n<div> </div>\n\n<div><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /> <strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong> </span></div>\n\n<ul>\n\\t<li><span style=\"\"><strong>Option 1</strong>: Incorrect because standardized education discourages risk-taking.</span></li>\n\\t<li><span style=\"\"><strong>Option 2</strong>: Incorrect because it does not create an ideal environment for innovation.</span></li>\n\\t<li><span style=\"\"><strong>Option 3</strong>: Correct because rote memorization and rigid methods hinder creativity.</span></li>\n\\t<li><span style=\"\"><strong>Option 4</strong>: Incorrect because reinforcing tested frameworks limits divergent thinking.</span></li>\n</ul>", "marks": 2, "negMarks": 0.5}, {"text": "The phrase \"emotional ecology\" in the context of creativity most likely refers to:", "options": ["The neurochemical balance in artistic individuals.", "The environment of emotional cues influencing creative potential.", "A set of standardized emotional responses to failure.", "The artistic expression of environmental issues."], "correct": 2, "solution": "<div><span style=\"\">The correct answer is '<strong>Option 2</strong>'.</span></div>\n\n<div> </div>\n\n<div><span style=\"\"><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /> <strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong> </span></span></div>\n\n<ul>\n\\t<li><strong><em><span style=\"\">A) The neurochemical balance in artistic individuals.</span></em></strong>\n\n\\t<ul>\n\\t\\t<li><span style=\"\">This is <strong>not correct</strong>. The passage does not discuss neurochemistry in relation to creativity.</span></li>\n\\t</ul>\n\\t</li>\n\\t<li><strong><em><span style=\"\">B) The environment of emotional cues influencing creative potential.</span></em></strong>\n\\t<ul>\n\\t\\t<li><span style=\"\">This is <strong>true</strong>. The passage explains that “emotional ecology” refers to the supportive emotional environment where failure is reframed as experimentation, empowering individuals to take imaginative leaps.</span></li>\n\\t</ul>\n\\t</li>\n\\t<li><strong><em><span style=\"\">C) A set of standardized emotional responses to failure.</span></em></strong>\n\\t<ul>\n\\t\\t<li><span style=\"\">This is <strong>not correct</strong>. The passage emphasizes reframing failure, not standardizing emotional responses.</span></li>\n\\t</ul>\n\\t</li>\n\\t<li><strong><em><span style=\"\">D) The artistic expression of environmental issues.</span></em></strong>\n\\t<ul>\n\\t\\t<li><span style=\"\">This is <strong>not correct</strong>. The phrase “emotional ecology” is metaphorical here, not about environmental art.</span></li>\n\\t</ul>\n\\t</li>\n</ul>\n\n<div>Therefore, the correct answer is <strong><span style=\"\">Option 2 (The environment of emotional cues influencing creative potential).</span></strong></div>\n\n<div> </div>\n\n<div><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /> <strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong> </span></div>\n\n<ul>\n\\t<li><span style=\"\"><strong>Option 1</strong>: Incorrect because neurochemical balance is not mentioned in the passage.</span></li>\n\\t<li><span style=\"\"><strong>Option 2</strong>: Correct because emotional ecology refers to the supportive emotional environment that nurtures creativity.</span></li>\n\\t<li><span style=\"\"><strong>Option 3</strong>: Incorrect because the passage emphasizes reframing failure, not standardizing emotions.</span></li>\n\\t<li><span style=\"\"><strong>Option 4</strong>: Incorrect because the term does not relate to environmental issues or artistic expression of them.</span></li>\n</ul>", "marks": 2, "negMarks": 0.5}, {"text": "What is the closest synonym for \"ossified\" as used in the line \"...about unlearning ossified habits...\"?", "options": ["Flexible", "Rigid", "Synthetic", "Tangential"], "correct": 2, "solution": "<p>The correct answer is: <b>Option 2</b> i.e. <b>Rigid</b>.</p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p>\n\n<ul>\n\\t<li>The word <strong>\"ossified\"</strong> means something that has become rigid or fixed in attitude or behavior; it is derived from the process of turning into bone or becoming hardened. (स्थिर)\n\n\\t<ul>\n\\t\\t<li><strong>Example: </strong>Many companies have ossified cultures that make significant changes difficult.</li>\n\\t</ul>\n\\t</li>\n\\t<li><strong>\"Rigid\"</strong> refers to something that is inflexible, strict, or unable to bend. It can be used to describe both physical objects and abstract concepts like rules or behaviors. (कठोर)\n\\t<ul>\n\\t\\t<li><strong>Example: </strong>The teacher's rigid rules made the classroom environment very strict.</li>\n\\t</ul>\n\\t</li>\n\\t<li>Hence, we can infer that the closest synonym for <strong>'ossified'</strong> is <strong>'rigid'</strong>.</li>\n</ul>\n\n<p>Therefore, the correct answer is: <strong>Rigid</strong>.</p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<p>Here are the other options explained along with their Hindi meanings and example sentences:</p>\n\n<ul>\n\\t<li><strong>Flexible </strong>(<span style=\"color: rgb(33, 37, 41);\">लचीला</span>): Capable of bending easily without breaking; adaptable to new, different, or changing requirements.\n\n\\t<ul>\n\\t\\t<li><strong>Example:</strong> Her schedule is quite flexible, allowing her to accommodate last-minute changes.</li>\n\\t</ul>\n\\t</li>\n\\t<li><strong>Synthetic </strong>(<span style=\"color: rgb(33, 37, 41);\">कृत्रिम</span>): Made by chemical synthesis, especially to imitate a natural product.\n\\t<ul>\n\\t\\t<li><strong>Example: </strong>The jacket is made from synthetic materials that keep you warm.</li>\n\\t</ul>\n\\t</li>\n\\t<li><strong>Tangential</strong> (<span style=\"color: rgb(33, 37, 41);\">स्पर्शरेखीय</span>): Relating to or along a tangent; diverging from a previous course or line; hardly touching a matter.\n\\t<ul>\n\\t\\t<li><strong>Example:</strong> His comments during the meeting were tangential and did not address the main issue.</li>\n\\t</ul>\n\\t</li>\n</ul>", "marks": 2, "negMarks": 0.5}];const ANALYSIS={"rank": 2104, "percentile": 6.657789613848197, "avgMarks": 108.78850421660002, "totalStudents": 2253};</script>

.options{margin-left:4px}.option{display:flex;align-items:flex-start;padding:12px 16px;margin-bottom:8px;border-radius:10px;border:2px solid #e5e7eb;cursor:pointer;transition:all .15s}.option:hover{border-color:#c7d2fe;background:#f0f4ff}.option.selected{border-color:#4338ca;background:#eef2ff}.option.correct{border-color:#10b981;background:#d1fae5}.option.wrong{border-color:#ef4444;background:#fee2e2}.option-letter{font-weight:700;margin-right:12px;min-width:20px}.option.correct .option-letter{color:#059669}.option.wrong .option-letter{color:#dc2626}.option.selected .option-letter{color:#4338ca}.option-text{flex:1;font-size:14px}.option-text img{max-width:100%;border-radius:4px}.option-check{margin-left:auto;font-size:20px}.option.correct .option-check{color:#10b981}
.solution{margin-top:16px;padding:16px;background:#f0f9ff;border-radius:10px;border-left:4px solid #0ea5e9;display:none}.solution.visible{display:block}.solution-header{display:flex;align-items:center;gap:8px;margin-bottom:12px}.solution-icon{background:#0ea5e9;color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px}.solution-title{font-weight:700;color:#0ea5e9;font-size:14px}.solution-content{font-size:14px;color:#1e3a5f;line-height:1.8}.solution-content p{margin-bottom:8px}.solution-content img{max-width:100%;border-radius:8px;margin:8px 0;display:block}
.palette{position:fixed;right:20px;top:80px;background:#fff;border-radius:12px;padding:12px;box-shadow:0 4px 12px rgba(0,0,0,.1);z-index:50;max-width:200px}.palette-title{font-size:12px;color:#6b7280;margin-bottom:8px;text-transform:uppercase;font-weight:600}.palette-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}.palette-item{width:24px;height:24px;border-radius:6px;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;border:1px solid #d1d5db}.palette-item.answered{background:#10b981;color:#fff;border-color:#059669}
@media(max-width:768px){.palette{display:none}.analysis-grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<div class="navbar"><div class="logo">RepeaterMock</div><div class="nav-actions"><div class="timer" id="timer">⏱ 60:00</div><button class="submit-btn" id="submitBtn" onclick="submitTest()">Submit Test</button><button class="view-solutions" id="vsBtn" onclick="toggleSolutions()" style="display:none;">📖 Hide Solutions</button></div></div>
<div class="container"><div class="test-header"><h1>SSC CGL 2025 (Held On: 19 Sept, 2025 Shift 2)</h1><div style="font-size:14px;color:#6b7280"><span class="badge">📋 14 Q</span><span class="badge">⏱ 60 min</span><span class="badge">✅ Guest</span><span class="badge">💡 14 Sol</span></div></div>
<div class="score-banner" id="scoreBanner"><div class="score" id="scoreValue">0/14</div><div class="score-label" id="scoreLabel">Score</div></div>
<div class="analysis-card" id="analysisCard"><h2>📈 Analysis</h2><div class="analysis-grid" id="analysisGrid"></div></div>
<div id="questions"></div></div>
<div class="palette"><div class="palette-title">Palette</div><div class="palette-grid" id="palette"></div></div>
<script>
var totalQ=QUESTIONS.length,userAnswers={},submitted=false,timeLeft=3600,solsVisible=true;
var qC=document.getElementById('questions');
QUESTIONS.forEach(function(q,i){var o='';q.options.forEach(function(opt,oi){o+='<div class="option" data-option="'+(oi+1)+'" onclick="selectOption('+i+','+(oi+1)+')"><div class="option-letter">'+String.fromCharCode(65+oi)+'</div><div class="option-text">'+opt+'</div><div class="option-check"></div></div>'});var s='';if(q.solution&&q.solution.length>5){s='<div class="solution" id="sol'+i+'"><div class="solution-header"><div class="solution-icon">💡</div><div class="solution-title">Solution</div></div><div class="solution-content">'+q.solution+'</div></div>'}qC.innerHTML+='<div class="question-card" id="q'+i+'" data-correct="'+q.correct+'"><div class="q-header"><div class="q-number">Q'+(i+1)+'</div><div class="q-marks"><span class="pos">+'+q.marks+'</span> <span class="neg">-'+q.negMarks+'</span></div></div><div class="q-body"><div class="q-text">'+q.text+'</div><div class="options">'+o+'</div>'+s+'</div></div>'});
var pal=document.getElementById('palette');for(var i=0;i<totalQ;i++){var d=document.createElement('div');d.className='palette-item';d.id='p'+i;d.textContent=i+1;d.onclick=function(){document.getElementById('q'+this.id.slice(1)).scrollIntoView({behavior:'smooth'})};pal.appendChild(d)}
var tI=setInterval(function(){if(submitted){clearInterval(tI);return}timeLeft--;document.getElementById('timer').textContent='⏱ '+Math.floor(timeLeft/60)+':'+(timeLeft%60).toString().padStart(2,'0');if(timeLeft<=0){clearInterval(tI);submitTest()}},1000);
function selectOption(q,o){if(submitted)return;var c=document.getElementById('q'+q);c.querySelectorAll('.option').forEach(function(x){x.classList.remove('selected')});c.querySelector('.option[data-option="'+o+'"]').classList.add('selected');userAnswers[q]=o;document.getElementById('p'+q).classList.add('answered');document.getElementById('submitBtn').classList.add('visible')}
function submitTest(){if(submitted)return;submitted=true;clearInterval(tI);var sc=0,co=0,at=0;for(var i=0;i<totalQ;i++){var q=document.getElementById('q'+i),c=parseInt(q.dataset.correct),u=userAnswers[i];q.querySelectorAll('.option').forEach(function(o){var n=parseInt(o.dataset.option);o.onclick=null;if(n===c){o.classList.add('correct');o.querySelector('.option-check').textContent='✓'}else if(n===u){o.classList.add('wrong');o.querySelector('.option-check').textContent='✗'}});if(u){at++;if(u===c){sc+=2;co++}else{sc-=0.5}}var s=document.getElementById('sol'+i);if(s)s.classList.add('visible')}document.getElementById('scoreValue').textContent=co+'/'+totalQ;document.getElementById('scoreLabel').textContent='Score: '+sc+' | Correct: '+co+' | Wrong: '+(at-co);document.getElementById('scoreBanner').classList.add('visible');if(ANALYSIS&&ANALYSIS.rank){document.getElementById('analysisGrid').innerHTML='<div class="stat"><div class="value rank">'+ANALYSIS.rank+'</div><div class="label">Rank</div></div><div class="stat"><div class="value pct">'+(ANALYSIS.percentile?ANALYSIS.percentile.toFixed(2)+'%':'N/A')+'</div><div class="label">Percentile</div></div><div class="stat"><div class="value avg">'+(ANALYSIS.avgMarks?ANALYSIS.avgMarks.toFixed(2):'N/A')+'</div><div class="label">Avg</div></div><div class="stat"><div class="value total">'+(ANALYSIS.totalStudents||'N/A')+'</div><div class="label">Students</div></div>';document.getElementById('analysisCard').classList.add('visible')}document.getElementById('submitBtn').style.display='none';document.getElementById('vsBtn').style.display='inline-block';if(window.MathJax&&window.MathJax.typesetPromise)window.MathJax.typesetPromise();document.getElementById('scoreBanner').scrollIntoView({behavior:'smooth'})}
function toggleSolutions(){solsVisible=!solsVisible;document.querySelectorAll('.solution').forEach(function(s){if(solsVisible)s.classList.add('visible');else s.classList.remove('visible')});document.getElementById('vsBtn').textContent=solsVisible?'📖 Hide Solutions':'📖 Show Solutions'}
setTimeout(function(){if(window.MathJax&&window.MathJax.typesetPromise)window.MathJax.typesetPromise()},2000);
</script></body></html>
