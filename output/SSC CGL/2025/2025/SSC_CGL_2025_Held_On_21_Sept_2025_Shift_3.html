=\"font-size: 21px; font-weight: 700; display: inline !important;\">Shortcut Trick</u></span></p>\n\n<p>For any polygon with n sides, the sum of its interior angles is simply calculated as (n − 2) × 180°.</p>\n\n<p>Here, the polygon has 20 sides, so n = 20.</p>\n\n<p>⇒ Sum = (20 − 2) × 180° = 18 × 180° = 3240°.</p>\n\n<p><strong>∴ The correct answer is 3240°.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Alternate Method</u></span></strong></span></p>\n\n<p><strong>Given:</strong></p>\n\n<p>Number of sides of the polygon, n = 20</p>\n\n<p><strong>Formula Used:</strong></p>\n\n<p>Sum of all interior angles of an n-sided polygon = (n − 2) × 180°</p>\n<svg height=\"200\" style=\"display:block;margin:12px 0;background:#ffffff;border-radius:10px;border:1px solid #cccccc;\" viewbox=\"0 0 420 200\" width=\"420\" xmlns=\"http://www.w3.org/2000/svg\"> <polygon fill=\"#ddeeff\" points=\"110,40 170,40 200,90 170,140 110,140 80,90\" stroke=\"#2255cc\" stroke-width=\"2\"></polygon> <circle cx=\"140\" cy=\"90\" fill=\"#cc5500\" r=\"3\"></circle> <line stroke=\"#888888\" stroke-dasharray=\"5,3\" stroke-width=\"1.5\" x1=\"80\" x2=\"170\" y1=\"90\" y2=\"40\"></line> <line stroke=\"#888888\" stroke-dasharray=\"5,3\" stroke-width=\"1.5\" x1=\"80\" x2=\"200\" y1=\"90\" y2=\"90\"></line> <line stroke=\"#888888\" stroke-dasharray=\"5,3\" stroke-width=\"1.5\" x1=\"80\" x2=\"170\" y1=\"90\" y2=\"140\"></line> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"13\" text-anchor=\"middle\" x=\"140\" y=\"165\">Generic Polygon</text> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"13\" text-anchor=\"middle\" x=\"140\" y=\"180\">(Triangles = n − 2)</text> <rect fill=\"#fff0cc\" height=\"110\" rx=\"6\" stroke=\"#cc5500\" stroke-width=\"1.5\" width=\"170\" x=\"230\" y=\"45\"></rect> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\" x=\"315\" y=\"75\">Sum of Interior Angles</text> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"bold\" text-anchor=\"middle\" x=\"315\" y=\"105\">= (n − 2) × 180°</text> <text fill=\"#cc5500\" font-family=\"sans-serif\" font-size=\"14\" text-anchor=\"middle\" x=\"315\" y=\"135\">For 20-sided: n = 20</text> </svg>\n\n<p><strong>Calculations:</strong></p>\n\n<p>⇒ Sum of interior angles = (20 − 2) × 180°</p>\n\n<p>⇒ Sum of interior angles = 18 × 180°</p>\n\n<p>⇒ Sum of interior angles = 3240°</p>\n\n<p><strong>∴ The correct answer is 3240°.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Sum of Exterior Angles</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">The sum of all exterior angles of any convex polygon is always exactly 360°, regardless of how many sides the polygon has.</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Each Interior Angle</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">If the polygon is regular (all sides and angles are equal), each interior angle can be found by dividing the total sum by n: [(n − 2) × 180°] ÷ n.</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Number of Diagonals</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">The total number of diagonals that can be drawn in an n-sided polygon is given by the direct formula: n × (n − 3) ÷ 2.</p>\n\n<p> </p>", "marks": 2, "negMarks": 0.5}, {"text": "Point P is at an equal distance from the three vertices of a triangle with coordinates A(0, 0), B(4, 0), and C(0, 3). What are the coordinates of point P?", "options": ["(2, 1.5)", "(2, 2)", "(1.5, 2)", "(2.5, 2.5)"], "correct": 1, "solution": "<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png\" width=\"26px\" /> <u style=\"font-size: 21px; font-weight: 700; display: inline !important;\">Shortcut Trick</u></span></p>\n\n<p>The given points A(0, 0), B(4, 0), and C(0, 3) lie on the axes, forming a right-angled triangle with the right angle at the origin A(0, 0).</p>\n\n<p>A point equidistant from all three vertices of a triangle is known as its circumcenter.</p>\n\n<p>For any right-angled triangle, the circumcenter always lies exactly at the midpoint of its hypotenuse.</p>\n\n<p>The hypotenuse connects the points B(4, 0) and C(0, 3).</p>\n\n<p>Coordinates of P = ((4 + 0) ÷ 2, (0 + 3) ÷ 2) = (2, 1.5).</p>\n\n<p><strong>∴ The correct answer is (2, 1.5).</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Alternate Method</u></span></strong></span></p>\n\n<p><strong>Given:</strong></p>\n\n<p>Vertices of the triangle are A(0, 0), B(4, 0), and C(0, 3).</p>\n\n<p>Let the coordinates of point P be (x, y).</p>\n\n<p>Point P is equidistant from all three vertices, meaning PA = PB = PC.</p>\n\n<p><strong>Formula Used:</strong></p>\n\n<p>Distance formula d = √((x<sub>2</sub> − x<sub>1</sub>)<sup>2</sup> + (y<sub>2</sub> − y<sub>1</sub>)<sup>2</sup>)</p>\n<svg height=\"240\" style=\"display:block;margin:12px 0;background:#ffffff;border-radius:10px;border:1px solid #cccccc;\" viewbox=\"0 0 420 240\" width=\"420\" xmlns=\"http://www.w3.org/2000/svg\"> <line stroke=\"#888888\" stroke-dasharray=\"5,3\" x1=\"80\" x2=\"320\" y1=\"180\" y2=\"180\"></line> <line stroke=\"#888888\" stroke-dasharray=\"5,3\" x1=\"100\" x2=\"100\" y1=\"220\" y2=\"20\"></line> <polygon fill=\"#ddeeff\" points=\"100,180 260,180 100,60\" stroke=\"#2255cc\" stroke-width=\"2\"></polygon> <polyline fill=\"none\" points=\"100,165 115,165 115,180\" stroke=\"#2255cc\" stroke-width=\"1.5\"></polyline> <circle cx=\"180\" cy=\"120\" fill=\"none\" r=\"100\" stroke=\"#cc5500\" stroke-dasharray=\"5,3\" stroke-width=\"1.5\"></circle> <line stroke=\"#007700\" stroke-dasharray=\"4,2\" stroke-width=\"1.5\" x1=\"180\" x2=\"100\" y1=\"120\" y2=\"180\"></line> <line stroke=\"#007700\" stroke-dasharray=\"4,2\" stroke-width=\"1.5\" x1=\"180\" x2=\"260\" y1=\"120\" y2=\"180\"></line> <line stroke=\"#007700\" stroke-dasharray=\"4,2\" stroke-width=\"1.5\" x1=\"180\" x2=\"100\" y1=\"120\" y2=\"60\"></line> <circle cx=\"100\" cy=\"180\" fill=\"#cc5500\" r=\"4\"></circle> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"13\" x=\"50\" y=\"195\">A(0, 0)</text> <circle cx=\"260\" cy=\"180\" fill=\"#cc5500\" r=\"4\"></circle> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"13\" x=\"265\" y=\"195\">B(4, 0)</text> <circle cx=\"100\" cy=\"60\" fill=\"#cc5500\" r=\"4\"></circle> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"13\" x=\"45\" y=\"55\">C(0, 3)</text> <circle cx=\"180\" cy=\"120\" fill=\"#cc5500\" r=\"4\"></circle> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"bold\" x=\"190\" y=\"115\">P(2, 1.5)</text> </svg>\n\n<p><strong>Calculation:</strong></p>\n\n<p>⇒ Equating PA<sup>2</sup> = PB<sup>2</sup></p>\n\n<p>⇒ (x − 0)<sup>2</sup> + (y − 0)<sup>2</sup> = (x − 4)<sup>2</sup> + (y − 0)<sup>2</sup></p>\n\n<p>⇒ x<sup>2</sup> + y<sup>2</sup> = x<sup>2</sup> − 8x + 16 + y<sup>2</sup></p>\n\n<p>⇒ 8x = 16</p>\n\n<p>⇒ x = 2</p>\n\n<p>⇒ Similarly, evaluating PA<sup>2</sup> = PC<sup>2</sup></p>\n\n<p>⇒ (x − 0)<sup>2</sup> + (y − 0)<sup>2</sup> = (x − 0)<sup>2</sup> + (y − 3)<sup>2</sup></p>\n\n<p>⇒ x<sup>2</sup> + y<sup>2</sup> = x<sup>2</sup> + y<sup>2</sup> − 6y + 9</p>\n\n<p>⇒ 6y = 9</p>\n\n<p>⇒ y = 1.5</p>\n\n<p>⇒ The coordinates of point P are (2, 1.5).</p>\n\n<p><strong>∴ The correct answer is (2, 1.5).</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Circumcenter of a Right-Angled Triangle</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">In any right-angled triangle, the circumcenter is precisely the midpoint of its hypotenuse. The length of the circumradius is equal to half the length of the hypotenuse.</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Centroid of a Triangle</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">The centroid is the point of intersection of the three medians. For vertices (x<sub>1</sub>, y<sub>1</sub>), (x<sub>2</sub>, y<sub>2</sub>), and (x<sub>3</sub>, y<sub>3</sub>), the coordinates are derived as ((x<sub>1</sub> + x<sub>2</sub> + x<sub>3</sub>) ÷ 3, (y<sub>1</sub> + y<sub>2</sub> + y<sub>3</sub>) ÷ 3).</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Circumcenter Position based on Triangle Type</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">The location of the circumcenter varies distinctively: it lies strictly inside an acute triangle, exactly on the midpoint of the hypotenuse for a right-angled triangle, and entirely outside an obtuse triangle.</p>\n\n<p> </p>", "marks": 2, "negMarks": 0.5}, {"text": "Simplify: <span class=\"math-tex\">\\(\\frac{\\sqrt{5+2\\sqrt{6}}}{\\sqrt{5-2\\sqrt{6}}}\\)</span>", "options": ["<span class=\"math-tex\">\\(5-2\\sqrt{6}\\)</span>", "<span class=\"math-tex\">\\(5+2\\sqrt{6}\\)</span>", "<span class=\"math-tex\">\\(3+2\\sqrt{3}\\)</span>", "<span class=\"math-tex\">\\(3-2\\sqrt{3}\\)</span>"], "correct": 2, "solution": "<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png\" width=\"26px\" /> <u style=\"font-size: 21px; font-weight: 700; display: inline !important;\">Shortcut Trick</u></span></p>\n\n<p>Combine the numerator and denominator under a single square root: √( (5 + 2√6) / (5 − 2√6) )</p>\n\n<p>Rationalize the fraction inside the root by multiplying both numerator and denominator by the conjugate (5 + 2√6).</p>\n\n<p>The denominator becomes 5<sup>2</sup> − (2√6)<sup>2</sup> = 25 − 24 = 1.</p>\n\n<p>The numerator becomes (5 + 2√6)<sup>2</sup>.</p>\n\n<p>The expression directly simplifies to √( (5 + 2√6)<sup>2</sup> / 1 ) = 5 + 2√6.</p>\n\n<p><strong>∴ The correct answer is 5 + 2√6.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Alternate Method</u></span></strong></span></p>\n\n<p><strong>Given:</strong></p>\n\n<p>Expression: √(5 + 2√6) / √(5 − 2√6)</p>\n\n<p><strong>Formula Used:</strong></p>\n\n<p>(a + b)<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup> + 2ab</p>\n\n<p>(a − b)<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup> − 2ab</p>\n\n<p>(a + b)(a − b) = a<sup>2</sup> − b<sup>2</sup></p>\n\n<p><strong>Calculations:</strong></p>\n\n<p>⇒ First, express the terms inside the square roots as perfect squares.</p>\n\n<p>⇒ 5 + 2√6 = 3 + 2 + 2√(3 × 2) = (√3)<sup>2</sup> + (√2)<sup>2</sup> + 2(√3)(√2) = (√3 + √2)<sup>2</sup></p>\n\n<p>⇒ 5 − 2√6 = 3 + 2 − 2√(3 × 2) = (√3)<sup>2</sup> + (√2)<sup>2</sup> − 2(√3)(√2) = (√3 − √2)<sup>2</sup></p>\n\n<p>⇒ Substitute these back into the original expression:</p>\n\n<p>⇒ √(√3 + √2)<sup>2</sup> / √(√3 − √2)<sup>2</sup></p>\n\n<p>⇒ Simplify the square roots:</p>\n\n<p>⇒ (√3 + √2) / (√3 − √2)</p>\n\n<p>⇒ Rationalize the denominator by multiplying the numerator and denominator by the conjugate (√3 + √2):</p>\n\n<p>⇒ [(√3 + √2) × (√3 + √2)] / [(√3 − √2) × (√3 + √2)]</p>\n\n<p>⇒ Numerator: (√3 + √2)<sup>2</sup> = (√3)<sup>2</sup> + (√2)<sup>2</sup> + 2(√3)(√2) = 3 + 2 + 2√6 = 5 + 2√6</p>\n\n<p>⇒ Denominator: (√3)<sup>2</sup> − (√2)<sup>2</sup> = 3 − 2 = 1</p>\n\n<p>⇒ Final value = (5 + 2√6) / 1 = 5 + 2√6</p>\n\n<p><strong>∴ The correct answer is 5 + 2√6.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Rationalization of Surds</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">Rationalization is the process of removing surds from a denominator by multiplying both the numerator and denominator by its conjugate. The conjugate of a + √b is a − √b.</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Perfect Squares Involving Surds</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">Expressions of the form a + 2√b can frequently be rewritten as a perfect square (√x + √y)<sup>2</sup> if two numbers x and y can be found such that x + y = a and xy = b.</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Quotient Property of Radicals</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">The quotient property states that √x ÷ √y = √(x/y). This allows combining separate roots in a fraction into a single root for easier algebraic simplification.</p>\n\n<p> </p>", "marks": 2, "negMarks": 0.5}, {"text": "A right-angled triangle ABC has legs AB=6 cm and BC=8 cm. An altitude BD is drawn from the vertex B to the hypotenuse AC. What is the length of the altitude BD?", "options": ["4.8 cm", "5.6 cm", "6.4 cm", "7.2 cm"], "correct": 1, "solution": "<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png\" width=\"26px\" /> <u style=\"font-size: 21px; font-weight: 700; display: inline !important;\">Shortcut Trick</u></span></p>\n\n<p>In a right-angled triangle, the altitude drawn to the hypotenuse is given by the direct formula: <strong>Altitude = (Perpendicular × Base) ÷ Hypotenuse</strong>.</p>\n\n<p>Hypotenuse AC = √(6<sup>2</sup> + 8<sup>2</sup>) = √(36 + 64) = √100 = 10 cm.</p>\n\n<p>Altitude BD = (AB × BC) ÷ AC = (6 × 8) ÷ 10 = 4.8 cm.</p>\n\n<p><strong>∴ The correct answer is 4.8 cm.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Alternate Method</u></span></strong></span></p>\n\n<p><strong>Given:</strong></p>\n\n<p>Legs of right-angled triangle AB = 6 cm and BC = 8 cm.</p>\n<svg height=\"240\" style=\"display:block;margin:12px 0;background:#ffffff;border-radius:10px;border:1px solid #cccccc;\" viewbox=\"0 0 420 240\" width=\"420\" xmlns=\"http://www.w3.org/2000/svg\"> <polygon fill=\"#ddeeff\" points=\"60,180 168,36 360,180\" stroke=\"#2255cc\" stroke-width=\"2\"></polygon> <line stroke=\"#cc5500\" stroke-dasharray=\"5,3\" stroke-width=\"2\" x1=\"168\" x2=\"168\" y1=\"36\" y2=\"180\"></line> <polyline fill=\"none\" points=\"159,48 171,57 180,45\" stroke=\"#2255cc\" stroke-width=\"1.5\"></polyline> <polyline fill=\"none\" points=\"168,170 178,170 178,180\" stroke=\"#cc5500\" stroke-width=\"1.5\"></polyline> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"bold\" x=\"45\" y=\"195\">A</text> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"bold\" x=\"163\" y=\"25\">B</text> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"bold\" x=\"365\" y=\"195\">C</text> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"bold\" x=\"163\" y=\"200\">D</text> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"bold\" x=\"90\" y=\"100\">6 cm</text> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"bold\" x=\"280\" y=\"100\">8 cm</text> <text fill=\"#cc5500\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"bold\" x=\"175\" y=\"115\">h = ?</text> <line stroke=\"#888888\" stroke-dasharray=\"5,3\" stroke-width=\"1\" x1=\"60\" x2=\"360\" y1=\"210\" y2=\"210\"></line> <line stroke=\"#888888\" stroke-width=\"1\" x1=\"60\" x2=\"60\" y1=\"205\" y2=\"215\"></line> <line stroke=\"#888888\" stroke-width=\"1\" x1=\"360\" x2=\"360\" y1=\"205\" y2=\"215\"></line> <rect fill=\"#ffffff\" height=\"16\" width=\"50\" x=\"180\" y=\"202\"></rect> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"bold\" x=\"185\" y=\"215\">10 cm</text> </svg>\n\n<p><strong>Formula Used:</strong></p>\n\n<p>Area of a triangle = 1/2 × Base × Height</p>\n\n<p>Pythagoras Theorem: Hypotenuse<sup>2</sup> = Perpendicular<sup>2</sup> + Base<sup>2</sup></p>\n\n<p><strong>Calculations:</strong></p>\n\n<p>⇒ By Pythagoras theorem, AC<sup>2</sup> = AB<sup>2</sup> + BC<sup>2</sup></p>\n\n<p>⇒ AC = √(6<sup>2</sup> + 8<sup>2</sup>) = √(36 + 64) = √100 = 10 cm</p>\n\n<p>⇒ Area of ∆ABC using legs as base and height = 1/2 × AB × BC</p>\n\n<p>⇒ Area = 1/2 × 6 × 8 = 24 cm<sup>2</sup></p>\n\n<p>⇒ We can also express Area of ∆ABC using the hypotenuse as the base: Area = 1/2 × AC × BD</p>\n\n<p>⇒ 24 = 1/2 × 10 × BD</p>\n\n<p>⇒ 24 = 5 × BD</p>\n\n<p>⇒ BD = 24 ÷ 5 = 4.8 cm</p>\n\n<p><strong>∴ The correct answer is 4.8 cm.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Altitude to Hypotenuse Area Rule</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">The product of the legs of a right triangle is always equal to the product of the hypotenuse and the altitude drawn to it (Leg<sub>1</sub> × Leg<sub>2</sub> = Hypotenuse × Altitude).</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Similar Triangles Theorem</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">Drawing an altitude to the hypotenuse of a right triangle divides it into two smaller triangles that are mathematically similar to each other and to the original parent triangle.</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Geometric Mean Theorem</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">The altitude drawn to the hypotenuse acts as the geometric mean of the lengths of the two smaller segments it divides the hypotenuse into: h<sup>2</sup> = Segment<sub>1</sub> × Segment<sub>2</sub>.</p>\n\n<p> </p>", "marks": 2, "negMarks": 0.5}, {"text": "In the sentence: \"The annals of mountaineering history are adorned with figures whose daring transcended mere athleticism...\"? What is the grammatical role of the clause \"whose daring transcended mere athleticism\"", "options": ["Adjective clause modifying \"figures\"", "Adverbial clause modifying \"history\"", "Noun clause acting as the subject", "Adjective phrase modifying \"mountaineering\""], "correct": 1, "solution": "<div><span style=\"\">The correct answer is <strong>Option 1</strong>.</span></div>\n\n<div> </div>\n\n<div><span style=\"\"><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></span></div>\n\n<ul>\n\\t<li><span style=\"\">An <strong>adjective clause</strong> (also known as a relative clause) is a dependent clause that modifies a noun or pronoun. It provides extra information about the person or thing mentioned.</span></li>\n\\t<li><span style=\"\">In the sentence provided, the clause <strong>\"whose daring transcended mere athleticism\"</strong> starts with the relative pronoun <strong>\"whose\"</strong> and directly describes the noun <strong>\"figures\"</strong>.</span></li>\n\\t<li><span style=\"\">Because it tells us which \"figures\" the author is referring to (those with transcending daring), it performs the role of an adjective.</span></li>\n\\t<li><span style=\"\">Let's analyze why other options are incorrect: </span>\n\\t<ul>\n\\t\\t<li><span style=\"\"><strong>Option 2:</strong> Adverbial clauses modify verbs, adjectives, or other adverbs (usually answering \"when,\" \"where,\" or \"how\"), not nouns like \"history.\"</span></li>\n\\t\\t<li><span style=\"\"><strong>Option 3:</strong> A noun clause replaces a noun as a subject or object; here, \"The annals... are adorned\" already has its subject and verb.</span></li>\n\\t\\t<li><span style=\"\"><strong>Option 4:</strong> An adjective <em>phrase</em> lacks a subject-verb combination; because this has a subject (\"daring\") and a verb (\"transcended\"), it is a <strong>clause</strong>, not a phrase.</span></li>\n\\t</ul>\n\\t<span style=\"\"> </span></li>\n</ul>\n\n<div><span style=\"\">Therefore, the correct answer is <strong>1</strong>.</span></div>\n\n<div> </div>\n\n<div> </div>\n\n<div><span style=\"\"><strong>Analytical Insight:</strong> <em>For distinguishing between phrases and clauses is a foundational skill. Always check for a <strong>finite verb</strong>. If a group of words has a subject and a verb but starts with a relative pronoun like \"whose,\" \"who,\" or \"which,\" it's almost certainly a relative (adjective) clause.</em></span></div>\n\n<div> </div>\n\n<div><span style=\"\"><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></span></div>\n\n<ul>\n\\t<li><span style=\"\"><strong>Annals:</strong> A historical record of events, year by year.</span></li>\n\\t<li><span style=\"\"><strong>Epochal:</strong> Forming or characterizing an epoch; extremely significant or influential.</span></li>\n\\t<li><span style=\"\"><strong>Dialectic:</strong> A discourse between two opposing points of view (in this context, the struggle between human limits and the mountain's power).</span></li>\n</ul>", "marks": 2, "negMarks": 0.5}, {"text": "Which of the following best summarizes the primary argument of the passage?", "options": ["Mountaineering is solely a test of physical endurance.", "Mountaineering history is dominated by Western adventurers.", "Mountaineering represents a confluence of physical challenge, cultural identity, and philosophical exploration.", "Technological advancements have made mountaineering effortless."], "correct": 3, "solution": "<div><span style=\"\">The correct answer is <strong>Option 3</strong>.</span></div>\n\n<div> </div>\n\n<div><span style=\"\"><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></span></div>\n\n<ul>\n\\t<li><span style=\"\">The passage begins by stating that mountaineering \"transcended mere athleticism\" and involved <strong>philosophical quests</strong>.</span></li>\n\\t<li><span style=\"\">It highlights the <strong>physical challenges</strong> faced by various climbers (Norgay, Hillary, Messner, Jornet) while also emphasizing their unique <strong>philosophies</strong> (minimalism, reverence, defiance).</span></li>\n\\t<li><span style=\"\">The text also touches on <strong>cultural identity</strong> and recognition, specifically mentioning the rise of <strong>indigenous climbers</strong> as \"stewards of sacred peaks\" and Junko Tabei's role as a female pioneer.</span></li>\n\\t<li><span style=\"\">The concluding sentence reinforces this \"confluence\" by describing mountaineering as a <strong>\"tapestry of cultures, philosophies, and personal odysseys.\"</strong></span></li>\n</ul>\n\n<div><span style=\"\">Therefore, the correct answer is <strong>3</strong>.</span></div>\n\n<div> </div>\n\n<div> </div>\n\n<div><span style=\"\"><strong>Analytical Insight:</strong> <em>In Reading Comprehension, a \"Summary\" or \"Primary Argument\" question requires you to find the option that covers the <strong>entire scope</strong> of the text. Options 1 and 2 are too narrow (focusing only on physical strength or history), while Option 4 is factually contradicted by the mention of \"formidable landscapes\" and \"human fragility.\" Option 3 is the only one that synthesizes the physical, cultural, and philosophical threads discussed.</em></span></div>\n\n<div> </div>\n\n<div><span style=\"\"><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></span></div>\n\n<ul>\n\\t<li><span style=\"\"><strong>Ethos:</strong> The characteristic spirit of a culture, era, or community.</span></li>\n\\t<li><span style=\"\"><strong>Paradigm:</strong> A typical example or pattern of something; a model.</span></li>\n\\t<li><span style=\"\"><strong>Immutable:</strong> Unchanging over time; unable to be changed.</span></li>\n</ul>", "marks": 2, "negMarks": 0.5}, {"text": "Select the most appropriate synonym of the given word: <strong>CONDEMN</strong>", "options": ["Praise", "Criticize", "Protect", "Applaud"], "correct": 2, "solution": "<p style=\"\">The correct answer is <span style=\"font-weight: 700;\">'2'</span><span style=\"font-weight: 700;\"> i.e.</span><span style=\"font-weight: 700;\"> Criticize</span>.</p>\n\n<p style=\"\"><span style=\"display: flex; gap: 6px; align-items: center;\"><span style=\"display: flex; gap: 6px; align-items: center;\"><span style=\"display: flex; gap: 6px; align-items: center;\"><span style=\"display: flex; gap: 6px; align-items: center;\"><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></span></span></span></span></p>\n\n<ul style=\"\">\n        <li>The word 'Condemn' means to express strong disapproval of something or someone, often in a formal context.</li>\n        <li>Among the given options:\n            <ul>\n                <li><strong>Option 1 - Praise:</strong> This is the opposite of 'Condemn' and is not a synonym.</li>\n                <li><strong>Option 2 - Criticize:</strong> This is the correct synonym as it means to point out faults or express disapproval.</li>\n                <li><strong>Option 3 - Protect:</strong> This is unrelated to the meaning of 'Condemn'.</li>\n                <li><strong>Option 4 - Applaud:</strong> This is also the opposite of 'Condemn' and not a synonym.</li>\n            </ul>\n        </li>\n</ul>\n\n<p style=\"\"><span style=\"font-weight: 700;\">Correct sentence:</span> <em>The most appropriate synonym of 'Condemn' is <strong>Criticize</strong>.</em></p>\n\n<p style=\"\"><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<ul>\n        <li><strong>Synonyms:</strong> Synonyms are words that have similar meanings. For example, 'Condemn' has synonyms like 'Criticize', 'Denounce', or 'Blame'.</li>\n        <li><strong>Antonyms:</strong> Words with opposite meanings. For 'Condemn', antonyms include 'Praise', 'Applaud', or 'Approve'.</li>\n        <li><strong>Usage:</strong> 'Condemn' is often used in formal contexts, such as speeches or legal settings, to express disapproval of actions, policies, or behavior.</li>\n</ul>44:T45c,<p>Given:</p>\n\n<p>The given statement mentions that the company has decided to switch to renewable energy sources for its operations. This indicates a change toward cleaner and more sustainable energy.</p>\n\n<p>Now, let's evaluate the given inferences:</p>\n\n<p>I. The company aims to reduce its carbon footprint:</p>\n\n<p>This inference is <strong>true.</strong></p>\n\n<p>Switching to renewable energy generally helps in reducing carbon emissions, so it is reasonable to infer that the company aims to reduce its carbon footprint.</p>\n\n<p>II. The company's current energy sources are expensive: This inference is not necessarily <strong>true.</strong></p>\n\n<p>The statement does not mention anything about the cost of the current energy sources, so we cannot conclude that they are expensive.</p>\n\n<p>Hence, only inference I follows from the given statement.</p>\n\n<p>Hence, the correct answer is <strong>\"Option 1\".</strong></p>", "marks": 2, "negMarks": 0.5}, {"text": "Select the most appropriate antonym of the given word. <strong>Vindicate</strong>", "options": ["Justify", "Carefree", "Forgive", "Accuse"], "correct": 4, "solution": "<p style=\"\">The correct answer is <span style=\"font-weight: 700;\">'4'</span><span style=\"font-weight: 700;\"> i.e.</span><span style=\"font-weight: 700;\"> Accuse</span> <span style=\"font-weight: 700;\">.</span></p>\n\n<p style=\"\"><span style=\"display: flex; gap: 6px; align-items: center;\"><span style=\"display: flex; gap: 6px; align-items: center;\"><span style=\"display: flex; gap: 6px; align-items: center;\"><span style=\"display: flex; gap: 6px; align-items: center;\"><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></span></span></span></span></p>\n\n<ul style=\"\">\n        <li>The word \"Vindicate\" means to clear someone of blame or suspicion or to justify something.</li>\n        <li>An antonym is a word that has an opposite meaning.</li>\n        <li>Among the given options:\n            <ul>\n                <li><strong>Option 1: Justify</strong> - This is a synonym of \"Vindicate,\" not an antonym.</li>\n                <li><strong>Option 2: Carefree</strong> - This word is unrelated to the meaning of \"Vindicate.\"</li>\n                <li><strong>Option 3: Forgive</strong> - This is not the opposite of \"Vindicate\" but rather a related concept.</li>\n                <li><strong>Option 4: Accuse</strong> - This is the direct opposite of \"Vindicate,\" as it means to charge someone with wrongdoing rather than clearing them of blame.</li>\n            </ul>\n        </li>\n</ul>\n\n<p style=\"\"><span style=\"font-weight: 700;\">Correct answer:</span> The most appropriate antonym of \"Vindicate\" is <strong>Accuse</strong>.</p>\n\n<p style=\"\"><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<ul>\n        <li><strong>Synonyms of Vindicate:</strong> Justify, Defend, Exonerate.</li>\n        <li><strong>Antonyms of Vindicate:</strong> Accuse, Blame, Condemn.</li>\n        <li><strong>Usage in a Sentence:</strong>\n            <ul>\n                <li><strong>Vindicate:</strong> She was vindicated by the court's decision.</li>\n                <li><strong>Accuse:</strong> He was accused of stealing money from the office.</li>\n            </ul>\n        </li>\n</ul>48:T97d,<p style=\"\">The correct answer is <span style=\"font-weight: 700;\">'2'</span><span style=\"font-weight: 700;\"> i.e.</span><span style=\"font-weight: 700;\"> Announce one's candidacy or challenge</span><span style=\"font-weight: 700;\">.</span></p>\n\n<p style=\"\"><span style=\"display: flex; gap: 6px; align-items: center;\"><span style=\"display: flex; gap: 6px; align-items: center;\"><span style=\"display: flex; gap: 6px; align-items: center;\"><span style=\"display: flex; gap: 6px; align-items: center;\"><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></span></span></span></span></p>\n\n<ul style=\"\">\n        <li>The idiom <strong>\"Throw one's hat into the ring\"</strong> originates from boxing, where a challenger would throw their hat into the ring to signify their intention to compete.</li>\n        <li>In modern usage, this idiom means <strong>to announce one's candidacy or intention to participate in a challenge, competition, or election.</strong></li>\n        <li>It does not imply resigning, declaring defeat, or reckless betting, as suggested by the other options.</li>\n</ul>\n\n<p style=\"\"><span style=\"font-weight: 700;\">Correct sentence:</span> <em>She decided to throw her hat into the ring and run for mayor of the city.</em></p>\n\n<p style=\"\"><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<ul>\n        <li><strong>Other examples of idioms related to participation or competition:</strong>\n        <ul>\n                <li><strong>\"Step up to the plate\":</strong> To take responsibility or take action when required.</li>\n                <li><strong>\"Enter the fray\":</strong> To join a heated debate, fight, or competition.</li>\n        </ul>\n        </li>\n        <li><strong>Idiomatic phrases often originate from specific cultural or historical contexts, such as sports, politics, or traditional practices.</strong></li>\n</ul>49:T99a,<p style=\"\">The correct answer is <span style=\"font-weight: 700;\">'2'</span><span style=\"font-weight: 700;\"> i.e.</span><span style=\"font-weight: 700;\"> To be offended with exaggerated dignity</span> <span style=\"font-weight: 700;\">.</span></p>\n\n<p style=\"\"><span style=\"display: flex; gap: 6px; align-items: center;\"><span style=\"display: flex; gap: 6px; align-items: center;\"><span style=\"display: flex; gap: 6px; align-items: center;\"><span style=\"display: flex; gap: 6px; align-items: center;\"><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></span></span></span></span></p>\n\n<ul style=\"\">\n        <li>The idiom <strong>\"to be in high dudgeon\"</strong> refers to a state of being greatly offended or upset, often with an air of exaggerated self-importance or dignity.</li>\n        <li>This idiom is commonly used to describe someone who reacts strongly to a perceived insult or slight.</li>\n        <li>Option <strong>'2'</strong>, i.e., \"To be offended with exaggerated dignity,\" matches the correct meaning of the idiom.</li>\n</ul>\n\n<p style=\"\"><span style=\"font-weight: 700;\">Correct sentence:</span> <em>She left the meeting in high dudgeon after hearing the criticism.</em></p>\n\n<p style=\"\"><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<ul>\n        <li><strong>Usage of idioms:</strong>\n\n        <ul>\n                <li>Idioms are expressions that have figurative meanings different from their literal meanings.</li>\n                <li>They are often used in informal communication to add flair or humor.</li>\n        </ul>\n        </li>\n        <li><strong>Examples of similar idioms:</strong>\n        <ul>\n                <li><strong>To throw a tantrum:</strong> To react angrily, often in an unreasonable or exaggerated manner.</li>\n                <li><strong>To take umbrage:</strong> To feel offended or resentful.</li>\n        </ul>\n        </li>\n</ul>4a:T5c1,<p style=\"color: rgb(33, 37, 41);\">BODMAS Table: </p>\n\n<p style=\"color: rgb(33, 37, 41);\"><img alt=\"\" src=\"https://cdn.repeatermock.com/tb/7751840ca1840d12cadc428f84d30e2cdcd5e7f82d52a57de21f2404c58eed88.png\" /></p>\n\n<p>Given equation: 15 A 5 B 4 = 35</p>\n\n<p>Now, check each option one by one using BODMAS rule.</p>\n\n<p>Option 1) × , −</p>\n\n<p>⇒ 15 × 5 − 4</p>\n\n<p>⇒ 75 − 4</p>\n\n<p>⇒ 71 ≠ 35</p>\n\n<p>Option 2) ÷ , −</p>\n\n<p>⇒ 15 ÷ 5 − 4</p>\n\n<p>⇒ 3 − 4</p>\n\n<p>⇒ −1 ≠ 35</p>\n\n<p><strong>Option 3) + , ×</strong></p>\n\n<p><strong>⇒ 15 + 5 × 4</strong></p>\n\n<p><strong>⇒ 15 + 20</strong></p>\n\n<p><strong>⇒ 35 </strong></p>\n\n<p>Option 4) ÷ , ×</p>\n\n<p>⇒ 15 ÷ 5 × 4</p>\n\n<p>⇒ 3 × 4</p>\n\n<p>⇒ 12 ≠ 35</p>\n\n<p>Hence, the correct answer is <strong>\"Option 3\".</strong></p>", "marks": 2, "negMarks": 0.5}, {"text": "Which is the <strong>correct spelling </strong>for a word meaning 'to erase or wipe out'?", "options": ["Exponge", "Expung", "Expunge", "Expouge"], "correct": 3, "solution": "<p style=\"\">The correct answer is <span style=\"font-weight: 700;\">'3'</span><span style=\"font-weight: 700;\"> i.e.</span><span style=\"font-weight: 700;\"> Expunge</span> <span style=\"font-weight: 700;\">.</span></p>\n\n<p style=\"\"><span style=\"display: flex; gap: 6px; align-items: center;\"><span style=\"display: flex; gap: 6px; align-items: center;\"><span style=\"display: flex; gap: 6px; align-items: center;\"><span style=\"display: flex; gap: 6px; align-items: center;\"><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></span></span></span></span></p>\n\n<ul style=\"\">\n        <li>The word \"Expunge\" means \"to erase or wipe out,\" and it is the correct spelling in English.</li>\n        <li>Option 1 (\"Exponge\") is incorrect because it is a misspelling of the word.</li>\n        <li>Option 2 (\"Expung\") is incorrect because it is incomplete and missing the final \"e.\"</li>\n        <li>Option 4 (\"Expouge\") is incorrect because it is a misrepresentation of the word.</li>\n</ul>\n\n<p style=\"\"><span style=\"font-weight: 700;\">Correct sentence:</span> <em>The correct spelling for a word meaning \"to erase or wipe out\" is <strong>Expunge</strong>.</em></p>\n\n<p style=\"\"><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<ul>\n        <li>The word \"Expunge\" is often used in legal or formal contexts to describe the act of removing or deleting records, statements, or information.</li>\n        <li>Example: \"The court agreed to expunge the charges from his record.\"</li>\n</ul>4e:T9cd,<p style=\"\">The correct answer is <span style=\"font-weight: 700;\">'1'</span><span style=\"font-weight: 700;\"> i.e.</span><span style=\"font-weight: 700;\"> Cannibal</span> <span style=\"font-weight: 700;\">.</span></p>\n\n<p style=\"\"><span style=\"display: flex; gap: 6px; align-items: center;\"><span style=\"display: flex; gap: 6px; align-items: center;\"><span style=\"display: flex; gap: 6px; align-items: center;\"><span style=\"display: flex; gap: 6px; align-items: center;\"><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></span></span></span></span></p>\n\n<ul style=\"\">\n        <li>The term <strong>\"Cannibal\"</strong> refers to an individual, either human or animal, that eats the flesh of its own species.</li>\n        <li>The question specifically asks for a one-word substitute for \"one who eats human flesh,\" which is accurately described by the word <strong>\"Cannibal\"</strong>.</li>\n        <li>The other options provided are incorrect because:\n            <ul>\n                <li><strong>Herbivore:</strong> An organism that eats only plants.</li>\n                <li><strong>Carnivore:</strong> An organism that eats only meat, but not necessarily its own species.</li>\n                <li><strong>Omnivore:</strong> An organism that eats both plants and meat.</li>\n            </ul>\n        </li>\n</ul>\n\n<p style=\"\"><span style=\"font-weight: 700;\">Correct word:</span> <em><strong>Cannibal</strong></em>.</p>\n\n<p style=\"\"><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<ul>\n        <li><strong>Herbivore:</strong> Examples include cows, deer, and elephants.</li>\n        <li><strong>Carnivore:</strong> Examples include lions, tigers, and wolves.</li>\n        <li><strong>Omnivore:</strong> Examples include humans, bears, and pigs.</li>\n        <li><strong>Cannibalism:</strong> The act of eating the flesh of one's own species is rare in nature but observed in some animals, including certain insects and reptiles.</li>\n</ul>4f:Td33,<p style=\"\">The correct answer is <span style=\"font-weight: 700;\">'1'</span><span style=\"font-weight: 700;\"> i.e.</span><span style=\"font-weight: 700;\"> with</span> <span style=\"font-weight: 700;\">.</span></p>\n\n<p style=\"\"><span style=\"display: flex; gap: 6px; align-items: center;\"><span style=\"display: flex; var tI=setInterval(function(){if(submitted){clearInterval(tI);return}timeLeft--;document.getElementById('timer').textContent='⏱ '+Math.floor(timeLeft/60)+':'+(timeLeft%60).toString().padStart(2,'0');if(timeLeft<=0){clearInterval(tI);submitTest()}},1000);
function selectOption(q,o){if(submitted)return;var c=document.getElementById('q'+q);c.querySelectorAll('.option').forEach(function(x){x.classList.remove('selected')});c.querySelector('.option[data-option="'+o+'"]').classList.add('selected');userAnswers[q]=o;document.getElementById('p'+q).classList.add('answered');document.getElementById('submitBtn').classList.add('visible')}
function submitTest(){if(submitted)return;submitted=true;clearInterval(tI);var sc=0,co=0,at=0;for(var i=0;i<totalQ;i++){var q=document.getElementById('q'+i),c=parseInt(q.dataset.correct),u=userAnswers[i];q.querySelectorAll('.option').forEach(function(o){var n=parseInt(o.dataset.option);o.onclick=null;if(n===c){o.classList.add('correct');o.querySelector('.option-check').textContent='✓'}else if(n===u){o.classList.add('wrong');o.querySelector('.option-check').textContent='✗'}});if(u){at++;if(u===c){sc+=2;co++}else{sc-=0.5}}var s=document.getElementById('sol'+i);if(s)s.classList.add('visible')}document.getElementById('scoreValue').textContent=co+'/'+totalQ;document.getElementById('scoreLabel').textContent='Score: '+sc+' | Correct: '+co+' | Wrong: '+(at-co);document.getElementById('scoreBanner').classList.add('visible');if(ANALYSIS&&ANALYSIS.rank){document.getElementById('analysisGrid').innerHTML='<div class="stat"><div class="value rank">'+ANALYSIS.rank+'</div><div class="label">Rank</div></div><div class="stat"><div class="value pct">'+(ANALYSIS.percentile?ANALYSIS.percentile.toFixed(2)+'%':'N/A')+'</div><div class="label">Percentile</div></div><div class="stat"><div class="value avg">'+(ANALYSIS.avgMarks?ANALYSIS.avgMarks.toFixed(2):'N/A')+'</div><div class="label">Avg</div></div><div class="stat"><div class="value total">'+(ANALYSIS.totalStudents||'N/A')+'</div><div class="label">Students</div></div>';document.getElementById('analysisCard').classList.add('visible')}document.getElementById('submitBtn').style.display='none';document.getElementById('vsBtn').style.display='inline-block';if(window.MathJax&&window.MathJax.typesetPromise)window.MathJax.typesetPromise();document.getElementById('scoreBanner').scrollIntoView({behavior:'smooth'})}
function toggleSolutions(){solsVisible=!solsVisible;document.querySelectorAll('.solution').forEach(function(s){if(solsVisible)s.classList.add('visible');else s.classList.remove('visible')});document.getElementById('vsBtn').textContent=solsVisible?'📖 Hide Solutions':'📖 Show Solutions'}
setTimeout(function(){if(window.MathJax&&window.MathJax.typesetPromise)window.MathJax.typesetPromise()},2000);
</script></body></html>
