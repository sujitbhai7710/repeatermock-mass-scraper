like shooting, wrestling, and badminton.</li>\n</ul></li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Important Points</u></span></strong></span></p>\n<ul>\n<li><strong>Leuris Pupo:</strong> The Cuban shooter who won the gold medal in the same event, scoring <strong>34 points</strong> in the finals.</li>\n<li><strong>Shooting as a Sport:</strong> Shooting has been a part of the Olympic Games since <strong>1896</strong>, and India has developed a strong presence in this discipline in recent years.</li>\n<li><strong>Training and Preparation:</strong> Vijay Kumar's success was attributed to his rigorous training, technical skills, and mental preparation, which allowed him to excel under pressure.</li>\n<li><strong>Recognition:</strong> Vijay Kumar's silver medal brought widespread recognition to him, and he was awarded the prestigious <strong>Rajiv Gandhi Khel Ratna</strong> for his contribution to Indian sports.</li>\n</ul>\n```87:T2374,<p>सही उत्तर है <u><strong>वह फाइनल राउंड में पहुंचने के लिए छठे राउंड में एक बंधे हुए प्रतियोगी को पछाड़ दिया।</strong></u></p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>मुख्य बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>विजय कुमार</strong>, एक भारतीय निशानेबाज, ने <strong>लंदन 2012 ओलंपिक</strong> में <strong>पुरुषों की 25 मीटर रैपिड पिस्टल स्पर्धा</strong> में असाधारण प्रदर्शन किया।</li>\n<li>उन्हें प्रतियोगिता के दौरान एक गंभीर स्थिति का सामना करना पड़ा, जहां वह <strong>छठे राउंड</strong> में एक अन्य प्रतियोगी के साथ बंधे हुए थे। <strong>बंधे हुए प्रतियोगी को पछाड़ने</strong> की उनकी क्षमता ने उन्हें फाइनल राउंड में जगह सुरक्षित करने की अनुमति दी। <em><span style=\"font-weight: bolder;\">इसलिए, यह उनके प्रदर्शन में विशिष्ट कारक था।</span></em></li>\n<li>विजय कुमार ने अंततः <strong>रजत पदक</strong> जीता, जो शूटिंग खेलों में भारत के लिए एक महत्वपूर्ण उपलब्धि है।</li>\n<li>अन्य विकल्पों के विपरीत, उन्होंने <strong>कोई नया विश्व रिकॉर्ड</strong> नहीं बनाया और न ही उन्होंने <strong>स्वर्ण</strong> जीता। इसके अतिरिक्त, वह फाइनल के लिए क्वालीफाई करने वाले पहले भारतीय निशानेबाज नहीं थे, क्योंकि अन्य भारतीय निशानेबाजों ने पिछली स्पर्धाओं में यह उपलब्धि हासिल की थी।</li>\n<li>उनके प्रदर्शन का निर्णायक क्षण छठे राउंड के दौरान दबाव में उनकी <strong>मानसिक लचीलापन और सटीकता</strong> थी, जिसने उन्हें फाइनल और अंततः पोडियम तक पहुंचाया।</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>अतिरिक्त जानकारी</u></span></strong></span></p>\n<ul>\n<li><strong>विजय कुमार की उपलब्धि:</strong> <ul>\n<li>विजय कुमार ने लंदन में आयोजित <strong>2012 ग्रीष्मकालीन ओलंपिक</strong> में <strong>पुरुषों की 25 मीटर रैपिड पिस्टल स्पर्धा</strong> में <strong>रजत पदक</strong> जीता।</li>\n<li>यह एक महत्वपूर्ण उपलब्धि थी, क्योंकि यह ओलंपिक में शूटिंग में भारत द्वारा हासिल किए गए कुछ पदकों में से एक था।</li>\n<li>उन्होंने फाइनल में कुल <strong>30 अंक</strong> बनाए, और क्यूबा के लेउरिस पुपो के बाद दूसरे स्थान पर रहे।</li>\n</ul></li>\n<li><strong>शूटिंग में अन्य भारतीय उपलब्धियां:</strong> <ul>\n<li>शूटिंग में भारत की उल्लेखनीय उपलब्धियां रही हैं, जिनमें <strong>अभिनव बिंद्रा का 2008 बीजिंग ओलंपिक</strong> में 10 मीटर एयर राइफल स्पर्धा में <strong>स्वर्ण पदक</strong> शामिल है।</li>\n<li><strong>राज्यवर्धन सिंह राठौर</strong> और <strong>गगन नारंग</strong> जैसे निशानेबाजों ने भी पिछली ओलंपिक स्पर्धाओं में पदक जीते हैं।</li>\n</ul></li>\n<li><strong>25 मीटर रैपिड पिस्टल स्पर्धा के बारे में:</strong> <ul>\n<li>इस स्पर्धा में निशानेबाज <strong>25 मीटर</strong> की दूरी पर एक लक्ष्य पर गोली मारते हैं।</li>\n<li>प्रतियोगिता में एक योग्यता दौर और एक फाइनल दौर होता है, जिसमें निशानेबाज सटीकता और गति के माध्यम से अधिकतम अंक प्राप्त करने का लक्ष्य रखते हैं।</li>\n<li>इस स्पर्धा में <strong>सटीकता, समय और मानसिक ध्यान</strong> के संयोजन की आवश्यकता होती है, जो इसे सबसे चुनौतीपूर्ण शूटिंग विषयों में से एक बनाती है।</li>\n</ul></li>\n<li><strong>2012 लंदन ओलंपिक में भारत:</strong> <ul>\n<li>भारत ने 2012 लंदन ओलंपिक में <strong>6 पदकों</strong> का अपना अब तक का सबसे अधिक पदक जीता।</li>\n<li>इनमें शूटिंग, कुश्ती और बैडमिंटन जैसे विभिन्न विषयों में <strong>2 रजत</strong> पदक और <strong>4 कांस्य</strong> पदक शामिल थे।</li>\n</ul></li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>महत्वपूर्ण बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>लेउरिस पुपो:</strong> क्यूबा के निशानेबाज जिन्होंने उसी स्पर्धा में स्वर्ण पदक जीता, फाइनल में <strong>34 अंक</strong> बनाए।</li>\n<li><strong>एक खेल के रूप में शूटिंग:</strong> शूटिंग <strong>1896</strong> से ओलंपिक खेलों का हिस्सा रही है, और भारत ने हाल के वर्षों में इस विषय में एक मजबूत उपस्थिति विकसित की है।</li>\n<li><strong>प्रशिक्षण और तैयारी:</strong> विजय कुमार की सफलता का श्रेय उनके कठोर प्रशिक्षण, तकनीकी कौशल और मानसिक तैयारी को दिया गया, जिसने उन्हें दबाव में उत्कृष्ट प्रदर्शन करने की अनुमति दी।</li>\n<li><strong>मान्यता:</strong> विजय कुमार के रजत पदक ने उन्हें व्यापक पहचान दिलाई, और उन्हें भारतीय खेलों में उनके योगदान के लिए प्रतिष्ठित <strong>राजीव गांधी खेल रत्न</strong> से सम्मानित किया गया।</li>\n</ul>88:Tf72,<p>The correct answer is <u><strong>Only statement 1 is correct</strong></u>.</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p>\n<ul>\n<li><strong>Statement 1:</strong> The novel <em>One Hundred Years of Solitude</em> by Gabriel Garcia Marquez employs the literary technique of <strong>magical realism</strong>. Magical realism blends magical or fantastical elements with realistic settings and events. The story narrates the rise and fall of the <strong>Buendía family</strong> in the fictional town of <strong>Macondo</strong>. This statement is <strong>correct</strong>.</li>\n<li><strong>Statement 2:</strong> The novel does not present a linear historical account focused solely on Colombia's political events in the 20th century. Instead, it intertwines personal, familial, and mythical narratives with broader political and social commentary, often using non-linear storytelling. This statement is <strong>incorrect</strong>.</li>\n<li>The book is a <strong>landmark work in Latin American literature</strong>, widely celebrated for its depiction of history, culture, and politics through a blend of realism and fantasy.</li>\n<li>Gabriel Garcia Marquez won the <strong>Nobel Prize in Literature in 1982</strong>, largely due to the impact of <em>One Hundred Years of Solitude</em>, which is considered his magnum opus.</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n<ul>\n<li><strong>Magical Realism:</strong>\n<ul>\n<li>Magical realism is a literary genre where magical elements are presented as a natural part of an otherwise realistic environment.</li>\n<li>In <em>One Hundred Years of Solitude</em>, events like ascensions to heaven, ghosts, and extraordinary weather phenomena are presented as everyday occurrences in Macondo.</li>\n<li>This style allows Marquez to explore the complexities of Latin American history and culture in a symbolic and imaginative manner.</li>\n</ul>\n</li>\n<li><strong>Macondo:</strong>\n<ul>\n<li>Macondo is a fictional town that serves as the primary setting for the novel.</li>\n<li>It is inspired by Marquez's hometown of <strong>Aracataca, Colombia</strong>.</li>\n<li>The town becomes a microcosm of Latin American society, reflecting its struggles with colonialism, political turmoil, and modernization.</li>\n</ul>\n</li>\n<li><strong>The Buendía Family:</strong>\n<ul>\n<li>The narrative spans seven generations of the Buendía family, chronicling their triumphs, tragedies, and eventual decline.</li>\n<li>The family members often repeat the same mistakes, symbolizing the cyclical nature of history and human behavior.</li>\n</ul>\n</li>\n<li><strong>Political and Social Commentary:</strong>\n<ul>\n<li>While the novel is not a direct historical account, it draws heavily on the political and social history of Colombia and Latin America.</li>\n<li>Events such as civil wars, the banana massacre, and the exploitation of workers by foreign companies are allegorically depicted in the story.</li>\n</ul>\n</li>\n<li><strong>Significance of the Novel:</strong>\n<ul>\n<li><em>One Hundred Years of Solitude</em> is considered one of the greatest literary works of the 20th century.</li>\n<li>It played a crucial role in the rise of the <strong>Latin American Boom</strong>, a literary movement that brought global attention to Latin American authors.</li>\n<li>The novel has been translated into more than 40 languages and has sold over 50 million copies worldwide.</li>\n</ul>\n</li>\n</ul>89:T1ff6,<p>सही उत्तर है <u><strong>केवल कथन 1 सही है</strong></u>।</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>मुख्य बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>कथन 1:</strong> गैब्रियल गार्सिया मार्केज़ के उपन्यास <em>वन हंड्रेड इयर्स ऑफ़ सॉलिट्यूड</em> में <strong>जादुई यथार्थवाद</strong> की साहित्यिक तकनीक का उपयोग किया गया है। जादुई यथार्थवाद जादुई या काल्पनिक तत्वों को यथार्थवादी सेटिंग्स और घटनाओं के साथ मिलाता है। कहानी <strong>मैकोंडो</strong> के काल्पनिक शहर में <strong>बुएंदिया परिवार</strong> के उत्थान और पतन का वर्णन करती है। यह कथन <strong>सही</strong> है।</li>\n<li><strong>कथन 2:</strong> उपन्यास 20वीं शताब्दी में कोलंबिया की राजनीतिक घटनाओं पर केंद्रित एक रैखिक ऐतिहासिक विवरण प्रस्तुत नहीं करता है। इसके बजाय, यह व्यक्तिगत, पारिवारिक और पौराणिक कथाओं को व्यापक राजनीतिक और सामाजिक टिप्पणी के साथ जोड़ता है, अक्सर गैर-रैखिक कहानी कहने का उपयोग करता है। यह कथन <strong>गलत</strong> है।</li>\n<li>यह पुस्तक <strong>लैटिन अमेरिकी साहित्य में एक मील का पत्थर</strong> है, जिसे व्यापक रूप से यथार्थवाद और कल्पना के मिश्रण के माध्यम से इतिहास, संस्कृति और राजनीति के चित्रण के लिए मनाया जाता है।</li>\n<li>गैब्रियल गार्सिया मार्केज़ ने <strong>1982 में साहित्य में नोबेल पुरस्कार</strong> जीता, जिसका मुख्य कारण <em>वन हंड्रेड इयर्स ऑफ़ सॉलिट्यूड</em> का प्रभाव था, जिसे उनकी उत्कृष्ट कृति माना जाता है।</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>अतिरिक्त जानकारी</u></span></strong></span></p>\n<ul>\n<li><strong>जादुई यथार्थवाद:</strong>\n<ul>\n<li>जादुई यथार्थवाद एक साहित्यिक शैली है जहाँ जादुई तत्वों को एक अन्यथा यथार्थवादी वातावरण के एक प्राकृतिक भाग के रूप में प्रस्तुत किया जाता है।</li>\n<li><em>वन हंड्रेड इयर्स ऑफ़ सॉलिट्यूड</em> में, स्वर्ग में आरोहण, भूत और असाधारण मौसम की घटनाओं जैसी घटनाओं को मैकोंडो में रोजमर्रा की घटनाओं के रूप में प्रस्तुत किया जाता है।</li>\n<li>यह शैली मार्केज़ को प्रतीकात्मक और कल्पनाशील तरीके से लैटिन अमेरिकी इतिहास और संस्कृति की जटिलताओं का पता लगाने की अनुमति देती है।</li>\n</ul>\n</li>\n<li><strong>मैकोंडो:</strong>\n<ul>\n<li>मैकोंडो एक काल्पनिक शहर है जो उपन्यास के लिए प्राथमिक सेटिंग के रूप में कार्य करता है।</li>\n<li>यह मार्केज़ के गृहनगर <strong>अराकाटाका, कोलंबिया</strong> से प्रेरित है।</li>\n<li>यह शहर लैटिन अमेरिकी समाज का एक सूक्ष्म जगत बन जाता है, जो उपनिवेशवाद, राजनीतिक उथल-पुथल और आधुनिकीकरण के साथ अपने संघर्षों को दर्शाता है।</li>\n</ul>\n</li>\n<li><strong>बुएंदिया परिवार:</strong>\n<ul>\n<li>कथा बुएंदिया परिवार की सात पीढ़ियों तक फैली हुई है, जो उनकी जीत, त्रासदियों और अंतिम पतन का वर्णन करती है।</li>\n<li>परिवार के सदस्य अक्सर एक ही गलतियों को दोहराते हैं, जो इतिहास और मानव व्यवहार की चक्रीय प्रकृति का प्रतीक है।</li>\n</ul>\n</li>\n<li><strong>राजनीतिक और सामाजिक टिप्पणी:</strong>\n<ul>\n<li>हालांकि उपन्यास एक प्रत्यक्ष ऐतिहासिक विवरण नहीं है, लेकिन यह कोलंबिया और लैटिन अमेरिका के राजनीतिक और सामाजिक इतिहास पर बहुत अधिक निर्भर करता है।</li>\n<li>गृह युद्ध, केले नरसंहार और विदेशी कंपनियों द्वारा श्रमिकों के शोषण जैसी घटनाओं को कहानी में रूपक रूप से दर्शाया गया है।</li>\n</ul>\n</li>\n<li><strong>उपन्यास का महत्व:</strong>\n<ul>\n<li><em>वन हंड्रेड इयर्स ऑफ़ सॉलिट्यूड</em> को 20वीं शताब्दी की महानतम साहित्यिक कृतियों में से एक माना जाता है।</li>\n<li>इसने <strong>लैटिन अमेरिकी बूम</strong> के उदय में महत्वपूर्ण भूमिका निभाई, एक साहित्यिक आंदोलन जिसने लैटिन अमेरिकी लेखकों पर वैश्विक ध्यान आकर्षित किया।</li>\n<li>उपन्यास का 40 से अधिक भाषाओं में अनुवाद किया गया है और दुनिया भर में 50 मिलियन से अधिक प्रतियां बिक चुकी हैं।</li>\n</ul>\n</li>\n</ul>8a:T1274,<p>The correct answer is <u><strong>President</strong></u>.</p> <p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p> <ul> <li><strong>Financial Emergency</strong>: The term \"Financial Emergency\" is defined under <strong>Article 360</strong> of the <strong>Indian Constitution</strong>. It allows the <strong>President</strong> of India to take specific measures to safeguard the financial stability of the country.</li> <li>During a Financial Emergency, the <strong>President</strong> has the power to reduce the salaries and allowances of all government employees, including <strong>judges of the Supreme Court and High Courts</strong>.</li> <li>Such measures are implemented to ensure the proper allocation and management of financial resources during the crisis. <em><strong>Hence, the correct answer is \"President.\"</strong></em></li> <li>The proclamation of a Financial Emergency requires the approval of both Houses of Parliament within two months of its issuance.</li> <li>Once approved, the <strong>President</strong> can issue directions to the States regarding financial matters, aiming to control expenditure and maintain fiscal stability.</li> </ul> <p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p> <ul> <li><strong>Article 360:</strong> <ul> <li>Article 360 of the <strong>Indian Constitution</strong> empowers the <strong>President</strong> to declare a Financial Emergency if he/she is convinced that the financial stability or credit of India is under threat.</li> <li>It is considered one of the special provisions under emergency powers granted to the central government.</li> </ul> </li> <li><strong>Implications of Financial Emergency:</strong> <ul> <li>The <strong>Union Government</strong> can direct states to follow specific financial policies to maintain fiscal discipline.</li> <li>The salaries and allowances of government officials, including judges of the <strong>Supreme Court and High Courts</strong>, can be reduced.</li> <li>Such measures aim to ensure the proper utilization of financial resources during an economic crisis.</li> </ul> </li> <li><strong>Examples of Emergency Provisions:</strong> <ul> <li>The Indian Constitution provides for three types of emergencies: <strong>National Emergency</strong> (Article 352), <strong>State Emergency</strong> (Article 356), and <strong>Financial Emergency</strong> (Article 360).</li> <li>While National and State Emergencies have been declared in India, a Financial Emergency has never been invoked.</li> </ul> </li> <li><strong>Role of Parliament:</strong> <ul> <li>The proclamation of a Financial Emergency must be approved by both Houses of Parliament within two months.</li> <li>If not approved, the proclamation ceases to operate at the end of the two-month period.</li> <li>The Parliament has the authority to revoke the Financial Emergency at any time through a resolution.</li> </ul> </li> </ul> <p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Important Points</u></span></strong></span></p> <ul> <li><strong>President's Role:</strong> <ul> <li>The <strong>President</strong> is empowered to take necessary actions during a Financial Emergency, including issuing directions to states and reducing government salaries.</li> <li>The <strong>President</strong> acts on the advice of the <strong>Council of Ministers</strong>, led by the <strong>Prime Minister</strong>.</li> </ul> </li> <li><strong>Judiciary and Financial Emergency:</strong> <ul> <li>The judiciary's independence remains intact, but their salaries and allowances can be reduced under Financial Emergency provisions.</li> <li>Such measures are temporary and aim to stabilize the financial health of the nation.</li> </ul> </li> <li><strong>Historical Context:</strong> <ul> <li>India has faced several economic challenges, but a Financial Emergency under Article 360 has never been declared.</li> <li>The provision serves as a safeguard for extreme situations affecting the country's fiscal stability.</li> </ul> </li> </ul>8b:T23d3,<p>सही उत्तर <u><strong>राष्ट्रपति</strong></u> है।</p> <p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>मुख्य बिंदु</u></span></strong></span></p> <ul> <li><strong>वित्तीय आपातकाल</strong>: \"वित्तीय आपातकाल\" शब्द को <strong>भारतीय संविधान</strong> के <strong>अनुच्छेद 360</strong> के तहत परिभाषित किया गया है। यह भारत के <strong>राष्ट्रपति</strong> को देश की वित्तीय स्थिरता की रक्षा के लिए विशिष्ट उपाय करने की अनुमति देता है।</li> <li>वित्तीय आपातकाल के दौरान, <strong>राष्ट्रपति</strong> के पास सर्वोच्च न्यायालय और उच्च न्यायालयों के <strong>न्यायाधीशों</strong> सहित सभी सरकारी कर्मचारियों के वेतन और भत्ते को कम करने की शक्ति होती है।</li> <li>ऐसे उपाय संकट के दौरान वित्तीय संसाधनों के उचित आवंटन और प्रबंधन को सुनिश्चित करने के लिए लागू किए जाते हैं। <em><strong>इसलिए, सही उत्तर \"राष्ट्रपति\" है।</strong></em></li> <li>वित्तीय आपातकाल की घोषणा के लिए इसके जारी होने के दो महीने के भीतर संसद के दोनों सदनों द्वारा अनुमोदन की आवश्यकता होती है।</li> <li>एक बार स्वीकृत हो जाने पर, <strong>राष्ट्रपति</strong> वित्तीय मामलों के संबंध में राज्यों को निर्देश जारी कर सकते हैं, जिसका उद्देश्य व्यय को नियंत्रित करना और राजकोषीय स्थिरता बनाए रखना है।</li> </ul> <p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>अतिरिक्त जानकारी</u></span></strong></span></p> <ul> <li><strong>अनुच्छेद 360:</strong> <ul> <li><strong>भारतीय संविधान</strong> का अनुच्छेद 360 <strong>राष्ट्रपति</strong> को वित्तीय आपातकाल घोषित करने का अधिकार देता है यदि वह/उसे विश्वास हो कि भारत की वित्तीय स्थिरता या ऋण खतरे में है।</li> <li>इसे केंद्र सरकार को दी गई आपातकालीन शक्तियों के तहत विशेष प्रावधानों में से एक माना जाता है।</li> </ul> </li> <li><strong>वित्तीय आपातकाल के निहितार्थ:</strong> <ul> <li><strong>संघ सरकार</strong> राजकोषीय अनुशासन बनाए रखने के लिए राज्यों को विशिष्ट वित्तीय नीतियों का पालन करने का निर्देश दे सकती है।</li> <li><strong>सर्वोच्च न्यायालय और उच्च न्यायालयों</strong> के न्यायाधीशों सहित सरकारी अधिकारियों के वेतन और भत्ते को कम किया जा सकता है।</li> <li>ऐसे उपायों का उद्देश्य आर्थिक संकट के दौरान वित्तीय संसाधनों का उचित उपयोग सुनिश्चित करना है।</li> </ul> </li> <li><strong>आपातकालीन प्रावधानों के उदाहरण:</strong> <ul> <li>भारतीय संविधान तीन प्रकार की आपात स्थितियों का प्रावधान करता है: <strong>राष्ट्रीय आपातकाल</strong> (अनुच्छेद 352), <strong>राज्य आपातकाल</strong> (अनुच्छेद 356), और <strong>वित्तीय आपातकाल</strong> (अनुच्छेद 360)।</li> <li>जबकि भारत में राष्ट्रीय और राज्य आपातकाल घोषित किए गए हैं, वित्तीय आपातकाल कभी भी लागू नहीं किया गया है।</li> </ul> </li> <li><strong>संसद की भूमिका:</strong> <ul> <li>वित्तीय आपातकाल की घोषणा को दो महीने के भीतर संसद के दोनों सदनों द्वारा अनुमोदित किया जाना चाहिए।</li> <li>यदि अनुमोदित नहीं किया जाता है, तो घोषणा दो महीने की अवधि के अंत में संचालित होना बंद हो जाती है।</li> <li>संसद के पास एक प्रस्ताव के माध्यम से किसी भी समय वित्तीय आपातकाल को रद्द करने का अधिकार है।</li> </ul> </li> </ul> <p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>महत्वपूर्ण बिंदु</u></span></strong></span></p> <ul> <li><strong>राष्ट्रपति की भूमिका:</strong> <ul> <li><strong>राष्ट्रपति</strong> को वित्तीय आपातकाल के दौरान आवश्यक कार्रवाई करने का अधिकार है, जिसमें राज्यों को निर्देश जारी करना और सरकारी वेतन को कम करना शामिल है।</li> <li><strong>राष्ट्रपति</strong> <strong>प्रधान मंत्री</strong> के नेतृत्व में <strong>मंत्रिपरिषद</strong> की सलाह पर कार्य करते हैं।</li> </ul> </li> <li><strong>न्यायपालिका और वित्तीय आपातकाल:</strong> <ul> <li>न्यायपालिका की स्वतंत्रता बरकरार है, लेकिन वित्तीय आपातकाल प्रावधानों के तहत उनके वेतन और भत्ते को कम किया जा सकता है।</li> <li>ऐसे उपाय अस्थायी हैं और इनका उद्देश्य राष्ट्र के वित्तीय स्वास्थ्य को स्थिर करना है।</li> </ul> </li> <li><strong>ऐतिहासिक संदर्भ:</strong> <ul> <li>भारत ने कई आर्थिक चुनौतियों का सामना किया है, लेकिन अनुच्छेद 360 के तहत वित्तीय आपातकाल कभी घोषित नहीं किया गया है।</li> <li>यह प्रावधान देश की राजकोषीय स्थिरता को प्रभावित करने वाली चरम स्थितियों के लिए एक सुरक्षा उपाय के रूप में कार्य करता है।</li> </ul> </li> </ul>8c:T1640,<p>The correct answer is <u><strong>3) A is true, but R is false</strong></u>.</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p>\n<ul>\n<li><strong>Assertion (A): Generative Design Software is increasingly used by ISRO for optimizing structure and weight distribution in aerospace components.</strong>\n<ul>\n<li>This statement is <strong>correct</strong>. ISRO (Indian Space Research Organisation) employs advanced technologies like Generative Design Software to optimize the structural integrity and weight distribution of aerospace components.</li>\n<li>Generative design uses algorithms and AI to explore potential design solutions, improving efficiency and performance in aerospace applications.</li>\n<li>It plays a significant role in reducing the weight of components, which is critical in space exploration to enhance payload capacity and minimize costs.</li>\n</ul>\n</li>\n<li><strong>Reason (R): Generative design tools are specifically developed for modeling cryogenic fuel tanks used in PSLV variants.</strong>\n<ul>\n<li>This statement is <strong>false</strong>. While generative design tools can be applied to a variety of engineering problems, they are not specifically developed for modeling cryogenic fuel tanks used in PSLV (Polar Satellite Launch Vehicle) variants.</li>\n<li>Cryogenic fuel tanks are designed using specialized engineering techniques focusing on material properties, thermal insulation, and structural strength to handle extremely low temperatures, but these do not rely solely on generative design tools.</li>\n</ul>\n</li>\n<li><strong>Conclusion:</strong> The assertion is correct, but the reason provided does not justify the assertion. Therefore, the correct answer is <u><strong>3) A is true, but R is false</strong></u>.</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n<ul>\n<li><strong>Generative Design Software:</strong>\n<ul>\n<li>It is an advanced computational design approach that uses <strong>AI and algorithms</strong> to generate design alternatives based on specific constraints and objectives.</li>\n<li>The software is widely used in <strong>industries like aerospace, automotive, and architecture</strong> for optimizing designs.</li>\n<li>Applications include lightweighting components, improving structural performance, and enhancing material utilization.</li>\n<li>It integrates seamlessly with 3D printing and advanced manufacturing techniques for efficient production.</li>\n</ul>\n</li>\n<li><strong>ISRO's Use of Advanced Technologies:</strong>\n<ul>\n<li>ISRO employs technologies like <strong>topology optimization</strong>, additive manufacturing, and generative design to enhance the efficiency of spacecraft and launch vehicles.</li>\n<li>Weight optimization is critical for launch vehicles like <strong>PSLV, GSLV, and Gaganyaan</strong> to maximize payload capacity while minimizing fuel consumption.</li>\n<li>ISRO also focuses on materials science innovations to develop stronger, lightweight alloys and composites for spacecraft components.</li>\n</ul>\n</li>\n<li><strong>Cryogenic Fuel Tanks:</strong>\n<ul>\n<li>Cryogenic fuel tanks are used to store liquid fuels like <strong>liquid hydrogen (LH2) and liquid oxygen (LOX)</strong> at extremely low temperatures.</li>\n<li>They are engineered using materials like aluminum alloys and composites that can withstand thermal stresses and prevent leakage.</li>\n<li>Specialized thermal insulation is applied to maintain the low temperatures required for cryogenic fuels.</li>\n</ul>\n</li>\n<li><strong>PSLV (Polar Satellite Launch Vehicle):</strong>\n<ul>\n<li>PSLV is one of ISRO's most reliable launch vehicles, capable of deploying satellites into polar orbits.</li>\n<li>It uses a combination of solid and liquid propulsion systems, but it does not rely solely on cryogenic technology (used more prominently in GSLV).</li>\n<li>Generative design software has been employed in optimizing the design of PSLV components to enhance its performance.</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Important Points</u></span></strong></span></p>\n<ul>\n<li><strong>ISRO and Generative Design:</strong>\n<ul>\n<li>ISRO collaborates with organizations like <strong>NASA</strong>, <strong>DRDO</strong>, and private companies to incorporate cutting-edge technologies, including AI-driven generative design.</li>\n<li>Generative design tools help ISRO in areas such as structural analysis, thermal management, and weight optimization of spacecraft and launch vehicles.</li>\n</ul>\n</li>\n<li><strong>Generative Design Applications:</strong>\n<ul>\n<li>Beyond aerospace, generative design is used in <strong>automotive</strong> (e.g., lightweight car parts), <strong>architecture</strong> (e.g., optimized building structures), and <strong>medical devices</strong> (e.g., customized implants).</li>\n<li>It is a growing field with increasing applications in advanced manufacturing and sustainability initiatives.</li>\n</ul>\n</li>\n</ul>\n```8d:T2ef3,<p>सही उत्तर है <u><strong>3) A सत्य है, लेकिन R असत्य है</strong></u>।</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>मुख्य बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>अभिकथन (A): जेनरेटिव डिजाइन सॉफ्टवेयर का उपयोग ISRO द्वारा एयरोस्पेस घटकों में संरचना और वजन वितरण को अनुकूलित करने के लिए तेजी से किया जा रहा है।</strong>\n<ul>\n<li>यह कथन <strong>सही</strong> है। ISRO (भारतीय अंतरिक्ष अनुसंधान संगठन) एयरोस्पेस घटकों की संरचनात्मक अखंडता और वजन वितरण को अनुकूलित करने के लिए जेनरेटिव डिजाइन सॉफ्टवेयर जैसी उन्नत तकनीकों का उपयोग करता है।</li>\n<li>जेनरेटिव डिजाइन संभावित डिजाइन समाधानों का पता लगाने के लिए एल्गोरिदम और AI का उपयोग करता है, जिससे एयरोस्पेस अनुप्रयोगों में दक्षता और प्रदर्शन में सुधार होता है।</li>\n<li>यह घटकों के वजन को कम करने में महत्वपूर्ण भूमिका निभाता है, जो अंतरिक्ष अन्वेषण में पेलोड क्षमता को बढ़ाने और लागत को कम करने के लिए महत्वपूर्ण है।</li>\n</ul>\n</li>\n<li><strong>कारण (R): जेनरेटिव डिजाइन उपकरण विशेष रूप से PSLV वेरिएंट में उपयोग किए जाने वाले क्रायोजेनिक ईंधन टैंकों के मॉडलिंग के लिए विकसित किए गए हैं।</strong>\n<ul>\n<li>यह कथन <strong>गलत</strong> है। जबकि जेनरेटिव डिजाइन उपकरणों को विभिन्न प्रकार की इंजीनियरिंग समस्याओं पर लागू किया जा सकता है, लेकिन वे विशेष रूप से PSLV (ध्रुवीय उपग्रह प्रक्षेपण यान) वेरिएंट में उपयोग किए जाने वाले क्रायोजेनिक ईंधन टैंकों के मॉडलिंग के लिए विकसित नहीं किए गए हैं।</li>\n<li>क्रायोजेनिक ईंधन टैंकों को विशेष इंजीनियरिंग तकनीकों का उपयोग करके डिज़ाइन किया गया है जो सामग्री गुणों, थर्मल इन्सुलेशन और संरचनात्मक शक्ति पर ध्यान केंद्रित करते हैं ताकि बेहद कम तापमान को संभाला जा सके, लेकिन ये पूरी तरह से जेनरेटिव डिजाइन उपकरणों पर निर्भर नहीं होते हैं।</li>\n</ul>\n</li>\n<li><strong>निष्कर्ष:</strong> अभिकथन सही है, लेकिन दिया गया कारण अभिकथन को सही नहीं ठहराता है। इसलिए, सही उत्तर है <u><strong>3) A सत्य है, लेकिन R असत्य है</strong></u>।</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>अतिरिक्त जानकारी</u></span></strong></span></p>\n<ul>\n<li><strong>जेनरेटिव डिजाइन सॉफ्टवेयर:</strong>\n<ul>\n<li>यह एक उन्नत कम्प्यूटेशनल डिजाइन दृष्टिकोण है जो विशिष्ट बाधाओं और उद्देश्यों के आधार पर डिजाइन विकल्पों को उत्पन्न करने के लिए <strong>AI और एल्गोरिदम</strong> का उपयोग करता है।</li>\n<li>सॉफ्टवेयर का उपयोग व्यापक रूप से <strong>एयरोस्पेस, ऑटोमोटिव और आर्किटेक्चर जैसे उद्योगों</strong> में डिजाइनों को अनुकूलित करने के लिए किया जाता है।</li>\n<li>अनुप्रयोगों में हल्के घटकों, संरचनात्मक प्रदर्शन में सुधार और सामग्री उपयोग को बढ़ाना शामिल है।</li>\n<li>यह कुशल उत्पादन के लिए 3D प्रिंटिंग और उन्नत विनिर्माण तकनीकों के साथ सहजता से एकीकृत होता है।</li>\n</ul>\n</li>\n<li><strong>उन्नत तकनीकों का ISRO का उपयोग:</strong>\n<ul>\n<li>ISRO अंतरिक्ष यान और प्रक्षेपण यान की दक्षता बढ़ाने के लिए <strong>टोपोलॉजी अनुकूलन</strong>, एडिटिव मैन्युफैक्चरिंग और जेनरेटिव डिजाइन जैसी तकनीकों का उपयोग करता है।</li>\n<li>ईंधन की खपत को कम करते हुए पेलोड क्षमता को अधिकतम करने के लिए <strong>PSLV, GSLV और गगनयान</strong> जैसे प्रक्षेपण यान के लिए वजन अनुकूलन महत्वपूर्ण है।</li>\n<li>ISRO अंतरिक्ष यान घटकों के लिए मजबूत, हल्के मिश्र धातुओं और कंपोजिट विकसित करने के लिए सामग्री विज्ञान नवाचारों पर भी ध्यान केंद्रित करता है।</li>\n</ul>\n</li>\n<li><strong>क्रायोजेनिक ईंधन टैंक:</strong>\n<ul>\n<li>क्रायोजेनिक ईंधन टैंकों का उपयोग बेहद कम तापमान पर <strong>तरल हाइड्रोजन (LH2) और तरल ऑक्सीजन (LOX)</strong> जैसे तरल ईंधन को स्टोर करने के लिए किया जाता है।</li>\n<li>इन्हें एल्यूमीनियम मिश्र धातुओं और कंपोजिट जैसी सामग्रियों का उपयोग करके इंजीनियर किया जाता है जो थर्मल तनाव का सामना कर सकते हैं और रिसाव को रोक सकते हैं।</li>\n<li>क्रायोजेनिक ईंधन के लिए आवश्यक कम तापमान को बनाए रखने के लिए विशेष थर्मल इन्सुलेशन लगाया जाता है।</li>\n</ul>\n</li>\n<li><strong>PSLV (ध्रुवीय उपग्रह प्रक्षेपण यान):</strong>\n<ul>\n<li>PSLV ISRO के सबसे विश्वसनीय प्रक्षेपण यानों में से एक है, जो उपग्रहों को ध्रुवीय कक्षाओं में तैनात करने में सक्षम है।</li>\n<li>यह ठोस और तरल प्रणोदन प्रणालियों के संयोजन का उपयोग करता है, लेकिन यह पूरी तरह से क्रायोजेनिक तकनीक पर निर्भर नहीं है (GSLV में अधिक प्रमुखता से उपयोग किया जाता है)।</li>\n<li>PSLV घटकों के डिजाइन को अनुकूलित करने के लिए जेनरेटिव डिजाइन सॉफ्टवेयर का उपयोग किया गया है ताकि इसके प्रदर्शन को बढ़ाया जा सके।</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>महत्वपूर्ण बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>ISRO और जेनरेटिव डिजाइन:</strong>\n<ul>\n<li>ISRO AI-संचालित जेनरेटिव डिजाइन सहित अत्याधुनिक तकनीकों को शामिल करने के लिए <strong>NASA</strong>, <strong>DRDO</strong> और निजी कंपनियों जैसे संगठनों के साथ सहयोग करता है।</li>\n<li>जेनरेटिव डिजाइन उपकरण ISRO को अंतरिक्ष यान और प्रक्षेपण यान के संरचनात्मक विश्लेषण, थर्मल प्रबंधन और वजन अनुकूलन जैसे क्षेत्रों में मदद करते हैं।</li>\n</ul>\n</li>\n<li><strong>जेनरेटिव डिजाइन अनुप्रयोग:</strong>\n<ul>\n<li>एयरोस्पेस से परे, जेनरेटिव डिजाइन का उपयोग <strong>ऑटोमोटिव</strong> (जैसे, हल्के कार के पुर्जे), <strong>आर्किटेक्चर</strong> (जैसे, अनुकूलित भवन संरचनाएं) और <strong>चिकित्सा उपकरणों</strong> (जैसे, अनुकूलित प्रत्यारोपण) में किया जाता है।</li>\n<li>यह उन्नत विनिर्माण और स्थिरता पहलों में बढ़ते अनुप्रयोगों के साथ एक बढ़ता हुआ क्षेत्र है।</li>\n</ul>\n</li>\n</ul>", "marks": 2, "negMarks": 0.5}, {"text": "Fill in the blank: The Government of India Act 1919 created a bicameral central legislature with the Council of State and the _______.", "options": ["Central Legislative Assembly", "Imperial Council", "Council of Princes", "Chamber of Deputies"], "correct": 1, "solution": "<p>The correct answer is <u><strong>Central Legislative Assembly</strong></u>.</p> <p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p> <ul> <li>The <strong>Government of India Act, 1919</strong>, also known as the Montagu-Chelmsford Reforms, introduced significant changes in the administrative structure of India under British rule.</li> <li>This act created a <strong>bicameral central legislature</strong> for the first time in India, consisting of two houses: the <strong>Council of State</strong> (Upper House) and the <strong>Central Legislative Assembly</strong> (Lower House).</li> <li>The <strong>Central Legislative Assembly</strong> acted as the Lower House with a mix of elected and nominated members. Some members were elected by provincial legislative councils, while others were nominated by the Governor-General.</li> <li>The primary aim of the <strong>Central Legislative Assembly</strong> was to allow limited Indian representation in governance, though its powers were restricted to legislative matters and subject to the Governor-General's veto.</li> <li>The introduction of this bicameral legislature was an essential step toward the gradual inclusion of Indians in decision-making processes, although the reforms did not provide full autonomy.</li> <li>The act was a response to growing demands for self-governance by Indian leaders and was part of Britain's strategy to maintain control while addressing nationalist aspirations.</li> </ul> <p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p> <ul> <li><strong>Government of India Act, 1919:</strong> <ul> <li>The act introduced the system of <strong>diarchy</strong> in the provinces, dividing subjects into \"Reserved\" (controlled by the Governor) and \"Transferred\" (administered by elected Indian ministers).</li> <li>It marked a step toward <strong>responsible government</strong> by allowing Indian ministers to manage transferred subjects such as education, health, and agriculture, though with limited powers.</li> <li>The act extended the principle of <strong>communal representation</strong>, which reserved seats for Muslims, Sikhs, and other minority communities in legislatures.</li> <li>This act served as the foundation for subsequent reforms, including the <strong>Government of India Act, 1935</strong>, which introduced provincial autonomy and a federal structure.</li> </ul> </li> <li><strong>Key Features of the Central Legislative Assembly:</strong> <ul> <li>The assembly consisted of <strong>145 members</strong>, of which 41 were nominated (26 officials and 15 non-officials), and the rest were indirectly elected.</li> <li>Its functions were limited to <strong>discussing and voting on the budget</strong>, debating bills, and addressing public grievances, but the Governor-General retained overriding legislative powers.</li> <li>The assembly's establishment was a symbolic move to involve Indians in governance, but it did not provide substantive political power.</li> </ul> </li> <li><strong>Council of State:</strong> <ul> <li>The Council of State was the upper house of the bicameral legislature, consisting of <strong>60 members</strong>, of which 33 were elected and 27 were nominated.</li> <li>It was primarily a deliberative body with limited legislative powers and served as a check on the Central Legislative Assembly.</li> </ul> </li> <li><strong>Impact of the Reforms:</strong> <ul> <li>The reforms failed to satisfy Indian aspirations for self-governance, as the British retained significant control over critical matters like finance and law and order.</li> <li>The act faced criticism from Indian leaders, including <strong>Mahatma Gandhi</strong> and <strong>Jawaharlal Nehru</strong>, for its limited scope and lack of genuine political autonomy.</li> <li>Despite its shortcomings, the act laid the groundwork for subsequent constitutional developments and reforms in India.</li> </ul> </li> </ul> <p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Important Points</u></span></strong></span></p> <ul> <li><strong>Montagu-Chelmsford Report:</strong> The Government of India Act, 1919, was based on the Montagu-Chelmsford Report, which emphasized the gradual development of self-governing institutions in India.</li> <li><strong>Simon Commission:</strong> The reforms of 1919 were reviewed by the Simon Commission in 1927, which recommended further constitutional changes, leading to the Government of India Act, 1935.</li> <li><strong>Nationalist Response:</strong> The limited scope of the reforms contributed to the rise of the <strong>Non-Cooperation Movement</strong> (1920–22) led by the <strong>Indian National Congress</strong>, demanding complete self-rule or Swaraj.</li> </ul>85:T29fc,<p>सही उत्तर <u><strong>केंद्रीय विधान सभा</strong></u> है।</p> <p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>मुख्य बिंदु</u></span></strong></span></p> <ul> <li><strong>भारत सरकार अधिनियम, 1919</strong>, जिसे मोंटेग्यू-चेम्सफोर्ड सुधारों के रूप में भी जाना जाता है, ने ब्रिटिश शासन के तहत भारत की प्रशासनिक संरचना में महत्वपूर्ण बदलाव पेश किए।</li> <li>इस अधिनियम ने भारत में पहली बार <strong>द्विसदनीय केंद्रीय विधानमंडल</strong> बनाया, जिसमें दो सदन शामिल थे: <strong>राज्य परिषद</strong> (उच्च सदन) और <strong>केंद्रीय विधान सभा</strong> (निचला सदन)।</li> <li><strong>केंद्रीय विधान सभा</strong> ने निर्वाचित और मनोनीत सदस्यों के मिश्रण के साथ निचले सदन के रूप में कार्य किया। कुछ सदस्य प्रांतीय विधान परिषदों द्वारा चुने गए थे, जबकि अन्य को गवर्नर-जनरल द्वारा मनोनीत किया गया था।</li> <li><strong>केंद्रीय विधान सभा</strong> का प्राथमिक उद्देश्य शासन में सीमित भारतीय प्रतिनिधित्व की अनुमति देना था, हालांकि इसकी शक्तियां विधायी मामलों तक सीमित थीं और गवर्नर-जनरल के वीटो के अधीन थीं।</li> <li>इस द्विसदनीय विधानमंडल की शुरुआत निर्णय लेने की प्रक्रियाओं में भारतीयों को ध ent</strong> at the <strong>2012 Summer Olympics</strong> held in London.</li>\n<li>This was a significant achievement, as it was one of the few medals India secured in shooting at the Olympics.</li>\n<li>He scored a total of <strong>30 points in the finals</strong>, finishing second behind Leuris Pupo of Cuba.</li>\n</ul></li>\n<li><strong>Other Indian Achievements in Shooting:</strong> <ul>\n<li>India has had notable achievements in shooting, including <strong>Abhinav Bindra's gold medal</strong> in the <strong>2008 Beijing Olympics</strong> in the 10m air rifle event.</li>\n<li>Shooters like <strong>Rajyavardhan Singh Rathore</strong> and <strong>Gagan Narang</strong> have also won medals in previous Olympic events.</li>\n</ul></li>\n<li><strong>About the 25m Rapid Pistol Event:</strong> <ul>\n<li>This event involves shooters firing at a target over a distance of <strong>25 meters</strong>.</li>\n<li>The competition consists of a qualification round and a final round, with shooters aiming to score maximum points through precision and speed.</li>\n<li>The event requires a combination of <strong>accuracy, timing, and mental focus</strong>, making it one of the most challenging shooting disciplines.</li>\n</ul></li>\n<li><strong>India at the 2012 London Olympics:</strong> <ul>\n<li>India achieved its highest-ever medal tally of <strong>6 medals</strong> at the 2012 London Olympics.</li>\n<li>These included <strong>2 silver</strong> medals and <strong>4 bronze</strong> medals across various disciplines like shooting, wrestling, and badminton.</li>\n</ul></li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Important Points</u></span></strong></span></p>\n<ul>\n<li><strong>Leuris Pupo:</strong> The Cuban shooter who won the gold medal ाइनल के लिए क्वालीफाई करने वाले पहले भारतीय निशानेबाज नहीं थे, क्योंकि अन्य भारतीय निशानेबाजों ने पिछली स्पर्धाओं में यह उपलब्धि हासिल की थी।</li>\n<li>उनके प्रदर्शन का निर्णायक क्षण छठे राउंड के दौरान दबाव में उनकी <strong>मानसिक लचीलापन और सटीकता</strong> थी, जिसने उन्हें फाइनल और अंततः पोडियम तक पहुंचाया।</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>अतिरिक्त जानकारी</u></span></strong></span></p>\n<ul>\n<li><strong>विजय कुमार की उपलब्धि:</strong> <ul>\n<li>विजय कुमार ने लंदन में आयोजित <strong>2012 ग्रीष्मकालीन ओलंपिक</strong> में <strong>पुरुषों की 25 मीटर रैपिड पिस्टल स्पर्धा</strong> में <strong>रजत पदक</strong> जीता।</li>\n<li>यह एक महत्वपूर्ण उपलब्धि थी, क्योंकि यह ओलंपिक में शूटिंग में भारत द्वारा हासिल किए गए कुछ पदकों में से एक था।</li>\n<li>उन्होंने फाइनल में कुल <strong>30 अंक</strong> बनाए, और क्यूबा के लेउरिस पुपो के बाद दूसरे स्थान पर रहे।</li>\n</ul></li>\n<li><strong>शूटिंग में अन्य भारतीय उपलब्धियां:</strong> <ul>\n<li>शूटिंग में भारत की उल्लेखनीय उपलब्धियां रही हैं, जिनमें <strong>अभिनव बिंद्रा का 2008 बीजिंग ओलंपिक</strong> में 10 मीटर एयर राइफल स्पर्धा में <strong>स्वर्ण पदक</strong> शामिल है।</li>\n<li><strong>राज्यवर्धन सिंह राठौर</strong> और <strong>गगन नारंग</strong> जैसे निशानेबाजों ने भी पिछली ओलंपिक स्पर्धाओं में पदक जीते हैं।</li>\n</ul></li>\n<li><strong>25 मीटर रैपिड पिस्टल स्पर्धा के बारे में:</strong> <ul>\n<li>इस स्पर्धा में निशानेबाज <strong>25 मीटर</strong> की दूरी पर एक लक्ष्य पर गोली मारते हैं।</li>\n<li>प्रतियोगिता में एक योग्यता दौर और एक फाइनल दौर होता है, जिसमें निशानेबाज सटीकता और गति के माध्यम से अधिकतम अंक प्राप्त करने का लक्ष्य रखते हैं।</li>\n<li>इस स्पर्धा में <strong>सटीकता, समय और मानसिक ध्यान</strong> के संयोजन की आवश्यकता होती है, जो इसे सबसे चुनौतीपूर्ण शूटिंग विषयों में से एक बनाती है।</li>\n</ul></li>\n<li><strong>2012 लंदन ओलंपिक में भारत:</strong> <ul>\n<li>भारत ने 2012 लंदन ओलंपिक में <strong>6 पदकों</strong> का अपना अब तक का सबसे अधिक पदक जीता।</li>\n<li>इनमें शूटिंग, कुश्ती और बैडमिंटन जैसे विभिन्न विषयों में <strong>2 रजत</strong> पदक और <strong>4 कांस्य</strong> पदक शामिल थे।</li>\n</ul></li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>महत्वपूर्ण बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>लेउरिस पुपो:</strong> क्यूबा के निशानेबाज जिन्होंने उसी स्पर्धा में स्वर्ण पदक जीता, फाइनल में <strong>34 अंक</strong> बनाए।</li>\n<li><strong>एक खेल के रूप में शूटिंग:</strong> शूटिंग <strong>1896</strong> से ओलंपिक खेलों का हिस्सा रही है, और भारत ने हाल के वर्षों में इस विषय में एक मजबूत उपस्थिति विकसित की है।</li>\n<li><strong>प्रशिक्षण और तैयारी:</strong> विजय कुमार की सफलता का श्रेय उनके कठोर प्रशिक्षण, तकनीकी कौशल और मानसिक तैयारी को दिया गया, जिसने उन्हें दबाव में उत्कृष्ट प्रदर्शन करने की अनुमति दी।</li>\n<li><strong>मान्यता:</strong> विजय कुमार के रजत पदक ने उन्हें व्यापक पहचान दिलाई, और उन्हें भारतीय खेलों में उनके योगदान के लिए प्रतिष्ठित <strong>राजीव गांधी खेल रत्न</strong> से सम्मानित किया गया।</li>\n</ul>88:Tf72,<p>The correct answer is <u><strong>Only statement 1 is correct</strong></u>.</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p>\n<ul>\n<li><strong>Statement 1:</strong> The novel <em>One Hundred Years of Solitude</em> by Gabriel Garcia Marquez employs the literary technique of <strong>magical realism</strong>. Magical realism blends magical or fantastical elements with realistic settings and events. The story narrates the rise and fall of the <strong>Buendía family</strong> in the fictional town of <strong>Macondo</strong>. This statement is <strong>correct</strong>.</li>\n<li><strong>Statement 2:</strong> The novel does not present a linear historical account focused solely on Colombia's political events in the 20th century. Instead, it intertwines personal, familial, and mythical narratives with broader political and social commentary, often using non-linear storytelling. This statement is <strong>incorrect</strong>.</li>\n<li>The book is a <strong>landmark work in Latin American literature</strong>, widely celebrated for its depiction of history, culture, and politics through a blend of realism and fantasy.</li>\n<li>Gabriel Garcia Marquez won the <strong>Nobel Prize in Literature in 1982</strong>, largely due to the impact of <em>One Hundred Years of Solitude</em>, which is considered his magnum opus.</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n<ul>\n<li><strong>Magical Realism:</strong>\n<ul>\n<li>Magical realism is a literary genre where magical elements are presented as a natural part of an otherwise realistic environment.</li>\n<li>In <em>One Hundred Years of Solitude</em>, events like ascensions to heaven, ghosts, and extraordinary weather phenomena are presented as everyday occurrences in Macondo.</li>\n<li>This style allows Marquez to explore the complexities of Latin American history and culture in a symbolic and imaginative manner.</li>\n</ul>\n</li>\n<li><strong>Macondo:</strong>\n<ul>\n<li>Macondo is a fictional town that serves as the primary setting for the novel.</li>\n<li>It is inspired by Marquez's hometown of <strong>Aracataca, Colombia</strong>.</li>\n<li>The town becomes a microcosm of Latin American society, reflecting its struggles with colonialism, political turmoil, and modernization.</li>\n</ul>\n</li>\n<li><strong>The Buendía Family:</strong>\n<ul>\n<li>The narrative spans seven generations of the Buendía family, chronicling their triumphs, tragedies, and eventual decline.</li>\n<li>The family members often repeat the same mistakes, symbolizing the cyclical nature of history and human behavior.</li>\n</ul>\n</li>\n<li><strong>Political and Social Commentary:</strong>\n<ul>\n<li>While the novel is not a direct historical account, it draws heavily on the political and social history of Colombia and Latin America.</li>\n<li>Events such as civil wars, the banana massacre, and the exploitation of workers by foreign companies are allegorically depicted in the story.</li>\n</ul>\n</li>\n<li><strong>Significance of the Novel:</strong>\n<ul>\n<li><em>One Hundred Years of Solitude</em> is considered one of the greatest literary works of the 20th century.</li>\n<li>It played a crucial role in the rise of the <strong>Latin American Boom</strong>, a literary movement that brought global attention to Latin American authors.</li>\n<li>The novel has been translated into more than 40 languages and has sold over 50 million copies worldwide.</li>\n</ul>\n</li>\n</ul>89:T1ff6,<p>सही उत्तर है <u><strong>केवल कथन 1 सही है</strong></u>।</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>मुख्य बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>कथन 1:</strong> गैब्रियल गार्सिया मार्केज़ के उपन्यास <em>वन हंड्रेड इयर्स ऑफ़ सॉलिट्यूड</em> में <strong>जादुई यथार्थवाद</strong> की साहित्यिक तकनीक का उपयोग किया गया है। जादुई यथार्थवाद जादुई या काल्पनिक तत्वों को यथार्थवादी सेटिंग्स और घटनाओं के साथ मिलाता है। कहानी <strong>मैकोंडो</strong> के काल्पनिक शहर में <strong>बुएंदिया परिवार</strong> के उत्थान और पतन का वर्णन करती है। यह कथन <strong>सही</strong> है।</li>\n<li><strong>कथन 2:</strong> उपन्यास 20वीं शताब्दी में कोलंबिया की राजनीतिक घटनाओं पर केंद्रित एक रैखिक ऐतिहासिक विवरण प्रस्तुत नहीं करता है। इसके बजाय, यह व्यक्तिगत, पारिवारिक और पौराणिक कथाओं को व्यापक राजनीतिक और सामाजिक टिप्पणी के साथ जोड़ता है, अक्सर गैर-रैखिक कहानी कहने का उपयोग करता है। यह कथन <strong>गलत</strong> है।</li>\n<li>यह पुस्तक <strong>लैटिन अमेरिकी साहित्य में एक मील का पत्थर</strong> है, जिसे व्यापक रूप से यथार्थवाद और कल्पना के मिश्रण के माध्यम से इतिहास, संस्कृति और राजनीति के चित्रण के लिए मनाया जाता है।</li>\n<li>गैब्रियल गार्सिया मार्केज़ ने <strong>1982 में साहित्य में नोबेल पुरस्कार</strong> जीता, जिसका मुख्य कारण <em>वन हंड्रेड इयर्स ऑफ़ सॉलिट्यूड</em> का प्रभाव था, जिसे उनकी उत्कृष्ट कृति माना जाता है।</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>अतिरिक्त जानकारी</u></span></strong></span></p>\n<ul>\n<li><strong>जादुई यथार्थवाद:</strong>\n<ul>\n<li>जादुई यथार्थवाद एक साहित्यिक शैली है जहाँ जादुई तत्वों को एक अन्यथा यथार्थवादी वातावरण के एक प्राकृतिक भाग के रूप में प्रस्तुत किया जाता है।</li>\n<li><em>वन हंड्रेड इयर्स ऑफ़ सॉलिट्यूड</em> में, स्वर्ग में आरोहण, भूत और असाधारण मौसम की घटनाओं जैसी घटनाओं को मैकोंडो में रोजमर्रा की घटनाओं के रूप में प्रस्तुत किया जाता है।</li>\n<li>यह शैली मार्केज़ को प्रतीकात्मक और कल्पनाशील तरीके से लैटिन अमेरिकी इतिहास और संस्कृति की जटिलताओं का पता लगाने की अनुमति देती है।</li>\n</ul>\n</li>\n<li><strong>मैकोंडो:</strong>\n<ul>\n<li>मैकोंडो एक काल्पनिक शहर है जो उपन्यास के लिए प्राथमिक सेटिंग के रूप में कार्य करता है।</li>\n<li>यह मार्केज़ के गृहनगर <strong>अराकाटाका, कोलंबिया</strong> से प्रेरित है।</li>\n<li>यह शहर लैटिन अमेरिकी समाज का एक सूक्ष्म जगत बन जाता है, जो उपनिवेशवाद, राजनीतिक उथल-पुथल और आधुनिकीकरण के साथ अपने संघर्षों को दर्शाता है।</li>\n</ul>\n</li>\n<li><strong>बुएंदिया परिवार:</strong>\n<ul>\n<li>कथा बुएंदिया परिवार की सात पीढ़ियों तक फैली हुई है, जो उनकी जीत, त्रासदियों और अंतिम पतन का वर्णन करती है।</li>\n<li>परिवार के सदस्य अक्सर एक ही गलतियों को दोहराते हैं, जो इतिहास और मानव व्यवहार की चक्रीय प्रकृति का प्रतीक है।</li>\n</ul>\n</li>\n<li><strong>राजनीतिक और सामाजिक टिप्पणी:</strong>\n<ul>\n<li>हालांकि उपन्यास एक प्रत्यक्ष ऐतिहासिक विवरण नहीं है, लेकिन यह कोलंबिया और लैटिन अमेरिका के राजनीतिक और सामाजिक इतिहास पर बहुत अधिक निर्भर करता है।</li>\n<li>गृह युद्ध, केले नरसंहार और विदेशी कंपनियों द्वारा श्रमिकों के शोषण जैसी घटनाओं को कहानी में रूपक रूप से दर्शाया गया है।</li>\n</ul>\n</li>\n<li><strong>उपन्यास का महत्व:</strong>\n<ul>\n<li><em>वन हंड्रेड इयर्स ऑफ़ सॉलिट्यूड</em> को 20वीं शताब्दी की महानतम साहित्यिक कृतियों में से एक माना जाता है।</li>\n<li>इसने <strong>लैटिन अमेरिकी बूम</strong> के उदय में महत्वपूर्ण भूमिका निभाई, एक साहित्यिक आंदोलन जिसने लैटिन अमेरिकी लेखकों पर वैश्विक ध्यान आकर्षित किया।</li>\n<li>उपन्यास का 40 से अधिक भाषाओं में अनुवाद किया गया है और दुनिया भर में 50 मिलियन से अधिक प्रतियां बिक चुकी हैं।</li>\n</ul>\n</li>\n</ul>8a:T1274,<p>The correct answer is <u><strong>President</strong></u>.</p> <p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p> <ul> <li><strong>Financial Emergency</strong>: The term \"Financial Emergency\" is defined under <strong>Article 360</strong> of the <strong>Indian Constitution</strong>. It allows the <strong>President</strong> of India to take specific measures to safeguard the financial stability of the country.</li> <li>During a Financial Emergency, the <strong>President</strong> has the power to reduce the salaries and allowances of all government employees, including <strong>judges of the Supreme Court and High Courts</strong>.</li> <li>Such measures are implemented to ensure the proper allocation and management of financial resources during the crisis. <em><strong>Hence, the correct answer is \"President.\"</strong></em></li> <li>The proclamation of a Financial Emergency requires the approval of both Houses of Parliament within two months of its issuance.</li> <li>Once approved, the <strong>President</strong> can issue directions to the States regarding financial matters, aiming to control expenditure and maintain fiscal stability.</li> </ul> <p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p> <ul> <li><strong>Article 360:</strong> <ul> <li>Article 360 of the <strong>Indian Constitution</strong> empowers the <strong>President</strong> to declare a Financial Emergency if he/she is convinced that the financial stability or credit of India is under threat.</li> <li>It is considered one of the special provisions under emergency powers granted to the central government.</li> </ul> </li> <li><strong>Implications of Financial Emergency:</strong> <ul> <li>The <strong>Union Government</strong> can direct states to follow specific financial policies to maintain fiscal discipline.</li> <li>The salaries and allowances of government officials, including judges of the <strong>Supreme Court and High Courts</strong>, can be reduced.</li> <li>Such measures aim to ensure the proper utilization of financial resources during an economic crisis.</li> </ul> </li> <li><strong>Examples of Emergency Provisions:</strong> <ul> <li>The Indian Constitution provides for three types of emergencies: <strong>National Emergency</strong> (Article 352), <strong>State Emergency</strong> (Article 356), and <strong>Financial Emergency</strong> (Article 360).</li> <li>While National and State Emergencies have been declared in India, a Financial Emergency has never been invoked.</li> </ul> </li> <li><strong>Role of Parliament:</strong> <ul> <li>The proclamation of a Financial Emergency must be approved by both Houses of Parliament within two months.</li> <li>If not approved, the proclamation ceases to operate at the end of the two-month period.</li> <li>The Parliament has the authority to revoke the Financial Emergency at any time through a resolution.</li> </ul> </li> </ul> <p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Important Points</u></span></strong></span></p> <ul> <li><strong>President's Role:</strong> <ul> <li>The <strong>President</strong> is empowered to take necessary actions during a Financial Emergency, including issuing directions to states and reducing government salaries.</li> <li>The <strong>President</strong> acts on the advice of the <strong>Council of Ministers</strong>, led by the <strong>Prime Minister</strong>.</li> </ul> </li> <li><strong>Judiciary and Financial Emergency:</strong> <ul> <li>The judiciary's independence remains intact, but their salaries and allowances can be reduced under Financial Emergency provisions.</li> <li>Such measures are temporary and aim to stabilize the financial health of the nation.</li> </ul> </li> <li><strong>Historical Context:</strong> <ul> <li>India has faced several economic challenges, but a Financial Emergency under Article 360 has never been declared.</li> <li>The provision serves as a safeguard for extreme situations affecting the country's fiscal stability.</li> </ul> </li> </ul>8b:T23d3,<p>सही उत्तर <u><strong>राष्ट्रपति</strong></u> है।</p> <p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>मुख्य बिंदु</u></span></strong></span></p> <ul> <li><strong>वित्तीय आपातकाल</strong>: \"वित्तीय आपातकाल\" शब्द को <strong>भारतीय संविधान</strong> के <strong>अनुच्छेद 360</strong> के तहत परिभाषित किया गया है। यह भारत के <strong>राष्ट्रपति</strong> को देश की वित्तीय स्थिरता की रक्षा के लिए विशिष्ट उपाय करने की अनुमति देता है।</li> <li>वित्तीय आपातकाल के दौरान, <strong>राष्ट्रपति</strong> के पास सर्वोच्च न्यायालय और उच्च न्यायालयों के <strong>न्यायाधीशों</strong> सहित सभी सरकारी कर्मचारियों के वेतन और भत्ते को कम करने की शक्ति होती है।</li> <li>ऐसे उपाय संकट के दौरान वित्तीय संसाधनों के उचित आवंटन और प्रबंधन को सुनिश्चित करने के लिए लागू किए जाते हैं। <em><strong>इसलिए, सही उत्तर \"राष्ट्रपति\" है।</strong></em></li> <li>वित्तीय आपातकाल की घोषणा के लिए इसके जारी होने के दो महीने के भीतर संसद के दोनों सदनों द्वारा अनुमोदन की आवश्यकता होती है।</li> <li>एक बार स्वीकृत हो जाने पर, <strong>राष्ट्रपति</strong> वित्तीय मामलों के संबंध में राज्यों को निर्देश जारी कर सकते हैं, जिसका उद्देश्य व्यय को नियंत्रित करना और राजकोषीय स्थिरता बनाए रखना है।</li> </ul> <p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>अतिरिक्त जानकारी</u></span></strong></span></p> <ul> <li><strong>अनुच्छेद 360:</strong> <ul> <li><strong>भारतीय संविधान</strong> का अनुच्छेद 360 <strong>राष्ट्रपति</strong> को वित्तीय आपातकाल घोषित करने का अधिकार देता है यदि वह/उसे विश्वास हो कि भारत की वित्तीय स्थिरता या ऋण खतरे में है।</li> <li>इसे केंद्र सरकार को दी गई आपातकालीन शक्तियों के तहत विशेष प्रावधानों में से एक माना जाता है।</li> </ul> </li> <li><strong>वित्तीय आपातकाल के निहितार्थ:</strong> <ul> <li><strong>संघ सरकार</strong> राजकोषीय अनुशासन बनाए रखने के लिए राज्यों को विशिष्ट वित्तीय नीतियों का पालन करने का निर्देश दे सकती है।</li> <li><strong>सर्वोच्च न्यायालय और उच्च न्यायालयों</strong> के न्यायाधीशों सहित सरकारी अधिकारियों के वेतन और भत्ते को कम किया जा सकता है।</li> <li>ऐसे उपायों का उद्देश्य आर्थिक संकट के दौरान वित्तीय संसाधनों का उचित उपयोग सुनिश्चित करना है।</li> </ul> </li> <li><strong>आपातकालीन प्रावधानों के उदाहरण:</strong> <ul> <li>भारतीय संविधान तीन प्रकार की आपात स्थितियों का प्रावधान करता है: <strong>राष्ट्रीय आपातकाल</strong> (अनुच्छेद 352), <strong>राज्य आपातकाल</strong> (अनुच्छेद 356), और <strong>वित्तीय आपातकाल</strong> (अनुच्छेद 360)।</li> <li>जबकि भारत में राष्ट्रीय और राज्य आपातकाल घोषित किए गए हैं, वित्तीय आपातकाल कभी भी लागू नहीं किया गया है।</li> </ul> </li> <li><strong>संसद की भूमिका:</strong> <ul> <li>वित्तीय आपातकाल की घोषणा को दो महीने के भीतर संसद के दोनों सदनों द्वारा अनुमोदित किया जाना चाहिए।</li> <li>यदि अनुमोदित नहीं किया जाता है, तो घोषणा दो महीने की अवधि के अंत में संचालित होना बंद हो जाती है।</li> <li>संसद के पास एक प्रस्ताव के माध्यम से किसी भी समय वित्तीय आपातकाल को रद्द करने का अधिकार है।</li> </ul> </li> </ul> <p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>महत्वपूर्ण बिंदु</u></span></strong></span></p> <ul> <li><strong>राष्ट्रपति की भूमिका:</strong> <ul> <li><strong>राष्ट्रपति</strong> को वित्तीय आपातकाल के दौरान आवश्यक कार्रवाई करने का अधिकार है, जिसमें राज्यों को निर्देश जारी करना और सर gn tools are specifically developed for modeling cryogenic fuel tanks used in PSLV variants.</strong>\n<ul>\n<li>This statement is <strong>false</strong>. While generative design tools can be applied to a variety of engineering problems, they are not specifically developed for modeling cryogenic fuel tanks used in PSLV (Polar Satellite Launch Vehicle) variants.</li>\n<li>Cryogenic fuel tanks are designed using specialized engineering techniques focusing on material properties, thermal insulation, and structural strength to handle extremely low temperatures, but these do not rely solely on generative design tools.</li>\n</ul>\n</li>\n<li><strong>Conclusion:</strong> The assertion is correct, but the reason provided does not justify the assertion. Therefore, the correct answer is <u><strong>3) A is true, but R is false</strong></u>.</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n<ul>\n<li><strong>Generative Design Software:</strong>\n<ul>\n<li>It is an advanced computational design approach that uses <strong>AI and algorithms</strong> to generate design alternatives based on specific constraints and objectives.</li>\n<li>The software is widely used in <strong>industries like aerospace, automotive, and architecture</strong> for optimizing designs.</li>\n<li>Applications include lightweighting components, improving structural performance, and enhancing material utilization.</li>\n<li>It integrates seamlessly with 3D printing and advanced manufacturing techniques for efficient production.</li>\n</ul>\n</li>\n<li><strong>ISRO's Use of Advanced Technologies:</strong>\n<ul>\n<li>ISRO employs technologies like <strong>topology optimization</strong>, additive manufacturing, and generative design to enhance the efficiency of spacecraft and launch vehicles.</li>\n<li>Weight optimization is critical for launch vehicles like <strong>PSLV, GSLV, and Gaganyaan</strong> to maximize payload capacity while minimizing fuel consumption.</li>\n<li>ISRO also focuses on materials science innovations to develop stronger, lightweight alloys and composites for spacecraft components.</li>\n</ul>\n</li>\n<li><strong>Cryogenic Fuel Tanks:</strong>\n<ul>\n<li>Cryogenic fuel tanks are used to store liquid fuels like <strong>liquid hydrogen (LH2) and liquid oxygen (LOX)</strong> at extremely low temperatures.</li>\n<li>They are engineered using materials like aluminum alloys and composites that can withstand thermal stresses and prevent leakage.</li>\n<li>Specialized thermal insulation is applied to maintain the low temperatures required for cryogenic fuels.</li>\n</ul>\n</li>\n<li><strong>PSLV (Polar Satellite Launch Vehicle):</strong>\n<ul>\n<li>PSLV is one of ISRO's most reliable launch vehicles, capable of deploying satellites into polar orbits.</li>\n<li>It uses a combination of solid and liquid propulsion systems, but it does not rely solely on cryogenic technology (used more prominently in GSLV).</li>\n<li>Generative design software has been employed in optimizing the design of PSLV components to enhance its performance.</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Important Points</u></span></strong></span></p>\n<ul>\n<li><strong>ISRO and Generative Design:</strong>\n<ul>\n<li>ISRO collaborates with organizations like <strong>NASA</strong>, <strong>DRDO</strong>, and private companies to incorporate cutting-edge technologies, including AI-driven generative design.</li>\n<li>Generative design tools help ISRO in areas such as structural analysis, thermal management, and weight optimization of spacecraft and launch vehicles.</li>\n</ul>\n</li>\n<li><strong>Generative Design Applications:</strong>\n<ul>\n<li>Beyond aerospace, generative design is used in <strong>automotive</strong> (e.g., lightweight car parts), <strong>architecture</strong> (e.g., optimized building structures), and <strong>medical devices</strong> (e.g., customized implants).</li>\n<li>It is a growing field with increasing applications in advanced manufacturing and sustainability initiatives.</li>\n</ul>\n</li>\n</ul>\n```8d:T2ef3,<p>सही उत्तर है <u><strong>3) A सत्य है, लेकिन R असत्य है</strong></u>।</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>मुख्य बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>अभिकथन (A): जेनरेटिव डिजाइन सॉफ्टवेयर का उपयोग ISRO द्वारा एयरोस्पेस घटकों में संरचना और वजन वितरण को अनुकूलित करने के लिए तेजी से किया जा रहा है।</strong>\n<ul>\n<li>यह कथन <strong>सही</strong> है। ISRO (भारतीय अंतरिक्ष अनुसंधान संगठन) एयरोस्पेस घटकों की संरचनात्मक अखंडता और वजन वितरण को अनुकूलित करने के लिए जेनरेटिव डिजाइन सॉफ्टवेयर जैसी उन्नत तकनीकों का उपयोग करता है।</li>\n<li>जेनरेटिव डिजाइन संभावित डिजाइन समाधानों का पता लगाने के लिए एल्गोरिदम और AI का उपयोग करता है, जिससे एयरोस्पेस अनुप्रयोगों में दक्षता और प्रदर्शन में सुधार होता है।</li>\n<li>यह घटकों के वजन को कम करने में महत्वपूर्ण भूमिका निभाता है, जो अंतरिक्ष अन्वेषण में पेलोड क्षमता को बढ़ाने और लागत को कम करने के लिए महत्वपूर्ण है।</li>\n</ul>\n</li>\n<li><strong>कारण (R): जेनरेटिव डिजाइन उपकरण विशेष रूप से PSLV वेरिएंट में उपयोग किए जाने वाले क्रायोजेनिक ईंधन टैंकों के मॉडलिंग के लिए विकसित किए गए हैं।</strong>\n<ul>\n<li>यह कथन <strong>गलत</strong> है। जबकि जेनरेटिव डिजाइन उपकरणों को विभिन्न प्रकार की इंजीनियरिंग समस्याओं पर लागू किया जा सकता है, लेकिन वे विशेष रूप से PSLV (ध्रुवीय उपग्रह प्रक्षेपण यान) वेरिएंट में उपयोग किए जाने वाले क्रायोजेनिक ईंधन टैंकों के मॉडलिंग के लिए विकसित नहीं किए गए हैं।</li>\n<li>क्रायोजेनिक ईंधन टैंकों को विशेष इंजीनियरिंग तकनीकों का उपयोग करके डिज़ाइन किया गया है जो सामग्री गुणों, थर्मल इन्सुलेशन और संरचनात्मक शक्ति पर ध्यान केंद्रित करते हैं ताकि बेहद कम तापमान को संभाला जा सके, लेकिन ये पूरी तरह से जेनरेटिव डिजाइन उपकरणों पर निर्भर नहीं होते हैं।</li>\n</ul>\n</li>\n<li><strong>निष्कर्ष:</strong> अभिकथन सही है, लेकिन दिया गया कारण अभिकथन को सही नहीं ठहराता है। इसलिए, सही उत्तर है <u><strong>3) A सत्य है, लेकिन R असत्य है</strong></u>।</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>अतिरिक्त जानकारी</u></span></strong></span></p>\n<ul>\n<li><strong>जेनरेटिव डिजाइन सॉफ्टवेयर:</strong>\n<ul>\n<li>यह एक उन्नत कम्प्यूटेशनल डिजाइन दृष्टिकोण है जो विशिष्ट बाधाओं और उद्देश्यों के आधार पर डिजाइन विकल्पों को उत्पन्न करने के लिए <strong>AI और एल्गोरिदम</strong> का उपयोग करता है।</li>\n<li>सॉफ्टवेयर का उपयोग व्यापक रूप से <strong>एयरोस्पेस, ऑटोमोटिव और आर्किटेक्चर जैसे उद्योगों</strong> में डिजाइनों को अनुकूलित करने के लिए किया जाता है।</li>\n<li>अनुप्रयोगों में हल्के घटकों, संरचनात्मक प्रदर्शन में सुधार और सामग्री उपयोग को बढ़ाना शामिल है।</li>\n<li>यह कुशल उत्पादन के लिए 3D प्रिंटिंग और उन्नत विनिर्माण तकनीकों के साथ सहजता से एकीकृत होता है।</li>\n</ul>\n</li>\n<li><strong>उन्नत तकनीकों का ISRO का उपयोग:</strong>\n<ul>\n<li>ISRO अंतरिक्ष यान और प्रक्षेपण यान की दक्षता बढ़ाने के लिए <strong>टोपोलॉजी अनुकूलन</strong>, एडिटिव मैन्युफैक्चरिंग और जेनरेटिव डिजाइन जैसी तकनीकों का उपयोग करता है।</li>\n<li>ईंधन की खपत को कम करते हुए पेलोड क्षमता को अधिकतम करने के लिए <strong>PSLV, GSLV और गगनयान</strong> जैसे h shooters aiming to score maximum points through precision and speed.</li>\n<li>The event requires a combination of <strong>accuracy, timing, and mental focus</strong>, making it one of the most challenging shooting disciplines.</li>\n</ul></li>\n<li><strong>India at the 2012 London Olympics:</strong> <ul>\n<li>India achieved its highest-ever medal tally of <strong>6 medals</strong> at the 2012 London Olympics.</li>\n<li>These included <strong>2 silver</strong> medals and <strong>4 bronze</strong> medals across various disciplines like shooting, wrestling, and badminton.</li>\n</ul></li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Important Points</u></span></strong></span></p>\n<ul>\n<li><strong>Leuris Pupo:</strong> The Cuban shooter who won the gold medal in the same event, scoring <strong>34 points</strong> in the finals.</li>\n<li><strong>Shooting as a Sport:</strong> Shooting has been a part of the Olympic Games since <strong>1896</strong>, and India has developed a strong presence in this discipline in recent years.</li>\n<li><strong>Training and Preparation:</strong> Vijay Kumar's success was attributed to his rigorous training, technical skills, and mental preparation, which allowed him to excel under pressure.</li>\n<li><strong>Recognition:</strong> Vijay Kumar's silver medal brought widespread recognition to him, and he was awarded the prestigious <strong>Rajiv Gandhi Khel Ratna</strong> for his contribution to Indian sports.</li>\n</ul>\n```87:T2374,<p>सही उत्तर है <u><strong>वह फाइनल राउंड में पहुंचने के लिए छठे राउंड में एक बंधे हुए प्रतियोगी को पछाड़ दिया।</strong></u></p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>मुख्य बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>विजय कुमार</strong>, एक भारतीय निशानेबाज, ने <strong>लंदन 2012 ओलंपिक</strong> में <strong>पुरुषों की 25 मीटर रैपिड पिस्टल स्पर्धा</strong> में असाधारण प्रदर्शन किया।</li>\n<li>उन्हें प्रतियोगिता के दौरान एक गंभीर स्थिति का सामना करना पड़ा, जहां वह <strong>छठे राउंड</strong> में एक अन्य प्रतियोगी के साथ बंधे हुए थे। <strong>बंधे हुए प्रतियोगी को पछाड़ने</strong> की उनकी क्षमता ने उन्हें फाइनल राउंड में जगह सुरक्षित करने की अनुमति दी। <em><span style=\"font-weight: bolder;\">इसलिए, यह उनके प्रदर्शन में विशिष्ट कारक था।</span></em></li>\n<li>विजय कुमार ने अंततः <strong>रजत पदक</strong> जीता, जो शूटिंग खेलों में भारत के लिए एक महत्वपूर्ण उपलब्धि है।</li>\n<li>अन्य विकल्पों के विपरीत, उन्होंने <strong>कोई नया विश्व रिकॉर्ड</strong> नहीं बनाया और न ही उन्होंने <strong>स्वर्ण</strong> जीता। इसके अतिरिक्त, वह फाइनल के लिए क्वालीफाई करने वाले पहले भारतीय निशानेबाज नहीं थे, क्योंकि अन्य भारतीय निशानेबाजों ने पिछली स्पर्धाओं में यह उपलब्धि हासिल की थी।</li>\n<li>उनके प्रदर्शन का निर्णायक क्षण छठे राउंड के दौरान दबाव में उनकी <strong>मानसिक लचीलापन और सटीकता</strong> थी, जिसने उन्हें फाइनल और अंततः पोडियम तक पहुंचाया।</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>अतिरिक्त जानकारी</u></span></strong></span></p>\n<ul>\n<li><strong>विजय कुमार की उपलब्धि:</strong> <ul>\n<li>विजय कुमार ने लंदन में आयोजित <strong>2012 ग्रीष्मकालीन ओलंपिक</strong> में <strong>पुरुषों की 25 मीटर रैपिड पिस्टल स्पर्धा</strong> में <strong>रजत पदक</strong> जीता।</li>\n<li>यह एक महत्वपूर्ण उपलब्धि थी, क्योंकि यह ओलंपिक में शूटिंग में भारत द्वारा हासिल किए गए कुछ पदकों में से एक था।</li>\n<li>उन्होंने फाइनल में कुल <strong>30 अंक</strong> बनाए, और क्यूबा के लेउरिस पुपो के बाद दूसरे स्थान पर रहे।</li>\n</ul></li>\n<li><strong>शूटिंग में अन्य भारतीय उपलब्धियां:</strong> <ul>\n<li>शूटिंग में भारत की उल्लेखनीय उपलब्धियां रही हैं, जिनमें <strong>अभिनव बिंद्रा का 2008 बीजिंग ओलंपिक</strong> में 10 मीटर एयर राइफल स्पर्धा में <strong>स्वर्ण पदक</strong> शामिल है।</li>\n<li><strong>राज्यवर्धन सिंह राठौर</strong> और <strong>गगन नारंग</strong> जैसे निशानेबाजों ने भी पिछली ओलंपिक स्पर्धाओं में पदक जीते हैं।</li>\n</ul></li>\n<li><strong>25 मीटर रैपिड पिस्टल स्पर्धा के बारे में:</strong> <ul>\n<li>इस स्पर्धा में निशानेबाज <strong>25 मीटर</strong> की दूरी पर एक लक्ष्य पर गोली मारते हैं।</li>\n<li>प्रतियोगिता में एक योग्यता दौर और एक फाइनल दौर होता है, जिसमें निशानेबाज सटीकता और गति के माध्यम से अधिकतम अंक प्राप्त करने का लक्ष्य रखते हैं।</li>\n<li>इस स्पर्धा में <strong>सटीकता, समय और मानसिक ध्यान</strong> के संयोजन की आवश्यकता होती है, जो इसे सबसे चुनौतीपूर्ण शूटिंग विषयों में से एक बनाती है।</li>\n</ul></li>\n<li><strong>2012 लंदन ओलंपिक में भारत:</strong> <ul>\n<li>भारत ने 2012 लंदन ओलंपिक में <strong>6 पदकों</strong> का अपना अब तक का सबसे अधिक पदक जीता।</li>\n<li>इनमें शूटिंग, कुश्ती और बैडमिंटन जैसे विभिन्न विषयों में <strong>2 रजत</strong> पदक और <strong>4 कांस्य</strong> पदक शामिल थे।</li>\n</ul></li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>महत्वपूर्ण बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>लेउरिस पुपो:</strong> क्यूबा के निशानेबाज जिन्होंने उसी स्पर्धा में स्वर्ण पदक जीता, फाइनल में <strong>34 अंक</strong> बनाए।</li>\n<li><strong>एक खेल के रूप में शूटिंग:</strong> शूटिंग <strong>1896</strong> से ओलंपिक खेलों का हिस्सा रही है, और भारत ने हाल के वर्षों में इस विषय में एक मजबूत उपस्थिति विकसित की है।</li>\n<li><strong>प्रशिक्षण और तैयारी:</strong> विजय कुमार की सफलता का श्रेय उनके कठोर प्रशिक्षण, तकनीकी कौशल और मानसिक तैयारी को दिया गया, जिसने उन्हें दबाव में उत्कृष्ट प्रदर्शन करने की अनुमति दी।</li>\n<li><strong>मान्यता:</strong> विजय कुमार के रजत पदक ने उन्हें व्यापक पहचान दिलाई, और उन्हें भारतीय खेलों में उनके योगदान के लिए प्रतिष्ठित <strong>राजीव गांधी खेल रत्न</strong> से सम्मानित किया गया।</li>\n</ul>88:Tf72,<p>The correct answer is <u><strong>Only statement 1 is correct</strong></u>.</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p>\n<ul>\n<li><strong>Statement 1:</strong> The novel <em>One Hundred Years of Solitude</em> by Gabriel Garcia Marquez employs the literary technique of <strong>magical realism</strong>. Magical realism blends magical or fantastical elements with realistic settings and events. The story narrates the rise and fall of the <strong>Buendía family</strong> in the fictional town of <strong>Macondo</strong>. This statement is <strong>correct</strong>.</li>\n<li><strong>Statement 2:</strong> The novel does not present a linear historical account focused solely on Colombia's political events in the 20th century. Instead, it intertwines personal, familial, and mythical narratives with broader political and social commentary, often using non-linear storytelling. This statement is <strong>incorrect</strong>.</li>\n<li>The book is a <strong>landmark work in Latin American literature</strong>, widely celebrated for its depiction of history, culture, and politics through a blend of realism and fantasy.</li>\n<li>Gabriel Garcia Marquez won the <strong>Nobel Prize in Literature in 1982</strong>, largely due to the impact of <em>One Hundred Years of Solitude</em>,
