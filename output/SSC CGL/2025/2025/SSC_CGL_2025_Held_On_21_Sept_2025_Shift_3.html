ं में से एक है, और तालचेर राज्य और राष्ट्र की ऊर्जा आवश्यकताओं में महत्वपूर्ण योगदान देकर इस क्षेत्र में एक महत्वपूर्ण भूमिका निभाता है।</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>अतिरिक्त जानकारी</u></span></strong></span></p>\n<ul>\n<li><strong>तालचेर का औद्योगिक महत्व:</strong>\n<ul>\n<li>तालचेर में कोयला खनन, बिजली उत्पादन और उर्वरक उत्पादन सहित विभिन्न प्रकार के उद्योग हैं, जो इसे एक औद्योगिक रूप से समृद्ध क्षेत्र बनाते हैं।</li>\n<li><strong>तालचेर सुपर थर्मल पावर स्टेशन</strong>, जो इसी क्षेत्र में स्थित है, की बिजली उत्पादन क्षमता 3,000 मेगावाट से अधिक है, जो इसे भारत के सबसे बड़े बिजली संयंत्रों में से एक बनाती है।</li>\n</ul>\n</li>\n<li><strong>तालचेर में कोयला खनन:</strong>\n<ul>\n<li>तालचेर <strong>महानदी कोलफील्ड्स लिमिटेड (MCL)</strong> का हिस्सा है, जो कोल इंडिया लिमिटेड (CIL) की सहायक कंपनी है, जो इस क्षेत्र में कोयला खनन कार्यों के लिए जिम्मेदार है।</li>\n<li>यहां खनन किए गए कोयले का उपयोग मुख्य रूप से बिजली उत्पादन और औद्योगिक उद्देश्यों के लिए किया जाता है, जो देश भर में घरेलू और औद्योगिक उपभोक्ताओं दोनों की जरूरतों को पूरा करता है।</li>\n</ul>\n</li>\n<li><strong>स्थान और कनेक्टिविटी:</strong>\n<ul>\n<li>तालचेर रेल और सड़क मार्ग से ओडिशा और पड़ोसी राज्यों के प्रमुख शहरों से अच्छी तरह से जुड़ा हुआ है, जिससे कोयले और अन्य औद्योगिक सामानों के परिवहन में आसानी होती है।</li>\n<li>तालचेर का निकटतम हवाई अड्डा भुवनेश्वर में <strong>बीजू पटनायक अंतर्राष्ट्रीय हवाई अड्डा</strong> है, जो लगभग 140 किमी दूर स्थित है।</li>\n</ul>\n</li>\n<li><strong>ओडिशा में बिजली उत्पादन:</strong>\n<ul>\n<li>ओडिशा भारत के ऊर्जा क्षेत्र में एक प्रमुख योगदानकर्ता है, जिसमें राज्य भर में कई थर्मल, हाइड्रो और नवीकरणीय ऊर्जा परियोजनाएं फैली हुई हैं।</li>\n<li>राज्य का ऊर्जा उत्पादन न केवल अपनी जरूरतों को पूरा करता है बल्कि भारत के अन्य हिस्सों को भी बिजली की आपूर्ति करता है।</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>महत्वपूर्ण बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>एनटीपीसी लिमिटेड:</strong>\n<ul>\n<li>एनटीपीसी लिमिटेड, जिसे पहले नेशनल थर्मल पावर कॉरपोरेशन के नाम से जाना जाता था, भारत सरकार के विद्युत मंत्रालय के तहत एक <strong>केंद्रीय सार्वजनिक क्षेत्र का उपक्रम</strong> है।</li>\n<li>यह भारत की सबसे बड़ी बिजली उपयोगिता है और देश के बिजली उत्पादन में महत्वपूर्ण योगदान करती है।</li>\n</ul>\n</li>\n<li><strong>महानदी कोलफील्ड्स लिमिटेड (MCL):</strong>\n<ul>\n<li>MCL <strong>कोल इंडिया लिमिटेड (CIL)</strong> की प्रमुख सहायक कंपनियों में से एक है और ओडिशा में कोयला निष्कर्षण में महत्वपूर्ण भूमिका निभाती है।</li>\n<li>तालचेर और उसके आसपास के कोयला क्षेत्र देश के सबसे अधिक उत्पादक क्षेत्रों में से कुछ हैं।</li>\n</ul>\n</li>\n<li><strong>ओडिशा का ऊर्जा क्षेत्र:</strong>\n<ul>\n<li>ओडिशा स्थापित बिजली उत्पादन क्षमता के मामले में भारत के अग्रणी राज्यों में से एक है, जिसमें थर्मल, हाइड्रो और नवीकरणीय ऊर्जा परियोजनाओं का मिश्रण है।</li>\n<li>कोयला, बॉक्साइट और लौह अयस्क सहित राज्य के समृद्ध प्राकृतिक संसाधन, इसकी औद्योगिक और ऊर्जा उत्पादन क्षमताओं में योगदान करते हैं।</li>\n</ul>\n</li>\n</ul>", "marks": 2, "negMarks": 0.5}, {"text": "Who among the following was the Chief Guest at India's Republic Day celebrations in 2025?", "options": ["Joe Biden", "H.E. Prabowo Subianto", "Emmanuel Macron", "Fumio Kishida"], "correct": 2, "solution": "<p>The correct answer is <u><strong>H.E. Prabowo Subianto</strong></u>.</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p>\n<ul>\n<li><strong>H.E. Prabowo Subianto</strong>, the Defense Minister of <strong>Indonesia</strong>, was the Chief Guest at <strong>India's Republic Day celebrations in 2025</strong>.</li>\n<li>The tradition of inviting a foreign dignitary as the Chief Guest for Republic Day began in <strong>1950</strong>, with the Indonesian President Sukarno being the first Chief Guest.</li>\n<li>Indonesia shares <strong>strong bilateral relations with India</strong>, especially in areas such as defense, trade, culture, and strategic cooperation in the Indo-Pacific region.</li>\n<li>The visit of H.E. Prabowo Subianto as Chief Guest symbolizes the strengthening of ties between India and Indonesia, particularly in the context of <strong>defense cooperation and maritime security</strong>.</li>\n<li>The Republic Day parade is a significant event showcasing India's military strength, cultural heritage, and national achievements, providing an excellent platform to deepen diplomatic ties with the Chief Guest's country.</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n<ul>\n<li><strong>India-Indonesia Relations:</strong>\n<ul>\n<li>India and Indonesia are both members of key regional and global organizations such as <strong>ASEAN, G20</strong>, and <strong>Non-Aligned Movement (NAM)</strong>.</li>\n<li>They share a strong historical connection, particularly through the <strong>spread of Hinduism and Buddhism</strong> and cultural exchanges over centuries.</li>\n<li>Economic ties are significant, with bilateral trade valued at over <strong>USD 20 billion</strong> in recent years, focusing on commodities like crude oil, coal, and palm oil.</li>\n<li>Defense collaborations include joint naval exercises such as <strong>Samudra Shakti</strong> and cooperation in counterterrorism and regional security initiatives.</li>\n</ul>\n</li>\n<li><strong>Significance of the Chief Guest at Republic Day:</strong>\n<ul>\n<li>The Chief Guest for Republic Day is typically a prominent leader or dignitary from a country with which India shares strategic, cultural, or economic ties.</li>\n<li>This tradition helps bolster bilateral relations and provides an opportunity to showcase India's military and cultural prowess to the international community.</li>\n<li>In recent years, notable Chief Guests have included <strong>Barack Obama (2015)</strong>, <strong>Mohammed bin Salman (2019)</strong>, and <strong>Jair Bolsonaro (2020)</strong>.</li>\n</ul>\n</li>\n<li><strong>Republic Day Parade:</strong>\n<ul>\n<li>The parade is held annually on <strong>January 26th</strong> at Rajpath (now Kartavya Path) in New Delhi to commemorate the adoption of India's Constitution in <strong>1950</strong>.</li>\n<li>It showcases India's military might, cultural diversity, and achievements in science and technology.</li>\n<li>The parade includes tableaus representing various Indian states, cultural performances, and military displays such as missile systems and fighter jets.</li>\n</ul>\n</li>\n<li><strong>H.E. Prabowo Subianto:</strong>\n<ul>\n<li>Prabowo Subianto is a prominent Indonesian politician and a retired army general, currently serving as Indonesia's <strong>Defense Minister</strong> since <strong>2019</strong>.</li>\n<li>He has been a key figure in enhancing Indonesia's defense capabilities and strengthening ties with global powers, including India.</li>\n<li>His visit to India as the Chief Guest highlights the strategic importance of <strong>India-Indonesia defense cooperation</strong> and the shared interest in maintaining stability in the Indo-Pacific region.</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Important Points</u></span></strong></span></p>\n<ul>\n<li><strong>Historical Background:</strong>\n<ul>\n<li>The first Republic Day parade in 1950 had <strong>President Sukarno of Indonesia</strong> as the Chief Guest, emphasizing the longstanding ties between the two nations.</li>\n<li>Indonesia, as the largest Muslim-majority country, holds a unique position in fostering interfaith dialogue and cultural exchange with India, a secular and diverse democracy.</li>\n</ul>\n</li>\n<li><strong>Indo-Pacific Strategic Cooperation:</strong>\n<ul>\n<li>India and Indonesia play a crucial role in maintaining <strong>maritime security</strong> in the Indo-Pacific, a region critical for global trade and economic stability.</li>\n<li>Both countries are committed to upholding a <strong>free, open, and inclusive Indo-Pacific</strong>, ensuring the security of sea lanes and countering regional threats.</li>\n</ul>\n</li>\n<li><strong>Defense Collaboration:</strong>\n<ul>\n<li>The two nations conduct joint military exercises, such as <strong>Garuda Shakti</strong> (army) and <strong>Samudra Shakti</strong> (navy), to enhance interoperability and mutual trust.</li>\n<li>India has also extended defense equipment and technical support to Indonesia, fostering a strong defense partnership.</li>\n</ul>\n</li>\n</ul>77:T2dca,<p>सही उत्तर <u><strong>महामहिम प्रबोवो सुबियांतो</strong></u> है।</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>मुख्य बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>महामहिम प्रबोवो सुबियांतो</strong>, <strong>इंडोनेशिया</strong> के रक्षा मंत्री, <strong>2025 में भारत के गणतंत्र दिवस समारोह</strong> में मुख्य अतिथि थे।</li>\n<li>गणतंत्र दिवस के लिए एक विदेशी गणमान्य व्यक्ति को मुख्य अतिथि के रूप में आमंत्रित करने की परंपरा <strong>1950</strong> में शुरू हुई, जिसमें इंडोनेशिया के राष्ट्रपति सुकर्णो पहले मुख्य अतिथि थे।</li>\n<li>इंडोनेशिया <strong>भारत के साथ मजबूत द्विपक्षीय संबंध</strong> साझा करता है, विशेष रूप से रक्षा, व्यापार, संस्कृति और इंडो-पैसिफिक क्षेत्र में रणनीतिक सहयोग जैसे क्षेत्रों में।</li>\n<li>मुख्य अतिथि के रूप में महामहिम प्रबोवो सुबियांतो की यात्रा भारत और इंडोनेशिया के बीच संबंधों को मजबूत करने का प्रतीक है, विशेष रूप से <strong>रक्षा सहयोग और समुद्री सुरक्षा</strong> के संदर्भ में।</li>\n<li>गणतंत्र दिवस परेड भारत की सैन्य शक्ति, सांस्कृतिक विरासत और राष्ट्रीय उपलब्धियों को प्रदर्शित करने वाला एक महत्वपूर्ण कार्यक्रम है, जो मुख्य अतिथि के देश के साथ राजनयिक संबंधों को गहरा करने के लिए एक उत्कृष्ट मंच प्रदान करता है।</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>अतिरिक्त जानकारी</u></span></strong></span></p>\n<ul>\n<li><strong>भारत-इंडोनेशिया संबंध:</strong>\n<ul>\n<li>भारत और इंडोनेशिया दोनों ही आसियान, जी20 और गुटनिरपेक्ष आंदोलन (एनएएम) जैसे प्रमुख क्षेत्रीय और वैश्विक संगठनों के सदस्य हैं।</li>\n<li>वे एक मजबूत ऐतिहासिक संबंध साझा करते हैं, विशेष रूप से हिंदू धर्म और बौद्ध धर्म के प्रसार और सदियों से सांस्कृतिक आदान-प्रदान के माध्यम से।</li>\n<li>आर्थिक संबंध महत्वपूर्ण हैं, हाल के वर्षों में द्विपक्षीय व्यापार का मूल्य 20 बिलियन अमरीकी डालर से अधिक है, जो कच्चे तेल, कोयला और पाम तेल जैसी वस्तुओं पर केंद्रित है।</li>\n<li>रक्षा सहयोग में संयुक्त नौसैनिक अभ्यास जैसे समुद्र शक्ति और आतंकवाद विरोधी और क्षेत्रीय सुरक्षा पहलों में सहयोग शामिल है।</li>\n</ul>\n</li>\n<li><strong>गणतंत्र दिवस पर मुख्य अतिथि का महत्व:</strong>\n<ul>\n<li>गणतंत्र दिवस के लिए मुख्य अतिथि आमतौर पर एक ऐसे देश के एक प्रमुख नेता या गणमान्य व्यक्ति होते हैं जिसके साथ भारत रणनीतिक, सांस्कृतिक या आर्थिक संबंध साझा करता है।</li>\n<li>यह परंपरा द्विपक्षीय संबंधों को मजबूत करने में मदद करती है और अंतर्राष्ट्रीय समुदाय को भारत की सैन्य और सांस्कृतिक क्षमता को प्रदर्शित करने का अवसर प्रदान करती है।</li>\n<li>हाल के वर्षों में, उल्लेखनीय मुख्य अतिथियों में बराक ओबामा (2015), मोहम्मद बिन सलमान (2019) और जायर बोल्सोनारो (2020) शामिल हैं।</li>\n</ul>\n</li>\n<li><strong>गणतंत्र दिवस परेड:</strong>\n<ul>\n<li>यह परेड हर साल 26 जनवरी को नई दिल्ली में राजपथ (अब कर्तव्य पथ) पर 1950 में भारत के संविधान को अपनाने की स्मृति में आयोजित की जाती है।</li>\n<li>यह भारत की सैन्य शक्ति, सांस्कृतिक विविधता और विज्ञान और प्रौद्योगिकी में उपलब्धियों को प्रदर्शित करता है।</li>\n<li>परेड में विभिन्न भारतीय राज्यों, सांस्कृतिक प्रदर्शनों और मिसाइल प्रणालियों और लड़ाकू जेट जैसे सैन्य प्रदर्शनों को दर्शाती झांकियां शामिल हैं।</li>\n</ul>\n</li>\n<li><strong>महामहिम प्रबोवो सुबियांतो:</strong>\n<ul>\n<li>प्रबोवो सुबियांतो एक प्रमुख इंडोनेशियाई राजनीतिज्ञ और एक सेवानिवृत्त सेना जनरल हैं, जो वर्तमान में 2019 से इंडोनेशिया के रक्षा मंत्री के रूप में कार्यरत हैं।</li>\n<li>वह इंडोनेशिया की रक्षा क्षमताओं को बढ़ाने और भारत सहित वैश्विक शक्तियों के साथ संबंधों को मजबूत करने में एक महत्वपूर्ण व्यक्ति रहे हैं।</li>\n<li>मुख्य अतिथि के रूप में उनकी भारत यात्रा भारत-इंडोनेशिया रक्षा सहयोग के रणनीतिक महत्व और इंडो-पैसिफिक क्षेत्र में स्थिरता बनाए रखने में साझा हित पर प्रकाश डालती है।</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>महत्वपूर्ण बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>ऐतिहासिक पृष्ठभूमि:</strong>\n<ul>\n<li>1950 में पहले गणतंत्र दिवस परेड में इंडोनेशिया के राष्ट्रपति सुकर्णो मुख्य अतिथि थे, जो दोनों देशों के बीच लंबे समय से चले आ रहे संबंधों पर जोर देते हैं।</li>\n<li>इंडोनेशिया, सबसे बड़े मुस्लिम-बहुसंख्यक देश के रूप में, भारत के साथ अंतरधार्मिक संवाद और सांस्कृतिक आदान-प्रदान को बढ़ावा देने में एक अनूठी स्थिति रखता है, जो एक धर्मनिरपेक्ष और विविध लोकतंत्र है।</li>\n</ul>\n</li>\n<li><strong>इंडो-पैसिफिक रणनीतिक सहयोग:</strong>\n<ul>\n<li>भारत और इंडोनेशिया इंडो-पैसिफिक में समुद्री सुरक्षा बनाए रखने में महत्वपूर्ण भूमिका निभाते हैं, जो वैश्विक व्यापार और आर्थिक स्थिरता के लिए महत्वपूर्ण क्षेत्र है।</li>\n<li>दोनों देश एक स्वतंत्र, खुले और समावेशी इंडो-पैसिफिक को बनाए रखने, समुद्री मार्गों की सुरक्षा सुनिश्चित करने और क्षेत्रीय खतरों का मुकाबला करने के लिए प्रतिबद्ध हैं।</li>\n</ul>\n</li>\n<li><strong>रक्षा सहयोग:</strong>\n<ul>\n<li>दोनों देश अंतरसंचालनीयता और आपसी विश्वास को बढ़ाने के लिए संयुक्त सैन्य अभ्यास करते हैं, जैसे गरुड़ शक्ति (सेना) और समुद्र शक्ति (नौसेना)।</li>\n<li>भारत ने इंडोनेशिया को रक्षा उपकरण और तकनीकी सहायता भी प्रदान की है, जिससे एक मजबूत रक्षा साझेदारी को बढ़ावा मिला है।</li>\n</ul>\n</li>\n</ul>78:T113d,<p>The correct answer is <u><strong>Electronic recording of witness testimony</strong></u>.</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p>\n<ul>\n<li>The <strong>Bharatiya Nagarik Suraksha Sanhita, 2023</strong> introduces modern technological advancements to streamline judicial processes and ensure faster delivery of justice.</li>\n<li>The incorporation of <strong>electronic recording of witness testimony</strong> is a critical feature aimed at reducing delays caused by manual procedures and ensuring accurate documentation of testimonies.</li>\n<li><strong>Electronic recording</strong> minimizes the possibility of tampering, loss, or misinterpretation of witness statements, thereby enhancing the transparency and reliability of judicial proceedings.</li>\n<li>The use of technology ensures that the testimony remains accessible for future reference and provides a standardized method of recording across courts.</li>\n<li>This advancement aligns with the government’s vision to digitize and modernize the judicial infrastructure under initiatives like <strong>Digital India</strong>.</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n<ul>\n<li><strong>Importance of Witness Testimony:</strong>\n<ul>\n<li>Witness testimony serves as a crucial component of judicial trials, often being the deciding factor in criminal and civil cases.</li>\n<li>Ensuring the accuracy and security of witness statements is vital for maintaining the integrity of the judicial process.</li>\n</ul>\n</li>\n<li><strong>Benefits of Electronic Recording:</strong>\n<ul>\n<li>Improves efficiency by eliminating manual transcription processes.</li>\n<li>Reduces the scope for human error during documentation.</li>\n<li>Enables secure storage and retrieval of recorded testimonies for future proceedings.</li>\n</ul>\n</li>\n<li><strong>Global Practices:</strong>\n<ul>\n<li>Countries like the <strong>United States</strong> and <strong>United Kingdom</strong> have adopted electronic recording systems in courts to facilitate faster and more accurate documentation of proceedings.</li>\n<li>Such practices are considered benchmarks for judicial reforms worldwide.</li>\n</ul>\n</li>\n<li><strong>Challenges in Implementation:</strong>\n<ul>\n<li>Initial infrastructure costs for setting up electronic recording systems in courts.</li>\n<li>Training judicial staff and ensuring their adaptability to new technologies.</li>\n<li>Addressing concerns related to data privacy and cybersecurity.</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Important Points</u></span></strong></span></p>\n<ul>\n<li><strong>Bharatiya Nagarik Suraksha Sanhita, 2023:</strong>\n<ul>\n<li>Aimed at reforming India’s judicial and law enforcement systems to make them more effective and citizen-centric.</li>\n<li>Emphasizes the use of technology to address long-pending issues such as delayed trials and outdated procedures.</li>\n</ul>\n</li>\n<li><strong>Digital India Initiative:</strong>\n<ul>\n<li>Launched in <strong>2015</strong> by the Government of India, this initiative focuses on digitizing all aspects of governance.</li>\n<li>The judicial reforms under this initiative aim to modernize courtrooms and enhance public access to judicial services.</li>\n</ul>\n</li>\n<li><strong>Other Technological Advancements:</strong>\n<ul>\n<li>Use of <strong>video conferencing</strong> for remote hearings, reducing the need for physical presence in courts.</li>\n<li>Development of <strong>e-Courts</strong> to digitize case filings and streamline judicial processes.</li>\n<li>Implementation of <strong>Artificial Intelligence (AI)</strong> for legal research and case analysis.</li>\n</ul>\n</li>\n</ul>79:T2338,<p>सही उत्तर <u><strong>गवाह की गवाही की इलेक्ट्रॉनिक रिकॉर्डिंग</strong></u> है।</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>मुख्य बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>भारतीय नागरिक सुरक्षा संहिता, 2023</strong> न्यायिक प्रक्रियाओं को सुव्यवस्थित करने और न्याय की तेजी से डिलीवरी सुनिश्चित करने के लिए आधुनिक तकनीकी प्रगति का परिचय कराती है।</li>\n<li><strong>गवाह की गवाही की इलेक्ट्रॉनिक रिकॉर्डिंग</strong> का समावेश एक महत्वपूर्ण विशेषता है जिसका उद्देश्य मैनुअल प्रक्रियाओं के कारण होने वाली देरी को कम करना और गवाही का सटीक दस्तावेजीकरण सुनिश्चित करना है।</li>\n<li><strong>इलेक्ट्रॉनिक रिकॉर्डिंग</strong> गवाह के बयानों के साथ छेड़छाड़, हानि या गलत व्याख्या की संभावना को कम करती है, जिससे न्यायिक कार्यवाही की पारदर्शिता और विश्वसनीयता बढ़ती है।</li>\n<li>प्रौद्योगिकी का उपयोग यह सुनिश्चित करता है कि गवाही भविष्य के संदर्भ के लिए सुलभ रहे और अदालतों में रिकॉर्डिंग की एक मानकीकृत विधि प्रदान करे।</li>\n<li>यह उन्नति <strong>डिजिटल इंडिया</strong> जैसी पहलों के तहत न्यायिक बुनियादी ढांचे को डिजिटाइज़ और आधुनिक बनाने के सरकार के दृष्टिकोण के अनुरूप है।</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>अतिरिक्त जानकारी</u></span></strong></span></p>\n<ul>\n<li><strong>गवाह की गवाही का महत्व:</strong>\n<ul>\n<li>गवाह की गवाही न्यायिक परीक्षणों के एक महत्वपूर्ण घटक के रूप में कार्य करती है, जो अक्सर आपराधिक और दीवानी मामलों में निर्णायक कारक होती है।</li>\n<li>न्यायिक प्रक्रिया की अखंडता को बनाए रखने के लिए गवाह के बयानों की सटीकता और सुरक्षा सुनिश्चित करना महत्वपूर्ण है।</li>\n</ul>\n</li>\n<li><strong>इलेक्ट्रॉनिक रिकॉर्डिंग के लाभ:</strong>\n<ul>\n<li>मैनुअल ट्रांसक्रिप्शन प्रक्रियाओं को समाप्त करके दक्षता में सुधार करता है।</li>\n<li>दस्तावेजीकरण के दौरान मानवीय त्रुटि की गुंजाइश को कम करता है।</li>\n<li>भविष्य की कार्यवाही के लिए रिकॉर्ड की गई गवाही के सुरक्षित भंडारण और पुनर्प्राप्ति को सक्षम बनाता है।</li>\n</ul>\n</li>\n<li><strong>वैश्विक प्रथाएं:</strong>\n<ul>\n<li><strong>संयुक्त राज्य अमेरिका</strong> और <strong>यूनाइटेड किंगडम</strong> जैसे देशों ने कार्यवाही के तेजी से और अधिक सटीक दस्तावेजीकरण की सुविधा के लिए अदालतों में इलेक्ट्रॉनिक रिकॉर्डिंग सिस्टम अपनाया है।</li>\n<li>ऐसी प्रथाओं को दुनिया भर में न्यायिक सुधारों के लिए बेंचमार्क माना जाता है।</li>\n</ul>\n</li>\n<li><strong>कार्यान्वयन में चुनौतियां:</strong>\n<ul>\n<li>अदालतों में इलेक्ट्रॉनिक रिकॉर्डिंग सिस्टम स्थापित करने के लिए प्रारंभिक बुनियादी ढांचा लागत।</li>\n<li>न्यायिक कर्मचारियों को प्रशिक्षित करना और नई तकनीकों के प्रति उनकी अनुकूलन क्षमता सुनिश्चित करना।</li>\n<li>डेटा गोपनीयता और साइबर सुरक्षा से संबंधित चिंताओं का समाधान करना।</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>महत्वपूर्ण बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>भारतीय नागरिक सुरक्षा संहिता, 2023:</strong>\n<ul>\n<li>भारत की न्यायिक और कानून प्रवर्तन प्रणालियों को अधिक प्रभावी और नागरिक-केंद्रित बनाने के उद्देश्य से।</li>\n<li>विलंबित परीक्षणों और पुरानी प्रक्रियाओं जैसे लंबे समय से लंबित मुद्दों को संबोधित करने के लिए प्रौद्योगिकी के उपयोग पर जोर देता है।</li>\n</ul>\n</li>\n<li><strong>डिजिटल इंडिया पहल:</strong>\n<ul>\n<li>भारत सरकार द्वारा <strong>2015</strong> में शुरू की गई, यह पहल शासन के सभी पहलुओं को डिजिटाइज़ करने पर केंद्रित है।</li>\n<li>इस पहल के तहत न्यायिक सुधारों का उद्देश्य कोर्टरूम को आधुनिक बनाना और न्यायिक सेवाओं तक सार्वजनिक पहुंच को बढ़ाना है।</li>\n</ul>\n</li>\n<li><strong>अन्य तकनीकी प्रगति:</strong>\n<ul>\n<li>अदालतों में शारीरिक उपस्थिति की आवश्यकता को कम करते हुए, दूरस्थ सुनवाई के लिए <strong>वीडियो कॉन्फ्रेंसिंग</strong> का उपयोग।</li>\n<li>मामलों को दर्ज करने और न्यायिक प्रक्रियाओं को सुव्यवस्थित करने के लिए <strong>ई-कोर्ट</strong> का विकास।</li>\n<li>कानूनी अनुसंधान और मामले के विश्लेषण के लिए <strong>कृत्रिम बुद्धिमत्ता (एआई)</strong> का कार्यान्वयन।</li>\n</ul>\n</li>\n</ul>7a:T11b2,<p>The correct answer is <u><strong>Odisha</strong></u>.</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p>\n<ul>\n<li><strong>Talcher</strong> is a major industrial hub located in the Angul district of the state of <strong>Odisha</strong>, India.</li>\n<li>The <strong>Talcher Thermal Power Station</strong> is a significant coal-based power plant that contributes substantially to the power generation capacity of India.</li>\n<li>This power station is owned and operated by <strong>NTPC Limited</strong> (National Thermal Power Corporation Limited), one of India's largest energy conglomerates.</li>\n<li>Talcher is often referred to as the <strong>\"Coal City of Odisha\"</strong> due to its rich coal reserves and extensive mining activities. It is part of the Mahanadi Coalfields Limited (MCL) region.</li>\n<li>Odisha is one of the top coal-producing states in India, and Talcher plays a pivotal role in this sector by contributing significantly to the state's and the nation's energy requirements.</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n<ul>\n<li><strong>Talcher's Industrial Significance:</strong>\n<ul>\n<li>Talcher hosts a variety of industries, including coal mining, power generation, and fertilizer production, making it an industrially rich region.</li>\n<li>The <strong>Talcher Super Thermal Power Station</strong>, also located in this region, has a power generation capacity of over 3,000 MW, making it one of the largest power plants in India.</li>\n</ul>\n</li>\n<li><strong>Coal Mining in Talcher:</strong>\n<ul>\n<li>Talcher is part of the <strong>Mahanadi Coalfields Limited (MCL)</strong>, a subsidiary of Coal India Limited (CIL), which is responsible for coal mining operations in the area.</li>\n<li>The coal mined here is primarily used for power generation and industrial purposes, catering to both domestic and industrial consumers across the country.</li>\n</ul>\n</li>\n<li><strong>Location and Connectivity:</strong>\n<ul>\n<li>Talcher is well-connected by rail and road to major cities in Odisha and neighboring states, facilitating the transport of coal and other industrial goods.</li>\n<li>The nearest airport to Talcher is the <strong>Biju Patnaik International Airport</strong> in Bhubaneswar, located approximately 140 km away.</li>\n</ul>\n</li>\n<li><strong>Power Generation in Odisha:</strong>\n<ul>\n<li>Odisha is a key contributor to India's energy sector, with several thermal, hydro, and renewable energy projects spread across the state.</li>\n<li>The state's energy production not only fulfills its own needs but also supplies electricity to other parts of India.</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Important Points</u></span></strong></span></p>\n<ul>\n<li><strong>NTPC Limited:</strong>\n<ul>\n<li>NTPC Limited, previously known as National Thermal Power Corporation, is a <strong>central public sector undertaking</strong> under the Ministry of Power, Government of India.</li>\n<li>It is India's largest power utility and contributes significantly to the country's electricity production.</li>\n</ul>\n</li>\n<li><strong>Mahanadi Coalfields Limited (MCL):</strong>\n<ul>\n<li>MCL is one of the major subsidiaries of <strong>Coal India Limited (CIL)</strong> and plays a crucial role in coal extraction in Odisha.</li>\n<li>The coalfields in and around Talcher are some of the most productive in the country.</li>\n</ul>\n</li>\n<li><strong>Odisha's Energy Sector:</strong>\n<ul>\n<li>Odisha is among the leading states in India in terms of installed power generation capacity, with a mix of thermal, hydro, and renewable energy projects.</li>\n<li>The state's rich natural resources, including coal, bauxite, and iron ore, contribute to its industrial and energy production capabilities.</li>\n</ul>\n</li>\n</ul>\n```7b:T230c,<p>सही उत्तर <u><strong>ओडिशा</strong></u> है।</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>मुख्य बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>तालचेर</strong> ओडिशा राज्य के अंगुल जिले में स्थित एक प्रमुख औद्योगिक केंद्र है।</li>\n<li><strong>तालचेर थर्मल पावर स्टेशन</strong> एक महत्वपूर्ण कोयला आधारित बिजली संयंत्र है जो भारत की बिजली उत्पादन क्षमता में काफी योगदान देता है।</li>\n<li>यह बिजली स्टेशन <strong>एनटीपीसी लिमिटेड</strong> (नेशनल थर्मल पावर कॉरपोरेशन लिमिटेड) के स्वामित्व और संचालन में है, जो भारत के सबसे बड़े ऊर्जा समूह में से एक है।</li>\n<li>तालचेर को अक्सर अपने समृद्ध कोयला भंडार और व्यापक खनन गतिविधियों के कारण <strong>\"ओडिशा का कोयला शहर\"</strong> कहा जाता है। यह महानदी कोलफील्ड्स लिमिटेड (MCL) क्षेत्र का हिस्सा है।</li>\n<li>ओडिशा भारत में शीर्ष कोयला उत्पादक राज्यों में से एक है, और तालचेर राज्य और राष्ट्र की ऊर्जा आवश्यकताओं में महत्वपूर्ण योगदान देकर इस क्षेत्र में एक महत्वपूर्ण भूमिका निभाता है।</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>अतिरिक्त जानकारी</u></span></strong></span></p>\n<ul>\n<li><strong>तालचेर का औद्योगिक महत्व:</strong>\n<ul>\n<li>तालचेर में कोयला खनन, बिजली उत्पादन और उर्वरक उत्पादन सहित विभिन्न प्रकार के उद्योग हैं, जो इसे एक औद्योगिक रूप से समृद्ध क्षेत्र बनाते हैं।</li>\n<li><strong>तालचेर सुपर थर्मल पावर स्टेशन</strong>, जो इसी क्षेत्र में स्थित है, की बिजली उत्पादन क्षमता 3,000 मेगावाट से अधिक है, जो इसे भारत के सबसे बड़े बिजली संयंत्रों में से एक बनाती है।</li>\n</ul>\n</li>\n<li><strong>तालचेर में कोयला खनन:</strong>\n<ul>\n<li>तालचेर <strong>महानदी कोलफील्ड्स लिमिटेड (MCL)</strong> का हिस्सा है, जो कोल इंडिया लिमिटेड (CIL) की सहायक कंपनी है, जो इस क्षेत्र में कोयला खनन कार्यों के लिए जिम्मेदार है।</li>\n<li>यहां खनन किए गए कोयले का उपयोग मुख्य रूप से बिजली उत्पादन और औद्योगिक उद्देश्यों के लिए किया जाता है, जो देश भर में घरेलू और औद्योगिक उपभोक्ताओं दोनों की जरूरतों को पूरा करता है।</li>\n</ul>\n</li>\n<li><strong>स्थान और कनेक्टिविटी:</strong>\n<ul>\n<li>तालचेर रेल और सड़क मार्ग से ओडिशा और पड़ोसी राज्यों के प्रमुख शहरों से अच्छी तरह से जुड़ा हुआ है, जिससे कोयले और अन्य औद्योगिक सामानों के परिवहन में आसानी होती है।</li>\n<li>तालचेर का निकटतम हवाई अड्डा भुवनेश्वर में <strong>बीजू पटनायक अंतर्राष्ट्रीय हवाई अड्डा</strong> है, जो लगभग 140 किमी दूर स्थित है।</li>\n</ul>\n</li>\n<li><strong>ओडिशा में बिजली उत्पादन:</strong>\n<ul>\n<li>ओडिशा भारत के ऊर्जा क्षेत्र में एक प्रमुख योगदानकर्ता है, जिसमें राज्य भर में कई थर्मल, हाइड्रो और नवीकरणीय ऊर्जा परियोजनाएं फैली हुई हैं।</li>\n<li>राज्य का ऊर्जा उत्पादन न केवल अपनी जरूरतों को पूरा करता है बल्कि भारत के अन्य हिस्सों को भी बिजली की आपूर्ति करता है।</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/ is well-connected by rail and road to major cities in Odisha and neighboring states, facilitating the transport of coal and other industrial goods.</li>\n<li>The nearest airport to Talcher is the <strong>Biju Patnaik International Airport</strong> in Bhubaneswar, located approximately 140 km away.</li>\n</ul>\n</li>\n<li><strong>Power Generation in Odisha:</strong>\n<ul>\n<li>Odisha is a key contributor to India's energy sector, with several thermal, hydro, and renewable energy projects spread across the state.</li>\n<li>The state's energy production not only fulfills its own needs but also supplies electricity to other parts of India.</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Important Points</u></span></strong></span></p>\n<ul>\n<li><strong>NTPC Limited:</strong>\n<ul>\n<li>NTPC Limited, previously known as National Thermal Power Corporation, is a <strong>central public sector undertaking</strong> under the Ministry of Power, Government of India.</li>\n<li>It is India's largest power utility and contributes significantly to the country's electricity production.</li>\n</ul>\n</li>\n<li><strong>Mahanadi Coalfields Limited (MCL):</strong>\n<ul>\n<li>MCL is one of the major subsidiaries of <strong>Coal India Limited (CIL)</strong> and plays a crucial role in coal extraction in Odisha.</li>\n<li>The coalfields in and around Talcher are some of the most productive in the country.</li>\n</ul>\n</li>\n<li><strong>Odisha's Energy Sector:</strong>\n<ul>\n<li>Odisha is among the leading states in India in terms of installed power generation capacity, with a mix of thermal, hydro, and renewable energy projects.</li>\n<li>The state's rich natural resources, including coal, bauxite, and iron ore, contribute to its industrial and energy production capabilities.</li>\n</ul>\n</li>\n</ul>\n```7b:T230c,<p>सही उत्तर <u><strong>ओडिशा</strong></u> है।</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>मुख्य बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>तालचेर</strong> ओडिशा राज्य के अंगुल जिले में स्थित एक प्रमुख औद्योगिक केंद्र है।</li>\n<li><strong>तालचेर थर्मल पावर स्टेशन</strong> एक महत्वपूर्ण कोयला आधारित बिजली संयंत्र है जो भारत की बिजली उत्पादन क्षमता में काफी योगदान देता है।</li>\n<li>यह बिजली स्टेशन <strong>एनटीपीसी लिमिटेड</strong> (नेशनल थर्मल पावर कॉरपोरेशन लिमिटेड) के स्वामित्व और संचालन में है, जो भारत के सबसे बड़े ऊर्जा समूह में से एक है।</li>\n<li>तालचेर को अक्सर अपने समृद्ध कोयला भंडार और व्यापक खनन गतिविधियों के कारण <strong>\"ओडिशा का कोयला शहर\"</strong> कहा जाता है। यह महानदी कोलफील्ड्स लिमिटेड (MCL) क्षेत्र का हिस्सा है।</li>\n<li>ओडिशा भारत में शीर्ष कोयला उत्पादक राज्यों में से एक है, और तालचेर राज्य और राष्ट्र की ऊर्जा आवश्यकताओं में महत्वपूर्ण योगदान देकर इस क्षेत्र में एक महत्वपूर्ण भूमिका निभाता है।</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>अतिरिक्त जानकारी</u></span></strong></span></p>\n<ul>\n<li><strong>तालचेर का औद्योगिक महत्व:</strong>\n<ul>\n<li>तालचेर में कोयला खनन, बिजली उत्पादन और उर्वरक उत्पादन सहित विभिन्न प्रकार के उद्योग हैं, जो इसे एक औद्योगिक रूप से समृद्ध क्षेत्र बनाते हैं।</li>\n<li><strong>तालचेर सुपर थर्मल पावर स्टेशन</strong>, जो इसी क्षेत्र में स्थित है, की बिजली उत्पादन क्षमता 3,000 मेगावाट से अधिक है, जो इसे भारत के सबसे बड़े बिजली संयंत्रों में से एक बनाती है।</li>\n</ul>\n</li>\n<li><strong>तालचेर में कोयला खनन:</strong>\n<ul>\n<li>तालचेर <strong>महानदी कोलफील्ड्स लिमिटेड (MCL)</strong> का हिस्सा है, जो कोल इंडिया लिमिटेड (CIL) की सहायक कंपनी है, जो इस क्षेत्र में कोयला खनन कार्यों के लिए जिम्मेदार है।</li>\n<li>यहां खनन किए गए कोयले का उपयोग मुख्य रूप से बिजली उत्पादन और औद्योगिक उद्देश्यों के लिए किया जाता है, जो देश भर में घरेलू और औद्योगिक उपभोक्ताओं दोनों की जरूरतों को पूरा करता है।</li>\n</ul>\n</li>\n<li><strong>स्थान और कनेक्टिविटी:</strong>\n<ul>\n<li>तालचेर रेल और सड़क मार्ग से ओडिशा और पड़ोसी राज्यों के प्रमुख शहरों से अच्छी तरह से जुड़ा हुआ है, जिससे कोयले और अन्य औद्योगिक सामानों के परिवहन में आसानी होती है।</li>\n<li>तालचेर का निकटतम हवाई अड्डा भुवनेश्वर में <strong>बीजू पटनायक अंतर्राष्ट्रीय हवाई अड्डा</strong> है, जो लगभग 140 किमी दूर स्थित है।</li>\n</ul>\n</li>\n<li><strong>ओडिशा में बिजली उत्पादन:</strong>\n<ul>\n<li>ओडिशा भारत के ऊर्जा क्षेत्र में एक प्रमुख योगदानकर्ता है, जिसमें राज्य भर में कई थर्मल, हाइड्रो और नवीकरणीय ऊर्जा परियोजनाएं फैली हुई हैं।</li>\n<li>राज्य का ऊर्जा उत्पादन न केवल अपनी जरूरतों को पूरा करता है बल्कि भारत के अन्य हिस्सों को भी बिजली की आपूर्ति करता है।</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>महत्वपूर्ण बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>एनटीपीसी लिमिटेड:</strong>\n<ul>\n<li>एनटीपीसी लिमिटेड, जिसे पहले नेशनल थर्मल पावर कॉरपोरेशन के नाम से जाना जाता था, भारत सरकार के विद्युत मंत्रालय के तहत एक <strong>केंद्रीय सार्वजनिक क्षेत्र का उपक्रम</strong> है।</li>\n<li>यह भारत की सबसे बड़ी बिजली उपयोगिता है और देश के बिजली उत्पादन में महत्वपूर्ण योगदान करती है।</li>\n</ul>\n</li>\n<li><strong>महानदी कोलफील्ड्स लिमिटेड (MCL):</strong>\n<ul>\n<li>MCL <strong>कोल इंडिया लिमिटेड (CIL)</strong> की प्रमुख सहायक कंपनियों में से एक है और ओडिशा में कोयला निष्कर्षण में महत्वपूर्ण भूमिका निभाती है।</li>\n<li>तालचेर और उसके आसपास के कोयला क्षेत्र देश के सबसे अधिक उत्पादक क्षेत्रों में से कुछ हैं।</li>\n</ul>\n</li>\n<li><strong>ओडिशा का ऊर्जा क्षेत्र:</strong>\n<ul>\n<li>ओडिशा स्थापित बिजली उत्पादन क्षमता के मामले में भारत के अग्रणी राज्यों में से एक है, जिसमें थर्मल, हाइड्रो और नवीकरणीय ऊर्जा परियोजनाओं का मिश्रण है।</li>\n<li>कोयला, बॉक्साइट और लौह अयस्क सहित राज्य के समृद्ध प्राकृतिक संसाधन, इसकी औद्योगिक और ऊर्जा उत्पादन क्षमताओं में योगदान करते हैं।</li>\n</ul>\n</li>\n</ul>", "marks": 2, "negMarks": 0.5}, {"text": "In India, which of these geological formations hosts the most significant groundwater reservoirs for large-scale and extensive development?", "options": ["Unconsolidated Formation", "Semi-Consolidated Formation", "Fissured Formations", "Consolidated Formations"], "correct": 1, "solution": "<p>The correct answer is <u><strong>Unconsolidated Formation</strong></u>.</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p>\n<ul>\n<li><strong>Unconsolidated formations</strong> are loose, soft deposits made up of sand, silt, gravel, and clay, which are highly porous and permeable, making them the most significant geological formations for groundwater storage and extraction.</li>\n<li>These formations act as <strong>aquifers</strong>, which are underground layers of water-bearing permeable materials capable of storing and transmitting water in large quantities.</li>\n<li>In India, the major groundwater reservoirs are located in the <strong>Indo-Gangetic Plain</strong>, which is primarily composed of unconsolidated sediments deposited by rivers over millions of years.</li>\n<li>Owing to their high porosity and permeability, unconsolidated formations allow easy movement and storage of water, making them ideal for <strong>large-scale groundwater development</strong>, including irrigation, industrial use, and domestic water supply.</li>\n<li>Regions with unconsolidated formations, such as the Ganga-Brahmaputra basin and the coastal areas of India, are known to support extensive agricultural and urban water demands.</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n<ul>\n<li><strong>Characteristics of Unconsolidated Formations:</strong>\n<ul>\n<li>These consist of loose sediments such as <strong>sand, gravel, silt, and clay</strong>, which are not cemented together.</li>\n<li>Due to their granular structure, they have high <strong>porosity</strong> (ability to store water) and high <strong>permeability</strong> (ease of water movement).</li>\n<li>Examples of areas with unconsolidated formations in India include the <strong>Indo-Gangetic Plains</strong> and the <strong>deltaic regions</strong> of rivers like the Ganga and Brahmaputra.</li>\n</ul>\n</li>\n<li><strong>Importance of Groundwater Reservoirs:</strong>\n<ul>\n<li>Groundwater is a vital resource for <strong>irrigation</strong>, accounting for over 60% of agricultural water usage in India.</li>\n<li>It also provides drinking water to approximately <strong>85% of rural households</strong> and supports urban areas.</li>\n<li>Groundwater reservoirs in unconsolidated formations are particularly critical in regions with <strong>seasonal rainfall</strong>, such as India, where water storage is essential during dry periods.</li>\n</ul>\n</li>\n<li><strong>Comparison with Other Formations:</strong>\n<ul>\n<li><strong>Semi-consolidated formations</strong> have moderate porosity and permeability, making them less suitable for large-scale groundwater development.</li>\n<li><strong>Fissured and consolidated formations</strong>, such as hard rock areas, have limited water storage capacity due to low porosity and rely on fractures and joints for water flow.</li>\n<li>Unconsolidated formations, by contrast, are more productive and reliable for meeting extensive groundwater needs.</li>\n</ul>\n</li>\n<li><strong>Challenges in Groundwater Management:</strong>\n<ul>\n<li>Over-extraction of groundwater in unconsolidated formations can lead to issues like <strong>aquifer depletion</strong>, land subsidence, and water quality degradation.</li>\n<li>Effective management strategies, such as <strong>artificial recharge</strong> and sustainable water use practices, are crucial for preserving these vital resources.</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Important Points</u></span></strong></span></p>\n<ul>\n<li><strong>Geological Formations in India:</strong>\n<ul>\n<li><strong>Unconsolidated formations:</strong> Found mainly in alluvial regions like the <strong>Indo-Gangetic Plains</strong>. These are best suited for large-scale groundwater development.</li>\n<li><strong>Semi-consolidated formations:</strong> Found in regions with sedimentary rocks like sandstones and limestones. Examples include parts of <strong>central India</strong>.</li>\n<li><strong>Fissured and consolidated formations:</strong> Found in hard rock areas such as the <strong>Deccan Plateau</strong>, with limited groundwater storage potential.</li>\n</ul>\n</li>\n<li><strong>Government Initiatives:</strong>\n<ul>\n<li>Programs like <strong>Atal Bhujal Yojana</strong> aim to ensure sustainable management of groundwater resources in India.</li>\n<li>Efforts to promote <strong>rainwater harvesting</strong> and artificial recharge are being implemented to replenish groundwater in unconsolidated formations.</li>\n</ul>\n</li>\n</ul>\n```7f:T2740,<p>सही उत्तर <u><strong>असंगठित संरचना (Unconsolidated Formation)</strong></u> है।</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>मुख्य बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>असंगठित संरचनाएं</strong> रेत, गाद, बजरी और मिट्टी से बने ढीले, नरम जमाव हैं, जो अत्यधिक झरझरा और पारगम्य होते हैं, जो उन्हें भूजल भंडारण और निष्कर्षण के लिए सबसे महत्वपूर्ण भूवैज्ञानिक संरचनाएं बनाते हैं।</li>\n<li>ये संरचनाएं <strong>जलभृतों (aquifers)</strong> के रूप में कार्य करती हैं, जो पानी धारण करने वाले पारगम्य पदार्थों की भूमिगत परतें हैं जो बड़ी मात्रा में पानी का भंडारण और संचारण करने में सक्षम हैं।</li>\n<li>भारत में, प्रमुख भूजल जलाशय <strong>सिंधु-गंगा के मैदान</strong> में स्थित हैं, जो मुख्य रूप से नदियों द्वारा लाखों वर्षों में जमा किए गए असंगठित तलछटों से बने हैं।</li>\n<li>अपनी उच्च सरंध्रता और पारगम्यता के कारण, असंगठित संरचनाएं पानी की आसान आवाजाही और भंडारण की अनुमति देती हैं, जिससे वे सिंचाई, औद्योगिक उपयोग और घरेलू जल आपूर्ति सहित <strong>बड़े पैमाने पर भूजल विकास</strong> के लिए आदर्श बन जाती हैं।</li>\n<li>असंगठित संरचनाओं वाले क्षेत्र, जैसे गंगा-ब्रह्मपुत्र बेसिन और भारत के तटीय क्षेत्र, व्यापक कृषि और शहरी जल मांगों का समर्थन करने के लिए जाने जाते हैं।</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>अतिरिक्त जानकारी</u></span></strong></span></p>\n<ul>\n<li><strong>असंगठित संरचनाओं की विशेषताएं:</strong>\n<ul>\n<li>इनमें ढीली तलछटें होती हैं जैसे कि <strong>रेत, बजरी, गाद और मिट्टी</strong>, जो एक साथ सीमेंटेड नहीं होती हैं।</li>\n<li>उनकी दानेदार संरचना के कारण, उनमें उच्च <strong>सरंध्रता</strong> (पानी जमा करने की क्षमता) और उच्च <strong>पारगम्यता</strong> (पानी की गति में आसानी) होती है।</li>\n<li>भारत में असंगठित संरचनाओं वाले क्षेत्रों के उदाहरणों में <strong>सिंधु-गंगा के मैदान</strong> और गंगा और ब्रह्मपुत्र जैसी नदियों के <strong>डेल्टाई क्षेत्र</strong> शामिल हैं।</li>\n</ul>\n</li>\n<li><strong>भूजल जलाशयों का महत्व:</strong>\n<ul>\n<li>भूजल <strong>सिंचाई</strong> के लिए एक महत्वपूर्ण संसाधन है, जो भारत में कृषि जल उपयोग का 60% से अधिक है।</li>\n<li>यह लगभग <strong>85% ग्रामीण परिवारों</strong> को पीने का पानी भी प्रदान करता है और शहरी क्षेत्रों का समर्थन करता है।</li>\n<li>असंगठित संरचनाओं में भूजल जलाशय विशेष रूप से <strong>मौसमी वर्षा</strong> वाले क्षेत्रों में महत्वपूर्ण हैं, जैसे कि भारत, जहां सूखे की अवधि के दौरान जल भंडारण आवश्यक है।</li>\n</ul>\n</li>\n<li><strong>अन्य संरचनाओं के साथ तुलना:</strong>\n<ul>\n<li><strong>अर्ध-समेकित संरचनाओं</strong> में मध्यम सरंध्रता और पारगम्यता होती है, जो उन्हें बड़े पैमाने पर भूजल विकास के लिए कम उपयुक्त बनाती है।</li>\n<li><strong>विदरित और समेकित संरचनाओं</strong>, जैसे कि कठोर चट्टान वाले क्षेत्रों में, कम सरंध्रता के कारण सीमित जल भंडारण क्षमता होती है और पानी के प्रवाह के लिए फ्रैक्चर और जोड़ों पर निर्भर होती है।</li>\n<li>इसके विपरीत, असंगठित संरचनाएं व्यापक भूजल आवश्यकताओं को पूरा करने के लिए अधिक उत्पादक और विश्वसनीय हैं।</li>\n</ul>\n</li>\n<li><strong>भूजल प्रबंधन में चुनौतियां:</strong>\n<ul>\n<li>असंगठित संरचनाओं में भूजल के अत्यधिक निष्कर्षण से <strong>जलभृत रिक्तीकरण</strong>, भूमि धंसने और जल गुणवत्ता में गिरावट जैसी समस्याएं हो सकती हैं।</li>\n<li>इन महत्वपूर्ण संसाधनों को संरक्षित करने के लिए <strong>कृत्रिम पुनर्भरण</strong> और टिकाऊ जल उपयोग प्रथाओं जैसी प्रभावी प्रबंधन रणनीतियाँ महत्वपूर्ण हैं।</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>महत्वपूर्ण बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>भारत में भूवैज्ञानिक संरचनाएं:</strong>\n<ul>\n<li><strong>असंगठित संरचनाएं:</strong> मुख्य रूप से जलोढ़ क्षेत्रों जैसे <strong>सिंधु-गंगा के मैदानों</strong> में पाई जाती हैं। ये बड़े पैमाने पर भूजल विकास के लिए सबसे उपयुक्त हैं।</li>\n<li><strong>अर्ध-समेकित संरचनाएं:</strong> तलछटी चट्टानों जैसे बलुआ पत्थर और चूना पत्थर वाले क्षेत्रों में पाई जाती हैं। उदाहरणों में <strong>मध्य भारत</strong> के कुछ हिस्से शामिल हैं।</li>\n<li><strong>विदरित और समेकित संरचनाएं:</strong> कठोर चट्टान वाले क्षेत्रों जैसे <strong>दक्कन के पठार</strong> में पाई जाती हैं, जिनमें सीमित भूजल भंडारण क्षमता होती है।</li>\n</ul>\n</li>\n<li><strong>सरकारी पहल:</strong>\n<ul>\n<li><strong>अटल भूजल योजना</strong> जैसे कार्यक्रमों का उद्देश्य भारत में भूजल संसाधनों का सतत प्रबंधन सुनिश्चित करना है।</li>\n<li>असंगठित संरचनाओं में भूजल को फिर से भरने के लिए <strong>वर्षा जल संचयन</strong> और कृत्रिम पुनर्भरण को बढ़ावा देने के प्रयास किए जा रहे हैं।</li>\n</ul>\n</li>\n</ul>", "marks": 2, "negMarks": 0.5}, {"text": "In the context of the Rigveda, what does the term 'RIK' signify?", "options": ["Ritual sacrifice", "Divine law", "Sacred hymn", "Ancient melody"], "correct": 3, "solution": "<p>The correct answer is <u><strong>Sacred hymn</strong></u>.</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p>\n<ul>\n<li>The term <strong>'RIK'</strong> is derived from the <strong>Rigveda</strong>, which is one of the four Vedas in the Vedic tradition of ancient India.</li>\n<li>'RIK' signifies a <strong>sacred hymn</strong> or verse that is chanted or sung during rituals and ceremonies in the Vedic tradition.</li>\n<li>The Rigveda is composed of around <strong>10,600 hymns</strong>, organized into ten mandalas or books, and is considered the oldest known text in the Indo-European languages.</li>\n<li>These hymns, including the 'RIK', are dedicated to various deities such as <strong>Agni (fire), Indra (rain and thunder), and Soma (a sacred drink)</strong>, reflecting the spiritual and religious beliefs of the Vedic people.</li>\n<li>The Rigveda’s hymns are primarily composed in <strong>Sanskrit</strong>, the ancient language of India, and they are considered both poetic and philosophical in nature.</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n<ul>\n<li><strong>Rigveda:</strong> <ul>\n<li>The <strong>Rigveda</strong> is the first and most important of the four Vedas, the others being <strong>Yajurveda, Samaveda, and Atharvaveda</strong>.</li>\n<li>It is believed to have been composed during the <strong>1500–1200 BCE</strong> period, making it one of the oldest religious texts in the world.</li>\n<li>The Rigveda is primarily focused on hymns praising the gods and contains insights into the social, political, and spiritual life of the Vedic people.</li>\n</ul>\n</li>\n<li><strong>Structure of the Rigveda:</strong> <ul>\n<li>The hymns in the Rigveda are divided into <strong>ten mandalas</strong> or books.</li>\n<li>Each hymn typically consists of <strong>metrical verses</strong>, and they are chanted during rituals to invoke blessings from the gods.</li>\n</ul>\n</li>\n<li><strong>Other Vedic Texts:</strong> <ul>\n<li>The <strong>Yajurveda</strong> focuses on prose mantras and rituals.</li>\n<li>The <strong>Samaveda</strong> emphasizes melodies and chants, often derived from the Rigveda hymns.</li>\n<li>The <strong>Atharvaveda</strong> contains knowledge about spells, charms, and practical wisdom.</li>\n</ul>\n</li>\n<li><strong>Importance of Hymns:</strong> <ul>\n<li>Hymns like the 'RIK' play a crucial role in ancient Indian rituals, where they are chanted to ensure harmony between humans and divine forces.</li>\n<li>The hymns also reflect philosophical concepts like the nature of existence, creation, and the relationship between the cosmos and human life.</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Important Points</u></span></strong></span></p>\n<ul>\n<li><strong>Other Options:</strong> <ul>\n<li><strong>Option 1 - Ritual sacrifice:</strong> While the Vedic tradition includes rituals and sacrifices, the term 'RIK' specifically refers to hymns, not sacrifices.</li>\n<li><strong>Option 2 - Divine law:</strong> The concept of divine laws is found in the Vedas, but 'RIK' does not signify laws; it refers to hymns.</li>\n<li><strong>Option 4 - Ancient melody:</strong> Although the Rigveda includes chants and melodies, the term 'RIK' denotes hymns, not melodies.</li>\n</ul>\n</li>\n<li><strong>Language:</strong> The Rigveda hymns are composed in <strong>Vedic Sanskrit</strong>, which is an early form of Sanskrit.</li>\n<li><strong>Historical Significance:</strong> The Rigveda provides valuable insight into the <strong>cultural, social, and spiritual practices</strong> of ancient India.</li>\n</ul>83:T1fc3,<p>सही उत्तर <u><strong>पवित्र भजन</strong></u> है।</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>मुख्य बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>'RIK'</strong> शब्द <strong>ऋग्वेद</strong> से लिया गया है, जो प्राचीन भारत की वैदिक परंपरा में चार वेदों में से एक है।</li>\n<li>'RIK' का अर्थ एक <strong>पवित्र भजन</strong> या श्लोक है जिसे वैदिक परंपरा में अनुष्ठानों और समारोहों के दौरान गाया या गाया जाता है।</li>\n<li>ऋग्वेद लगभग <strong>10,600 भजनों</strong> से बना है, जो दस मंडलों या पुस्तकों में व्यवस्थित हैं, और इसे इंडो-यूरोपीय भाषाओं में सबसे पुराना ज्ञात पाठ माना जाता है।</li>\n<li>ये भजन, जिनमें 'RIK' भी शामिल है, विभिन्न देवताओं जैसे <strong>अग्नि (अग्नि), इंद्र (वर्षा और गरज), और सोम (एक पवित्र पेय)</strong> को समर्पित हैं, जो वैदिक लोगों की आध्यात्मिक और धार्मिक मान्यताओं को दर्शाते हैं।</li>\n<li>ऋग्वेद के भजन मुख्य रूप से <strong>संस्कृत</strong> में रचे गए हैं, जो भारत की प्राचीन भाषा है, और इन्हें प्रकृति में काव्य और दार्शनिक दोनों माना जाता है।</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>अतिरिक्त जानकारी</u></span></strong></span></p>\n<ul>\n<li><strong>ऋग्वेद:</strong> <ul>\n<li><strong>ऋग्वेद</strong> चार वेदों में से पहला और सबसे महत्वपूर्ण है, अन्य <strong>यजुर्वेद, सामवेद और अथर्ववेद</strong> हैं।</li>\n<li>माना जाता है कि इसकी रचना <strong>1500-1200 ईसा पूर्व</strong> की अवधि के दौरान हुई थी, जो इसे दुनिया के सबसे पुराने धार्मिक ग्रंथों में से एक बनाती है।</li>\n<li>ऋग्वेद मुख्य रूप से देवताओं की स्तुति करने वाले भजनों पर केंद्रित है और इसमें वैदिक लोगों के सामाजिक, राजनीतिक और आध्यात्मिक जीवन के बारे में जानकारी है।</li>\n</ul>\n</li>\n<li><strong>ऋग्वेद की संरचना:</strong> <ul>\n<li>ऋग्वेद के भजनों को <strong>दस मंडलों</strong> या पुस्तकों में विभाजित किया गया है।</li>\n<li>प्रत्येक भजन में आमतौर पर <strong>लयबद्ध छंद</strong> होते हैं, और देवताओं से आशीर्वाद प्राप्त करने के लिए अनुष्ठानों के दौरान इनका जाप किया जाता है।</li>\n</ul>\n</li>\n<li><strong>अन्य वैदिक ग्रंथ:</strong> <ul>\n<li><strong>यजुर्वेद</strong> गद्य मंत्रों और अनुष्ठानों पर केंद्रित है।</li>\n<li><strong>सामवेद</strong> रागों और मंत्रों पर जोर देता है, जो अक्सर ऋग्वेद के भजनों से प्राप्त होते हैं।</li>\n<li><strong>अथर्ववेद</strong> में मंत्रों, आकर्षणों और व्यावहारिक ज्ञान के बारे में जानकारी है।</li>\n</ul>\n</li>\n<li><strong>भजनों का महत्व:</strong> <ul>\n<li>'RIK' जैसे भजन प्राचीन भारतीय अनुष्ठानों में महत्वपूर्ण भूमिका निभाते हैं, जहाँ मानव और दिव्य शक्तियों के बीच सामंजस्य सुनिश्चित करने के लिए इनका जाप किया जाता है।</li>\n<li>भजन अस्तित्व की प्रकृति, निर्माण और ब्रह्मांड और मानव जीवन के बीच संबंध जैसी दार्शनिक अवधारणाओं को भी दर्शाते हैं।</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>महत्वपूर्ण बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>अन्य विकल्प:</strong> <ul>\n<li><strong>विकल्प 1 - अनुष्ठानिक बलिदान:</strong> जबकि वैदिक परंपरा में अनुष्ठान और बलिदान शामिल हैं, 'RIK' शब्द विशेष रूप से भजनों को संदर्भित करता है, बलिदानों को नहीं।</li>\n<li><strong>विकल्प 2 - दिव्य कानून:</strong> दिव्य कानूनों की अवधारणा वेदों में पाई जाती है, लेकिन 'RIK' कानूनों को नहीं दर्शाता है; यह भजनों को संदर्भित करता है।</li>\n<li><strong>विकल्प 4 - प्राचीन राग:</strong> हालाँकि ऋग्वेद में मंत्र और राग शामिल हैं, 'RIK' शब्द भजनों को दर्शाता है, रागों को नहीं।</li>\n</ul>\n</li>\n<li><strong>भाषा:</strong> ऋग्वेद के भजन <strong>वैदिक संस्कृत</strong> में रचे गए हैं, जो संस्कृत का एक प्रारंभिक रूप है।</li>\n<li><strong>ऐतिहासिक महत्व:</strong> ऋग्वेद प्राचीन भारत की <strong>सांस्कृतिक, सामाजिक और आध्यात्मिक प्रथाओं</strong> में बहुमूल्य अंतर्दृष्टि प्रदान करता है।</li>\n</ul>84:T1541,<p>The correct answer is <u><strong>Central Legislative Assembly</strong></u>.</p> <p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p> <ul> <li>The <strong>Government of India Act, 1919</strong>, also known as the Montagu-Chelmsford Reforms, introduced significant changes in the administrative structure of India under British rule.</li> <li>This act created a <strong>bicameral central legislature</strong> for the first time in India, consisting of two houses: the <strong>Council of State</strong> (Upper House) and the <strong>Central Legislative Assembly</strong> (Lower House).</li> <li>The <strong>Central Legislative Assembly</strong> acted as the Lower House with a mix of elected and nominated members. Some members were elected by provincial legislative councils, while others were nominated by the Governor-General.</li> <li>The primary aim of the <strong>Central Legislative Assembly</strong> was to allow limited Indian representation in governance, though its powers were restricted to legislative matters and subject to the Governor-General's veto.</li> <li>The introduction of this bicameral legislature was an essential step toward the gradual inclusion of Indians in decision-making processes, although the reforms did not provide full autonomy.</li> <li>The act was a response to growing demands for self-governance by Indian leaders and was part of Britain's strategy to maintain control while addressing nationalist aspirations.</li> </ul> <p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p> <ul> <li><strong>Government of India Act, 1919:</strong> <ul> <li>The act introduced the system of <strong>diarchy</strong> in the provinces, dividing subjects into \"Reserved\" (controlled by the Governor) and \"Transferred\" (administered by elected Indian ministers).</li> <li>It marked a step toward <strong>responsible government</strong> by allowing Indian ministers to manage transferred subjects such as education, health, and agriculture, though with limited powers.</li> <li>The act extended the principle of <strong>communal representation</strong>, which reserved seats for Muslims, Sikhs, and other minority communities in legislatures.</li> <li>This act served as the foundation for subsequent reforms, including the <strong>Government of India Act, 1935</strong>, which introduced provincial autonomy and a federal structure.</li> </ul> </li> <li><strong>Key Features of the Central Legislative Assembly:</strong> <ul> <li>The assembly consisted of <strong>145 members</strong>, of which 41 were nominated (26 officials and 15 non-officials), and the rest were indirectly elected.</li> <li>Its functions were limited to <strong>discussing and voting on the budget</strong>, debating bills, and addressing public grievances, but the Governor-General retained overriding legislative powers.</li> <li>The assembly's establishment was a symbolic move to involve Indians in governance, but it did not provide substantive political power.</li> </ul> </li> <li><strong>Council of State:</strong> <ul> <li>The Council of State was the upper house of the bicameral legislature, consisting of <strong>60 members</strong>, of which 33 were elected and 27 were nominated.</li> <li>It was primarily a deliberative body with limited legislative powers and served as a check on the Central Legislative Assembly.</li> </ul> </li> <li><strong>Impact of the Reforms:</strong> <ul> <li>The reforms failed to satisfy Indian aspirations for self-governance, as the British retained significant control over critical matters like finance and law and order.</li> <li>The act faced criticism from Indian leaders, including <strong>Mahatma Gandhi</strong> and <strong>Jawaharlal Nehru</strong>, for its limited scope and lack of genuine political autonomy.</li> <li>Despite its shortcomings, the act laid the groundwork for subsequent constitutional developments and reforms in India.</li> </ul> </li> </ul> <p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Important Points</u></span></strong></span></p> <ul> <li><strong>Montagu-Chelmsford Report:</strong> The Government of India Act, 1919, was based on the Montagu-Chelmsford Report, which emphasized the gradual development of self-governing institutions in India.</li> <li><strong>Simon Commission:</strong> The reforms of 1919 were reviewed by the Simon Commission in 1927, which recommended further constitutional changes, leading to the Government of India Act, 1935.</li> <li><strong>Nationalist Response:</strong> The limited scope of the reforms contributed to the rise of the <strong>Non-Cooperation Movement</strong> (1920–22) led by the <strong>Indian National Congress</strong>, demanding complete self-rule or Swaraj.</li> </ul>85:T29fc,<p>सही उत्तर <u><strong>केंद्रीय विधान सभा</strong></u> है।</p> <p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>मुख्य बिंदु</u></span></strong></span></p> <ul> <li><strong>भारत सरकार अधिनियम, 1919</strong>, जिसे मोंटेग्यू-चेम्सफोर्ड सुधारों के रूप में भी जाना जाता है, ने ब्रिटिश शासन के तहत भारत की प्रशासनिक संरचना में महत्वपूर्ण बदलाव पेश किए।</li> <li>इस अधिनियम ने भारत में पहली बार <strong>द्विसदनीय केंद्रीय विधानमंडल</strong> बनाया, जिसमें दो सदन शामिल थे: <strong>राज्य परिषद</strong> (उच्च सदन) और <strong>केंद्रीय विधान सभा</strong> (निचला सदन)।</li> <li><strong>केंद्रीय विधान सभा</strong> ने निर्वाचित और मनोनीत सदस्यों के मिश्रण के साथ निचले सदन के रूप में कार्य किया। कुछ सदस्य प्रांतीय विधान परिषदों द्वारा चुने गए थे, जबकि अन्य को गवर्नर-जनरल द्वारा मनोनीत किया गया था।</li> <li><strong>केंद्रीय विधान सभा</strong> का प्राथमिक उद्देश्य शासन में सीमित भारतीय प्रतिनिधित्व की अनुमति देना था, हालांकि इसकी शक्तियां विधायी मामलों तक सीमित थीं और गवर्नर-जनरल के वीटो के अधीन थीं।</li> <li>इस द्विसदनीय विधानमंडल की शुरुआत निर्णय लेने की प्रक्रियाओं में भारतीयों को धीरे-धीरे शामिल करने की दिशा में एक आवश्यक कदम था, हालांकि सुधारों ने पूर्ण स्वायत्तता प्रदान नहीं की।</li> <li>यह अधिनियम भारतीय नेताओं द्वारा स्व-शासन की बढ़ती मांगों की प्रतिक्रिया थी और राष्ट्रवादी आकांक्षाओं को संबोधित करते हुए नियंत्रण बनाए रखने की ब्रिटेन की रणनीति का हिस्सा था।</li> </ul> <p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>अतिरिक्त जानकारी</u></span></strong></span></p> <ul> <li><strong>भारत सरकार अधिनियम, 1919:</strong> <ul> <li>अधिनियम ने प्रांतों में <strong>द्वैध शासन</strong> की प्रणाली शुरू की, विषयों को \"आरक्षित\" (गवर्नर द्वारा नियंत्रित) और \"स्थानांतरित\" (निर्वाचित भारतीय मंत्रियों द्वारा प्रशासित) में विभाजित किया।</li> <li>इसने भारतीय मंत्रियों को शिक्षा, स्वास्थ्य और कृषि जैसे स्थानांतरित विषयों का प्रबंधन करने क
