ng>\n<ul>\n<li>सरकारें औद्योगिक उत्सर्जन को प्रतिबंधित करने, <strong>नवीकरणीय ऊर्जा</strong> को बढ़ावा देने और वाहनों के प्रदूषण को कम करने जैसे उपाय लागू करती हैं।</li>\n<li>व्यक्ति उच्च AQI अवधि के दौरान <strong>एयर प्यूरीफायर</strong> का उपयोग करने, मास्क पहनने और बाहरी गतिविधियों को सीमित करने जैसी सावधानियां बरत सकते हैं।</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>महत्वपूर्ण बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>भारत में AQI निगरानी:</strong>\n<ul>\n<li>पर्यावरण, वन और जलवायु परिवर्तन मंत्रालय के तहत <strong>केंद्रीय प्रदूषण नियंत्रण बोर्ड (CPCB)</strong> AQI निगरानी की देखरेख करता है।</li>\n<li>वायु गुणवत्ता डेटा प्रसार को सरल बनाने के लिए <strong>2014</strong> में <strong>राष्ट्रीय वायु गुणवत्ता सूचकांक (NAQI)</strong> लॉन्च किया गया था।</li>\n</ul>\n</li>\n<li><strong>AQI गणना में प्रदूषक:</strong>\n<ul>\n<li>सामान्य प्रदूषकों में <strong>PM2.5</strong>, <strong>PM10</strong>, <strong>ओजोन (O3)</strong>, <strong>नाइट्रोजन डाइऑक्साइड (NO2)</strong>, <strong>सल्फर डाइऑक्साइड (SO2)</strong> और <strong>कार्बन मोनोऑक्साइड (CO)</strong> शामिल हैं।</li>\n<li>प्रत्येक प्रदूषक में AQI गणना के लिए विशिष्ट सांद्रता सीमाएँ होती हैं।</li>\n</ul>\n</li>\n<li><strong>एहतियाती उपाय:</strong>\n<ul>\n<li>'गंभीर' AQI अवधि के दौरान बाहरी गतिविधियों से बचें।</li>\n<li>एक्सपोजर को कम करने के लिए <strong>N95 मास्क</strong> या वायु-शोधक रेस्पिरेटर का उपयोग करें।</li>\n</ul>\n</li>\n</ul>9c:T11b4,<p>The correct answer is <u><strong>1) Both A and R are true, and R is the correct explanation of A.</strong></u>.</p> <p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p> <ul> <li><strong>Assertion (A): GDP doesn't really tell the whole story when it comes to how well people in a country are actually doing.</strong> <ul> <li>Gross Domestic Product (<strong>GDP</strong>) measures the total economic output of a country but does not reflect the overall well-being of citizens.</li> <li>It does not account for factors such as income inequality, environmental degradation, or the quality of life. <em><strong>Hence, the assertion is correct.</strong></em></li> </ul> </li> <li><strong>Reason (R): That's mainly because it doesn't take into account stuff like wear and tear of machines, pollution, or even how the money is divided among people.</strong> <ul> <li><strong>GDP</strong> primarily measures economic activity and ignores externalities like <strong>pollution</strong>, <strong>resource depletion</strong>, or <strong>income distribution.</strong></li> <li>It also excludes factors such as the depreciation of capital goods (wear and tear of machines) and how wealth is distributed among individuals. <em><strong>Hence, the reason is correct.</strong></em></li> <li>The reason directly explains why GDP fails to fully capture the well-being of citizens. <em><strong>Thus, it is the correct explanation of the assertion.</strong></em></li> </ul> </li> <li><em><strong>Therefore, both A and R are true, and R is the correct explanation of A.</strong></em></li> </ul> <p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p> <ul> <li><strong>Limitations of GDP as an Indicator:</strong> <ul> <li><strong>Environmental Costs:</strong> GDP does not consider the negative effects of economic activities, such as <strong>pollution</strong> or depletion of natural resources.</li> <li><strong>Income Inequality:</strong> GDP measures total output but does not show how income is distributed across the population. High GDP can coexist with <strong>widespread poverty</strong>.</li> <li><strong>Non-Market Activities:</strong> Informal sector activities, household labor, and volunteer work are excluded from GDP calculations, despite their contribution to society.</li> <li><strong>Depreciation:</strong> GDP does not account for the wear and tear of capital goods (known as <strong>depreciation</strong>), which can affect future productivity.</li> <li><strong>Quality of Life:</strong> GDP focuses on quantity rather than quality. Factors like <strong>healthcare</strong>, <strong>education</strong>, or <strong>happiness</strong> are not directly measured.</li> </ul> </li> <li><strong>Alternative Measures of Well-Being:</strong> <ul> <li><strong>Human Development Index (HDI):</strong> Combines measures of <strong>health</strong>, <strong>education</strong>, and <strong>income</strong> to provide a broader perspective on well-being.</li> <li><strong>Gross National Happiness (GNH):</strong> Used by countries like Bhutan to prioritize <strong>happiness</strong> and quality of life over economic output.</li> <li><strong>Genuine Progress Indicator (GPI):</strong> Adjusts GDP by considering factors such as <strong>environmental costs</strong>, <strong>social costs</strong>, and income inequality.</li> <li><strong>Green GDP:</strong> Accounts for environmental degradation and resource depletion alongside economic growth.</li> </ul> </li> <li><strong>Important Points:</strong> <ul> <li>Economists and policymakers often use GDP as a benchmark but recognize the need for supplementary indicators to assess a country’s overall progress.</li> <li>In recent years, global organizations like the <strong>United Nations</strong> and <strong>World Bank</strong> have emphasized the importance of inclusive growth and sustainable development.</li> <li>Countries are increasingly adopting multidimensional indices to address the limitations of GDP and focus on long-term well-being.</li> </ul> </li> </ul>9d:T219f,<p>सही उत्तर है <u><strong>1) A और R दोनों सत्य हैं, और R, A का सही स्पष्टीकरण है।</strong></u></p> <p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>मुख्य बिंदु</u></span></strong></span></p> <ul> <li><strong>अभिकथन (A): सकल घरेलू उत्पाद (GDP) वास्तव में पूरी कहानी नहीं बताता है कि किसी देश में लोग वास्तव में कैसा कर रहे हैं।</strong> <ul> <li>सकल घरेलू उत्पाद (<strong>GDP</strong>) किसी देश के कुल आर्थिक उत्पादन को मापता है लेकिन नागरिकों की समग्र भलाई को नहीं दर्शाता है।</li> <li>यह आय असमानता, पर्यावरणीय क्षरण या जीवन की गुणवत्ता जैसे कारकों को ध्यान में नहीं रखता है। <em><strong>इसलिए, अभिकथन सही है।</strong></em></li> </ul> </li> <li><strong>कारण (R): ऐसा मुख्य रूप से इसलिए है क्योंकि यह मशीनों के घिसाव, प्रदूषण या यहां तक कि लोगों के बीच पैसे के विभाजन जैसी चीजों को ध्यान में नहीं रखता है।</strong> <ul> <li><strong>GDP</strong> मुख्य रूप से आर्थिक गतिविधि को मापता है और <strong>प्रदूषण</strong>, <strong>संसाधन क्षरण</strong> या <strong>आय वितरण</strong> जैसे बाहरी कारकों को अनदेखा करता है।</li> <li>इसमें पूंजीगत वस्तुओं (मशीनों के घिसाव) के मूल्यह्रास और व्यक्तियों के बीच धन का वितरण जैसे कारक भी शामिल नहीं हैं। <em><strong>इसलिए, कारण सही है।</strong></em></li> <li>कारण सीधे बताता है कि GDP नागरिकों की भलाई को पूरी तरह से पकड़ने में क्यों विफल रहता है। <em><strong>इस प्रकार, यह अभिकथन का सही स्पष्टीकरण है।</strong></em></li> </ul> </li> <li><em><strong>इसलिए, A और R दोनों सत्य हैं, और R, A का सही स्पष्टीकरण है।</strong></em></li> </ul> <p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>अतिरिक्त जानकारी</u></span></strong></span></p> <ul> <li><strong>एक संकेतक के रूप में GDP की सीमाएँ:</strong> <ul> <li><strong>पर्यावरणीय लागत:</strong> GDP आर्थिक गतिविधियों के नकारात्मक प्रभावों पर विचार नहीं करता है, जैसे कि <strong>प्रदूषण</strong> या प्राकृतिक संसाधनों का क्षरण।</li> <li><strong>आय असमानता:</strong> GDP कुल उत्पादन को मापता है लेकिन यह नहीं दिखाता है कि जनसंख्या में आय कैसे वितरित की जाती है। उच्च GDP <strong>व्यापक गरीबी</strong> के साथ सह-अस्तित्व में हो सकता है।</li> <li><strong>गैर-बाजार गतिविधियाँ:</strong> अनौपचारिक क्षेत्र की गतिविधियाँ, घरेलू श्रम और स्वयंसेवी कार्य को GDP गणना से बाहर रखा गया है, भले ही वे समाज में योगदान करते हों।</li> <li><strong>मूल्यह्रास:</strong> GDP पूंजीगत वस्तुओं के घिसाव (जिसे <strong>मूल्यह्रास</strong> के रूप में जाना जाता है) को ध्यान में नहीं रखता है, जो भविष्य की उत्पादकता को प्रभावित कर सकता है।</li> <li><strong>जीवन की गुणवत्ता:</strong> GDP मात्रा पर ध्यान केंद्रित करता है गुणवत्ता पर नहीं। <strong>स्वास्थ्य सेवा</strong>, <strong>शिक्षा</strong> या <strong>खुशी</strong> जैसे कारकों को सीधे नहीं मापा जाता है।</li> </ul> </li> <li><strong>कल्याण के वैकल्पिक उपाय:</strong> <ul> <li><strong>मानव विकास सूचकांक (HDI):</strong> कल्याण पर व्यापक परिप्रेक्ष्य प्रदान करने के लिए <strong>स्वास्थ्य</strong>, <strong>शिक्षा</strong> और <strong>आय</strong> के उपायों को जोड़ता है।</li> <li><strong>सकल राष्ट्रीय खुशी (GNH):</strong> भूटान जैसे देशों द्वारा आर्थिक उत्पादन पर <strong>खुशी</strong> और जीवन की गुणवत्ता को प्राथमिकता देने के लिए उपयोग किया जाता है।</li> <li><strong>वास्तविक प्रगति संकेतक (GPI):</strong> <strong>पर्यावरणीय लागत</strong>, <strong>सामाजिक लागत</strong> और आय असमानता जैसे कारकों पर विचार करके GDP को समायोजित करता है।</li> <li><strong>ग्रीन GDP:</strong> आर्थिक विकास के साथ-साथ पर्यावरणीय क्षरण और संसाधन क्षरण को भी ध्यान में रखता है।</li> </ul> </li> <li><strong>महत्वपूर्ण बिंदु:</strong> <ul> <li>अर्थशास्त्री और नीति निर्माता अक्सर GDP को एक बेंचमार्क के रूप में उपयोग करते हैं लेकिन देश की समग्र प्रगति का आकलन करने के लिए पूरक संकेतकों की आवश्यकता को पहचानते हैं।</li> <li>हाल के वर्षों में, <strong>संयुक्त राष्ट्र</strong> और <strong>विश्व बैंक</strong> जैसे वैश्विक संगठनों ने समावेशी विकास और सतत विकास के महत्व पर जोर दिया है।</li> <li>देश GDP की सीमाओं को दूर करने और दीर्घकालिक कल्याण पर ध्यान केंद्रित करने के लिए तेजी से बहुआयामी सूचकांकों को अपना रहे हैं।</li> </ul> </li> </ul>9e:Tece,<p>The correct answer is <u><strong>Rajputs</strong></u>.</p> <p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p> <ul> <li><strong>Thoda</strong> is a traditional martial art practiced in Himachal Pradesh, India, primarily by the <strong>Rajput community</strong>.</li> <li>It combines elements of <strong>archery and martial arts</strong>, and is deeply rooted in the cultural and historical traditions of the region.</li> <li>The sport involves using wooden bows and arrows, and participants aim to hit the opponent's leg as part of the competitive gameplay.</li> <li>Thoda is typically performed during <strong>local festivals and celebrations</strong>, showcasing the rich heritage of the Rajput community.</li> <li>The martial art traces its origin to the <strong>Mahabharata</strong>, symbolizing valor and warrior skills, which have been preserved by generations of Rajputs.</li> </ul> <p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p> <ul> <li><strong>Location:</strong> Thoda is primarily performed in the <strong>Himachal Pradesh region</strong>, particularly in areas like Shimla and Kullu. The mountainous terrain adds to the challenging nature of the sport.</li> <li><strong>Features:</strong> Participants use <strong>blunt arrows</strong> and wear protective gear to avoid injuries. The sport emphasizes skill, strategy, and precision rather than aggression.</li> <li><strong>Cultural Significance:</strong> Thoda is not just a martial art but also a way to preserve the <strong>Rajput warrior traditions</strong> and their historical connection to bravery and combat expertise.</li> <li><strong>Festivals:</strong> Thoda is often performed during <strong>Baisakhi</strong> and other local festivals, making it a key attraction for tourists and locals alike.</li> <li><strong>Historical Context:</strong> The martial art is believed to have originated from the <strong>Mahabharata</strong>, where archery played a significant role in warfare. It reflects the warrior ethos of ancient Indian culture.</li> </ul> <p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Important Points</u></span></strong></span></p> <ul> <li><strong>Other Communities:</strong> While Thoda is primarily associated with the Rajputs, individuals from other communities may occasionally participate in the sport for recreational purposes.</li> <li><strong>Preservation:</strong> Efforts are being made by the Himachal Pradesh government to preserve and promote Thoda as part of the state's <strong>intangible cultural heritage</strong>.</li> <li><strong>Training:</strong> Thoda requires rigorous physical training and mastery of archery techniques, reflecting the disciplined lifestyle of the Rajputs.</li> <li><strong>Modern Adaptations:</strong> Although traditional in nature, Thoda has been adapted for modern audiences with organized tournaments and safety measures.</li> <li><strong>Tourism:</strong> Thoda performances attract <strong>domestic and international tourists</strong>, contributing to the cultural tourism of Himachal Pradesh.</li> </ul>9f:T1ce0,<p>सही उत्तर <u><strong>राजपूत</strong></u> है।</p> <p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>मुख्य बिंदु</u></span></strong></span></p> <ul> <li><strong>थोडा</strong> एक पारंपरिक मार्शल आर्ट है जो भारत में हिमाचल प्रदेश में मुख्य रूप से <strong>राजपूत समुदाय</strong> द्वारा प्रचलित है।</li> <li>यह <strong>तीरंदाजी और मार्शल आर्ट</strong> के तत्वों को जोड़ती है, और क्षेत्र की सांस्कृतिक और ऐतिहासिक परंपराओं में गहराई से निहित है।</li> <li>इस खेल में लकड़ी के धनुष और तीर का उपयोग करना शामिल है, और प्रतिभागी प्रतिस्पर्धी गेमप्ले के भाग के रूप में प्रतिद्वंद्वी के पैर को मारने का लक्ष्य रखते हैं।</li> <li>थोडा आमतौर पर <strong>स्थानीय त्योहारों और समारोहों</strong> के दौरान किया जाता है, जो राजपूत समुदाय की समृद्ध विरासत को दर्शाता है।</li> <li>मार्शल आर्ट की उत्पत्ति <strong>महाभारत</strong> से मिलती है, जो वीरता और योद्धा कौशल का प्रतीक है, जिसे राजपूतों की पीढ़ियों ने संरक्षित किया है।</li> </ul> <p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>अतिरिक्त जानकारी</u></span></strong></span></p> <ul> <li><strong>स्थान:</strong> थोडा मुख्य रूप से <strong>हिमाचल प्रदेश क्षेत्र</strong> में किया जाता है, विशेष रूप से शिमला और कुल्लू जैसे क्षेत्रों में। पहाड़ी इलाका खेल की चुनौतीपूर्ण प्रकृति को बढ़ाता है।</li> <li><strong>विशेषताएं:</strong> प्रतिभागी चोटों से बचने के लिए <strong>कुंद तीरों</strong> का उपयोग करते हैं और सुरक्षात्मक गियर पहनते हैं। खेल आक्रामकता के बजाय कौशल, रणनीति और सटीकता पर जोर देता है।</li> <li><strong>सांस्कृतिक महत्व:</strong> थोडा सिर्फ एक मार्शल आर्ट नहीं है, बल्कि <strong>राजपूत योद्धा परंपराओं</strong> और बहादुरी और युद्ध विशेषज्ञता के साथ उनके ऐतिहासिक संबंध को संरक्षित करने का एक तरीका भी है।</li> <li><strong>त्योहार:</strong> थोडा अक्सर <strong>बैसाखी</strong> और अन्य स्थानीय त्योहारों के दौरान किया जाता है, जो इसे पर्यटकों और स्थानीय लोगों के लिए एक प्रमुख आकर्षण बनाता है।</li> <li><strong>ऐतिहासिक संदर्भ:</strong> माना जाता है कि मार्शल आर्ट की उत्पत्ति <strong>महाभारत</strong> से हुई है, जहां तीरंदाजी ने युद्ध में महत्वपूर्ण भूमिका निभाई थी। यह प्राचीन भारतीय संस्कृति के योद्धा लोकाचार को दर्शाता है।</li> </ul> <p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>महत्वपूर्ण बिंदु</u></span></strong></span></p> <ul> <li><strong>अन्य समुदाय:</strong> जबकि थोडा मुख्य रूप से राजपूतों से जुड़ा है, अन्य समुदायों के व्यक्ति कभी-कभी मनोरंजक उद्देश्यों के लिए खेल में भाग ले सकते हैं।</li> <li><strong>संरक्षण:</strong> हिमाचल प्रदेश सरकार द्वारा थोडा को राज्य की <strong>अमूर्त सांस्कृतिक विरासत</strong> के हिस्से के रूप में संरक्षित और बढ़ावा देने के प्रयास किए जा रहे हैं।</li> <li><strong>प्रशिक्षण:</strong> थोडा के लिए कठोर शारीरिक प्रशिक्षण और तीरंदाजी तकनीकों में महारत की आवश्यकता होती है, जो राजपूतों की अनुशासित जीवन शैली को दर्शाता है।</li> <li><strong>आधुनिक अनुकूलन:</strong> प्रकृति में पारंपरिक होने के बावजूद, थोडा को संगठित टूर्नामेंट और सुरक्षा उपायों के साथ आधुनिक दर्शकों के लिए अनुकूलित किया गया है।</li> <li><strong>पर्यटन:</strong> थोडा प्रदर्शन <strong>घरेलू और अंतर्राष्ट्रीय पर्यटकों</strong> को आकर्षित करते हैं, जो हिमाचल प्रदेश के सांस्कृतिक पर्यटन में योगदान करते हैं।</li> </ul>a0:T14ef,<p>The correct answer is <u><strong>Only 1 and 3 are correct</strong></u>.</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p>\n<ul>\n<li><strong>Statement 1: It aims to make India a global hub for production and export of green hydrogen.</strong> <ul>\n<li>This statement is correct. The <strong>National Green Hydrogen Mission</strong> was introduced to position India as a key player in the global green hydrogen market, encouraging both domestic production and export opportunities.</li>\n<li>The initiative aligns with India’s commitment to reducing greenhouse gas emissions and achieving <strong>net-zero carbon emissions by 2070</strong>.</li>\n</ul>\n</li>\n<li><strong>Statement 2: The mission targets production of 10 MMT by 2030.</strong>\n<ul>\n<li>This statement is incorrect. While the mission has ambitious production targets, the actual target for green hydrogen production by 2030 is <strong>5 MMT (Million Metric Tonnes)</strong> as per the official framework of the National Green Hydrogen Mission.</li>\n<li>The focus is to enhance domestic production and reduce reliance on fossil fuels.</li>\n</ul>\n</li>\n<li><strong>Statement 3: Green hydrogen is produced by electrolysis using renewable energy.</strong>\n<ul>\n<li>This statement is correct. Green hydrogen is generated through the process of <strong>electrolysis</strong>, where water is split into hydrogen and oxygen using electricity sourced from <strong>renewable energy</strong> like solar or wind power.</li>\n<li>This makes green hydrogen a sustainable and clean alternative to conventional hydrogen production methods, which rely on fossil fuels.</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n<ul>\n<li><strong>National Green Hydrogen Mission:</strong>\n<ul>\n<li>Launched by the <strong>Government of India</strong> in <strong>2022</strong>, the mission aims to make India a leader in the production and use of green hydrogen.</li>\n<li>The mission will help in reducing India’s dependency on imported energy and contribute significantly to its energy transition efforts.</li>\n<li>It is expected to attract investments worth <strong>Rs. 8 lakh crore</strong> and create over <strong>6 lakh jobs</strong>.</li>\n<li>The mission is part of India’s strategy to meet its <strong>Nationally Determined Contributions (NDCs)</strong> under the Paris Agreement.</li>\n</ul>\n</li>\n<li><strong>Green Hydrogen:</strong>\n<ul>\n<li>It is hydrogen produced through <strong>electrolysis</strong> using electricity generated from renewable energy sources.</li>\n<li>This hydrogen has a variety of applications, including in industries like steel, cement, and chemicals, as well as in transportation and energy storage.</li>\n<li>It is considered a key fuel for the future due to its potential to decarbonize sectors that are difficult to electrify directly.</li>\n</ul>\n</li>\n<li><strong>Key Environmental Benefits:</strong>\n<ul>\n<li>Green hydrogen reduces carbon emissions significantly compared to grey hydrogen, which is derived from natural gas.</li>\n<li>It supports the global transition to <strong>clean energy</strong> and helps combat climate change.</li>\n</ul>\n</li>\n<li><strong>Current Global Scenario:</strong>\n<ul>\n<li>Countries like Germany, Japan, and Australia are investing heavily in green hydrogen technologies.</li>\n<li>India’s mission places it among the leading nations aiming to scale up green hydrogen production.</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Important Points</u></span></strong></span></p>\n<ul>\n<li><strong>Green Hydrogen Production Technologies:</strong>\n<ul>\n<li><strong>Electrolysis:</strong> The most common method for producing green hydrogen using water and renewable electricity.</li>\n<li><strong>Photoelectrochemical Water Splitting:</strong> Uses sunlight to split water into hydrogen and oxygen.</li>\n<li>Research is ongoing to improve the efficiency of these technologies and reduce production costs.</li>\n</ul>\n</li>\n<li><strong>Challenges in Green Hydrogen Adoption:</strong>\n<ul>\n<li>The high cost of production and lack of infrastructure for storage and distribution are key barriers.</li>\n<li>Scaling up requires significant investments and technological advancements.</li>\n</ul>\n</li>\n<li><strong>Future Prospects:</strong>\n<ul>\n<li>With global emphasis on achieving net-zero emissions, green hydrogen is expected to play a pivotal role in transforming the energy landscape.</li>\n<li>India’s proactive initiatives under the Green Hydrogen Mission aim to position the country as a major player in this emerging sector.</li>\n</ul>\n</li>\n</ul>\n```a1:T2a8f,<p>सही उत्तर है <u><strong>केवल 1 और 3 सही हैं</strong></u>।</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>मुख्य बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>कथन 1: इसका उद्देश्य भारत को हरित हाइड्रोजन के उत्पादन और निर्यात के लिए एक वैश्विक केंद्र बनाना है।</strong> <ul>\n<li>यह कथन सही है। <strong>राष्ट्रीय हरित हाइड्रोजन मिशन</strong> को भारत को वैश्विक हरित हाइड्रोजन बाजार में एक प्रमुख खिलाड़ी के रूप में स्थापित करने के लिए पेश किया गया था, जो घरेलू उत्पादन और निर्यात अवसरों दोनों को प्रोत्साहित करता है।</li>\n<li>यह पहल भारत की ग्रीनहाउस गैस उत्सर्जन को कम करने और <strong>2070 तक शुद्ध-शून्य कार्बन उत्सर्जन</strong> प्राप्त करने की प्रतिबद्धता के अनुरूप है।</li>\n</ul>\n</li>\n<li><strong>कथन 2: मिशन का लक्ष्य 2030 तक 10 एमएमटी का उत्पादन करना है।</strong>\n<ul>\n<li>यह कथन गलत है। जबकि मिशन के महत्वाकांक्षी उत्पादन लक्ष्य हैं, राष्ट्रीय हरित हाइड्रोजन मिशन के आधिकारिक ढांचे के अनुसार 2030 तक हरित हाइड्रोजन उत्पादन का वास्तविक लक्ष्य <strong>5 एमएमटी (मिलियन मीट्रिक टन)</strong> है।</li>\n<li>इसका ध्यान घरेलू उत्पादन को बढ़ाने और जीवाश्म ईंधन पर निर्भरता को कम करने पर है।</li>\n</ul>\n</li>\n<li><strong>कथन 3: हरित हाइड्रोजन का उत्पादन नवीकरणीय ऊर्जा का उपयोग करके इलेक्ट्रोलीज़ द्वारा किया जाता है।</strong>\n<ul>\n<li>यह कथन सही है। हरित हाइड्रोजन <strong>इलेक्ट्रोलीज़</strong> की प्रक्रिया के माध्यम से उत्पन्न होता है, जहां सौर या पवन ऊर्जा जैसे <strong>नवीकरणीय ऊर्जा</strong> से प्राप्त बिजली का उपयोग करके पानी को हाइड्रोजन और ऑक्सीजन में विभाजित किया जाता है।</li>\n<li>यह हरित हाइड्रोजन को पारंपरिक हाइड्रोजन उत्पादन विधियों का एक टिकाऊ और स्वच्छ विकल्प बनाता है, जो जीवाश्म ईंधन पर निर्भर हैं।</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>अतिरिक्त जानकारी</u></span></strong></span></p>\n<ul>\n<li><strong>राष्ट्रीय हरित हाइड्रोजन मिशन:</strong>\n<ul>\n<li><strong>भारत सरकार</strong> द्वारा <strong>2022</strong> में शुरू किया गया, इस मिशन का उद्देश्य भारत को हरित हाइड्रोजन के उत्पादन और उपयोग में अग्रणी बनाना है।</li>\n<li>यह मिशन भारत की आयातित ऊर्जा पर निर्भरता को कम करने में मदद करेगा और इसके ऊर्जा संक्रमण प्रयासों में महत्वपूर्ण योगदान देगा।</li>\n<li>इससे <strong>8 लाख करोड़ रुपये</strong> का निवेश आकर्षित होने और <strong>6 लाख से अधिक नौकरियां</strong> सृजित होने की उम्मीद है।</li>\n<li>यह मिशन पेरिस समझौते के तहत भारत के <strong>राष्ट्रीय स्तर पर निर्धारित योगदान (एनडीसी)</strong> को पूरा करने की रणनीति का हिस्सा है।</li>\n</ul>\n</li>\n<li><strong>हरित हाइड्रोजन:</strong>\n<ul>\n<li>यह नवीकरणीय ऊर्जा स्रोतों से उत्पन्न बिजली का उपयोग करके <strong>इलेक्ट्रोलीज़</strong> के माध्यम से उत्पादित हाइड्रोजन है।</li>\n<li>इस हाइड्रोजन के इस्पात, सीमेंट और रसायन जैसे उद्योगों के साथ-साथ परिवहन और ऊर्जा भंडारण में भी विभिन्न अनुप्रयोग हैं।</li>\n<li>इसे भविष्य के लिए एक महत्वपूर्ण ईंधन माना जाता है क्योंकि इसमें उन क्षेत्रों को डीकार्बोनाइज करने की क्षमता है जिन्हें सीधे विद्युतीकृत करना मुश्किल है।</li>\n</ul>\n</li>\n<li><strong>प्रमुख पर्यावरणीय लाभ:</strong>\n<ul>\n<li>हरित हाइड्रोजन प्राकृतिक गैस से प्राप्त ग्रे हाइड्रोजन की तुलना में कार्बन उत्सर्जन को काफी कम करता है।</li>\n<li>यह <strong>स्वच्छ ऊर्जा</strong> में वैश्विक परिवर्तन का समर्थन करता है और जलवायु परिवर्तन से निपटने में मदद करता है।</li>\n</ul>\n</li>\n<li><strong>वर्तमान वैश्विक परिदृश्य:</strong>\n<ul>\n<li>जर्मनी, जापान और ऑस्ट्रेलिया जैसे देश हरित हाइड्रोजन प्रौद्योगिकियों में भारी निवेश कर रहे हैं।</li>\n<li>भारत का मिशन इसे हरित हाइड्रोजन उत्पादन को बढ़ाने के उद्देश्य से अग्रणी देशों में रखता है।</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>महत्वपूर्ण बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>हरित हाइड्रोजन उत्पादन प्रौद्योगिकियां:</strong>\n<ul>\n<li><strong>इलेक्ट्रोलीज़:</strong> पानी और नवीकरणीय बिजली का उपयोग करके हरित हाइड्रोजन का उत्पादन करने का सबसे आम तरीका।</li>\n<li><strong>फोटोइलेक्ट्रोकेमिकल जल विभाजन:</strong> हाइड्रोजन और ऑक्सीजन में पानी को विभाजित करने के लिए सूर्य के प्रकाश का उपयोग करता है।</li>\n<li>इन प्रौद्योगिकियों की दक्षता में सुधार और उत्पादन लागत को कम करने के लिए अनुसंधान जारी है।</li>\n</ul>\n</li>\n<li><strong>हरित हाइड्रोजन अपनाने में चुनौतियां:</strong>\n<ul>\n<li>उत्पादन की उच्च लागत और भंडारण और वितरण के लिए बुनियादी ढांचे की कमी प्रमुख बाधाएं हैं।</li>\n<li>स्केलिंग के लिए महत्वपूर्ण निवेश और तकनीकी प्रगति की आवश्यकता है।</li>\n</ul>\n</li>\n<li><strong>भविष्य की संभावनाएं:</strong>\n<ul>\n<li>शुद्ध-शून्य उत्सर्जन प्राप्त करने पर वैश्विक जोर के साथ, हरित हाइड्रोजन से ऊर्जा परिदृश्य को बदलने में महत्वपूर्ण भूमिका निभाने की उम्मीद है।</li>\n<li>हरित हाइड्रोजन मिशन के तहत भारत की सक्रिय पहल का उद्देश्य देश को इस उभरते क्षेत्र में एक प्रमुख खिलाड़ी के रूप में स्थापित करना है।</li>\n</ul>\n</li>\n</ul>", "marks": 2, "negMarks": 0.5}, {"text": "Why were fertilizer subsidies a double-edged policy instrument during 1960-1990?", "options": ["They promoted global trade", "They reduced rural employment", "They supported productivity but often benefited richer farmers", "They discouraged use of HYV seeds"], "correct": 3, "solution": "<p>The correct answer is <u><strong>They supported productivity but often benefited richer farmers</strong></u>.</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p>\n<ul>\n<li><strong>Fertilizer subsidies</strong> were introduced as part of India’s agricultural policy during the <strong>Green Revolution (1960-1990)</strong> to boost agricultural productivity.</li>\n<li>These subsidies helped increase the use of fertilizers, particularly in areas where <strong>High-Yield Variety (HYV)</strong> seeds were introduced, leading to higher yields and food security.</li>\n<li>However, the benefits were often skewed towards <strong>richer farmers</strong> who owned larger landholdings, as they were better positioned to purchase fertilizers and had access to irrigation and other agricultural inputs.</li>\n<li>Small and marginal farmers, who lacked financial resources and access to irrigation, often could not take full advantage of these subsidies.</li>\n<li>While fertilizer subsidies increased productivity, they also caused regional disparities by favoring regions with better infrastructure, such as Punjab and Haryana, over less developed regions.</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n<ul>\n<li><strong>Green Revolution:</strong> <ul>\n<li>The Green Revolution in India started in the <strong>1960s</strong> and aimed to increase agricultural productivity through the use of <strong>HYV seeds, irrigation, fertilizers, and pesticides</strong>.</li>\n<li>It primarily benefited states like <strong>Punjab, Haryana, and Uttar Pradesh</strong> due to the availability of irrigation facilities and improved infrastructure.</li>\n<li>The Green Revolution helped India achieve self-sufficiency in food grains but also led to income and regional inequalities.</li>\n</ul>\n</li>\n<li><strong>Impact of Fertilizer Subsidies:</strong> <ul>\n<li>Fertilizer subsidies were critical in reducing the cost of production for farmers and improving agricultural yields.</li>\n<li>However, they contributed to <strong>soil degradation</strong> due to excessive and imbalanced use of fertilizers like urea.</li>\n<li>The subsidies disproportionately benefited richer farmers due to their ability to purchase fertilizers in bulk.</li>\n</ul>\n</li>\n<li><strong>Challenges for Small Farmers:</strong> <ul>\n<li>Small and marginal farmers faced challenges such as lack of access to credit, irrigation facilities, and modern farming tools.</li>\n<li>They were unable to fully capitalize on the benefits of fertilizer subsidies, leading to a widening gap between large and small farmers.</li>\n</ul>\n</li>\n<li><strong>Regional Disparities:</strong> <ul>\n<li>The Green Revolution and associated subsidies mainly benefited regions with better infrastructure, creating disparities between states like <strong>Punjab and Bihar</strong>.</li>\n<li>Less developed regions continued to rely on traditional farming methods, limiting their growth.</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Important Points</u></span></strong></span></p>\n<ul>\n<li><strong>Environmental Impact:</strong> Excessive use of chemical fertilizers during the Green Revolution led to problems such as <strong>soil salinity, water pollution, and loss of soil fertility</strong>.</li>\n<li><strong>Policy Implications:</strong> The need for targeted subsidies and better access for small farmers was recognized in later agricultural policies to address inequalities.</li>\n<li><strong>Present-Day Scenario:</strong> Fertilizer subsidies remain a significant part of India’s agricultural policy, but the government is gradually moving towards <strong>direct benefit transfers (DBT)</strong> to ensure equitable distribution.</li>\n</ul>\n```a3:T21af,<p>सही उत्तर है <u><strong>उन्होंने उत्पादकता का समर्थन किया लेकिन अक्सर अमीर किसानों को लाभ हुआ</strong></u>।</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>मुख्य बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>उर्वरक सब्सिडी</strong> को भारत की कृषि नीति के भाग के रूप में <strong>हरित क्रांति (1960-1990)</strong> के दौरान कृषि उत्पादकता को बढ़ावा देने के लिए पेश किया गया था।</li>\n<li>इन सब्सिडी ने उर्वरकों के उपयोग को बढ़ाने में मदद की, विशेष रूप से उन क्षेत्रों में जहां <strong>उच्च उपज किस्म (एचवाईवी)</strong> के बीज पेश किए गए थे, जिससे उच्च उपज और खाद्य सुरक्षा हुई।</li>\n<li>हालांकि, लाभ अक्सर <strong>अमीर किसानों</strong> की ओर झुके हुए थे जिनके पास बड़ी भूमि जोत थी, क्योंकि वे उर्वरकों को खरीदने के लिए बेहतर स्थिति में थे और उनके पास सिंचाई और अन्य कृषि आदानों तक पहुंच थी।</li>\n<li>छोटे और सीमांत किसान, जिनके पास वित्तीय संसाधनों और सिंचाई तक पहुंच की कमी थी, अक्सर इन सब्सिडी का पूरा लाभ नहीं उठा पाते थे।</li>\n<li>जबकि उर्वरक सब्सिडी ने उत्पादकता में वृद्धि की, उन्होंने बेहतर बुनियादी ढांचे वाले क्षेत्रों, जैसे पंजाब और हरियाणा, को कम विकसित क्षेत्रों पर तरजीह देकर क्षेत्रीय असमानताओं का भी कारण बना।</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>अतिरिक्त जानकारी</u></span></strong></span></p>\n<ul>\n<li><strong>हरित क्रांति:</strong> <ul>\n<li>भारत में हरित क्रांति <strong>1960 के दशक</strong> में शुरू हुई और इसका उद्देश्य <strong>एचवाईवी बीज, सिंचाई, उर्वरकों और कीटनाशकों</strong> के उपयोग के माध्यम से कृषि उत्पादकता को बढ़ाना था।</li>\n<li>सिंचाई सुविधाओं और बेहतर बुनियादी ढांचे की उपलब्धता के कारण इससे मुख्य रूप से <strong>पंजाब, हरियाणा और उत्तर प्रदेश</strong> जैसे राज्यों को लाभ हुआ।</li>\n<li>हरित क्रांति ने भारत को खाद्यान्न में आत्मनिर्भरता हासिल करने में मदद की लेकिन इससे आय और क्षेत्रीय असमानताएं भी हुईं।</li>\n</ul>\n</li>\n<li><strong>उर्वरक सब्सिडी का प्रभाव:</strong> <ul>\n<li>उर्वरक सब्सिडी किसानों के लिए उत्पादन लागत को कम करने और कृषि उपज में सुधार करने में महत्वपूर्ण थीं।</li>\n<li>हालांकि, उन्होंने यूरिया जैसे उर्वरकों के अत्यधिक और असंतुलित उपयोग के कारण <strong>मिट्टी के क्षरण</strong> में योगदान दिया।</li>\n<li>सब्सिडी से अमीर किसानों को असमान रूप से लाभ हुआ क्योंकि वे थोक में उर्वरक खरीदने में सक्षम थे।</li>\n</ul>\n</li>\n<li><strong>छोटे किसानों के लिए चुनौतियां:</strong> <ul>\n<li>छोटे और सीमांत किसानों को ऋण, सिंचाई सुविधाओं और आधुनिक कृषि उपकरणों तक पहुंच की कमी जैसी चुनौतियों का सामना करना पड़ा।</li>\n<li>वे उर्वरक सब्सिडी के लाभों का पूरी तरह से लाभ उठाने में असमर्थ थे, जिससे बड़े और छोटे किसानों के बीच अंतर बढ़ गया।</li>\n</ul>\n</li>\n<li><strong>क्षेत्रीय असमानताएं:</strong> <ul>\n<li>हरित क्रांति और संबंधित सब्सिडी से मुख्य रूप से बेहतर बुनियादी ढांचे वाले क्षेत्रों को लाभ हुआ, जिससे <strong>पंजाब और बिहार</strong> जैसे राज्यों के बीच असमानताएं पैदा हुईं।</li>\n<li>कम विकसित क्षेत्र पारंपरिक कृषि विधियों पर निर्भर रहे, जिससे उनकी वृद्धि सीमित हो गई।</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>महत्वपूर्ण बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>पर्यावरणीय प्रभाव:</strong> हरित क्रांति के दौरान रासायनिक उर्वरकों के अत्यधिक उपयोग से <strong>मिट्टी की लवणता, जल प्रदूषण और मिट्टी की उर्वरता में कमी</strong> जैसी समस्याएं हुईं।</li>\n<li><strong>नीति निहितार्थ:</strong> असमानताओं को दूर करने के लिए बाद की कृषि नीतियों में लक्षित सब्सिडी और छोटे किसानों के लिए बेहतर पहुंच की आवश्यकता को मान्यता दी गई।</li>\n<li><strong>वर्तमान परिदृश्य:</strong> उर्वरक सब्सिडी भारत की कृषि नीति का एक महत्वपूर्ण हिस्सा बनी हुई है, लेकिन सरकार धीरे-धीरे समान वितरण सुनिश्चित करने के लिए <strong>प्रत्यक्ष लाभ हस्तांतरण (डीबीटी)</strong> की ओर बढ़ रही है।</li>\n</ul>", "marks": 2, "negMarks": 0.5}, {"text": "The term 'Navratnas' in public sector reform refers to:", "options": ["Public enterprises given full privatization", "Public enterprises granted autonomy for better performance", "Subsidy-driven rural firms", "Firms eligible for WTO support"], "correct": 2, "solution": "<p>The correct answer is <u><strong>Public enterprises granted autonomy for better performance</strong></u>.</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p>\n<ul>\n<li>The term <strong>‘Navratnas’</strong> refers to select public sector enterprises in India that have been granted autonomy to improve their operational performance.</li>\n<li>This autonomy allows these enterprises to operate independently without significant interference from the government in decision-making processes, enabling them to compete in the global market.</li>\n<li>Navratnas are part of a larger classification system within India’s public sector units (PSUs), which includes <strong>Maharatnas</strong>, <strong>Navratnas</strong>, and <strong>Miniratnas</strong>, based on their financial performance and operational capabilities.</li>\n<li>The status of Navratna is granted to PSUs that meet certain financial criteria, such as earning a net profit, maintaining a good net worth, and achieving specific annual turnover thresholds.</li>\n<li>Navratna PSUs are empowered to make strategic investments, form joint ventures, and undertake mergers and acquisitions without requiring prior approval from the government.</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n<ul>\n<li><strong>Criteria for Navratna Status:</strong>\n<ul>\n<li>PSUs must achieve a score of 60 out of 100 in six performance parameters: net profit, net worth, total manpower cost, productivity of capital and assets, and earnings per share.</li>\n<li>They must also maintain a minimum annual turnover of Rs. 2,000 crore and a net profit of Rs. 30 crore.</li>\n</ul>\n</li>\n<li><strong>Features of Navratna Companies:</strong>\n<ul>\n<li>Navratna PSUs can invest up to Rs. 1,000 crore or 15% of their net worth in a single project without government approval.</li>\n<li>They are allowed to enter into joint ventures and form alliances with foreign companies to enhance their operational efficiency.</li>\n</ul>\n</li>\n<li><strong>Examples of Navratna PSUs:</strong>\n<ul>\n<li>Companies such as Bharat Electronics Limited (BEL), Hindustan Aeronautics Limited (HAL), and National Aluminium Company Limited (NALCO) have been granted Navratna status.</li>\n<li>These companies operate in diverse sectors, including defense, aerospace, energy, and minerals.</li>\n</ul>\n</li>\n<li><strong>Difference Between Navratna and Maharatna:</strong>\n<ul>\n<li>Maharatna companies have even greater autonomy than Navratna companies. For instance, Maharatnas can invest up to Rs. 5,000 crore in a single project without government approval.</li>\n<li>Navratna status is often a stepping stone for PSUs to achieve Maharatna status based on their sustained financial and operational performance.</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Important Points</u></span></strong></span></p>\n<ul>\n<li><strong>Historical Context:</strong>\n<ul>\n<li>The Navratna status was introduced in <strong>1997</strong> as part of India’s economic reforms to enhance the efficiency of PSUs.</li>\n<li>This initiative was aimed at encouraging PSUs to operate more competitively and contribute to national economic growth.</li>\n</ul>\n</li>\n<li><strong>Impact of Autonomy:</strong>\n<ul>\n<li>Navratna PSUs have played a crucial role in driving industrial growth, creating employment opportunities, and earning significant foreign exchange for India.</li>\n<li>They are often considered benchmarks for operational excellence within the public sector.</li>\n</ul>\n</li>\n<li><strong>Global Competitiveness:</strong>\n<ul>\n<li>By granting autonomy, Navratna companies have been able to expand their operations internationally, competing with private and multinational corporations.</li>\n<li>For example, ONGC Videsh Ltd., a subsidiary of ONGC (a Navratna company), has successfully acquired oil and gas assets abroad.</li>\n</ul>\n</li>\n</ul>a9:T2499,<p>सही उत्तर है <u><strong>सार्वजनिक उद्यमों को बेहतर प्रदर्शन के लिए स्वायत्तता प्रदान करना</strong></u>।</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>मुख्य बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>'नवरत्न'</strong> शब्द भारत में चुनिंदा सार्वजनिक क्षेत्र के उद्यमों को संदर्भित करता है जिन्हें अपने परिचालन प्रदर्शन को बेहतर बनाने के लिए स्वायत्तता प्रदान की गई है।</li>\n<li>यह स्वायत्तता इन उद्यमों को निर्णय लेने की प्रक्रियाओं में सरकार के महत्वपूर्ण हस्तक्षेप के बिना स्वतंत्र रूप से संचालित करने की अनुमति देती है, जिससे वे वैश्विक बाजार में प्रतिस्पर्धा कर सकते हैं।</li>\n<li>नवरत्न भारत के सार्वजनिक क्षेत्र के उपक्रमों (PSU) के भीतर एक बड़ी वर्गीकरण प्रणाली का हिस्सा हैं, जिसमें उनकी वित्तीय प्रदर्शन और परिचालन क्षमताओं के आधार पर <strong>महारत्न</strong>, <strong>नवरत्न</strong> और <strong>मिनीरत्न</strong> शामिल हैं।</li>\n<li>नवरत्न का दर्जा उन PSU को दिया जाता है जो कुछ वित्तीय मानदंडों को पूरा करते हैं, जैसे कि शुद्ध लाभ अर्जित करना, एक अच्छा शुद्ध मूल्य बनाए रखना और विशिष्ट वार्षिक कारोबार सीमा प्राप्त करना।</li>\n<li>नवरत्न PSU को सरकार से पूर्व अनुमोदन की आवश्यकता के बिना रणनीतिक निवेश करने, संयुक्त उद्यम बनाने और विलय और अधिग्रहण करने का अधिकार है।</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>अतिरिक्त जानकारी</u></span></strong></span></p>\n<ul>\n<li><strong>नवरत्न स्थिति के लिए मानदंड:</strong>\n<ul>\n<li>PSU को छह प्रदर्शन मापदंडों में से 100 में से 60 का स्कोर प्राप्त करना होगा: शुद्ध लाभ, शुद्ध मूल्य, कुल जनशक्ति लागत, पूंजी और संपत्ति की उत्पादकता और प्रति शेयर आय।</li>\n<li>उन्हें 2,000 करोड़ रुपये का न्यूनतम वार्षिक कारोबार और 30 करोड़ रुपये का शुद्ध लाभ भी बनाए रखना होगा।</li>\n</ul>\n</li>\n<li><strong>नवरत्न कंपनियों की विशेषताएं:</strong>\n<ul>\n<li>नवरत्न PSU सरकार की मंजूरी के बिना एक ही परियोजना में 1,000 करोड़ रुपये या अपनी शुद्ध संपत्ति का 15% तक निवेश कर सकते हैं।</li>\n<li>उन्हें अपनी परिचालन दक्षता बढ़ाने के लिए विदेशी कंपनियों के साथ संयुक्त उद्यम में प्रवेश करने और गठबंधन बनाने की अनुमति है।</li>\n</ul>\n</li>\n<li><strong>नवरत्न PSU के उदाहरण:</strong>\n<ul>\n<li>भारत इलेक्ट्रॉनिक्स लिमिटेड (BEL), हिंदुस्तान एयरोनॉटिक्स लिमिटेड (HAL) और नेशनल एल्युमिनियम कंपनी लिमिटेड (NALCO) जैसी कंपनियों को नवरत्न का दर्जा दिया गया है।</li>\n<li>ये कंपनियां रक्षा, एयरोस्पेस, ऊर्जा और खनिज सहित विभिन्न क्षेत्रों में काम करती हैं।</li>\n</ul>\n</li>\n<li><strong>नवरत्न और महारत्न के बीच अंतर:</strong>\n<ul>\n<li>महारत्न कंपनियों के पास नवरत्न कंपनियों की तुलना में और भी अधिक स्वायत्तता है। उदाहरण के लिए, महारत्न सरकार की मंजूरी के बिना एक ही परियोजना में 5,000 करोड़ रुपये तक का निवेश कर सकते हैं।</li>\n<li>नवरत्न का दर्जा अक्सर PSU के लिए उनके निरंतर वित्तीय और परिचालन प्रदर्शन के आधार पर महारत्न का दर्जा प्राप्त करने के लिए एक कदम पत्थर होता है।</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>महत्वपूर्ण बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>ऐतिहासिक संदर्भ:</strong>\n<ul>\n<li>नवरत्न का दर्जा <strong>1997</strong> में PSU की दक्षता बढ़ाने के लिए भारत के आर्थिक सुधारों के हिस्से के रूप में पेश किया गया था।</li>\n<li>इस पहल का उद्देश्य PSU को अधिक प्रतिस्पर्धी रूप से संचालित करने और राष्ट्रीय आर्थिक विकास में योगदान करने के लिए प्रोत्साहित करना था।</li>\n</ul>\n</li>\n<li><strong>स्वायत्तता का प्रभाव:</strong>\n<ul>\n<li>नवरत्न PSU ने औद्योगिक विकास को चलाने, रोजगार के अवसर पैदा करने और भारत के लिए महत्वपूर्ण विदेशी मुद्रा अर्जित करने में महत्वपूर्ण भूमिका निभाई है।</li>\n<li>उन्हें अक्सर सार्वजनिक क्षेत्र के भीतर परिचालन उत्कृष्टता के लिए बेंचमार्क माना जाता है।</li>\n</ul>\n</li>\n<li><strong>वैश्विक प्रतिस्पर्धा:</strong>\n<ul>\n<li>स्वायत्तता प्रदान करके, नवरत्न कंपनियां निजी और बहुराष्ट्रीय निगमों के साथ प्रतिस्पर्धा करते हुए, अंतरराष्ट्रीय स्तर पर अपने कार्यों का विस्तार करने में सक्षम रही हैं।</li>\n<li>उदाहरण के लिए, ONGC विदेश लिमिटेड, ONGC (एक नवरत्न कंपनी) की सहायक कंपनी ने विदेशों में सफलतापूर्वक तेल और गैस संपत्ति का अधिग्रहण किया है।</li>\n</ul>\n</li>\n</ul>aa:T1137,<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png\" width=\"26px\" /> <u style=\"font-size: 21px; font-weight: 700; display: inline !important;\">Shortcut Trick</u></span></p>\n\n<p>A real number that is not rational is called an irrational number.</p>\n\n<p>Square roots of non-perfect squares are always irrational.</p>\n\n<p>Since 7 is not a perfect square, its square root cannot be written as a simple fraction.</p>\n\n<p>The numbers 3/4, 5, and −2 are clearly rational as they can easily be expressed in the form p/q.</p>\n\n<p><strong>∴ The correct answer is √7.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Alternate Method</u></span></strong></span></p>\n\n<p><strong>Given:</strong></p>\n\n<p>Options: 3/4, 5, √7, −2</p>\n\n<p><strong>Definition Used:</strong></p>\n\n<p>⇒ Rational Number: A number that can be expressed as p/q, where p and q are integers and q ≠ 0.</p>\n\n<p>⇒ Irrational Number: A real number that is not rational.</p>\n\n<p><strong>Calculations:</strong></p>\n\n<p>⇒ Option 1: 3/4 is already in the form p/q, so it is a rational number.</p>\n\n<p>⇒ Option 2: 5 can be written as 5/1, which is in the form p/q, so it is a rational number.</p>\n\n<p>⇒ Option 4: −2 can be written as −2/1, which is in the form p/q, so it is a rational number.</p>\n\n<p>⇒ Option 3: √7. Since 7 is not a perfect square, its square root evaluates to a non-terminating and non-repeating decimal.</p>\n\n<p>⇒ Thus, √7 cannot be expressed as a simple fraction p/q.</p>\n\n<p>⇒ Therefore, √7 is a real number but NOT rational.</p>\n\n<p><strong>∴ The correct answer is √7.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Real Numbers</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">Real numbers consist of all rational and irrational numbers. They can be geometrically represented on a continuous number line.</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Rational Numbers</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">Numbers that can be written as a ratio of two integers p/q (where q ≠ 0). Their decimal forms are either terminating or repeating.</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Irrational Numbers</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">Numbers that cannot be written as a simple fraction of integers. Their decimal expansions are non-terminating and non-repeating. Common examples include π, √2, and √3.</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Perfect Squares</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">The square root of a perfect square integer (like √16 = 4) is always rational. Conversely, the square root of any non-perfect square integer is always irrational.</p>\n\n<p> </p>", "marks": 2, "negMarks": 0.5}, {"text": "What will come in place of ? to satisfy the equation : (√6-1)² =?-2√6", "options": ["7", "6", "5", "4"], "correct": 1, "solution": "<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png\" width=\"26px\" /> <u style=\"font-size: 21px; font-weight: 700; display: inline !important;\">Shortcut Trick</u></span></p>\n\n<p>Square the term (√6 − 1) directly using the identity (a − b)<sup>2</sup> = a<sup>2</sup> − 2ab + b<sup>2</sup>.</p>\n\n<p>LHS = (√6)<sup>2</sup> − 2(√6)(1) + 1<sup>2</sup> = 6 − 2√6 + 1 = 7 − 2√6</p>\n\n<p>Equate this to the RHS:</p>\n\n<p>7 − 2√6 = ? − 2√6</p>\n\n<p>? = 7</p>\n\n<p><strong>∴ The correct answer is 7.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Alternate Method</u></span></strong></span></p>\n\n<p><strong>Given:</strong></p>\n\n<p>(√6 − 1)<sup>2</sup> = ? − 2√6</p>\n\n<p><strong>Formula Used:</strong></p>\n\n<p>(a − b)<sup>2</sup> = a<sup>2</sup> − 2ab + b<sup>2</sup></p>\n\n<p><strong>Calculations:</strong></p>\n\n<p>⇒ (√6 − 1)<sup>2</sup> = ? − 2√6</p>\n\n<p>⇒ (√6)<sup>2</sup> − 2 × √6 × 1 + (1)<sup>2</sup> = ? − 2√6</p>\n\n<p>⇒ 6 − 2√6 + 1 = ? − 2√6</p>\n\n<p>⇒ 7 − 2√6 = ? − 2√6</p>\n\n<p>⇒ 7 − 2√6 + 2√6 = ?</p>\n\n<p>⇒ ? = 7</p>\n\n<p><strong>∴ The correct answer is 7.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Standard Algebraic Identities</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">(a + b)<sup>2</sup> = a<sup>2</sup> + 2ab + b<sup>2</sup> | (a − b)<sup>2</sup> = a<sup>2</sup> − 2ab + b<sup>2</sup> | a<sup>2</sup> − b<sup>2</sup> = (a − b)(a + b)</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Properties of Surds</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">The square of a square root returns the base number: (√a)<sup>2</sup> = a. Similar surds can be added or subtracted directly.</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">BODMAS Rule</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">Simplification strictly follows the sequence: Bracket, Order (Powers/Roots), Division, Multiplication, Addition, and Subtraction.</p>\n\n<p> </p>", "marks": 2, "negMarks": 0.5}, {"text": "A vendor lends 74,000 rupees at a rate of 12% compound interest per annum, compounded annually. Find the interest for the 3rd year.", "options": ["10000.9", "11000.5", "11139.07", "12000"], "correct": 3, "solution": "<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png\" width=\"26px\" /> <u style=\"font-size: 21px; font-weight: 700; display: inline !important;\">Shortcut Trick</u></span></p>\n\n<p>The interest for the n<sup>th</sup> year in compound interest follows a geometric progression.</p>\n\n<p>Interest for the 1<sup>st</sup> year = 12% of 74000 = ₹8880</p>\n\n<p>Interest for the 3<sup>rd</sup> year = (1<sup>st</sup> year Interest) × (1 + R/100)<sup>n−1</sup></p>\n\n<p>⇒ Interest for 3<sup>rd</sup> year = 8880 × (1 + 12/100)<sup>2</sup></p>\n\n<p>⇒ 8880 × (1.12)<sup>2</sup> = 8880 × 1.2544 = 11139.072 ≈ ₹11139.07</p>\n\n<p><strong>∴ The correct answer is ₹11139.07.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Alternate Method</u></span></strong></span></p>\n\n<p><strong>Given:</strong></p>\n\n<p>Principal (P) = ₹74,000</p>\n\n<p>Rate of Interest (R) = 12% per annum</p>\n\n<p><strong>Formula Used:</strong></p>\n\n<p>Amount after n years = P × (1 + R/100)<sup>n</sup></p>\n\n<p>Interest for the n<sup>th</sup> year = Amount after (n−1) years × (R/100)</p>\n<svg height=\"200\" style=\"display:block;margin:12px 0;background:#ffffff;border-radius:10px;border:1px solid #cccccc;\" viewbox=\"0 0 420 200\" width=\"420\" xmlns=\"http://www.w3.org/2000/svg\"> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"45\" y=\"45\">Start</text> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"155\" y=\"45\">End Year 1</text> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"267\" y=\"45\">End Year 2</text> <text fill=\"#007700\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"380\" y=\"45\">3rd Yr Int.</text> <rect fill=\"#ddeeff\" height=\"40\" rx=\"5\" stroke=\"#2255cc\" stroke-width=\"1.5\" width=\"70\" x=\"10\" y=\"70\"></rect> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"12\" text-anchor=\"middle\" x=\"45\" y=\"95\">₹74,000</text> <rect fill=\"#ddeeff\" height=\"40\" rx=\"5\" stroke=\"#2255cc\" stroke-width=\"1.5\" width=\"70\" x=\"120\" y=\"70\"></rect> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"12\" text-anchor=\"middle\" x=\"155\" y=\"95\">₹82,880</text> <rect fill=\"#ddeeff\" height=\"40\" rx=\"5\" stroke=\"#2255cc\" stroke-width=\"1.5\" width=\"75\" x=\"230\" y=\"70\"></rect> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"12\" text-anchor=\"middle\" x=\"267.5\" y=\"95\">₹92,825.6</text> <rect fill=\"#ccffcc\" height=\"40\" rx=\"5\" stroke=\"#007700\" stroke-width=\"1.5\" width=\"70\" x=\"345\" y=\"70\"></rect> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"380\" y=\"95\">₹11,139.1</text> <path d=\"M 80 90 L 115 90 M 110 85 L 115 90 L 110 95\" fill=\"none\" stroke=\"#2255cc\" stroke-width=\"1.5\"></path> <text fill=\"#cc5500\" font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" x=\"97.5\" y=\"80\">+12%</text> <text fill=\"#cc5500\" font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" x=\"97.5\" y=\"110\">+8880</text> <path d=\"M 190 90 L 225 90 M 220 85 L 225 90 L 220 95\" fill=\"none\" stroke=\"#2255cc\" stroke-width=\"1.5\"></path> <text fill=\"#cc5500\" font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" x=\"207.5\" y=\"80\">+12%</text> <text fill=\"#cc5500\" font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" x=\"207.5\" y=\"110\">+9945.6</text> <path d=\"M 305 90 L 340 90 M 335 85 L 340 90 L 335 95\" fill=\"none\" stroke=\"#007700\" stroke-width=\"1.5\"></path> <text fill=\"#007700\" font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" x=\"322.5\" y=\"80\">12%</text> <text fill=\"#007700\" font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" x=\"322.5\" y=\"110\">Int.</text> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"210\" y=\"160\">Progression of principal amount and accumulated interest</text> </svg>\n\n<p><strong>Calculations:</strong></p>\n\n<p>⇒ Amount after 1 year (A<sub>1</sub>) = 74000 × (1 + 12/100)</p>\n\n<p>⇒ A<sub>1</sub> = 74000 × 1.12 = ₹82,880</p>\n\n<p>⇒ Amount after 2 years (A<sub>2</sub>) = 82880 × (1 + 12/100)</p>\n\n<p>⇒ A<sub>2</sub> = 82880 × 1.12 = ₹92,825.6</p>\n\n<p>⇒ Interest for the 3<sup>rd</sup> year = 12% of Amount after 2 years</p>\n\n<p>⇒ I<sub>3</sub> = 92825.6 × (12/100)</p>\n\n<p>⇒ I<sub>3</sub> = 11139.072</p>\n\n<p><strong>∴ The correct answer is ₹11139.07.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Compound Interest Formula</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">Total Amount A = P(1 + R/100)<sup>n</sup>, where P is the principal, R is the rate of interest, and n is the time period.</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Successive Interest Growth</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">In compound interest, the interest amount for each subsequent year behaves like a geometric progression with a common ratio of (1 + R/100).</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Simple vs Compound Interest</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">For the 1<sup>st</sup> year, simple and compound interest are identical. From the 2<sup>nd</sup> year onwards, compound interest is always greater because interest is earned on previously accumulated interest.</p>\n\n<p> </p>", "marks": 2, "negMarks": 0.5}, {"text": "If the simple interest on a sum of Rs. A at 6% per annum for 2 years is equal to the simple interest on Rs. B at 4% per annum for 3 years, then what is the ratio of A to B?", "options": ["1:1", "2:3", "2:1", "1:2"], "correct": 1, "solution": "<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png\" width=\"26px\" /> <u style=\"font-size: 21px; font-weight: 700; display: inline !important;\">Shortcut Trick</u></span></p>\n\n<p>When Simple Interests are equal for two different sums:</p>\n\n<p>P<sub>1</sub> : P<sub>2</sub> = (R<sub>2</sub> × T<sub>2</sub>) : (R<sub>1</sub> × T<sub>1</sub>)</p>\n\n<p>Ratio of A to B = (4 × 3) : (6 × 2)</p>\n\n<p>Ratio of A to B = 12 : 12 = 1:1</p>\n\n<p><strong>∴ The correct answer is 1:1.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Alternate Method</u></span></strong></span></p>\n\n<p><strong>Given:</strong></p>\n\n<p>For Principal A: Rate (R<sub>1</sub>) = 6% p.a., Time (T<sub>1</sub>) = 2 years</p>\n\n<p>For Principal B: Rate (R<sub>2</sub>) = 4% p.a., Time (T<sub>2</sub>) = 3 years</p>\n\n<p>Simple interest generated from A and B are equal.</p>\n\n<p><strong>Formula Used:</strong></p>\n\n<p>Simple Interest (SI) = (P × R × T) ÷ 100</p>\n<svg height=\"200\" style=\"display:block;margin:12px 0;background:#ffffff;border-radius:10px;border:1px solid #cccccc;font-family:sans-serif;\" viewbox=\"0 0 420 200\" width=\"420\" xmlns=\"http://www.w3.org/2000/svg\"> <rect fill=\"#ddeeff\" height=\"90\" rx=\"8\" stroke=\"#2255cc\" stroke-width=\"1.5\" width=\"150\" x=\"30\" y=\"40\"></rect> <text fill=\"#222222\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\" x=\"105\" y=\"65\">Case 1</text> <text fill=\"#222222\" font-size=\"13\" text-anchor=\"middle\" x=\"105\" y=\"85\">Principal = A</text> <text fill=\"#222222\" font-size=\"13\" text-anchor=\"middle\" x=\"105\" y=\"105\">R = 6%, T = 2 yr</text> <text fill=\"#2255cc\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"105\" y=\"125\">SI = 12% of A</text> <rect fill=\"#fff0cc\" height=\"90\" rx=\"8\" stroke=\"#cc5500\" stroke-width=\"1.5\" width=\"150\" x=\"240\" y=\"40\"></rect> <text fill=\"#222222\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\" x=\"315\" y=\"65\">Case 2</text> <text fill=\"#222222\" font-size=\"13\" text-anchor=\"middle\" x=\"315\" y=\"85\">Principal = B</text> <text fill=\"#222222\" font-size=\"13\" text-anchor=\"middle\" x=\"315\" y=\"105\">R = 4%, T = 3 yr</text> <text fill=\"#cc5500\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"315\" y=\"125\">SI = 12% of B</text> <text fill=\"#222222\" font-size=\"28\" font-weight=\"bold\" text-anchor=\"middle\" x=\"210\" y=\"92\">=</text> <text fill=\"#007700\" font-size=\"15\" font-weight=\"bold\" text-anchor=\"middle\" x=\"210\" y=\"165\">12% of A = 12% of B → A : B = 1 : 1</text> </svg>\n\n<p><strong>Calculations:</strong></p>\n\n<p>⇒ SI on A = (A × 6 × 2) ÷ 100</p>\n\n<p>⇒ SI on B = (B × 4 × 3) ÷ 100</p>\n\n<p>Since the simple interest is equal in both cases:</p>\n\n<p>⇒ (A × 12) ÷ 100 = (B × 12) ÷ 100</p>\n\n<p>⇒ 12A = 12B</p>\n\n<p>⇒ A ÷ B = 1 ÷ 1</p>\n\n<p>⇒ A : B = 1:1</p>\n\n<p><strong>∴ The correct answer is 1:1.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Equal Simple Interest Distribution</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">When a sum is divided into parts such that their simple interests are equal, the ratio of their principals is P<sub>1</sub> : P<sub>2</sub> = (1 ÷ R<sub>1</sub>T<sub>1</sub>) : (1 ÷ R<sub>2</sub>T<sub>2</sub>).</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Equal Amount Distribution</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">When a sum is divided into parts such that their final amounts are equal, the ratio of principals is P<sub>1</sub> : P<sub>2</sub> = 1 ÷ (100 + R<sub>1</sub>T<sub>1</sub>) : 1 ÷ (100 + R<sub>2</sub>T<sub>2</sub>).</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Compound Ratio</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">When evaluating multiplicative factors in equations like 12A = 12B, solving for proportional components is simplified using the inverse ratio property A : B = B's coefficient : A's coefficient.</p>\n\n<p> </p>", "marks": 2, "negMarks": 0.5}, {"text": "Which of these is a number that is real but NOT rational?", "options": ["3/4", "5", "Square root of 7", "-2"], "correct": 3, "solution": "<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png\" width=\"26px\" /> <u style=\"font-size: 21px; font-weight: 700; display: inline !important;\">Shortcut Trick</u></span></p>\n\n<p>A real number that is not rational is called an irrational number.</p>\n\n<p>Square roots of non-perfect squares are always irrational.</p>\n\n<p>Since 7 is not a perfect square, its square root cannot be written as a simple fraction.</p>\n\n<p>The numbers 3/4, 5, and −2 are clearly rational as they can easily be expressed in the form p/q.</p>\n\n<p><strong>∴ The correct answer is √7.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Alternate Method</u></span></strong></span></p>\n\n<p><strong>Given:</strong></p>\n\n<p>Options: 3/4, 5, √7, −2</p>\n\n<p><strong>Definition Used:</strong></p>\n\n<p>⇒ Rational Number: A number that can be expressed as p/q, where p and q are integers and q ≠ 0.</p>\n\n<p>⇒ Irrational Number: A real number that is not rational.</p>\n\n<p><strong>Calculations:</strong></p>\n\n<p>⇒ Option 1: 3/4 is already in the form p/q, so it is a rational number.</p>\n\n<p>⇒ Option 2: 5 can be written as 5/1, which is in the form p/q, so it is a rational number.</p>\n\n<p>⇒ Option 4: −2 can be written as −2/1, which is in the form p/q, so it is a rational number.</p>\n\n<p>⇒ Option 3: √7. Since 7 is not a perfect square, its square root evaluates to a non-terminating and non-repeating decimal.</p>\n\n<p>⇒ Thus, √7 cannot be expressed as a simple fraction p/q.</p>\n\n<p>⇒ Therefore, √7 is a real number but NOT rational.</p>\n\n<p><strong>∴ The correct answer is √7.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Real Numbers</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">Real numbers consist of all rational and irrational numbers. They can be geometrically represented on a continuous number line.</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Rational Numbers</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">Numbers that can be written as a ratio of two integers p/q (where q ≠ 0). Their decimal forms are either terminating or repeating.</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Irrational Numbers</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">Numbers that cannot be written as a simple fraction of integers. Their decimal expansions are non-terminating and non-repeating. Common examples include π, √2, and √3.</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Perfect Squares</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">The square root of a perfect square integer (like √16 = 4) is always rational. Conversely, the square root of any non-perfect square integer is always irrational.</p>\n\n<p> </p>", "marks": 2, "negMarks": 0.5}, {"text": "Manoj crosses a 500 m long street in 5 minutes. What is his speed in km per hour?", "options": ["5.5 km/h.", "5 km/h.", "6 km/h.", "7 km/h."], "correct": 3, "solution": "<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png\" width=\"26px\" /> <u style=\"font-size: 21px; font-weight: 700; display: inline !important;\">Shortcut Trick</u></span></p>\n\n<p>Speed = Distance ÷ Time</p>\n\n<p>Speed in m/s = 500 ÷ (5 × 60) = 500 ÷ 300 = 5/3 m/s</p>\n\n<p>To convert speed from m/s to km/h, multiply directly by 18/5.</p>\n\n<p>Speed in km/h = (5/3) × (18/5) = 18 ÷ 3 = 6 km/h</p>\n\n<p><strong>∴ The correct answer is 6 km/h.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Alternate Method</u></span></strong></span></p>\n\n<p><strong>Given:</strong></p>\n\n<p>Distance covered by Manoj = 500 m</p>\n\n<p>Time taken = 5 minutes = 5 × 60 = 300 seconds</p>\n<svg height=\"200\" style=\"display:block;margin:12px 0;background:#ffffff;border-radius:10px;border:1px solid #cccccc;\" viewbox=\"0 0 420 200\" width=\"420\" xmlns=\"http://www.w3.org/2000/svg\"> <rect fill=\"#ddeeff\" height=\"12\" stroke=\"#2255cc\" stroke-width=\"1.5\" width=\"320\" x=\"50\" y=\"100\"></rect> <path d=\"M 50 85 L 50 75 L 370 75 L 370 85\" fill=\"none\" stroke=\"#2255cc\" stroke-width=\"1.5\"></path> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\" x=\"210\" y=\"65\">Distance = 500 m</text> <text fill=\"#cc5500\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\" x=\"210\" y=\"140\">Time = 5 minutes (300 s)</text> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\" x=\"210\" y=\"165\">Speed = ? km/h</text> </svg>\n\n<p><strong>Formula Used:</strong></p>\n\n<p>Speed = Distance ÷ Time</p>\n\n<p>Conversion rule: x m/s = x × (18/5) km/h</p>\n\n<p><strong>Calculations:</strong></p>\n\n<p>⇒ Speed in m/s = 500 ÷ 300</p>\n\n<p>⇒ Speed = 5/3 m/s</p>\n\n<p>⇒ Converting to km/h: Speed = (5/3) × (18/5) km/h</p>\n\n<p>⇒ Speed = (5 × 18) ÷ (3 × 5)</p>\n\n<p>⇒ Speed = 90 ÷ 15 = 6 km/h</p>\n\n<p><strong>∴ The correct answer is 6 km/h.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Unit Conversion Rule</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">1 km/h = (1000 m) ÷ (3600 s) = 5/18 m/s.<br />\nTo convert m/s to km/h, multiply by the inverse fraction, which is 18/5.</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Average Speed Concept</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">Average Speed = Total Distance ÷ Total Time.<br />\nWhen an object covers two equal distances at speeds a and b, the Average Speed = 2ab ÷ (a + b).</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Relative Speed Concept</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">When two bodies travel in the same direction, Relative Speed = |a − b|.<br />\nWhen two bodies travel in opposite directions, Relative Speed = a + b.</p>\n\n<p> </p>", "marks": 2, "negMarks": 0.5}, {"text": "A pyramid with an equilateral triangular base of side 10 cm and height 14 cm is placed on top of a cube with side length 10 cm. Find the total volume of the composite solid.", "options": ["2102.57 cm³", "1202.07 cm³", "4202.07 cm³", "6202.57 cm³"], "correct": 2, "solution": "<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png\" width=\"26px\" /> <u style=\"font-size: 21px; font-weight: 700; display: inline !important;\">Shortcut Trick</u></span></p>\n\n<p>Total Volume = Volume of Cube + Volume of Pyramid</p>\n\n<p>⇒ Total Volume = (side)<sup>3</sup> + (1/3) × (√3 / 4 × base<sup>2</sup>) × height</p>\n\n<p>⇒ Total Volume = 10<sup>3</sup> + (1/3) × (√3 / 4 × 100) × 14</p>\n\n<p>⇒ Total Volume = 1000 + (350√3 / 3) ≈ 1000 + 202.07</p>\n\n<p>⇒ Total Volume = 1202.07 cm<sup>3</sup></p>\n\n<p><strong>∴ The correct answer is 1202.07 cm<sup>3</sup>.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Alternate Method</u></span></strong></span></p>\n\n<p><strong>Given:</strong></p>\n\n<p>Side of the cube (a) = 10 cm</p>\n\n<p>Side of the equilateral triangular base of the pyramid (b) = 10 cm</p>\n\n<p>Height of the pyramid (h) = 14 cm</p>\n\n<p><strong>Formula Used:</strong></p>\n\n<p>Volume of a cube = a<sup>3</sup></p>\n\n<p>Area of an equilateral triangle = (√3 / 4) × b<sup>2</sup></p>\n\n<p>Volume of a pyramid = (1/3) × Base Area × height</p>\n<svg height=\"260\" style=\"display:block;margin:12px 0;background:#ffffff;border-radius:10px;border:1px solid #cccccc;\" viewbox=\"0 0 420 260\" width=\"420\" xmlns=\"http://www.w3.org/2000/svg\"> <rect fill=\"#ddeeff\" height=\"100\" stroke=\"#2255cc\" stroke-width=\"2\" width=\"100\" x=\"160\" y=\"120\"></rect> <polygon fill=\"#fff0cc\" points=\"160,120 260,120 210,20\" stroke=\"#cc5500\" stroke-width=\"2\"></polygon> <line stroke=\"#cc0000\" stroke-dasharray=\"5,3\" stroke-width=\"1.5\" x1=\"210\" x2=\"210\" y1=\"20\" y2=\"120\"></line> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"13\" text-anchor=\"middle\" x=\"210\" y=\"238\">10 cm</text> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"13\" x=\"270\" y=\"175\">10 cm</text> <text fill=\"#cc5500\" font-family=\"sans-serif\" font-size=\"13\" x=\"218\" y=\"75\">h = 14 cm</text> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"12\" text-anchor=\"middle\" x=\"210\" y=\"112\">Equilateral Base = 10 cm</text> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"210\" y=\"254\">Composite Solid: Cube + Pyramid</text> </svg>\n\n<p><strong>Calculations:</strong></p>\n\n<p>⇒ Volume of the cube = 10 × 10 × 10 = 1000 cm<sup>3</sup></p>\n\n<p>⇒ Area of the pyramid's base = (√3 / 4) × 10<sup>2</sup> = 25√3 cm<sup>2</sup></p>\n\n<p>⇒ Volume of the pyramid = (1/3) × 25√3 × 14 = (350√3) / 3 cm<sup>3</sup></p>\n\n<p>⇒ Substituting the approximate value of √3 ≈ 1.732:</p>\n\n<p>⇒ Volume of the pyramid ≈ (350 × 1.732) / 3</p>\n\n<p>⇒ Volume of the pyramid ≈ 606.2 / 3 ≈ 202.07 cm<sup>3</sup></p>\n\n<p>⇒ Total Volume = Volume of the cube + Volume of the pyramid</p>\n\n<p>⇒ Total Volume = 1000 + 202.07 = 1202.07 cm<sup>3</sup></p>\n\n<p><strong>∴ The correct answer is 1202.07 cm<sup>3</sup>.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Volume of a Pyramid</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">Volume = (1/3) × Base Area × Height. This formula is universally applicable to any pyramid, regardless of the 2D shape of its base (square, triangle, hexagon, etc.).</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Area of an Equilateral Triangle</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">Area = (√3 ÷ 4) × a<sup>2</sup>, where a is the length of the side. In an equilateral triangle, all three sides are equal in length, and each internal angle measures 60°.</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Volume of a Cube</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">Volume = a<sup>3</sup>, where a is the side length. A cube is a special type of right prism where all six faces are identical squares.</p>\n\n<p> </p>", "marks": 2, "negMarks": 0.5}, {"text": "A and B invested Rs. 60,000 and Rs. 40,000 respectively for 12 months. A take 10% of the profit for managing. The remaining profit of Rs. 90,000 is divided based on capital. What is B's share?", "options": ["Rs. 36,000", "Rs. 30,000", "Rs. 40,000", "Rs. 35,000"], "correct": 1, "solution": "<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png\" width=\"26px\" /> <u style=\"font-size: 21px; font-weight: 700; display: inline !important;\">Shortcut Trick</u></span></p>\n\n<p>Profit ratio is directly proportional to Capital × Time.</p>\n\n<p>Since the time period is equal (12 months), Profit Ratio = 60,000 : 40,000 = 3 : 2</p>\n\n<p>Remaining profit to be divided = Rs. 90,000</p>\n\n<p>B's share = (2 ÷ 5) × 90,000 = Rs. 36,000</p>\n\n<p><strong>∴ The correct answer is Rs. 36,000.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Alternate Method</u></span></strong></span></p>\n\n<p><strong>Given:</strong></p>\n\n<p>A's investment = Rs. 60,000</p>\n\n<p>B's investment = Rs. 40,000</p>\n\n<p>Time period for both = 12 months</p>\n\n<p>Remaining profit to be distributed based on capital = Rs. 90,000</p>\n<svg height=\"200\" style=\"display:block;margin:12px 0;background:#ffffff;border-radius:10px;border:1px solid #cccccc;\" viewbox=\"0 0 420 200\" width=\"420\" xmlns=\"http://www.w3.org/2000/svg\"> <rect fill=\"#ddeeff\" height=\"100\" stroke=\"#2255cc\" stroke-wid
