which is considered his magnum opus.</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n<ul>\n<li><strong>Magical Realism:</strong>\n<ul>\n<li>Magical realism is a literary genre where magical elements are presented as a natural part of an otherwise realistic environment.</li>\n<li>In <em>One Hundred Years of Solitude</em>, events like ascensions to heaven, ghosts, and extraordinary weather phenomena are presented as everyday occurrences in Macondo.</li>\n<li>This style allows Marquez to explore the complexities of Latin American history and culture in a symbolic and imaginative manner.</li>\n</ul>\n</li>\n<li><strong>Macondo:</strong>\n<ul>\n<li>Macondo is a fictional town that serves as the primary setting for the novel.</li>\n<li>It is inspired by Marquez's hometown of <strong>Aracataca, Colombia</strong>.</li>\n<li>The town becomes a microcosm of Latin American society, reflecting its struggles with colonialism, political turmoil, and modernization.</li>\n</ul>\n</li>\n<li><strong>The Buendía Family:</strong>\n<ul>\n<li>The narrative spans seven generations of the Buendía family, chronicling their triumphs, tragedies, and eventual decline.</li>\n<li>The family members often repeat the same mistakes, symbolizing the cyclical nature of history and human behavior.</li>\n</ul>\n</li>\n<li><strong>Political and Social Commentary:</strong>\n<ul>\n<li>While the novel is not a direct historical account, it draws heavily on the political and social history of Colombia and Latin America.</li>\n<li>Events such as civil wars, the banana massacre, and the exploitation of workers by foreign companies are allegorically depicted in the story.</li>\n</ul>\n</li>\n<li><strong>Significance of the Novel:</strong>\n<ul>\n<li><em>One Hundred Years of Solitude</em> is considered one of the greatest literary works of the 20th century.</li>\n<li>It played a crucial role in the rise of the <strong>Latin American Boom</strong>, a literary movement that brought global attention to Latin American authors.</li>\n<li>The novel has been translated into more than 40 languages and has sold over 50 million copies worldwide.</li>\n</ul>\n</li>\n</ul>89:T1ff6,<p>सही उत्तर है <u><strong>केवल कथन 1 सही है</strong></u>।</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>मुख्य बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>कथन 1:</strong> गैब्रियल गार्सिया मार्केज़ के उपन्यास <em>वन हंड्रेड इयर्स ऑफ़ सॉलिट्यूड</em> में <strong>जादुई यथार्थवाद</strong> की साहित्यिक तकनीक का उपयोग किया गया है। जादुई यथार्थवाद जादुई या काल्पनिक तत्वों को यथार्थवादी सेटिंग्स और घटनाओं के साथ मिलाता है। कहानी <strong>मैकोंडो</strong> के काल्पनिक शहर में <strong>बुएंदिया परिवार</strong> के उत्थान और पतन का वर्णन करती है। यह कथन <strong>सही</strong> है।</li>\n<li><strong>कथन 2:</strong> उपन्यास 20वीं शताब्दी में कोलंबिया की राजनीतिक घटनाओं पर केंद्रित एक रैखिक ऐतिहासिक विवरण प्रस्तुत नहीं करता है। इसके बजाय, यह व्यक्तिगत, पारिवारिक और पौराणिक कथाओं को व्यापक राजनीतिक और सामाजिक टिप्पणी के साथ जोड़ता है, अक्सर गैर-रैखिक कहानी कहने का उपयोग करता है। यह कथन <strong>गलत</strong> है।</li>\n<li>यह पुस्तक <strong>लैटिन अमेरिकी साहित्य में एक मील का पत्थर</strong> है, जिसे व्यापक रूप से यथार्थवाद और कल्पना के मिश्रण के माध्यम से इतिहास, संस्कृति और राजनीति के चित्रण के लिए मनाया जाता है।</li>\n<li>गैब्रियल गार्सिया मार्केज़ ने <strong>1982 में साहित्य में नोबेल पुरस्कार</strong> जीता, जिसका मुख्य कारण <em>वन हंड्रेड इयर्स ऑफ़ सॉलिट्यूड</em> का प्रभाव था, जिसे उनकी उत्कृष्ट कृति माना जाता है।</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>अतिरिक्त जानकारी</u></span></strong></span></p>\n<ul>\n<li><strong>जादुई यथार्थवाद:</strong>\n<ul>\n<li>जादुई यथार्थवाद एक साहित्यिक शैली है जहाँ जादुई तत्वों को एक अन्यथा यथार्थवादी वातावरण के एक प्राकृतिक भाग के रूप में प्रस्तुत किया जाता है।</li>\n<li><em>वन हंड्रेड इयर्स ऑफ़ सॉलिट्यूड</em> में, स्वर्ग में आरोहण, भूत और असाधारण मौसम की घटनाओं जैसी घटनाओं को मैकोंडो में रोजमर्रा की घटनाओं के रूप में प्रस्तुत किया जाता है।</li>\n<li>यह शैली मार्केज़ को प्रतीकात्मक और कल्पनाशील तरीके से लैटिन अमेरिकी इतिहास और संस्कृति की जटिलताओं का पता लगाने की अनुमति देती है।</li>\n</ul>\n</li>\n<li><strong>मैकोंडो:</strong>\n<ul>\n<li>मैकोंडो एक काल्पनिक शहर है जो उपन्यास के लिए प्राथमिक सेटिंग के रूप में कार्य करता है।</li>\n<li>यह मार्केज़ के गृहनगर <strong>अराकाटाका, कोलंबिया</strong> से प्रेरित है।</li>\n<li>यह शहर लैटिन अमेरिकी समाज का एक सूक्ष्म जगत बन जाता है, जो उपनिवेशवाद, राजनीतिक उथल-पुथल और आधुनिकीकरण के साथ अपने संघर्षों को दर्शाता है।</li>\n</ul>\n</li>\n<li><strong>बुएंदिया परिवार:</strong>\n<ul>\n<li>कथा बुएंदिया परिवार की सात पीढ़ियों तक फैली हुई है, जो उनकी जीत, त्रासदियों और अंतिम पतन का वर्णन करती है।</li>\n<li>परिवार के सदस्य अक्सर एक ही गलतियों को दोहराते हैं, जो इतिहास और मानव व्यवहार की चक्रीय प्रकृति का प्रतीक है।</li>\n</ul>\n</li>\n<li><strong>राजनीतिक और सामाजिक टिप्पणी:</strong>\n<ul>\n<li>हालांकि उपन्यास एक प्रत्यक्ष ऐतिहासिक विवरण नहीं है, लेकिन यह कोलंबिया और लैटिन अमेरिका के राजनीतिक और सामाजिक इतिहास पर बहुत अधिक निर्भर करता है।</li>\n<li>गृह युद्ध, केले नरसंहार और विदेशी कंपनियों द्वारा श्रमिकों के शोषण जैसी घटनाओं को कहानी में रूपक रूप से दर्शाया गया है।</li>\n</ul>\n</li>\n<li><strong>उपन्यास का महत्व:</strong>\n<ul>\n<li><em>वन हंड्रेड इयर्स ऑफ़ सॉलिट्यूड</em> को 20वीं शताब्दी की महानतम साहित्यिक कृतियों में से एक माना जाता है।</li>\n<li>इसने <strong>लैटिन अमेरिकी बूम</strong> के उदय में महत्वपूर्ण भूमिका निभाई, एक साहित्यिक आंदोलन जिसने लैटिन अमेरिकी लेखकों पर वैश्विक ध्यान आकर्षित किया।</li>\n<li>उपन्यास का 40 से अधिक भाषाओं में अनुवाद किया गया है और दुनिया भर में 50 मिलियन से अधिक प्रतियां बिक चुकी हैं।</li>\n</ul>\n</li>\n</ul>8a:T1274,<p>The correct answer is <u><strong>President</strong></u>.</p> <p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p> <ul> <li><strong>Financial Emergency</strong>: The term \"Financial Emergency\" is defined under <strong>Article 360</strong> of the <strong>Indian Constitution</strong>. It allows the <strong>President</strong> of India to take specific measures to safeguard the financial stability of the country.</li> <li>During a Financial Emergency, the <strong>President</strong> has the power to reduce the salaries and allowances of all government employees, including <strong>judges of the Supreme Court and High Courts</strong>.</li> <li>Such measures are implemented to ensure the proper allocation and management of financial resources during the crisis. <em><strong>Hence, the correct answer is \"President.\"</strong></em></li> <li>The proclamation of a Financial Emergency requires the approval of both Houses of Parliament within two months of its issuance.</li> <li>Once approved, the <strong>President</strong> can issue directions to the States regarding financial matters, aiming to control expenditure and maintain fiscal stability.</li> </ul> <p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p> <ul> <li><strong>Article 360:</strong> <ul> <li>Article 360 of the <strong>Indian Constitution</strong> empowers the <strong>President</strong> to declare a Financial Emergency if he/she is convinced that the financial stability or credit of India is under threat.</li> <li>It is considered one of the special provisions under emergency powers granted to the central government.</li> </ul> </li> <li><strong>Implications of Financial Emergency:</strong> <ul> <li>The <strong>Union Government</strong> can direct states to follow specific financial policies to maintain fiscal discipline.</li> <li>The salaries and allowances of government officials, including judges of the <strong>Supreme Court and High Courts</strong>, can be reduced.</li> <li>Such measures aim to ensure the proper utilization of financial resources during an economic crisis.</li> </ul> </li> <li><strong>Examples of Emergency Provisions:</strong> <ul> <li>The Indian Constitution provides for three types of emergencies: <strong>National Emergency</strong> (Article 352), <strong>State Emergency</strong> (Article 356), and <strong>Financial Emergency</strong> (Article 360).</li> <li>While National and State Emergencies have been declared in India, a Financial Emergency has never been invoked.</li> </ul> </li> <li><strong>Role of Parliament:</strong> <ul> <li>The proclamation of a Financial Emergency must be approved by both Houses of Parliament within two months.</li> <li>If not approved, the proclamation ceases to operate at the end of the two-month period.</li> <li>The Parliament has the authority to revoke the Financial Emergency at any time through a resolution.</li> </ul> </li> </ul> <p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Important Points</u></span></strong></span></p> <ul> <li><strong>President's Role:</strong> <ul> <li>The <strong>President</strong> is empowered to take necessary actions during a Financial Emergency, including issuing directions to states and reducing government salaries.</li> <li>The <strong>President</strong> acts on the advice of the <strong>Council of Ministers</strong>, led by the <strong>Prime Minister</strong>.</li> </ul> </li> <li><strong>Judiciary and Financial Emergency:</strong> <ul> <li>The judiciary's independence remains intact, but their salaries and allowances can be reduced under Financial Emergency provisions.</li> <li>Such measures are temporary and aim to stabilize the financial health of the nation.</li> </ul> </li> <li><strong>Historical Context:</strong> <ul> <li>India has faced several economic challenges, but a Financial Emergency under Article 360 has never been declared.</li> <li>The provision serves as a safeguard for extreme situations affecting the country's fiscal stability.</li> </ul> </li> </ul>8b:T23d3,<p>सही उत्तर <u><strong>राष्ट्रपति</strong></u> है।</p> <p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>मुख्य बिंदु</u></span></strong></span></p> <ul> <li><strong>वित्तीय आपातकाल</strong>: \"वित्तीय आपातकाल\" शब्द को <strong>भारतीय संविधान</strong> के <strong>अनुच्छेद 360</strong> के तहत परिभाषित किया गया है। यह भारत के <strong>राष्ट्रपति</strong> को देश की वित्तीय स्थिरता की रक्षा के लिए विशिष्ट उपाय करने की अनुमति देता है।</li> <li>वित्तीय आपातकाल के दौरान, <strong>राष्ट्रपति</strong> के पास सर्वोच्च न्यायालय और उच्च न्यायालयों के <strong>न्यायाधीशों</strong> सहित सभी सरकारी कर्मचारियों के वेतन और भत्ते को कम करने की शक्ति होती है।</li> <li>ऐसे उपाय संकट के दौरान वित्तीय संसाधनों के उचित आवंटन और प्रबंधन को सुनिश्चित करने के लिए लागू किए जाते हैं। <em><strong>इसलिए, सही उत्तर \"राष्ट्रपति\" है।</strong></em></li> <li>वित्तीय आपातकाल की घोषणा के लिए इसके जारी होने के दो महीने के भीतर संसद के दोनों सदनों द्वारा अनुमोदन की आवश्यकता होती है।</li> <li>एक बार स्वीकृत हो जाने पर, <strong>राष्ट्रपति</strong> वित्तीय मामलों के संबंध में राज्यों को निर्देश जारी कर सकते हैं, जिसका उद्देश्य व्यय को नियंत्रित करना और राजकोषीय स्थिरता बनाए रखना है।</li> </ul> <p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>अतिरिक्त जानकारी</u></span></strong></span></p> <ul> <li><strong>अनुच्छेद 360:</strong> <ul> <li><strong>भारतीय संविधान</strong> का अनुच्छेद 360 <strong>राष्ट्रपति</strong> को वित्तीय आपातकाल घोषित करने का अधिकार देता है यदि वह/उसे विश्वास हो कि भारत की वित्तीय स्थिरता या ऋण खतरे में है।</li> <li>इसे केंद्र सरकार को दी गई आपातकालीन शक्तियों के तहत विशेष प्रावधानों में से एक माना जाता है।</li> </ul> </li> <li><strong>वित्तीय आपातकाल के निहितार्थ:</strong> <ul> <li><strong>संघ सरकार</strong> राजकोषीय अनुशासन बनाए रखने के लिए राज्यों को विशिष्ट वित्तीय नीतियों का पालन करने का निर्देश दे सकती है।</li> <li><strong>सर्वोच्च न्यायालय और उच्च न्यायालयों</strong> के न्यायाधीशों सहित सरकारी अधिकारियों के वेतन और भत्ते को कम किया जा सकता है।</li> <li>ऐसे उपायों का उद्देश्य आर्थिक संकट के दौरान वित्तीय संसाधनों का उचित उपयोग सुनिश्चित करना है।</li> </ul> </li> <li><strong>आपातकालीन प्रावधानों के उदाहरण:</strong> <ul> <li>भारतीय संविधान तीन प्रकार की आपात स्थितियों का प्रावधान करता है: <strong>राष्ट्रीय आपातकाल</strong> (अनुच्छेद 352), <strong>राज्य आपातकाल</strong> (अनुच्छेद 356), और <strong>वित्तीय आपातकाल</strong> (अनुच्छेद 360)।</li> <li>जबकि भारत में राष्ट्रीय और राज्य आपातकाल घोषित किए गए हैं, वित्तीय आपातकाल कभी भी लागू नहीं किया गया है।</li> </ul> </li> <li><strong>संसद की भूमिका:</strong> <ul> <li>वित्तीय आपातकाल की घोषणा को दो महीने के भीतर संसद के दोनों सदनों द्वारा अनुमोदित किया जाना चाहिए।</li> <li>यदि अनुमोदित नहीं किया जाता है, तो घोषणा दो महीने की अवधि के अंत में संचालित होना बंद हो जाती है।</li> <li>संसद के पास एक प्रस्ताव के माध्यम से किसी भी समय वित्तीय आपातकाल को रद्द करने का अधिकार है।</li> </ul> </li> </ul> <p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>महत्वपूर्ण बिंदु</u></span></strong></span></p> <ul> <li><strong>राष्ट्रपति की भूमिका:</strong> <ul> <li><strong>राष्ट्रपति</strong> को वित्तीय आपातकाल के दौरान आवश्यक कार्रवाई करने का अधिकार है, जिसमें राज्यों को निर्देश जारी करना और सरकारी वेतन को कम करना शामिल है।</li> <li><strong>राष्ट्रपति</strong> <strong>प्रधान मंत्री</strong> के नेतृत्व में <strong>मंत्रिपरिषद</strong> की सलाह पर कार्य करते हैं।</li> </ul> </li> <li><strong>न्यायपालिका और वित्तीय आपातकाल:</strong> <ul> <li>न्यायपालिका की स्वतंत्रता बरकरार है, लेकिन वित्तीय आपातकाल प्रावधानों के तहत उनके वेतन और भत्ते को कम किया जा सकता है।</li> <li>ऐसे उपाय अस्थायी हैं और इनका उद्देश्य राष्ट्र के वित्तीय स्वास्थ्य को स्थिर करना है।</li> </ul> </li> <li><strong>ऐतिहासिक संदर्भ:</strong> <ul> <li>भारत ने कई आर्थिक चुनौतियों का सामना किया है, लेकिन अनुच्छेद 360 के तहत वित्तीय आपातकाल कभी घोषित नहीं किया गया है।</li> <li>यह प्रावधान देश की राजकोषीय स्थिरता को प्रभावित करने वाली चरम स्थितियों के लिए एक सुरक्षा उपाय के रूप में कार्य करता है।</li> </ul> </li> </ul>8c:T1640,<p>The correct answer is <u><strong>3) A is true, but R is false</strong></u>.</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p>\n<ul>\n<li><strong>Assertion (A): Generative Design Software is increasingly used by ISRO for optimizing structure and weight distribution in aerospace components.</strong>\n<ul>\n<li>This statement is <strong>correct</strong>. ISRO (Indian Space Research Organisation) employs advanced technologies like Generative Design Software to optimize the structural integrity and weight distribution of aerospace components.</li>\n<li>Generative design uses algorithms and AI to explore potential design solutions, improving efficiency and performance in aerospace applications.</li>\n<li>It plays a significant role in reducing the weight of components, which is critical in space exploration to enhance payload capacity and minimize costs.</li>\n</ul>\n</li>\n<li><strong>Reason (R): Generative design tools are specifically developed for modeling cryogenic fuel tanks used in PSLV variants.</strong>\n<ul>\n<li>This statement is <strong>false</strong>. While generative design tools can be applied to a variety of engineering problems, they are not specifically developed for modeling cryogenic fuel tanks used in PSLV (Polar Satellite Launch Vehicle) variants.</li>\n<li>Cryogenic fuel tanks are designed using specialized engineering techniques focusing on material properties, thermal insulation, and structural strength to handle extremely low temperatures, but these do not rely solely on generative design tools.</li>\n</ul>\n</li>\n<li><strong>Conclusion:</strong> The assertion is correct, but the reason provided does not justify the assertion. Therefore, the correct answer is <u><strong>3) A is true, but R is false</strong></u>.</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n<ul>\n<li><strong>Generative Design Software:</strong>\n<ul>\n<li>It is an advanced computational design approach that uses <strong>AI and algorithms</strong> to generate design alternatives based on specific constraints and objectives.</li>\n<li>The software is widely used in <strong>industries like aerospace, automotive, and architecture</strong> for optimizing designs.</li>\n<li>Applications include lightweighting components, improving structural performance, and enhancing material utilization.</li>\n<li>It integrates seamlessly with 3D printing and advanced manufacturing techniques for efficient production.</li>\n</ul>\n</li>\n<li><strong>ISRO's Use of Advanced Technologies:</strong>\n<ul>\n<li>ISRO employs technologies like <strong>topology optimization</strong>, additive manufacturing, and generative design to enhance the efficiency of spacecraft and launch vehicles.</li>\n<li>Weight optimization is critical for launch vehicles like <strong>PSLV, GSLV, and Gaganyaan</strong> to maximize payload capacity while minimizing fuel consumption.</li>\n<li>ISRO also focuses on materials science innovations to develop stronger, lightweight alloys and composites for spacecraft components.</li>\n</ul>\n</li>\n<li><strong>Cryogenic Fuel Tanks:</strong>\n<ul>\n<li>Cryogenic fuel tanks are used to store liquid fuels like <strong>liquid hydrogen (LH2) and liquid oxygen (LOX)</strong> at extremely low temperatures.</li>\n<li>They are engineered using materials like aluminum alloys and composites that can withstand thermal stresses and prevent leakage.</li>\n<li>Specialized thermal insulation is applied to maintain the low temperatures required for cryogenic fuels.</li>\n</ul>\n</li>\n<li><strong>PSLV (Polar Satellite Launch Vehicle):</strong>\n<ul>\n<li>PSLV is one of ISRO's most reliable launch vehicles, capable of deploying satellites into polar orbits.</li>\n<li>It uses a combination of solid and liquid propulsion systems, but it does not rely solely on cryogenic technology (used more prominently in GSLV).</li>\n<li>Generative design software has been employed in optimizing the design of PSLV components to enhance its performance.</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Important Points</u></span></strong></span></p>\n<ul>\n<li><strong>ISRO and Generative Design:</strong>\n<ul>\n<li>ISRO collaborates with organizations like <strong>NASA</strong>, <strong>DRDO</strong>, and private companies to incorporate cutting-edge technologies, including AI-driven generative design.</li>\n<li>Generative design tools help ISRO in areas such as structural analysis, thermal management, and weight optimization of spacecraft and launch vehicles.</li>\n</ul>\n</li>\n<li><strong>Generative Design Applications:</strong>\n<ul>\n<li>Beyond aerospace, generative design is used in <strong>automotive</strong> (e.g., lightweight car parts), <strong>architecture</strong> (e.g., optimized building structures), and <strong>medical devices</strong> (e.g., customized implants).</li>\n<li>It is a growing field with increasing applications in advanced manufacturing and sustainability initiatives.</li>\n</ul>\n</li>\n</ul>\n```8d:T2ef3,<p>सही उत्तर है <u><strong>3) A सत्य है, लेकिन R असत्य है</strong></u>।</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>मुख्य बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>अभिकथन (A): जेनरेटिव डिजाइन सॉफ्टवेयर का उपयोग ISRO द्वारा एयरोस्पेस घटकों में संरचना और वजन वितरण को अनुकूलित करने के लिए तेजी से किया जा रहा है।</strong>\n<ul>\n<li>यह कथन <strong>सही</strong> है। ISRO (भारतीय अंतरिक्ष अनुसंधान संगठन) एयरोस्पेस घटकों की संरचनात्मक अखंडता और वजन वितरण को अनुकूलित करने के लिए जेनरेटिव डिजाइन सॉफ्टवेयर जैसी उन्नत तकनीकों का उपयोग करता है।</li>\n<li>जेनरेटिव डिजाइन संभावित डिजाइन समाधानों का पता लगाने के लिए एल्गोरिदम और AI का उपयोग करता है, जिससे एयरोस्पेस अनुप्रयोगों में दक्षता और प्रदर्शन में सुधार होता है।</li>\n<li>यह घटकों के वजन को कम करने में महत्वपूर्ण भूमिका निभाता है, जो अंतरिक्ष अन्वेषण में पेलोड क्षमता को बढ़ाने और लागत को कम करने के लिए महत्वपूर्ण है।</li>\n</ul>\n</li>\n<li><strong>कारण (R): जेनरेटिव डिजाइन उपकरण विशेष रूप से PSLV वेरिएंट में उपयोग किए जाने वाले क्रायोजेनिक ईंधन टैंकों के मॉडलिंग के लिए विकसित किए गए हैं।</strong>\n<ul>\n<li>यह कथन <strong>गलत</strong> है। जबकि जेनरेटिव डिजाइन उपकरणों को विभिन्न प्रकार की इंजीनियरिंग समस्याओं पर लागू किया जा सकता है, लेकिन वे विशेष रूप से PSLV (ध्रुवीय उपग्रह प्रक्षेपण यान) वेरिएंट में उपयोग किए जाने वाले क्रायोजेनिक ईंधन टैंकों के मॉडलिंग के लिए विकसित नहीं किए गए हैं।</li>\n<li>क्रायोजेनिक ईंधन टैंकों को विशेष इंजीनियरिंग तकनीकों का उपयोग करके डिज़ाइन किया गया है जो सामग्री गुणों, थर्मल इन्सुलेशन और संरचनात्मक शक्ति पर ध्यान केंद्रित करते हैं ताकि बेहद कम तापमान को संभाला जा सके, लेकिन ये पूरी तरह से जेनरेटिव डिजाइन उपकरणों पर निर्भर नहीं होते हैं।</li>\n</ul>\n</li>\n<li><strong>निष्कर्ष:</strong> अभिकथन सही है, लेकिन दिया गया कारण अभिकथन को सही नहीं ठहराता है। इसलिए, सही उत्तर है <u><strong>3) A सत्य है, लेकिन R असत्य है</strong></u>।</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>अतिरिक्त जानकारी</u></span></strong></span></p>\n<ul>\n<li><strong>जेनरेटिव डिजाइन सॉफ्टवेयर:</strong>\n<ul>\n<li>यह एक उन्नत कम्प्यूटेशनल डिजाइन दृष्टिकोण है जो विशिष्ट बाधाओं और उद्देश्यों के आधार पर डिजाइन विकल्पों को उत्पन्न करने के लिए <strong>AI और एल्गोरिदम</strong> का उपयोग करता है।</li>\n<li>सॉफ्टवेयर का उपयोग व्यापक रूप से <strong>एयरोस्पेस, ऑटोमोटिव और आर्किटेक्चर जैसे उद्योगों</strong> में डिजाइनों को अनुकूलित करने के लिए किया जाता है।</li>\n<li>अनुप्रयोगों में हल्के घटकों, संरचनात्मक प्रदर्शन में सुधार और सामग्री उपयोग को बढ़ाना शामिल है।</li>\n<li>यह कुशल उत्पादन के लिए 3D प्रिंटिंग और उन्नत विनिर्माण तकनीकों के साथ सहजता से एकीकृत होता है।</li>\n</ul>\n</li>\n<li><strong>उन्नत तकनीकों का ISRO का उपयोग:</strong>\n<ul>\n<li>ISRO अंतरिक्ष यान और प्रक्षेपण यान की दक्षता बढ़ाने के लिए <strong>टोपोलॉजी अनुकूलन</strong>, एडिटिव मैन्युफैक्चरिंग और जेनरेटिव डिजाइन जैसी तकनीकों का उपयोग करता है।</li>\n<li>ईंधन की खपत को कम करते हुए पेलोड क्षमता को अधिकतम करने के लिए <strong>PSLV, GSLV और गगनयान</strong> जैसे प्रक्षेपण यान के लिए वजन अनुकूलन महत्वपूर्ण है।</li>\n<li>ISRO अंतरिक्ष यान घटकों के लिए मजबूत, हल्के मिश्र धातुओं और कंपोजिट विकसित करने के लिए सामग्री विज्ञान नवाचारों पर भी ध्यान केंद्रित करता है।</li>\n</ul>\n</li>\n<li><strong>क्रायोजेनिक ईंधन टैंक:</strong>\n<ul>\n<li>क्रायोजेनिक ईंधन टैंकों का उपयोग बेहद कम तापमान पर <strong>तरल हाइड्रोजन (LH2) और तरल ऑक्सीजन (LOX)</strong> जैसे तरल ईंधन को स्टोर करने के लिए किया जाता है।</li>\n<li>इन्हें एल्यूमीनियम मिश्र धातुओं और कंपोजिट जैसी सामग्रियों का उपयोग करके इंजीनियर किया जाता है जो थर्मल तनाव का सामना कर सकते हैं और रिसाव को रोक सकते हैं।</li>\n<li>क्रायोजेनिक ईंधन के लिए आवश्यक कम तापमान को बनाए रखने के लिए विशेष थर्मल इन्सुलेशन लगाया जाता है।</li>\n</ul>\n</li>\n<li><strong>PSLV (ध्रुवीय उपग्रह प्रक्षेपण यान):</strong>\n<ul>\n<li>PSLV ISRO के सबसे विश्वसनीय प्रक्षेपण यानों में से एक है, जो उपग्रहों को ध्रुवीय कक्षाओं में तैनात करने में सक्षम है।</li>\n<li>यह ठोस और तरल प्रणोदन प्रणालियों के संयोजन का उपयोग करता है, लेकिन यह पूरी तरह से क्रायोजेनिक तकनीक पर निर्भर नहीं है (GSLV में अधिक प्रमुखता से उपयोग किया जाता है)।</li>\n<li>PSLV घटकों के डिजाइन को अनुकूलित करने के लिए जेनरेटिव डिजाइन सॉफ्टवेयर का उपयोग किया गया है ताकि इसके प्रदर्शन को बढ़ाया जा सके।</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>महत्वपूर्ण बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>ISRO और जेनरेटिव डिजाइन:</strong>\n<ul>\n<li>ISRO AI-संचालित जेनरेटिव डिजाइन सहित अत्याधुनिक तकनीकों को शामिल करने के लिए <strong>NASA</strong>, <strong>DRDO</strong> और निजी कंपनियों जैसे संगठनों के साथ सहयोग करता है।</li>\n<li>जेनरेटिव डिजाइन उपकरण ISRO को अंतरिक्ष यान और प्रक्षेपण यान के संरचनात्मक विश्लेषण, थर्मल प्रबंधन और वजन अनुकूलन जैसे क्षेत्रों में मदद करते हैं।</li>\n</ul>\n</li>\n<li><strong>जेनरेटिव डिजाइन अनुप्रयोग:</strong>\n<ul>\n<li>एयरोस्पेस से परे, जेनरेटिव डिजाइन का उपयोग <strong>ऑटोमोटिव</strong> (जैसे, हल्के कार के पुर्जे), <strong>आर्किटेक्चर</strong> (जैसे, अनुकूलित भवन संरचनाएं) और <strong>चिकित्सा उपकरणों</strong> (जैसे, अनुकूलित प्रत्यारोपण) में किया जाता है।</li>\n<li>यह उन्नत विनिर्माण और स्थिरता पहलों में बढ़ते अनुप्रयोगों के साथ एक बढ़ता हुआ क्षेत्र है।</li>\n</ul>\n</li>\n</ul>", "marks": 2, "negMarks": 0.5}, {"text": "Why is nichrome commonly used as the heating element in electric heaters?", "options": ["It has low resistivity and a high melting point", "It has high resistivity and a low melting point", "It offers high resistivity and a high melting point", "It offers low resistivity and a low melting point"], "correct": 3, "solution": "<p>The correct answer is <u><strong>It offers high resistivity and a high melting point.</strong></u>.</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p>\n<ul>\n<li><strong>High Resistivity:</strong> Nichrome has a high resistivity, which makes it ideal for use as a heating element. High resistivity ensures more heat generation for a given current, making it efficient for heating applications.</li>\n<li><strong>High Melting Point:</strong> Nichrome offers a high melting point (approximately <strong>1400°C</strong>), ensuring that it can withstand high temperatures without melting or deforming. This property is crucial for electric heaters that operate at elevated temperatures.</li>\n<li><strong>Oxidation Resistance:</strong> Nichrome forms a protective layer of chromium oxide on its surface when heated. This layer prevents further oxidation, enhancing its durability and making it suitable for prolonged use as a heating element.</li>\n<li><strong>Mechanical Strength:</strong> Nichrome exhibits excellent mechanical strength even at high temperatures, ensuring that the heating element maintains its structure and functionality during operation.</li>\n<li><strong>Applications:</strong> Due to its properties, nichrome is widely used in appliances like electric heaters, toasters, and hair dryers, as well as industrial heating applications.</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n<ul>\n<li><strong>Composition of Nichrome:</strong> Nichrome is an alloy primarily composed of <strong>Nickel</strong> (approximately 80%) and <strong>Chromium</strong> (approximately 20%), with possible small additions of iron or other elements.</li>\n<li><strong>Uses:</strong> Apart from electric heaters, nichrome is used in applications like <strong>kilns, laboratory equipment, hot-wire cutters, and resistance wires</strong> due to its ability to generate heat efficiently.</li>\n<li><strong>Thermal Stability:</strong> Nichrome can maintain its properties even after repeated heating cycles, making it suitable for long-term use in devices requiring consistent performance.</li>\n<li><strong>Comparison with Other Materials:</strong> Unlike materials like copper or aluminum, nichrome does not oxidize rapidly at high temperatures and maintains its resistive properties, providing a longer lifespan.</li>\n<li><strong>Safety Features:</strong> The oxidation-resistant properties of nichrome reduce the risk of overheating and material degradation, ensuring safer operation in heating devices.</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Important Points</u></span></strong></span></p>\n<ul>\n<li><strong>Option 1:</strong> Low resistivity and high melting point are not characteristic of nichrome. Nichrome has <strong>high resistivity</strong>, not low. This option is incorrect.</li>\n<li><strong>Option 2:</strong> High resistivity and low melting point are incorrect because nichrome has a <strong>high melting point</strong> (around 1400°C). This option is incorrect.</li>\n<li><strong>Option 4:</strong> Low resistivity and low melting point are incorrect as nichrome is known for its <strong>high resistivity</strong> and <strong>high melting point</strong>. This option is incorrect.</li>\n<li><strong>Correct Option:</strong> The correct answer is that nichrome offers <strong>high resistivity</strong> and a <strong>high melting point</strong>, making it ideal for heating elements.</li>\n</ul>91:T2078,<p>सही उत्तर है <u><strong>यह उच्च प्रतिरोधकता और उच्च गलनांक प्रदान करता है।</strong></u></p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>मुख्य बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>उच्च प्रतिरोधकता:</strong> नाइक्रोम में उच्च प्रतिरोधकता होती है, जो इसे हीटिंग तत्व के रूप में उपयोग के लिए आदर्श बनाती है। उच्च प्रतिरोधकता एक निश्चित धारा के लिए अधिक गर्मी उत्पन्न करना सुनिश्चित करती है, जिससे यह हीटिंग अनुप्रयोगों के लिए कुशल हो जाती है।</li>\n<li><strong>उच्च गलनांक:</strong> नाइक्रोम उच्च गलनांक (लगभग <strong>1400°C</strong>) प्रदान करता है, यह सुनिश्चित करता है कि यह पिघले या विकृत हुए बिना उच्च तापमान का सामना कर सके। यह गुण इलेक्ट्रिक हीटरों के लिए महत्वपूर्ण है जो उच्च तापमान पर काम करते हैं।</li>\n<li><strong>ऑक्सीकरण प्रतिरोध:</strong> गर्म होने पर नाइक्रोम अपनी सतह पर क्रोमियम ऑक्साइड की एक सुरक्षात्मक परत बनाता है। यह परत आगे ऑक्सीकरण को रोकती है, जिससे इसकी स्थायित्व बढ़ती है और यह हीटिंग तत्व के रूप में लंबे समय तक उपयोग के लिए उपयुक्त हो जाती है।</li>\n<li><strong>यांत्रिक शक्ति:</strong> नाइक्रोम उच्च तापमान पर भी उत्कृष्ट यांत्रिक शक्ति प्रदर्शित करता है, यह सुनिश्चित करता है कि हीटिंग तत्व संचालन के दौरान अपनी संरचना और कार्यक्षमता बनाए रखे।</li>\n<li><strong>अनुप्रयोग:</strong> अपने गुणों के कारण, नाइक्रोम का व्यापक रूप से इलेक्ट्रिक हीटर, टोस्टर और हेयर ड्रायर जैसे उपकरणों के साथ-साथ औद्योगिक हीटिंग अनुप्रयोगों में उपयोग किया जाता है।</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>अतिरिक्त जानकारी</u></span></strong></span></p>\n<ul>\n<li><strong>नाइक्रोम की संरचना:</strong> नाइक्रोम एक मिश्र धातु है जो मुख्य रूप से <strong>निकल</strong> (लगभग 80%) और <strong>क्रोमियम</strong> (लगभग 20%) से बनी होती है, जिसमें लोहे या अन्य तत्वों के छोटे अतिरिक्त हो सकते हैं।</li>\n<li><strong>उपयोग:</strong> इलेक्ट्रिक हीटर के अलावा, नाइक्रोम का उपयोग <strong>भट्टियों, प्रयोगशाला उपकरणों, हॉट-वायर कटर और प्रतिरोध तारों</strong> जैसे अनुप्रयोगों में गर्मी को कुशलता से उत्पन्न करने की क्षमता के कारण किया जाता है।</li>\n<li><strong>तापीय स्थिरता:</strong> नाइक्रोम बार-बार हीटिंग चक्रों के बाद भी अपने गुणों को बनाए रख सकता है, जिससे यह लगातार प्रदर्शन की आवश्यकता वाले उपकरणों में दीर्घकालिक उपयोग के लिए उपयुक्त हो जाता है।</li>\n<li><strong>अन्य सामग्रियों के साथ तुलना:</strong> तांबा या एल्यूमीनियम जैसी सामग्रियों के विपरीत, नाइक्रोम उच्च तापमान पर तेजी से ऑक्सीकरण नहीं करता है और अपने प्रतिरोधक गुणों को बनाए रखता है, जिससे लंबी उम्र मिलती है।</li>\n<li><strong>सुरक्षा सुविधाएँ:</strong> नाइक्रोम के ऑक्सीकरण-प्रतिरोधी गुण ज़्यादा गरम होने और सामग्री के क्षरण के जोखिम को कम करते हैं, जिससे हीटिंग उपकरणों में सुरक्षित संचालन सुनिश्चित होता है।</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>महत्वपूर्ण बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>विकल्प 1:</strong> कम प्रतिरोधकता और उच्च गलनांक नाइक्रोम की विशेषता नहीं हैं। नाइक्रोम में <strong>उच्च प्रतिरोधकता</strong> होती है, कम नहीं। यह विकल्प गलत है।</li>\n<li><strong>विकल्प 2:</strong> उच्च प्रतिरोधकता और कम गलनांक गलत हैं क्योंकि नाइक्रोम का <strong>उच्च गलनांक</strong> (लगभग 1400°C) होता है। यह विकल्प गलत है।</li>\n<li><strong>विकल्प 4:</strong> कम प्रतिरोधकता और कम गलनांक गलत हैं क्योंकि नाइक्रोम अपनी <strong>उच्च प्रतिरोधकता</strong> और <strong>उच्च गलनांक</strong> के लिए जाना जाता है। यह विकल्प गलत है।</li>\n<li><strong>सही विकल्प:</strong> सही उत्तर यह है कि नाइक्रोम <strong>उच्च प्रतिरोधकता</strong> और <strong>उच्च गलनांक</strong> प्रदान करता है, जो इसे हीटिंग तत्वों के लिए आदर्श बनाता है।</li>\n</ul>92:T23c9,<p>సరైన సమాధానం <u><strong>ఇది అధిక విశిష్ట నిరోధం మరియు అధిక ద్రవీభవన స్థానాన్ని అందిస్తుంది</strong></u>.</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p>\n<ul>\n<li><strong>అధిక విశిష్ట నిరోధం (High Resistivity):</strong> నైక్రోమ్ అధిక విశిష్ట నిరోధాన్ని కలిగి ఉంటుంది, ఇది దీనిని హీటింగ్ ఎలిమెంట్‌గా ఉపయోగించడానికి అనుకూలంగా చేస్తుంది. అధిక విశిష్ట నిరోధం ఇచ్చిన విద్యుత్ ప్రవాహానికి ఎక్కువ వేడిని ఉత్పత్తి చేసేలా చేస్తుంది, తద్వారా వేడి చేసే ప్రక్రియ సమర్థవంతంగా జరుగుతుంది.</li>\n<li><strong>అధిక ద్రవీభవన స్థానం (High Melting Point):</strong> నైక్రోమ్ అధిక ద్రవీభవన స్థానాన్ని (సుమారుగా <strong>1400°C</strong>) కలిగి ఉంటుంది, ఇది కరగకుండా లేదా ఆకారం మారకుండా అధిక ఉష్ణోగ్రతలను తట్టుకోగలదని నిర్ధారిస్తుంది. అధిక ఉష్ణోగ్రతల వద్ద పనిచేసే విద్యుత్ హీటర్లకు ఈ గుణం చాలా కీలకం.</li>\n<li><strong>ఆక్సీకరణ నిరోధకత (Oxidation Resistance):</strong> నైక్రోమ్‌ను వేడి చేసినప్పుడు దాని ఉపరితలంపై క్రోమియం ఆక్సైడ్ యొక్క రక్షణ పొర ఏర్పడుతుంది. ఈ పొర తదుపరి ఆక్సీకరణను నిరోధిస్తుంది, దాని మన్నికను పెంచుతుంది మరియు హీటింగ్ ఎలిమెంట్‌గా సుదీర్ఘ కాలం ఉపయోగించడానికి అనువుగా చేస్తుంది.</li>\n<li><strong>యాంత్రిక బలం (Mechanical Strength):</strong> నైక్రోమ్ అధిక ఉష్ణోగ్రతల వద్ద కూడా అద్భుతమైన యాంత్రిక బలాన్ని ప్రదర్శిస్తుంది, ఇది పనిచేసే సమయంలో హీటింగ్ ఎలిమెంట్ తన నిర్మాణాన్ని మరియు పనితీరును కోల్పోకుండా చూస్తుంది.</li>\n<li><strong>అప్లికేషన్లు:</strong> ఈ లక్షణాల కారణంగా, విద్యుత్ హీటర్లు, టోస్టర్లు మరియు హెయిర్ డ్రైయర్లు వంటి గృహోపకరణాలలో, అలాగే పారిశ్రామిక హీటింగ్ అప్లికేషన్లలో నైక్రోమ్‌ను విస్తృతంగా ఉపయోగిస్తారు.</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n<ul>\n<li><strong>నైక్రోమ్ యొక్క కూర్పు:</strong> నైక్రోమ్ అనేది ప్రధానంగా <strong>నికెల్</strong> (సుమారు 80%) మరియు <strong>క్రోమియం</strong> (సుమారు 20%) లతో కూడిన ఒక మిశ్రమ లోహం, ఇందులో ఇనుము లేదా ఇతర మూలకాలు స్వల్ప పరిమాణంలో కలిసి ఉండవచ్చు.</li>\n<li><strong>ఉపయోగాలు:</strong> ఎలక్ట్రిక్ హీటర్లే కాకుండా, సమర్థవంతంగా వేడిని ఉత్పత్తి చేయగల సామర్థ్యం ఉన్నందున నైక్రోమ్‌ను <strong>భట్టీలు (కిల్న్స్), ప్రయోగశాల పరికరాలు, హాట్-వైర్ కట్టర్లు మరియు నిరోధక తీగలలో</strong> ఉపయోగిస్తారు.</li>\n<li><strong>తాపజనక స్థిరత్వం (Thermal Stability):</strong> నైక్రోమ్ పదేపదే వేడి చేసినప్పటికీ తన లక్షణాలను కోల్పోకుండా ఉంటుంది, స్థిరమైన పనితీరు అవసరమయ్యే పరికరాలలో దీర్ఘకాలిక వినియోగానికి ఇది సరిపోతుంది.</li>\n<li><strong>ఇతర లోహాలతో పోలిక:</strong> రాగి లేదా అల్యూమినియం వంటి లోహాల వలె కాకుండా, నైక్రోమ్ అధిక ఉష్ణోగ్రతల వద్ద వేగంగా ఆక్సీకరణం చెందదు మరియు దాని నిరోధక లక్షణాలను నిలుపుకుంటుంది, దీనివలన ఇది ఎక్కువ కాలం మన్నుతుంది.</li>\n<li><strong>భద్రతా లక్షణాలు:</strong> నైక్రోమ్ యొక్క ఆక్సీకరణ-నిరోధక లక్షణాలు అధికంగా వేడెక్కడం మరియు పదార్థం క్షీణించే ప్రమాదాన్ని తగ్గిస్తాయి, హీటింగ్ పరికరాలలో సురక్షితమైన పనితీరును నిర్ధారిస్తాయి.</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Important Points</u></span></strong></span></p>\n<ul>\n<li><strong>ఆప్షన్ 1:</strong> తక్కువ విశిష్ట నిరోధం మరియు అధిక ద్రవీభవన స్థానం నైక్రోమ్ యొక్క లక్షణాలు కావు. నైక్రోమ్ <strong>అధిక విశిష్ట నిరోధాన్ని</strong> కలిగి ఉంటుంది, తక్కువ కాదు. కాబట్టి ఈ ఆప్షన్ తప్పు.</li>\n<li><strong>ఆప్షన్ 2:</strong> అధిక విశిష్ట నిరోధం మరియు తక్కువ ద్రవీభవన స్థానం తప్పు ఎందుకంటే నైక్రోమ్ <strong>అధిక ద్రవీభవన స్థానాన్ని</strong> (సుమారు 1400°C) కలిగి ఉంటుంది. కాబట్టి ఈ ఆప్షన్ తప్పు.</li>\n<li><strong>ఆప్షన్ 4:</strong> తక్కువ విశిష్ట నిరోధం మరియు తక్కువ ద్రవీభవన స్థానం తప్పు ఎందుకంటే నైక్రోమ్ దాని <strong>అధిక విశిష్ట నిరోధం</strong> మరియు <strong>అధిక ద్రవీభవన స్థానం</strong> ద్వారా గుర్తించబడుతుంది. కాబట్టి ఈ ఆప్షన్ తప్పు.</li>\n<li><strong>సరైన ఆప్షన్:</strong> నైక్రోమ్ <strong>అధిక విశిష్ట నిరోధం</strong> మరియు <strong>అధిక ద్రవీభవన స్థానాన్ని</strong> అందిస్తుంది, దీని వలన ఇది హీటింగ్ ఎలిమెంట్స్ కొరకు అనువైనదిగా మారుతుంది.</li>\n</ul>93:T20ab,<p>योग्य उत्तर आहे <u><strong>हे उच्च प्रतिरोधकता आणि उच्च वितळणांक देते</strong></u>.</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>मुख्य मुद्दे</u></span></strong></span></p>\n<ul>\n<li><strong>उच्च प्रतिरोधकता:</strong> निक्रोममध्ये उच्च प्रतिरोधकता असते, ज्यामुळे ते हीटिंग एलिमेंट म्हणून वापरण्यासाठी योग्य ठरते. उच्च प्रतिरोधकता दिलेल्या प्रवाहासाठी अधिक उष्णता निर्माण करते, ज्यामुळे ते हीटिंग ऍप्लिकेशन्ससाठी कार्यक्षम बनते.</li>\n<li><strong>उच्च वितळणांक:</strong> निक्रोम उच्च वितळणांक (अंदाजे <strong>1400°C</strong>) देते, ज्यामुळे ते वितळल्याशिवाय किंवा विकृत न होता उच्च तापमान सहन करू शकते. उच्च तापमानात चालणाऱ्या इलेक्ट्रिक हीटरसाठी हा गुणधर्म महत्त्वपूर्ण आहे.</li>\n<li><strong>ऑक्सिडेशन प्रतिरोध:</strong> निक्रोम गरम केल्यावर त्याच्या पृष्ठभागावर क्रोमियम ऑक्साईडचा संरक्षक थर तयार करते. हा थर पुढील ऑक्सिडेशनला प्रतिबंध करतो, त्याची टिकाऊपणा वाढवतो आणि हीटिंग एलिमेंट म्हणून दीर्घकाळापर्यंत वापरण्यासाठी ते योग्य बनवतो.</li>\n<li><strong>यांत्रिक शक्ती:</strong> निक्रोम उच्च तापमानातही उत्कृष्ट यांत्रिक शक्ती दर्शवते, ज्यामुळे हीटिंग एलिमेंट कार्यक्षमतेदरम्यान त्याची रचना आणि कार्यक्षमता राखते.</li>\n<li><strong>अनुप्रयोग:</strong> त्याच्या गुणधर्मांमुळे, निक्रोमचा वापर इलेक्ट्रिक हीटर, टोस्टर आणि हेअर ड्रायर सारख्या उपकरणांमध्ये तसेच औद्योगिक हीटिंग ऍप्लिकेशन्समध्ये मोठ्या प्रमाणात केला जातो.</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>अतिरिक्त माहिती</u></span></strong></span></p>\n<ul>\n<li><strong>निक्रोमची रचना:</strong> निक्रोम हे मुख्यतः <strong>निकेल</strong> (अंदाजे 80%) आणि <strong>क्रोमियम</strong> (अंदाजे 20%) पासून बनलेले एक धातू मिश्रण आहे, ज्यात लोह किंवा इतर घटकांची संभाव्य लहान भर असू शकते.</li>\n<li><strong>उपयोग:</strong> इलेक्ट्रिक हीटर व्यतिरिक्त, निक्रोमचा वापर <strong>भट्ट्या, प्रयोगशाळेतील उपकरणे, हॉट-वायर कटर आणि प्रतिरोधक तारे</strong> यांसारख्या ऍप्लिकेशन्समध्ये उष्णता कार्यक्षमतेने निर्माण करण्याच्या क्षमतेमुळे केला जातो.</li>\n<li><strong>औष्णिक स्थिरता:</strong> निक्रोम वारंवार गरम करण्याच्या चक्रानंतरही त्याचे गुणधर्म टिकवून ठेवू शकते, ज्यामुळे सातत्यपूर्ण कार्यक्षमतेची आवश्यकता असलेल्या उपकरणांमध्ये दीर्घकाळ वापरण्यासाठी ते योग्य ठरते.</li>\n<li><strong>इतर सामग्रीशी तुलना:</strong> तांबे किंवा ॲल्युमिनियमसारख्या सामग्रीच्या विपरीत, निक्रोम उच्च तापमानात वेगाने ऑक्सिडाइज होत नाही आणि त्याचे प्रतिरोधक गुणधर्म टिकवून ठेवते, ज्यामुळे दीर्घ आयुष्य मिळते.</li>\n<li><strong>सुरक्षा वैशिष्ट्ये:</strong> निक्रोमचे ऑक्सिडेशन-प्रतिरोधक गुणधर्म अति उष्णता आणि सामग्रीच्या विघटनाचा धोका कमी करतात, ज्यामुळे हीटिंग उपकरणांमध्ये सुरक्षित ऑपरेशन सुनिश्चित होते.</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>महत्वाचे मुद्दे</u></span></strong></span></p>\n<ul>\n<li><strong>पर्याय 1:</strong> कमी प्रतिरोधकता आणि उच्च वितळणांक हे निक्रोमचे वैशिष्ट्य नाही. निक्रोममध्ये <strong>उच्च प्रतिरोधकता</strong> असते, कमी नाही. हा पर्याय चुकीचा आहे.</li>\n<li><strong>पर्याय 2:</strong> उच्च प्रतिरोधकता आणि कमी वितळणांक चुकीचे आहेत कारण निक्रोममध्ये <strong>उच्च वितळणांक</strong> (सुमारे 1400°C) असतो. हा पर्याय चुकीचा आहे.</li>\n<li><strong>पर्याय 4:</strong> कमी प्रतिरोधकता आणि कमी वितळणांक चुकीचे आहेत कारण निक्रोम त्याच्या <strong>उच्च प्रतिरोधकता</strong> आणि <strong>उच्च वितळणांकासाठी</strong> ओळखले जाते. हा पर्याय चुकीचा आहे.</li>\n<li><strong>योग्य पर्याय:</strong> योग्य उत्तर आहे की निक्रोम <strong>उच्च प्रतिरोधकता</strong> आणि <strong>उच्च वितळणांक</strong> देते, ज्यामुळे ते हीटिंग एलिमेंटसाठी आदर्श बनते.</li>\n</ul>94:T209f,<p>সঠিক উত্তর হল <u><strong>এটি উচ্চ রোধ ক্ষমতা এবং উচ্চ গলনাঙ্ক সরবরাহ করে।</strong></u></p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>গুরুত্বপূর্ণ তথ্য</u></span></strong></span></p>\n<ul>\n<li><strong>উচ্চ রোধ ক্ষমতা:</strong> নাইক্রোমের রোধ ক্ষমতা বেশি, যা এটিকে গরম করার উপাদান হিসাবে ব্যবহারের জন্য আদর্শ করে তোলে। উচ্চ রোধ ক্ষমতা প্রদত্ত কারেন্টের জন্য আরও বেশি তাপ উৎপাদন নিশ্চিত করে, যা এটিকে গরম করার অ্যাপ্লিকেশনগুলির জন্য দক্ষ করে তোলে।</li>\n<li><strong>উচ্চ গলনাঙ্ক:</strong> নাইক্রোম একটি উচ্চ গলনাঙ্ক (প্রায় <strong>1400°C</strong>) সরবরাহ করে, যা এটি গলে যাওয়া বা বিকৃত না হয়ে উচ্চ তাপমাত্রা সহ্য করতে পারে তা নিশ্চিত করে। এই সম্পত্তিটি উচ্চ তাপমাত্রায় কাজ করে এমন বৈদ্যুতিক হিটারগুলির জন্য গুরুত্বপূর্ণ।</li>\n<li><strong>জারণ প্রতিরোধ ক্ষমতা:</strong> নাইক্রোম উত্তপ্ত হলে এর পৃষ্ঠে ক্রোমিয়াম অক্সাইডের একটি প্রতিরক্ষামূলক স্তর তৈরি করে। এই স্তরটি আরও জারণ প্রতিরোধ করে, এর স্থায়িত্ব বাড়ায় এবং এটিকে গরম করার উপাদান হিসাবে দীর্ঘক্ষণ ব্যবহারের জন্য উপযুক্ত করে তোলে।</li>\n<li><strong>যান্ত্রিক শক্তি:</strong> নাইক্রোম উচ্চ তাপমাত্রায়ও চমৎকার যান্ত্রিক শক্তি প্রদর্শন করে, এটি নিশ্চিত করে যে গরম করার উপাদান অপারেশনের সময় তার গঠন এবং কার্যকারিতা বজায় রাখে।</li>\n<li><strong>অ্যাপ্লিকেশন:</strong> এর বৈশিষ্ট্যের কারণে, নাইক্রোম বৈদ্যুতিক হিটার, টোস্টার এবং হেয়ার ড্রায়ারের মতো সরঞ্জামগুলিতে, সেইসাথে শিল্পে গরম করার অ্যাপ্লিকেশনগুলিতে ব্যাপকভাবে ব্যবহৃত হয়।</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>অতিরিক্ত তথ্য</u></span></strong></span></p>\n<ul>\n<li><strong>নাইক্রোমের গঠন:</strong> নাইক্রোম একটি সংকর ধাতু যা প্রধানত <strong>নিকেল</strong> (প্রায় 80%) এবং <strong>ক্রোমিয়াম</strong> (প্রায় 20%) দ্বারা গঠিত, যার মধ্যে লোহা বা অন্যান্য উপাদানের সম্ভাব্য ছোট সংযোজন রয়েছে।</li>\n<li><strong>ব্যবহার:</strong> বৈদ্যুতিক হিটার ছাড়াও, নাইক্রোম <strong>কিলন, পরীক্ষাগার সরঞ্জাম, হট-ওয়্যার কাটার এবং রেজিস্ট্যান্স তারের</strong> মতো অ্যাপ্লিকেশনগুলিতে ব্যবহৃত হয় কারণ এটি দক্ষতার সাথে তাপ উৎপন্ন করতে পারে।</li>\n<li><strong>তাপীয় স্থায়িত্ব:</strong> নাইক্রোম বারবার গরম করার চক্রের পরেও তার বৈশিষ্ট্যগুলি বজায় রাখতে পারে, যা এটিকে সামঞ্জস্যপূর্ণ কার্যকারিতা প্রয়োজন এমন ডিভাইসগুলিতে দীর্ঘমেয়াদী ব্যবহারের জন্য উপযুক্ত করে তোলে।</li>\n<li><strong>অন্যান্য উপকরণের সাথে তুলনা:</strong> তামা বা অ্যালুমিনিয়ামের মতো উপকরণগুলির থেকে ভিন্ন, নাইক্রোম উচ্চ তাপমাত্রায় দ্রুত জারিত হয় না এবং এর প্রতিরোধক বৈশিষ্ট্য বজায় রাখে, যা দীর্ঘ জীবনকাল প্রদান করে।</li>\n<li><strong>নিরাপত্তা বৈশিষ্ট্য:</strong> নাইক্রোমের জারণ-প্রতিরোধী বৈশিষ্ট্যগুলি অতিরিক্ত গরম এবং উপাদানের অবনতির ঝুঁকি হ্রাস করে, গরম করার ডিভাইসগুলিতে নিরাপদ অপারেশন নিশ্চিত করে।</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>গুরুত্বপূর্ণ বিষয়</u></span></strong></span></p>\n<ul>\n<li><strong>বিকল্প 1:</strong> কম রোধ ক্ষমতা এবং উচ্চ গলনাঙ্ক নাইক্রোমের বৈশিষ্ট্য নয়। নাইক্রোমের <strong>উচ্চ রোধ ক্ষমতা</strong> রয়েছে, কম নয়। এই বিকল্পটি ভুল।</li>\n<li><strong>বিকল্প 2:</strong> উচ্চ রোধ ক্ষমতা এবং কম গলনাঙ্ক ভুল কারণ নাইক্রোমের <strong>উচ্চ গলনাঙ্ক</strong> (প্রায় 1400°C) রয়েছে। এই বিকল্পটি ভুল।</li>\n<li><strong>বিকল্প 4:</strong> কম রোধ ক্ষমতা এবং কম গলনাঙ্ক ভুল কারণ নাইক্রোম তার <strong>উচ্চ রোধ ক্ষমতা</strong> এবং <strong>উচ্চ গলনাঙ্কের</strong> জন্য পরিচিত। এই বিকল্পটি ভুল।</li>\n<li><strong>সঠিক বিকল্প:</strong> সঠিক উত্তর হল যে নাইক্রোম <strong>উচ্চ রোধ ক্ষমতা</strong> এবং <strong>উচ্চ গলনাঙ্ক</strong> সরবরাহ করে, যা এটিকে গরম করার উপাদানগুলির জন্য আদর্শ করে তোলে।</li>\n</ul>95:T2564,<p>சரியான பதில் <u><strong>இது அதிக மின்தடைத்தன்மை மற்றும் அதிக உருகுநிலையை வழங்குகிறது</strong></u>.</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p>\n<ul>\n<li><strong>அதிக மின்தடைத்தன்மை:</strong> நிக்ரோம் அதிக மின்தடைத்தன்மையைக் கொண்டுள்ளது, இது வெப்பமூட்டும் உறுப்பாகப் பயன்படுத்த ஏற்றது. அதிக மின்தடைத்தன்மை ஒரு குறிப்பிட்ட மின்னோட்டத்திற்கு அதிக வெப்ப உற்பத்தியை உறுதி செய்கிறது, இது வெப்பமூட்டும் பயன்பாடுகளுக்கு திறமையானதாக அமைகிறது.</li>\n<li><strong>அதிக உருகுநிலை:</strong> நிக்ரோம் அதிக உருகுநிலையை (சுமார் <strong>1400°C</strong>) வழங்குகிறது, இது உருகுவதையோ அல்லது சிதைவதையோ செய்யாமல் அதிக வெப்பநிலையைத் தாங்கும் என்பதை உறுதி செய்கிறது. அதிக வெப்பநிலையில் செயல்படும் மின்சார ஹீட்டர்களுக்கு இந்த பண்பு முக்கியமானது.</li>\n<li><strong>ஆக்சிஜனேற்ற எதிர்ப்பு:</strong> சூடுபடுத்தப்படும்போது நிக்ரோம் அதன் மேற்பரப்பில் குரோமியம் ஆக்சைட்டின் பாதுகாப்பான அடுக்கை உருவாக்குகிறது. இந்த அடுக்கு மேலும் ஆக்சிஜனேற்றத்தைத் தடுக்கிறது, அதன் ஆயுளை அதிகரிக்கிறது மற்றும் வெப்பமூட்டும் உறுப்பாக நீண்டகால பயன்பாட்டிற்கு ஏற்றதாக அமைகிறது.</li>\n<li><strong>இயந்திர வலிமை:</strong> நிக்ரோம் அதிக வெப்பநிலையிலும் சிறந்த இயந்திர வலிமையைக் காட்டுகிறது, வெப்பமூட்டும் உறுப்பு அதன் கட்டமைப்பு மற்றும் செயல்பாட்டை செயல்பாட்டின் போது பராமரிப்பதை உறுதி செய்கிறது.</li>\n<li><strong>பயன்பாடுகள்:</strong> அதன் பண்புகள் காரணமாக, நிக்ரோம் மின்சார ஹீட்டர்கள், டோஸ்டர்கள் மற்றும் ஹேர் ட்ரையர்கள் போன்ற உபகரணங்களிலும், தொழில்துறை வெப்பமூட்டும் பயன்பாடுகளிலும் பரவலாகப் பயன்படுத்தப்படுகிறது.</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n<ul>\n<li><strong>நிக்ரோமின் கலவை:</strong> நிக்ரோம் என்பது முதன்மையாக <strong>நிக்கல்</strong> (சுமார் 80%) மற்றும் <strong>குரோமியம்</strong> (சுமார் 20%) ஆகியவற்றால் ஆன ஒரு கலவை ஆகும், இரும்பு அல்லது பிற தனிமங்களின் சிறிய சேர்த்தல்கள் இருக்கலாம்.</li>\n<li><strong>பயன்கள்:</strong> மின்சார ஹீட்டர்களைத் தவிர, நிக்ரோம் அதன் திறமையான வெப்ப உற்பத்தி திறன்கள் காரணமாக <strong>உலைகள், ஆய்வக உபகரணங்கள், சூடான-கம்பி வெட்டிகள் மற்றும் மின்தடை கம்பிகள்</strong> போன்ற பயன்பாடுகளிலும் பயன்படுத்தப்படுகிறது.</li>\n<li><strong>வெப்ப நிலைப்புத்தன்மை:</strong> நிக்ரோம் மீண்டும் மீண்டும் சூடுபடுத்தப்பட்ட பிறகும் அதன் பண்புகளைத் தக்க வைத்துக் கொள்ள முடியும், இது நிலையான செயல்திறன் தேவைப்படும் சாதனங்களில் நீண்டகால பயன்பாட்டிற்கு ஏற்றதாக அமைகிறது.</li>\n<li><strong>பிற பொருட்களுடன் ஒப்பிடுதல்:</strong> தாமிரம் அல்லது அலுமினியம் போன்ற பொருட்களைப் போலல்லாமல், நிக்ரோம் அதிக வெப்பநிலையில் விரைவாக ஆக்சிஜனேற்றம் அடையாது மற்றும் அதன் மின்தடைப் பண்புகளைப் பராமரிக்கிறது, நீண்ட ஆயுளை வழங்குகிறது.</li>\n<li><strong>பாதுகாப்பு அம்சங்கள்:</strong> நிக்ரோமின் ஆக்சிஜனேற்ற-எதிர்ப்பு பண்புகள் அதிக வெப்பம் மற்றும் பொருள் சிதைவு அபாயத்தைக் குறைக்கின்றன, வெப்பமூட்டும் சாதனங்களில் பாதுகாப்பான செயல்பாட்டை உறுதி செய்கின்றன.</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Important Points</u></span></strong></span></p>\n<ul>\n<li><strong>விருப்பம் 1:</strong> குறைந்த மின்தடைத்தன்மை மற்றும் அதிக உருகுநிலை ஆகியவை நிக்ரோமின் பண்புகள் அல்ல. நிக்ரோம் <strong>அதிக மின்தடைத்தன்மையைக்</strong> கொண்டுள்ளது, குறைந்ததல்ல. இந்த விருப்பம் தவறானது.</li>\n<li><strong>விருப்பம் 2:</strong> அதிக மின்தடைத்தன்மை மற்றும் குறைந்த உருகுநிலை ஆகியவை தவறானவை, ஏனெனில் நிக்ரோம் <strong>அதிக உருகுநிலையைக்</strong> (சுமார் 1400°C) கொண்டுள்ளது. இந்த விருப்பம் தவறானது.</li>\n<li><strong>விருப்பம் 4:</strong> குறைந்த மின்தடைத்தன்மை மற்றும் குறைந்த உருகுநிலை ஆகியவை தவறானவை, ஏனெனில் நிக்ரோம் அதன் <strong>அதிக மின்தடைத்தன்மை</strong> மற்றும் <strong>அதிக உருகுநிலைக்குப்</strong> பெயர் பெற்றது. இந்த விருப்பம் தவறானது.</li>\n<li><strong>சரியான விருப்பம்:</strong> நிக்ரோம் <strong>அதிக மின்தடைத்தன்மை</strong> மற்றும் <strong>அதிக உருகுநிலையை</strong> வழங்குகிறது என்பதே சரியான பதில், இது வெப்பமூட்டும் உறுப்புகளுக்கு ஏற்றதாக அமைகிறது.</li>\n</ul>96:T21bb,<p>ସଠିକ୍ ଉତ୍ତର ହେଉଛି <u><strong>ଏହା ଉଚ୍ଚ ପ୍ରତିରୋଧକତା ଏବଂ ଉଚ୍ଚ ଗଳନାଙ୍କ ପ୍ରଦାନ କରିଥାଏ।</strong></u></p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>ମୁଖ୍ୟ ବିନ୍ଦୁଗୁଡ଼ିକ</u></span></strong></span></p>\n<ul>\n<li><strong>ଉଚ୍ଚ ପ୍ରତିରୋଧକତା:</strong> ନିଖ୍ରୋମ୍ର ଉଚ୍ଚ ପ୍ରତିରୋଧକତା ରହିଛି, ଯାହା ଏହାକୁ ହିଟିଙ୍ଗ୍ ଉପାଦାନ ଭାବରେ ବ୍ୟବହାର କରିବା ପାଇଁ ଉପଯୁକ୍ତ କରିଥାଏ। ଉଚ୍ଚ ପ୍ରତିରୋଧକତା ଏକ ନିର୍ଦ୍ଦିଷ୍ଟ ବିଦ୍ୟୁତ୍ ସ୍ରୋତ ପାଇଁ ଅଧିକ ଉତ୍ତାପ ସୃଷ୍ଟି କରିବା ନିଶ୍ଚିତ କରିଥାଏ, ଯାହା ଏହାକୁ ହିଟିଙ୍ଗ୍ ପ୍ରୟୋଗ ପାଇଁ ଦକ୍ଷ କରିଥାଏ।</li>\n<li><strong>ଉଚ୍ଚ ଗଳନାଙ୍କ:</strong> ନିଖ୍ରୋମ୍ ଏକ ଉଚ୍ଚ ଗଳନାଙ୍କ (ପ୍ରାୟ <strong>1400°C</strong>) ପ୍ରଦାନ କରିଥାଏ, ଯାହା ନିଶ୍ଚିତ କରେ ଯେ ଏହା ନ ଗଳି କିମ୍ବା ବିକୃତ ନ ହୋଇ ଉଚ୍ଚ ତାପମାତ୍ରାକୁ ସହ୍ୟ କରିପାରିବ। ଏହି ଗୁଣଟି ବିଦ୍ୟୁତ୍ ହିଟର ପାଇଁ ଅତ୍ୟନ୍ତ ଗୁରୁତ୍ୱପୂର୍ଣ୍ଣ ଯାହା ଉଚ୍ଚ ତାପମାତ୍ରାରେ କାର୍ଯ୍ୟ କରିଥାଏ।</li>\n<li><strong>ଅକ୍ସିଡେସନ୍ ପ୍ରତିରୋଧକତା:</strong> ଗରମ ହେଲେ ନିଖ୍ରୋମ୍ ଏହାର ପୃଷ୍ଠରେ କ୍ରୋମିୟମ୍ ଅକ୍ସାଇଡ୍ର ଏକ ସୁରକ୍ଷା ସ୍ତର ସୃଷ୍ଟି କରିଥାଏ। ଏହି ସ୍ତର ଅଧିକ ଅକ୍ସିଡେସନ୍କୁ ରୋକିଥାଏ, ଏହାର ସ୍ଥାୟିତ୍ୱ ବଢ଼ାଇଥାଏ ଏବଂ ଏହାକୁ ହିଟିଙ୍ଗ୍ ଉପାଦାନ ଭାବରେ ଦୀର୍ଘ ସମୟ ପର୍ଯ୍ୟନ୍ତ ବ୍ୟବହାର କରିବା ପାଇଁ ଉପଯୁକ୍ତ କରିଥାଏ।</li>\n<li><strong>ଯାନ୍ତ୍ରିକ ଶକ୍ତି:</strong> ନିଖ୍ରୋମ୍ ଉଚ୍ଚ ତାପମାତ୍ରାରେ ମଧ୍ୟ ଉତ୍କୃଷ୍ଟ ଯାନ୍ତ୍ରିକ ଶକ୍ତି ପ୍ରଦର୍ଶନ କରିଥାଏ, ଯାହା ନିଶ୍ଚିତ କରେ ଯେ ହିଟିଙ୍ଗ୍ ଉପାଦାନ କାର୍ଯ୍ୟ ସମୟରେ ଏହାର ଗଠନ ଏବଂ କାର୍ଯ୍ୟକାରିତା ବଜାୟ ରଖିଥାଏ।</li>\n<li><strong>ପ୍ରୟୋଗ:</strong> ଏହାର ଗୁଣଗୁଡ଼ିକ ହେତୁ, ନିଖ୍ରୋମ୍ ବିଦ୍ୟୁତ୍ ହିଟର, ଟୋଷ୍ଟର୍ ଏବଂ କେଶ ଶୁଖାଇବା ପରି ଉପକରଣରେ ବହୁଳ ଭାବରେ ବ୍ୟବହୃତ ହୁଏ, ଏବଂ ଶିଳ୍ପ ହିଟିଙ୍ଗ୍ ପ୍ରୟୋଗରେ ମଧ୍ୟ ବ୍ୟବହୃତ ହୁଏ।</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>ଅତିରିକ୍ତ ସୂଚନା</u></span></strong></span></p>\n<ul>\n<li><strong>ନିଖ୍ରୋମ୍ର ସଂରଚନା:</strong> ନିଖ୍ରୋମ୍ ହେଉଛି ଏକ ମିଶ୍ର ଧାତୁ ଯାହା ମୁଖ୍ୟତଃ <strong>ନିକେଲ୍</strong> (ପ୍ରାୟ 80%) ଏବଂ <strong>କ୍ରୋମିୟମ୍</strong> (ପ୍ରାୟ 20%) ଦ୍ୱାରା ଗଠିତ, ଏଥିରେ ଲୁହା କିମ୍ବା ଅନ୍ୟ ଉପାଦାନର ସାମାନ୍ୟ ମିଶ୍ରଣ ଥାଇପାରେ।</li>\n<li><strong>ବ୍ୟବହାର:</strong> ବିଦ୍ୟୁତ୍ ହିଟର୍ ବ୍ୟତୀତ, ନିଖ୍ରୋମ୍ <strong>ଭାଟି, ଲାବୋରେଟୋରୀ ଉପକରଣ, ହଟ୍-ୱାୟାର୍ କଟର୍ ଏବଂ ପ୍ରତିରୋଧକ ତାର</strong> ପରି ପ୍ରୟୋଗରେ ବ୍ୟବହୃତ ହୁଏ କାରଣ ଏହାର ଦକ୍ଷତାର ସହିତ ଉତ୍ତାପ ସୃଷ୍ଟି କରିବାର କ୍ଷମତା ରହିଛି।</li>\n<li><strong>ତାପୀୟ ସ୍ଥିରତା:</strong> ନିଖ୍ରୋମ୍ ବାରମ୍ବାର ହିଟିଙ୍ଗ୍ ଚକ୍ର ପରେ ମଧ୍ୟ ଏହାର ଗୁଣଗୁଡ଼ିକୁ ବଜାୟ ରଖିପାରେ, ଯାହା ଏହାକୁ ସ୍ଥିର କାର୍ଯ୍ୟଦକ୍ଷତା ଆବଶ୍ୟକ କରୁଥିବା ଉପକରଣରେ ଦୀର୍ଘକାଳୀନ ବ୍ୟବହାର ପାଇଁ ଉପଯୁକ୍ତ କରିଥାଏ।</li>\n<li><strong>ଅନ୍ୟ ସାମଗ୍ରୀ ସହିତ ତୁଳନା:</strong> ତମ୍ବା କିମ୍ବା ଆଲୁମିନିୟମ୍ ପରି ସାମଗ୍ରୀ ତୁଳନାରେ, ନିଖ୍ରୋମ୍ ଉଚ୍ଚ ତାପମାତ୍ରାରେ ଶୀଘ୍ର ଅକ୍ସିଡାଇଜ୍ ହୁଏ ନାହିଁ ଏବଂ ଏହାର ପ୍ରତିରୋଧକ ଗୁଣଗୁଡ଼ିକୁ ବଜାୟ ରଖିଥାଏ, ଯାହା ଦୀର୍ଘ ଜୀବନକାଳ ପ୍ରଦାନ କରିଥାଏ।</li>\n<li><strong>ସୁରକ୍ଷା ବୈଶିଷ୍ଟ୍ୟ:</strong> ନିଖ୍ରୋମ୍ର ଅକ୍ସିଡେସନ୍-ପ୍ରତିରୋଧକ ଗୁଣ ଅତ୍ୟଧିକ ଗରମ ଏବଂ ସାମଗ୍ରୀର ଅବନତିର ଆଶଙ୍କାକୁ ହ୍ରାସ କରିଥାଏ, ଯାହା ହିଟିଙ୍ଗ୍ ଉପକରଣରେ ସୁରକ୍ଷିତ କାର୍ଯ୍ୟକୁ ନିଶ୍ଚିତ କରିଥାଏ।</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>ଗୁରୁତ୍ୱପୂର୍ଣ୍ଣ ବିନ୍ଦୁଗୁଡ଼ିକ</u></span></strong></span></p>\n<ul>\n<li><strong>ବିକଳ୍ପ 1:</strong> ନିମ୍ନ ପ୍ରତିରୋଧକତା ଏବଂ ଉଚ୍ଚ ଗଳନାଙ୍କ ନିଖ୍ରୋମ୍ର ବୈଶିଷ୍ଟ୍ୟ ନୁହେଁ। ନିଖ୍ରୋମ୍ର <strong>ଉଚ୍ଚ ପ୍ରତିରୋଧକତା</strong> ଅଛି, ନିମ୍ନ ନୁହେଁ। ଏହି ବିକଳ୍ପଟି ଭୁଲ୍ ଅଟେ।</li>\n<li><strong>ବିକଳ୍ପ 2:</strong> ଉଚ୍ଚ ପ୍ରତିରୋଧକତା ଏବଂ ନିମ୍ନ ଗଳନାଙ୍କ ଭୁଲ୍ ଅଟେ କାରଣ ନିଖ୍ରୋମ୍ର ଏକ <strong>ଉଚ୍ଚ ଗଳନାଙ୍କ</strong> (ପ୍ରାୟ 1400°C) ଅଛି। ଏହି ବିକଳ୍ପଟି ଭୁଲ୍ ଅଟେ।</li>\n<li><strong>ବିକଳ୍ପ 4:</strong> ନିମ୍ନ ପ୍ରତିରୋଧକତା ଏବଂ ନିମ୍ନ ଗଳନାଙ୍କ ଭୁଲ୍ ଅଟେ କାରଣ ନିଖ୍ରୋମ୍ ଏହାର <strong>ଉଚ୍ଚ ପ୍ରତିରୋଧକତା</strong> ଏବଂ <strong>ଉଚ୍ଚ ଗଳନାଙ୍କ</strong> ପାଇଁ ଜଣାଶୁଣା। ଏହି ବିକଳ୍ପଟି ଭୁଲ୍ ଅଟେ।</li>\n<li><strong>ସଠିକ୍ ବିକଳ୍ପ:</strong> ସଠିକ୍ ଉତ୍ତର ହେଉଛି ନିଖ୍ରୋମ୍ <strong>ଉଚ୍ଚ ପ୍ରତିରୋଧକତା</strong> ଏବଂ ଏକ <strong>ଉଚ୍ଚ ଗଳନାଙ୍କ</strong> ପ୍ରଦାନ କରିଥାଏ, ଯାହା ଏହାକୁ ହିଟିଙ୍ଗ୍ ଉପାଦାନ ପାଇଁ ଉପଯୁକ୍ତ କରିଥାଏ।</li>\n</ul>97:T21cd,<p>ਸਹੀ ਜਵਾਬ ਹੈ <u><strong>ਇਹ ਉੱਚ ਰੋਧਕਤਾ ਅਤੇ ਉੱਚ ਪਿਘਲਣ ਦਾ ਬਿੰਦੂ ਪੇਸ਼ ਕਰਦਾ ਹੈ।</strong></u></p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>ਮੁੱਖ ਨੁਕਤੇ</u></span></strong></span></p>\n<ul>\n<li><strong>ਉੱਚ ਰੋਧਕਤਾ (High Resistivity):</strong> ਨਾਈਕ੍ਰੋਮ ਦੀ ਰੋਧਕਤਾ ਉੱਚੀ ਹੁੰਦੀ ਹੈ, ਜੋ ਇਸਨੂੰ ਹੀਟਿੰਗ ਐਲੀਮੈਂਟ ਵਜੋਂ ਵਰਤਣ ਲਈ ਆਦਰਸ਼ ਬਣਾਉਂਦਾ ਹੈ। ਉੱਚ ਰੋਧਕਤਾ ਇੱਕ ਦਿੱਤੇ ਗਏ ਕਰੰਟ ਲਈ ਵਧੇਰੇ ਗਰਮੀ ਪੈਦਾ ਕਰਨਾ ਯਕੀਨੀ ਬਣਾਉਂਦੀ ਹੈ, ਜਿਸ ਨਾਲ ਇਹ ਹੀਟਿੰਗ ਐਪਲੀਕੇਸ਼ਨਾਂ ਲਈ ਕੁਸ਼ਲ ਬਣ ਜਾਂਦਾ ਹੈ।</li>\n<li><strong>ਉੱਚ ਪਿਘਲਣ ਦਾ ਬਿੰਦੂ (High Melting Point):</strong> ਨਾਈਕ੍ਰੋਮ ਇੱਕ ਉੱਚ ਪਿਘਲਣ ਦਾ ਬਿੰਦੂ (ਲਗਭਗ <strong>1400°C</strong>) ਪੇਸ਼ ਕਰਦਾ ਹੈ, ਇਹ ਸੁਨਿਸ਼ਚਿਤ ਕਰਦਾ ਹੈ ਕਿ ਇਹ ਪਿਘਲਣ ਜਾਂ ਵਿਗੜੇ ਬਿਨਾਂ ਉੱਚ ਤਾਪਮਾਨਾਂ ਦਾ ਸਾਹਮਣਾ ਕਰ ਸਕਦਾ ਹੈ। ਇਹ ਸੰਪਤੀ ਇਲੈਕਟ੍ਰਿਕ ਹੀਟਰਾਂ ਲਈ ਬਹੁਤ ਜ਼ਰੂਰੀ ਹੈ ਜੋ ਉੱਚ ਤਾਪਮਾਨ 'ਤੇ ਕੰਮ ਕਰਦੇ ਹਨ।</li>\n<li><strong>ਆਕਸੀਕਰਨ ਪ੍ਰਤੀਰੋਧ (Oxidation Resistance):</strong> ਨਾਈਕ੍ਰੋਮ ਗਰਮ ਹੋਣ 'ਤੇ ਆਪਣੀ ਸਤ੍ਹਾ 'ਤੇ ਕ੍ਰੋਮੀਅਮ ਆਕਸਾਈਡ ਦੀ ਇੱਕ ਸੁਰੱਖਿਆ ਪਰਤ ਬਣਾਉਂਦਾ ਹੈ। ਇਹ ਪਰਤ ਹੋਰ ਆਕਸੀਕਰਨ ਨੂੰ ਰੋਕਦੀ ਹੈ, ਇਸਦੇ ਟਿਕਾਊਪਨ ਨੂੰ ਵਧਾਉਂਦੀ ਹੈ ਅਤੇ ਇਸਨੂੰ ਹੀਟਿੰਗ ਐਲੀਮੈਂਟ ਵਜੋਂ ਲੰਬੇ ਸਮੇਂ ਤੱਕ ਵਰਤੋਂ ਲਈ ਢੁਕਵਾਂ ਬਣਾਉਂਦੀ ਹੈ।</li>\n<li><strong>ਮਕੈਨੀਕਲ ਤਾਕਤ (Mechanical Strength):</strong> ਨਾਈਕ੍ਰੋਮ ਉੱਚ ਤਾਪਮਾਨਾਂ 'ਤੇ ਵੀ ਸ਼ਾਨਦਾਰ ਮਕੈਨੀਕਲ ਤਾਕਤ ਪ੍ਰਦਰਸ਼ਿਤ ਕਰਦਾ ਹੈ, ਇਹ ਯਕੀਨੀ ਬਣਾਉਂਦਾ ਹੈ ਕਿ ਹੀਟਿੰਗ ਐਲੀਮੈਂਟ ਕਾਰਵਾਈ ਦੌਰਾਨ ਆਪਣੀ ਬਣਤਰ ਅਤੇ ਕਾਰਜਕੁਸ਼ਲਤਾ ਨੂੰ ਬਣਾਈ ਰੱਖਦਾ ਹੈ।</li>\n<li><strong>ਐਪਲੀਕੇਸ਼ਨਾਂ (Applications):</strong> ਇਸਦੀਆਂ ਵਿਸ਼ੇਸ਼ਤਾਵਾਂ ਦੇ ਕਾਰਨ, ਨਾਈਕ੍ਰੋਮ ਦੀ ਵਰਤੋਂ ਇਲੈਕਟ੍ਰਿਕ ਹੀਟਰਾਂ, ਟੋਸਟਰਾਂ, ਅਤੇ ਹੇਅਰ ਡਰਾਇਰਾਂ ਵਰਗੇ ਉਪਕਰਣਾਂ ਵਿੱਚ, ਅਤੇ ਨਾਲ ਹੀ ਉਦਯੋਗਿਕ ਹੀਟਿੰਗ ਐਪਲੀਕੇਸ਼ਨਾਂ ਵਿੱਚ ਵਿਆਪਕ ਤੌਰ 'ਤੇ ਕੀਤੀ ਜਾਂਦੀ ਹੈ।</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>ਅਤਿਰਿਕਤ ਜਾਣਕਾਰੀ</u></span></strong></span></p>\n<ul>\n<li><strong>ਨਾਈਕ੍ਰੋਮ ਦੀ ਬਣਤਰ (Composition of Nichrome):</strong> ਨਾਈਕ੍ਰੋਮ ਇੱਕ ਮਿਸ਼ਰਤ ਧਾਤ ਹੈ ਜੋ ਮੁੱਖ ਤੌਰ 'ਤੇ <strong>ਨਿਕਲ</strong> (ਲਗਭਗ 80%) ਅਤੇ <strong>ਕ੍ਰੋਮੀਅਮ</strong> (ਲਗਭਗ 20%) ਤੋਂ ਬਣੀ ਹੈ, ਜਿਸ ਵਿੱਚ ਲੋਹੇ ਜਾਂ ਹੋਰ ਤੱਤਾਂ ਦੀ ਥੋੜ੍ਹੀ ਮਾਤਰਾ ਸ਼ਾਮਲ ਹੋ ਸਕਦੀ ਹੈ।</li>\n<li><strong>ਵਰਤੋਂ (Uses):</strong> ਇਲੈਕਟ੍ਰਿਕ ਹੀਟਰਾਂ ਤੋਂ ਇਲਾਵਾ, ਨਾਈਕ੍ਰੋਮ ਦੀ ਵਰਤੋਂ <strong>ਕਿਲਨਾਂ, ਪ੍ਰਯੋਗਸ਼ਾਲਾ ਦੇ ਉਪਕਰਨਾਂ, ਹੌਟ-ਵਾਇਰ ਕਟਰਾਂ, ਅਤੇ ਪ੍ਰਤੀਰੋਧ ਤਾਰਾਂ</strong> ਵਰਗੀਆਂ ਐਪਲੀਕੇਸ਼ਨਾਂ ਵਿੱਚ ਕੀਤੀ ਜਾਂਦੀ ਹੈ ਕਿਉਂਕਿ ਇਸ ਵਿੱਚ ਕੁਸ਼ਲਤਾ ਨਾਲ ਗਰਮੀ ਪੈਦਾ ਕਰਨ ਦੀ ਸਮਰੱਥਾ ਹੁੰਦੀ ਹੈ।</li>\n<li><strong>ਥਰਮਲ ਸਥਿਰਤਾ (Thermal Stability):</strong> ਨਾਈਕ੍ਰੋਮ ਵਾਰ-ਵਾਰ ਹੀਟਿੰਗ ਚੱਕਰਾਂ ਤੋਂ ਬਾਅਦ ਵੀ ਆਪਣੀਆਂ ਵਿਸ਼ੇਸ਼ਤਾਵਾਂ ਨੂੰ ਬਣਾਈ ਰੱਖ ਸਕਦਾ ਹੈ, ਜਿਸ ਨਾਲ ਇਹ ਇਕਸਾਰ ਕਾਰਗੁਜ਼ਾਰੀ ਦੀ ਲੋੜ ਵਾਲੇ ਯੰਤਰਾਂ ਵਿੱਚ ਲੰਬੇ ਸਮੇਂ ਦੀ ਵਰਤੋਂ ਲਈ ਢੁਕਵਾਂ ਬਣ ਜਾਂਦਾ ਹੈ।</li>\n<li><strong>ਹੋਰ ਸਮੱਗਰੀਆਂ ਨਾਲ ਤੁਲਨਾ (Comparison with Other Materials):</strong> ਤਾਂਬੇ ਜਾਂ ਅਲਮੀਨੀਅਮ ਵਰਗੀਆਂ ਸਮੱਗਰੀਆਂ ਦੇ ਉਲਟ, ਨਾਈਕ੍ਰੋਮ ਉੱਚ ਤਾਪਮਾਨਾਂ 'ਤੇ ਤੇਜ਼ੀ ਨਾਲ ਆਕਸੀਕਰਨ ਨਹੀਂ ਕਰਦਾ ਅਤੇ ਆਪਣੀਆਂ ਰੋਧਕ ਵਿਸ਼ੇਸ਼ਤਾਵਾਂ ਨੂੰ ਬਣਾਈ ਰੱਖਦਾ ਹੈ, ਜਿਸ ਨਾਲ ਲੰਬੀ ਉਮਰ ਮਿਲਦੀ ਹੈ।</li>\n<li><strong>ਸੁਰੱਖਿਆ ਵਿਸ਼ੇਸ਼ਤਾਵਾਂ (Safety Features):</strong> ਨਾਈਕ੍ਰੋਮ ਦੀਆਂ ਆਕਸੀਕਰਨ-ਰੋਧਕ ਵਿਸ਼ੇਸ਼ਤਾਵਾਂ ਬਹੁਤ ਜ਼ਿਆਦਾ ਗਰਮੀ ਅਤੇ ਸਮੱਗਰੀ ਦੇ ਵਿਗਾੜ ਦੇ ਜੋਖਮ ਨੂੰ ਘਟਾਉਂਦੀਆਂ ਹਨ, ਜਿਸ ਨਾਲ ਹੀਟਿੰਗ ਯੰਤਰਾਂ ਵਿੱਚ ਸੁਰੱਖਿਅਤ ਸੰਚਾਲਨ ਯਕੀਨੀ ਹੁੰਦਾ ਹੈ।</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>ਮਹੱਤਵਪੂਰਨ ਨੁਕਤੇ</u></span></strong></span></p>\n<ul>\n<li><strong>ਵਿਕਲਪ 1:</strong> ਘੱਟ ਰੋਧਕਤਾ ਅਤੇ ਉੱਚ ਪਿਘਲਣ ਦਾ ਬਿੰਦੂ ਨਾਈਕ੍ਰੋਮ ਦੀਆਂ ਵਿਸ਼ੇਸ਼ਤਾਵਾਂ ਨਹੀਂ ਹਨ। ਨਾਈਕ੍ਰੋਮ ਦੀ <strong>ਰੋਧਕਤਾ ਉੱਚੀ</strong> ਹੁੰਦੀ ਹੈ, ਘੱਟ ਨਹੀਂ। ਇਹ ਵਿਕਲਪ ਗਲਤ ਹੈ।</li>\n<li><strong>ਵਿਕਲਪ 2:</strong> ਉੱਚ ਰੋਧਕਤਾ ਅਤੇ ਘੱਟ ਪਿਘਲਣ ਦਾ ਬਿੰਦੂ ਗਲਤ ਹਨ ਕਿਉਂਕਿ ਨਾਈਕ੍ਰੋਮ ਦਾ <strong>ਪਿਘਲਣ ਦਾ ਬਿੰਦੂ ਉੱਚਾ</strong> ਹੁੰਦਾ ਹੈ (ਲਗਭਗ 1400°C)। ਇਹ ਵਿਕਲਪ ਗਲਤ ਹੈ।</li>\n<li><strong>ਵਿਕਲਪ 4:</strong> ਘੱਟ ਰੋਧਕਤਾ ਅਤੇ ਘੱਟ ਪਿਘਲਣ ਦਾ ਬਿੰਦੂ ਗਲਤ ਹਨ ਕਿਉਂਕਿ ਨਾਈਕ੍ਰੋਮ ਆਪਣੀ <strong>ਉੱਚ ਰੋਧਕਤਾ</strong> ਅਤੇ <strong>ਉੱਚ ਪਿਘਲਣ ਦੇ ਬਿੰਦੂ</strong> ਲਈ ਜਾਣਿਆ ਜਾਂਦਾ ਹੈ। ਇਹ ਵਿਕਲਪ ਗਲਤ ਹੈ।</li>\n<li><strong>ਸਹੀ ਵਿਕਲਪ:</strong> ਸਹੀ ਜਵਾਬ ਇਹ ਹੈ ਕਿ ਨਾਈਕ੍ਰੋਮ <strong>ਉੱਚ ਰੋਧਕਤਾ</strong> ਅਤੇ ਇੱਕ <strong>ਉੱਚ ਪਿਘਲਣ ਦਾ ਬਿੰਦੂ</strong> ਪੇਸ਼ ਕਰਦਾ ਹੈ, ਜੋ ਇਸਨੂੰ ਹੀਟਿੰਗ ਐਲੀਮੈਂਟਾਂ ਲਈ ਆਦਰਸ਼ ਬਣਾਉਂਦਾ ਹੈ।</li>\n</ul>98:T101e,<p>The correct answer is <u><strong>3) Statement 1 and 2 are Correct</strong></u>.</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p>\n<ul>\n<li><strong>Statement 1:</strong> A State requires the Centre's consent for internal borrowing if it owes any debt to the Centre.<br>\n- This is correct as per <strong>Article 293(3)</strong> of the <strong>Constitution of India</strong>. A State that owes loans to the Centre must seek prior approval before borrowing further.</li>\n<li><strong>Statement 2:</strong> No State can raise loans from foreign sources without prior approval of the Union Government.<br>\n- This is correct as the borrowing of funds from foreign sources by States is regulated by the <strong>Union Government</strong> to ensure compliance with international agreements and the country’s financial stability.</li>\n<li>The borrowing powers of States are governed by <strong>Article 293</strong> of the Constitution, which imposes restrictions to prevent financial instability or unsanctioned debts.</li>\n<li>The Union Government oversees borrowing activities of States to maintain fiscal discipline and ensure coordination between States and the Centre.</li>\n<li>Thus, both statements are correct, and the correct answer is <u><strong>3) Statement 1 and 2 are Correct</strong></u>.</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n<ul>\n<li><strong>Article 293 of the Constitution:</strong> <ul>\n<li><strong>Clause (1):</strong> A State can borrow within the territory of India upon the security of its Consolidated Fund.</li>\n<li><strong>Clause (3):</strong> If a State owes any loans to the Union Government, it must seek prior approval for further borrowing.</li>\n<li><strong>Clause (4):</strong> The Union Government can impose conditions on borrowing to ensure compliance with financial stability norms.</li>\n</ul>\n</li>\n<li><strong>Foreign Borrowing:</strong> <ul>\n<li>States cannot independently negotiate loans with foreign entities without Union Government approval.</li>\n<li>This ensures that external borrowings align with national interests and international agreements.</li>\n</ul>\n</li>\n<li><strong>Fiscal Federalism in India:</strong> <ul>\n<li>The financial relationship between the Centre and States is governed by Constitutional provisions to maintain fiscal discipline.</li>\n<li>The <strong>Finance Commission</strong> periodically reviews the allocation of resources and borrowing limits.</li>\n</ul>\n</li>\n<li><strong>Borrowing Limits:</strong> <ul>\n<li>The Union Government sets borrowing limits for States based on economic conditions and fiscal parameters.</li>\n<li>This is done to prevent excessive debt accumulation and ensure financial sustainability.</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Important Points</u></span></strong></span></p>\n<ul>\n<li><strong>Union Control Over Borrowing:</strong> The Union Government ensures that borrowing by States does not conflict with national financial policies and international obligations.</li>\n<li><strong>Finance Commission:</strong> The Finance Commission recommends measures to manage State borrowing and allocates funds to ensure equitable distribution.</li>\n<li><strong>Fiscal Responsibility and Budget Management (FRBM) Act:</strong> This Act promotes financial discipline by prescribing fiscal targets for both the Centre and States.</li>\n</ul>99:T1e11,<p>सही उत्तर है <u><strong>3) कथन 1 और 2 सही हैं</strong></u>।</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>मुख्य बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>कथन 1:</strong> यदि किसी राज्य पर केंद्र का कोई ऋण बकाया है, तो उसे आंतरिक ऋण लेने के लिए केंद्र की सहमति की आवश्यकता होती है।<br>\n- यह <strong>भारत के संविधान के अनुच्छेद 293(3)</strong> के अनुसार सही है। जिस राज्य पर केंद्र का ऋण बकाया है, उसे आगे ऋण लेने से पहले पूर्व अनुमति लेनी होगी।</li>\n<li><strong>कथन 2:</strong> कोई भी राज्य केंद्र सरकार की पूर्व अनुमति के बिना विदेशी स्रोतों से ऋण नहीं ले सकता है।<br>\n- यह सही है क्योंकि राज्यों द्वारा विदेशी स्रोतों से धन उधार लेने को <strong>संघ सरकार</strong> द्वारा विनियमित किया जाता है ताकि अंतर्राष्ट्रीय समझौतों और देश की वित्तीय स्थिरता का अनुपालन सुनिश्चित किया जा सके।</li>\n<li>राज्यों की ऋण लेने की शक्तियाँ संविधान के <strong>अनुच्छेद 293</strong> द्वारा शासित होती हैं, जो वित्तीय अस्थिरता या अनधिकृत ऋणों को रोकने के लिए प्रतिबंध लगाती हैं।</li>\n<li>संघ सरकार राजकोषीय अनुशासन बनाए रखने और राज्यों और केंद्र के बीच समन्वय सुनिश्चित करने के लिए राज्यों की ऋण गतिविधियों की निगरानी करती है।</li>\n<li>इस प्रकार, दोनों कथन सही हैं, और सही उत्तर है <u><strong>3) कथन 1 और 2 सही हैं</strong></u>।</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>अतिरिक्त जानकारी</u></span></strong></span></p>\n<ul>\n<li><strong>संविधान का अनुच्छेद 293:</strong> <ul>\n<li><strong>खंड (1):</strong> एक राज्य अपनी समेकित निधि की सुरक्षा पर भारत के क्षेत्र के भीतर ऋण ले सकता है।</li>\n<li><strong>खंड (3):</strong> यदि किसी राज्य पर संघ सरकार का कोई ऋण बकाया है, तो उसे आगे ऋण लेने के लिए पूर्व अनुमति लेनी होगी।</li>\n<li><strong>खंड (4):</strong> संघ सरकार वित्तीय स्थिरता मानदंडों का अनुपालन सुनिश्चित करने के लिए ऋण लेने पर शर्तें लगा सकती है।</li>\n</ul>\n</li>\n<li><strong>विदेशी ऋण:</strong> <ul>\n<li>राज्य संघ सरकार की मंजूरी के बिना विदेशी संस्थाओं के साथ स्वतंत्र रूप से ऋण पर बातचीत नहीं कर सकते हैं।</li>\n<li>यह सुनिश्चित करता है कि बाहरी ऋण राष्ट्रीय हितों और अंतर्राष्ट्रीय समझौतों के अनुरूप हों।</li>\n</ul>\n</li>\n<li><strong>भारत में राजकोषीय संघवाद:</strong> <ul>\n<li>केंद्र और राज्यों के बीच वित्तीय संबंध राजकोषीय अनुशासन बनाए रखने के लिए संवैधानिक प्रावधानों द्वारा शासित होते हैं।</li>\n<li><strong>वित्त आयोग</strong> समय-समय पर संसाधनों के आवंटन और ऋण लेने की सीमा की समीक्षा करता है।</li>\n</ul>\n</li>\n<li><strong>ऋण लेने की सीमा:</strong> <ul>\n<li>संघ सरकार आर्थिक स्थितियों और राजकोषीय मापदंडों के आधार पर राज्यों के लिए ऋण लेने की सीमा निर्धारित करती है।</li>\n<li>यह अत्यधिक ऋण संचय को रोकने और वित्तीय स्थिरता सुनिश्चित करने के लिए किया जाता है।</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>महत्वपूर्ण बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>ऋण लेने पर संघ का नियंत्रण:</strong> संघ सरकार यह सुनिश्चित करती है कि राज्यों द्वारा ऋण लेना राष्ट्रीय वित्तीय नीतियों और अंतर्राष्ट्रीय दायित्वों के साथ टकराव न करे।</li>\n<li><strong>वित्त आयोग:</strong> वित्त आयोग राज्य ऋण के प्रबंधन के लिए उपायों की सिफारिश करता है और न्यायसंगत वितरण सुनिश्चित करने के लिए धन आवंटित करता है।</li>\n<li><strong>राजकोषीय उत्तरदायित्व और बजट प्रबंधन (FRBM) अधिनियम:</strong> यह अधिनियम केंद्र और राज्यों दोनों के लिए राजकोषीय लक्ष्य निर्धारित करके वित्तीय अनुशासन को बढ़ावा देता है।</li>\n</ul>9a:T1594,<p>The correct answer is <u><strong>Both A and R are true, and R is the correct explanation of A.</strong></u>.</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p>\n<ul>\n<li><strong>Assertion (A): AQI value above 400 is classified as 'Severe'</strong>. <ul>\n<li>The Air Quality Index (<strong>AQI</strong>) is a numerical scale used to measure air pollution levels.</li>\n<li>An AQI above <strong>400</strong> falls in the 'Severe' category, indicating hazardous levels of air pollution.</li>\n<li>This classification is based on guidelines provided by agencies like the <strong>Central Pollution Control Board (CPCB)</strong> in India.</li>\n<li><em>Hence, the assertion is correct.</em></li>\n</ul>\n</li>\n<li><strong>Reason (R): Such levels cause respiratory effects even on healthy individuals</strong>.\n<ul>\n<li>The 'Severe' category of AQI represents extremely high concentrations of pollutants such as <strong>PM2.5</strong>, <strong>PM10</strong>, nitrogen dioxide, sulfur dioxide, and carbon monoxide.</li>\n<li>Exposure to such levels can lead to severe health effects, including <strong>respiratory distress, reduced lung function, and cardiovascular issues</strong>, even in healthy individuals.</li>\n<li>Studies conducted by organizations like the <strong>World Health Organization (WHO)</strong> and CPCB validate that prolonged exposure to 'Severe' AQI levels is detrimental.</li>\n<li><em>Hence, the reason is correct.</em></li>\n</ul>\n</li>\n<li><strong>Link Between A and R:</strong>\n<ul>\n<li>The classification of AQI above 400 as 'Severe' directly corresponds to the health impacts described in the reason.</li>\n<li>The severe health risks mentioned in the reason justify the classification of AQI above 400 as 'Severe'.</li>\n<li><em>Therefore, both A and R are true, and R is the correct explanation of A.</em></li>\n</ul>\n</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n<ul>\n<li><strong>Air Quality Index (AQI):</strong>\n<ul>\n<li>The AQI is a standardized index used globally to communicate air quality levels and their health implications.</li>\n<li>It is calculated using the concentration of major air pollutants, including <strong>PM2.5</strong>, <strong>PM10</strong>, <strong>ozone</strong>, <strong>carbon monoxide</strong>, and <strong>sulfur dioxide</strong>.</li>\n<li>In India, AQI classifications include categories like 'Good', 'Satisfactory', 'Moderate', 'Poor', 'Very Poor', and 'Severe'.</li>\n</ul>\n</li>\n<li><strong>Health Impacts of Severe AQI:</strong>\n<ul>\n<li>Severe AQI levels can cause <strong>lung infections</strong>, <strong>asthma</strong>, and <strong>bronchitis</strong> in vulnerable groups.</li>\n<li>Healthy individuals may experience <strong>difficulty breathing</strong> and <strong>chest tightness</strong> at prolonged exposure.</li>\n<li>People with pre-existing conditions like <strong>heart disease</strong> or <strong>COPD</strong> are at greater risk of exacerbation.</li>\n</ul>\n</li>\n<li><strong>Global Air Quality Standards:</strong>\n<ul>\n<li>Countries like the <strong>United States</strong> and <strong>India</strong> have their own AQI systems but follow similar pollutant concentration limits.</li>\n<li>Organizations like the <strong>WHO</strong> provide global guidelines for air pollution and its health effects.</li>\n</ul>\n</li>\n<li><strong>Steps to Mitigate Severe AQI Levels:</strong>\n<ul>\n<li>Governments implement measures like restricting industrial emissions, promoting <strong>renewable energy</strong>, and reducing vehicular pollution.</li>\n<li>Individuals can take precautions such as using <strong>air purifiers</strong>, wearing masks, and limiting outdoor activities during high AQI periods.</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Important Points</u></span></strong></span></p>\n<ul>\n<li><strong>AQI Monitoring in India:</strong>\n<ul>\n<li>The <strong>Central Pollution Control Board (CPCB)</strong>, under the Ministry of Environment, Forest and Climate Change, oversees AQI monitoring.</li>\n<li>The <strong>National Air Quality Index (NAQI)</strong> was launched in <strong>2014</strong> to simplify air quality data dissemination.</li>\n</ul>\n</li>\n<li><strong>Pollutants in AQI Calculation:</strong>\n<ul>\n<li>Common pollutants include <strong>PM2.5</strong>, <strong>PM10</strong>, <strong>ozone (O3)</strong>, <strong>nitrogen dioxide (NO2)</strong>, <strong>sulfur dioxide (SO2)</strong>, and <strong>carbon monoxide (CO)</strong>.</li>\n<li>Each pollutant has specific concentration thresholds for AQI calculation.</li>\n</ul>\n</li>\n<li><strong>Precautionary Measures:</strong>\n<ul>\n<li>Avoid outdoor activities during 'Severe' AQI periods.</li>\n<li>Use <strong>N95 masks</strong> or air-purifying respirators to minimize exposure.</li>\n</ul>\n</li>\n</ul>9b:T291b,<p>सही उत्तर है <u><strong>A और R दोनों सत्य हैं, और R, A का सही स्पष्टीकरण है।</strong></u></p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>मुख्य बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>अभिकथन (A): 400 से ऊपर AQI मान को 'गंभीर' के रूप में वर्गीकृत किया गया है</strong>। <ul>\n<li>वायु गुणवत्ता सूचकांक (<strong>AQI</strong>) एक संख्यात्मक पैमाना है जिसका उपयोग वायु प्रदूषण के स्तर को मापने के लिए किया जाता है।</li>\n<li><strong>400</strong> से ऊपर का AQI 'गंभीर' श्रेणी में आता है, जो वायु प्रदूषण के खतरनाक स्तरों को दर्शाता है।</li>\n<li>यह वर्गीकरण भारत में <strong>केंद्रीय प्रदूषण नियंत्रण बोर्ड (CPCB)</strong> जैसी एजेंसियों द्वारा प्रदान किए गए दिशानिर्देशों पर आधारित है।</li>\n<li><em>इसलिए, अभिकथन सही है।</em></li>\n</ul>\n</li>\n<li><strong>कारण (R): ऐसे स्तर स्वस्थ व्यक्तियों पर भी श्वसन संबंधी प्रभाव डालते हैं</strong>।\n<ul>\n<li>AQI की 'गंभीर' श्रेणी <strong>PM2.5</strong>, <strong>PM10</strong>, नाइट्रोजन डाइऑक्साइड, सल्फर डाइऑक्साइड और कार्बन मोनोऑक्साइड जैसे प्रदूषकों की अत्यधिक उच्च सांद्रता का प्रतिनिधित्व करती है।</li>\n<li>ऐसे स्तरों के संपर्क में आने से स्वस्थ व्यक्तियों में भी <strong>श्वसन संकट, फेफड़ों के कार्य में कमी और हृदय संबंधी समस्याओं</strong> सहित गंभीर स्वास्थ्य प्रभाव हो सकते हैं।</li>\n<li><strong>विश्व स्वास्थ्य संगठन (WHO)</strong> और CPCB जैसे संगठनों द्वारा किए गए अध्ययन इस बात की पुष्टि करते हैं कि 'गंभीर' AQI स्तरों के लंबे समय तक संपर्क में रहना हानिकारक है।</li>\n<li><em>इसलिए, कारण सही है।</em></li>\n</ul>\n</li>\n<li><strong>A और R के बीच संबंध:</strong>\n<ul>\n<li>400 से ऊपर AQI का 'गंभीर' के रूप में वर्गीकरण सीधे कारण में वर्णित स्वास्थ्य प्रभावों से मेल खाता है।</li>\n<li>कारण में उल्लिखित गंभीर स्वास्थ्य जोखिम 400 से ऊपर AQI के 'गंभीर' के रूप में वर्गीकरण को सही ठहराते हैं।</li>\n<li><em>इसलिए, A और R दोनों सत्य हैं, और R, A का सही स्पष्टीकरण है।</em></li>\n</ul>\n</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>अतिरिक्त जानकारी</u></span></strong></span></p>\n<ul>\n<li><strong>वायु गुणवत्ता सूचकांक (AQI):</strong>\n<ul>\n<li>AQI एक मानकीकृत सूचकांक है जिसका उपयोग विश्व स्तर पर वायु गुणवत्ता के स्तर और उनके स्वास्थ्य निहितार्थों को संप्रेषित करने के लिए किया जाता है।</li>\n<li>यह <strong>PM2.5</strong>, <strong>PM10</strong>, <strong>ओजोन</strong>, <strong>कार्बन मोनोऑक्साइड</strong> और <strong>सल्फर डाइऑक्साइड</strong> सहित प्रमुख वायु प्रदूषकों की सांद्रता का उपयोग करके गणना की जाती है।</li>\n<li>भारत में, AQI वर्गीकरण में 'अच्छा', 'संतोषजनक', 'मध्यम', 'खराब', 'बहुत खराब' और 'गंभीर' जैसी श्रेणियां शामिल हैं।</li>\n</ul>\n</li>\n<li><strong>गंभीर AQI के स्वास्थ्य प्रभाव:</strong>\n<ul>\n<li>गंभीर AQI स्तर कमजोर समूहों में <strong>फेफड़ों के संक्रमण</strong>, <strong>अस्थमा</strong> और <strong>ब्रोंकाइटिस</strong> का कारण बन सकते हैं।</li>\n<li>स्वस्थ व्यक्तियों को लंबे समय तक संपर्क में रहने पर <strong>सांस लेने में कठिनाई</strong> और <strong>सीने में जकड़न</strong> का अनुभव हो सकता है।</li>\n<li><strong>हृदय रोग</strong> या <strong>सीओपीडी</strong> जैसी पहले से मौजूद स्थितियों वाले लोगों को बढ़ने का अधिक खतरा होता है।</li>\n</ul>\n</li>\n<li><strong>वैश्विक वायु गुणवत्ता मानक:</strong>\n<ul>\n<li><strong>संयुक्त राज्य अमेरिका</strong> और <strong>भारत</strong> जैसे देशों की अपनी AQI प्रणालियाँ हैं लेकिन वे समान प्रदूषक सांद्रता सीमाओं का पालन करते हैं।</li>\n<li><strong>WHO</strong> जैसे संगठन वायु प्रदूषण और इसके स्वास्थ्य प्रभावों के लिए वैश्विक दिशानिर्देश प्रदान करते हैं।</li>\n</ul>\n</li>\n<li><strong>गंभीर AQI स्तरों को कम करने के उपाय:</stro
