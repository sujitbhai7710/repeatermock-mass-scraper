<script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},svg:{fontCache:'global'},options:{skipHtmlTags:['script','noscript','style','textarea','pre','code']}};const QUESTIONS=[{"text": "In the sequence A, C, F, J..., which letter is the 5th?", "options": ["O", "P", "N", "M"], "correct": 1, "solution": "<p style=\"color: rgb(33, 37, 41);\"><img alt=\"\" src=\"https://cdn.repeatermock.com/tb/7ca63fa0a9b1d8d94e9032be998e74b7faff301d8847e785439c04e89b02dfd4.png\" /></p>\\n\\n<p style=\"color: rgb(33, 37, 41);\">The logic followed here is:</p>\\n\\n<p style=\"color: rgb(33, 37, 41);\"><img alt=\"\" src=\"https://cdn.repeatermock.com/tb/c8c435af5c13a48ee385927ea3f808a35aed70760cf1eda657bc3dc67db1d797.png\" /></p>\\n\\n<p style=\"color: rgb(33, 37, 41);\">So, '<span style=\"font-weight: bolder;\">O</span>' will replace the question mark in the given series.</p>\\n\\n<p style=\"color: rgb(33, 37, 41);\">Hence, the correct answer is <span style=\"font-weight: 700;\">\"Option 1</span><span style=\"font-weight: 700;\">\"</span>.</p>\\n", "marks": 2, "negMarks": 0.5}, {"text": "Choose the odd one out.", "options": ["Lily", "Lotus", "Grapes", "Jasmine"], "correct": 3, "solution": "<p>The logic followed here is:</p>\\n\\n<p>Option 1) (Lily) → It is a flower.</p>\\n\\n<p>Option 2) (Lotus) → It is a flower.</p>\\n\\n<p>Option 3) (Grapes) → It is a <strong>fruit.</strong></p>\\n\\n<p>Option 4) (Jasmine) → It is a flower.</p>\\n\\n<p>Here, Lily, Lotus and Jasmine are flowers, whereas Grapes is a fruit.</p>\\n\\n<p>Hence, the correct answer is <strong>\"Option 3\".</strong></p>\\n", "marks": 2, "negMarks": 0.5}, {"text": "A is the son of B. C is the wife of B. D is the son of C. How is A related to D?", "options": ["Uncle", "Brother", "Cousin", "Son"], "correct": 2, "solution": "<p style=\"color: rgb(33, 37, 41);\">Family Chart:</p>\n\n<p style=\"color: rgb(33, 37, 41);\"><img alt=\"\" src=\"https://cdn.repeatermock.com/tb/aecbe9ab6b7da7cca1ac2d356e84b8c992ce57c8b50affd73dfdd3dad30ceb2e.png\" /></p>\n\n<p style=\"color: rgb(33, 37, 41);\">Given: </p>\n\n<p style=\"color: rgb(33, 37, 41);\">A is the son of B.</p>\n\n<p style=\"color: rgb(33, 37, 41);\">C is the wife of B.</p>\n\n<p style=\"color: rgb(33, 37, 41);\">D is the son of C.</p>\n\n<p style=\"color: rgb(33, 37, 41);\"><img alt=\"\" src=\"https://cdn.repeatermock.com/tb/d8e5c81c1a857828dc0d8fc8a62d4bfd6a292b6ff1b1eacd803978ececd13f8e.png\" /></p>\n\n<p style=\"color: rgb(33, 37, 41);\">So, A is <strong><span style=\"color: rgb(33, 37, 41);\">Brother</span></strong> of D.</p>\n\n<p style=\"color: rgb(33, 37, 41);\">Hence, the correct answer is <span style=\"font-weight: bolder;\">\"Option 2\"</span>.</p>", "marks": 2, "negMarks": 0.5}, {"text": "A is the father of B. B is the brother of C. How is A related to C?", "options": ["Uncle", "Father", "Brother", "Grandfather"], "correct": 2, "solution": "<p style=\"color: rgb(33, 37, 41);\">Family Chart:</p>\n\n<p style=\"color: rgb(33, 37, 41);\"><img alt=\"\" src=\"https://cdn.repeatermock.com/tb/aecbe9ab6b7da7cca1ac2d356e84b8c992ce57c8b50affd73dfdd3dad30ceb2e.png\" /></p>\n\n<p style=\"color: rgb(33, 37, 41);\">Given: </p>\n\n<p style=\"color: rgb(33, 37, 41);\">A is the father of B.</p>\n\n<p style=\"color: rgb(33, 37, 41);\">B is the brother of C.</p>\n\n<p style=\"color: rgb(33, 37, 41);\"><img alt=\"\" src=\"https://cdn.repeatermock.com/tb/856135aa2ae0c371e18b20a5fbb3618621e7ad06086dfd0f3eead9df999a0ec1.png\" /></p>\n\n<p style=\"color: rgb(33, 37, 41);\">So, A is <strong><span style=\"color: rgb(33, 37, 41);\">Father</span></strong> of C.</p>\n\n<p style=\"color: rgb(33, 37, 41);\">Hence, the correct answer is <span style=\"font-weight: bolder;\">\"Option 2\"</span>.</p>", "marks": 2, "negMarks": 0.5}, {"text": "What comes next: 10, 17, 26, 37, 50, ?", "options": ["45", "54", "76", "65"], "correct": 4, "solution": "<p style=\"color: rgb(33, 37, 41);\">The logic followed here is:</p>\\n\\n<p style=\"color: rgb(33, 37, 41);\"><img alt=\"\" src=\"https://cdn.repeatermock.com/tb/abe983c30bfee62340490c2e927a08f6b5c97e771105872f5a1198dde8e1000c.png\" style=\"height: 111px; width: 300px;\" /></p>\\n\\n<p style=\"color: rgb(33, 37, 41);\">thus, \"<span style=\"font-weight: bolder;\">65</span>\" will replace the question mark in the given series.</p>\\n\\n<p style=\"color: rgb(33, 37, 41);\">Hence, the correct option is <span style=\"font-weight: bolder;\">\"Option 4\".</span></p>\\n", "marks": 2, "negMarks": 0.5}, {"text": "You're assigned a task you don't know how to do. What's your best course of action?", "options": ["Make excuses", "Do it wrongly", "Seek help or guidance", "Delay it"], "correct": 3, "solution": "<p>The logic followed here is:</p>\\n\\n<p>Option 1) (Make excuses)</p>\\n\\n<p>→ This avoids responsibility and does not solve the problem.</p>\\n\\n<p>Option 2) (Do it wrongly)</p>\\n\\n<p>→ Completing the task incorrectly can create bigger issues.</p>\\n\\n<p>Option 3) (Seek help or guidance)</p>\\n\\n<p>→ This shows responsibility, willingness to learn, and ensures the task is done correctly.</p>\\n\\n<p>Option 4) (Delay it)</p>\\n\\n<p>→ Postponing the task may cause inefficiency and affect deadlines.</p>\\n\\n<p>Here, the most appropriate and professional action is to seek help or guidance.</p>\\n\\n<p>Hence, the correct answer is <strong>\"Option 3\".</strong></p>\\n", "marks": 2, "negMarks": 0.5}, {"text": "Complete the series:0, 7, 26, 63, ?", "options": ["100", "125", "216", "124"], "correct": 4, "solution": "<p style=\"color: rgb(33, 37, 41);\">The logic followed here is:</p>\\n\\n<p style=\"color: rgb(33, 37, 41);\"><img alt=\"\" src=\"https://cdn.repeatermock.com/tb/c1abcdedbbde7ed7b181be2b9ec2d0f1e6c8792766063d9a135c0d8d6ff641ca.png\" /></p>\\n\\n<p style=\"color: rgb(33, 37, 41);\">thus, \"<span style=\"font-weight: bolder;\">124</span>\" will replace the question mark in the given series.</p>\\n\\n<p style=\"color: rgb(33, 37, 41);\">Hence, the correct option is <span style=\"font-weight: bolder;\">\"Option 4\".</span></p>\\n", "marks": 2, "negMarks": 0.5}, {"text": "$2e", "options": ["S", "U", "Q", "R"], "correct": 1, "solution": "<p>Given:</p>\n\n<p>1. Boxer attends the seminar in March.<br />\n<br />\n2. The one who is a Boxer attends the seminar just after the dentist.</p>\n\n<p>3. U is an engineer and attends in a month with 30 days → April or September.</p>\n\n<p>4. The one who is a surgeon attends the seminar just after the one who is an engineer → U which is engineer can not attend the seminar on September.</p>\n\n<table>\n\\t<thead>\n\\t\\t<tr>\n\\t\\t\\t<th>Month</th>\n\\t\\t\\t<th>Person</th>\n\\t\\t\\t<th>Profession</th>\n\\t\\t</tr>\n\\t</thead>\n\\t<tbody>\n\\t\\t<tr>\n\\t\\t\\t<td>January</td>\n\\t\\t\\t<td> </td>\n\\t\\t\\t<td>Dentist</td>\n\\t\\t</tr>\n\\t\\t<tr>\n\\t\\t\\t<td>March</td>\n\\t\\t\\t<td> </td>\n\\t\\t\\t<td>Boxer</td>\n\\t\\t</tr>\n\\t\\t<tr>\n\\t\\t\\t<td>April</td>\n\\t\\t\\t<td>U</td>\n\\t\\t\\t<td>Engineer</td>\n\\t\\t</tr>\n\\t\\t<tr>\n\\t\\t\\t<td>May</td>\n\\t\\t\\t<td> </td>\n\\t\\t\\t<td>Surgeon</td>\n\\t\\t</tr>\n\\t\\t<tr>\n\\t\\t\\t<td>July</td>\n\\t\\t\\t<td> </td>\n\\t\\t\\t<td> </td>\n\\t\\t</tr>\n\\t\\t<tr>\n\\t\\t\\t<td>August</td>\n\\t\\t\\t<td> </td>\n\\t\\t\\t<td> </td>\n\\t\\t</tr>\n\\t\\t<tr>\n\\t\\t\\t<td>September</td>\n\\t\\t\\t<td> </td>\n\\t\\t\\t<td> </td>\n\\t\\t</tr>\n\\t</tbody>\n</table>\n\n<p><br />\n5.<span style=\"color: rgb(33, 37, 41);\">Two persons attend between U and Police Officer → Police Officer is in August.</span></p>\n\n<table style=\"color: rgb(33, 37, 41);\">\n\\t<thead>\n\\t\\t<tr>\n\\t\\t\\t<th>Month</th>\n\\t\\t\\t<th>Person</th>\n\\t\\t\\t<th>Profession</th>\n\\t\\t</tr>\n\\t</thead>\n\\t<tbody>\n\\t\\t<tr>\n\\t\\t\\t<td>January</td>\n\\t\\t\\t<td> </td>\n\\t\\t\\t<td><span style=\"color: rgb(33, 37, 41);\">Dentist</span></td>\n\\t\\t</tr>\n\\t\\t<tr>\n\\t\\t\\t<td>March</td>\n\\t\\t\\t<td> </td>\n\\t\\t\\t<td><span style=\"color: rgb(33, 37, 41);\">Boxer</span></td>\n\\t\\t</tr>\n\\t\\t<tr>\n\\t\\t\\t<td>April</td>\n\\t\\t\\t<td>U</td>\n\\t\\t\\t<td>Engineer</td>\n\\t\\t</tr>\n\\t\\t<tr>\n\\t\\t\\t<td>May</td>\n\\t\\t\\t<td> </td>\n\\t\\t\\t<td>Surgeon</td>\n\\t\\t</tr>\n\\t\\t<tr>\n\\t\\t\\t<td>July</td>\n\\t\\t\\t<td> </td>\n\\t\\t\\t<td> </td>\n\\t\\t</tr>\n\\t\\t<tr>\n\\t\\t\\t<td>August</td>\n\\t\\t\\t<td> </td>\n\\t\\t\\t<td>Police officer</td>\n\\t\\t</tr>\n\\t\\t<tr>\n\\t\\t\\t<td>September</td>\n\\t\\t\\t<td> </td>\n\\t\\t\\t<td> </td>\n\\t\\t</tr>\n\\t</tbody>\n</table>\n\n<p>6. R and Q have three persons between them and are not in March or May.<br />\n<br />\n7. R attend seminar after U. </p>\n\n<table style=\"color: rgb(33, 37, 41);\">\n\\t<thead>\n\\t\\t<tr>\n\\t\\t\\t<th>Month</th>\n\\t\\t\\t<th>Person</th>\n\\t\\t\\t<th>Profession</th>\n\\t\\t</tr>\n\\t</thead>\n\\t<tbody>\n\\t\\t<tr>\n\\t\\t\\t<td>January</td>\n\\t\\t\\t<td>Q</td>\n\\t\\t\\t<td><span style=\"color: rgb(33, 37, 41);\">Dentist</span></td>\n\\t\\t</tr>\n\\t\\t<tr>\n\\t\\t\\t<td>March</td>\n\\t\\t\\t<td> </td>\n\\t\\t\\t<td>Boxer</td>\n\\t\\t</tr>\n\\t\\t<tr>\n\\t\\t\\t<td>April</td>\n\\t\\t\\t<td>U</td>\n\\t\\t\\t<td>Engineer</td>\n\\t\\t</tr>\n\\t\\t<tr>\n\\t\\t\\t<td>May</td>\n\\t\\t\\t<td> </td>\n\\t\\t\\t<td>Surgeon</td>\n\\t\\t</tr>\n\\t\\t<tr>\n\\t\\t\\t<td>July</td>\n\\t\\t\\t<td>R</td>\n\\t\\t\\t<td> </td>\n\\t\\t</tr>\n\\t\\t<tr>\n\\t\\t\\t<td>August</td>\n\\t\\t\\t<td> </td>\n\\t\\t\\t<td>Police officer</td>\n\\t\\t</tr>\n\\t\\t<tr>\n\\t\\t\\t<td>September</td>\n\\t\\t\\t<td> </td>\n\\t\\t\\t<td> </td>\n\\t\\t</tr>\n\\t</tbody>\n</table>\n\n<p> </p>\n\n<p>8. Q and S both are not Police. </p>\n\n<p>9. T attend the seminar after P but before V. </p>\n\n<p>10. S attends the seminar just before the one who is a journalist.</p>\n\n<table>\n\\t<thead>\n\\t\\t<tr>\n\\t\\t\\t<th>Month</th>\n\\t\\t\\t<th>Person</th>\n\\t\\t\\t<th>Profession</th>\n\\t\\t</tr>\n\\t</thead>\n\\t<tbody>\n\\t\\t<tr>\n\\t\\t\\t<td>January</td>\n\\t\\t\\t<td>Q</td>\n\\t\\t\\t<td>Dentist</td>\n\\t\\t</tr>\n\\t\\t<tr>\n\\t\\t\\t<td>March</td>\n\\t\\t\\t<td>P</td>\n\\t\\t\\t<td>Boxer</td>\n\\t\\t</tr>\n\\t\\t<tr>\n\\t\\t\\t<td>April</td>\n\\t\\t\\t<td>U</td>\n\\t\\t\\t<td>Engineer</td>\n\\t\\t</tr>\n\\t\\t<tr>\n\\t\\t\\t<td>May</td>\n\\t\\t\\t<td>S</td>\n\\t\\t\\t<td>Surgeon</td>\n\\t\\t</tr>\n\\t\\t<tr>\n\\t\\t\\t<td>July</td>\n\\t\\t\\t<td>R</td>\n\\t\\t\\t<td>Journalist</td>\n\\t\\t</tr>\n\\t\\t<tr>\n\\t\\t\\t<td>August</td>\n\\t\\t\\t<td>T</td>\n\\t\\t\\t<td>Police officer</td>\n\\t\\t</tr>\n\\t\\t<tr>\n\\t\\t\\t<td>September</td>\n\\t\\t\\t<td>V</td>\n\\t\\t\\t<td>Singer</td>\n\\t\\t</tr>\n\\t</tbody>\n</table>\n\n<p><br />\n<strong>S</strong> attend the seminar in May.</p>\n\n<p>Hence, the correct answer is <strong>\"Option 1\".</strong></p>", "marks": 2, "negMarks": 0.5}, {"text": "Which word cannot be formed from the letters of the word ADMINISTRATION using each letter only once?", "options": ["SITUATION", "TRADITION", "RATION", "STRAIN"], "correct": 1, "solution": "<p>Given word: ADMINISTRATION</p>\\n\\n<p>Let’s check all the options:</p>\\n\\n<p><strong>(1) SITUATION</strong></p>\\n\\n<p>⇒ It can be formed as all required letters (S, I, T, U, A, O, N) are present in sufficient quantity.</p>\\n\\n<p>(2) TRADITION</p>\\n\\n<p>⇒ It can’t be formed as it requires two D’s, but ADMINISTRATION has only one D.</p>\\n\\n<p>(3) RATION</p>\\n\\n<p>⇒ It can be formed as all required letters are available.</p>\\n\\n<p>(4) STRAIN</p>\\n\\n<p>⇒ It can be formed as all required letters are available.</p>\\n\\n<p>So, the answer is <strong>\"TRADITION\".</strong></p>\\n\\n<p>Hence, the correct answer is <strong>Option 1.</strong></p>\\n", "marks": 2, "negMarks": 0.5}, {"text": "If SNAKE is written as RMZJD, how is ZEBRA written.", "options": ["YDAQZ", "YDAQY", "YCBQZ", "YDAQX"], "correct": 1, "solution": "<p>The logic followed here is:</p>\n\n<p>Logic: Each letter is shifted <strong>two positions backward</strong> in the English alphabet.</p>\n\n<p>Given, <span style=\"color: rgb(33, 37, 41);\">SNAKE → R M Z J D</span></p>\n\n<p><img alt=\"\" src=\"https://cdn.repeatermock.com/tb/8a9c59cea75b0b349c9a7187c721e7412c3446ad385b4a01aa4a021a9db0e9bc.png\" /><img alt=\"\" src=\"https://cdn.repeatermock.com/tb/7774221b54dfaf1e8414d363442e0e64f11a5fcc867792ff90067ab6ec57ce02.png\" style=\"width: 200px; height: 119px;\" /></p>\n\n<p>Now, Z E B R A :</p>\n\n<p><img alt=\"\" src=\"https://cdn.repeatermock.com/tb/d50307e8a35eeefcc32e5dedc33ee3be0909e588a9050b1c33129299b0e9cc9f.png\" /><img alt=\"\" src=\"https://cdn.repeatermock.com/tb/508e94b160ad2994febee32b8f2e84826d563b38ccd7a184b1f1328c49015571.png\" style=\"width: 200px; height: 120px;\" /></p>\n\n<p>So, ZEBRA → Y D A Q Z</p>\n\n<p>Hence, the correct answer is <strong>\"Option 1\".</strong></p>", "marks": 2, "negMarks": 0.5}, {"text": "What comes next in the series? D, I, N, S, ?", "options": ["Z", "W", "Y", "X"], "correct": 4, "solution": "<p style=\"color: rgb(33, 37, 41);\"><img alt=\"\" src=\"https://cdn.repeatermock.com/tb/7ca63fa0a9b1d8d94e9032be998e74b7faff301d8847e785439c04e89b02dfd4.png\" /></p>\n\n<p style=\"color: rgb(33, 37, 41);\">The logic followed here is:</p>\n\n<p style=\"color: rgb(33, 37, 41);\"><img alt=\"\" src=\"https://cdn.repeatermock.com/tb/4b4c657f4d7115425864be79992e39f906644e9892235020a8bee2864cac70f7.png\" /><img alt=\"\" src=\"https://cdn.repeatermock.com/tb/0cb8bfd74cfa2b22b9123e378070ec21320b9bbc3245d3441ee84dd8ca9efc66.png\" style=\"width: 350px; height: 87px;\" /></p>\n\n<p style=\"color: rgb(33, 37, 41);\">So, '<span style=\"font-weight: bolder;\">X</span>' will replace the question mark in the given series.</p>\n\n<p style=\"color: rgb(33, 37, 41);\">Hence, the correct answer is <span style=\"font-weight: 700;\">\"Option 4</span><span style=\"font-weight: 700;\">\"</span>.</p>", "marks": 2, "negMarks": 0.5}, {"text": "If 3 $ 4 = 37 and 4 $ 5 = 61, what is 5 $ 6?", "options": ["85", "91", "96", "89"], "correct": 2, "solution": "<p>The logic followed here is:</p>\\n\\n<p>Logic: (First number²) + (Second number²) + (First number × Second number)</p>\\n\\n<p>Given,</p>\\n\\n<p>3 $ 4</p>\\n\\n<p>⇒ (3²) + (4²) + (3 × 4)</p>\\n\\n<p>⇒ 9 + 16 + 12 = 37</p>\\n\\n<p>And, 4 $ 5</p>\\n\\n<p>⇒ (4²) + (5²) + (4 × 5)</p>\\n\\n<p>⇒ 16 + 25 + 20 = 61</p>\\n\\n<p>Now, 5 $ 6:</p>\\n\\n<p>⇒ (5²) + (6²) + (5 × 6)</p>\\n\\n<p>⇒ 25 + 36 + 30 = 91</p>\\n\\n<p>Hence, the correct answer is <strong>\"Option 2\".</strong></p>\\n", "marks": 2, "negMarks": 0.5}, {"text": "A train 120 meters long takes 6 seconds to cross a man. What is the speed of the train in km/h?", "options": ["36", "72", "60", "75"], "correct": 2, "solution": "<p>Given:</p>\\n\\n<p>Length of train = 120 meters</p>\\n\\n<p>Time taken to cross a man = 6 seconds</p>\\n\\n<p>According to Question:</p>\\n\\n<p>When a train crosses a man, distance covered = Length of the train</p>\\n\\n<p>So, Speed = Distance / Time</p>\\n\\n<p>Speed = 120 / 6</p>\\n\\n<p>= 20 m/s</p>\\n\\n<p>Now, convert m/s into km/h</p>\\n\\n<p>1 m/s = 18/5 km/h</p>\\n\\n<p>So, 20 × (18/5)</p>\\n\\n<p>= 4 × 18</p>\\n\\n<p>= 72 km/h</p>\\n\\n<p>Hence, the correct answer is <strong>Option 2.</strong></p>\\n", "marks": 2, "negMarks": 0.5}, {"text": "If \"CRANE\" is coded as \"DSBOF\", how is \"DSBOF\" coded?", "options": ["ETCPG", "DTCOP", "ESCPF", "DTCPF"], "correct": 1, "solution": "<p>The logic followed here is:</p>\\n\\n<p>Logic: Each letter is shifted <strong>one position forward</strong> in the English alphabet.</p>\\n\\n<p>Given, <span style=\"color: rgb(33, 37, 41);\">CRANE → D S B O F</span></p>\\n\\n<p><img alt=\"\" src=\"https://cdn.repeatermock.com/tb/3af6408ba710e8ae7fae8df509cb3de6b78b161cde9c89f98b90b82eab2b90c2.png\" /></p>\\n\\n<p>Now, D S B O F :</p>\\n\\n<p><img alt=\"\" src=\"https://cdn.repeatermock.com/tb/855f7006f2fb9a2444fca208cc7c380093ca307f7095c86c05da2d03b3fe645e.png\" /></p>\\n\\n<p>So, DSBOF → E T C P G</p>\\n\\n<p>Hence, the correct answer is <strong>\"Option 1\".</strong></p>\\n", "marks": 2, "negMarks": 0.5}, {"text": "Neither the Chola nor the Chera dynasty was directly responsible for the establishment of:", "options": ["Naval expeditions to Southeast Asia", "Tamil literary renaissance", "Devadasi temple system", "Bahmani kingdom"], "correct": 4, "solution": "<p>The correct answer is <u><strong>Bahmani kingdom</strong></u>.</p> <p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p> <ul> <li>The <strong>Bahmani kingdom</strong> was established in <strong>1347 CE</strong> by <strong>Ala-ud-din Bahman Shah</strong> after revolting against the Delhi Sultanate's Tughlaq dynasty. It was the first independent Islamic kingdom in southern India.</li> <li>Neither the <strong>Chola dynasty</strong> nor the <strong>Chera dynasty</strong> played any role in the establishment of the Bahmani kingdom, as their reigns predated the formation of this kingdom by several centuries.</li> <li>The Bahmani kingdom was located in the <strong>Deccan region</strong> and was known for its distinct Indo-Islamic culture, architecture, and administrative systems.</li> <li>The establishment of the Bahmani kingdom marked the beginning of an era of Islamic dominance in the Deccan region, which later saw the rise of other prominent kingdoms like the <strong>Bijapur Sultanate</strong> and the <strong>Golconda Sultanate</strong>.</li> <li>The Chola and Chera dynasties were primarily associated with the Tamil region and were recognized for their contributions to <strong>Tamil literature, naval expeditions, and temple architecture</strong>, which were distinct from the Bahmani kingdom's focus on Islamic culture and governance. </li> </ul> <p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p> <ul> <li><strong>Chola dynasty:</strong> <ul> <li>The Chola dynasty was one of the longest-ruling dynasties in Indian history, spanning from the late 9th century to the 13th century CE.</li> <li>They are renowned for their contributions to <strong>Tamil literature</strong>, the construction of grand temples like the <strong>Brihadeeswarar Temple</strong> in Thanjavur, and their extensive <strong>naval expeditions</strong> to Southeast Asia.</li> <li>The Cholas played a significant role in the promotion of Hindu culture and the establishment of a sophisticated administrative system.</li> </ul> </li> <li><strong>Chera dynasty:</strong> <ul> <li>The Chera dynasty was one of the ancient Tamil dynasties that ruled parts of present-day Kerala and Tamil Nadu.</li> <li>Their contributions included fostering <strong>Tamil literary renaissance</strong> and trade relations with the Romans, Greeks, and Arabs.</li> <li>They were known for their involvement in the <strong>spice trade</strong> and the development of maritime commerce.</li> </ul> </li> <li><strong>Bahmani kingdom:</strong> <ul> <li>The Bahmani kingdom lasted for nearly two centuries, from <strong>1347 CE to 1527 CE</strong>, before breaking into five successor states known as the <strong>Deccan Sultanates</strong>.</li> <li>The kingdom's capital was initially <strong>Gulbarga</strong> and later moved to <strong>Bidar</strong>.</li> <li>The Bahmani rulers were known for their patronage of Persian culture, art, and architecture, including the construction of notable monuments like the <strong>Gol Gumbaz</strong>.</li> </ul> </li> <li><strong>Devadasi temple system:</strong> <ul> <li>The <strong>Devadasi system</strong> was prominent during the Chola and Chera reigns, where women dedicated themselves to temple services, including dance and music.</li> <li>It was deeply rooted in Hindu culture and had no connection to the Islamic Bahmani kingdom.</li> </ul> </li> </ul> <p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Important Points</u></span></strong></span></p> <ul> <li><strong>Geographical distinction:</strong> The Chola and Chera dynasties were centered in the Tamil region, whereas the Bahmani kingdom was established in the Deccan region of southern India.</li> <li><strong>Chronological difference:</strong> The Chola and Chera dynasties flourished several centuries before the Bahmani kingdom emerged.</li> <li><strong>Religious and cultural contrast:</strong> The Cholas and Cheras were deeply rooted in Hindu traditions, whereas the Bahmani kingdom represented Islamic governance and culture.</li> <li><strong>Architectural legacy:</strong> The Cholas and Cheras are celebrated for their temple architecture, while the Bahmani kingdom is known for its Indo-Islamic architectural styles.</li> </ul>69:T238b,<p>सही उत्तर <u><strong>बहमनी साम्राज्य</strong></u> है।</p> <p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>मुख्य बिंदु</u></span></strong></span></p> <ul> <li><strong>बहमनी साम्राज्य</strong> की स्थापना <strong>1347 ईस्वी</strong> में <strong>अला-उद-दीन बहमन शाह</strong> ने दिल्ली सल्तनत के तुगलक वंश के खिलाफ विद्रोह करने के बाद की थी। यह दक्षिण भारत का पहला स्वतंत्र इस्लामी साम्राज्य था।</li> <li><strong>चोल वंश</strong> और <strong>चेर वंश</strong> दोनों ने बहमनी साम्राज्य की स्थापना में कोई भूमिका नहीं निभाई, क्योंकि उनका शासन इस साम्राज्य के गठन से कई शताब्दियों पहले का था।</li> <li>बहमनी साम्राज्य <strong>दक्कन क्षेत्र</strong> में स्थित था और अपनी विशिष्ट इंडो-इस्लामिक संस्कृति, वास्तुकला और प्रशासनिक प्रणालियों के लिए जाना जाता था।</li> <li>बहमनी साम्राज्य की स्थापना ने दक्कन क्षेत्र में इस्लामी प्रभुत्व के एक युग की शुरुआत की, जिसने बाद में बीजापुर सल्तनत और गोलकुंडा सल्तनत जैसे अन्य प्रमुख साम्राज्यों का उदय देखा।</li> <li>चोल और चेर राजवंश मुख्य रूप से तमिल क्षेत्र से जुड़े थे और तमिल साहित्य, नौसैनिक अभियानों और मंदिर वास्तुकला में उनके योगदान के लिए पहचाने जाते थे, जो बहमनी साम्राज्य के इस्लामी संस्कृति और शासन पर ध्यान केंद्रित करने से अलग थे।</li> </ul> <p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>अतिरिक्त जानकारी</u></span></strong></span></p> <ul> <li><strong>चोल वंश:</strong> <ul> <li>चोल वंश भारतीय इतिहास के सबसे लंबे समय तक शासन करने वाले राजवंशों में से एक था, जो 9वीं शताब्दी के अंत से लेकर 13वीं शताब्दी ईस्वी तक फैला था।</li> <li>वे तमिल साहित्य, तंजावुर में बृहदेश्वर मंदिर जैसे भव्य मंदिरों के निर्माण और दक्षिण पूर्व एशिया में अपने व्यापक नौसैनिक अभियानों में अपने योगदान के लिए प्रसिद्ध हैं।</li> <li>चोलों ने हिंदू संस्कृति को बढ़ावा देने और एक परिष्कृत प्रशासनिक प्रणाली की स्थापना में महत्वपूर्ण भूमिका निभाई।</li> </ul> </li> <li><strong>चेर वंश:</strong> <ul> <li>चेर वंश प्राचीन तमिल राजवंशों में से एक था जिसने वर्तमान केरल और तमिलनाडु के कुछ हिस्सों पर शासन किया था।</li> <li>उनके योगदान में तमिल साहित्यिक पुनर्जागरण और रोमनों, यूनानियों और अरबों के साथ व्यापार संबंधों को बढ़ावा देना शामिल था।</li> <li>वे मसाले के व्यापार और समुद्री वाणिज्य के विकास में अपनी भागीदारी के लिए जाने जाते थे।</li> </ul> </li> <li><strong>बहमनी साम्राज्य:</strong> <ul> <li>बहमनी साम्राज्य लगभग दो शताब्दियों तक चला, <strong>1347 ईस्वी से 1527 ईस्वी</strong> तक, पांच उत्तराधिकारी राज्यों में टूटने से पहले, जिन्हें <strong>दक्कन सल्तनत</strong> के रूप में जाना जाता है।</li> <li>साम्राज्य की राजधानी शुरू में <strong>गुलबर्गा</strong> थी और बाद में <strong>बीदर</strong> में स्थानांतरित कर दी गई।</li> <li>बहमनी शासक फ़ारसी संस्कृति, कला और वास्तुकला के संरक्षण के लिए जाने जाते थे, जिसमें गोल गुंबज जैसे उल्लेखनीय स्मारकों का निर्माण शामिल है।</li> </ul> </li> <li><strong>देवदासी मंदिर प्रणाली:</strong> <ul> <li><strong>देवदासी प्रणाली</strong> चोल और चेर शासनकाल के दौरान प्रमुख थी, जहाँ महिलाओं ने नृत्य और संगीत सहित मंदिर सेवाओं के लिए खुद को समर्पित कर दिया था।</li> <li>यह हिंदू संस्कृति में गहराई से निहित था और इसका इस्लामी बहमनी साम्राज्य से कोई संबंध नहीं था।</li> </ul> </li> </ul> <p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>महत्वपूर्ण बिंदु</u></span></strong></span></p> <ul> <li><strong>भौगोलिक अंतर:</strong> चोल और चेर राजवंश तमिल क्षेत्र में केंद्रित थे, जबकि बहमनी साम्राज्य की स्थापना दक्षिण भारत के दक्कन क्षेत्र में हुई थी।</li> <li><strong>कालानुक्रमिक अंतर:</strong> चोल और चेर राजवंश बहमनी साम्राज्य के उदय से कई शताब्दियों पहले फले-फूले।</li> <li><strong>धार्मिक और सांस्कृतिक विपरीत:</strong> चोल और चेर हिंदू परंपराओं में गहराई से निहित थे, जबकि बहमनी साम्राज्य ने इस्लामी शासन और संस्कृति का प्रतिनिधित्व किया।</li> <li><strong>वास्तुकला विरासत:</strong> चोल और चेर अपने मंदिर वास्तुकला के लिए मनाए जाते हैं, जबकि बहमनी साम्राज्य अपनी इंडो-इस्लामिक वास्तुकला शैलियों के लिए जाना जाता है।</li> </ul>6a:T14e4,<p>The correct answer is <u><strong>Bhutan</strong></u>.</p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p>\n\n<ul>\n\\t<li><strong>Bhutan</strong> is famously known as the <strong>\"Land of the Thunder Dragon\"</strong> due to its association with the mythical dragon, \"Druk,\" which appears on its national flag and symbolizes thunder.</li>\n\\t<li>The term \"Thunder Dragon\" originates from the local name for Bhutan, <strong>\"Druk Yul,\"</strong> which translates to \"Land of the Thunder Dragon.\"</li>\n\\t<li>The national flag of Bhutan features a dragon, which represents the country's identity and connection to its mythology. The dragon holds jewels, symbolizing protection and wealth.</li>\n\\t<li>Bhutan is a small, landlocked country situated in the eastern Himalayas, bordered by <strong>India</strong> to the south and <strong>China</strong> to the north.</li>\n\\t<li>Bhutan's culture is deeply rooted in <strong>Buddhist traditions</strong>, and the dragon plays a significant role in its religious beliefs and folklore.</li>\n</ul>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<ul>\n\\t<li><strong>Geographical Location:</strong>\n\n\\t<ul>\n\\t\\t<li>Bhutan is located in the eastern Himalayas and is known for its mountainous terrain, forests, and diverse ecosystems.</li>\n\\t\\t<li>The capital city of Bhutan is <strong>Thimphu</strong>, which serves as the political and cultural hub of the country.</li>\n\\t</ul>\n\\t</li>\n\\t<li><strong>Cultural and Religious Influence:</strong>\n\\t<ul>\n\\t\\t<li>Bhutan is predominantly Buddhist, and its cultural heritage revolves around Buddhist practices, monasteries, and festivals.</li>\n\\t\\t<li>The dragon symbol, \"Druk,\" is deeply intertwined with Bhutan's <strong>Dzongkha language</strong> and religious texts.</li>\n\\t</ul>\n\\t</li>\n\\t<li><strong>Economy:</strong>\n\\t<ul>\n\\t\\t<li>Bhutan's economy is largely dependent on <strong>agriculture, forestry, and hydropower exports.</strong></li>\n\\t\\t<li>Tourism is another significant contributor to Bhutan's economy, but it is regulated to preserve the country's cultural integrity.</li>\n\\t</ul>\n\\t</li>\n\\t<li><strong>Environmental Conservation:</strong>\n\\t<ul>\n\\t\\t<li>Bhutan is renowned for its commitment to sustainability and environmental conservation.</li>\n\\t\\t<li>It is the only carbon-negative country in the world, meaning it absorbs more carbon dioxide than it emits.</li>\n\\t</ul>\n\\t</li>\n</ul>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Important Points</u></span></strong></span></p>\n\n<ul>\n\\t<li><strong>Flag Symbolism:</strong>\n\n\\t<ul>\n\\t\\t<li>The dragon depicted on Bhutan's flag holds jewels in its claws, representing national wealth and security.</li>\n\\t\\t<li>The yellow and orange colors of the flag symbolize the secular and spiritual traditions of Bhutan.</li>\n\\t</ul>\n\\t</li>\n\\t<li><strong>Gross National Happiness (GNH):</strong>\n\\t<ul>\n\\t\\t<li>Bhutan follows the concept of <strong>Gross National Happiness</strong> instead of GDP to measure the country's progress and well-being.</li>\n\\t\\t<li>GNH emphasizes sustainable development, cultural preservation, environmental conservation, and good governance.</li>\n\\t</ul>\n\\t</li>\n\\t<li><strong>Tourism Policy:</strong>\n\\t<ul>\n\\t\\t<li>Bhutan practices a \"high-value, low-volume\" tourism policy to ensure the preservation of its natural and cultural heritage.</li>\n\\t\\t<li>Visitors are required to pay a daily fee, which includes accommodation, meals, and guides.</li>\n\\t</ul>\n\\t</li>\n</ul>", "marks": 2, "negMarks": 0.5}, {"text": "Which of these countries is known as the \"Land of the Thunder Dragon\"?", "options": ["Nepal", "Bhutan", "Sri Lanka", "Maldives"], "correct": 2, "solution": "<p>The correct answer is <u><strong>Bhutan</strong></u>.</p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p>\n\n<ul>\n\\t<li><strong>Bhutan</strong> is famously known as the <strong>\"Land of the Thunder Dragon\"</strong> due to its association with the mythical dragon, \"Druk,\" which appears on its national flag and symbolizes thunder.</li>\n\\t<li>The term \"Thunder Dragon\" originates from the local name for Bhutan, <strong>\"Druk Yul,\"</strong> which translates to \"Land of the Thunder Dragon.\"</li>\n\\t<li>The national flag of Bhutan features a dragon, which represents the country's identity and connection to its mythology. The dragon holds jewels, symbolizing protection and wealth.</li>\n\\t<li>Bhutan is a small, landlocked country situated in the eastern Himalayas, bordered by <strong>India</strong> to the south and <strong>China</strong> to the north.</li>\n\\t<li>Bhutan's culture is deeply rooted in <strong>Buddhist traditions</strong>, and the dragon plays a significant role in its religious beliefs and folklore.</li>\n</ul>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<ul>\n\\t<li><strong>Geographical Location:</strong>\n\n\\t<ul>\n\\t\\t<li>Bhutan is located in the eastern Himalayas and is known for its mountainous terrain, forests, and diverse ecosystems.</li>\n\\t\\t<li>The capital city of Bhutan is <strong>Thimphu</strong>, which serves as the political and cultural hub of the country.</li>\n\\t</ul>\n\\t</li>\n\\t<li><strong>Cultural and Religious Influence:</strong>\n\\t<ul>\n\\t\\t<li>Bhutan is predominantly Buddhist, and its cultural heritage revolves around Buddhist practices, monasteries, and festivals.</li>\n\\t\\t<li>The dragon symbol, \"Druk,\" is deeply intertwined with Bhutan's <strong>Dzongkha language</strong> and religious texts.</li>\n\\t</ul>\n\\t</li>\n\\t<li><strong>Economy:</strong>\n\\t<ul>\n\\t\\t<li>Bhutan's economy is largely dependent on <strong>agriculture, forestry, and hydropower exports.</strong></li>\n\\t\\t<li>Tourism is another significant contributor to Bhutan's economy, but it is regulated to preserve the country's cultural integrity.</li>\n\\t</ul>\n\\t</li>\n\\t<li><strong>Environmental Conservation:</strong>\n\\t<ul>\n\\t\\t<li>Bhutan is renowned for its commitment to sustainability and environmental conservation.</li>\n\\t\\t<li>It is the only carbon-negative country in the world, meaning it absorbs more carbon dioxide than it emits.</li>\n\\t</ul>\n\\t</li>\n</ul>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Important Points</u></span></strong></span></p>\n\n<ul>\n\\t<li><strong>Flag Symbolism:</strong>\n\n\\t<ul>\n\\t\\t<li>The dragon depicted on Bhutan's flag holds jewels in its claws, representing national wealth and security.</li>\n\\t\\t<li>The yellow and orange colors of the flag symbolize the secular and spiritual traditions of Bhutan.</li>\n\\t</ul>\n\\t</li>\n\\t<li><strong>Gross National Happiness (GNH):</strong>\n\\t<ul>\n\\t\\t<li>Bhutan follows the concept of <strong>Gross National Happiness</strong> instead of GDP to measure the country's progress and well-being.</li>\n\\t\\t<li>GNH emphasizes sustainable development, cultural preservation, environmental conservation, and good governance.</li>\n\\t</ul>\n\\t</li>\n\\t<li><strong>Tourism Policy:</strong>\n\\t<ul>\n\\t\\t<li>Bhutan practices a \"high-value, low-volume\" tourism policy to ensure the preservation of its natural and cultural heritage.</li>\n\\t\\t<li>Visitors are required to pay a daily fee, which includes accommodation, meals, and guides.</li>\n\\t</ul>\n\\t</li>\n</ul>", "marks": 2, "negMarks": 0.5}, {"text": "Which government scheme aims to provide financial support to senior citizens who may have lost their means of sustenance?", "options": ["Indira Gandhi National Old Age Pension Scheme (IGNOAPS)", "Atal Pension Yojana (APY)", "Pradhan Mantri Vaya Vandana Yojana (PMVVY)", "National Social Assistance Programme (NSAP)"], "correct": 1, "solution": "<p>The correct answer is <u><strong>Indira Gandhi National Old Age Pension Scheme (IGNOAPS)</strong></u>.</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p>\n<ul>\n<li>The <strong>Indira Gandhi National Old Age Pension Scheme (IGNOAPS)</strong> is a component of the <strong>National Social Assistance Programme (NSAP)</strong>, launched by the Government of India.</li>\n<li>It was introduced in <strong>1995</strong> and revised in <strong>2007</strong> under the Ministry of Rural Development.</li>\n<li>The scheme provides a <strong>monthly pension</strong> to senior citizens aged <strong>60 years and above</strong> who belong to families living <strong>below the poverty line (BPL)</strong>.</li>\n<li>The amount of pension varies depending on the beneficiary's age:\n<ul>\n<li><strong>60–79 years</strong>: ₹200 per month from the central government (states can top up).</li>\n<li><strong>80 years and above</strong>: ₹500 per month from the central government.</li>\n</ul>\n</li>\n<li>IGNOAPS aims to provide <strong>social security</strong> and ensure the financial well-being of economically weaker sections of senior citizens.</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n<ul>\n<li><strong>Atal Pension Yojana (APY):</strong>\n<ul>\n<li>Launched in <strong>2015</strong>, it is focused on providing a <strong>guaranteed monthly pension</strong> to workers in the <strong>unorganized sector</strong>.</li>\n<li>The entry age is <strong>18–40 years</strong>, and the pension amount ranges from ₹1,000 to ₹5,000, depending on contributions.</li>\n<li>It is co-contributory, with the government adding 50% of the contribution or ₹1,000 per year (whichever is lower) for eligible subscribers.</li>\n</ul>\n</li>\n<li><strong>Pradhan Mantri Vaya Vandana Yojana (PMVVY):</strong>\n<ul>\n<li>Implemented by the <strong>LIC of India</strong>, this scheme aims to provide <strong>pension security</strong> to senior citizens aged <strong>60 years and above</strong>.</li>\n<li>It guarantees a fixed interest rate of <strong>7.4% per annum</strong> for 10 years, payable monthly, quarterly, half-yearly, or yearly.</li>\n<li>The maximum purchase price under the scheme is ₹15 lakh.</li>\n</ul>\n</li>\n<li><strong>National Social Assistance Programme (NSAP):</strong>\n<ul>\n<li>Launched in <strong>1995</strong>, it is an umbrella scheme aimed at providing <strong>social security</strong> to the poor, including old age pension, widow pension, and disability pension.</li>\n<li>IGNOAPS is one of its key components, specifically targeted at senior citizens.</li>\n</ul>\n</li>\n<li><strong>Key Differences:</strong>\n<ul>\n<li><strong>IGNOAPS:</strong> Focuses on senior citizens in BPL families, providing small pensions.</li>\n<li><strong>APY:</strong> Caters to unorganized workers, offering a range of pensions based on contributions.</li>\n<li><strong>PMVVY:</strong> A fixed-income scheme for senior citizens with higher financial security.</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Important Points</u></span></strong></span></p>\n<ul>\n<li><strong>IGNOAPS Implementation:</strong>\n<ul>\n<li>The scheme is implemented through <strong>state governments and union territories</strong>.</li>\n<li>Each state can add additional funds to the pension amount to enhance benefits.</li>\n</ul>\n</li>\n<li><strong>Eligibility Verification:</strong>\n<ul>\n<li>BPL status is verified through the <strong>Socio-Economic Caste Census (SECC)</strong>.</li>\n<li>Beneficiaries need to provide proof of age and BPL status to avail of the benefits.</li>\n</ul>\n</li>\n<li><strong>Challenges:</strong>\n<ul>\n<li>Low pension amounts under IGNOAPS remain a concern for ensuring adequate financial support.</li>\n<li>Coverage gaps and beneficiary identification issues persist in certain regions.</li>\n</ul>\n</li>\n</ul>\n```75:T20ed,<p>सही उत्तर <u><strong>इंदिरा गांधी राष्ट्रीय वृद्धावस्था पेंशन योजना (IGNOAPS)</strong></u> है।</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>मुख्य बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>इंदिरा गांधी राष्ट्रीय वृद्धावस्था पेंशन योजना (IGNOAPS)</strong> भारत सरकार द्वारा शुरू किए गए <strong>राष्ट्रीय सामाजिक सहायता कार्यक्रम (NSAP)</strong> का एक घटक है।</li>\n<li>इसे <strong>1995</strong> में पेश किया गया था और <strong>2007</strong> में ग्रामीण विकास मंत्रालय के तहत संशोधित किया गया था।</li>\n<li>यह योजना <strong>60 वर्ष और उससे अधिक</strong> आयु के वरिष्ठ नागरिकों को <strong>मासिक पेंशन</strong> प्रदान करती है जो <strong>गरीबी रेखा से नीचे (बीपीएल)</strong> रहने वाले परिवारों से हैं।</li>\n<li>पेंशन की राशि लाभार्थी की आयु के आधार पर भिन्न होती है:\n<ul>\n<li><strong>60-79 वर्ष</strong>: केंद्र सरकार से ₹200 प्रति माह (राज्य टॉप अप कर सकते हैं)।</li>\n<li><strong>80 वर्ष और उससे अधिक</strong>: केंद्र सरकार से ₹500 प्रति माह।</li>\n</ul>\n</li>\n<li>IGNOAPS का उद्देश्य <strong>सामाजिक सुरक्षा</strong> प्रदान करना और वरिष्ठ नागरिकों के आर्थिक रूप से कमजोर वर्गों की वित्तीय भलाई सुनिश्चित करना है।</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>अतिरिक्त जानकारी</u></span></strong></span></p>\n<ul>\n<li><strong>अटल पेंशन योजना (APY):</strong>\n<ul>\n<li><strong>2015</strong> में शुरू की गई, यह <strong>असंगठित क्षेत्र</strong> के श्रमिकों को <strong>गारंटीकृत मासिक पेंशन</strong> प्रदान करने पर केंद्रित है।</li>\n<li>प्रवेश आयु <strong>18-40 वर्ष</strong> है, और पेंशन राशि योगदान के आधार पर ₹1,000 से ₹5,000 तक होती है।</li>\n<li>यह सह-अंशदायी है, जिसमें सरकार पात्र ग्राहकों के लिए योगदान का 50% या ₹1,000 प्रति वर्ष (जो भी कम हो) जोड़ती है।</li>\n</ul>\n</li>\n<li><strong>प्रधान मंत्री वय वंदना योजना (PMVVY):</strong>\n<ul>\n<li><strong>भारतीय जीवन बीमा निगम (LIC)</strong> द्वारा कार्यान्वित, इस योजना का उद्देश्य <strong>60 वर्ष और उससे अधिक</strong> आयु के वरिष्ठ नागरिकों को <strong>पेंशन सुरक्षा</strong> प्रदान करना है।</li>\n<li>यह 10 वर्षों के लिए <strong>7.4% प्रति वर्ष</strong> की निश्चित ब्याज दर की गारंटी देता है, जो मासिक, त्रैमासिक, अर्ध-वार्षिक या वार्षिक रूप से देय है।</li>\n<li>योजना के तहत अधिकतम खरीद मूल्य ₹15 लाख है।</li>\n</ul>\n</li>\n<li><strong>राष्ट्रीय सामाजिक सहायता कार्यक्रम (NSAP):</strong>\n<ul>\n<li><strong>1995</strong> में शुरू की गई, यह एक छत्र योजना है जिसका उद्देश्य गरीबों को <strong>सामाजिक सुरक्षा</strong> प्रदान करना है, जिसमें वृद्धावस्था पेंशन, विधवा पेंशन और विकलांगता पेंशन शामिल है।</li>\n<li>IGNOAPS इसके प्रमुख घटकों में से एक है, जो विशेष रूप से वरिष्ठ नागरिकों को लक्षित है।</li>\n</ul>\n</li>\n<li><strong>मुख्य अंतर:</strong>\n<ul>\n<li><strong>IGNOAPS:</strong> बीपीएल परिवारों में वरिष्ठ नागरिकों पर ध्यान केंद्रित करता है, छोटी पेंशन प्रदान करता है।</li>\n<li><strong>APY:</strong> असंगठित श्रमिकों को पूरा करता है, योगदान के आधार पर पेंशन की एक श्रृंखला प्रदान करता है।</li>\n<li><strong>PMVVY:</strong> उच्च वित्तीय सुरक्षा वाले वरिष्ठ नागरिकों के लिए एक निश्चित आय योजना।</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>महत्वपूर्ण बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>IGNOAPS कार्यान्वयन:</strong>\n<ul>\n<li>यह योजना <strong>राज्य सरकारों और केंद्र शासित प्रदेशों</strong> के माध्यम से कार्यान्वित की जाती है।</li>\n<li>प्रत्येक राज्य लाभों को बढ़ाने के लिए पेंशन राशि में अतिरिक्त धन जोड़ सकता है।</li>\n</ul>\n</li>\n<li><strong>पात्रता सत्यापन:</strong>\n<ul>\n<li>बीपीएल स्थिति का सत्यापन <strong>सामाजिक-आर्थिक जाति जनगणना (SECC)</strong> के माध्यम से किया जाता है।</li>\n<li>लाभार्थियों को लाभ प्राप्त करने के लिए आयु और बीपीएल स्थिति का प्रमाण देना होगा।</li>\n</ul>\n</li>\n<li><strong>चुनौतियां:</strong>\n<ul>\n<li>पर्याप्त वित्तीय सहायता सुनिश्चित करने के लिए IGNOAPS के तहत कम पेंशन राशि एक चिंता का विषय बनी हुई है।</li>\n<li>कुछ क्षेत्रों में कवरेज अंतराल और लाभार्थी पहचान के मुद्दे बने हुए हैं।</li>\n</ul>\n</li>\n</ul>", "marks": 2, "negMarks": 0.5}, {"text": "Which Mughal Emperor is known for popularising pietra dura, or stone inlay technique, and the double dome in Indian architecture?", "options": ["Babur", "Akbar", "Shah Jahan", "Aurangzeb"], "correct": 3, "solution": "<p>The correct answer is <u><strong>Shah Jahan</strong></u>.</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p>\n<ul>\n<li><strong>Shah Jahan</strong>, the fifth Mughal Emperor of India (reigned from <strong>1628 to 1658</strong>), is renowned for his patronage of architecture and his significant contributions to Indian art and culture.</li>\n<li>He is credited with popularizing the <strong>pietra dura</strong> technique, an intricate decorative art form where semi-precious stones are inlaid into marble or other stones to create floral designs, motifs, or images. This technique was extensively used in the construction of the <strong>Taj Mahal</strong>.</li>\n<li>Shah Jahan also introduced and perfected the concept of the <strong>double dome</strong> in Mughal architecture. The double dome not only added grandeur to structures but also improved their acoustics and provided better insulation.</li>\n<li>His architectural masterpieces include the <strong>Taj Mahal</strong> in Agra, the <strong>Jama Masjid</strong> in Delhi, and the <strong>Red Fort</strong> in Delhi, showcasing a blend of Persian, Indian, and Central Asian architectural styles.</li>\n<li>Shah Jahan's reign is often referred to as the <strong>Golden Age of Mughal Architecture</strong> due to the sheer magnificence and artistic advancement of the monuments built during his time.</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n<ul>\n<li><strong>Pietra Dura Technique:</strong>\n<ul>\n<li>The term <strong>pietra dura</strong> originates from the Italian language, meaning \"hard stone.\"</li>\n<li>It involves cutting and fitting stones like <strong>lapis lazuli, onyx, jasper, and jade</strong> into marble to create intricate patterns and designs.</li>\n<li>This technique was prominently used in the <strong>Taj Mahal</strong>, particularly on the cenotaphs and walls, adding to its elegance and artistic appeal.</li>\n</ul>\n</li>\n<li><strong>Double Dome Architecture:</strong>\n<ul>\n<li>A double dome consists of two layers: an inner dome visible from the interior and an outer dome visible from the exterior.</li>\n<li>This innovation allowed for greater height and grandeur without making the interiors disproportionately large.</li>\n<li>Examples of double domes include the <strong>Taj Mahal</strong> and the <strong>Humayun's Tomb</strong> (the latter being a precursor to Shah Jahan's works).</li>\n</ul>\n</li>\n<li><strong>Other Mughal Emperors:</strong>\n<ul>\n<li><strong>Babur:</strong> The founder of the Mughal Empire, Babur focused more on military conquests than architecture, though he did establish Mughal garden traditions.</li>\n<li><strong>Akbar:</strong> Known for his innovations in architecture, Akbar built the <strong>Fatehpur Sikri</strong> and promoted a blend of Indian and Persian styles, but he did not popularize pietra dura or double domes.</li>\n<li><strong>Aurangzeb:</strong> The last major Mughal emperor, Aurangzeb's reign was marked by austerity, and he did not focus much on architectural advancements.</li>\n</ul>\n</li>\n<li><strong>Significance of Shah Jahan's Contributions:</strong>\n<ul>\n<li>Shah Jahan's architectural marvels reflect the peak of Mughal art and aesthetics, blending Persian, Islamic, and Indian influences.</li>\n<li>His projects, especially the <strong>Taj Mahal</strong>, are globally recognized as symbols of love and artistic brilliance.</li>\n<li>The innovations like pietra dura and double domes had a lasting influence on Indian architecture and inspired future generations of artisans and builders.</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Important Points</u></span></strong></span></p>\n<ul>\n<li><strong>Taj Mahal:</strong>\n<ul>\n<li>Built between <strong>1632 and 1653</strong>, this mausoleum was constructed in memory of Shah Jahan's wife, <strong>Mumtaz Mahal</strong>.</li>\n<li>It is one of the <strong>Seven Wonders of the World</strong> and a UNESCO World Heritage Site.</li>\n<li>The Taj Mahal's pietra dura work and symmetrical design remain unparalleled in architectural history.</li>\n</ul>\n</li>\n<li><strong>Jama Masjid:</strong>\n<ul>\n<li>Located in Old Delhi, the <strong>Jama Masjid</strong> was built between 1650 and 1656 and is one of the largest mosques in India.</li>\n<li>The mosque showcases Shah Jahan's preference for red sandstone and marble in architectural designs.</li>\n</ul>\n</li>\n<li><strong>Red Fort:</strong>\n<ul>\n<li>The Red Fort, or <strong>Lal Qila</strong>, was constructed between 1638 and 1648 and served as the main residence of the Mughal emperors.</li>\n<li>It is an iconic symbol of Indian history and is where the Prime Minister hoists the national flag on <strong>Independence Day</strong> every year.</li>\n</ul>\n</li>\n</ul>73:T2a6d,<p>सही उत्तर <u><strong>शाहजहां</strong></u> है।</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>मुख्य बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>शाहजहां</strong>, भारत के पांचवें मुगल सम्राट (<strong>1628 से 1658</strong> तक शासन किया), वास्तुकला के संरक्षण और भारतीय कला और संस्कृति में उनके महत्वपूर्ण योगदान के लिए प्रसिद्ध हैं।</li>\n<li>उन्हें <strong>पिएट्रा ड्यूरा</strong> तकनीक को लोकप्रिय बनाने का श्रेय दिया जाता है, जो एक जटिल सजावटी कला रूप है जिसमें फूलों के डिजाइन, रूपांकनों या छवियों को बनाने के लिए अर्ध-कीमती पत्थरों को संगमरमर या अन्य पत्थरों में जड़ा जाता है। इस तकनीक का व्यापक रूप से <strong>ताजमहल</strong> के निर्माण में उपयोग किया गया था।</li>\n<li>शाहजहां ने मुगल वास्तुकला में <strong>दोहरे गुंबद</strong> की अवधारणा को भी पेश और परिष्कृत किया। दोहरे गुंबद ने न केवल संरचनाओं में भव्यता जोड़ी, बल्कि उनकी ध्वनिकी में भी सुधार किया और बेहतर इन्सुलेशन प्रदान किया।</li>\n<li>उनकी वास्तुशिल्प कृतियों में आगरा में <strong>ताजमहल</strong>, दिल्ली में <strong>जामा मस्जिद</strong> और दिल्ली में <strong>लाल किला</strong> शामिल हैं, जो फारसी, भारतीय और मध्य एशियाई वास्तुशिल्प शैलियों का मिश्रण प्रदर्शित करते हैं।</li>\n<li>शाहजहां के शासनकाल को अक्सर <strong>मुगल वास्तुकला का स्वर्ण युग</strong> कहा जाता है, क्योंकि उनके समय में निर्मित स्मारकों की भव्यता और कलात्मक उन्नति बहुत अधिक थी।</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>अतिरिक्त जानकारी</u></span></strong></span></p>\n<ul>\n<li><strong>पिएट्रा ड्यूरा तकनीक:</strong>\n<ul>\n<li><strong>पिएट्रा ड्यूरा</strong> शब्द इतालवी भाषा से लिया गया है, जिसका अर्थ है \"कठोर पत्थर।\"</li>\n<li>इसमें जटिल पैटर्न और डिज़ाइन बनाने के लिए <strong>लापीस लाजुली, गोमेद, जैस्पर और जेड</strong> जैसे पत्थरों को संगमरमर में काटना और फिट करना शामिल है।</li>\n<li>इस तकनीक का उपयोग <strong>ताजमहल</strong> में प्रमुखता से किया गया था, विशेष रूप से समाधियों और दीवारों पर, जिससे इसकी सुंदरता और कलात्मक अपील बढ़ गई।</li>\n</ul>\n</li>\n<li><strong>दोहरा गुंबद वास्तुकला:</strong>\n<ul>\n<li>एक दोहरे गुंबद में दो परतें होती हैं: एक आंतरिक गुंबद जो अंदर से दिखाई देता है और एक बाहरी गुंबद जो बाहर से दिखाई देता है।</li>\n<li>इस नवाचार ने अंदरूनी हिस्सों को असमान रूप से बड़ा किए बिना अधिक ऊंचाई और भव्यता की अनुमति दी।</li>\n<li>दोहरे गुंबदों के उदाहरणों में <strong>ताजमहल</strong> और <strong>हुमायूं का मकबरा</strong> शामिल हैं (बाद वाला शाहजहां के कार्यों का अग्रदूत है)।</li>\n</ul>\n</li>\n<li><strong>अन्य मुगल सम्राट:</strong>\n<ul>\n<li><strong>बाबर:</strong> मुगल साम्राज्य के संस्थापक, बाबर ने वास्तुकला की तुलना में सैन्य विजय पर अधिक ध्यान केंद्रित किया, हालांकि उन्होंने मुगल उद्यान परंपराओं की स्थापना की।</li>\n<li><strong>अकबर:</strong> वास्तुकला में अपने नवाचारों के लिए जाने जाने वाले अकबर ने <strong>फतेहपुर सीकरी</strong> का निर्माण किया और भारतीय और फारसी शैलियों के मिश्रण को बढ़ावा दिया, लेकिन उन्होंने पिएट्रा ड्यूरा या दोहरे गुंबदों को लोकप्रिय नहीं बनाया।</li>\n<li><strong>औरंगजेब:</strong> अंतिम प्रमुख मुगल सम्राट, औरंगजेब का शासनकाल तपस्या से चिह्नित था, और उन्होंने वास्तुशिल्प प्रगति पर अधिक ध्यान नहीं दिया।</li>\n</ul>\n</li>\n<li><strong>शाहजहां के योगदान का महत्व:</strong>\n<ul>\n<li>शाहजहां की वास्तुशिल्प चमत्कार फारसी, इस्लामी और भारतीय प्रभावों के मिश्रण से मुगल कला और सौंदर्यशास्त्र के चरम को दर्शाते हैं।</li>\n<li>उनकी परियोजनाएं, विशेष रूप से <strong>ताजमहल</strong>, विश्व स्तर पर प्रेम और कलात्मक प्रतिभा के प्रतीक के रूप में पहचानी जाती हैं।</li>\n<li>पिएट्रा ड्यूरा और दोहरे गुंबदों जैसे नवाचारों का भारतीय वास्तुकला पर स्थायी प्रभाव पड़ा और उन्होंने कारीगरों और बिल्डरों की भावी पीढ़ियों को प्रेरित किया।</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>महत्वपूर्ण बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>ताजमहल:</strong>\n<ul>\n<li><strong>1632 और 1653</strong> के बीच निर्मित, यह मकबरा शाहजहां की पत्नी, <strong>मुमताज महल</strong> की याद में बनाया गया था।</li>\n<li>यह <strong>दुनिया के सात अजूबों</strong> में से एक है और यूनेस्को की विश्व धरोहर स्थल है।</li>\n<li>ताजमहल का पिएट्रा ड्यूरा काम और सममित डिजाइन वास्तुशिल्प इतिहास में अद्वितीय हैं।</li>\n</ul>\n</li>\n<li><strong>जामा मस्जिद:</strong>\n<ul>\n<li>पुरानी दिल्ली में स्थित, <strong>जामा मस्जिद</strong> का निर्माण 1650 और 1656 के बीच किया गया था और यह भारत की सबसे बड़ी मस्जिदों में से एक है।</li>\n<li>मस्जिद वास्तुशिल्प डिजाइनों में लाल बलुआ पत्थर और संगमरमर के लिए शाहजहां की पसंद को दर्शाती है।</li>\n</ul>\n</li>\n<li><strong>लाल किला:</strong>\n<ul>\n<li>लाल किला, या <strong>लाल किला</strong>, का निर्माण 1638 और 1648 के बीच किया गया था और यह मुगल सम्राटों के मुख्य निवास के रूप में कार्य करता था।</li>\n<li>यह भारतीय इतिहास का एक प्रतिष्ठित प्रतीक है और यहीं पर प्रधान मंत्री हर साल <strong>स्वतंत्रता दिवस</strong> पर राष्ट्रीय ध्वज फहराते हैं।</li>\n</ul>\n</li>\n</ul>74:T11e0,<p>The correct answer is <u><strong>Indira Gandhi National Old Age Pension Scheme (IGNOAPS)</strong></u>.</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p>\n<ul>\n<li>The <strong>Indira Gandhi National Old Age Pension Scheme (IGNOAPS)</strong> is a component of the <strong>National Social Assistance Programme (NSAP)</strong>, launched by the Government of India.</li>\n<li>It was introduced in <strong>1995</strong> and revised in <strong>2007</strong> under the Ministry of Rural Development.</li>\n<li>The scheme provides a <strong>monthly pension</strong> to senior citizens aged <strong>60 years and above</strong> who belong to families living <strong>below the poverty line (BPL)</strong>.</li>\n<li>The amount of pension varies depending on the beneficiary's age:\n<ul>\n<li><strong>60–79 years</strong>: ₹200 per month from the central government (states can top up).</li>\n<li><strong>80 years and above</strong>: ₹500 per month from the central government.</li>\n</ul>\n</li>\n<li>IGNOAPS aims to provide <strong>social security</strong> and ensure the financial well-being of economically weaker sections of senior citizens.</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n<ul>\n<li><strong>Atal Pension Yojana (APY):</strong>\n<ul>\n<li>Launched in <strong>2015</strong>, it is focused on providing a <strong>guaranteed monthly pension</strong> to workers in the <strong>unorganized sector</strong>.</li>\n<li>The entry age is <strong>18–40 years</strong>, and the pension amount ranges from ₹1,000 to ₹5,000, depending on contributions.</li>\n<li>It is co-contributory, with the government adding 50% of the contribution or ₹1,000 per year (whichever is lower) for eligible subscribers.</li>\n</ul>\n</li>\n<li><strong>Pradhan Mantri Vaya Vandana Yojana (PMVVY):</strong>\n<ul>\n<li>Implemented by the <strong>LIC of India</strong>, this scheme aims to provide <strong>pension security</strong> to senior citizens aged <strong>60 years and above</strong>.</li>\n<li>It guarantees a fixed interest rate of <strong>7.4% per annum</strong> for 10 years, payable monthly, quarterly, half-yearly, or yearly.</li>\n<li>The maximum purchase price under the scheme is ₹15 lakh.</li>\n</ul>\n</li>\n<li><strong>National Social Assistance Programme (NSAP):</strong>\n<ul>\n<li>Launched in <strong>1995</strong>, it is an umbrella scheme aimed at providing <strong>social security</strong> to the poor, including old age pension, widow pension, and disability pension.</li>\n<li>IGNOAPS is one of its key components, specifically targeted at senior citizens.</li>\n</ul>\n</li>\n<li><strong>Key Differences:</strong>\n<ul>\n<li><strong>IGNOAPS:</strong> Focuses on senior citizens in BPL families, providing small pensions.</li>\n<li><strong>APY:</strong> Caters to unorganized workers, offering a range of pensions based on contributions.</li>\n<li><strong>PMVVY:</strong> A fixed-income scheme for senior citizens with higher financial security.</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Important Points</u></span></strong></span></p>\n<ul>\n<li><strong>IGNOAPS Implementation:</strong>\n<ul>\n<li>The scheme is implemented through <strong>state governments and union territories</strong>.</li>\n<li>Each state can add additional funds to the pension amount to enhance benefits.</li>\n</ul>\n</li>\n<li><strong>Eligibility Verification:</strong>\n<ul>\n<li>BPL status is verified through the <strong>Socio-Economic Caste Census (SECC)</strong>.</li>\n<li>Beneficiaries need to provide proof of age and BPL status to avail of the benefits.</li>\n</ul>\n</li>\n<li><strong>Challenges:</strong>\n<ul>\n<li>Low pension amounts under IGNOAPS remain a concern for ensuring adequate financial support.</li>\n<li>Coverage gaps and beneficiary identification issues persist in certain regions.</li>\n</ul>\n</li>\n</ul>\n```75:T20ed,<p>सही उत्तर <u><strong>इंदिरा गांधी राष्ट्रीय वृद्धावस्था पेंशन योजना (IGNOAPS)</strong></u> है।</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>मुख्य बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>इंदिरा गांधी राष्ट्रीय वृद्धावस्था पेंशन योजना (IGNOAPS)</strong> भारत सरकार द्वारा शुरू किए गए <strong>राष्ट्रीय सामाजिक सहायता कार्यक्रम (NSAP)</strong> का एक घटक है।</li>\n<li>इसे <strong>1995</strong> में पेश किया गया था और <strong>2007</strong> में ग्रामीण विकास मंत्रालय के तहत संशोधित किया गया था।</li>\n<li>यह योजना <strong>60 वर्ष और उससे अधिक</strong> आयु के वरिष्ठ नागरिकों को <strong>मासिक पेंशन</strong> प्रदान करती है जो <strong>गरीबी रेखा से नीचे (बीपीएल)</strong> रहने वाले परिवारों से हैं।</li>\n<li>पेंशन की राशि लाभार्थी की आयु के आधार पर भिन्न होती है:\n<ul>\n<li><strong>60-79 वर्ष</strong>: केंद्र सरकार से ₹200 प्रति माह (राज्य टॉप अप कर सकते हैं)।</li>\n<li><strong>80 वर्ष और उससे अधिक</strong>: केंद्र सरकार से ₹500 प्रति माह।</li>\n</ul>\n</li>\n<li>IGNOAPS का उद्देश्य <strong>सामाजिक सुरक्षा</strong> प्रदान करना और वरिष्ठ नागरिकों के आर्थिक रूप से कमजोर वर्गों की वित्तीय भलाई सुनिश्चित करना है।</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>अतिरिक्त जानकारी</u></span></strong></span></p>\n<ul>\n<li><strong>अटल पेंशन योजना (APY):</strong>\n<ul>\n<li><strong>2015</strong> में शुरू की गई, यह <strong>असंगठित क्षेत्र</strong> के श्रमिकों को <strong>गारंटीकृत मासिक पेंशन</strong> प्रदान करने पर केंद्रित है।</li>\n<li>प्रवेश आयु <strong>18-40 वर्ष</strong> है, और पेंशन राशि योगदान के आधार पर ₹1,000 से ₹5,000 तक होती है।</li>\n<li>यह सह-अंशदायी है, जिसमें सरकार पात्र ग्राहकों के लिए योगदान का 50% या ₹1,000 प्रति वर्ष (जो भी कम हो) जोड़ती है।</li>\n</ul>\n</li>\n<li><strong>प्रधान मंत्री वय वंदना योजना (PMVVY):</strong>\n<ul>\n<li><strong>भारतीय जीवन बीमा निगम (LIC)</strong> द्वारा कार्यान्वित, इस योजना का उद्देश्य <strong>60 वर्ष और उससे अधिक</strong> आयु के वरिष्ठ नागरिकों को <strong>पेंशन सुरक्षा</strong> प्रदान करना है।</li>\n<li>यह 10 वर्षों के लिए <strong>7.4% प्रति वर्ष</strong> की निश्चित ब्याज दर की गारंटी देता है, जो मासिक, त्रैमासिक, अर्ध-वार्षिक या वार्षिक रूप से देय है।</li>\n<li>योजना के तहत अधिकतम खरीद मूल्य ₹15 लाख है।</li>\n</ul>\n</li>\n<li><strong>राष्ट्रीय सामाजिक सहायता कार्यक्रम (NSAP):</strong>\n<ul>\n<li><strong>1995</strong> में शुरू की गई, यह एक छत्र योजना है जिसका उद्देश्य गरीबों को <strong>सामाजिक सुरक्षा</strong> प्रदान करना है, जिसमें वृद्धावस्था पेंशन, विधवा पेंशन और विकलांगता पेंशन शामिल है।</li>\n<li>IGNOAPS इसके प्रमुख घटकों में से एक है, जो विशेष रूप से वरिष्ठ नागरिकों को लक्षित है।</li>\n</ul>\n</li>\n<li><strong>मुख्य अंतर:</strong>\n<ul>\n<li><strong>IGNOAPS:</strong> बीपीएल परिवारों में वरिष्ठ नागरिकों पर ध्यान केंद्रित करता है, छोटी पेंशन प्रदान करता है।</li>\n<li><strong>APY:</strong> असंगठित श्रमिकों को पूरा करता है, योगदान के आधार पर पेंशन की एक श्रृंखला प्रदान करता है।</li>\n<li><strong>PMVVY:</strong> उच्च वित्तीय सुरक्षा वाले वरिष्ठ नागरिकों के लिए एक निश्चित आय योजना।</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>महत्वपूर्ण बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>IGNOAPS कार्यान्वयन:</strong>\n<ul>\n<li>यह योजना <strong>राज्य सरकारों और केंद्र शासित प्रदेशों</strong> के माध्यम से कार्यान्वित की जाती है।</li>\n<li>प्रत्येक राज्य लाभों को बढ़ाने के लिए पेंशन राशि में अतिरिक्त धन जोड़ सकता है।</li>\n</ul>\n</li>\n<li><strong>पात्रता सत्यापन:</strong>\n<ul>\n<li>बीपीएल स्थिति का सत्यापन <strong>सामाजिक-आर्थिक जाति जनगणना (SECC)</strong> के माध्यम से किया जाता है।</li>\n<li>लाभार्थियों को लाभ प्राप्त करने के लिए आयु और बीपीएल स्थिति का प्रमाण देना होगा।</li>\n</ul>\n</li>\n<li><strong>चुनौतियां:</strong>\n<ul>\n<li>पर्याप्त वित्तीय सहायता सुनिश्चित करने के लिए IGNOAPS के तहत कम पेंशन राशि एक चिंता का विषय बनी हुई है।</li>\n<li>कुछ क्षेत्रों में कवरेज अंतराल और लाभार्थी पहचान के मुद्दे बने हुए हैं।</li>\n</ul>\n</li>\n</ul>", "marks": 2, "negMarks": 0.5}, {"text": "What technological advancement is explicitly incorporated in the Bharatiya Nagarik Suraksha Sanhita, 2023 for faster justice delivery?", "options": ["Use of blockchain in contracts", "Electronic recording of witness testimony", "Live broadcast of trials", "Use of drones for crime scene inspection"], "correct": 2, "solution": "<p>The correct answer is <u><strong>Electronic recording of witness testimony</strong></u>.</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p>\n<ul>\n<li>The <strong>Bharatiya Nagarik Suraksha Sanhita, 2023</strong> introduces modern technological advancements to streamline judicial processes and ensure faster delivery of justice.</li>\n<li>The incorporation of <strong>electronic recording of witness testimony</strong> is a critical feature aimed at reducing delays caused by manual procedures and ensuring accurate documentation of testimonies.</li>\n<li><strong>Electronic recording</strong> minimizes the possibility of tampering, loss, or misinterpretation of witness statements, thereby enhancing the transparency and reliability of judicial proceedings.</li>\n<li>The use of technology ensures that the testimony remains accessible for future reference and provides a standardized method of recording across courts.</li>\n<li>This advancement aligns with the government’s vision to digitize and modernize the judicial infrastructure under initiatives like <strong>Digital India</strong>.</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n<ul>\n<li><strong>Importance of Witness Testimony:</strong>\n<ul>\n<li>Witness testimony serves as a crucial component of judicial trials, often being the deciding factor in criminal and civil cases.</li>\n<li>Ensuring the accuracy and security of witness statements is vital for maintaining the integrity of the judicial process.</li>\n</ul>\n</li>\n<li><strong>Benefits of Electronic Recording:</strong>\n<ul>\n<li>Improves efficiency by eliminating manual transcription processes.</li>\n<li>Reduces the scope for human error during documentation.</li>\n<li>Enables secure storage and retrieval of recorded testimonies for future proceedings.</li>\n</ul>\n</li>\n<li><strong>Global Practices:</strong>\n<ul>\n<li>Countries like the <strong>United States</strong> and <strong>United Kingdom</strong> have adopted electronic recording systems in courts to facilitate faster and more accurate documentation of proceedings.</li>\n<li>Such practices are considered benchmarks for judicial reforms worldwide.</li>\n</ul>\n</li>\n<li><strong>Challenges in Implementation:</strong>\n<ul>\n<li>Initial infrastructure costs for setting up electronic recording systems in courts.</li>\n<li>Training judicial staff and ensuring their adaptability to new technologies.</li>\n<li>Addressing concerns related to data privacy and cybersecurity.</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Important Points</u></span></strong></span></p>\n<ul>\n<li><strong>Bharatiya Nagarik Suraksha Sanhita, 2023:</strong>\n<ul>\n<li>Aimed at reforming India’s judicial and law enforcement systems to make them more effective and citizen-centric.</li>\n<li>Emphasizes the use of technology to address long-pending issues such as delayed trials and outdated procedures.</li>\n</ul>\n</li>\n<li><strong>Digital India Initiative:</strong>\n<ul>\n<li>Launched in <strong>2015</strong> by the Government of India, this initiative focuses on digitizing all aspects of governance.</li>\n<li>The judicial reforms under this initiative aim to modernize courtrooms and enhance public access to judicial services.</li>\n</ul>\n</li>\n<li><strong>Other Technological Advancements:</strong>\n<ul>\n<li>Use of <strong>video conferencing</strong> for remote hearings, reducing the need for physical presence in courts.</li>\n<li>Development of <strong>e-Courts</strong> to digitize case filings and streamline judicial processes.</li>\n<li>Implementation of <strong>Artificial Intelligence (AI)</strong> for legal research and case analysis.</li>\n</ul>\n</li>\n</ul>79:T2338,<p>सही उत्तर <u><strong>गवाह की गवाही की इलेक्ट्रॉनिक रिकॉर्डिंग</strong></u> है।</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>मुख्य बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>भारतीय नागरिक सुरक्षा संहिता, 2023</strong> न्यायिक प्रक्रियाओं को सुव्यवस्थित करने और न्याय की तेजी से डिलीवरी सुनिश्चित करने के लिए आधुनिक तकनीकी प्रगति का परिचय कराती है।</li>\n<li><strong>गवाह की गवाही की इलेक्ट्रॉनिक रिकॉर्डिंग</strong> का समावेश एक महत्वपूर्ण विशेषता है जिसका उद्देश्य मैनुअल प्रक्रियाओं के कारण होने वाली देरी को कम करना और गवाही का सटीक दस्तावेजीकरण सुनिश्चित करना है।</li>\n<li><strong>इलेक्ट्रॉनिक रिकॉर्डिंग</strong> गवाह के बयानों के साथ छेड़छाड़, हानि या गलत व्याख्या की संभावना को कम करती है, जिससे न्यायिक कार्यवाही की पारदर्शिता और विश्वसनीयता बढ़ती है।</li>\n<li>प्रौद्योगिकी का उपयोग यह सुनिश्चित करता है कि गवाही भविष्य के संदर्भ के लिए सुलभ रहे और अदालतों में रिकॉर्डिंग की एक मानकीकृत विधि प्रदान करे।</li>\n<li>यह उन्नति <strong>डिजिटल इंडिया</strong> जैसी पहलों के तहत न्यायिक बुनियादी ढांचे को डिजिटाइज़ और आधुनिक बनाने के सरकार के दृष्टिकोण के अनुरूप है।</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>अतिरिक्त जानकारी</u></span></strong></span></p>\n<ul>\n<li><strong>गवाह की गवाही का महत्व:</strong>\n<ul>\n<li>गवाह की गवाही न्यायिक परीक्षणों के एक महत्वपूर्ण घटक के रूप में कार्य करती है, जो अक्सर आपराधिक और दीवानी मामलों में निर्णायक कारक होती है।</li>\n<li>न्यायिक प्रक्रिया की अखंडता को बनाए रखने के लिए गवाह के बयानों की सटीकता और सुरक्षा सुनिश्चित करना महत्वपूर्ण है।</li>\n</ul>\n</li>\n<li><strong>इलेक्ट्रॉनिक रिकॉर्डिंग के लाभ:</strong>\n<ul>\n<li>मैनुअल ट्रांसक्रिप्शन प्रक्रियाओं को समाप्त करके दक्षता में सुधार करता है।</li>\n<li>दस्तावेजीकरण के दौरान मानवीय त्रुटि की गुंजाइश को कम करता है।</li>\n<li>भविष्य की कार्यवाही के लिए रिकॉर्ड की गई गवाही के सुरक्षित भंडारण और पुनर्प्राप्ति को सक्षम बनाता है।</li>\n</ul>\n</li>\n<li><strong>वैश्विक प्रथाएं:</strong>\n<ul>\n<li><strong>संयुक्त राज्य अमेरिका</strong> और <strong>यूनाइटेड किंगडम</strong> जैसे देशों ने कार्यवाही के तेजी से और अधिक सटीक दस्तावेजीकरण की सुविधा के लिए अदालतों में इलेक्ट्रॉनिक रिकॉर्डिंग सिस्टम अपनाया है।</li>\n<li>ऐसी प्रथाओं को दुनिया भर में न्यायिक सुधारों के लिए बेंचमार्क माना जाता है।</li>\n</ul>\n</li>\n<li><strong>कार्यान्वयन में चुनौतियां:</strong>\n<ul>\n<li>अदालतों में इलेक्ट्रॉनिक रिकॉर्डिंग सिस्टम स्थापित करने के लिए प्रारंभिक बुनियादी ढांचा लागत।</li>\n<li>न्यायिक कर्मचारियों को प्रशिक्षित करना और नई तकनीकों के प्रति उनकी अनुकूलन क्षमता सुनिश्चित करना।</li>\n<li>डेटा गोपनीयता और साइबर सुरक्षा से संबंधित चिंताओं का समाधान करना।</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>महत्वपूर्ण बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>भारतीय नागरिक सुरक्षा संहिता, 2023:</strong>\n<ul>\n<li>भारत की न्यायिक और कानून प्रवर्तन प्रणालियों को अधिक प्रभावी और नागरिक-केंद्रित बनाने के उद्देश्य से।</li>\n<li>विलंबित परीक्षणों और पुरानी प्रक्रियाओं जैसे लंबे समय से लंबित मुद्दों को संबोधित करने के लिए प्रौद्योगिकी के उपयोग पर जोर देता है।</li>\n</ul>\n</li>\n<li><strong>डिजिटल इंडिया पहल:</strong>\n<ul>\n<li>भारत सरकार द्वारा <strong>2015</strong> में शुरू की गई, यह पहल शासन के सभी पहलुओं को डिजिटाइज़ करने पर केंद्रित है।</li>\n<li>इस पहल के तहत न्यायिक सुधारों का उद्देश्य कोर्टरूम को आधुनिक बनाना और न्यायिक सेवाओं तक सार्वजनिक पहुंच को बढ़ाना है।</li>\n</ul>\n</li>\n<li><strong>अन्य तकनीकी प्रगति:</strong>\n<ul>\n<li>अदालतों में शारीरिक उपस्थिति की आवश्यकता को कम करते हुए, दूरस्थ सुनवाई के लिए <strong>वीडियो कॉन्फ्रेंसिंग</strong> का उपयोग।</li>\n<li>मामलों को दर्ज करने और न्यायिक प्रक्रियाओं को सुव्यवस्थित करने के लिए <strong>ई-कोर्ट</strong> का विकास।</li>\n<li>कानूनी अनुसंधान और मामले के विश्लेषण के लिए <strong>कृत्रिम बुद्धिमत्ता (एआई)</strong> का कार्यान्वयन।</li>\n</ul>\n</li>\n</ul>7a:T11b2,<p>The correct answer is <u><strong>Odisha</strong></u>.</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p>\n<ul>\n<li><strong>Talcher</strong> is a major industrial hub located in the Angul district of the state of <strong>Odisha</strong>, India.</li>\n<li>The <strong>Talcher Thermal Power Station</strong> is a significant coal-based power plant that contributes substantially to the power generation capacity of India.</li>\n<li>This power station is owned and operated by <strong>NTPC Limited</strong> (National Thermal Power Corporation Limited), one of India's largest energy conglomerates.</li>\n<li>Talcher is often referred to as the <strong>\"Coal City of Odisha\"</strong> due to its rich coal reserves and extensive mining activities. It is part of the Mahanadi Coalfields Limited (MCL) region.</li>\n<li>Odisha is one of the top coal-producing states in India, and Talcher plays a pivotal role in this sector by contributing significantly to the state's and the nation's energy requirements.</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n<ul>\n<li><strong>Talcher's Industrial Significance:</strong>\n<ul>\n<li>Talcher hosts a variety of industries, including coal mining, power generation, and fertilizer production, making it an industrially rich region.</li>\n<li>The <strong>Talcher Super Thermal Power Station</strong>, also located in this region, has a power generation capacity of over 3,000 MW, making it one of the largest power plants in India.</li>\n</ul>\n</li>\n<li><strong>Coal Mining in Talcher:</strong>\n<ul>\n<li>Talcher is part of the <strong>Mahanadi Coalfields Limited (MCL)</strong>, a subsidiary of Coal India Limited (CIL), which is responsible for coal mining operations in the area.</li>\n<li>The coal mined here is primarily used for power generation and industrial purposes, catering to both domestic and industrial consumers across the country.</li>\n</ul>\n</li>\n<li><strong>Location and Connectivity:</strong>\n<ul>\n<li>Talcher is well-connected by rail and road to major cities in Odisha and neighboring states, facilitating the transport of coal and other industrial goods.</li>\n<li>The nearest airport to Talcher is the <strong>Biju Patnaik International Airport</strong> in Bhubaneswar, located approximately 140 km away.</li>\n</ul>\n</li>\n<li><strong>Power Generation in Odisha:</strong>\n<ul>\n<li>Odisha is a key contributor to India's energy sector, with several thermal, hydro, and renewable energy projects spread across the state.</li>\n<li>The state's energy production not only fulfills its own needs but also supplies electricity to other parts of India.</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/4f750a2730aad0987b5e719f277ddc90129c657928205c4d3b5aa23049023fa5.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Important Points</u></span></strong></span></p>\n<ul>\n<li><strong>NTPC Limited:</strong>\n<ul>\n<li>NTPC Limited, previously known as National Thermal Power Corporation, is a <strong>central public sector undertaking</strong> under the Ministry of Power, Government of India.</li>\n<li>It is India's largest power utility and contributes significantly to the country's electricity production.</li>\n</ul>\n</li>\n<li><strong>Mahanadi Coalfields Limited (MCL):</strong>\n<ul>\n<li>MCL is one of the major subsidiaries of <strong>Coal India Limited (CIL)</strong> and plays a crucial role in coal extraction in Odisha.</li>\n<li>The coalfields in and around Talcher are some of the most productive in the country.</li>\n</ul>\n</li>\n<li><strong>Odisha's Energy Sector:</strong>\n<ul>\n<li>Odisha is among the leading states in India in terms of installed power generation capacity, with a mix of thermal, hydro, and renewable energy projects.</li>\n<li>The state's rich natural resources, including coal, bauxite, and iron ore, contribute to its industrial and energy production capabilities.</li>\n</ul>\n</li>\n</ul>\n```7b:T230c,<p>सही उत्तर <u><strong>ओडिशा</strong></u> है।</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>मुख्य बिंदु</u></span></strong></span></p>\n<ul>\n<li><strong>तालचेर</strong> ओडिशा राज्य के अंगुल जिले में स्थित एक प्रमुख औद्योगिक केंद्र है।</li>\n<li><strong>तालचेर थर्मल पावर स्टेशन</strong> एक महत्वपूर्ण कोयला आधारित बिजली संयंत्र है जो भारत की बिजली उत्पादन क्षमता में काफी योगदान देता है।</li>\n<li>यह बिजली स्टेशन <strong>एनटीपीसी लिमिटेड</strong> (नेशनल थर्मल पावर कॉरपोरेशन लिमिटेड) के स्वामित्व और संचालन में है, जो भारत के सबसे बड़े ऊर्जा समूह में से एक है।</li>\n<li>तालचेर को अक्सर अपने समृद्ध कोयला भंडार और व्यापक खनन गतिविधियों के कारण <strong>\"ओडिशा का कोयला शहर\"</strong> कहा जाता है। यह महानदी कोलफील्ड्स लिमिटेड (MCL) क्षेत्र का हिस्सा है।</li>\n<li>ओडिशा भारत में शीर्ष कोयला उत्पादक राज्यो
