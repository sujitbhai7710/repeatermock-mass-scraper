th=\"2\" width=\"120\" x=\"70\" y=\"40\"></rect> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\" x=\"130\" y=\"65\">Partner A</text> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"13\" text-anchor=\"middle\" x=\"130\" y=\"85\">Inv: Rs. 60,000</text> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"13\" text-anchor=\"middle\" x=\"130\" y=\"105\">Time: 12 months</text> <text fill=\"#cc5500\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\" x=\"130\" y=\"125\">Ratio = 3</text> <rect fill=\"#fff0cc\" height=\"90\" stroke=\"#cc5500\" stroke-width=\"2\" width=\"120\" x=\"230\" y=\"50\"></rect> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\" x=\"290\" y=\"73\">Partner B</text> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"13\" text-anchor=\"middle\" x=\"290\" y=\"93\">Inv: Rs. 40,000</text> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"13\" text-anchor=\"middle\" x=\"290\" y=\"113\">Time: 12 months</text> <text fill=\"#cc5500\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\" x=\"290\" y=\"133\">Ratio = 2</text> <line stroke=\"#888888\" stroke-dasharray=\"5,3\" stroke-width=\"1.5\" x1=\"30\" x2=\"390\" y1=\"160\" y2=\"160\"></line> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\" x=\"210\" y=\"182\">Remaining Profit for Distribution = Rs. 90,000</text> </svg>\n\n<p><strong>Formula Used:</strong></p>\n\n<p>Profit Ratio = (Capital of A × Time of A) : (Capital of B × Time of B)</p>\n\n<p><strong>Calculations:</strong></p>\n\n<p>⇒ Profit Ratio (A : B) = (60000 × 12) : (40000 × 12)</p>\n\n<p>⇒ Profit Ratio (A : B) = 60000 : 40000</p>\n\n<p>⇒ Profit Ratio (A : B) = 3 : 2</p>\n\n<p>⇒ Total ratio parts = 3 + 2 = 5</p>\n\n<p>⇒ B's share of the remaining profit = (2 ÷ 5) × Total Remaining Profit</p>\n\n<p>⇒ B's share = (2 ÷ 5) × 90,000</p>\n\n<p>⇒ B's share = 2 × 18,000 = Rs. 36,000</p>\n\n<p><strong>∴ The correct answer is Rs. 36,000.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Profit Sharing Ratio</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">Profit is divided among partners in the ratio of the product of their Capital and Time period. (Profit Ratio = C<sub>1</sub>×T<sub>1</sub> : C<sub>2</sub>×T<sub>2</sub>).</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Working Partner</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">A partner who manages the business is called an active or working partner. They generally receive a fixed salary or a certain percentage of the overall profit before the remaining profit is distributed.</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Sleeping Partner</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">A partner who only invests capital and does not take part in managing the business is called a sleeping partner. They only receive a share of the remaining profit proportional to their investment.</p>\n\n<p> </p>", "marks": 2, "negMarks": 0.5}, {"text": "A triangular field with base 40 m and height 30 m shares a side with a rectangle of length 40 m and breadth 25 m. Find the combined area and percentage of the triangle's area in the total.", "options": ["1, 450 m² and 24.5%", "2, 450 m² and 25.5%", "1, 600 m² and 37.5%", "2, 500 m² and 25%"], "correct": 3, "solution": "<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png\" width=\"26px\" /> <u style=\"font-size: 21px; font-weight: 700; display: inline !important;\">Shortcut Trick</u></span></p>\n\n<p>Area of triangle = 1/2 × Base × Height = 1/2 × 40 × 30 = 600 m<sup>2</sup>.</p>\n\n<p>Area of rectangle = Length × Breadth = 40 × 25 = 1000 m<sup>2</sup>.</p>\n\n<p>Combined Area = 600 + 1000 = 1600 m<sup>2</sup>.</p>\n\n<p>Percentage = (600 ÷ 1600) × 100 = (3 ÷ 8) × 100 = 37.5%.</p>\n\n<p><strong>∴ The correct answer is 1600 m<sup>2</sup> and 37.5%.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Alternate Method</u></span></strong></span></p>\n\n<p><strong>Given:</strong></p>\n\n<p>Base of the triangle = 40 m</p>\n\n<p>Height of the triangle = 30 m</p>\n\n<p>Length of the rectangle = 40 m</p>\n\n<p>Breadth of the rectangle = 25 m</p>\n\n<p><strong>Formulas Used:</strong></p>\n\n<p>Area of a Triangle = 1/2 × Base × Height</p>\n\n<p>Area of a Rectangle = Length × Breadth</p>\n\n<p>Percentage = (Part Value ÷ Total Value) × 100</p>\n<svg height=\"260\" style=\"display:block;margin:12px 0;background:#ffffff;border-radius:10px;border:1px solid #cccccc;\" viewbox=\"0 0 420 260\" width=\"420\" xmlns=\"http://www.w3.org/2000/svg\"> <polygon fill=\"#ddeeff\" points=\"130,140 290,140 210,20\" stroke=\"#2255cc\" stroke-width=\"2\"></polygon> <rect fill=\"#fff0cc\" height=\"100\" stroke=\"#cc5500\" stroke-width=\"2\" width=\"160\" x=\"130\" y=\"140\"></rect> <line stroke=\"#888888\" stroke-dasharray=\"5,3\" stroke-width=\"1.5\" x1=\"210\" x2=\"210\" y1=\"20\" y2=\"140\"></line> <rect fill=\"none\" height=\"5\" stroke=\"#888888\" stroke-width=\"1\" width=\"5\" x=\"205\" y=\"135\"></rect> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"210\" y=\"255\">40 m</text> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"end\" x=\"120\" y=\"195\">25 m</text> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"start\" x=\"215\" y=\"85\">30 m</text> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"250\" y=\"125\">Area = 600 sq m</text> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"210\" y=\"195\">Area = 1000 sq m</text> </svg>\n\n<p><strong>Calculations:</strong></p>\n\n<p>⇒ Area of the triangle = 1/2 × 40 × 30</p>\n\n<p>⇒ Area of the triangle = 20 × 30 = 600 m<sup>2</sup></p>\n\n<p>⇒ Area of the rectangle = 40 × 25 = 1000 m<sup>2</sup></p>\n\n<p>⇒ Total combined area = 600 + 1000 = 1600 m<sup>2</sup></p>\n\n<p>⇒ Percentage of the triangle's area in total area = (600 ÷ 1600) × 100</p>\n\n<p>⇒ Percentage = (3 ÷ 8) × 100 = 37.5%</p>\n\n<p><strong>∴ The correct answer is 1600 m<sup>2</sup> and 37.5%.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Area of 2D Shapes</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">The area of a planar figure refers to the total space enclosed within its boundary. For standard polygons like triangles and rectangles, direct mathematical formulas are applied based on their distinct dimensions.</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Types of Triangles Based on Area</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">For an equilateral triangle, area = (√3 ÷ 4) × side<sup>2</sup>. For scalene triangles, Heron's formula is widely utilized: Area = √[s(s − a)(s − b)(s − c)], where s represents the semi-perimeter.</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Percentages in Geometry</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">Comparing the region of two interlinked figures as a percentage effectively establishes proportional spatial distribution. It is calculated continuously by dividing the targeted subset area by the overall total area multiplied by 100.</p>\n\n<p> </p>", "marks": 2, "negMarks": 0.5}, {"text": "A regular hexagon is inscribed inside a circle of radius 14 cm. Find the area of the hexagon.", "options": ["438.54 cm²", "509.21 cm²", "598.45 cm²", "638.76 cm²"], "correct": 2, "solution": "<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png\" width=\"26px\" /> <u style=\"font-size: 21px; font-weight: 700; display: inline !important;\">Shortcut Trick</u></span></p>\n\n<p>A regular hexagon inscribed in a circle is made up of 6 equilateral triangles with sides equal to the circle's radius.</p>\n\n<p>Side of the hexagon (a) = Radius (r) = 14 cm</p>\n\n<p>Area = 6 × (√3 ÷ 4) × r<sup>2</sup></p>\n\n<p>Area = 6 × (√3 ÷ 4) × 196 = 294√3</p>\n\n<p>Area ≈ 294 × 1.732 ≈ 509.21 cm<sup>2</sup></p>\n\n<p><strong>∴ The correct answer is 509.21 cm<sup>2</sup>.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Alternate Method</u></span></strong></span></p>\n<svg height=\"260\" style=\"display:block;margin:12px 0;background:#ffffff;border-radius:10px;border:1px solid #cccccc;\" viewbox=\"0 0 420 260\" width=\"420\" xmlns=\"http://www.w3.org/2000/svg\"> <circle cx=\"210\" cy=\"120\" fill=\"#ddeeff\" r=\"100\" stroke=\"#2255cc\" stroke-width=\"1.5\"></circle> <polygon fill=\"#fff0cc\" points=\"310,120 260,33.4 160,33.4 110,120 160,206.6 260,206.6\" stroke=\"#cc5500\" stroke-width=\"2\"></polygon> <line stroke=\"#888888\" stroke-dasharray=\"5,3\" x1=\"210\" x2=\"310\" y1=\"120\" y2=\"120\"></line> <line stroke=\"#888888\" stroke-dasharray=\"5,3\" x1=\"210\" x2=\"260\" y1=\"120\" y2=\"206.6\"></line> <line stroke=\"#888888\" stroke-dasharray=\"5,3\" x1=\"210\" x2=\"160\" y1=\"120\" y2=\"206.6\"></line> <line stroke=\"#888888\" stroke-dasharray=\"5,3\" x1=\"210\" x2=\"110\" y1=\"120\" y2=\"120\"></line> <line stroke=\"#888888\" stroke-dasharray=\"5,3\" x1=\"210\" x2=\"160\" y1=\"120\" y2=\"33.4\"></line> <line stroke=\"#888888\" stroke-dasharray=\"5,3\" x1=\"210\" x2=\"260\" y1=\"120\" y2=\"33.4\"></line> <circle cx=\"210\" cy=\"120\" fill=\"#cc5500\" r=\"3\"></circle> <text fill=\"#cc5500\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"bold\" x=\"205\" y=\"115\">O</text> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"bold\" x=\"245\" y=\"115\">r = 14 cm</text> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"bold\" x=\"270\" y=\"175\">a = 14 cm</text> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"bold\" x=\"125\" y=\"245\">Regular Hexagon Inside A Circle</text> </svg>\n\n<p><strong>Given:</strong></p>\n\n<p>Radius of the circumscribed circle (r) = 14 cm</p>\n\n<p><strong>Formula Used:</strong></p>\n\n<p>Area of a regular hexagon = (3√3 ÷ 2) × a<sup>2</sup></p>\n\n<p>Where 'a' is the side length of the regular hexagon.</p>\n\n<p><strong>Calculations:</strong></p>\n\n<p>⇒ For a regular hexagon inscribed in a circle, the side length 'a' is equal to the radius 'r' of the circle.</p>\n\n<p>⇒ Side length (a) = 14 cm</p>\n\n<p>⇒ Area = (3√3 ÷ 2) × (14)<sup>2</sup></p>\n\n<p>⇒ Area = (3√3 ÷ 2) × 196</p>\n\n<p>⇒ Area = 3 × 98 × √3</p>\n\n<p>⇒ Area = 294√3 cm<sup>2</sup></p>\n\n<p>⇒ Substituting the value of √3 ≈ 1.732:</p>\n\n<p>⇒ Area ≈ 294 × 1.732</p>\n\n<p>⇒ Area ≈ 509.208 cm<sup>2</sup></p>\n\n<p>⇒ Rounding off to two decimal places gives 509.21 cm<sup>2</sup>.</p>\n\n<p><strong>∴ The correct answer is 509.21 cm<sup>2</sup>.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Circumradius of a Regular Hexagon</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">When a regular hexagon is inscribed inside a circle, the radius of the circle (circumradius) is exactly equal to the side length of the hexagon: R = a.</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Inradius of a Regular Hexagon</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">When a circle is inscribed inside a regular hexagon, the radius of the circle (inradius) is equal to the altitude of the equilateral triangles forming the hexagon: r = (√3 ÷ 2) × a.</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Composition of a Hexagon</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">A regular hexagon is formed by 6 identical equilateral triangles. Thus, its total area is exactly 6 times the area of one equilateral triangle: Area = 6 × [(√3 ÷ 4) × a<sup>2</sup>].</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Inscribed vs Circumscribed Areas</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">For any given circle, the area of the regular hexagon circumscribed around it is exactly 4/3 times the area of the regular hexagon inscribed within it.</p>\n\n<p> </p>", "marks": 2, "negMarks": 0.5}, {"text": "Three numbers are such that the second is 150% of the first, and the third is 80% of the second. What is the ratio of the first to the third?", "options": ["5:6", "2:3", "5:4", "5:8"], "correct": 1, "solution": "<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png\" width=\"26px\" /> <u style=\"font-size: 21px; font-weight: 700; display: inline !important;\">Shortcut Trick</u></span></p>\n\n<p>Let the first number be 100.</p>\n\n<p>Second number = 150% of 100 = 150.</p>\n\n<p>Third number = 80% of 150 = 120.</p>\n\n<p>Required Ratio = First number : Third number = 100 : 120 = 5 : 6.</p>\n\n<p><strong>∴ The correct answer is 5:6.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Alternate Method</u></span></strong></span></p>\n\n<p><strong>Given:</strong></p>\n\n<p>The second number is 150% of the first number.</p>\n\n<p>The third number is 80% of the second number.</p>\n\n<p><strong>Formula Used:</strong></p>\n\n<p>Value = (Percentage ÷ 100) × Base Value</p>\n<svg height=\"200\" style=\"display:block;margin:12px 0;background:#ffffff;border-radius:10px;border:1px solid #cccccc;\" viewbox=\"0 0 420 200\" width=\"420\" xmlns=\"http://www.w3.org/2000/svg\"> <rect fill=\"#ddeeff\" height=\"40\" rx=\"5\" stroke=\"#2255cc\" stroke-width=\"2\" width=\"90\" x=\"30\" y=\"70\"></rect> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"75\" y=\"95\">First: 100x</text> <line stroke=\"#2255cc\" stroke-width=\"2\" x1=\"120\" x2=\"160\" y1=\"90\" y2=\"90\"></line> <polygon fill=\"#2255cc\" points=\"160,85 170,90 160,95\"></polygon> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"12\" text-anchor=\"middle\" x=\"145\" y=\"80\">× 1.5</text> <rect fill=\"#fff0cc\" height=\"40\" rx=\"5\" stroke=\"#cc5500\" stroke-width=\"2\" width=\"90\" x=\"170\" y=\"70\"></rect> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"215\" y=\"95\">Second: 150x</text> <line stroke=\"#cc5500\" stroke-width=\"2\" x1=\"260\" x2=\"300\" y1=\"90\" y2=\"90\"></line> <polygon fill=\"#cc5500\" points=\"300,85 310,90 300,95\"></polygon> <text fill=\"#cc5500\" font-family=\"sans-serif\" font-size=\"12\" text-anchor=\"middle\" x=\"285\" y=\"80\">× 0.8</text> <rect fill=\"#ccffcc\" height=\"40\" rx=\"5\" stroke=\"#007700\" stroke-width=\"2\" width=\"80\" x=\"310\" y=\"70\"></rect> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"350\" y=\"95\">Third: 120x</text> <path d=\"M 75 110 L 75 140 L 350 140 L 350 110\" fill=\"none\" stroke=\"#2255cc\" stroke-dasharray=\"4,4\" stroke-width=\"1.5\"></path> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"212\" y=\"158\">Ratio = 100x : 120x = 5 : 6</text> </svg>\n\n<p><strong>Calculation:</strong></p>\n\n<p>⇒ Let the first number be 100x.</p>\n\n<p>⇒ Second number = (150 ÷ 100) × 100x = 150x</p>\n\n<p>⇒ Third number = (80 ÷ 100) × 150x = 120x</p>\n\n<p>⇒ Ratio of first to third = 100x : 120x</p>\n\n<p>⇒ Ratio = 10 : 12 = 5 : 6</p>\n\n<p><strong>∴ The correct answer is 5:6.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Successive Ratio Method (Compound Ratio)</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">If A:B = x:y and B:C = m:n, then the compound ratio A:C can be found by multiplying the individual ratios: A:C = (x × m) : (y × n).</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Fraction Equivalents of Percentages</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">Converting percentages into their simplest fraction forms speeds up calculation: 150% = 3/2, and 80% = 4/5. Using fractions directly: A : C = 1 : (3/2 × 4/5) = 1 : 6/5 = 5 : 6.</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Continuous Percentage Change</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">When applying percentages sequentially on a base, the final value is found by successive multiplication: Final Value = Base × (1 ± p<sub>1</sub>/100) × (1 ± p<sub>2</sub>/100).</p>\n\n<p> </p>", "marks": 2, "negMarks": 0.5}, {"text": "A steel plate is in the shape of a right triangle. The lengths of the legs are in the ratio 5:12. If the hypotenuse is 13 m, what is the area?", "options": ["30 m²", "60 m²", "78 m²", "50 m²"], "correct": 1, "solution": "<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png\" width=\"26px\" /> <u style=\"font-size: 21px; font-weight: 700; display: inline !important;\">Shortcut Trick</u></span></p>\n\n<p>The given ratio of the legs of the right triangle is 5:12.</p>\n\n<p>This corresponds to the standard Pythagorean triplet (5, 12, 13).</p>\n\n<p>Since the corresponding ratio hypotenuse (13) matches the actual hypotenuse (13 m), the lengths of the legs are exactly 5 m and 12 m.</p>\n\n<p>Area = 1/2 × base × height = 1/2 × 12 × 5 = 30 m<sup>2</sup>.</p>\n\n<p><strong>∴ The correct answer is 30 m<sup>2</sup>.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Alternate Method</u></span></strong></span></p>\n\n<p><strong>Given:</strong></p>\n\n<p>The lengths of the legs of a right triangle are in the ratio 5:12.</p>\n\n<p>The hypotenuse of the right triangle = 13 m.</p>\n\n<p><strong>Formula Used:</strong></p>\n\n<p>Area of a right-angled triangle = 1/2 × base × height</p>\n\n<p>Pythagoras Theorem: Hypotenuse<sup>2</sup> = Base<sup>2</sup> + Perpendicular<sup>2</sup></p>\n<svg height=\"200\" style=\"display:block;margin:12px 0;background:#ffffff;border-radius:10px;border:1px solid #cccccc;\" viewbox=\"0 0 420 200\" width=\"420\" xmlns=\"http://www.w3.org/2000/svg\"> <polygon fill=\"#ddeeff\" points=\"100,40 100,160 340,160\" stroke=\"#2255cc\" stroke-width=\"2\"></polygon> <polyline fill=\"none\" points=\"100,145 115,145 115,160\" stroke=\"#2255cc\" stroke-width=\"1.5\"></polyline> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"bold\" x=\"70\" y=\"105\">5x</text> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"bold\" x=\"210\" y=\"180\">12x</text> <text fill=\"#cc5500\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"bold\" x=\"200\" y=\"90\">13 m</text> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"bold\" x=\"90\" y=\"30\">A</text> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"bold\" x=\"80\" y=\"170\">B</text> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"bold\" x=\"350\" y=\"170\">C</text> </svg>\n\n<p>⇒ Let the base and perpendicular of the right triangle be 12x and 5x respectively.</p>\n\n<p>⇒ According to Pythagoras theorem:</p>\n\n<p>⇒ (13)<sup>2</sup> = (12x)<sup>2</sup> + (5x)<sup>2</sup></p>\n\n<p>⇒ 169 = 144x<sup>2</sup> + 25x<sup>2</sup></p>\n\n<p>⇒ 169 = 169x<sup>2</sup></p>\n\n<p>⇒ x<sup>2</sup> = 1</p>\n\n<p>⇒ x = 1</p>\n\n<p>⇒ The base of the triangle = 12 × 1 = 12 m.</p>\n\n<p>⇒ The height of the triangle = 5 × 1 = 5 m.</p>\n\n<p>⇒ Area of the right triangle = 1/2 × 12 × 5</p>\n\n<p>⇒ Area = 6 × 5 = 30 m<sup>2</sup></p>\n\n<p><strong>∴ The correct answer is 30 m<sup>2</sup>.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Pythagorean Triplets</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">A set of three positive integers a, b, and c that satisfy the condition a<sup>2</sup> + b<sup>2</sup> = c<sup>2</sup> is known as a Pythagorean triplet. Common and frequently tested triplets include (3, 4, 5), (5, 12, 13), (7, 24, 25), and (8, 15, 17).</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Heron's Formula</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">For any given triangle with side lengths a, b, and c, the area can be calculated using Heron's formula: Area = √(s(s−a)(s−b)(s−c)), where s is the semi-perimeter calculated as s = (a+b+c) ÷ 2.</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Equilateral Triangle Area</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">For an equilateral triangle where all three sides are equal, the area can be directly calculated using the formula: Area = (√3 ÷ 4) × side<sup>2</sup>.</p>\n\n<p> </p>", "marks": 2, "negMarks": 0.5}, {"text": "A number was mistakenly increased by 25% instead of decreased by 20%. By what percent is the final result more than the CORRECT value?", "options": ["56.25%", "50.5%", "45%", "60.25%"], "correct": 1, "solution": "<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png\" width=\"26px\" /> <u style=\"font-size: 21px; font-weight: 700; display: inline !important;\">Shortcut Trick</u></span></p>\n\n<p>Let the original number be 100.</p>\n\n<p>Mistaken value (increased by 25%) = 125.</p>\n\n<p>Correct value (decreased by 20%) = 80.</p>\n\n<p>Required percentage = [(125 − 80) ÷ 80] × 100%</p>\n\n<p>Required percentage = (45 ÷ 80) × 100% = 56.25%</p>\n\n<p><strong>∴ The correct answer is 56.25%.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Alternate Method</u></span></strong></span></p>\n\n<p><strong>Given:</strong></p>\n\n<p>A number is mistakenly increased by 25% instead of being decreased by 20%.</p>\n<svg height=\"200\" style=\"display:block;margin:12px 0;background:#ffffff;border-radius:10px;border:1px solid #cccccc;\" viewbox=\"0 0 420 200\" width=\"420\" xmlns=\"http://www.w3.org/2000/svg\"> <defs> <marker id=\"arrow-blue\" markerheight=\"6\" markerwidth=\"6\" orient=\"auto\" refx=\"8\" refy=\"5\" viewbox=\"0 0 10 10\"> <path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#2255cc\"></path> </marker> <marker id=\"arrow-red\" markerheight=\"6\" markerwidth=\"6\" orient=\"auto\" refx=\"8\" refy=\"5\" viewbox=\"0 0 10 10\"> <path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#cc0000\"></path> </marker> <marker id=\"arrow-green\" markerheight=\"6\" markerwidth=\"6\" orient=\"auto\" refx=\"8\" refy=\"5\" viewbox=\"0 0 10 10\"> <path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#007700\"></path> </marker> </defs> <line stroke=\"#888888\" stroke-dasharray=\"5,3\" stroke-width=\"2\" x1=\"70\" x2=\"340\" y1=\"100\" y2=\"100\"></line> <circle cx=\"70\" cy=\"100\" fill=\"#2255cc\" r=\"4\"></circle> <circle cx=\"190\" cy=\"100\" fill=\"#2255cc\" r=\"4\"></circle> <circle cx=\"340\" cy=\"100\" fill=\"#2255cc\" r=\"4\"></circle> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"13\" text-anchor=\"middle\" x=\"70\" y=\"120\">Correct (80)</text> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"13\" text-anchor=\"middle\" x=\"190\" y=\"120\">Original (100)</text> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"13\" text-anchor=\"middle\" x=\"340\" y=\"120\">Mistaken (125)</text> <path d=\"M 180 85 Q 130 50 75 85\" fill=\"none\" marker-end=\"url(#arrow-blue)\" stroke=\"#2255cc\" stroke-width=\"1.5\"></path> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"127\" y=\"65\">−20%</text> <path d=\"M 200 85 Q 270 50 335 85\" fill=\"none\" marker-end=\"url(#arrow-red)\" stroke=\"#cc0000\" stroke-width=\"1.5\"></path> <text fill=\"#cc0000\" font-family=\"sans-serif\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"267\" y=\"65\">+25%</text> <path d=\"M 75 135 Q 205 175 335 135\" fill=\"none\" marker-end=\"url(#arrow-green)\" stroke=\"#007700\" stroke-width=\"1.5\"></path> <text fill=\"#007700\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"205\" y=\"170\">Difference = +45</text> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\" x=\"210\" y=\"25\">Percentage Change Visualization</text> </svg>\n\n<p><strong>Calculations:</strong></p>\n\n<p>⇒ Let the original number be 100.</p>\n\n<p>⇒ Correct value = 100 − (20% of 100) = 100 − 20 = 80</p>\n\n<p>⇒ Mistaken value = 100 + (25% of 100) = 100 + 25 = 125</p>\n\n<p>⇒ Difference between mistaken value and correct value = 125 − 80 = 45</p>\n\n<p>⇒ Required percentage = (Difference ÷ Correct value) × 100%</p>\n\n<p>⇒ Required percentage = (45 ÷ 80) × 100%</p>\n\n<p>⇒ Required percentage = (9 ÷ 16) × 100%</p>\n\n<p>⇒ Required percentage = 900 ÷ 16 = 56.25%</p>\n\n<p><strong>∴ The correct answer is 56.25%.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Percentage Error</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">Percentage Error = (|Mistaken Value − Correct Value| ÷ Correct Value) × 100%. It measures the deviation of an incorrect operation from the true or expected value.</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Base of Percentage</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">When asked 'by what percent is A more or less than B', the value B is considered the base. The formula used is: [(A − B) ÷ B] × 100%.</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Successive Percentage Change</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">When a number is changed successively by x% and y%, the net percentage change is given by: Net Change = x + y + (x × y) ÷ 100.</p>\n\n<p> </p>", "marks": 2, "negMarks": 0.5}, {"text": "A wholesaler sells a packet of tea to a retailer at a profit of 20%. The retailer then marks up the price by 50% and offers a discount of 20% to the customer. If the customer pays Rs. 480, find the cost price of the packet for the wholesaler.", "options": ["Rs. 300.33", "Rs. 320.26", "Rs. 333.33", "Rs. 340.26"], "correct": 3, "solution": "<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png\" width=\"26px\" /> <u style=\"font-size: 21px; font-weight: 700; display: inline !important;\">Shortcut Trick</u></span></p>\n\n<p>Let the cost price for the wholesaler be CP.</p>\n\n<p>Effective price multiplier = 1.20 (profit) × 1.50 (markup) × 0.80 (discount) = 1.44</p>\n\n<p>Customer SP = CP × 1.44 = 480 ⇒ CP = 480 ÷ 1.44 = 333.33</p>\n\n<p><strong>∴ The correct answer is Rs. 333.33.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Alternate Method</u></span></strong></span></p>\n\n<p><strong>Given:</strong></p>\n\n<p>Profit% = 20%, Markup% = 50%, Discount% = 20%</p>\n\n<p>Final customer selling price = Rs. 480</p>\n<svg height=\"200\" style=\"display:block;margin:12px 0;background:#ffffff;border-radius:10px;border:1px solid #cccccc;\" viewbox=\"0 0 420 200\" width=\"420\" xmlns=\"http://www.w3.org/2000/svg\"> <circle cx=\"45\" cy=\"90\" fill=\"#ddeeff\" r=\"28\" stroke=\"#2255cc\" stroke-width=\"1.5\"></circle> <circle cx=\"155\" cy=\"90\" fill=\"#ddeeff\" r=\"28\" stroke=\"#2255cc\" stroke-width=\"1.5\"></circle> <circle cx=\"265\" cy=\"90\" fill=\"#ddeeff\" r=\"28\" stroke=\"#2255cc\" stroke-width=\"1.5\"></circle> <circle cx=\"375\" cy=\"90\" fill=\"#ddeeff\" r=\"28\" stroke=\"#2255cc\" stroke-width=\"1.5\"></circle> <text fill=\"#222222\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"45\" y=\"94\">100u</text> <text fill=\"#222222\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"155\" y=\"94\">120u</text> <text fill=\"#222222\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"265\" y=\"94\">180u</text> <text fill=\"#222222\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"375\" y=\"94\">144u</text> <text fill=\"#2255cc\" font-size=\"12\" text-anchor=\"middle\" x=\"45\" y=\"135\">Wholesaler</text> <text fill=\"#2255cc\" font-size=\"12\" text-anchor=\"middle\" x=\"45\" y=\"150\">CP</text> <text fill=\"#2255cc\" font-size=\"12\" text-anchor=\"middle\" x=\"155\" y=\"135\">Retailer</text> <text fill=\"#2255cc\" font-size=\"12\" text-anchor=\"middle\" x=\"155\" y=\"150\">CP</text> <text fill=\"#2255cc\" font-size=\"12\" text-anchor=\"middle\" x=\"265\" y=\"135\">Marked</text> <text fill=\"#2255cc\" font-size=\"12\" text-anchor=\"middle\" x=\"265\" y=\"150\">Price</text> <text fill=\"#2255cc\" font-size=\"12\" text-anchor=\"middle\" x=\"375\" y=\"135\">Customer</text> <text fill=\"#cc5500\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"375\" y=\"150\">= Rs. 480</text> <line stroke=\"#2255cc\" stroke-width=\"1.5\" x1=\"75\" x2=\"123\" y1=\"90\" y2=\"90\"></line> <polygon fill=\"#2255cc\" points=\"121,86 127,90 121,94\"></polygon> <text fill=\"#007700\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"99\" y=\"80\">+20%</text> <line stroke=\"#2255cc\" stroke-width=\"1.5\" x1=\"185\" x2=\"233\" y1=\"90\" y2=\"90\"></line> <polygon fill=\"#2255cc\" points=\"231,86 237,90 231,94\"></polygon> <text fill=\"#007700\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"209\" y=\"80\">+50%</text> <line stroke=\"#2255cc\" stroke-width=\"1.5\" x1=\"295\" x2=\"343\" y1=\"90\" y2=\"90\"></line> <polygon fill=\"#2255cc\" points=\"341,86 347,90 341,94\"></polygon> <text fill=\"#cc0000\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"319\" y=\"80\">−20%</text> <text fill=\"#2255cc\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\" x=\"210\" y=\"180\">144u = Rs. 480 ⇒ 100u = Rs. 333.33</text> </svg>\n\n<p><strong>Calculations:</strong></p>\n\n<p>⇒ Let the cost price for the wholesaler be 100u.</p>\n\n<p>⇒ Retailer's CP = 100u + 20% of 100u = 120u</p>\n\n<p>⇒ Marked Price = 120u + 50% of 120u = 120u + 60u = 180u</p>\n\n<p>⇒ Customer's SP = 180u − 20% of 180u = 180u − 36u = 144u</p>\n\n<p>⇒ According to the given data, 144u = 480</p>\n\n<p>⇒ 1u = 480 ÷ 144 = 10 ÷ 3</p>\n\n<p>⇒ Wholesaler CP (100u) = 100 × (10 ÷ 3) = 1000 ÷ 3 = 333.33</p>\n\n<p><strong>∴ The correct answer is Rs. 333.33.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Marked Price and Discount</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">Discount is always computed on the Marked Price (MP), not the Cost Price (CP). The final selling price is given by SP = MP − Discount.</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Successive Percentage Changes</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">If an initial value experiences consecutive changes of a% and b%, the combined net percentage change is calculated using: Net Change = (a + b + a×b ÷ 100)%.</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Chain Sale Rule</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">When an item passes consecutively through multiple sellers (A to B to C) at corresponding markups or profit percentages p% and q%, the final price equals Initial CP × [(100 + p) ÷ 100] × [(100 + q) ÷ 100].</p>\n\n<p> </p>", "marks": 2, "negMarks": 0.5}, {"text": "In a right prism with a square base, volume = 1024 cm³ and height = 16 cm. What is the side of the square base?", "options": ["8 cm", "6 cm", "10 cm", "12 cm"], "correct": 1, "solution": "<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png\" width=\"26px\" /> <u style=\"font-size: 21px; font-weight: 700; display: inline !important;\">Shortcut Trick</u></span></p>\n\n<p>For a regular right prism, Base Area = Volume ÷ Height.</p>\n\n<p>Base Area = 1024 ÷ 16 = 64 cm<sup>2</sup>.</p>\n\n<p>Since the base is a square, Side = √Base Area.</p>\n\n<p>Side = √64 = 8 cm.</p>\n\n<p><strong>∴ The correct answer is 8 cm.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Alternate Method</u></span></strong></span></p>\n\n<p><strong>Given:</strong></p>\n\n<p>Volume of the prism (V) = 1024 cm<sup>3</sup></p>\n\n<p>Height of the prism (h) = 16 cm</p>\n\n<p>The base of the prism is a square.</p>\n\n<p><strong>Formula Used:</strong></p>\n\n<p>Volume of a prism = Base Area × Height</p>\n\n<p>Area of a square = Side<sup>2</sup></p>\n<svg height=\"260\" style=\"display:block;margin:12px 0;background:#ffffff;border-radius:10px;border:1px solid #cccccc;\" viewbox=\"0 0 420 260\" width=\"420\" xmlns=\"http://www.w3.org/2000/svg\"> <!-- Dashed hidden lines --> <line stroke=\"#2255cc\" stroke-dasharray=\"5,3\" stroke-width=\"1.5\" x1=\"150\" x2=\"180\" y1=\"180\" y2=\"150\"></line> <line stroke=\"#2255cc\" stroke-dasharray=\"5,3\" stroke-width=\"1.5\" x1=\"180\" x2=\"280\" y1=\"150\" y2=\"150\"></line> <line stroke=\"#2255cc\" stroke-dasharray=\"5,3\" stroke-width=\"1.5\" x1=\"180\" x2=\"180\" y1=\"150\" y2=\"30\"></line> <!-- Faces with fill and stroke --> <polygon fill=\"#ddeeff\" fill-opacity=\"0.85\" points=\"150,60 250,60 280,30 180,30\" stroke=\"#2255cc\" stroke-width=\"1.5\"></polygon> <polygon fill=\"#ddeeff\" fill-opacity=\"0.85\" points=\"150,60 250,60 250,180 150,180\" stroke=\"#2255cc\" stroke-width=\"1.5\"></polygon> <polygon fill=\"#ddeeff\" fill-opacity=\"0.85\" points=\"250,60 280,30 280,150 250,180\" stroke=\"#2255cc\" stroke-width=\"1.5\"></polygon> <!-- Dimension Lines --> <line stroke=\"#888888\" stroke-dasharray=\"5,3\" stroke-width=\"1.5\" x1=\"135\" x2=\"135\" y1=\"60\" y2=\"180\"></line> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"bold\" x=\"60\" y=\"125\">h = 16 cm</text> <line stroke=\"#888888\" stroke-dasharray=\"5,3\" stroke-width=\"1.5\" x1=\"150\" x2=\"250\" y1=\"195\" y2=\"195\"></line> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"bold\" x=\"180\" y=\"215\">Side = a</text> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"bold\" x=\"265\" y=\"175\">a</text> <text fill=\"#cc5500\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"bold\" x=\"165\" y=\"125\">V = 1024 cm³</text> </svg>\n\n<p><strong>Calculations:</strong></p>\n\n<p>Let the side of the square base be a cm.</p>\n\n<p>⇒ Base Area = a<sup>2</sup></p>\n\n<p>⇒ Volume = Base Area × Height</p>\n\n<p>⇒ 1024 = a<sup>2</sup> × 16</p>\n\n<p>⇒ a<sup>2</sup> = 1024 ÷ 16</p>\n\n<p>⇒ a<sup>2</sup> = 64</p>\n\n<p>⇒ a = √64</p>\n\n<p>⇒ a = 8 cm</p>\n\n<p><strong>∴ The correct answer is 8 cm.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Right Prism</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">A prism is a 3D solid with two identical, parallel bases. Volume = Base Area × Height. Lateral Surface Area = Base Perimeter × Height.</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Right Circular Cylinder</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">A cylinder is a special prism with circular bases. Volume = πr<sup>2</sup>h, where r is the base radius and h is the height.</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Pyramid</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">A pyramid has a polygon base and triangular faces that meet at a common apex. Volume = (1 ÷ 3) × Base Area × Height.</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Total Surface Area of Prism</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">Total Surface Area (TSA) = Lateral Surface Area + 2 × Base Area.</p>\n\n<p> </p>", "marks": 2, "negMarks": 0.5}, {"text": "A tap can fill an oil tank in 14 hours. After half the tank is filled, 7 more similar taps are opened. What is the total time taken to fill the oil tank completely?", "options": ["6 hr 55 min", "6 hr 52 min 20 sec", "7 hr", "7 hr 52 min 30 sec"], "correct": 4, "solution": "<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png\" width=\"26px\" /> <u style=\"font-size: 21px; font-weight: 700; display: inline !important;\">Shortcut Trick</u></span></p>\n\n<p>Time required for 1 tap to fill half the tank = 14 ÷ 2 = 7 hours.</p>\n\n<p>Total taps working on the remaining half = 1 (initial) + 7 (new) = 8 taps.</p>\n\n<p>Time for 8 taps to fill the remaining half = 7 ÷ 8 hours = 52.5 minutes = 52 minutes 30 seconds.</p>\n\n<p>Total time = 7 hours + 52 minutes 30 seconds = 7 hr 52 min 30 sec.</p>\n\n<p><strong>∴ The correct answer is 7 hr 52 min 30 sec.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Alternate Method</u></span></strong></span></p>\n\n<p><strong>Given:</strong></p>\n\n<p>Time taken by 1 tap to fill the complete tank = 14 hours.</p>\n\n<p>After half the tank is filled, 7 more similar taps are opened.</p>\n\n<table border=\"1\" cellpadding=\"6\" cellspacing=\"0\" style=\"border-collapse:collapse;text-align:left;\">\n\\t<tbody>\n\\t\\t<tr>\n\\t\\t\\t<td><strong>Tap</strong></td>\n\\t\\t\\t<td><strong>Time (hours)</strong></td>\n\\t\\t\\t<td><strong>Total Work</strong></td>\n\\t\\t\\t<td><strong>Efficiency</strong></td>\n\\t\\t</tr>\n\\t\\t<tr>\n\\t\\t\\t<td>1 Tap</td>\n\\t\\t\\t<td>14</td>\n\\t\\t\\t<td rowspan=\"2\">14 units</td>\n\\t\\t\\t<td>1 unit/hour</td>\n\\t\\t</tr>\n\\t\\t<tr>\n\\t\\t\\t<td>8 Taps</td>\n\\t\\t\\t<td>14/8</td>\n\\t\\t\\t<td>8 units/hour</td>\n\\t\\t</tr>\n\\t</tbody>\n</table>\n\n<p><strong>Calculations:</strong></p>\n\n<p>⇒ Total capacity of the tank = 14 units.</p>\n\n<p>⇒ Time taken by 1 tap to fill half the tank (7 units) = 7 units ÷ 1 unit/hour = 7 hours.</p>\n\n<p>⇒ Remaining tank capacity to be filled = 14 − 7 = 7 units.</p>\n\n<p>⇒ Total number of taps working now = 1 + 7 = 8 taps.</p>\n\n<p>⇒ Combined efficiency of 8 taps = 8 × 1 = 8 units/hour.</p>\n\n<p>⇒ Time taken to fill the remaining 7 units = 7 units ÷ 8 units/hour = 7/8 hours.</p>\n\n<p>⇒ Convert 7/8 hours to minutes: (7 ÷ 8) × 60 = 105 ÷ 2 = 52.5 minutes.</p>\n\n<p>⇒ 52.5 minutes is exactly 52 minutes and 30 seconds.</p>\n\n<p>⇒ Total time taken to completely fill the tank = 7 hours + 52 minutes 30 seconds = 7 hr 52 min 30 sec.</p>\n\n<p><strong>∴ The correct answer is 7 hr 52 min 30 sec.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Pipes & Cisterns Concept</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">If a pipe can fill a tank in <em>x</em> hours, then the part filled in 1 hour is 1/<em>x</em>. Efficiency is inversely proportional to the time taken to complete the total work.</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Combined Work Rule</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">When <em>n</em> identical entities work together, their combined efficiency becomes <em>n</em> times the individual efficiency, and the total time taken to do the same work reduces to 1/<em>n</em> of the individual time.</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Time Conversion</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">To convert a fraction of an hour into minutes, simply multiply the fractional value by 60. To further convert a fraction of a minute into seconds, multiply that decimal or fraction by 60 again.</p>\n\n<p> </p>", "marks": 2, "negMarks": 0.5}, {"text": "The average of x and y is 30. The average of x, y, and z is 40. What is the average of x, y, and 2z?", "options": ["50", "55", "60", "65"], "correct": 3, "solution": "<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png\" width=\"26px\" /> <u style=\"font-size: 21px; font-weight: 700; display: inline !important;\">Shortcut Trick</u></span></p>\n\n<p>Sum of x and y = 30 × 2 = 60</p>\n\n<p>Sum of x, y and z = 40 × 3 = 120</p>\n\n<p>Value of z = Sum of (x, y, z) − Sum of (x, y) = 120 − 60 = 60</p>\n\n<p>Sum of x, y and 2z = (x + y) + 2z = 60 + (2 × 60) = 180</p>\n\n<p>New Average of these 3 terms = 180 ÷ 3 = 60</p>\n\n<p><strong>∴ The correct answer is 60.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Alternate Method</u></span></strong></span></p>\n\n<p><strong>Given:</strong></p>\n\n<p>⇒ Average of x and y = 30</p>\n\n<p>⇒ (x + y) ÷ 2 = 30</p>\n\n<p>⇒ x + y = 60</p>\n\n<p>⇒ Average of x, y and z = 40</p>\n\n<p>⇒ (x + y + z) ÷ 3 = 40</p>\n\n<p>⇒ x + y + z = 120</p>\n<svg height=\"220\" style=\"display:block;margin:12px 0;background:#ffffff;border-radius:10px;border:1px solid #cccccc;\" viewbox=\"0 0 420 220\" width=\"420\" xmlns=\"http://www.w3.org/2000/svg\"> <rect fill=\"#ddeeff\" height=\"30\" stroke=\"#2255cc\" stroke-width=\"1.5\" width=\"120\" x=\"30\" y=\"40\"></rect> <text dominant-baseline=\"middle\" fill=\"#222222\" font-family=\"sans-serif\" font-size=\"13\" text-anchor=\"middle\" x=\"90\" y=\"60\">x + y = 60</text> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"bold\" x=\"30\" y=\"25\">Sum of x, y (2 × 30)</text> <rect fill=\"#ddeeff\" height=\"30\" stroke=\"#2255cc\" stroke-width=\"1.5\" width=\"120\" x=\"30\" y=\"100\"></rect> <rect fill=\"#fff0cc\" height=\"30\" stroke=\"#cc5500\" stroke-width=\"1.5\" width=\"120\" x=\"150\" y=\"100\"></rect> <text dominant-baseline=\"middle\" fill=\"#222222\" font-family=\"sans-serif\" font-size=\"13\" text-anchor=\"middle\" x=\"90\" y=\"120\">x + y = 60</text> <text dominant-baseline=\"middle\" fill=\"#222222\" font-family=\"sans-serif\" font-size=\"13\" text-anchor=\"middle\" x=\"210\" y=\"120\">z = 60</text> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"bold\" x=\"30\" y=\"85\">Sum of x, y, z (3 × 40)</text> <rect fill=\"#ddeeff\" height=\"30\" stroke=\"#2255cc\" stroke-width=\"1.5\" width=\"120\" x=\"30\" y=\"160\"></rect> <rect fill=\"#fff0cc\" height=\"30\" stroke=\"#cc5500\" stroke-width=\"1.5\" width=\"120\" x=\"150\" y=\"160\"></rect> <rect fill=\"#ccffcc\" height=\"30\" stroke=\"#007700\" stroke-width=\"1.5\" width=\"120\" x=\"270\" y=\"160\"></rect> <text dominant-baseline=\"middle\" fill=\"#222222\" font-family=\"sans-serif\" font-size=\"13\" text-anchor=\"middle\" x=\"90\" y=\"180\">x + y = 60</text> <text dominant-baseline=\"middle\" fill=\"#222222\" font-family=\"sans-serif\" font-size=\"13\" text-anchor=\"middle\" x=\"210\" y=\"180\">z = 60</text> <text dominant-baseline=\"middle\" fill=\"#222222\" font-family=\"sans-serif\" font-size=\"13\" text-anchor=\"middle\" x=\"330\" y=\"180\">z = 60</text> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"bold\" x=\"30\" y=\"145\">Sum of x, y, 2z = 180</text> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"end\" x=\"390\" y=\"205\">New Average = 180 ÷ 3 = 60</text> </svg>\n\n<p><strong>Calculations:</strong></p>\n\n<p>⇒ Substituting x + y = 60 into the second sum equation:</p>\n\n<p>⇒ 60 + z = 120</p>\n\n<p>⇒ z = 60</p>\n\n<p>⇒ We are required to find the average of x, y and 2z. The terms are 3 in number.</p>\n\n<p>⇒ Sum = x + y + 2z</p>\n\n<p>⇒ Sum = (x + y) + 2 × z</p>\n\n<p>⇒ Sum = 60 + 2 × 60</p>\n\n<p>⇒ Sum = 60 + 120 = 180</p>\n\n<p>⇒ Required Average = Sum ÷ 3</p>\n\n<p>⇒ Required Average = 180 ÷ 3 = 60</p>\n\n<p><strong>∴ The correct answer is 60.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Average Basic Formula</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">Average = Sum of all observations ÷ Total number of observations. To find the total sum when the average is known, simply multiply the average by the number of observations.</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Combined Average</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">If a group A has n<sub>1</sub> items with average A<sub>1</sub> and group B has n<sub>2</sub> items with average A<sub>2</sub>, the Combined Average is calculated as (n<sub>1</sub> × A<sub>1</sub> + n<sub>2</sub> × A<sub>2</sub>) ÷ (n<sub>1</sub> + n<sub>2</sub>).</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Effect of Arithmetic Operations on Average</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">If a constant k is added, subtracted, multiplied, or divided to each individual term in a dataset, the new average of the dataset will correspondingly increase, decrease, be multiplied, or be divided by k.</p>\n\n<p> </p>", "marks": 2, "negMarks": 0.5}, {"text": "A seller mixes two varieties of rice costing Rs. 40/kg and Rs. 60/kg in a certain ratio and sells the mixture at Rs. 55/kg, gaining 10%. What is the ratio in which the two types are mixed?", "options": ["1:1", "2:3", "3:2", "4:1"], "correct": 1, "solution": "<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png\" width=\"26px\" /> <u style=\"font-size: 21px; font-weight: 700; display: inline !important;\">Shortcut Trick</u></span></p>\n\n<p>Cost Price (CP) of the mixture = SP ÷ 1.1 = 55 ÷ 1.1 = ₹50/kg.</p>\n\n<p>Apply Alligation on CP: (60 − 50) : (50 − 40)</p>\n\n<p>Ratio = 10 : 10 = 1 : 1.</p>\n\n<p><strong>∴ The correct answer is 1:1.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Alternate Method</u></span></strong></span></p>\n\n<p><strong>Given:</strong></p>\n\n<p>Cost price of Variety 1 = ₹40/kg</p>\n\n<p>Cost price of Variety 2 = ₹60/kg</p>\n\n<p>Selling price of the mixture = ₹55/kg</p>\n\n<p>Profit = 10%</p>\n\n<p><strong>Formula Used:</strong></p>\n\n<p>CP = [100 ÷ (100 + Profit%)] × SP</p>\n\n<p><strong>Calculation:</strong></p>\n\n<p>⇒ Mean CP of the mixture = [100 ÷ (100 + 10)] × 55</p>\n\n<p>⇒ Mean CP = (100 ÷ 110) × 55 = ₹50/kg</p>\n<svg height=\"200\" style=\"display:block;margin:12px 0;background:#ffffff;border-radius:10px;border:1px solid #cccccc;\" viewbox=\"0 0 420 200\" width=\"420\" xmlns=\"http://www.w3.org/2000/svg\"> <line stroke=\"#888888\" stroke-dasharray=\"5,3\" stroke-width=\"2\" x1=\"110\" x2=\"310\" y1=\"45\" y2=\"155\"></line> <line stroke=\"#888888\" stroke-dasharray=\"5,3\" stroke-width=\"2\" x1=\"310\" x2=\"110\" y1=\"45\" y2=\"155\"></line> <circle cx=\"110\" cy=\"45\" fill=\"#ddeeff\" r=\"25\" stroke=\"#2255cc\" stroke-width=\"1.5\"></circle> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\" x=\"110\" y=\"50\">₹40</text> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"12\" text-anchor=\"middle\" x=\"110\" y=\"14\">Variety 1</text> <circle cx=\"310\" cy=\"45\" fill=\"#ddeeff\" r=\"25\" stroke=\"#2255cc\" stroke-width=\"1.5\"></circle> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\" x=\"310\" y=\"50\">₹60</text> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"12\" text-anchor=\"middle\" x=\"310\" y=\"14\">Variety 2</text> <circle cx=\"210\" cy=\"100\" fill=\"#fff0cc\" r=\"30\" stroke=\"#cc5500\" stroke-width=\"1.5\"></circle> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\" x=\"210\" y=\"105\">₹50</text> <text fill=\"#cc5500\" font-family=\"sans-serif\" font-size=\"12\" text-anchor=\"middle\" x=\"210\" y=\"62\">Mean CP</text> <circle cx=\"110\" cy=\"155\" fill=\"#ccffcc\" r=\"25\" stroke=\"#007700\" stroke-width=\"1.5\"></circle> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\" x=\"110\" y=\"160\">10</text> <text fill=\"#444444\" font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" x=\"110\" y=\"125\">60 − 50</text> <circle cx=\"310\" cy=\"155\" fill=\"#ccffcc\" r=\"25\" stroke=\"#007700\" stroke-width=\"1.5\"></circle> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\" x=\"310\" y=\"160\">10</text> <text fill=\"#444444\" font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" x=\"310\" y=\"125\">50 − 40</text> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"16\" font-weight=\"bold\" text-anchor=\"middle\" x=\"210\" y=\"188\">Ratio = 1 : 1</text> </svg>\n\n<p>⇒ By the rule of alligation, the ratio of their quantities is:</p>\n\n<p>⇒ Quantity of Variety 1 : Quantity of Variety 2 = (60 − 50) : (50 − 40)</p>\n\n<p>⇒ Ratio = 10 : 10 = 1 : 1</p>\n\n<p><strong>∴ The correct answer is 1:1.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Rule of Alligation</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">It states that: Quantity of Cheaper ÷ Quantity of Dearer = (CP of Dearer − Mean Price) ÷ (Mean Price − CP of Cheaper).</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Weighted Average Method</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">The mean price can also be verified using weights: Mean Price = (w<sub>1</sub> × x<sub>1</sub> + w<sub>2</sub> × x<sub>2</sub>) ÷ (w<sub>1</sub> + w<sub>2</sub>).</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Cost Price from Selling Price</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">When profit percentage is given, always calculate the Cost Price before applying alligation, as the components being mixed are at their cost prices.</p>\n\n<p> </p>", "marks": 2, "negMarks": 0.5}, {"text": "If sinA = <span class=\"math-tex\">\\(\\frac{1}{\\sqrt{10}}\\)</span> then find the value of tanA + secA.", "options": ["<span class=\"math-tex\">\\(\\frac{(1+\\sqrt{10})}{3}\\)</span>", "<span class=\"math-tex\">\\(\\frac{(5+\\sqrt{10})}{5}\\)</span>", "<span class=\"math-tex\">\\(\\frac{(6+\\sqrt{10})}{3}\\)</span>", "<span class=\"math-tex\">\\(\\frac{(1+\\sqrt{10})}{5}\\)</span>"], "correct": 1, "solution": "<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png\" width=\"26px\" /> <u style=\"font-size: 21px; font-weight: 700; display: inline !important;\">Shortcut Trick</u></span></p>\n\n<p>Given sinA = P/H = 1/√10, so Perpendicular (P) = 1 and Hypotenuse (H) = √10.</p>\n\n<p>Using Pythagorean theorem, Base B = √(H<sup>2</sup> − P<sup>2</sup>) = √(10 − 1) = 3.</p>\n\n<p>We need to find: tanA + secA = (P/B) + (H/B) = (P + H)/B.</p>\n\n<p>Directly substitute the values: (1 + √10)/3.</p>\n\n<p><strong>∴ The correct answer is (1+√10)/3.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Alternate Method</u></span></strong></span></p>\n\n<p><strong>Given:</strong></p>\n\n<p>sinA = 1/√10</p>\n\n<p>Let Perpendicular (P) = 1 and Hypotenuse (H) = √10</p>\n\n<p><strong>Formula Used:</strong></p>\n\n<p>Pythagoras Theorem: H<sup>2</sup> = P<sup>2</sup> + B<sup>2</sup></p>\n\n<p>tanA = P/B and secA = H/B</p>\n<svg height=\"240\" style=\"display:block;margin:12px 0;background:#ffffff;border-radius:10px;border:1px solid #cccccc;\" viewbox=\"0 0 420 240\" width=\"420\" xmlns=\"http://www.w3.org/2000/svg\"> <polygon fill=\"#ddeeff\" points=\"60,180 300,180 300,100\" stroke=\"#2255cc\" stroke-width=\"2\"></polygon> <polyline fill=\"none\" points=\"285,180 285,165 300,165\" stroke=\"#2255cc\" stroke-width=\"1.5\"></polyline> <path d=\"M 100,180 A 40,40 0 0,0 98,167\" fill=\"none\" stroke=\"#cc5500\" stroke-width=\"2\"></path> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"bold\" x=\"40\" y=\"190\">A</text> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"bold\" x=\"310\" y=\"190\">B</text> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"bold\" x=\"310\" y=\"95\">C</text> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"bold\" x=\"160\" y=\"130\">H = √10</text> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"bold\" x=\"310\" y=\"145\">P = 1</text> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"bold\" x=\"170\" y=\"205\">B = 3</text> </svg>\n\n<p><strong>Calculations:</strong></p>\n\n<p>⇒ (√10)<sup>2</sup> = 1<sup>2</sup> + B<sup>2</sup></p>\n\n<p>⇒ 10 = 1 + B<sup>2</sup></p>\n\n<p>⇒ B<sup>2</sup> = 10 − 1 = 9</p>\n\n<p>⇒ B = √9 = 3</p>\n\n<p>⇒ tanA = P/B = 1/3</p>\n\n<p>⇒ secA = H/B = √10/3</p>\n\n<p>⇒ tanA + secA = 1/3 + √10/3 = (1+√10)/3</p>\n\n<p><strong>∴ The correct answer is (1+√10)/3.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Trigonometric Ratios</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">In a right-angled triangle, sine is Perpendicular ÷ Hypotenuse, cosine is Base ÷ Hypotenuse, and tangent is Perpendicular ÷ Base.</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Pythagoras Theorem</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">It states that the square of the hypotenuse is equal to the sum of the squares of the other two sides: H<sup>2</sup> = P<sup>2</sup> + B<sup>2</sup>.</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Basic Trigonometric Identities</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">The primary trigonometric identity connects sine and cosine as sin<sup>2</sup>θ + cos<sup>2</sup>θ = 1. Similarly, sec<sup>2</sup>θ − tan<sup>2</sup>θ = 1.</p>\n\n<p> </p>", "marks": 2, "negMarks": 0.5}, {"text": "Find the value of sin²90° + cos²60°.", "options": ["<span class=\"math-tex\">\\(\\frac{5}{4}\\)</span>", "<span class=\"math-tex\">\\(\\frac{11}{5}\\)</span>", "<span class=\"math-tex\">\\(\\frac{6}{5}\\)</span>", "<span class=\"math-tex\">\\(\\frac{7}{4}\\)</span>"], "correct": 1, "solution": "<p><span style='display: flex;gap: 6px;align-items: center;'><img height='26px' src='https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png' width='26px' /> <u style='font-size: 21px; font-weight: 700; display: inline !important;'>Shortcut Trick</u></span>\n<p>Value of sin 90° = 1</p>\n<p>Value of cos 60° = 1/2</p>\n<p>Substitute these values into the expression:</p>\n<p>⇒ (1)<sup>2</sup> + (1/2)<sup>2</sup></p>\n<p>⇒ 1 + 1/4 = 5/4</p>\n<p><strong>∴ The correct answer is 5/4.</strong></p>\n<p><span style='display: flex;gap: 6px;align-items: center;'><img height='26px' src='https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png' width='26px' /><strong><span style='vertical-align: middle;font-size: 21px;'><u>Alternate Method</u></span></strong></span></p>\n<p><strong>Given:</strong></p>\n<p>Expression: sin<sup>2</sup>90° + cos<sup>2</sup>60°</p>\n<p><strong>Formula Used:</strong></p>\n<p>sin 90° = 1</p>\n<p>cos 60° = 1/2</p>\n<p><strong>Calculations:</strong></p>\n<p>⇒ sin<sup>2</sup>90° + cos<sup>2</sup>60°</p>\n<p>⇒ (1)<sup>2</sup> + (1/2)<sup>2</sup></p>\n<p>⇒ 1 + 1/4</p>\n<p>⇒ (4 + 1) ÷ 4</p>\n<p>⇒ 5/4</p>\n<p><strong>∴ The correct answer is 5/4.</strong></p>\n<p><span style='display: flex;gap: 6px;align-items: center;'><img height='26px' src='https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png' width='26px' /><strong><span style='vertical-align: middle;font-size: 21px;'><u>Additional Information</u></span></strong></span></p>\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>Standard Trigonometric Values</p>\n<p style='margin:0 0 8px 0;color:#444444;'>sin 30° = 1/2, sin 45° = 1/√2, sin 60° = √3/2<br>cos 30° = √3/2, cos 45° = 1/√2, cos 60° = 1/2</p>\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>Trigonometric Identities</p>\n<p style='margin:0 0 8px 0;color:#444444;'>sin<sup>2</sup>θ + cos<sup>2</sup>θ = 1<br>1 + tan<sup>2</sup>θ = sec<sup>2</sup>θ<br>1 + cot<sup>2</sup>θ = cosec<sup>2</sup>θ</p>\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>Complementary Angles</p>\n<p style='margin:0 0 8px 0;color:#444444;'>sin(90° − θ) = cosθ<br>cos(90° − θ) = sinθ</p></p>cd:Tee7,<p><span style='display: flex;gap: 6px;align-items: center;'><img height='26px' src='https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png' width='26px' /> <u style='font-size: 21px; font-weight: 700; display: inline !important;'>Shortcut Trick</u></span>\n<p>sin 90° का मान = 1</p>\n<p>cos 60° का मान = 1/2</p>\n<p>इन मानों को व्यंजक में प्रतिस्थापित करने पर:</p>\n<p>⇒ (1)<sup>2</sup> + (1/2)<sup>2</sup></p>\n<p>⇒ 1 + 1/4 = 5/4</p>\n<p><strong>∴ सही उत्तर 5/4 है।</strong></p>\n<p><span style='display: flex;gap: 6px;align-items: center;'><img height='26px' src='https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png' width='26px' /><strong><span style='vertical-align: middle;font-size: 21px;'><u>Alternate Method</u></span></strong></span></p>\n<p><strong>दिया गया है:</strong></p>\n<p>व्यंजक: sin<sup>2</sup>90° + cos<sup>2</sup>60°</p>\n<p><strong>प्रयुक्त सूत्र:</strong></p>\n<p>sin 90° = 1</p>\n<p>cos 60° = 1/2</p>\n<p><strong>गणना:</strong></p>\n<p>⇒ sin<sup>2</sup>90° + cos<sup>2</sup>60°</p>\n<p>⇒ (1)<sup>2</sup> + (1/2)<sup>2</sup></p>\n<p>⇒ 1 + 1/4</p>\n<p>⇒ (4 + 1) ÷ 4</p>\n<p>⇒ 5/4</p>\n<p><strong>∴ सही उत्तर 5/4 है।</strong></p>\n<p><span style='display: flex;gap: 6px;align-items: center;'><img height='26px' src='https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png' width='26px' /><strong><span style='vertical-align: middle;font-size: 21px;'><u>Additional Information</u></span></strong></span></p>\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>मानक त्रिकोणमितीय मान</p>\n<p style='margin:0 0 8px 0;color:#444444;'>sin 30° = 1/2, sin 45° = 1/√2, sin 60° = √3/2<br>cos 30° = √3/2, cos 45° = 1/√2, cos 60° = 1/2</p>\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>त्रिकोणमितीय सर्वसमिकाएँ</p>\n<p style='margin:0 0 8px 0;color:#444444;'>sin<sup>2</sup>θ + cos<sup>2</sup>θ = 1<br>1 + tan<sup>2</sup>θ = sec<sup>2</sup>θ<br>1 + cot<sup>2</sup>θ = cosec<sup>2</sup>θ</p>\n<p style='margin:8px 0 2px 0;font-weight:700;color:#222222;'>पूरक कोण</p>\n<p style='margin:0 0 8px 0;color:#444444;'>sin(90° − θ) = cosθ<br>cos(90° − θ) = sinθ</p></p>ce:T1d5b,<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png\" width=\"26px\" /> <u style=\"font-size: 21px; font-weight: 700; display: inline !important;\">Shortcut Trick</u></span></p>\n\n<p>To find the x-intercept of any linear equation, simply set y = 0.</p>\n\n<p>⇒ 5x + 2(0) = 10</p>\n\n<p>⇒ 5x = 10</p>\n\n<p>⇒ x = 2</p>\n\n<p><strong>∴ The correct answer is 2.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Alternate Method</u></span></strong></span></p>\n<svg height=\"240\" style=\"display:block;margin:12px 0;background:#ffffff;border-radius:10px;border:1px solid #cccccc;\" viewbox=\"0 0 420 240\" width=\"420\" xmlns=\"http://www.w3.org/2000/svg\"> <!-- X Axis --> <line stroke=\"#2255cc\" stroke-width=\"2\" x1=\"40\" x2=\"380\" y1=\"180\" y2=\"180\"></line> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"bold\" x=\"385\" y=\"184\">X</text> <!-- Y Axis --> <line stroke=\"#2255cc\" stroke-width=\"2\" x1=\"120\" x2=\"120\" y1=\"20\" y2=\"220\"></line> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"bold\" x=\"115\" y=\"15\">Y</text> <!-- Origin --> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"12\" x=\"105\" y=\"195\">O</text> <!-- Line --> <line stroke=\"#cc5500\" stroke-width=\"2\" x1=\"112\" x2=\"192\" y1=\"10\" y2=\"210\"></line> <!-- Dashed Ref Lines --> <line stroke=\"#888888\" stroke-dasharray=\"5,3\" stroke-width=\"1\" x1=\"120\" x2=\"180\" y1=\"30\" y2=\"30\"></line> <line stroke=\"#888888\" stroke-dasharray=\"5,3\" stroke-width=\"1\" x1=\"180\" x2=\"180\" y1=\"30\" y2=\"180\"></line> <!-- Points --> <circle cx=\"120\" cy=\"30\" fill=\"#cc5500\" r=\"4\"></circle> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"12\" x=\"130\" y=\"35\">y-intercept (0, 5)</text> <circle cx=\"180\" cy=\"180\" fill=\"#cc5500\" r=\"4\"></circle> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"12\" x=\"190\" y=\"195\">x-intercept (2, 0)</text> <!-- Line Equation Label --> <text fill=\"#cc5500\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"bold\" x=\"210\" y=\"100\">5x + 2y = 10</text> <!-- Ticks on X-axis --> <line stroke=\"#2255cc\" stroke-width=\"1.5\" x1=\"150\" x2=\"150\" y1=\"177\" y2=\"183\"></line> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"11\" x=\"146\" y=\"195\">1</text> <line stroke=\"#2255cc\" stroke-width=\"1.5\" x1=\"180\" x2=\"180\" y1=\"177\" y2=\"183\"></line> <line stroke=\"#2255cc\" stroke-width=\"1.5\" x1=\"210\" x2=\"210\" y1=\"177\" y2=\"183\"></line> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"11\" x=\"206\" y=\"195\">3</text> <line stroke=\"#2255cc\" stroke-width=\"1.5\" x1=\"240\" x2=\"240\" y1=\"177\" y2=\"183\"></line> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"11\" x=\"236\" y=\"195\">4</text> <line stroke=\"#2255cc\" stroke-width=\"1.5\" x1=\"270\" x2=\"270\" y1=\"177\" y2=\"183\"></line> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"11\" x=\"266\" y=\"195\">5</text> </svg>\n\n<p><strong>Given:</strong></p>\n\n<p>Equation of the line: 5x + 2y = 10</p>\n\n<p><strong>Formula Used:</strong></p>\n\n<p>The standard intercept form of a linear equation is x/a + y/b = 1, where 'a' represents the x-intercept and 'b' represents the y-intercept.</p>\n\n<p><strong>Calculations:</strong></p>\n\n<p>Divide the entire equation by 10 to make the Right Hand Side (RHS) equal to 1:</p>\n\n<p>⇒ (5x / 10) + (2y / 10) = 10 / 10</p>\n\n<p>⇒ x / 2 + y / 5 = 1</p>\n\n<p>Comparing this with the standard intercept form (x/a + y/b = 1):</p>\n\n<p>⇒ a = 2</p>\n\n<p>⇒ b = 5</p>\n\n<p>The x-intercept 'a' is 2.</p>\n\n<p><strong>∴ The correct answer is 2.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">General Form Conversion</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">For a linear equation in the general form ax + by + c = 0, the x-intercept is given by −c/a and the y-intercept is −c/b.</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Slope-Intercept Form</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">The equation can also be expressed as y = mx + c, where 'm' is the slope (gradient) of the line and 'c' directly represents the y-intercept.</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Intercept Properties</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">The x-intercept is specifically the absolute point where the line crosses the horizontal x-axis (meaning y = 0). Conversely, the y-intercept is where it crosses the vertical y-axis (meaning x = 0).</p>\n\n<p> </p>", "marks": 2, "negMarks": 0.5}, {"text": "Find the x-intercept of 5x + 2y = 10", "options": ["2", "4", "5", "7"], "correct": 1, "solution": "<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png\" width=\"26px\" /> <u style=\"font-size: 21px; font-weight: 700; display: inline !important;\">Shortcut Trick</u></span></p>\n\n<p>To find the x-intercept of any linear equation, simply set y = 0.</p>\n\n<p>⇒ 5x + 2(0) = 10</p>\n\n<p>⇒ 5x = 10</p>\n\n<p>⇒ x = 2</p>\n\n<p><strong>∴ The correct answer is 2.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Alternate Method</u></span></strong></span></p>\n<svg height=\"240\" style=\"display:block;margin:12px 0;background:#ffffff;border-radius:10px;border:1px solid #cccccc;\" viewbox=\"0 0 420 240\" width=\"420\" xmlns=\"http://www.w3.org/2000/svg\"> <!-- X Axis --> <line stroke=\"#2255cc\" stroke-width=\"2\" x1=\"40\" x2=\"380\" y1=\"180\" y2=\"180\"></line> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"bold\" x=\"385\" y=\"184\">X</text> <!-- Y Axis --> <line stroke=\"#2255cc\" stroke-width=\"2\" x1=\"120\" x2=\"120\" y1=\"20\" y2=\"220\"></line> <text fill=\"#2255cc\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"bold\" x=\"115\" y=\"15\">Y</text> <!-- Origin --> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"12\" x=\"105\" y=\"195\">O</text> <!-- Line --> <line stroke=\"#cc5500\" stroke-width=\"2\" x1=\"112\" x2=\"192\" y1=\"10\" y2=\"210\"></line> <!-- Dashed Ref Lines --> <line stroke=\"#888888\" stroke-dasharray=\"5,3\" stroke-width=\"1\" x1=\"120\" x2=\"180\" y1=\"30\" y2=\"30\"></line> <line stroke=\"#888888\" stroke-dasharray=\"5,3\" stroke-width=\"1\" x1=\"180\" x2=\"180\" y1=\"30\" y2=\"180\"></line> <!-- Points --> <circle cx=\"120\" cy=\"30\" fill=\"#cc5500\" r=\"4\"></circle> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"12\" x=\"130\" y=\"35\">y-intercept (0, 5)</text> <circle cx=\"180\" cy=\"180\" fill=\"#cc5500\" r=\"4\"></circle> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"12\" x=\"190\" y=\"195\">x-intercept (2, 0)</text> <!-- Line Equation Label --> <text fill=\"#cc5500\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"bold\" x=\"210\" y=\"100\">5x + 2y = 10</text> <!-- Ticks on X-axis --> <line stroke=\"#2255cc\" stroke-width=\"1.5\" x1=\"150\" x2=\"150\" y1=\"177\" y2=\"183\"></line> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"11\" x=\"146\" y=\"195\">1</text> <line stroke=\"#2255cc\" stroke-width=\"1.5\" x1=\"180\" x2=\"180\" y1=\"177\" y2=\"183\"></line> <line stroke=\"#2255cc\" stroke-width=\"1.5\" x1=\"210\" x2=\"210\" y1=\"177\" y2=\"183\"></line> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"11\" x=\"206\" y=\"195\">3</text> <line stroke=\"#2255cc\" stroke-width=\"1.5\" x1=\"240\" x2=\"240\" y1=\"177\" y2=\"183\"></line> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"11\" x=\"236\" y=\"195\">4</text> <line stroke=\"#2255cc\" stroke-width=\"1.5\" x1=\"270\" x2=\"270\" y1=\"177\" y2=\"183\"></line> <text fill=\"#222222\" font-family=\"sans-serif\" font-size=\"11\" x=\"266\" y=\"195\">5</text> </svg>\n\n<p><strong>Given:</strong></p>\n\n<p>Equation of the line: 5x + 2y = 10</p>\n\n<p><strong>Formula Used:</strong></p>\n\n<p>The standard intercept form of a linear equation is x/a + y/b = 1, where 'a' represents the x-intercept and 'b' represents the y-intercept.</p>\n\n<p><strong>Calculations:</strong></p>\n\n<p>Divide the entire equation by 10 to make the Right Hand Side (RHS) equal to 1:</p>\n\n<p>⇒ (5x / 10) + (2y / 10) = 10 / 10</p>\n\n<p>⇒ x / 2 + y / 5 = 1</p>\n\n<p>Comparing this with the standard intercept form (x/a + y/b = 1):</p>\n\n<p>⇒ a = 2</p>\n\n<p>⇒ b = 5</p>\n\n<p>The x-intercept 'a' is 2.</p>\n\n<p><strong>∴ The correct answer is 2.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">General Form Conversion</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">For a linear equation in the general form ax + by + c = 0, the x-intercept is given by −c/a and the y-intercept is −c/b.</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Slope-Intercept Form</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">The equation can also be expressed as y = mx + c, where 'm' is the slope (gradient) of the line and 'c' directly represents the y-intercept.</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Intercept Properties</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">The x-intercept is specifically the absolute point where the line crosses the horizontal x-axis (meaning y = 0). Conversely, the y-intercept is where it crosses the vertical y-axis (meaning x = 0).</p>\n\n<p> </p>", "marks": 2, "negMarks": 0.5}, {"text": "If sin(A) = cos(B), cos(A) = sin(C), and A + B + C = 90°, then what is the value of angle A?", "options": ["90°", "60°", "30°", "15°"], "correct": 1, "solution": "<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png\" width=\"26px\" /> <u style=\"font-size: 21px; font-weight: 700; display: inline !important;\">Shortcut Trick</u></span></p>\n\n<p>If sin(A) = cos(B), it directly implies A + B = 90°.</p>\n\n<p>If cos(A) = sin(C), it directly implies A + C = 90°.</p>\n\n<p>Adding both equations gives: 2A + B + C = 180°.</p>\n\n<p>We are already given that A + B + C = 90°.</p>\n\n<p>Subtracting the given equation from our sum gives: A = 180° − 90° = 90°.</p>\n\n<p><strong>∴ The correct answer is 90°.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/c76c13ba2d2ab46b47f8a931ae621dac081a0cb266b142dc23f58659fac4a466.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Alternate Method</u></span></strong></span></p>\n\n<p><strong>Given:</strong></p>\n\n<p>sin(A) = cos(B)</p>\n\n<p>cos(A) = sin(C)</p>\n\n<p>A + B + C = 90°</p>\n\n<p><strong>Concept Used:</strong></p>\n\n<p>Trigonometric complementary angle identities:</p>\n\n<p>cos(θ) = sin(90° − θ)</p>\n\n<p>sin(θ) = cos(90° − θ)</p>\n\n<p><strong>Calculations:</strong></p>\n\n<p>⇒ sin(A) = cos(B)</p>\n\n<p>⇒ sin(A) = sin(90° − B)</p>\n\n<p>⇒ A = 90° − B</p>\n\n<p>⇒ A + B = 90°     --- (1)</p>\n\n<p>⇒ cos(A) = sin(C)</p>\n\n<p>⇒ cos(A) = cos(90° − C)</p>\n\n<p>⇒ A = 90° − C</p>\n\n<p>⇒ A + C = 90°     --- (2)</p>\n\n<p>Adding equations (1) and (2):</p>\n\n<p>⇒ (A + B) + (A + C) = 90° + 90°</p>\n\n<p>⇒ 2A + B + C = 180°</p>\n\n<p>⇒ A + (A + B + C) = 180°</p>\n\n<p>Substitute the given value of A + B + C = 90°:</p>\n\n<p>⇒ A + 90° = 180°</p>\n\n<p>⇒ A = 180° − 90°</p>\n\n<p>⇒ A = 90°</p>\n\n<p><strong>∴ The correct answer is 90°.</strong></p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Complementary Angles</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">Two angles are complementary if their sum is exactly 90°. In right-angled triangles, the two acute angles are always complementary.</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Trigonometric Co-functions</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">Sine and cosine are co-functions, meaning sin(θ) = cos(90° − θ) and cos(θ) = sin(90° − θ).</p>\n\n<p style=\"margin:8px 0 2px 0;font-weight:700;color:#222222;\">Tangent and Cotangent</p>\n\n<p style=\"margin:0 0 8px 0;color:#444444;\">Similarly, tangent and cotangent are co-functions where tan(θ) = cot(90° − θ) and cot(θ) = tan(90° − θ).</p>\n\n<p> </p>", "marks": 2, "negMarks": 0.5}, {"text": "The sum of all interior angles of a 20-sided polygon is:", "options": ["3240°", "3600°", "3060°", "3420°"], "correct": 1, "solution": "<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/ca81259519cadfb2d5350673c220e419e60378e9770ad26512fc8e826a8d93f1.png\" width=\"26px\" /> <u style
