<script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},svg:{fontCache:'global'},options:{skipHtmlTags:['script','noscript','style','textarea','pre','code']}};const QUESTIONS=[{"text": "Which Indian para-athlete became the first para archer to receive the Padma Shri after winning a historic gold medal at the 2024 Paris Paralympics?", "options": ["Rakesh Kumar", "Harvinder Singh", "Mariyappan Thangavelu", "Sumit Antil"], "correct": 2, "solution": "<p>The correct answer is <u><strong>Harvinder Singh</strong></u>.</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><u style=\"font-size: 21px; font-weight: bolder; font-family: var(--bs-body-font-family); text-align: var(--bs-body-text-align);\">Key Points</u></span></p>\n<ul>\n<li>Harvinder Singh is an Indian para archer who made history by winning a gold medal at the 2024 Paris Paralympics in the men’s individual recurve event.</li>\n<li>He became the first para archer in India to receive the prestigious Padma Shri award for his outstanding achievements in sports.</li>\n<li>Harvinder Singh has also previously won a bronze medal at the Tokyo 2020 Paralympics, marking India’s first-ever Paralympic medal in archery.</li>\n<li>He hails from the state of Punjab and has overcome physical challenges to establish himself as a trailblazer in para archery.</li>\n<li>His dedication and success have inspired countless individuals with disabilities to pursue sports and achieve their dreams.</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n<ul>\n<li><strong>Rakesh Kumar:</strong>\n<ul>\n<li>Rakesh Kumar is an Indian para archer who has represented India in international competitions, including the Tokyo 2020 Paralympics.</li>\n<li>He competed in the men’s compound archery category but did not win a medal at the Tokyo Paralympics.</li>\n<li>Kumar is known for his remarkable consistency in the sport, often ranking high in international para archery events.</li>\n</ul>\n</li>\n<li><strong>Mariyappan Thangavelu:</strong>\n<ul>\n<li>Mariyappan Thangavelu is an Indian para-athlete specializing in high jump.</li>\n<li>He won a gold medal in the men’s T-42 high jump at the Rio 2016 Paralympics and a silver medal at the Tokyo 2020 Paralympics.</li>\n<li>Thangavelu is a recipient of the Padma Shri and the Khel Ratna awards for his contributions to sports.</li>\n</ul>\n</li>\n<li><strong>Sumit Antil:</strong>\n<ul>\n<li>Sumit Antil is an Indian para-athlete who competes in javelin throw and won a historic gold medal at the Tokyo 2020 Paralympics.</li>\n<li>He set a world record in the men’s F64 javelin throw category during the Tokyo Paralympics, demonstrating exceptional skill and athleticism.</li>\n<li>Sumit has been honored with the Padma Shri for his outstanding achievements in para-athletics.</li>\n</ul>\n</li>\n<li><strong>Theme Explanation - Para Sports in India:</strong>\n<ul>\n<li>Para sports in India have seen tremendous growth over the years, with athletes achieving significant milestones at global events like the Paralympics.</li>\n<li>The government has introduced various initiatives and schemes, such as the Target Olympic Podium Scheme (TOPS), to support para-athletes financially and provide world-class training facilities.</li>\n<li>Indian para-athletes, including Harvinder Singh, Mariyappan Thangavelu, and Sumit Antil, have brought international recognition to the country through their exceptional performances.</li>\n</ul>\n</li>\n</ul>\n```74:T1b5a,<p>सही उत्तर <u><strong>हरविंदर सिंह</strong></u> है।</p>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><u style=\"font-size: 21px; font-weight: bolder; font-family: var(--bs-body-font-family); text-align: var(--bs-body-text-align);\">मुख्य बिंदु</u></span></p>\n<ul>\n<li>हरविंदर सिंह एक भारतीय पैरा तीरंदाज हैं जिन्होंने पुरुषों की व्यक्तिगत रिकर्व स्पर्धा में 2024 पेरिस पैरालिंपिक में स्वर्ण पदक जीतकर इतिहास रचा।</li>\n<li>वह खेलों में अपनी उत्कृष्ट उपलब्धियों के लिए प्रतिष्ठित पद्म श्री पुरस्कार प्राप्त करने वाले भारत के पहले पैरा तीरंदाज बने।</li>\n<li>हरविंदर सिंह ने पहले टोक्यो 2020 पैरालिंपिक में कांस्य पदक भी जीता था, जो तीरंदाजी में भारत का पहला पैरालिंपिक पदक था।</li>\n<li>वह पंजाब राज्य से हैं और पैरा तीरंदाजी में खुद को एक पथप्रदर्शक के रूप में स्थापित करने के लिए शारीरिक चुनौतियों से पार पा चुके हैं।</li>\n<li>उनके समर्पण और सफलता ने अनगिनत विकलांग व्यक्तियों को खेल खेलने और अपने सपनों को प्राप्त करने के लिए प्रेरित किया है।</li>\n</ul>\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>अतिरिक्त जानकारी</u></span></strong></span></p>\n<ul>\n<li><strong>राकेश कुमार:</strong>\n<ul>\n<li>राकेश कुमार एक भारतीय पैरा तीरंदाज हैं जिन्होंने टोक्यो 2020 पैरालिंपिक सहित अंतर्राष्ट्रीय प्रतियोगिताओं में भारत का प्रतिनिधित्व किया है।</li>\n<li>उन्होंने पुरुषों की कंपाउंड तीरंदाजी श्रेणी में प्रतिस्पर्धा की लेकिन टोक्यो पैरालिंपिक में पदक नहीं जीता।</li>\n<li>कुमार खेल में अपनी उल्लेखनीय निरंतरता के लिए जाने जाते हैं, अक्सर अंतर्राष्ट्रीय पैरा तीरंदाजी आयोजनों में उच्च स्थान पर रहते हैं।</li>\n</ul>\n</li>\n<li><strong>मरीयप्पन थंगावेलु:</strong>\n<ul>\n<li>मरीयप्पन थंगावेलु एक भारतीय पैरा-एथलीट हैं जो ऊंची कूद में विशेषज्ञता रखते हैं।</li>\n<li>उन्होंने रियो 2016 पैरालिंपिक में पुरुषों की टी-42 ऊंची कूद में स्वर्ण पदक और टोक्यो 2020 पैरालिंपिक में रजत पदक जीता।</li>\n<li>थंगावेलु खेलों में उनके योगदान के लिए पद्म श्री और खेल रत्न पुरस्कार के प्राप्तकर्ता हैं।</li>\n</ul>\n</li>\n<li><strong>सुमित अंतिल:</strong>\n<ul>\n<li>सुमित अंतिल एक भारतीय पैरा-एथलीट हैं जो भाला फेंक में प्रतिस्पर्धा करते हैं और टोक्यो 2020 पैरालिंपिक में एक ऐतिहासिक स्वर्ण पदक जीता।</li>\n<li>उन्होंने टोक्यो पैरालिंपिक के दौरान पुरुषों की एफ64 भाला फेंक श्रेणी में एक विश्व रिकॉर्ड बनाया, जो असाधारण कौशल और एथलेटिकवाद का प्रदर्शन करता है।</li>\n<li>सुमित को पैरा-एथलेटिक्स में उनकी उत्कृष्ट उपलब्धियों के लिए पद्म श्री से सम्मानित किया गया है।</li>\n</ul>\n</li>\n<li><strong>थीम स्पष्टीकरण - भारत में पैरा खेल:</strong>\n<ul>\n<li>भारत में पैरा खेलों ने वर्षों में जबरदस्त वृद्धि देखी है, एथलीटों ने पैरालिंपिक जैसे वैश्विक आयोजनों में महत्वपूर्ण मील के पत्थर हासिल किए हैं।</li>\n<li>सरकार ने पैरा-एथलीटों को आर्थिक रूप से समर्थन देने और विश्व स्तरीय प्रशिक्षण सुविधाएं प्रदान करने के लिए टारगेट ओलंपिक पोडियम स्कीम (TOPS) जैसी विभिन्न पहल और योजनाएं शुरू की हैं।</li>\n<li>हरविंदर सिंह, मरियप्पन थंगावेलु और सुमित अंतिल सहित भारतीय पैरा-एथलीटों ने अपने असाधारण प्रदर्शन के माध्यम से देश को अंतर्राष्ट्रीय पहचान दिलाई है।</li>\n</ul>\n</li>\n</ul>", "marks": 2, "negMarks": 0.5}, {"text": "Select the most appropriate synonym of the given word: <strong>CADAVEROUS</strong>", "options": ["Vibrant", "Pale", "Lively", "Healthy"], "correct": 2, "solution": "<p>The correct answer is: <b>Option 2 (Pale)</b>.</p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p>\n\n<ul>\n    <li>The word <strong>\"cadaverous\"</strong> refers to something that resembles a corpse, especially in being very pale, thin, or bony. (शव जैसा, बहुत पीला या दुबला-पतला)</li>\n    <ul>\n        <li><strong>Example:</strong> After weeks of illness, he looked absolutely cadaverous, as though he hadn't eaten in days.</li>\n    </ul>\n    <li><strong>\"Pale\"</strong> means having a light or whitish complexion or lacking color, often due to illness or fear. (फीका, पीला)</li>\n    <ul>\n        <li><strong>Example:</strong> She turned pale when she heard the shocking news.</li>\n    </ul>\n    <li>Hence, we can conclude that the most appropriate synonym of \"cadaverous\" is \"pale\".</li>\n</ul>\n\n<p>Therefore, the correct answer is: <strong>Option 2 (Pale)</strong>.</p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<p>Here are the other options explained along with their Hindi meanings and example sentences:</p>\n\n<ul>\n    <li><strong>Vibrant</strong> (<span style=\"color: rgb(33, 37, 41);\">जोरदार, चमकदार</span>): Full of energy and life; bright and striking in color.\n    <ul>\n        <li><strong>Example:</strong> The vibrant colors of the painting immediately caught my attention.</li>\n    </ul>\n    </li>\n\n    <li><strong>Lively</strong> (<span style=\"color: rgb(33, 37, 41);\">जीवंत</span>): Full of life and energy; active and outgoing.\n    <ul>\n        <li><strong>Example:</strong> The lively music got everyone on the dance floor.</li>\n    </ul>\n    </li>\n\n    <li><strong>Healthy</strong> (<span style=\"color: rgb(33, 37, 41);\">स्वस्थ</span>): In good physical or mental condition; free from illness or injury.\n    <ul>\n        <li><strong>Example:</strong> A balanced diet is essential for a healthy lifestyle.</li>\n    </ul>\n    </li>\n</ul>37:Tac6,<p>The correct answer is: <b>Option 3</b> i.e. \"With precise reference and detail\".</p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p>\n\n<ul>\n    <li>The idiom <strong>\"Chapter and verse\"</strong> means to give information with precise reference and detail, often with evidence or specific documentation. (विशिष्ट संदर्भ और विवरण के साथ जानकारी देना)</li>\n    <ul>\n        <li><strong>Example:</strong> When questioned about the policy, she quoted chapter and verse from the official handbook.</li>\n    </ul>\n    <li>The correct answer is <strong>\"With precise reference and detail\"</strong>, which aligns perfectly with the idiom's meaning. (विशिष्ट संदर्भ और विवरण के साथ)</li>\n    <ul>\n        <li><strong>Example:</strong> The lawyer provided chapter and verse to support her argument in court.</li>\n    </ul>\n</ul>\n\n<p>Therefore, the correct answer is: <strong>Option 3</strong>.</p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<p>Here are the other options explained along with their Hindi meanings and example sentences:</p>\n\n<ul>\n    <li><strong>Option 1: With half-formed reasoning</strong> (अधूरी तर्कसंगतता के साथ): Refers to reasoning or arguments that are not fully developed or logical.\n    <ul>\n        <li><strong>Example:</strong> His argument was based on half-formed reasoning and lacked depth.</li>\n    </ul>\n    </li>\n    \n    <li><strong>Option 2: Incomplete explanation</strong> (अधूरी व्याख्या): Refers to an explanation that lacks clarity or is missing important details.\n    <ul>\n        <li><strong>Example:</strong> The teacher rejected his incomplete explanation as it did not answer the question fully.</li>\n    </ul>\n    </li>\n    \n    <li><strong>Option 4: Through analogy or example</strong> (उदाहरण या उपमा के माध्यम से): Refers to explaining something by drawing comparisons or giving examples.\n    <ul>\n        <li><strong>Example:</strong> He explained the concept through analogy, which made it easier to understand.</li>\n    </ul>\n    </li>\n</ul>38:Tab3,<p style=\"color: rgb(33, 37, 41);\">The address given in the problem is,</p>\n\n<p>Bungalow 9, Marine Drive, Mumbai, Maharashtra - 400020</p>\n\n<p style=\"color: rgb(33, 37, 41);\">Let's match this address with the given options one by one to figure out which one is exactly the same.</p>\n\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"color: rgb(33, 37, 41); width: 605.5px;\">\n\\t<tbody>\n\\t\\t<tr>\n\\t\\t\\t<td style=\"text-align: center;\"><strong>Option</strong></td>\n\\t\\t\\t<td style=\"text-align: center;\"><strong>Address in Option</strong></td>\n\\t\\t\\t<td style=\"text-align: center;\"><strong>Given Address</strong></td>\n\\t\\t\\t<td style=\"text-align: center;\"><strong>Comment</strong></td>\n\\t\\t</tr>\n\\t\\t<tr>\n\\t\\t\\t<td style=\"text-align: center;\">(1)</td>\n\\t\\t\\t<td>Bungalow 9, Marine Drive, Mumbai, Maharashtra - 400020</td>\n\\t\\t\\t<td>Bungalow 9, Marine Drive, Mumbai, Maharashtra - 400020</td>\n\\t\\t\\t<td style=\"text-align: center;\">The address is exactly the same as the given address.</td>\n\\t\\t</tr>\n\\t\\t<tr>\n\\t\\t\\t<td style=\"text-align: center;\">(2)</td>\n\\t\\t\\t<td>Bungalow 9, Marine Drive, Mumbai, Maharashtra - 401020</td>\n\\t\\t\\t<td>Bungalow 9, Marine Drive, Mumbai, Maharashtra - 400020</td>\n\\t\\t\\t<td style=\"text-align: center;\">The PIN code is different (401020 instead of 400020).</td>\n\\t\\t</tr>\n\\t\\t<tr>\n\\t\\ he opened her birthday gift.</li>\n    </ul>\n    <li>Hence, the synonym of <strong>'Coruscate'</strong> is <strong>'Sparkle'</strong>.</li>\n</ul>\n\n<p>Therefore, the correct answer is: <strong>Option 3</strong> i.e. <b>Sparkle</b>.</p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<p>Here are the other options explained along with their Hindi meanings and example sentences:</p>\n\n<ul>\n    <li><strong>Blur</strong> (धुंधलापन): To make or become unclear or less distinct.\n    <ul>\n        <li><strong>Example:</strong> Without my glasses, everything looks like a blur.</li>\n    </ul>\n    </li>\n    <li><strong>Dim</strong> (मंद): Not bright or clear; faint.\n    <ul>\n        <li><strong>Example:</strong> The room was lit by a dim lamp in the corner.</li>\n    </ul>\n    </li>\n    <li><strong>Fade</strong> (मुरझाना/धुंधला होना): To gradually lose brightness, color, or visibility.\n    <ul>\n        <li><strong>Example:</strong> The colors of the old painting have started to fade over time.</li>\n    </ul>\n    </li>\n</ul>35:T991,<p>The correct answer is: <b>Brave</b>.</p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p>\n\n<ul>\n    <li>The word <strong>\"Pusillanimous\"</strong> means showing a lack of courage or determination; timid. (कायर)</li>\n    <ul>\n        <li><strong>Example:</strong> His pusillanimous behavior prevented him from standing up to the bully.</li>\n    </ul>\n    <li><strong>\"Brave\ n</u></span></strong></span></p>\n\n<p>Here are the other options explained along with their Hindi meanings and example sentences:</p>\n\n<ul>\n    <li><strong>Plutocracy</strong> (धनतंत्र): A system of government in which the wealthy hold power.</li>\n    <ul>\n        <li><strong>Example:</strong> Some people criticize modern societies for moving towards plutocracy, where only the rich have influence.</li>\n    </ul>\n    <li><strong>Autocracy</strong> (स्वेच्छाचार): A system of government where one person has absolute power.</li>\n    <ul>\n        <li><strong>Example:</strong> The country was ruled by an autocracy until the people demanded democracy.</li>\n    </ul>\n    <li><strong>Aristocracy</strong> (अभिजात वर्ग): A form of government in which power is held by the nobility or elite class.</li>\n    <ul>\n        <li><strong>Example:</strong> In medieval Europe, aristocracy was the dominant form of government.</li>\n    </ul>\n</ul>3f:T447,<p style=\"color: rgb(33, 37, 41);\">BODMAS Table: </p>\n\n<p style=\"color: rgb(33, 37, 41);\"><img alt=\"\" src=\"https://cdn.repeatermock.com/tb/7751840ca1840d12cadc428f84d30e2cdcd5e7f82d52a57de21f2404c58eed88.png\" /></p>\n\n<p>Given equation: 7 × 3 ÷ 6 - 4 + 2 = ?</p>\n\n<p>Now, if<br />\n‘×’ stands for addition,<br />\n‘÷’ stands for subtraction,<br />\n‘+’ stands for multiplication, and<br />\n‘-’ stands for division, then:</p>\n\n<p>⇒ 7 + 3 - 6 ÷ 4 × 2 = ?</p>\n\n<p>⇒ 7 + 3 - (6 ÷ 4) × 2</p>\n\n<p>⇒ 7 + 3 - (1.5 × 2)</p>\n\n<p>⇒ 7 + 3 - 3</p>\n\n<p>⇒ 10 - 3</p>\n\n<p>⇒ 7</p>\n\n<p>Hence, the correct answer is<strong> \"Option 1\".</strong></p>", "marks": 2, "negMarks": 0.5}, {"text": "Choose the correct <strong>one-word substitute</strong> for: 'A system of government where priests rule in the name of God'.", "options": ["Plutocracy", "Theocracy", "Autocracy", "Aristocracy"], "correct": 2, "solution": "<p>The correct answer is: <b>Option 2 (Theocracy)</b>.</p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: an autocracy until the people demanded democracy.</li>\n    </ul>\n    <li><strong>Aristocracy</strong> (अभिजात वर्ग): A form of government in which power is held by the nobility or elite class.</li>\n    <ul>\n        <li><strong>Example:</strong> In medieval Europe, aristocracy was the dominant form of government.</li>\n    </ul>\n</ul>3f:T447,<p style=\"color: rgb(33, 37, 41);\">BODMAS Table: </p>\n\n<p style=\"color: rgb(33, 37, 41);\"><img alt=\"\" src=\"https://cdn.repeatermock.com/tb/7751840ca1840d12cadc428f84d30e2cdcd5e7f82d52a57de21f2404c58eed88.png\" /></p>\n\n<p>Given equation: 7 × 3 ÷ 6 - 4 + 2 = ?</p>\n\n<p>Now, if<br />\n‘×’ stands for addition,<br />\n‘÷’ stands for subtraction,<br />\n‘+’ stands for multiplication, and<br />\n‘-’ stands for division, then:</p>\n\n<p>⇒ 7 + 3 - 6 ÷ 4 × 2 = ?</p>\n\n<p>⇒ 7 + 3 - (6 ÷ 4) × 2</p>\n\n<p>⇒ 7 + 3 - (1.5 × 2)</p>\n\n<p>⇒ 7 + 3 - 3</p>\n\n<p>⇒ 10 - 3</p>\n\n<p>⇒ 7</p>\n\n<p>Hence, the correct answer is<strong> \"Option 1\".</strong></p>", "marks": 2, "negMarks": 0.5}, {"text": "Choose the correct <strong>one-word substitute</strong> for: 'A harmless, inert substance or pill prescribed more for psychological benefit than for any physiological effect'.", "options": ["Panacea", "Placebo", "Antidote", "Palliative"], "correct": 2, "solution": "<p>The correct answer is: <b>Placebo</b>.</p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong></span></p>\n\n<ul>\n    <li>The word <strong>\"Placebo\"</strong> refers to a harmless, inert substance or pill that is prescribed more for psychological benefits rather than for any actual physiological effect. (प्रभावहीन दवा)\n        <ul>\n            <li><strong>Example:</strong> The doctor gave the patient a placebo, and the patient reported feeling better even though the pill had no active ingredients.</li>\n        </ul>\n    </li>\n    <li><strong>Panacea</strong> means a solution or remedy for all difficulties or diseases. (रामबाण उपाय)\n        <ul>\n            <li><strong>Example:</strong> Many people believe that exercise is a panacea for all health issues.</li>\n        </ul>\n    </li>\n    <li>Hence, we can confirm that the correct one-word substitute for the given description is <strong>\"Placebo\"</strong>.</li>\n</ul>\n\n<p>Therefore, the correct answer is: <strong>Placebo</strong>.</p>\n\n<p><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /><strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong></span></p>\n\n<p>Here are the other options explained along with their Hindi meanings and example sentences:</p>\n\n<ul>\n    <li><strong>Panacea</strong> (<span style=\"color: rgb(33, 37, 41);\">रामबाण उपाय</span>): A remedy or solution for all difficulties or diseases.\n        <ul>\n            <li><strong>Example:</strong> There is no panacea for success; hard work is essential.</li>\n        </ul>\n    </li>\n    <li><strong>Antidote</strong> (<span style=\"color: rgb(33, 37, 41);\">विषहर</span>): A substance that counteracts poison or relieves an unpleasant feeling.\n        <ul>\n            <li><strong>Example:</strong> The doctor quickly administered an antidote to counteract the snake bite.</li>\n        </ul>\n    </li>\n    <li><strong>Palliative</strong> (<span style=\"color: rgb(33, 37, 41);\">आराम देने वाला</span>): Something that relieves pain or alleviates a problem without addressing its root cause.\n        <ul>\n            <li><strong>Example:</strong> The medicine provided palliative care to the patient with chronic pain.</li>\n        </ul>\n    </li>\n</ul>", "marks": 2, "negMarks": 0.5}, {"text": "What does the term “double burden” refer to in the context of urban Indian women?", "options": ["Dual employment", "Economic dependence and social isolation", "Gender-based violence at home", "Balancing job and household responsibilities"], "correct": 4, "solution": "<div><span style=\"\">The correct answer is '<strong>Option 4</strong>'.</span></div>\n\n<div> </div>\n\n<div><span style=\"\"><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /> <strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong> </span></span></div>\n\n<ul>\n\\t<li><strong><em><span style=\"\">A) Dual employment.</span></em></strong>\n\n\\t<ul>\n\\t\\t<li><span style=\"\">This is <strong>not correct</strong>. The passage does not describe the “double burden” as holding two jobs.</span></li>\n\\t</ul>\n\\t</li>\n\\t<li><strong><em><span style=\"\">B) Economic dependence and social isolation.</span></em></strong>\n\\t<ul>\n\\t\\t<li><span style=\"\">This is <strong>not correct</strong>. The passage does not equate the double burden with dependence or isolation.</span></li>\n\\t</ul>\n\\t</li>\n\\t<li><strong><em><span style=\"\">C) Gender-based violence at home.</span></em></strong>\n\\t<ul>\n\\t\\t<li><span style=\"\">This is <strong>not correct</strong>. The passage does not define the double burden in terms of violence.</span></li>\n\\t</ul>\n\\t</li>\n\\t<li><strong><em><span style=\"\">D) Balancing job and household responsibilities.</span></em></strong>\n\\t<ul>\n\\t\\t<li><span style=\"\">This is <strong>true</strong>. The passage explicitly states that urban Indian women, even when educated and employed, often face the “double burden” of juggling professional obligations with entrenched domestic responsibilities.</span></li>\n\\t</ul>\n\\t</li>\n</ul>\n\n<div>Therefore, the correct answer is <strong><span style=\"\">Option 4 (Balancing job and household responsibilities).</span></strong></div>\n\n<div> </div>\n\n<div><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /> <strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong> </span></div>\n\n<ul>\n\\t<li><span style=\"\"><strong>Option 1</strong>: Incorrect because dual employment is not mentioned in the passage.</span></li>\n\\t<li><span style=\"\"><strong>Option 2</strong>: Incorrect because the passage does not link the double burden to dependence or isolation.</span></li>\n\\t<li><span style=\"\"><strong>Option 3</strong>: Incorrect because gender-based violence is not described as the double burden.</span></li>\n\\t<li><span style=\"\"><strong>Option 4</strong>: Correct because the double burden refers to women balancing professional work with domestic duties.</span></li>\n</ul>", "marks": 2, "negMarks": 0.5}, {"text": "What contradiction is highlighted in gender progress in urban India?", "options": ["Women are excluded from legislation", "Women are unwilling to work", "Superficial autonomy masks persistent traditional roles", "Male literacy has declined"], "correct": 3, "solution": "<div><span style=\"\">The correct answer is '<strong>Option 3</strong>'.</span></div>\n\n<div> </div>\n\n<div><span style=\"\"><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /> <strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong> </span></span></div>\n\n<ul>\n\\t<li><strong><em><span style=\"\">A) Women are excluded from legislation.</span></em></strong>\n\n\\t<ul>\n\\t\\t<li><span style=\"\">This is <strong>not correct</strong>. The passage notes that constitutional provisions guarantee equality and policies include gender-sensitive measures, so women are not excluded from legislation.</span></li>\n\\t</ul>\n\\t</li>\n\\t<li><strong><em><span style=\"\">B) Women are unwilling to work.</span></em></strong>\n\\t<ul>\n\\t\\t<li><span style=\"\">This is <strong>not correct</strong>. The passage highlights women’s participation in the workforce, but emphasizes the challenges they face, not unwillingness to work.</span></li>\n\\t</ul>\n\\t</li>\n\\t<li><strong><em><span style=\"\">C) Superficial autonomy masks persistent traditional roles.</span></em></strong>\n\\t<ul>\n\\t\\t<li><span style=\"\">This is <strong>true</strong>. The passage explains that urban centers show surface-level liberalization in female workforce participation and autonomy, but these mask the ongoing traditional expectations and domestic responsibilities women face.</span></li>\n\\t</ul>\n\\t</li>\n\\t<li><strong><em><span style=\"\">D) Male literacy has declined.</span></em></strong>\n\\t<ul>\n\\t\\t<li><span style=\"\">This is <strong>not correct</strong>. The passage does not mention male literacy at all.</span></li>\n\\t</ul>\n\\t</li>\n</ul>\n\n<div>Therefore, the correct answer is <strong><span style=\"\">Option 3 (Superficial autonomy masks persistent traditional roles).</span></strong></div>\n\n<div> </div>\n\n<div><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /> <strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong> </span></div>\n\n<ul>\n\\t<li><span style=\"\"><strong>Option 1</strong>: Incorrect because legislation provides equality provisions.</span></li>\n\\t<li><span style=\"\"><strong>Option 2</strong>: Incorrect because women’s willingness to work is not questioned in the passage.</span></li>\n\\t<li><span style=\"\"><strong>Option 3</strong>: Correct because the passage highlights the contradiction of apparent progress masking persistent traditional roles.</span></li>\n\\t<li><span style=\"\"><strong>Option 4</strong>: Incorrect because male literacy is not discussed in the passage.</span></li>\n</ul>", "marks": 2, "negMarks": 0.5}, {"text": "What does the author suggest about masculinity in Indian society?", "options": ["It imposes restrictive roles on men as well", "It is more progressive than femininity", "It promotes emotional well-being", "Masculinity is biologically fixed"], "correct": 1, "solution": "<div><span style=\"\">The correct answer is '<strong>Option 1</strong>'.</span></div>\n\n<div> </div>\n\n<div><span style=\"\"><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /> <strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong> </span></span></div>\n\n<ul>\n\\t<li><strong><em><span style=\"\">A) It imposes restrictive roles on men as well.</span></em></strong>\n\n\\t<ul>\n\\t\\t<li><span style=\"\">This is <strong>true</strong>. The passage explains that masculinity in Indian society valorizes dominance, stoicism, and economic provisioning, which restrict men by stigmatizing emotional vulnerability and non-conformist identity expression.</span></li>\n\\t</ul>\n\\t</li>\n\\t<li><strong><em><span style=\"\">B) It is more progressive than femininity.</span></em></strong>\n\\t<ul>\n\\t\\t<li><span style=\"\">This is <strong>not correct</strong>. The passage does not suggest masculinity is more progressive; instead, it highlights its restrictive nature.</span></li>\n\\t</ul>\n\\t</li>\n\\t<li><strong><em><span style=\"\">C) It promotes emotional well-being.</span></em></strong>\n\\t<ul>\n\\t\\t<li><span style=\"\">This is <strong>not correct</strong>. The passage states the opposite—masculinity discourages emotional vulnerability and limits well-being.</span></li>\n\\t</ul>\n\\t</li>\n\\t<li><strong><em><span style=\"\">D) Masculinity is biologically fixed.</span></em></strong>\n\\t<ul>\n\\t\\t<li><span style=\"\">This is <strong>not correct</strong>. The passage treats masculinity as a cultural construct, not a biological inevitability.</span></li>\n\\t</ul>\n\\t</li>\n</ul>\n\n<div>Therefore, the correct answer is <strong><span style=\"\">Option 1 (It imposes restrictive roles on men as well).</span></strong></div>\n\n<div> </div>\n\n<div><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /> <strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong> </span></div>\n\n<ul>\n\\t<li><span style=\"\"><strong>Option 1</strong>: Correct because masculinity restricts men by stigmatizing emotional openness and non-conformity.</span></li>\n\\t<li><span style=\"\"><strong>Option 2</strong>: Incorrect because masculinity is not portrayed as progressive.</span></li>\n\\t<li><span style=\"\"><strong>Option 3</strong>: Incorrect because masculinity discourages emotional well-being.</span></li>\n\\t<li><span style=\"\"><strong>Option 4</strong>: Incorrect because masculinity is described as a cultural construct, not biologically fixed.</span></li>\n</ul>", "marks": 2, "negMarks": 0.5}, {"text": "According to the passage, what complicates gender oppression further for rural women?", "options": ["Access to internet", "Urban migration", "Intersection with caste and class", "Western education"], "correct": 3, "solution": "<div><span style=\"\">The correct answer is '<strong>Option 3</strong>'.</span></div>\n\n<div> </div>\n\n<div><span style=\"\"><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /> <strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong> </span></span></div>\n\n<ul>\n\\t<li><strong><em><span style=\"\">A) Access to internet.</span></em></strong>\n\n\\t<ul>\n\\t\\t<li><span style=\"\">This is <strong>not correct</strong>. The passage does not mention internet access as a complicating factor for rural women’s oppression.</span></li>\n\\t</ul>\n\\t</li>\n\\t<li><strong><em><span style=\"\">B) Urban migration.</span></em></strong>\n\\t<ul>\n\\t\\t<li><span style=\"\">This is <strong>not correct</strong>. The passage does not discuss urban migration in relation to rural women’s gender oppression.</span></li>\n\\t</ul>\n\\t</li>\n\\t<li><strong><em><span style=\"\">C) Intersection with caste and class.</span></em></strong>\n\\t<ul>\n\\t\\t<li><span style=\"\">This is <strong>true</strong>. The passage explicitly states that gender oppression in rural contexts is further complicated by intersections with caste, class, and religion, leaving some women doubly or triply marginalized.</span></li>\n\\t</ul>\n\\t</li>\n\\t<li><strong><em><span style=\"\">D) Western education.</span></em></strong>\n\\t<ul>\n\\t\\t<li><span style=\"\">This is <strong>not correct</strong>. The passage does not mention Western education as a factor complicating rural women’s oppression.</span></li>\n\\t</ul>\n\\t</li>\n</ul>\n\n<div>Therefore, the correct answer is <strong><span style=\"\">Option 3 (Intersection with caste and class).</span></strong></div>\n\n<div> </div>\n\n<div><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /> <strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong> </span></div>\n\n<ul>\n\\t<li><span style=\"\"><strong>Option 1</strong>: Incorrect because internet access is not mentioned in the passage.</span></li>\n\\t<li><span style=\"\"><strong>Option 2</strong>: Incorrect because urban migration is not discussed as a complicating factor.</span></li>\n\\t<li><span style=\"\"><strong>Option 3</strong>: Correct because caste, class, and religion intersect with gender oppression, making rural women more marginalized.</span></li>\n\\t<li><span style=\"\"><strong>Option 4</strong>: Incorrect because Western education is not referenced in the passage.</span></li>\n</ul>", "marks": 2, "negMarks": 0.5}, {"text": "What long-term solution does the author propose to resolve gender inequality?", "options": ["Stringent laws and penalties", "Reforming pedagogy and cultural values", "Promoting arranged marriages", "Expanding reservations for women"], "correct": 2, "solution": "<div><span style=\"\">The correct answer is '<strong>Option 2</strong>'.</span></div>\n\n<div> </div>\n\n<div><span style=\"\"><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/36f36cd5ece4186095afcf2ffbfb7b80cc04b6c2e3226e7477a419a9fbc96f85.png\" width=\"26px\" /> <strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Key Points</u></span></strong> </span></span></div>\n\n<ul>\n\\t<li><strong><em><span style=\"\">A) Stringent laws and penalties.</span></em></strong>\n\n\\t<ul>\n\\t\\t<li><span style=\"\">This is <strong>not correct</strong>. The passage notes that legislation alone cannot undo centuries of cultural indoctrination.</span></li>\n\\t</ul>\n\\t</li>\n\\t<li><strong><em><span style=\"\">B) Reforming pedagogy and cultural values.</span></em></strong>\n\\t<ul>\n\\t\\t<li><span style=\"\">This is <strong>true</strong>. The author emphasizes that dismantling gender essentialism from early childhood, promoting inclusive masculinities, and validating diverse gender expressions are key long-term solutions.</span></li>\n\\t</ul>\n\\t</li>\n\\t<li><strong><em><span style=\"\">C) Promoting arranged marriages.</span></em></strong>\n\\t<ul>\n\\t\\t<li><span style=\"\">This is <strong>not correct</strong>. The passage does not suggest arranged marriages as a solution to gender inequality.</span></li>\n\\t</ul>\n\\t</li>\n\\t<li><strong><em><span style=\"\">D) Expanding reservations for women.</span></em></strong>\n\\t<ul>\n\\t\\t<li><span style=\"\">This is <strong>not correct</strong>. While policies are mentioned, the author stresses deeper cultural and pedagogical transformation rather than reservations alone.</span></li>\n\\t</ul>\n\\t</li>\n</ul>\n\n<div>Therefore, the correct answer is <strong><span style=\"\">Option 2 (Reforming pedagogy and cultural values).</span></strong></div>\n\n<div> </div>\n\n<div><span style=\"display: flex;gap: 6px;align-items: center;\"><img height=\"26px\" src=\"https://cdn.repeatermock.com/tb/f13e2ad6582c16aa62a83672e2547ad20a01fddb61962a1acce42eb9a1a99caa.png\" width=\"26px\" /> <strong><span style=\"vertical-align: middle;font-size: 21px;\"><u>Additional Information</u></span></strong> </span></div>\n\n<ul>\n\\t<li><span style=\"\"><strong>Option 1</strong>: Incorrect because laws alone cannot dismantle entrenched cultural scripts.</span></li>\n\\t<li><span style=\"\"><strong>Option 2</strong>: Correct because the author proposes reforming pedagogy and cultural values as a long-term solution.</span></li>\n\\t<li><span style=\"\"><strong>Option 3</strong>: Incorrect because arranged marriages are not mentioned as a solution.</span></li>\n\\t<li><span style=\"\"><strong>Option 4</strong>: Incorrect because reservations are not emphasized as the transformative solution.</span></li>\n</ul>", "marks": 2, "negMarks": 0.5}];const ANALYSIS={"rank": 1937, "percentile": 6.743737957610785, "avgMarks": 110.92100192678228, "totalStudents": 2076};</script>

*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Inter',-apple-system,sans-serif;background:#f8f9fa;color:#1a1a2e;line-height:1.7}.container{max-width:800px;margin:0 auto;padding:16px}
.navbar{background:#1a1a2e;color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}.navbar .logo{font-weight:800;font-size:18px;color:#4ade80}.navbar .timer{font-size:18px;font-weight:700;color:#facc15}.navbar .nav-actions{display:flex;gap:12px;align-items:center}.submit-btn{background:#dc2626;color:#fff;border:0;padding:8px 20px;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px;display:none}.submit-btn.visible{display:inline-block}.view-solutions{background:#2563eb;color:#fff;border:0;padding:8px 20px;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px}
.test-header{background:#fff;border-radius:12px;padding:20px;margin:16px 0;box-shadow:0 1px 4px rgba(0,0,0,.06)}.test-header h1{font-size:22px;margin-bottom:8px}.badge{display:inline-block;background:#e0e7ff;color:#4338ca;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;margin-right:8px}
.score-banner{background:linear-gradient(135deg,#4338ca,#7c3aed);color:#fff;border-radius:12px;padding:24px;margin:16px 0;text-align:center;display:none}.score-banner.visible{display:block}.score-banner .score{font-size:48px;font-weight:800}.score-banner .score-label{font-size:14px;opacity:.9;margin-top:4px}
.analysis-card{background:#fff;border-radius:12px;padding:20px;margin:16px 0;box-shadow:0 1px 4px rgba(0,0,0,.06);display:none}.analysis-card.visible{display:block}.analysis-card h2{color:#4338ca;margin-bottom:16px}.analysis-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.stat{text-align:center;padding:16px;border-radius:10px;background:#f3f4f6}.stat .value{font-size:32px;font-weight:800}.stat .label{font-size:11px;color:#6b7280;text-transform:uppercase;margin-top:4px}.rank{color:#4338ca}.pct{color:#ec4899}.avg{color:#10b981}.total{color:#f59e0b}
.question-card{background:#fff;border-radius:12px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);overflow:hidden}.q-header{background:#f9fafb;padding:12px 20px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center}.q-number{font-weight:700;color:#4338ca;font-size:14px}.q-marks{font-size:12px;color:#6b7280}.pos{color:#10b981;font-weight:600}.neg{color:#ef4444}.q-body{padding:20px}.q-text{font-size:15px;margin-bottom:16px}.q-text p{margin-bottom:8px}.q-text img{max-width:100%;border-radius:8px;margin:8px 0;display:block}
.options{margin-left:4px}.option{display:flex;align-items:flex-start;padding:12px 16px;margin-bottom:8px;border-radius:10px;border:2px solid #e5e7eb;cursor:pointer;transition:all .15s}.option:hover{border-color:#c7d2fe;background:#f0f4ff}.option.selected{border-color:#4338ca;background:#eef2ff}.option.correct{border-color:#10b981;background:#d1fae5}.option.wrong{border-color:#ef4444;background:#fee2e2}.option-letter{font-weight:700;margin-right:12px;min-width:20px}.option.correct .option-letter{color:#059669}.option.wrong .option-letter{color:#dc2626}.option.selected .option-letter{color:#4338ca}.option-text{flex:1;font-size:14px}.option-text img{max-width:100%;border-radius:4px}.option-check{margin-left:auto;font-size:20px}.option.correct .option-check{color:#10b981}
.solution{margin-top:16px;padding:16px;background:#f0f9ff;border-radius:10px;border-left:4px solid #0ea5e9;display:none}.solution.visible{display:block}.solution-header{display:flex;align-items:center;gap:8px;margin-bottom:12px}.solution-icon{background:#0ea5e9;color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px}.solution-title{font-weight:700;color:#0ea5e9;font-size:14px}.solution-content{font-size:14px;color:#1e3a5f;line-height:1.8}.solution-content p{margin-bottom:8px}.solution-content img{max-width:100%;border-radius:8px;margin:8px 0;display:block}
.palette{position:fixed;right:20px;top:80px;background:#fff;border-radius:12px;padding:12px;box-shadow:0 4px 12px rgba(0,0,0,.1);z-index:50;max-width:200px}.palette-title{font-size:12px;color:#6b7280;margin-bottom:8px;text-transform:uppercase;font-weight:600}.palette-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}.palette-item{width:24px;height:24px;border-radius:6px;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;border:1px solid #d1d5db}.palette-item.answered{background:#10b981;color:#fff;border-color:#059669}
@media(max-width:768px){.palette{display:none}.analysis-grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<div class="navbar"><div class="logo">RepeaterMock</div><div class="nav-actions"><div class="timer" id="timer">⏱ 60:00</div><button class="submit-btn" id="submitBtn" onclick="submitTest()">Submit Test</button><button class="view-solutions" id="vsBtn" onclick="toggleSolutions()" style="display:none;">📖 Hide Solutions</button></div></div>
<div class="container"><div class="test-header"><h1>SSC CGL 2025 (Held On: 19 Sept, 2025 Shift 3)</h1><div style="font-size:14px;color:#6b7280"><span class="badge">📋 14 Q</span><span class="badge">⏱ 60 min</span><span class="badge">✅ Guest</span><span class="badge">💡 14 Sol</span></div></div>
<div class="score-banner" id="scoreBanner"><div class="score" id="scoreValue">0/14</div><div class="score-label" id="scoreLabel">Score</div></div>
<div class="analysis-card" id="analysisCard"><h2>📈 Analysis</h2><div class="analysis-grid" id="analysisGrid"></div></div>
<div id="questions"></div></div>
<div class="palette"><div class="palette-title">Palette</div><div class="palette-grid" id="palette"></div></div>
<script>
var totalQ=QUESTIONS.length,userAnswers={},submitted=false,timeLeft=3600,solsVisible=true;
var qC=document.getElementById('questions');
QUESTIONS.forEach(function(q,i){var o='';q.options.forEach(function(opt,oi){o+='<div class="option" data-option="'+(oi+1)+'" onclick="selectOption('+i+','+(oi+1)+')"><div class="option-letter">'+String.fromCharCode(65+oi)+'</div><div class="option-text">'+opt+'</div><div class="option-check"></div></div>'});var s='';if(q.solution&&q.solution.length>5){s='<div class="solution" id="sol'+i+'"><div class="solution-header"><div class="solution-icon">💡</div><div class="solution-title">Solution</div></div><div class="solution-content">'+q.solution+'</div></div>'}qC.innerHTML+='<div class="question-card" id="q'+i+'" data-correct="'+q.correct+'"><div class="q-header"><div class="q-number">Q'+(i+1)+'</div><div class="q-marks"><span class="pos">+'+q.marks+'</span> <span class="neg">-'+q.negMarks+'</span></div></div><div class="q-body"><div class="q-text">'+q.text+'</div><div class="options">'+o+'</div>'+s+'</div></div>'});
var pal=document.getElementById('palette');for(var i=0;i<totalQ;i++){var d=document.createElement('div');d.className='palette-item';d.id='p'+i;d.textContent=i+1;d.onclick=function(){document.getElementById('q'+this.id.slice(1)).scrollIntoView({behavior:'smooth'})};pal.appendChild(d)}
var tI=setInterval(function(){if(submitted){clearInterval(tI);return}timeLeft--;document.getElementById('timer').textContent='⏱ '+Math.floor(timeLeft/60)+':'+(timeLeft%60).toString().padStart(2,'0');if(timeLeft<=0){clearInterval(tI);submitTest()}},1000);
function selectOption(q,o){if(submitted)return;var c=document.getElementById('q'+q);c.querySelectorAll('.option').forEach(function(x){x.classList.remove('selected')});c.querySelector('.option[data-option="'+o+'"]').classList.add('selected');userAnswers[q]=o;document.getElementById('p'+q).classList.add('answered');document.getElementById('submitBtn').classList.add('visible')}
function submitTest(){if(submitted)return;submitted=true;clearInterval(tI);var sc=0,co=0,at=0;for(var i=0;i<totalQ;i++){var q=document.getElementById('q'+i),c=parseInt(q.dataset.correct),u=userAnswers[i];q.querySelectorAll('.option').forEach(function(o){var n=parseInt(o.dataset.option);o.onclick=null;if(n===c){o.classList.add('correct');o.querySelector('.option-check').textContent='✓'}else if(n===u){o.classList.add('wrong');o.querySelector('.option-check').textContent='✗'}});if(u){at++;if(u===c){sc+=2;co++}else{sc-=0.5}}var s=document.getElementById('sol'+i);if(s)s.classList.add('visible')}document.getElementById('scoreValue').textContent=co+'/'+totalQ;document.getElementById('scoreLabel').textContent='Score: '+sc+' | Correct: '+co+' | Wrong: '+(at-co);document.getElementById('scoreBanner').classList.add('visible');if(ANALYSIS&&ANALYSIS.rank){document.getElementById('analysisGrid').innerHTML='<div class="stat"><div class="value rank">'+ANALYSIS.rank+'</div><div class="label">Rank</div></div><div class="stat"><div class="value pct">'+(ANALYSIS.percentile?ANALYSIS.percentile.toFixed(2)+'%':'N/A')+'</div><div class="label">Percentile</div></div><div class="stat"><div class="value avg">'+(ANALYSIS.avgMarks?ANALYSIS.avgMarks.toFixed(2):'N/A')+'</div><div class="label">Avg</div></div><div class="stat"><div class="value total">'+(ANALYSIS.totalStudents||'N/A')+'</div><div class="label">Students</div></div>';document.getElementById('analysisCard').classList.add('visible')}document.getElementById('submitBtn').style.display='none';document.getElementById('vsBtn').style.display='inline-block';if(window.MathJax&&window.MathJax.typesetPromise)window.MathJax.typesetPromise();document.getElementById('scoreBanner').scrollIntoView({behavior:'smooth'})}
function toggleSolutions(){solsVisible=!solsVisible;document.querySelectorAll('.solution').forEach(function(s){if(solsVisible)s.classList.add('visible');else s.classList.remove('visible')});document.getElementById('vsBtn').textContent=solsVisible?'📖 Hide Solutions':'📖 Show Solutions'}
setTimeout(function(){if(window.MathJax&&window.MathJax.typesetPromise)window.MathJax.typesetPromise()},2000);
</script></body></html>
